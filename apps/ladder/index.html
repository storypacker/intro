<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>동물 사다리타기</title>
<meta name="description" content="2~12명이 귀여운 동물 친구를 골라 사다리를 타요. 누가 무엇에 당첨될까요?">
<link rel="canonical" href="https://www.storypacker.com/apps/compat/index.html">
<meta property="og:type" content="website">
<meta property="og:site_name" content="스토리팩커 Storypacker">
<meta property="og:title" content="동물 사다리타기">
<meta property="og:description" content="2~12명이 귀여운 동물 친구를 골라 사다리를 타요. 누가 무엇에 당첨될까요?">
<meta property="og:url" content="https://www.storypacker.com/apps/compat/index.html">
<meta property="og:image" content="https://www.storypacker.com/apps/compat/share.jpg">
<meta property="og:image:width" content="800">
<meta property="og:image:height" content="800">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="동물 사다리타기">
<meta name="twitter:description" content="2~12명이 귀여운 동물 친구를 골라 사다리를 타요. 누가 무엇에 당첨될까요?">
<meta name="twitter:image" content="https://www.storypacker.com/apps/compat/share.jpg">
<script src="https://t1.kakaocdn.net/kakao_js_sdk/2.8.4/kakao.min.js" crossorigin="anonymous"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{
  /* 하늘빛 놀이터 위에 흰 카드, 나무색 사다리, 캐릭터 그림의 노란 반짝이를 강조색으로 */
  --bg:#E3F1F6;
  --surface:#FFFFFF;
  --ink:#3B2F29;
  --muted:#7A6C64;
  --line:#DCCFC3;
  --rail:#B9A28C;
  --accent:#FFC23D;
  --accent-deep:#E9A400;
  --soft:#F5EEE6;
  --err:#D23F3F;
  --display:'Jua','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --body:'Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg);
  background-image:radial-gradient(rgba(255,255,255,.7) 1.5px, transparent 1.6px);
  background-size:22px 22px;
  color:var(--ink);
  font-family:var(--body);
  font-size:16px;
  line-height:1.5;
}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed}
:focus-visible{outline:3px solid #2F7FC1;outline-offset:2px;border-radius:10px}
.wrap{max-width:1120px;margin:0 auto;padding:20px 16px 48px;display:flex;flex-direction:column;gap:18px}

/* 헤더 */
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.top .faces{display:flex}
.top .faces img{width:44px;height:44px;margin-right:-10px;filter:drop-shadow(0 2px 2px rgba(59,47,41,.15))}
.top h1{font-family:var(--display);font-weight:400;font-size:clamp(28px,4vw,38px);margin:0 0 0 14px;line-height:1.1;text-wrap:balance}
.top p{margin:0;color:var(--muted);flex-basis:100%}
@media (max-width:420px){.top .faces img:nth-child(n+4){display:none}}
@media (max-width:520px){.top{position:relative;padding-right:80px}.top .share{position:absolute;right:0;top:6px}}

/* 공유 */
.share{margin-left:auto;position:relative}
.share-btn{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px 5px 10px;display:inline-flex;align-items:center;gap:5px;font-family:var(--display);font-size:14px;color:var(--ink);box-shadow:0 2px 0 var(--line)}
.share-btn:hover{border-color:var(--rail)}
.share-btn svg{width:16px;height:16px}
.share-menu{position:absolute;right:0;top:calc(100% + 8px);width:210px;background:var(--surface);border-radius:18px;padding:8px;box-shadow:0 2px 0 var(--line),0 14px 40px rgba(59,47,41,.18);z-index:30;display:flex;flex-direction:column;gap:2px;animation:rise .18s ease-out}
.share-menu a,.share-menu button{display:flex;align-items:center;gap:10px;width:100%;border:none;background:none;border-radius:12px;padding:7px 8px;text-decoration:none;color:var(--ink);font-size:15px;text-align:left}
.share-menu a:hover,.share-menu button:hover{background:var(--soft)}
.ico{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:15px;color:#fff}
.ico svg{width:18px;height:18px}
.ico.kakao{background:#FEE500;color:#191919}
.ico.insta{background:radial-gradient(circle at 30% 107%,#fdf497 0%,#fdf497 5%,#fd5949 45%,#d6249f 60%,#285AEB 90%)}
.ico.fb{background:#1877F2;font-family:Arial,sans-serif;font-size:19px}
.ico.x{background:#111;font-family:Arial,sans-serif}
.ico.link{background:var(--soft);color:var(--ink)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:15px;z-index:40;max-width:calc(100% - 32px);text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.2)}

/* 광고 & 출처 */
.ad-wrap{display:flex;flex-direction:column;gap:4px}
.ad-label{font-size:11px;color:var(--muted);letter-spacing:.05em}
.ad-slot{min-height:100px;width:100%;overflow:hidden}
ins.adsbygoogle[data-ad-status="unfilled"]{display:none !important}
.more-apps{display:flex;justify-content:center}
.more-apps a{display:inline-flex;align-items:center;gap:8px;padding:11px 20px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:.95rem;font-weight:500;text-decoration:none;transition:border-color .2s, background .2s}
.more-apps a:hover{border-color:var(--ink)}
.more-apps a:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.more-apps svg{width:16px;height:16px;flex:none}
.credit{text-align:center;font-size:12px;color:var(--muted);margin-top:-6px}
.credit a{color:inherit;text-decoration:none}
.credit a:hover{text-decoration:underline}

.panel{background:var(--surface);border-radius:22px;padding:20px;box-shadow:0 2px 0 var(--line),0 10px 30px rgba(59,47,41,.06)}
.panel h2{font-family:var(--display);font-weight:400;font-size:22px;margin:0;display:flex;align-items:center;gap:8px}
.panel h2 small{font-family:var(--body);font-size:14px;color:var(--muted)}
[hidden]{display:none !important}

/* 버튼 */
.btn{border:2px solid var(--ink);background:var(--surface);border-radius:999px;padding:8px 16px;font-family:var(--display);font-size:16px;line-height:1.2;display:inline-flex;align-items:center;gap:6px;box-shadow:0 3px 0 var(--ink);transition:transform .08s, box-shadow .08s}
.btn:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 4px 0 var(--ink)}
.btn:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.btn:disabled{opacity:.4;box-shadow:none}
.btn.primary{background:var(--accent);font-size:19px;padding:10px 24px}
.btn.ghost{border-color:var(--line);box-shadow:0 3px 0 var(--line);color:var(--muted)}
.btn.small{font-size:14px;padding:5px 12px;box-shadow:0 2px 0 var(--ink)}
.btn.ghost.small{box-shadow:0 2px 0 var(--line)}

/* 설정 */
.setup-grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:22px;margin-top:14px}
@media (max-width:760px){.setup-grid{grid-template-columns:minmax(0,1fr)}}
@media (max-width:420px){.avatar-btn .ch{min-width:0}.prow{gap:6px}.panel{padding:16px}}
.col-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px;min-height:40px}
.col-head h3{font-family:var(--display);font-weight:400;font-size:18px;margin:0}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:36px;height:36px;border-radius:50%;border:2px solid var(--ink);background:var(--surface);font-family:var(--display);font-size:20px;line-height:1;box-shadow:0 2px 0 var(--ink)}
.stepper button:disabled{opacity:.3;box-shadow:none}
.stepper output{font-family:var(--display);font-size:22px;min-width:64px;text-align:center;font-variant-numeric:tabular-nums}
.list{display:flex;flex-direction:column;gap:8px}
.prow,.rrow{display:flex;align-items:center;gap:8px;background:var(--soft);border-radius:16px;padding:6px 8px 6px 6px}
.num{flex:none;width:26px;height:26px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-family:var(--display);font-size:14px;color:var(--muted)}
.avatar-btn{flex:none;display:flex;align-items:center;gap:4px;border:2px dashed transparent;background:var(--surface);border-radius:14px;padding:2px 10px 2px 2px}
.avatar-btn:hover{border-color:var(--rail)}
.avatar-btn img{width:44px;height:44px}
.avatar-btn .ch{font-family:var(--display);font-size:14px;min-width:3.2em;text-align:left}
.avatar-btn .chev{font-size:11px;color:var(--muted)}
.prow input,.rrow input{flex:1;min-width:0;border:2px solid transparent;background:var(--surface);border-radius:12px;padding:9px 12px}
.prow input:focus,.rrow input:focus{outline:none;border-color:var(--accent-deep)}
input.err{border-color:var(--err) !important;background:#FFF3F2}
.del{flex:none;width:30px;height:30px;border-radius:50%;border:none;background:transparent;color:var(--muted);font-size:20px;line-height:1}
.del:hover:not(:disabled){background:var(--surface);color:var(--err)}
.del:disabled{opacity:0}
.rrow .num{background:var(--accent);color:var(--ink)}
.quick{display:flex;gap:6px;flex-wrap:wrap}
.setup-foot{display:flex;align-items:center;justify-content:flex-end;gap:14px;flex-wrap:wrap;margin-top:18px;padding-top:16px;border-top:2px dashed var(--line)}
.msg{color:var(--err);margin-right:auto;min-height:1.5em}
.hint{color:var(--muted);font-size:14px;margin:10px 0 0}

/* 게임판 */
.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.toolbar .spacer{flex:1}
.status{margin:12px 0 4px;color:var(--muted);min-height:1.5em}
.status b{color:var(--ink);font-weight:400;font-family:var(--display)}
.board-scroll{overflow-x:auto;overflow-y:visible;padding:8px 4px 4px}
.board{margin:0 auto;position:relative}
.heads,.foots{display:grid}
.head{border:none;background:none;padding:4px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
.head img{width:var(--av,54px);height:var(--av,54px);filter:drop-shadow(0 3px 2px rgba(59,47,41,.18));transition:transform .2s}
.head .nm{font-family:var(--display);font-size:15px;line-height:1.2;text-align:center;overflow-wrap:anywhere;max-width:100%;padding:0 2px;border-bottom:4px solid transparent}
.head.on .nm{border-bottom-color:var(--c)}
.head.active img{animation:bob .5s ease-in-out infinite alternate}
.head.gone img{opacity:.35}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-6px)}}
svg.ladder{display:block;overflow:visible}
.rail{stroke:var(--rail);stroke-width:5;stroke-linecap:round}
.trail{fill:none;stroke-width:7;stroke-linecap:round;stroke-linejoin:round;transition:opacity .25s}
.trail.dim{opacity:.22}
.token{filter:drop-shadow(0 3px 3px rgba(59,47,41,.3))}
.foot{border:none;background:none;padding:10px 3px 0;display:flex;flex-direction:column;align-items:center;gap:6px}
.foot .res{width:100%;min-height:46px;display:grid;place-items:center;background:var(--surface);border:2.5px solid var(--line);border-radius:12px;padding:6px 4px;font-family:var(--display);font-size:15px;line-height:1.2;overflow-wrap:anywhere;text-align:center;transition:border-color .2s, background .2s, transform .2s}
.foot.hit .res{border-color:var(--c);background:color-mix(in srgb, var(--c) 12%, white);transform:scale(1.04)}
.foot .who{min-height:56px;display:flex;flex-direction:column;align-items:center;font-size:13px;line-height:1.2;text-align:center;overflow-wrap:anywhere}
.foot .who img{width:32px;height:32px;animation:pop .35s ease-out}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}

/* 누적 기록 */
.hist-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.hist-head .spacer{flex:1}
.empty{color:var(--muted);margin:12px 0 0}
.agg-scroll{overflow-x:auto;margin-top:14px}
table.agg{border-collapse:separate;border-spacing:0;min-width:100%;font-variant-numeric:tabular-nums}
.agg th,.agg td{padding:8px 12px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}
.agg thead th{font-family:var(--display);font-weight:400;font-size:15px;background:var(--soft);position:sticky;top:0}
.agg thead th:first-child{border-radius:12px 0 0 12px;text-align:left}
.agg thead th:last-child{border-radius:0 12px 12px 0}
.agg td:first-child{text-align:left}
.agg .person{display:flex;align-items:center;gap:6px}
.agg .person img{width:30px;height:30px}
.agg td.zero{color:#C9BDB2}
.agg td.cnt{font-family:var(--display);font-size:17px}
.agg td.total{color:var(--muted)}
.rounds{list-style:none;margin:16px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.round{background:var(--soft);border-radius:14px;padding:10px 12px;display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}
.round .rt{font-family:var(--display);flex:none;min-width:84px}
.round .rt small{display:block;font-family:var(--body);color:var(--muted);font-size:12px}
.round .pairs{display:flex;flex-wrap:wrap;gap:6px;flex:1}
.pair{display:inline-flex;align-items:center;gap:4px;background:var(--surface);border-radius:999px;padding:2px 10px 2px 2px;font-size:14px}
.pair img{width:24px;height:24px}
.pair b{font-weight:400;font-family:var(--display)}
.more{margin-top:8px}

/* 모달 */
.modal{position:fixed;inset:0;background:rgba(43,34,29,.45);display:grid;place-items:center;padding:16px;z-index:20}
.sheet{background:var(--surface);border-radius:24px;padding:22px;width:min(520px,100%);max-height:calc(100% - 32px);overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.25);animation:rise .3s ease-out}
@keyframes rise{from{transform:translateY(16px) scale(.97);opacity:0}to{transform:none;opacity:1}}
.sheet h2{font-family:var(--display);font-weight:400;font-size:26px;margin:0 0 4px;text-align:center}
.sheet .sub{text-align:center;color:var(--muted);margin:0 0 14px}
.res-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.res-list li{display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:10px;padding:6px 10px 6px 6px;border-radius:14px;background:var(--soft)}
.res-list img{width:44px;height:44px}
.res-list .n{font-family:var(--display);font-size:17px;overflow-wrap:anywhere}
.res-list .n small{display:block;font-family:var(--body);font-size:12px;color:var(--muted)}
.res-list .r{font-family:var(--display);font-size:17px;background:var(--surface);border:2.5px solid var(--c);border-radius:999px;padding:4px 14px;max-width:12em;text-align:center;overflow-wrap:anywhere}
.sheet-actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.copied{text-align:center;color:var(--muted);font-size:14px;min-height:1.4em;margin:8px 0 0}

.picker-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:6px}
@media (max-width:420px){.picker-grid{grid-template-columns:repeat(3,1fr)}}
.pick{border:2.5px solid transparent;background:var(--soft);border-radius:16px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-family:var(--display);font-size:15px;position:relative}
.pick img{width:64px;height:64px}
.pick:hover:not(:disabled){border-color:var(--rail)}
.pick.cur{border-color:var(--accent-deep);background:#FFF6DD}
.pick:disabled img{filter:grayscale(1);opacity:.35}
.pick:disabled{color:var(--muted)}
.pick .owner{font-family:var(--body);font-size:11px;color:var(--muted);min-height:1.2em;overflow-wrap:anywhere}

@media (prefers-reduced-motion:reduce){
  *{animation:none !important;transition:none !important}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="faces" aria-hidden="true" id="faces"></div>
    <h1>동물 사다리타기</h1>
    <div class="share">
      <button type="button" class="share-btn" id="shareBtn" aria-haspopup="true" aria-expanded="false" aria-controls="shareMenu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg>공유
      </button>
      <div class="share-menu" id="shareMenu" hidden>
        <button type="button" id="shKakao"><span class="ico kakao"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#191919" d="M12 4C7 4 3 7.1 3 11c0 2.5 1.7 4.7 4.2 6l-.9 3.4c-.1.3.3.6.6.4l4-2.7c.4 0 .7.1 1.1.1 5 0 9-3.1 9-7S17 4 12 4z"/></svg></span>카카오톡</button>
        <a id="shInsta" href="https://www.instagram.com/" target="_blank" rel="noopener"><span class="ico insta"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.2" cy="6.8" r="1" fill="#fff" stroke="none"/></svg></span>인스타그램</a>
        <a id="shFb" href="#" target="_blank" rel="noopener"><span class="ico fb">f</span>페이스북</a>
        <a id="shX" href="#" target="_blank" rel="noopener"><span class="ico x">𝕏</span>X</a>
        <button type="button" id="shCopy"><span class="ico link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M10 14a4.5 4.5 0 0 0 6.4 0l3-3a4.5 4.5 0 0 0-6.4-6.4l-1.2 1.2"/><path d="M14 10a4.5 4.5 0 0 0-6.4 0l-3 3a4.5 4.5 0 0 0 6.4 6.4l1.2-1.2"/></svg></span>링크 복사</button>
      </div>
    </div>
    <p>2~12명이 동물 친구를 골라 사다리를 타요.</p>
  </header>

  <!-- 설정 -->
  <section class="panel" id="setup" aria-labelledby="setup-title">
    <h2 id="setup-title">참가자와 결과 정하기</h2>
    <div class="setup-grid">
      <div>
        <div class="col-head">
          <h3>참가자</h3>
          <div class="stepper" role="group" aria-label="참가 인원">
            <button type="button" id="minus" aria-label="한 명 빼기">−</button>
            <output id="count" aria-live="polite">4명</output>
            <button type="button" id="plus" aria-label="한 명 더하기">+</button>
          </div>
        </div>
        <div class="list" id="players"></div>
        <p class="hint">동물을 눌러 캐릭터를 바꿀 수 있어요. 이미 다른 사람이 고른 동물은 고를 수 없어요. 이름을 비워 두면 동물 이름으로 나와요.</p>
      </div>
      <div>
        <div class="col-head">
          <h3>결과</h3>
          <div class="quick">
            <button type="button" class="btn ghost small" id="qWin">당첨 1개 + 꽝</button>
            <button type="button" class="btn ghost small" id="qRank">1등, 2등, 3등…</button>
            <button type="button" class="btn ghost small" id="qClear">비우기</button>
          </div>
        </div>
        <div class="list" id="results"></div>
      </div>
    </div>
    <div class="setup-foot">
      <span class="msg" id="setupMsg" role="alert"></span>
      <button type="button" class="btn primary" id="readyBtn">준비</button>
    </div>
  </section>

  <!-- 게임판 -->
  <section class="panel" id="game" hidden aria-labelledby="game-title">
    <div class="toolbar">
      <h2 id="game-title"><span id="roundTitle">사다리</span></h2>
      <span class="spacer"></span>
      <button type="button" class="btn ghost small" id="backBtn">설정 바꾸기</button>
      <button type="button" class="btn small" id="shuffleBtn">사다리 다시 섞기</button>

const CHARS = [['lion','사자'],['tiger','호랑이'],['bear','곰'],['fox','여우'],['raccoon','너구리'],['ox','황소'],['cat','고양이'],['eagle','독수리'],['hippo','하마'],['dragon','용'],['rabbit','토끼'],['deer','사슴']].map(([id,ko])=>({id,ko}));
const KO = Object.fromEntries(CHARS.map(c=>[c.id,c.ko]));
const COLORS = ['#E5484D','#3E63DD','#2E9E5B','#A64FC9','#F76B15','#12A594','#D6409F','#7FA013','#6E56CF','#D29A00','#1F9BCF','#8D5B3A'];
const MIN = 2, MAX = 12;
const SPEEDS = [{label:'보통',v:340},{label:'빠르게',v:800},{label:'아주 빠르게',v:2000}];
const STORE = 'animal-ladder.v1';

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const NS = 'http://www.w3.org/2000/svg';
const mk = (tag, attrs={}) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); return e; };
const wait = ms => new Promise(r => setTimeout(r, ms));
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

function defaults(){
  return { players:[0,1,2,3].map(i=>({char:CHARS[i].id, name:''})), results:['','','',''], speed: reduced ? 2 : 0 };
}
let S = defaults();
let history = [];
try {
  const raw = JSON.parse(localStorage.getItem(STORE) || 'null');
  if (raw && Array.isArray(raw.players) && Array.isArray(raw.results) && raw.players.length === raw.results.length &&
      raw.players.length >= MIN && raw.players.length <= MAX &&
      raw.players.every(p => KO[p.char]) && new Set(raw.players.map(p=>p.char)).size === raw.players.length) {
    S = { players: raw.players.map(p=>({char:p.char, name:String(p.name||'').slice(0,10)})), results: raw.results.map(r=>String(r||'').slice(0,16)), speed: [0,1,2].includes(raw.speed) ? raw.speed : 0 };
  }
  if (raw && Array.isArray(raw.history)) history = raw.history.filter(h => h && Array.isArray(h.entries));
} catch(e) {}
function save(){ try { localStorage.setItem(STORE, JSON.stringify({...S, history})); } catch(e) {} }

const dispName = p => (p.name || '').trim() || KO[p.char];

/* ---------- 설정 화면 ---------- */
$('faces').innerHTML = ['lion','rabbit','tiger','fox','bear'].map(id=>`<img src="${IMG[id]}" alt="">`).join('');

  $('count').textContent = n + '명';
  $('minus').disabled = n <= MIN;

  S.players.forEach((p, i) => {

    row.className = 'prow';
    row.innerHTML = `<span class="num">${i+1}</span>

}

/* ---------- 사다리 ---------- */
const game = { phase:'setup', rungs:[], matches:{}, runToken:0, skip:false, focus:null, colW:100, H:360 };

function newLadder(){
  const n = S.players.length, rungs = [], sep = 0.075;
  for (let g = 0; g < n-1; g++) {
    const want = n === 2 ? 4 + Math.floor(Math.random()*3) : 3 + Math.floor(Math.random()*3);
    let placed = 0, tries = 0;
    while (placed < want && tries < 400) {
      tries++;
      const y = 0.08 + Math.random()*0.84;
      if (rungs.some(r => Math.abs(r.gap - g) <= 1 && Math.abs(r.y - y) < sep)) continue;
      rungs.push({gap:g, y}); placed++;
    }
  }
  game.rungs = rungs;
  game.matches = {};
  game.focus = null;
  game.phase = 'ready';
  game.runToken++;
}
function trace(start){
  let col = start, y = -1;
  const pts = [[col, 0]];
  for (;;) {
    let best = null;
    for (const r of game.rungs) if ((r.gap === col || r.gap === col-1) && r.y > y && (!best || r.y < best.y)) best = r;
    if (!best) { pts.push([col, 1]); break; }
    pts.push([col, best.y]);
    col = best.gap === col ? col + 1 : col - 1;
    pts.push([col, best.y]);
    y = best.y;
  }
  return { pts, end: col };
}
const X = c => (c + 0.5) * game.colW;
const Y = y => y * game.H;
const toD = pts => pts.map((p, k) => (k ? 'L' : 'M') + X(p[0]).toFixed(1) + ' ' + Y(p[1]).toFixed(1)).join(' ');

function renderBoard(){
  const n = S.players.length;
  const avail = $('boardScroll').clientWidth - 8;
  game.colW = Math.max(70, Math.min(136, Math.floor(avail / n)));
  game.H = Math.round(Math.max(280, Math.min(420, window.innerHeight * 0.45)));
  const W = n * game.colW;
  $('board').style.width = W + 'px';
  $('board').style.setProperty('--av', (game.colW < 86 ? 42 : 54) + 'px');
  for (const id of ['heads','foots']) $(id).style.gridTemplateColumns = `repeat(${n}, ${game.colW}px)`;

  $('heads').innerHTML = S.players.map((p, i) =>
    `<button type="button" class="head" data-i="${i}" style="--c:${COLORS[i]}" aria-label="${esc(dispName(p))}, ${KO[p.char]}"><img src="${IMG[p.char]}" alt=""><span class="nm">${esc(dispName(p))}</span></button>`).join('');
  $('foots').innerHTML = S.results.map((r, c) =>
    `<button type="button" class="foot" data-c="${c}"><span class="res">${esc(r.trim())}</span><span class="who"></span></button>`).join('');

  const svg = $('svg');
  svg.setAttribute('viewBox', `0 0 ${W} ${game.H}`);
  svg.setAttribute('width', W); svg.setAttribute('height', game.H);
  const gR = $('gRails'); gR.innerHTML = '';
  for (let c = 0; c < n; c++) gR.appendChild(mk('line', {class:'rail', x1:X(c), y1:0, x2:X(c), y2:game.H}));
  for (const r of game.rungs) gR.appendChild(mk('line', {class:'rail', x1:X(r.gap), y1:Y(r.y), x2:X(r.gap+1), y2:Y(r.y)}));
  $('gTrails').innerHTML = ''; $('gTokens').innerHTML = '';

  for (const i in game.matches) { drawTrail(+i, true); markArrival(+i, game.matches[i]); }
  applyFocus();
  syncUI();
}
function drawTrail(i, full){
  const { pts } = trace(i);
  const p = mk('path', {class:'trail', d:toD(pts), stroke:COLORS[i], 'data-i':i});
  $('gTrails').appendChild(p);
  return p;
}
function markArrival(i, col){
  const p = S.players[i];
  const head = $('heads').children[i], foot = $('foots').children[col];
  head.classList.add('on'); head.classList.remove('active');
  foot.classList.add('hit'); foot.style.setProperty('--c', COLORS[i]);
  foot.querySelector('.who').innerHTML = `<img src="${IMG[p.char]}" alt=""><span>${esc(dispName(p))}</span>`;
}
function applyFocus(){
  const f = game.focus;
  document.querySelectorAll('#gTrails .trail').forEach(t => t.classList.toggle('dim', f !== null && +t.dataset.i !== f));
}

function runOne(i, token){
  return new Promise(resolve => {
    const { end } = trace(i);
    document.querySelectorAll('#gTrails .trail').forEach(t => t.classList.add('dim'));
    const path = drawTrail(i);
    const L = path.getTotalLength();
    path.style.strokeDasharray = L; path.style.strokeDashoffset = L;
    const size = game.colW < 86 ? 38 : 46;
    const tk = mk('image', {class:'token', width:size, height:size});
    tk.setAttribute('href', IMG[S.players[i].char]);
    $('gTokens').appendChild(tk);
    const head = $('heads').children[i];
    head.classList.add('active', 'gone');
    let dist = 0, last = null;
    const step = t => {
      if (token !== game.runToken) { tk.remove(); return resolve(false); }
      if (last === null) last = t;
      const dt = Math.min(0.05, (t - last) / 1000); last = t;
      dist = game.skip ? L : Math.min(L, dist + SPEEDS[S.speed].v * dt);
      path.style.strokeDashoffset = L - dist;
      const pt = path.getPointAtLength(dist);
      tk.setAttribute('x', pt.x - size/2); tk.setAttribute('y', pt.y - size/2);
      const sc = $('boardScroll');
      if (sc.scrollWidth > sc.clientWidth && (pt.x < sc.scrollLeft + 50 || pt.x > sc.scrollLeft + sc.clientWidth - 50)) sc.scrollLeft = pt.x - sc.clientWidth / 2;
      if (dist >= L) {
        tk.remove(); head.classList.remove('gone');
        path.style.strokeDasharray = ''; path.style.strokeDashoffset = '';
        game.matches[i] = end;
        markArrival(i, end);
        resolve(true);
      } else requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  });
}

async function startGame(){
  if (game.phase !== 'ready') return;
  game.phase = 'running'; game.skip = false; game.focus = null; game.matches = {};
  const token = ++game.runToken;
  renderBoard();
  const n = S.players.length;
  for (let i = 0; i < n; i++) {
    setStatus(`<b>${i+1}/${n}</b> · ${esc(KO[S.players[i].char])} <b>${esc(dispName(S.players[i]))}</b> 내려가는 중…`);
    const ok = await runOne(i, token);
    if (!ok) return;
    if (!game.skip && i < n-1) await wait(320);
    if (token !== game.runToken) return;
  }
  game.phase = 'done';
  applyFocus();
  recordRound();
  syncUI();
  openResult();
}

function setStatus(html){ $('status').innerHTML = html; }
function syncUI(){
  const ph = game.phase;
  $('startBtn').hidden = ph !== 'ready';
  $('skipBtn').hidden = ph !== 'running';
  $('showBtn').hidden = ph !== 'done';
  $('backBtn').disabled = ph === 'running';
  $('shuffleBtn').disabled = ph === 'running';
  $('shuffleBtn').textContent = ph === 'done' ? '새 사다리로 한 판 더' : '사다리 다시 섞기';
  $('speedBtn').textContent = '속도: ' + SPEEDS[S.speed].label;
  $('roundTitle').textContent = `${history.length + (ph === 'done' ? 0 : 1)}번째 판`;
  if (ph === 'ready') setStatus(`사다리가 준비됐어요. <b>시작</b>을 누르면 맨 왼쪽부터 한 명씩 내려가요.`);
  if (ph === 'done') setStatus(`모든 매칭이 끝났어요. 위쪽 이름이나 아래쪽 결과를 누르면 그 길만 진하게 보여요.`);
}

let showAllRounds = false, clearArmed = false;
function renderHistory(){
  const B = $('histBody');
  $('histCount').textContent = history.length ? `총 ${history.length}판` : '';
  $('clearHist').hidden = !history.length;
  if (!history.length) {
    B.innerHTML = `<p class="empty">아직 기록이 없어요. 한 판이 끝날 때마다 사람별로 어떤 결과가 몇 번 나왔는지 여기에 쌓여요.</p>`;
    return;
  }
  const people = new Map(), cols = [];
  for (const h of history) for (const e of h.entries) {
    if (!cols.includes(e.result)) cols.push(e.result);
    const key = e.char + '|' + e.name;
    if (!people.has(key)) people.set(key, { char:e.char, name:e.name, total:0, counts:{} });
    const p = people.get(key); p.total++; p.counts[e.result] = (p.counts[e.result] || 0) + 1;
  }
  const rows = [...people.values()].sort((a, b) => b.total - a.total);
  let html = `<div class="agg-scroll"><table class="agg"><thead><tr><th scope="col">참가자</th>${cols.map(c => `<th scope="col">${esc(c)}</th>`).join('')}<th scope="col">참여</th></tr></thead><tbody>`;
  for (const p of rows) {
    html += `<tr><th scope="row" style="font-weight:400"><span class="person"><img src="${IMG[p.char]}" alt="${KO[p.char]}">${esc(p.name)}</span></th>`
      + cols.map(c => p.counts[c] ? `<td class="cnt">${p.counts[c]}</td>` : `<td class="zero">0</td>`).join('')
      + `<td class="total">${p.total}판</td></tr>`;
  }
  html += `</tbody></table></div>`;
  const list = history.map((h, k) => ({h, k})).reverse();
  const shown = showAllRounds ? list : list.slice(0, 5);
  html += `<ul class="rounds">` + shown.map(({h, k}) => {
    const d = new Date(h.at);
    const time = `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
    return `<li class="round"><span class="rt">${k+1}번째 판<small>${time}</small></span><span class="pairs">${h.entries.map(e =>
      `<span class="pair"><img src="${IMG[e.char]}" alt="${KO[e.char]}">${esc(e.name)} → <b>${esc(e.result)}</b></span>`).join('')}</span></li>`;
  }).join('') + `</ul>`;
  if (list.length > 5) html += `<div class="more"><button type="button" class="btn ghost small" id="moreRounds">${showAllRounds ? '최근 5판만 보기' : `지난 판 ${list.length - 5}개 더 보기`}</button></div>`;
  B.innerHTML = html;
  $('moreRounds')?.addEventListener('click', () => { showAllRounds = !showAllRounds; renderHistory(); });
}

  }
  const ok = await copyLink();
  toast(ok ? '링크를 복사했어요. 인스타그램 스토리나 DM에 붙여넣어 주세요.' : '인스타그램에 이 주소를 붙여넣어 주세요: ' + SHARE.url);
});
$('shFb').addEventListener('click', () => setMenu(false));
$('shX').addEventListener('click', () => setMenu(false));
$('shCopy').addEventListener('click', async () => {
  setMenu(false);
  const ok = await copyLink();
  toast(ok ? '링크를 복사했어요.' : '복사가 막혀 있어요. 주소: ' + SHARE.url);
});

renderSetup();
renderHistory();
</script>
