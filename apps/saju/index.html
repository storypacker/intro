<title>오늘의 사주 일진과 명언</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700;900&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* Layout: 넓은 화면은 왼쪽 입력 카드 + 오른쪽 결과, 좁은 화면은 위아래로 쌓음. 결과는 날짜·총평 → 4개 분야 → 사주 원국 순. */
:root {
  --bg: #EDEFF1;
  --surface: #F9FAFB;
  --sunken: #E4E7EA;
  --fg: #1E242B;
  --muted: #5F6873;
  --line: #D3D8DE;
  --ink: #26323F;
  --seal: #A8432F;
  --on-ink: #F4F6F8;
  --wood: #4F7D55; --fire: #B5533B; --earth: #A6843F; --metal: #7D858F; --water: #375A82;
  --good: #3F7A57; --warn: #B07A2C; --bad: #A8432F;
  --font-display: "Noto Serif KR", "Nanum Myeongjo", "AppleMyungjo", serif;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14181D; --surface: #1C2229; --sunken: #232A32; --fg: #E6E9ED; --muted: #9AA3AE; --line: #2F3741;
    --ink: #C9D3DE; --seal: #D9735C; --on-ink: #14181D;
    --wood: #7DB085; --fire: #E07F66; --earth: #D1AE68; --metal: #A9B1BA; --water: #7FA3CC;
    --good: #74B48D; --warn: #D7A55B; --bad: #E07F66;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #14181D; --surface: #1C2229; --sunken: #232A32; --fg: #E6E9ED; --muted: #9AA3AE; --line: #2F3741;
  --ink: #C9D3DE; --seal: #D9735C; --on-ink: #14181D;
  --wood: #7DB085; --fire: #E07F66; --earth: #D1AE68; --metal: #A9B1BA; --water: #7FA3CC;
  --good: #74B48D; --warn: #D7A55B; --bad: #E07F66;
  color-scheme: dark;
}
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 16px; line-height: 1.65; }
.wrap {
  max-width: 1120px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 36px 56px;
  display: flex; flex-direction: column; gap: 28px;
}
header { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
.head-text { display: flex; flex-direction: column; gap: 4px; flex: 1 1 auto; min-width: 0; }

/* 공유 */
.share { position: relative; flex: none; margin-top: 6px; }
.share-btn {
  display: inline-flex; align-items: center; gap: 6px;
  font: inherit; font-size: .82rem; font-weight: 500; line-height: 1.2; cursor: pointer;
  border: 1px solid var(--line); background: var(--surface); color: var(--fg);
  border-radius: 999px; padding: 6px 12px 6px 10px;
}
.share-btn:hover, .share-btn[aria-expanded="true"] { border-color: var(--ink); }
.share-btn svg { width: 15px; height: 15px; }
.share-menu {
  position: absolute; right: 0; top: calc(100% + 8px); z-index: 20;
  width: 212px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
  box-shadow: 0 10px 30px color-mix(in srgb, var(--fg) 16%, transparent);
  padding: 6px; display: flex; flex-direction: column;
}
.share-menu .item {
  display: flex; align-items: center; gap: 10px;
  width: 100%; border: 0; background: none; text-align: left; cursor: pointer;
  padding: 9px 10px; border-radius: 8px;
  font: inherit; font-size: .9rem; color: var(--fg); text-decoration: none; line-height: 1.3;
}
.share-menu .item:hover, .share-menu .item:focus-visible { background: var(--bg); outline: none; }
.share-menu .chip {
  width: 26px; height: 26px; border-radius: 7px; flex: none;
  display: grid; place-items: center;
  font: 700 12px/1 var(--font-body); color: #fff;
}
.share-menu .chip svg { width: 15px; height: 15px; }
.share-menu[hidden], .share-menu [hidden], .snack[hidden] { display: none !important; }
.share-menu hr { border: 0; border-top: 1px solid var(--line); margin: 4px 6px; }
.share-url { display: flex; flex-direction: column; gap: 6px; padding: 6px 8px 8px; }
.share-url small { font-size: .75rem; color: var(--muted); line-height: 1.4; }
.share-url input { width: 100%; box-sizing: border-box; font: .75rem/1.4 var(--font-body); padding: 6px 8px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); }
.snack {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: calc(20px + env(safe-area-inset-bottom, 0px));
  max-width: calc(100% - 32px); z-index: 30;
  background: var(--ink); color: var(--on-ink);
  padding: 10px 16px; border-radius: 10px;
  font-size: .9rem; line-height: 1.45; text-align: center; word-break: keep-all;
}
header h1 { margin: 0; font-family: var(--font-display); font-weight: 900; font-size: clamp(1.8rem, 4.5vw, 2.4rem); color: var(--ink); text-wrap: balance; }
header p { margin: 0; color: var(--muted); word-break: keep-all; }

.layout { display: grid; grid-template-columns: 340px minmax(0, 1fr); gap: 24px; align-items: start; }
@media (max-width: 860px) { .layout { grid-template-columns: minmax(0, 1fr); } }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 24px; }
form { display: flex; flex-direction: column; gap: 20px; }
@media (min-width: 861px) { form.panel { position: sticky; top: calc(16px + env(safe-area-inset-top, 0px)); } }
.field { display: flex; flex-direction: column; gap: 8px; }
.field > label, .field > .lbl { font-weight: 600; font-size: .95rem; }
.row { display: grid; gap: 8px; }
.row.date { grid-template-columns: 1.3fr 1fr 1fr; }
.row.time { grid-template-columns: 1fr 1fr; }
input[type="text"], select {
  width: 100%; box-sizing: border-box;
  font: inherit; font-size: 1.05rem;
  padding: 12px 12px; border-radius: 10px;
  border: 1px solid var(--line); background: var(--bg); color: var(--fg);
}
select { appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 16px) 52%, calc(100% - 11px) 52%; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 28px; }
input:focus-visible, select:focus-visible, button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
select:disabled { opacity: .45; }
.check { display: flex; align-items: center; gap: 8px; font-size: .95rem; color: var(--muted); cursor: pointer; }
.check input { width: 18px; height: 18px; accent-color: var(--ink); }
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 0; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg label { text-align: center; padding: 12px; font-size: 1.05rem; cursor: pointer; background: var(--bg); color: var(--fg); transition: background .2s, color .2s; }
.seg label + input + label, .seg input + label + input + label { border-left: 1px solid var(--line); }
.seg input:checked + label { background: var(--ink); color: var(--on-ink); font-weight: 600; }
.seg input:focus-visible + label { outline: 2px solid var(--ink); outline-offset: -3px; }
.submit {
  font: inherit; font-size: 1.1rem; font-weight: 600;
  padding: 14px; border: 0; border-radius: 12px; cursor: pointer;
  background: var(--ink); color: var(--on-ink);
}
.submit:hover { filter: brightness(1.08); }
.err { color: var(--bad); font-size: .9rem; margin: 0; min-height: 0; }
.note { font-size: .82rem; color: var(--muted); margin: 0; line-height: 1.55; }

.result { display: flex; flex-direction: column; gap: 20px; min-width: 0; }
.sample { align-self: flex-start; font-size: .85rem; padding: 4px 10px; border-radius: 999px; background: var(--sunken); color: var(--muted); }

.today { display: flex; gap: 20px; align-items: center; flex-wrap: wrap; }
.seal {
  flex: none; width: 84px; height: 84px; border-radius: 12px;
  border: 2.5px solid var(--seal); color: var(--seal);
  display: grid; place-items: center; text-align: center;
  font-family: var(--font-display); font-weight: 900; font-size: 1.7rem; line-height: 1.05;
  transform: rotate(-3deg);
}
.seal small { display: block; font-size: .8rem; font-weight: 700; letter-spacing: .1em; margin-top: 2px; }
.today-text { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.today-date { font-family: var(--font-display); font-weight: 700; font-size: clamp(1.25rem, 3.2vw, 1.55rem); color: var(--ink); }
.today-sub { color: var(--muted); }

.summary { display: flex; flex-direction: column; gap: 14px; }
.summary-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.summary-head h2 { margin: 0; font-family: var(--font-display); font-size: 1.3rem; color: var(--ink); }
.score-big { font-variant-numeric: tabular-nums; font-weight: 600; }
.score-big b { font-family: var(--font-display); font-size: 2rem; color: var(--ink); margin-right: 6px; }
.summary p { margin: 0; font-size: 1.05rem; text-wrap: pretty; word-break: keep-all; }
.summary .lines { display: flex; flex-direction: column; gap: 6px; }

.cats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
@media (max-width: 560px) { .cats { grid-template-columns: minmax(0, 1fr); } }
.cat { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
.cat-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.cat-head h3 { margin: 0; font-family: var(--font-display); font-size: 1.15rem; display: flex; align-items: baseline; gap: 6px; }
.cat-head h3 span { font-size: .85rem; color: var(--muted); font-weight: 500; }
.pill { font-size: .82rem; font-weight: 600; padding: 3px 10px; border-radius: 999px; white-space: nowrap; }
.pill.g4 { background: color-mix(in srgb, var(--good) 18%, transparent); color: var(--good); }
.pill.g3 { background: color-mix(in srgb, var(--good) 12%, transparent); color: var(--good); }
.pill.g2 { background: color-mix(in srgb, var(--warn) 15%, transparent); color: var(--warn); }
.pill.g1 { background: color-mix(in srgb, var(--bad) 14%, transparent); color: var(--bad); }
.bar { height: 6px; border-radius: 999px; background: var(--sunken); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: inherit; background: var(--ink); transition: width .6s ease; }
.cat p { margin: 0; word-break: keep-all; text-wrap: pretty; }
.cat .num { font-variant-numeric: tabular-nums; color: var(--muted); font-size: .85rem; }

.chart h2 { margin: 0 0 14px; font-family: var(--font-display); font-size: 1.15rem; color: var(--ink); }
.pillars { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.pillar { display: flex; flex-direction: column; gap: 6px; text-align: center; }
.pillar .pos { font-size: .82rem; color: var(--muted); letter-spacing: .06em; }
.ch {
  border-radius: 10px; padding: 8px 4px 6px; display: flex; flex-direction: column; align-items: center;
  background: color-mix(in srgb, var(--c) 13%, transparent); color: var(--c);
}
.ch b { font-family: var(--font-display); font-weight: 900; font-size: clamp(1.5rem, 4.5vw, 2rem); line-height: 1.1; }
.ch span { font-size: .78rem; }
.pillar.me .ch:first-of-type { box-shadow: inset 0 0 0 2px var(--c); }
.ch.empty { --c: var(--muted); background: var(--sunken); }
.tg { font-size: .78rem; color: var(--muted); min-height: 1.2em; }
.el-wood { --c: var(--wood); } .el-fire { --c: var(--fire); } .el-earth { --c: var(--earth); } .el-metal { --c: var(--metal); } .el-water { --c: var(--water); }

.elements { margin-top: 18px; display: flex; flex-direction: column; gap: 8px; }
.el-row { display: grid; grid-template-columns: 56px minmax(0, 1fr) 28px; gap: 10px; align-items: center; font-size: .9rem; }
.el-row .t { color: var(--c); font-weight: 600; }
.el-row .b { height: 8px; border-radius: 999px; background: var(--sunken); overflow: hidden; }
.el-row .b i { display: block; height: 100%; background: var(--c); border-radius: inherit; }
.el-row .n { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }
.chart-note { margin: 14px 0 0; font-size: .9rem; color: var(--muted); word-break: keep-all; }

.word {
  background: var(--ink); color: var(--on-ink);
  border-radius: 16px; padding: clamp(26px, 5vw, 44px) clamp(22px, 5vw, 48px);
  display: flex; flex-direction: column; gap: 18px;
}
.word .eyebrow { font-size: .85rem; letter-spacing: .08em; opacity: .75; }
.word blockquote {
  margin: 0; font-family: var(--font-display); font-weight: 900;
  font-size: clamp(1.4rem, 3.8vw, 1.95rem); line-height: 1.6;
  word-break: keep-all; text-wrap: pretty;
}
.word .who { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: 1.05rem; opacity: .85; }
.word .who::before { content: "— "; }
.word .why { margin: 0; padding-top: 16px; border-top: 1px solid color-mix(in srgb, var(--on-ink) 22%, transparent); font-size: .98rem; opacity: .88; word-break: keep-all; }
.mbti-tag { display: inline-block; font-weight: 600; padding: 1px 8px; margin-right: 4px; border-radius: 6px; background: color-mix(in srgb, var(--on-ink) 16%, transparent); }

footer { font-size: .82rem; color: var(--muted); text-align: center; }
.credit { margin: -16px 0 0; text-align: center; font-size: .78rem; }
.credit a { color: var(--muted); text-decoration: none; letter-spacing: .02em; }
.credit a:hover { color: var(--ink); text-decoration: underline; }
@media (prefers-reduced-motion: reduce) { .bar i, .seg label { transition: none; } }

/* 기본 리셋 */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }

/* 광고 영역 */
.ad-area { display: flex; flex-direction: column; gap: 6px; }
.ad-label { font-size: .75rem; color: var(--muted); letter-spacing: .08em; text-align: center; }
.ad-box {
  min-height: 100px; border-radius: 12px; overflow: hidden;
  background: var(--surface); border: 1px dashed var(--line);
  display: flex; align-items: center; justify-content: center;
}
.ad-box ins.adsbygoogle { width: 100%; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="head-text">
      <h1>오늘의 사주 일진과 명언</h1>
      <p>태어난 날의 네 기둥과 당신의 MBTI를 오늘의 일진에 견주어 하루 운의 흐름을 풀어드리고 조언해 드려요.</p>
    </div>
    <div class="share">
      <button class="share-btn" id="shareBtn" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="shareMenu">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="3.5" r="2"/><circle cx="4" cy="8" r="2"/><circle cx="12" cy="12.5" r="2"/><path d="M5.8 7l4.4-2.5M5.8 9l4.4 2.5"/></svg>
        공유
      </button>
      <div class="share-menu" id="shareMenu" role="menu" hidden>
        <button class="item" type="button" role="menuitem" data-share="kakao"><span class="chip" style="background:#F2C200;color:#2A2100">K</span>카카오톡</button>
        <button class="item" type="button" role="menuitem" data-share="instagram"><span class="chip" style="background:#C2407A">IG</span>인스타그램</button>
        <a class="item" role="menuitem" data-share="facebook" target="_blank" rel="noopener" href="#"><span class="chip" style="background:#2F5FC4">f</span>페이스북</a>
        <a class="item" role="menuitem" data-share="x" target="_blank" rel="noopener" href="#"><span class="chip" style="background:#1F2328">X</span>X (트위터)</a>
        <button class="item" type="button" role="menuitem" data-share="native" id="nativeShare" hidden><span class="chip" style="background:var(--muted)"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 10V2M5 5l3-3 3 3M3 9v4h10V9"/></svg></span>다른 앱으로 공유</button>
        <hr>
        <button class="item" type="button" role="menuitem" data-share="copy"><span class="chip" style="background:var(--ink);color:var(--on-ink)"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.5 9.5l3-3M7 4.5l1.2-1.2a2.8 2.8 0 014 4L11 8.5M9 11.5l-1.2 1.2a2.8 2.8 0 01-4-4L5 7.5"/></svg></span>링크 복사</button>
        <div class="share-url" id="shareUrlBox" hidden>
          <small>아래 주소를 길게 누르거나 선택해서 복사하세요.</small>
          <input id="shareUrlInput" type="text" readonly aria-label="공유 주소">
        </div>
      </div>
    </div>
  </header>

  <div class="layout">
    <form class="panel" id="form" novalidate>
      <div class="field">
        <label for="name">이름</label>
        <input type="text" id="name" autocomplete="name" placeholder="예: 홍길동" maxlength="20">
      </div>
      <div class="field">
        <span class="lbl" id="dlbl">생년월일 (양력)</span>
        <div class="row date" role="group" aria-labelledby="dlbl">
          <select id="by" aria-label="태어난 해"></select>
          <select id="bm" aria-label="태어난 달"></select>
          <select id="bd" aria-label="태어난 날"></select>
        </div>
      </div>
      <div class="field">
        <span class="lbl" id="tlbl">태어난 시간</span>
        <div class="row time" role="group" aria-labelledby="tlbl">
          <select id="th" aria-label="시"></select>
          <select id="tm" aria-label="분"></select>
        </div>
        <label class="check"><input type="checkbox" id="tunk"> 태어난 시간을 몰라요</label>
      </div>
      <div class="field">
        <span class="lbl" id="glbl">성별</span>
        <div class="seg" role="radiogroup" aria-labelledby="glbl">
          <input type="radio" name="g" id="gm" value="m" checked><label for="gm">남</label>
          <input type="radio" name="g" id="gf" value="f"><label for="gf">여</label>
        </div>
      </div>
      <div class="field">
        <label for="mbti">MBTI</label>

const mod = (a, n) => ((a % n) + n) % n;
function dayIndex(y, m, d) { // 1900-01-01 = 甲戌(10)
  const days = Math.round((Date.UTC(y, m - 1, d) - Date.UTC(1900, 0, 1)) / 86400000);
  return mod(10 + days, 60);
}
function sunLongitude(jd) {
  const T = (jd - 2451545.0) / 36525, r = Math.PI / 180;
  const L0 = 280.46646 + 36000.76983 * T + 0.0003032 * T * T;
  const M = 357.52911 + 35999.05029 * T - 0.0001537 * T * T;
  const C = (1.914602 - 0.004817 * T - 0.000014 * T * T) * Math.sin(M * r)
          + (0.019993 - 0.000101 * T) * Math.sin(2 * M * r) + 0.000289 * Math.sin(3 * M * r);
  const om = 125.04 - 1934.136 * T;
  return mod(L0 + C - 0.00569 - 0.00478 * Math.sin(om * r), 360);
}
function calcSaju(y, m, d, hh, mm, known) {
  const H = known ? hh : 12, Mi = known ? mm : 0;
  const utcMs = Date.UTC(y, m - 1, d, H, Mi) - 9 * 3600000;
  const lam = sunLongitude(utcMs / 86400000 + 2440587.5);
  const mIdx = Math.floor(mod(lam - 315, 360) / 30); // 0 = 寅월
  let sy = y;
  if (m <= 2 && mIdx >= 10) sy = y - 1;
  const yi = mod(sy - 4, 60);
  const yS = yi % 10, yB = yi % 12;
  const mS = mod((yS % 5) * 2 + 2 + mIdx, 10), mB = mod(2 + mIdx, 12);
  let dy = y, dm = m, dd = d;
  if (known && hh * 60 + mm >= 23 * 60 + 30) { const t = new Date(Date.UTC(y, m - 1, d + 1)); dy = t.getUTCFullYear(); dm = t.getUTCMonth() + 1; dd = t.getUTCDate(); }
  const di = dayIndex(dy, dm, dd);
  const dS = di % 10, dB = di % 12;
  let hour = null;
  if (known) {
    const corr = hh * 60 + mm - 30;
    const hB = Math.floor(mod(corr + 60, 1440) / 120);
    hour = { s: mod((dS % 5) * 2 + hB, 10), b: hB };
  }
  return { year: { s: yS, b: yB }, month: { s: mS, b: mB }, day: { s: dS, b: dB }, hour };
}
function tenGod(dm, s) {
  const diff = mod(ST_EL[s] - ST_EL[dm], 5);
  return diff * 2 + ((s % 2) === (dm % 2) ? 0 : 1);
}
function relEl(dmEl, el) { return mod(el - dmEl, 5); } // 0비겁 1식상 2재성 3관성 4인성

function analyze(saju) {
  const dm = saju.day.s, dmEl = ST_EL[dm];
  const counts = [0,0,0,0,0];
  const pts = [[saju.year.s,"s"],[saju.year.b,"b"],[saju.month.s,"s"],[saju.month.b,"b"],[saju.day.s,"s"],[saju.day.b,"b"]];
  if (saju.hour) pts.push([saju.hour.s,"s"],[saju.hour.b,"b"]);
  pts.forEach(([v,t]) => counts[t === "s" ? ST_EL[v] : BR_EL[v]]++);
  let sup = 0, tot = 0;
  const add = (el, w) => { tot += w; const r = relEl(dmEl, el); if (r === 0 || r === 4) sup += w; };
  add(ST_EL[saju.year.s],1); add(ST_EL[saju.month.s],1); add(BR_EL[saju.year.b],1);
  add(BR_EL[saju.month.b],2); add(BR_EL[saju.day.b],1);
  if (saju.hour) { add(ST_EL[saju.hour.s],1); add(BR_EL[saju.hour.b],1); }
  const strong = sup / tot >= 0.5;
  const favRel = strong ? [1,2,3] : [4,0];
  const favEls = favRel.map(r => mod(dmEl + r, 5));
  const lucky = favEls.slice().sort((a,b) => counts[a] - counts[b])[0];
  const lacking = counts.findIndex(c => c === 0);
  return { dm, dmEl, counts, strong, favRel, lucky, lacking };
}

function hash(str) { let h = 2166136261; for (const c of str) { h ^= c.codePointAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }

function fortune(input, saju, an, today) {
  const { name, gender } = input;
  const tdi = dayIndex(today.y, today.m, today.d);
  const tS = tdi % 10, tB = tdi % 12;
  const tgI = tenGod(an.dm, tS), tg = TG[tgI];

  const clashDay = mod(tB - saju.day.b, 12) === 6;

  else if (!fav && tgGroup === 0) text.money.push("남에게 보증을 서거나 돈을 빌려주는 일은 오늘만큼은 거절해도 괜찮아요.");

  if (clashDay) { score.rel -= 8; text.rel.push("일진이 일지와 충(沖)을 이루어 가까운 사이일수록 말투를 부드럽게 해야 해요."); }
  else if (harmDay) { score.rel += 8; text.rel.push("일진이 일지와 합(合)을 이루어 마음 맞는 사람과의 인연이 깊어지는 날이에요."); }
  else if (gender === "m" && tgGroup === 2) { score.rel += 3; text.rel.push("남성에게 재성의 날은 이성 인연이 움직이는 날이니 연인이나 배우자와 시간을 보내 보세요."); }
  else if (gender === "f" && tgGroup === 3) { score.rel += 3; text.rel.push("여성에게 관성의 날은 이성 인연이 움직이는 날이니 연인이나 배우자와 시간을 보내 보세요."); }
  // 건강
  if (clashDay) { score.health -= 6; text.health.push("일지가 충을 받아 몸의 리듬이 흔들리기 쉬우니 이동과 운동 중 안전에 신경 쓰세요."); }
  else if (an.lacking >= 0) text.health.push(`사주에 ${EL[an.lacking].k}(${EL[an.lacking].h}) 기운이 부족한 편이라 ${EL[an.lacking].organ}을 평소에 잘 챙기면 좋아요.`);

  Object.keys(score).forEach(k => score[k] = Math.max(30, Math.min(96, score[k])));
  const total = Math.round((score.biz + score.money + score.rel + score.health) / 4);

  const dmD = DM[an.dm], tEl = EL[ST_EL[tS]], L = EL[an.lucky];
  const lines = [

    `오늘 ${STK[tS]}${BRK[tB]}(${ST[tS]}${BR[tB]})일은 ${name}님에게 ${tg.n}(${tg.h})의 날로, ${tg.head}`,

  v.mbti = MBTI_TRAIT[v.mbti] ? v.mbti : "";
  const w = dailyWord(v, f);
  const toneKo = w.tone === "cheer" ? "격려" : "위로";
  const whoLine = v.mbti
    ? `<span class="mbti-tag">${v.mbti}</span>${MBTI_TRAIT[v.mbti]}인 ${v.name}님에게 ${f.tg.n}(${f.tg.h})의 날 건네는 ${toneKo}예요. ${w.why}`
    : `${f.tg.n}(${f.tg.h})의 날, ${v.name}님에게 건네는 ${toneKo}예요. ${w.why} MBTI를 입력하면 성격에 더 맞는 문장을 골라 드려요.`;

  $("result").innerHTML = `
    ${isSample ? `<span class="sample">예시 결과예요. 왼쪽에 내 정보를 넣어 보세요.</span>` : ""}
    <section class="panel today">
      <div class="seal" aria-hidden="true">${ST[f.tS]}${BR[f.tB]}<small>日辰</small></div>
      <div class="today-text">
        <span class="today-date">${TODAY.y}년 ${TODAY.m}월 ${TODAY.d}일 ${WEEK[TODAY.w]}요일</span>
        <span class="today-sub">${STK[f.tS]}${BRK[f.tB]}일 · ${v.name}님의 ${f.tg.n}(${f.tg.h}) 날</span>
      </div>
    </section>
    <section class="panel summary">
      <div class="summary-head">
        <h2>오늘의 총평</h2>
        <span class="score-big"><b>${f.total}</b>점 · ${grade(f.total)[1]}</span>
      </div>
      <div class="lines">${f.lines.map(l => `<p>${l}</p>`).join("")}</div>
    </section>
    <div class="cats">
      ${cats.map(([k, ko, hj]) => { const g = grade(f.score[k]); return `
        <section class="cat">
          <div class="cat-head"><h3>${ko} <span>${hj}</span></h3><span class="pill ${g[0]}">${g[1]}</span></div>
          <div class="bar" role="img" aria-label="${ko} ${f.score[k]}점"><i style="width:${f.score[k]}%"></i></div>
          <span class="num">${f.score[k]}점</span>
          ${f.text[k].map(t => `<p>${t}</p>`).join("")}
        </section>`; }).join("")}
    </div>
    <section class="word">
      <span class="eyebrow">오늘의 한 줄 · ${toneKo}</span>
      <blockquote>${w.text}</blockquote>
      <p class="who">${w.who}</p>
      <p class="why">${whoLine}</p>
    </section>
    <section class="panel chart">
      <h2>${v.name}님의 사주 원국</h2>
      <div class="pillars">
        ${pillar("시주", saju.hour)}${pillar("일주", saju.day, true)}${pillar("월주", saju.month)}${pillar("년주", saju.year)}
      </div>
      <div class="elements">
        ${an.counts.map((c, i) => `<div class="el-row ${EL[i].cls}"><span class="t">${EL[i].h} ${EL[i].k}</span><span class="b"><i style="width:${c / maxC * 100}%"></i></span><span class="n">${c}</span></div>`).join("")}
      </div>
      <p class="chart-note">${an.strong ? "신강(身強)" : "신약(身弱)"}한 사주로 보아, ${an.favRel.map(r => ["비겁","식상","재성","관성","인성"][r]).join("·")} 기운을 반기는 편이에요.${v.unk ? " 태어난 시간을 몰라 시주는 빼고 풀이했어요." : ""}</p>
    </section>`;
}

$("form").addEventListener("submit", e => {
  e.preventDefault();
  const v = readForm();
  if (!v.name) { $("err").textContent = "이름을 입력해 주세요."; $("name").focus(); return; }
  if (new Date(Date.UTC(v.y, v.m - 1, v.d)) > new Date(Date.UTC(TODAY.y, TODAY.m - 1, TODAY.d))) { $("err").textContent = "생년월일이 오늘 이후예요. 날짜를 다시 확인해 주세요."; return; }
  $("err").textContent = "";
  try { localStorage.setItem("saju-input", JSON.stringify(v)); } catch (_) {}
  render(v, false);
  if (window.matchMedia("(max-width: 860px)").matches) $("result").scrollIntoView({ behavior: "smooth", block: "start" });
});


/* ---------- 공유 ---------- */
const SHARE_URL = "https://www.storypacker.com/apps/saju/index.html";
const SHARE_IMG = "https://www.storypacker.com/apps/saju/share-square.jpg";
const SHARE_TITLE = "오늘의 사주 일진과 명언";
const SHARE_TEXT = "내 사주와 MBTI로 보는 오늘의 운세와 명언";
const KAKAO_KEY = "5105b1554266f3f2d8a94fde88730931";
const IS_SITE = !!window.SP_SITE; // 웹사이트용 파일에서만 true
const IS_PHONE = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent) ||
  (navigator.maxTouchPoints > 1 && /Macintosh/.test(navigator.userAgent)); // iPadOS 포함

let snackTimer;
function snack(msg) {
  const el = $("snack");
  el.textContent = msg; el.hidden = false;
  clearTimeout(snackTimer);
  snackTimer = setTimeout(() => { el.hidden = true; }, 3200);
}
function showUrlBox() {
  const box = $("shareUrlBox"), inp = $("shareUrlInput");
  box.hidden = false; inp.value = SHARE_URL; inp.focus(); inp.select();
}
function copyLink(okMsg) {
  const ok = () => { snack(okMsg); closeShare(); };
  try { navigator.clipboard.writeText(SHARE_URL).then(ok, showUrlBox); }
  catch (e) { showUrlBox(); }
}
let kakaoReady = false;
function initKakao() {
  try {
    if (window.Kakao && !Kakao.isInitialized()) Kakao.init(KAKAO_KEY);
    kakaoReady = !!(window.Kakao && Kakao.isInitialized() && Kakao.Share);
  } catch (e) { kakaoReady = false; }
}
function shareKakao() {
  initKakao();
  const fallbackMsg = "링크를 복사했어요. 카카오톡 대화방에 붙여 넣으세요.";
  if (!kakaoReady) { copyLink(fallbackMsg); return; }
  try {
    Kakao.Share.sendDefault({
      objectType: "feed",
      content: {
        title: SHARE_TITLE,
        description: SHARE_TEXT,
        imageUrl: SHARE_IMG,
        imageWidth: 800, imageHeight: 800,
        link: { mobileWebUrl: SHARE_URL, webUrl: SHARE_URL }
      },
      buttons: [{ title: "오늘 운세 보기", link: { mobileWebUrl: SHARE_URL, webUrl: SHARE_URL } }]
    });
    closeShare();
  } catch (e) { copyLink(fallbackMsg); }
}
function shareNative() {
  navigator.share({ title: SHARE_TITLE, text: SHARE_TEXT, url: SHARE_URL }).then(closeShare, () => {});
}
function refreshShareLinks() {
  const u = encodeURIComponent(SHARE_URL);
  document.querySelector('[data-share="facebook"]').href = "https://www.facebook.com/sharer/sharer.php?u=" + u;
  document.querySelector('[data-share="x"]').href = "https://x.com/intent/post?text=" + encodeURIComponent(SHARE_TITLE + " - " + SHARE_TEXT) + "&url=" + u;
}
function openShare() {
  refreshShareLinks();
  $("shareUrlBox").hidden = true;
  $("nativeShare").hidden = !(IS_SITE && IS_PHONE && navigator.share);
  $("shareMenu").hidden = false;
  $("shareBtn").setAttribute("aria-expanded", "true");
}
function closeShare() {
  $("shareMenu").hidden = true;
  $("shareBtn").setAttribute("aria-expanded", "false");
}
$("shareBtn").addEventListener("click", e => {
  e.stopPropagation();
  $("shareMenu").hidden ? openShare() : closeShare();
});
$("shareMenu").addEventListener("click", e => {
  e.stopPropagation();
  const it = e.target.closest("[data-share]"); if (!it) return;
  const k = it.dataset.share;
  if (k === "kakao") shareKakao();
  else if (k === "instagram") copyLink("링크를 복사했어요. 인스타그램 스토리나 DM에 붙여 넣으세요.");
  else if (k === "copy") copyLink("링크를 복사했어요.");
  else if (k === "native") shareNative();
  else setTimeout(closeShare, 0);
});
document.addEventListener("click", () => { if (!$("shareMenu").hidden) closeShare(); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("shareMenu").hidden) { closeShare(); $("shareBtn").focus(); } });

let saved = null;
try { saved = JSON.parse(localStorage.getItem("saju-input")); } catch (_) {}
if (saved && saved.name) { setForm(saved); render(saved, false); }
else { setForm(SAMPLE); render(SAMPLE, true); }
</script>
