입니다.","c":"오늘 하루, 하나를 멈추고 하나를 행하고 한 번 마음을 맑히겠습니다.","o":"諸惡莫作 衆善奉行 自淨其意 是諸佛敎"},{"t":"분노","q":"바위에 새긴 글씨처럼 오래가는 분노가 있고, 땅에 쓴 글씨처럼 금세 지워지는 분노가 있으며, 물 위에 쓴 글씨처럼 쓰자마자 사라지는 마음이 있다.","s":"『앙굿따라 니까야』 「글씨 경(Lekha Sutta)」","m":"세 종류의 사람을 글씨에 비유했습니다. 거친 말을 들어도 물 위의 글씨처럼 마음에 남기지 않는 사람이 가장 훌륭하다고 하셨습니다.","l":"서운한 일을 바위에 새기듯 몇 년씩 간직하는 사람이 있습니다. 그 바위를 지고 다니는 것은 결국 나입니다. 물 위에 쓰듯 흘려보내는 연습을 해 보세요.","c":"오늘 서운한 일은 물 위에 쓰고, 고마운 일은 바위에 새기겠습니다."},{"t":"고독","q":"홀로 사는 것이 낫다. 어리석은 이와는 벗이 될 수 없다. 숲속의 코끼리처럼 욕심 없이 홀로 가며 악을 짓지 말라.","s":"『법구경』 제330게, 「코끼리품」","m":"나쁜 관계에 머무느니 차라리 홀로 가는 편이 낫다는 가르침입니다. 숲속의 코끼리처럼 당당하고 평화롭게 혼자 걸을 수 있어야 합니다.","l":"혼자가 두려워 나를 해치는 관계에 머물 필요는 없습니다. 혼자서도 괜찮은 사람이 될 때, 비로소 좋은 관계도 맺을 수 있습니다.","c":"오늘 홀로 걸어도 당당한 코끼리처럼 걷겠습니다."},{"t":"공감","q":"중생이 병들었으므로 나도 병들었습니다. 중생의 병이 나으면 나의 병도 나을 것입니다.","s":"『유마힐소설경(유마경)』 「문수사리문질품(文殊師利問疾品)」","m":"병문안 온 문수보살에게 유마거사가 한 대답입니다. 보살은 중생의 아픔을 자기 아픔으로 느끼기에, 중생이 아픈 한 보살도 아프다는 깊은 공감의 말입니다.","l":"뉴스 속 먼 곳의 아픔에 무뎌지기 쉬운 시대입니다. 다른 이의 아픔을 내 아픔처럼 느끼는 마음이 세상을 조금씩 낫게 합니다.","c":"오늘 누군가의 아픔을 내 일처럼 느끼고, 할 수 있는 작은 일을 하겠습니다.","o":"以一切衆生病 是故我病"},{"t":"슬픔","q":"\"아무도 죽은 적이 없는 집에서 겨자씨 한 줌을 얻어 오너라.\"","s":"『법구경 주석서(Dhammapada-aṭṭhakathā)』 제114게 인연담, 끼사 고따미 이야기","m":"어린 아들을 잃고 약을 구하러 다니던 끼사 고따미에게 부처님이 하신 말씀입니다. 집집마다 다녔지만 죽음을 겪지 않은 집은 없었고, 그녀는 죽음이 모두의 일임을 깨달았습니다.","l":"큰 슬픔 앞에서 '왜 나에게만'이라는 생각이 듭니다. 그러나 상실은 모든 사람의 집을 찾아옵니다. 그것을 알 때 슬픔은 고립이 아니라 연결이 되고, 다른 이의 아픔도 보이기 시작합니다.","c":"나의 슬픔은 혼자가 아닙니다. 오늘 슬퍼하는 누군가의 손을 잡아 주겠습니다."},{"t":"참회","q":"죄는 본래 자성이 없어 마음 따라 일어나니, 마음이 사라지면 죄도 사라진다. 죄도 사라지고 마음도 사라져 둘 다 공해지면, 이것을 참된 참회라 한다.","s":"『천수경』 참회게","m":"잘못이라는 것도 고정된 실체가 아니라 마음에서 일어난 것이니, 그 마음을 바꾸면 잘못도 사라진다는 깊은 가르침입니다. 참된 참회는 자책이 아니라 마음의 변화입니다.","l":"잘못을 뉘우치는 것과 스스로를 계속 벌하는 것은 다릅니다. 진정한 참회는 같은 마음으로 다시 그 일을 하지 않는 것입니다.","c":"오늘 나를 벌하는 대신, 마음을 바꾸는 참된 참회를 하겠습니다.","o":"罪無自性從心起 心若滅時罪亦亡"},{"t":"섬","q":"스스로 자신의 섬을 만들라. 서둘러 힘쓰고 지혜로워져라. 더러움을 털어 내고 허물이 없으면 거룩한 이들의 세계에 이르리라.","s":"『법구경』 제236게, 「더러움품」","m":"삶의 마지막이 가까워진 이에게 주신 가르침입니다. 늦었다고 생각할 때라도 지금 스스로 의지할 섬을 만들라는 간곡한 당부입니다.","l":"세상의 거센 물살 속에서 기댈 곳이 필요합니다. 그 섬은 남이 만들어 주지 않습니다. 오늘 하는 작은 수행과 선행이 나의 섬이 됩니다.","c":"늦지 않았습니다. 오늘 나의 섬에 흙 한 줌을 더하겠습니다."},{"t":"마음","q":"바람이 움직이는 것도 아니고 깃발이 움직이는 것도 아니다. 그대들의 마음이 움직이는 것이다.","s":"『육조단경』 「행유품」, 『무문관(無門關)』 제29칙","m":"두 스님이 바람에 펄럭이는 깃발을 보고 '바람이 움직인다', '깃발이 움직인다' 다투자 혜능이 한 말입니다. 세상을 어떻게 보는지는 결국 내 마음의 움직임이라는 가르침입니다.","l":"같은 상황을 두고 누구는 기회라 하고 누구는 위기라 합니다. 다툼의 대부분은 사실이 아니라 각자의 마음이 움직여 생깁니다. 내 마음이 어떻게 움직이고 있는지 먼저 보세요.","c":"오늘 바깥이 흔들릴 때, 흔들리는 것이 내 마음인지 먼저 살펴보겠습니다.","o":"不是風動 不是幡動 仁者心動"},{"t":"평정","q":"대지처럼 성내지 않고, 성문의 기둥처럼 굳건하며, 진흙 없는 호수처럼 맑은 이에게는 더 이상 윤회가 없다.","s":"『법구경』 제95게, 「아라한품」","m":"대지는 사람들이 무엇을 버려도 성내지 않고 모두 품습니다. 그런 넓은 마음, 흔들리지 않는 굳건함, 맑은 고요함이 성자의 모습입니다.","l":"사람들이 나에게 쏟아내는 불만과 짜증을 대지처럼 품을 수 있다면 어떨까요? 모든 것을 받아 주되 흔들리지 않는 넉넉함을 길러 보세요.","c":"오늘 나는 대지처럼 넉넉하게, 호수처럼 맑게 살겠습니다."},{"t":"흐름","q":"도를 닦는 사람은 물에 뜬 나무가 물결을 따라 흘러가는 것과 같다. 양쪽 기슭에 닿지 않고, 사람이 건져 가지도 않으며, 소용돌이에 머물지도 않고, 썩지도 않는다면 반드시 바다에 이르리라.","s":"『사십이장경』","m":"수행의 길을 강물에 떠 가는 나무에 비유했습니다. 이쪽저쪽 극단에 걸리지 않고, 유혹에 붙잡히지 않으며, 같은 자리에 맴돌지 않으면 반드시 깨달음의 바다에 이른다는 뜻입니다.","l":"목표를 향해 가는 길에 수많은 걸림돌이 있습니다. 극단적인 생각, 유혹, 같은 고민의 반복. 그것들에 걸리지 않고 꾸준히 흘러가면 결국 바다에 닿습니다.","c":"오늘 어디에도 걸리지 않고, 강물처럼 꾸준히 흘러가겠습니다."},{"t":"신뢰","q":"계와 바른 견해를 갖추고, 진리에 머물며, 진실을 말하고, 자기가 할 일을 다하는 이, 그를 사람들은 사랑한다.","s":"『법구경』 제217게, 「애정품」","m":"사람들에게 사랑받는 비결은 화려한 매력이 아니라 바른 삶과 진실함, 그리고 자기 몫을 다하는 성실함이라는 가르침입니다.","l":"오래 사랑받는 사람들을 보면 대개 말과 행동이 같고, 자기 일을 묵묵히 해내는 사람들입니다. 신뢰가 곧 매력입니다.","c":"오늘 진실하게 말하고 내 몫을 다하는 사람이 되겠습니다."},{"t":"불안","q":"혜가가 말했다. \"제 마음이 편안하지 않습니다. 스승께서 편안하게 해 주십시오.\" 달마가 말했다. \"마음을 가져오너라. 편안하게 해 주리라.\" \"마음을 찾아도 찾을 수 없습니다.\" \"내가 이미 너의 마음을 편안하게 해 주었다.\"","s":"『무문관』 제41칙, 달마안심(達磨安心)","m":"불안한 마음을 가져오라는 말에, 혜가는 그 불안이 붙잡을 수 있는 실체가 아님을 깨달았습니다. 불안의 정체를 들여다보는 순간 불안은 힘을 잃습니다.","l":"불안할 때 그 불안을 정면으로 들여다보세요. '무엇이 정확히 불안한가?' 하고 찾아보면 생각보다 실체가 흐릿한 경우가 많습니다.","c":"오늘 불안이 오면, 그 불안을 가져와 찬찬히 들여다보겠습니다."},{"t":"평안","q":"진리를 마시는 이는 맑은 마음으로 편안히 잠든다. 지혜로운 이는 성자들이 설한 진리를 늘 즐긴다.","s":"『법구경』 제79게, 「현자품」","m":"좋은 가르침을 마음에 담은 이는 밤에 편히 잠듭니다. 마음이 맑으면 잠도 맑아집니다.","l":"잠들기 전 뉴스와 자극적인 영상 대신 좋은 글 한 구절을 읽어 보세요. 마음에 무엇을 담고 잠드느냐가 잠의 질을 바꿉니다.","c":"오늘 밤엔 좋은 말 한 구절을 품고 편안히 잠들겠습니다."},{"t":"집착","q":"\"내 자식이다, 내 재산이다\" 하며 어리석은 이는 괴로워한다. 자기조차 자기의 것이 아닌데, 어찌 자식이며 재산이랴.","s":"『법구경』 제62게, 「어리석은 이품」","m":"소유한다고 믿는 순간 잃을까 두려움이 생깁니다. 내 몸과 마음조차 뜻대로 되지 않는데 다른 것을 완전히 소유할 수는 없다는, 무아(無我)의 가르침입니다.","l":"자녀를 내 뜻대로 키우려 할수록 부딪힙니다. 아이는 나를 통해 왔지만 내 것은 아닙니다. 재산도, 직함도 잠시 맡아 둔 것이라 여기면 잃을까 봐 움켜쥐던 손이 조금 풀립니다.","c":"오늘 내 곁의 소중한 것들을 '내 것'이 아니라 '고마운 인연'으로 바라보겠습니다."},{"t":"절제","q":"거북이가 여우를 보고 머리와 네 다리를 등딱지 속에 거두어들여 해를 입지 않듯, 수행자는 여섯 감각의 문을 지켜 마음을 거두어들여야 한다.","s":"『상윳따 니까야』 「거북이 경(Kumma Sutta)」","m":"여우는 거북이가 다리를 내밀기만 기다리지만 거북이가 등딱지 안에 있으면 어쩌지 못합니다. 감각을 지키는 것이 나를 지키는 일이라는 비유입니다.","l":"유혹의 광고, 자극적인 뉴스, 다툼을 부추기는 댓글은 내가 다리를 내밀기만 기다립니다. 때로는 등딱지 안으로 잠시 들어가는 것이 지혜입니다.","c":"오늘 나를 해치는 자극 앞에서 거북이처럼 잠시 거두어들이겠습니다."},{"t":"경쟁","q":"승리는 원한을 낳고, 패한 이는 괴로움 속에 눕는다. 이기고 지는 것을 모두 내려놓은 이는 평화롭게 잠든다.","s":"『법구경』 제201게, 「행복품」","m":"승패의 세계에서는 이겨도 원망을 사고 져도 괴롭습니다. 그 틀 자체를 내려놓을 때 비로소 진정한 평화가 찾아온다는 가르침입니다.","l":"모든 것을 경쟁으로 보는 마음은 지칩니다. 동료를 경쟁자가 아니라 함께 가는 사람으로 보는 순간, 밤잠이 편안해집니다.","c":"오늘은 이기려 하기보다, 함께 잘 되는 길을 찾아보겠습니다."},{"t":"지금","q":"독화살을 맞은 사람이 '누가 쏘았는지, 활은 무엇인지, 화살 깃은 무슨 새의 깃털인지 알기 전에는 화살을 뽑지 않겠다'고 한다면, 그것을 알기도 전에 그는 죽고 말 것이다.","s":"『맛지마 니까야』 「말룽꺄뿟따 짧은 경(Cūḷamālukya Sutta)」(MN 63), 한역 『중아함경』 「전유경(箭喩經)」","m":"우주가 영원한지, 사후 세계가 있는지만 묻는 제자에게 부처님이 들려주신 독화살의 비유입니다. 지금 시급한 것은 형이상학적 답이 아니라 괴로움을 해결하는 일입니다.","l":"문제가 생기면 원인과 책임을 따지느라 정작 해결은 뒤로 밀릴 때가 있습니다. 먼저 화살을 뽑으세요. 분석은 그다음에 해도 늦지 않습니다.","c":"오늘 따지기보다 먼저, 지금 필요한 일부터 하겠습니다."},{"t":"무상","q":"물거품을 보듯, 아지랑이를 보듯 세상을 바라보는 이를 죽음의 왕은 보지 못한다.","s":"『법구경』 제170게, 「세상품」","m":"세상을 덧없는 것으로 보는 이는 세상에 휘둘리지 않습니다. 무상을 보는 눈은 집착에서 벗어나는 열쇠입니다.","l":"오늘 나를 크게 괴롭히는 일도 1년 뒤에는 기억조차 나지 않을 수 있습니다. 한 발 물러서서 물거품처럼 바라보면 마음이 훨씬 가벼워집니다.","c":"오늘 나를 괴롭히는 일을 물거품처럼 가볍게 바라보겠습니다."},{"t":"슬픔","q":"울고 슬퍼한다고 마음의 평안을 얻는 것이 아니다. 오히려 괴로움은 더 커지고 몸은 상할 뿐이다. 슬픔과 집착의 화살을 스스로 뽑아내는 이는 평안을 얻으리라.","s":"『숫타니파타』 제584·592~593게, 「화살의 경(Salla Sutta)」","m":"가까운 이를 잃고 슬퍼하는 이에게 주신 가르침입니다. 슬퍼하지 말라는 것이 아니라, 슬픔에 박힌 화살을 언젠가는 스스로 뽑아내야 한다는 따뜻한 권유입니다.","l":"상실의 아픔은 시간이 필요합니다. 충분히 슬퍼해도 괜찮습니다. 다만 그 슬픔이 나를 영원히 삼키지 않도록, 조금씩 화살을 뽑아내는 날이 오기를 바랍니다.","c":"지금 아프다면 아파해도 괜찮습니다. 그리고 천천히, 화살을 뽑아낼 힘이 내 안에 있습니다."},{"t":"배움","q":"어리석은 이는 평생 지혜로운 이를 가까이해도 진리를 알지 못한다, 국자가 국 맛을 모르듯이. 지혜로운 이는 잠깐만 가까이해도 곧 진리를 안다, 혀가 국 맛을 알듯이.","s":"『법구경』 제64~65게, 「어리석은 이품」","m":"국자는 평생 국 속에 있어도 맛을 모릅니다. 좋은 스승과 환경 곁에 있는 것만으로는 부족하고, 맛보려는 열린 마음이 있어야 배움이 일어난다는 뜻입니다.","l":"좋은 회사, 좋은 학교, 좋은 사람 곁에 있어도 마음을 열지 않으면 아무것도 스며들지 않습니다. 반대로 짧은 만남에서도 배우려는 사람은 평생 남을 것을 얻어 갑니다.","c":"오늘 만나는 사람에게서 국자가 아니라 혀처럼 배워 보겠습니다."},{"t":"보시","q":"보시에는 세 가지가 있다. 재물을 베푸는 재시(財施), 진리를 베푸는 법시(法施), 두려움을 없애 주는 무외시(無畏施)이다.","s":"용수(龍樹), 『대지도론(大智度論)』","m":"보시는 물질만이 아닙니다. 좋은 가르침을 나누는 것, 그리고 불안하고 두려워하는 이에게 안심을 주는 것도 큰 보시입니다.","l":"시험을 앞둔 아이에게 '괜찮아, 잘할 거야' 하고 말해 주는 것, 아픈 친구 곁에서 '내가 있잖아' 하고 말해 주는 것이 무외시입니다. 두려움을 덜어 주는 것만큼 큰 선물은 드뭅니다.","c":"오늘 불안해하는 누군가에게 두려움을 덜어 주는 말을 건네겠습니다.","o":"財施 法施 無畏施"},{"t":"나눔","q":"하나의 등불로 백 개, 천 개의 등불에 불을 붙여도 어둠은 모두 밝아지고, 처음 등불의 밝음은 조금도 줄지 않는다.","s":"『유마경』 「보살품(菩薩品)」, 무진등(無盡燈)","m":"지혜와 자비는 나눌수록 줄어드는 것이 아니라 세상을 더 밝게 합니다. 이것을 '다함 없는 등불(無盡燈)'이라 합니다.","l":"내가 아는 것을 알려 주면 내 것이 줄어들까 걱정하지 마세요. 친절, 지식, 웃음은 나눌수록 세상이 밝아지고 내 등불은 그대로입니다.","c":"오늘 나의 작은 등불로 누군가의 등불에 불을 붙이겠습니다.","o":"譬如一燈 燃百千燈 冥者皆明 明終不盡"},{"t":"청춘","q":"젊은 시절에 바르게 살지 않고 재산도 모으지 않은 이는, 물고기 없는 연못의 늙은 백로처럼 시들어 간다.","s":"『법구경』 제155게, 「늙음품」","m":"젊은 시절을 헛되이 보내면 나이 들어 후회한다는 경책입니다. 지금 심는 씨앗이 훗날의 양식이 됩니다.","l":"젊음은 영원하지 않습니다. 지금 쌓는 건강, 배움, 관계, 저축이 노년의 연못을 채웁니다. 나이가 많다면, 오늘이 남은 날 중 가장 젊은 날입니다.","c":"오늘은 내 남은 날 중 가장 젊은 날입니다. 미래를 위한 씨앗을 심겠습니다."},{"t":"기쁨","q":"어린 시절 잠부나무 그늘에 앉아 고요한 기쁨에 들었던 일을 기억해 내고 생각했다. '어찌하여 나는 이 즐거움을 두려워하는가? 이것은 감각적 욕망과는 상관없는 즐거움이다.'","s":"『맛지마 니까야』 「삿짜까 큰 경(Mahāsaccaka Sutta)」(MN 36)","m":"극심한 고행 끝에 길을 찾지 못하던 싯다르타가 어린 시절의 평화로운 기억을 떠올리며 새 길을 발견한 장면입니다. 건강한 기쁨은 수행의 적이 아니라 벗입니다.","l":"무언가를 열심히 하는 사람일수록 즐거움에 죄책감을 느끼곤 합니다. 나무 그늘의 고요함, 좋아하는 음악, 산책의 기쁨은 나를 해치지 않습니다. 오히려 길을 밝혀 줍니다.","c":"오늘 나를 해치지 않는 맑은 기쁨을 죄책감 없이 누리겠습니다."},{"t":"지혜","q":"지혜로운 이의 행은 쌀을 쪄서 밥을 짓는 것이요, 어리석은 이의 행은 모래를 쪄서 밥을 지으려는 것이다.","s":"원효, 『발심수행장(發心修行章)』","m":"출가 수행자들이 처음 배우는 초발심자경문에 실린 원효 스님의 글입니다. 아무리 애써도 방향이 틀리면 모래로 밥을 짓는 것처럼 헛수고가 된다는 가르침입니다.","l":"열심히 사는데 삶이 나아지지 않는다면 노력의 방향을 점검해 볼 때입니다. 모래를 오래 찐다고 밥이 되지는 않습니다. 쌀인지 모래인지 먼저 살펴보세요.","c":"오늘 나의 노력이 쌀을 찌고 있는지 모래를 찌고 있는지 살펴보겠습니다.","o":"智人所行 蒸米作飯 愚人所行 蒸沙作飯"},{"t":"서원","q":"중생이 가없지만 기어이 건지리다. 번뇌가 끝없지만 기어이 끊으리다. 법문이 한없지만 기어이 배우리다. 불도가 위없지만 기어이 이루리다.","s":"사홍서원(四弘誓願) — 모든 불교 의식에서 함께 외는 보살의 네 가지 큰 서원","m":"불자라면 누구나 외는 네 가지 서원입니다. 끝이 없는 일인 줄 알면서도 포기하지 않겠다는, 불가능에 도전하는 보살의 용기입니다.","l":"끝이 보이지 않는 일 앞에서 우리는 쉽게 지칩니다. 그러나 사홍서원은 끝이 없어도 가는 것이 보살의 길이라 말합니다. 결과보다 방향이 중요합니다.","c":"끝이 보이지 않아도, 오늘 나는 다시 서원을 세우고 나아갑니다.","o":"衆生無邊誓願度 煩惱無盡誓願斷 法門無量誓願學 佛道無上誓願成"},{"t":"공경","q":"늘 웃어른을 공경하고 섬기는 이에게는 네 가지가 자란다. 수명과 아름다움과 행복과 힘이다.","s":"『법구경』 제109게, 「천품」","m":"공경하는 마음은 받는 이에게 기쁨을 줄 뿐 아니라 그 마음을 낸 사람을 건강하고 아름답고 행복하게 한다는 가르침입니다.","l":"존중하는 태도는 얼굴에 드러납니다. 늘 감사하고 공경하는 사람은 표정이 부드럽고, 그런 사람 곁에는 좋은 사람들이 모입니다.","c":"오늘 만나는 어른께 진심을 담아 인사드리겠습니다."},{"t":"나눔","q":"많은 재산과 먹을 것이 있으면서도 맛있는 것을 혼자서만 먹는 것, 이것이 파멸의 문이다.","s":"『숫타니파타』 제102게, 「파멸의 경」","m":"나누지 않는 풍요는 결국 사람을 고립시키고 무너뜨립니다. 함께 나눌 때 풍요는 진정한 행복이 됩니다.","l":"좋은 것을 혼자 누리면 기쁨은 한 사람분이지만, 나누면 몇 배가 됩니다. 맛있는 것을 먹을 때 함께 먹고 싶은 사람을 떠올려 보세요.","c":"오늘 좋은 것 하나를 혼자 누리지 않고 누군가와 나누겠습니다."},{"t":"욕망","q":"구하는 것이 있으면 모두 괴롭고, 구하는 것이 없으면 즐겁다.","s":"보리달마, 『이입사행론』 무소구행(無所求行)","m":"무언가를 끊임없이 구하는 마음이 괴로움의 원인이라는 가르침입니다. 구하는 마음을 쉬면 그 자리가 곧 편안함입니다.","l":"더 인정받고 싶고, 더 가지고 싶은 마음이 오늘 나를 지치게 하지는 않나요? 하루쯤은 구하는 마음을 쉬고 지금 있는 것으로 충분하다고 느껴 보세요.","c":"오늘 하루, 구하는 마음을 쉬고 있는 그대로 즐겁겠습니다.","o":"有求皆苦 無求乃樂"},{"t":"덕","q":"꽃향기는 바람을 거슬러 가지 못한다. 전단향도 타가라도 재스민도 그렇다. 그러나 선한 이의 향기는 바람을 거슬러 사방으로 퍼진다.","s":"『법구경』 제54게, 「꽃품」","m":"아무리 귀한 향도 바람이 부는 방향으로만 퍼지지만, 덕이 있는 사람의 향기는 상황과 조건을 거슬러서도 멀리 전해진다는 뜻입니다. 인품의 영향력은 물리적 한계를 넘어섭니다.","l":"오래전 나를 도와준 선생님, 힘들 때 말없이 곁에 있어 준 친구의 기억은 세월과 거리를 넘어 지금도 나를 움직입니다. 우리 역시 누군가에게 그런 향기로 남을 수 있습니다.","c":"오늘 작은 친절 하나로, 바람을 거스르는 향기를 피워 봅니다."},{"t":"자유","q":"소리에 놀라지 않는 사자처럼, 그물에 걸리지 않는 바람처럼, 진흙에 물들지 않는 연꽃처럼, 무소의 뿔처럼 혼자서 가라.","s":"『숫타니파타』 제71게, 「무소의 뿔 경(Khaggavisāṇa Sutta)」","m":"가장 오래된 불교 경전 중 하나인 숫타니파타의 유명한 구절입니다. 세상의 소리에 흔들리지 않고, 무엇에도 걸리지 않으며, 더러움 속에서도 맑음을 지키며 자기 길을 가라는 가르침입니다.","l":"남들의 기대, 유행, 비교의 소음 속에서 자기 길을 가기는 쉽지 않습니다. 무소의 뿔은 하나뿐입니다. 남과 같지 않아도 괜찮습니다. 나만의 걸음으로 묵묵히 가면 됩니다.","c":"오늘 나는 흔들리지 않고, 걸리지 않고, 물들지 않으며 내 길을 가겠습니다."},{"t":"일상","q":"신통과 묘용이 다른 것이 아니라, 물 긷고 나무 나르는 일이다.","s":"방온 거사(龐蘊居士)의 게송, 『전등록(傳燈錄)』 권8","m":"재가 수행자로 깨달음을 얻은 방 거사의 유명한 게송입니다. 신비한 능력이 아니라 매일의 평범한 일이 곧 놀라운 작용이라는 가르침입니다.","l":"밥 짓고, 빨래하고, 출근하고, 아이를 재우는 일이 곧 신통입니다. 매일 반복되는 일상을 지루하게 여기지 말고, 그 안의 놀라움을 발견해 보세요.","c":"오늘 물 긷고 나무 나르는 평범한 일을 신통처럼 귀하게 여기겠습니다.","o":"神通幷妙用 運水及搬柴"},{"t":"분노","q":"분노를 버리고 자만을 버려라. 모든 속박을 넘어서라. 정신과 물질에 집착하지 않고 아무것도 가지지 않은 이에게는 괴로움이 따르지 않는다.","s":"『법구경』 제221게, 「분노품」","m":"분노와 자만은 마음을 무겁게 하는 두 개의 짐입니다. 이것을 내려놓으면 괴로움도 따라오지 못한다는 가르침입니다.","l":"화가 날 때 그 밑에는 '감히 나를?'이라는 자만이 숨어 있을 때가 많습니다. 자만을 내려놓으면 분노도 힘을 잃습니다.","c":"오늘 분노와 자만, 두 짐을 내려놓고 가볍게 걷겠습니다."},{"t":"자비","q":"어머니가 하나뿐인 자식을 목숨 걸고 지키듯, 살아 있는 모든 존재에 대해 한량없는 자비의 마음을 일으켜라.","s":"『숫타니파타』 제149게, 「자애경(Metta Sutta)」","m":"남방 불교에서 매일 독송하는 자애경의 핵심 구절입니다. 어머니가 외동자식을 아끼는 그 간절한 마음으로 모든 생명을 대하라는 가르침입니다.","l":"모든 사람을 내 자식처럼 사랑하기는 어렵습니다. 그러나 오늘 만나는 낯선 사람도 누군가의 귀한 자식이라고 생각해 보면 대하는 마음이 달라집니다.","c":"오늘 만나는 모든 이가 누군가의 소중한 사람임을 기억하겠습니다."},{"t":"꾸준함","q":"외우지 않으면 경전이 녹슬고, 돌보지 않으면 집이 녹슬며, 게으름은 아름다움을 녹슬게 하고, 방심은 지키는 이를 녹슬게 한다.","s":"『법구경』 제241게, 「더러움품」","m":"모든 것은 돌보지 않으면 녹이 습니다. 배움도, 집도, 몸도, 마음도 꾸준한 관리가 필요하다는 가르침입니다.","l":"한때 잘하던 외국어, 한때 친했던 친구, 한때 건강했던 몸도 돌보지 않으면 녹습니다. 소중한 것은 자주 닦아 주어야 빛납니다.","c":"오늘 소홀했던 소중한 것 하나를 다시 닦아 주겠습니다."},{"t":"성숙","q":"노승이 삼십 년 전 참선하기 전에는 산을 보면 산이요 물을 보면 물이었다. 뒤에 선지식을 만나 깨친 바가 있어서는 산이 산이 아니요 물이 물이 아니었다. 이제 쉴 곳을 얻고 보니 예전처럼 산은 다만 산이요 물은 다만 물이로다.","s":"청원 유신(靑原惟信), 『오등회원』 권17 / 성철 스님의 1981년 종정 취임 법어 '산은 산이요 물은 물이로다'로 널리 알려짐","m":"깨달음의 세 단계를 보여 주는 법문입니다. 처음엔 보이는 대로 보다가, 의심하고 부정하는 단계를 거쳐, 마침내 있는 그대로를 온전히 보는 경지에 이릅니다.","l":"인생도 그렇습니다. 순수하게 믿던 시절, 모든 것을 의심하던 시절을 지나 다시 소박하게 감사할 줄 아는 시절이 옵니다. 지금 어느 단계에 있든 그것도 과정입니다.","c":"오늘 산은 산으로, 물은 물로, 있는 그대로 바라보겠습니다.","o":"見山祇是山 見水祇是水"},{"t":"공부","q":"공부하는 데 마음에 장애 없기를 바라지 말라. 마음에 장애가 없으면 배우는 것이 넘치게 된다. 그러므로 장애 속에서 해탈을 얻으라.","s":"묘협 스님, 「보왕삼매론」 제3","m":"공부에 어려움이 없으면 차근차근 배우지 않고 건너뛰게 됩니다. 막히는 지점이 오히려 깊이 배우는 기회라는 가르침입니다.","l":"공부하다 막히면 좌절하기 쉽습니다. 그러나 그 막힘을 통과할 때 비로소 진짜 실력이 됩니다. 쉽게 이해한 것보다 애써 이해한 것이 오래 남습니다.","c":"오늘 막히는 곳이 있다면, 그곳이 내가 깊어지는 자리입니다.","o":"究心不求無障 心無障則所學躐等"},{"t":"무상","q":"아, 짧구나, 사람의 삶이여. 백 년도 못 되어 죽는다. 사람들은 '내 것'이라 집착하는 것 때문에 슬퍼한다. 소유는 영원하지 않기 때문이다.","s":"『숫타니파타』 제804~805게, 「늙음의 경(Jarā Sutta)」","m":"짧은 인생에서 영원하지 않은 소유에 매달려 슬퍼하는 인간의 모습을 담담하게 그린 게송입니다.","l":"아무리 많이 가져도 떠날 때는 아무것도 가져갈 수 없습니다. 그렇다면 오늘을 무엇으로 채워야 할까요? 소유보다 경험, 물건보다 사람이 답일 것입니다.","c":"짧은 인생, 오늘은 소유보다 사람과 순간을 더 소중히 하겠습니다."},{"t":"정직","q":"길든 짧든, 작든 크든, 좋든 나쁘든, 이 세상에서 주지 않은 것은 가지지 않는 이, 그를 나는 성자라 부른다.","s":"『법구경』 제409게, 「바라문품」","m":"주지 않은 것을 갖지 않는 것, 불투도(不偸盜)의 계입니다. 크고 작음에 관계없이 정직한 마음을 지키라는 가르침입니다.","l":"회사 비품 하나, 남의 아이디어, 남의 공로. 작은 것이라도 내 것이 아닌 것을 탐하지 않는 것이 정직의 시작입니다.","c":"오늘 작은 것 하나라도 내 것이 아닌 것은 탐하지 않겠습니다."},{"t":"일상","q":"\"차나 한잔 마시고 가게.\"","s":"조주 종심(趙州從諗), 『조주록(趙州錄)』","m":"처음 온 스님에게도, 와 본 적 있는 스님에게도, 그것을 묻는 원주에게도 조주 스님은 똑같이 '차나 마시고 가라'고 했습니다. 도는 거창한 말이 아니라 지금 차 한 잔을 마시는 일에 있다는 뜻입니다.","l":"복잡한 고민을 안고 있을 때 따뜻한 차 한 잔을 천천히 마셔 보세요. 차의 향기와 온기에 온전히 머무는 그 순간, 마음이 조금 풀리고 답이 보이기도 합니다.","c":"오늘 차 한 잔을 마실 때만큼은, 오롯이 차만 마시겠습니다.","o":"喫茶去"},{"t":"고요","q":"깊은 호수가 맑고 고요하듯, 지혜로운 이는 가르침을 듣고 마음이 고요해진다.","s":"『법구경』 제82게, 「현자품」","m":"얕은 물은 작은 돌에도 출렁이지만 깊은 호수는 고요합니다. 좋은 가르침이 마음 깊이 스며들면 내면이 깊어지고, 깊어진 마음은 쉽게 흐려지지 않습니다.","l":"정보는 넘치는데 마음은 점점 얕아지는 시대입니다. 하루 한 구절이라도 천천히 음미하는 시간이 마음의 수심을 깊게 만듭니다.","c":"오늘 이 말씀을 한 번 더 천천히 읽으며, 내 마음의 호수를 고요히 합니다."},{"t":"발심","q":"성문 밖을 나선 태자는 늙은이와 병든 이와 죽은 이를 차례로 보고, 마지막으로 평온한 얼굴의 수행자를 보았다.","s":"『수행본기경』·『불본행집경』 등에 전하는 사문유관(四門遊觀)","m":"궁궐에서 고통을 모르고 자란 싯다르타가 처음으로 늙음, 병, 죽음을 마주하고 출가를 결심하게 된 이야기입니다. 고통을 직면하는 것이 깨달음의 시작이었습니다.","l":"우리도 불편한 진실을 외면하며 살 때가 있습니다. 그러나 그것을 직면할 때 비로소 삶의 의미를 묻게 됩니다. 아픔을 본 자리에서 자비가 시작됩니다.","c":"오늘 외면하던 진실 하나를 용기 내어 마주하겠습니다."},{"t":"절제","q":"몸을 다스림은 좋고, 말을 다스림은 좋다. 마음을 다스림은 좋고, 모든 것을 다스림은 좋다. 모든 것을 다스린 수행자는 모든 괴로움에서 벗어난다.","s":"『법구경』 제361게, 「비구품(沙門品)」","m":"몸, 말, 마음을 불교에서는 삼업(三業)이라 합니다. 이 세 가지를 잘 다스리는 것이 곧 수행의 전부라 해도 과언이 아닙니다.","l":"오늘 하루를 돌아볼 때 세 가지만 물어보세요. 내 몸은 무엇을 했는가, 내 입은 무엇을 말했는가, 내 마음은 무엇을 품었는가.","c":"오늘 몸과 말과 마음, 이 세 가지를 차분히 다스려 보겠습니다."},{"t":"감사","q":"공경하고 겸손하며, 만족할 줄 알고 은혜를 알며, 때에 맞추어 가르침을 듣는 것, 이것이 더없는 행복이다.","s":"『숫타니파타』 제265게, 「위없는 행복의 경」","m":"겸손, 만족, 감사. 이 세 가지 마음가짐이 행복의 열쇠라고 부처님은 말씀하십니다. 감사할 줄 아는 사람은 이미 행복한 사람입니다.","l":"감사 일기를 쓰는 사람이 더 행복하다는 연구가 있습니다. 2,500년 전 부처님은 이미 그것을 알고 계셨습니다. 오늘 감사한 일 세 가지를 적어 보세요.","c":"오늘 감사한 일 세 가지를 찾아 마음에 새기겠습니다."},{"t":"진실","q":"참이 아닌 것을 참이라 여기고, 참인 것을 참이 아니라 보는 이들은 그릇된 생각에 머물러 참에 이르지 못한다.","s":"『법구경』 제11게, 「쌍품」","m":"무엇이 진정 중요한지를 거꾸로 보면 삶 전체가 엇나갑니다. 본질과 껍데기를 구별하는 눈을 기르라는 가르침입니다.","l":"남의 시선, 숫자, 겉모습을 '진짜'라 여기고 건강, 관계, 마음의 평화를 '나중 일'로 미루며 살 때가 있습니다. 무엇이 참인지 다시 물어보는 날이 필요합니다.","c":"오늘 내 삶에서 진짜 중요한 것이 무엇인지 다시 한번 물어보겠습니다."},{"t":"존중","q":"나는 그대들을 깊이 공경하며 감히 업신여기지 않습니다. 왜냐하면 그대들은 모두 보살도를 행하여 마땅히 부처가 될 것이기 때문입니다.","s":"『법화경』 「상불경보살품(常不輕菩薩品)」","m":"상불경(常不輕), 곧 '늘 남을 가볍게 여기지 않는' 보살은 만나는 모든 사람에게 이렇게 절했습니다. 사람들이 욕하고 돌을 던져도 멈추지 않았습니다.","l":"모든 사람 안에 부처가 될 씨앗이 있다고 믿으면 누구도 함부로 대할 수 없습니다. 무례한 사람 안에도, 실수하는 동료 안에도 그 씨앗이 있습니다.","c":"오늘 만나는 모든 이를 미래의 부처님으로 공경하겠습니다.","o":"我深敬汝等 不敢輕慢 所以者何 汝等皆行菩薩道 當得作佛"},{"t":"보시","q":"양 무제가 물었다. \"짐은 절을 짓고 경전을 베끼고 스님들을 공양하였소. 공덕이 얼마나 되겠소?\" 달마 대사가 답했다. \"공덕이 없습니다.\"","s":"보리달마(菩提達磨)와 양 무제의 문답, 『육조단경』 「의문품」·『전등록』 권3","m":"보답을 계산하는 선행은 진정한 공덕이 되지 못한다는 달마 대사의 단호한 가르침입니다. 진짜 공덕은 계산하는 마음 너머에 있습니다.","l":"좋은 일을 하고 나서 '이만큼 했으니 이만큼 돌아오겠지' 하고 계산하고 있지는 않나요? 계산을 내려놓을 때 선행은 비로소 가볍고 순수해집니다.","c":"오늘 계산하지 않고, 그저 좋아서 좋은 일을 하겠습니다.","o":"無功德"},{"t":"인과","q":"허물없고 순수하며 깨끗한 이를 해치는 자에게는, 바람을 거슬러 던진 고운 먼지처럼 그 악이 어리석은 그에게로 되돌아간다.","s":"『법구경』 제125게, 「악품」","m":"바람을 향해 던진 먼지는 결국 던진 사람의 얼굴로 날아옵니다. 남을 해치려는 마음은 결국 자기 자신을 해친다는 비유입니다.","l":"누군가를 깎아내리는 험담은 결국 말한 사람의 품격을 떨어뜨립니다. 억울한 일을 당한 쪽이라면, 직접 되갚지 않아도 바람이 알아서 돌려준다는 것을 믿으세요.","c":"오늘 나는 바람을 거슬러 먼지를 던지지 않겠습니다."},{"t":"알아차림","q":"볼 때는 다만 보기만 하고, 들을 때는 다만 듣기만 하며, 느낄 때는 다만 느끼기만 하고, 알 때는 다만 알기만 하라.","s":"『우다나(Udāna)』 「바히야 경」(Ud 1.10)","m":"길에서 만난 바히야에게 부처님이 주신 짧은 가르침입니다. 그는 이 말씀을 듣고 곧바로 깨달았다고 전해집니다. 판단과 해석을 덧붙이지 않고 있는 그대로 보라는 뜻입니다.","l":"상사의 무표정을 보면 '나한테 화났나?' 하고 해석이 붙습니다. 그저 무표정을 본 것뿐입니다. 해석을 내려놓으면 불필요한 걱정이 크게 줄어듭니다.","c":"오늘 보이는 것을 그저 보고, 들리는 것을 그저 듣겠습니다."},{"t":"하나","q":"한 달이 모든 물에 두루 나타나고, 모든 물의 달은 한 달에 포섭된다.","s":"영가 현각(永嘉玄覺), 『증도가(證道歌)』","m":"하늘의 달은 하나지만 강, 호수, 물그릇마다 달이 비칩니다. 모든 존재에 같은 진리가 깃들어 있고, 모든 것은 하나로 이어져 있다는 가르침입니다.","l":"나와 다른 사람, 나와 다른 생각을 가진 이에게도 같은 달이 비치고 있습니다. 그 사실을 기억하면 다름 속에서도 연결을 느낄 수 있습니다.","c":"오늘 만나는 모든 이 안에서 같은 달빛을 보겠습니다.","o":"一月普現一切水 一切水月一月攝"},{"t":"자기사랑","q":"자기를 사랑한다면 자기를 잘 지켜야 한다. 지혜로운 이는 인생의 세 시기 가운데 적어도 한 시기에는 깨어 있어야 한다.","s":"『법구경』 제157게, 「자기품」","m":"진정한 자기 사랑은 나를 방치하거나 응석을 받아 주는 것이 아니라 바르게 지키는 것입니다. 늦었다고 생각할 때라도 깨어나면 된다는 희망도 담겨 있습니다.","l":"나를 사랑한다는 것은 원하는 것을 다 들어주는 것이 아니라, 나에게 정말 좋은 것을 주는 것입니다. 좋은 음식, 충분한 잠, 바른 생각이 그것입니다.","c":"오늘 나를 진심으로 사랑하는 방식으로 나를 돌보겠습니다."},{"t":"평정","q":"대나무 그림자가 섬돌을 쓸어도 먼지 하나 일지 않고, 달빛이 연못 바닥을 뚫어도 물에는 흔적이 없다.","s":"야보 도천(冶父道川), 『금강경오가해(金剛經五家解)』 송","m":"그림자가 아무리 쓸어도 먼지가 일지 않고, 달빛이 물을 뚫어도 흔적이 남지 않습니다. 세상일을 겪되 마음에 흔적을 남기지 않는 경지를 그린 아름다운 선시입니다.","l":"하루 동안 많은 일이 마음을 스쳐 갑니다. 대나무 그림자처럼, 달빛처럼 그 일들이 지나가도 마음에 상처나 얼룩을 남기지 않도록 가볍게 흘려보내세요.","c":"오늘 많은 일이 스쳐 가도, 내 마음에는 흔적 없이 고요하겠습니다.","o":"竹影掃階塵不動 月穿潭底水無痕"},{"t":"만족","q":"만족할 줄 아는 사람은 땅바닥에 누워 있어도 편안하고 즐겁지만, 만족할 줄 모르는 사람은 천당에 있어도 마음에 차지 않는다. 만족할 줄 모르는 이는 부유해도 가난하고, 만족할 줄 아는 이는 가난해도 부유하다.","s":"『불유교경(佛遺敎經)』","m":"부처님이 열반에 드시기 전 제자들에게 남기신 유언 같은 경전입니다. 진정한 부유함은 가진 것의 많고 적음이 아니라 만족하는 마음에 있다고 하셨습니다.","l":"더 넓은 집, 더 좋은 차를 가져도 만족하지 못하면 늘 가난합니다. 지금 가진 것으로 충분하다고 느끼는 순간, 우리는 이미 부자입니다.","c":"오늘 지금 가진 것으로 충분하다고, 나는 이미 부유하다고 말해 보겠습니다.","o":"知足之人 雖臥地上 猶爲安樂 不知足者 雖處天堂 亦不稱意"},{"t":"벗","q":"무릇 처음 마음을 낸 사람은 모름지기 나쁜 벗을 멀리하고 어질고 착한 이를 가까이해야 한다.","s":"보조 지눌, 『계초심학인문(誡初心學人文)』","m":"처음 수행을 시작하는 이들에게 주는 지눌 스님의 첫 당부입니다. 시작하는 사람에게는 무엇보다 함께하는 사람이 중요합니다.","l":"새로운 습관, 새로운 다짐을 시작할 때 주변 환경이 결정적입니다. 나를 응원하는 사람, 같은 방향을 바라보는 사람 곁에 있으면 다짐이 오래갑니다.","c":"오늘 새로운 다짐을 지켜 줄 좋은 사람들 곁으로 한 걸음 다가가겠습니다.","o":"夫初心之人 須遠離惡友 親近賢善"},{"t":"핵심","q":"\"비구들이여, 내 손안의 심사빠 잎과 이 숲의 잎 중 어느 것이 더 많은가?\" \"숲의 잎이 훨씬 많습니다.\" \"그와 같이 내가 깨달았으나 설하지 않은 것이 훨씬 많다. 내가 설한 것은 괴로움을 끝내는 데 필요한 것들이다.\"","s":"『상윳따 니까야』 「심사빠 숲 경(Siṃsapā Sutta)」(SN 56.31)","m":"부처님은 모든 지식을 가르치려 하지 않으셨습니다. 괴로움을 끝내는 데 꼭 필요한 것만 손에 쥐여 주셨습니다. 무엇이 정말 필요한지 아는 것이 지혜입니다.","l":"정보는 숲의 잎만큼 많지만 내 삶에 필요한 것은 한 줌입니다. 모든 것을 다 알려 하기보다, 내게 꼭 필요한 한 줌을 깊이 아는 것이 낫습니다.","c":"오늘 숲의 잎이 아닌, 손안의 한 줌에 집중하겠습니다."},{"t":"진실","q":"진실이라는 하나의 법을 어기고 거짓을 말하며 다음 세상을 생각하지 않는 이가 저지르지 못할 악은 없다.","s":"『법구경』 제176게, 「세상품」","m":"거짓말은 모든 악의 문을 여는 열쇠입니다. 진실을 버린 사람은 어떤 잘못이든 정당화할 수 있게 된다는 경고입니다.","l":"작은 거짓말 하나가 다른 거짓말을 부르고, 결국 자신도 무엇이 진실인지 모르게 됩니다. 진실은 때로 불편하지만 가장 단단한 기반입니다.","c":"오늘 불편하더라도 진실을 말하겠습니다."},{"t":"자기사랑","q":"마음으로 온 사방을 다 찾아보아도 자기보다 더 사랑스러운 이는 찾을 수 없다. 이처럼 다른 이들에게도 자기 자신이 가장 사랑스럽다. 그러므로 자기를 사랑하는 이는 남을 해치지 말라.","s":"『상윳따 니까야』 「말리까 경(Mallikā Sutta)」(SN 3.8), 『우다나』 5.1","m":"빠세나디 왕과 말리까 왕비가 '자기보다 사랑스러운 이는 없다'고 고백하자 부처님이 하신 말씀입니다. 자기 사랑을 부정하지 않고, 그것을 남에 대한 배려로 확장하셨습니다.","l":"내가 소중하듯 저 사람도 자신이 가장 소중합니다. 이 단순한 사실을 기억하면 함부로 대할 수 있는 사람은 아무도 없습니다.","c":"오늘 나를 아끼는 그 마음으로, 다른 이도 아끼겠습니다."},{"t":"경계","q":"잠자기를 좋아하고, 모여서 떠들기를 좋아하며, 게으르고 쉽게 화를 내는 사람, 이것이 파멸의 문이다.","s":"『숫타니파타』 제96게, 「파멸의 경(Parābhava Sutta)」","m":"행복의 경과 짝을 이루는 파멸의 경입니다. 삶이 무너지는 길도 거창한 악행이 아니라 일상의 나쁜 습관에서 시작된다는 경고입니다.","l":"과도한 수면, 의미 없는 수다, 미루기, 짜증. 이것들은 사소해 보이지만 쌓이면 삶을 서서히 무너뜨립니다. 내 일상에 파멸의 문이 열려 있지는 않은지 살펴보세요.","c":"오늘 내 일상에 열린 작은 파멸의 문 하나를 닫겠습니다."},{"t":"비판","q":"남의 허물만 찾고 늘 트집 잡는 이에게는 번뇌가 늘어나니, 그는 번뇌의 소멸에서 멀어진다.","s":"『법구경』 제253게, 「더러움품」","m":"남의 잘못을 찾는 습관은 결국 내 마음을 어지럽힙니다. 비판할수록 마음은 날카로워지고 평화는 멀어집니다.","l":"하루 종일 불만을 말하는 사람 곁에 있으면 지칩니다. 내가 그런 사람이 되어 있지는 않은지 돌아보세요. 트집 하나를 감사 하나로 바꾸면 마음이 달라집니다.","c":"오늘 트집 잡고 싶은 순간, 그 사람의 좋은 점 하나를 찾아보겠습니다."},{"t":"구도","q":"모든 것은 무상하니 이것이 생멸하는 법이다. 생멸이 다 사라지고 나면 고요한 열반이 즐거움이 된다.","s":"『대반열반경』 「성행품(聖行品)」, 설산동자(雪山童子) 이야기","m":"설산에서 수행하던 동자가 나찰에게서 앞의 반 구절을 듣고, 나머지 반 구절을 듣기 위해 자기 몸을 내주기로 약속했다는 이야기입니다. 진리를 향한 간절함을 보여 줍니다.","l":"우리는 무엇을 그토록 간절히 알고 싶어 하나요? 진리를 위해 몸을 던진 동자의 마음까지는 아니어도, 삶의 중요한 질문을 놓지 않는 간절함은 지닐 수 있습니다.","c":"오늘 내 삶의 중요한 질문을 간절히 붙들고 한 걸음 더 다가가겠습니다.","o":"諸行無常 是生滅法 生滅滅已 寂滅爲樂"},{"t":"마음","q":"흔들리고 들뜨며 지키기 어렵고 다스리기 어려운 마음을, 지혜로운 이는 곧게 한다. 화살 만드는 이가 화살대를 곧게 펴듯이.","s":"『법구경』 제33게, 「마음품(心品)」","m":"화살 장인은 굽은 대나무를 불에 쬐고 조금씩 눌러 곧게 폅니다. 마음도 한 번에 바로잡히지 않지만, 인내심 있게 반복하면 반드시 곧아진다는 희망의 가르침입니다.","l":"명상을 해 보면 마음이 얼마나 산만한지 금세 알게 됩니다. 실망할 필요가 없습니다. 흩어진 마음을 알아차리고 다시 데려오는 그 반복이 바로 화살을 곧게 펴는 손길입니다.","c":"마음이 흔들려도 괜찮습니다. 알아차리고 다시 돌아오면, 그것이 오늘의 수행입니다."},{"t":"귀의","q":"부처님과 가르침과 승가에 귀의하여, 바른 지혜로 네 가지 거룩한 진리를 보는 이, 이것이 안온한 의지처요 가장 높은 의지처이다.","s":"『법구경』 제190~192게, 「붓다품」","m":"두려울 때 사람들은 산이나 숲, 나무에 귀의하지만 그것은 참된 의지처가 아니라고 부처님은 말씀하셨습니다. 깨달음과 진리와 함께 수행하는 공동체가 진정한 의지처입니다.","l":"불안할 때 우리는 쉽게 무언가에 기대려 합니다. 소비, 중독, 맹목적인 믿음은 잠시 위로가 되지만 오래가지 않습니다. 진리와 좋은 도반이 참된 의지처입니다.","c":"오늘 나는 흔들리지 않는 의지처, 삼보에 마음을 기댑니다."},{"t":"분노","q":"몸에 퍼진 뱀의 독을 약으로 다스리듯, 치밀어 오르는 분노를 다스리는 수행자는 이 언덕도 저 언덕도 모두 버린다. 뱀이 낡은 허물을 벗어 버리듯.","s":"『숫타니파타』 제1게, 「뱀의 경(Uraga Sutta)」","m":"숫타니파타의 첫 게송입니다. 분노를 몸에 퍼지는 독에 비유하고, 그것을 다스리는 것을 뱀이 허물을 벗는 일에 비유했습니다. 분노를 다스리면 새로운 나로 거듭납니다.","l":"분노는 독처럼 빠르게 퍼집니다. 그러니 퍼지기 전에 바로 알아차리고 해독해야 합니다. 깊은 호흡, 잠시 자리 피하기, 걷기가 좋은 해독제입니다.","c":"오늘 분노라는 낡은 허물을 벗고, 새 살처럼 부드러운 마음으로 살겠습니다."},{"t":"책임","q":"악을 짓는 것도 자신이요, 더럽혀지는 것도 자신이다. 악을 짓지 않는 것도 자신이요, 깨끗해지는 것도 자신이다. 깨끗함과 더러움은 각자에게 달려 있으니, 누구도 남을 깨끗하게 할 수 없다.","s":"『법구경』 제165게, 「자기품」","m":"내 삶의 맑음과 흐림에 대한 책임은 결국 나에게 있습니다. 남 탓도, 남의 구원도 아닌 나의 선택이 나를 만든다는 엄중하면서도 희망찬 가르침입니다.","l":"환경 탓, 부모 탓, 시대 탓을 하고 싶을 때가 있습니다. 그 영향은 분명 있지만, 그 위에서 무엇을 선택할지는 여전히 내 몫입니다. 내가 바꿀 수 있다는 것이 곧 희망입니다.","c":"오늘의 나는 내가 만듭니다. 그래서 나는 오늘을 바꿀 수 있습니다."},{"t":"은혜","q":"오랫동안 떠나 있던 사람이 먼 길에서 무사히 돌아오면 친척과 벗들이 기뻐하며 맞이하듯, 선을 행한 이가 이 세상에서 저 세상으로 가면 그가 지은 공덕이 그를 맞이한다.","s":"『법구경』 제219~220게, 「애정품」","m":"평생 쌓은 선행은 마지막 순간에 가족처럼 나를 맞이해 줍니다. 공덕은 결코 사라지지 않고 나와 함께 간다는 위로의 말씀입니다.","l":"우리가 남기고 갈 수 있는 것은 재산보다 사람들의 마음에 남긴 따뜻함입니다. 오늘의 작은 선행이 먼 훗날 나를 맞이할 벗이 됩니다.","c":"오늘 쌓는 작은 공덕이, 언젠가 나를 반갑게 맞아 줄 것입니다."},{"t":"마음","q":"내 마음은 가을 달과 같아 푸른 못에 맑고 깨끗이 비치네. 무엇에도 견줄 수 없으니 나더러 어떻게 말하라 하는가.","s":"한산(寒山), 『한산시(寒山詩)』","m":"당나라 은둔 시인이자 수행자인 한산의 시입니다. 맑은 마음의 경지는 가을 달처럼 깨끗하여 말로는 다 표현할 수 없다는 뜻입니다.","l":"가을밤 연못에 비친 달을 보면 마음까지 맑아집니다. 내 마음도 본래 그렇게 맑습니다. 복잡한 하루 끝에 잠시 밤하늘을 올려다보세요.","c":"오늘 밤 달을 보며, 내 마음의 맑은 가을 달을 떠올리겠습니다.","o":"吾心似秋月 碧潭淸皎潔 無物堪比倫 敎我如何說"},{"t":"연기","q":"이것이 있으므로 저것이 있고, 이것이 생기므로 저것이 생긴다. 이것이 없으므로 저것이 없고, 이것이 사라지므로 저것이 사라진다.","s":"『잡아함경』 제262경 등, 『맛지마 니까야』(MN 79 등) — 연기(緣起)의 법칙","m":"부처님 깨달음의 핵심인 연기법입니다. 세상의 모든 것은 홀로 존재하지 않고 서로 기대어 생겨나고 사라진다는 진리입니다.","l":"아침에 마신 커피 한 잔에도 농부, 운송하는 사람, 바리스타, 햇빛과 비가 들어 있습니다. 나는 수많은 인연 덕분에 오늘을 삽니다. 그리고 나의 행동도 누군가의 인연이 됩니다.","c":"오늘 나를 있게 한 수많은 인연에 감사하고, 나도 좋은 인연이 되겠습니다.","o":"此有故彼有 此生故彼生 此無故彼無 此滅故彼滅"},{"t":"평가","q":"오로지 비난만 받는 사람이나 오로지 칭찬만 받는 사람은 과거에도 없었고, 미래에도 없을 것이며, 지금도 없다.","s":"『법구경』 제228게, 「분노품」","m":"모든 사람은 칭찬과 비난을 함께 받습니다. 한쪽에만 귀 기울이면 교만해지거나 무너집니다. 둘 다 삶의 일부임을 받아들이라는 가르침입니다.","l":"오늘 받은 악평 하나가 나의 전부가 아니고, 오늘 받은 칭찬 하나도 나의 전부가 아닙니다. 둘 다 적당한 거리에서 바라보면 마음이 균형을 찾습니다.","c":"오늘 들은 칭찬도 비난도, 나를 정의하지 못하게 하겠습니다."},{"t":"말","q":"남이 그대에게 말할 때 다섯 가지 길이 있다. 때에 맞는 말과 때에 맞지 않는 말, 사실인 말과 사실이 아닌 말, 부드러운 말과 거친 말, 이로운 말과 해로운 말, 자애로운 마음의 말과 성낸 마음의 말이다.","s":"『맛지마 니까야』 「톱의 비유 경」(MN 21)","m":"다른 사람의 말을 들을 때 어떤 말이든 올 수 있음을 알라는 가르침입니다. 어떤 말이 오든 내 마음은 자애에 머물러야 한다고 하셨습니다.","l":"동시에 이 다섯 가지는 내가 말할 때의 점검표가 되기도 합니다. 때에 맞는지, 사실인지, 부드러운지, 이로운지, 자애로운지 물어보세요.","c":"오늘 말하기 전에 다섯 가지를 떠올려, 바른 말을 하겠습니다."},{"t":"집착","q":"쇠나 나무나 밧줄로 된 족쇄를 지혜로운 이는 강하다 하지 않는다. 보석과 장신구에 대한 집착, 자식과 아내에 대한 애착이야말로 더 강한 족쇄라고 한다.","s":"『법구경』 제345~346게, 「갈애품」","m":"눈에 보이는 사슬보다 마음의 집착이 훨씬 강하게 우리를 묶습니다. 무엇이 나를 진짜로 묶고 있는지 살피라는 가르침입니다.","l":"우리를 가장 강하게 묶는 것은 감옥이 아니라 '이것 없이는 안 돼'라는 마음입니다. 사랑하는 것을 소중히 하되, 그것 없이는 무너지는 나는 되지 않도록 하세요.","c":"오늘 나를 묶고 있는 보이지 않는 족쇄 하나를 살펴보겠습니다."},{"t":"의지처","q":"자기야말로 자기의 의지처이니, 남이 어찌 의지처가 되랴. 자기를 잘 다스릴 때, 얻기 어려운 의지처를 얻는다.","s":"『법구경』 제160게, 「자기품」","m":"누군가에게 기대는 것은 자연스럽지만, 결국 삶의 가장 깊은 곳에서 나를 지탱하는 것은 잘 다스린 나 자신입니다. 그것은 무엇보다 얻기 어렵고 귀한 의지처입니다.","l":"관계, 직장, 재산은 언제든 변할 수 있습니다. 어떤 상황에서도 나를 일으켜 세울 수 있는 마음의 근력을 기르는 것이 가장 확실한 보험입니다.","c":"오늘 나는 나에게 기댈 수 있는 사람이 되겠습니다."},{"t":"이별","q":"우리는 만날 때에 떠날 것을 염려하는 것과 같이, 떠날 때에 다시 만날 것을 믿습니다.","s":"만해 한용운(萬海韓龍雲) 스님, 「님의 침묵」(『님의 침묵』, 1926)","m":"승려이자 독립운동가였던 만해 스님의 대표 시의 한 구절입니다. 만남에 헤어짐이 있듯 헤어짐에는 다시 만남이 있다는, 회자정리(會者定離)를 넘어선 희망의 노래입니다.","l":"사랑하는 이와의 이별, 소중한 시절과의 작별은 아픕니다. 그러나 떠남이 끝이 아니라 다시 만남의 시작일 수 있습니다. 슬픔 속에서도 믿음을 놓지 마세요.","c":"오늘의 이별 속에서도, 다시 만날 날을 믿겠습니다."},{"t":"중도","q":"여러 인연으로 생겨난 법을 나는 공하다고 말한다. 이것은 또한 임시로 붙인 이름이며, 이것이 곧 중도의 뜻이다.","s":"용수(龍樹), 『중론(中論)』 제24 「관사제품」 제18게","m":"대승불교의 큰 스승 용수보살의 대표적인 게송입니다. 모든 것은 인연으로 생겨나므로 고정된 실체가 없고(공), 그렇다고 아무것도 없는 것도 아니어서(가명) 있음과 없음의 양 극단을 떠난 중도라는 뜻입니다.","l":"'완전히 내 잘못이다'와 '전혀 내 잘못이 아니다' 사이, '모든 게 다 잘될 거야'와 '다 끝났어' 사이에 진실이 있습니다. 극단을 떠나 균형 있게 보는 연습을 해 보세요.","c":"오늘 극단의 생각에서 한 걸음 물러나 중도의 눈으로 보겠습니다.","o":"衆因緣生法 我說卽是空 亦爲是假名 亦是中道義"},{"t":"수용","q":"한 스님이 물었다. \"추위와 더위가 오면 어떻게 피합니까?\" 동산이 말했다. \"어찌 추위도 더위도 없는 곳으로 가지 않는가?\" \"어디가 추위도 더위도 없는 곳입니까?\" \"추울 때는 그대를 철저히 춥게 하고, 더울 때는 그대를 철저히 덥게 하라.\"","s":"『벽암록』 제43칙, 동산 양개(洞山良价)","m":"괴로움을 피할 곳은 따로 없고, 그 괴로움을 피하지 않고 온전히 맞이할 때 오히려 괴로움에서 자유로워진다는 가르침입니다.","l":"힘든 시기를 어떻게든 피하려 하면 더 괴롭습니다. 지금이 겨울이라면 겨울을 온전히 살아 보세요. 피하지 않고 맞이하는 사람에게 겨울은 지나가는 계절일 뿐입니다.","c":"오늘 내게 온 계절을 피하지 않고 온전히 맞이하겠습니다.","o":"寒時寒殺闍黎 熱時熱殺闍黎"},{"t":"알아차림","q":"걸어갈 때는 '걷고 있다'고 알고, 서 있을 때는 '서 있다'고 알며, 앉아 있을 때는 '앉아 있다'고 알고, 누워 있을 때는 '누워 있다'고 안다.","s":"『맛지마 니까야』 「마음챙김의 확립 경(Satipaṭṭhāna Sutta)」(MN 10)","m":"위빠사나 수행의 근본 경전인 염처경의 한 구절입니다. 수행은 특별한 곳에서 하는 것이 아니라, 걷고 서고 앉고 눕는 모든 순간에 깨어 있는 것입니다.","l":"출근길을 걸으며 '걷고 있다'를 느껴 보세요. 발바닥이 땅에 닿는 감각, 바람의 온도. 평범한 순간이 명상의 시간이 됩니다.","c":"오늘 걸을 때는 걷는 줄 알고, 앉을 때는 앉는 줄 알겠습니다."},{"t":"갈애","q":"이 세상의 끈질긴 갈애에 정복된 이에게 슬픔은 비 온 뒤 풀처럼 자란다. 갈애를 이겨 낸 이에게서 슬픔은 연잎 위 물방울처럼 굴러떨어진다.","s":"『법구경』 제335~336게, 「갈애품(愛欲品)」","m":"연잎은 물에 젖지 않아 물방울이 그대로 굴러떨어집니다. 갈애, 곧 끝없이 원하는 마음을 내려놓으면 슬픔이 와도 마음에 스며들지 않는다는 비유입니다.","l":"더 가지려는 마음이 클수록 잃는 것이 아프고 얻지 못한 것이 서럽습니다. 원하는 마음을 조금 내려놓으면 실망도 연잎 위 물방울처럼 가볍게 흘려보낼 수 있습니다.","c":"오늘 내 마음을 연잎처럼, 슬픔이 스며들지 않게 가볍게 두겠습니다."},{"t":"보시","q":"보살은 법에 머무는 바 없이 보시를 행해야 한다. 이른바 형상에 머물지 않고 보시하며, 소리와 향기와 맛과 감촉과 법에 머물지 않고 보시해야 한다.","s":"『금강경』 제4 「묘행무주분(妙行無住分)」","m":"이른바 '무주상보시(無住相布施)'입니다. 준다는 생각, 받는 사람, 주는 물건에 매이지 않고 베풀 때 그 공덕은 허공처럼 한량없다고 하셨습니다.","l":"선물을 주고 고맙다는 말이 없으면 서운해집니다. 보답을 바라지 않고 주는 연습을 해 보세요. 주는 순간의 기쁨이 이미 충분한 보답입니다.","c":"오늘 보답을 바라지 않고, 그저 기쁘게 베풀겠습니다.","o":"菩薩 於法 應無所住 行於布施"},{"t":"성찰","q":"스스로 자신을 일깨우고, 스스로 자신을 살펴라. 자기를 지키고 깨어 있는 수행자는 행복하게 살리라.","s":"『법구경』 제379게, 「비구품」","m":"남이 깨워 주기를 기다리지 말고 스스로 나를 일깨우라는 가르침입니다. 자기 성찰은 누구도 대신할 수 없는 수행입니다.","l":"하루를 마치며 5분만 '오늘 나는 어땠나?'를 돌아보는 습관이 삶을 바꿉니다. 칭찬할 것은 칭찬하고 고칠 것은 부드럽게 다짐하세요.","c":"오늘 밤 잠들기 전, 나에게 조용히 하루를 물어보겠습니다."},{"t":"본질","q":"어떤 사람이 손가락으로 달을 가리켜 보이면, 그 사람은 손가락을 따라 달을 보아야 한다. 만약 손가락을 달로 여긴다면 달도 잃고 손가락도 잃는다.","s":"『대불정수능엄경(능엄경)』 권2","m":"'견지망월(見指忘月)'의 출처입니다. 경전과 가르침은 진리를 가리키는 손가락일 뿐, 손가락에 매이면 정작 달을 보지 못한다는 뜻입니다.","l":"규칙, 형식, 말에 매여 본래의 목적을 잊을 때가 있습니다. 회의를 위한 회의, 형식을 위한 형식. 손가락이 아닌 달을 보세요.","c":"오늘 손가락이 아니라 그것이 가리키는 달을 보겠습니다."},{"t":"말","q":"거칠지 않고, 뜻이 분명하며, 진실한 말을 하여 누구의 마음도 상하게 하지 않는 이, 그를 나는 성자라 부른다.","s":"『법구경』 제408게, 「바라문품」","m":"좋은 말의 세 가지 조건을 담은 게송입니다. 부드럽고, 분명하고, 진실할 것. 이 세 가지를 갖춘 말은 누구도 다치게 하지 않습니다.","l":"솔직함을 핑계로 상처를 주는 말이 있고, 부드러움을 핑계로 진실을 피하는 말이 있습니다. 진실하면서도 부드럽게 말하는 것은 연습이 필요한 기술입니다.","c":"오늘 진실하되 부드럽게, 분명하되 따뜻하게 말하겠습니다."},{"t":"공","q":"색이 공과 다르지 않고 공이 색과 다르지 않으니, 색이 곧 공이요 공이 곧 색이다.","s":"『반야바라밀다심경(반야심경)』","m":"반야심경의 가장 유명한 구절입니다. 형상 있는 모든 것(색)은 고정된 실체가 없고(공), 실체가 없기에 인연 따라 무엇이든 될 수 있다는 뜻입니다.","l":"'공(空)'은 허무가 아니라 가능성입니다. 지금의 어려움도 고정된 것이 아니어서 바뀔 수 있고, 지금의 나도 정해져 있지 않아서 새로워질 수 있습니다.","c":"아무것도 고정되어 있지 않습니다. 그래서 오늘, 모든 것이 가능합니다.","o":"色不異空 空不異色 色卽是空 空卽是色"},{"t":"정성","q":"가난한 여인 난타가 머리카락을 잘라 판 돈으로 올린 작은 등불 하나는, 밤새 바람이 불어도 꺼지지 않았다. 목건련 존자가 끄려 해도 꺼지지 않았다.","s":"『현우경(賢愚經)』 「빈녀난타품(貧女難陀品)」, 빈자일등(貧者一燈) 이야기","m":"왕과 부자들이 올린 수많은 등불은 기름이 다해 꺼졌지만, 가난한 여인이 온 정성을 다해 올린 등불 하나는 꺼지지 않았습니다. 공양의 크기는 정성으로 정해집니다.","l":"큰돈이나 화려한 선물이 아니어도 괜찮습니다. 진심을 담은 작은 편지, 정성스럽게 차린 소박한 밥상이 누군가의 마음에 오래도록 꺼지지 않는 등불이 됩니다.","c":"오늘 작더라도 온 마음을 담아, 꺼지지 않는 등불 하나를 밝히겠습니다."},{"t":"말","q":"쓸모없는 말로 엮은 천 마디 말보다, 듣고 나서 마음이 고요해지는 의미 있는 한 마디가 더 낫다.","s":"『법구경』 제100게, 「천품(述千品)」","m":"말의 가치는 양이 아니라 그것이 가져오는 평화에 있습니다. 한 마디라도 듣는 이의 마음을 고요하게 한다면 천 마디보다 귀합니다.","l":"단체 대화방에는 하루에도 수백 개의 메시지가 쌓이지만, 마음에 남는 건 누군가의 진심 어린 한 문장입니다. 많이 말하기보다 정확하고 따뜻하게 말하는 것이 힘입니다.","c":"오늘 천 마디 대신, 누군가를 편안하게 할 한 마디를 고르겠습니다."},{"t":"원한","q":"\"그가 나를 욕했다, 나를 때렸다, 나를 이겼다, 내 것을 빼앗았다.\" 이런 생각을 품고 있는 이에게 원한은 가라앉지 않는다.","s":"『법구경』 제3게, 「쌍품」","m":"상처받은 기억을 마음속에서 되풀이할수록 원한은 더 단단해집니다. 이 게송은 고통의 원인이 이미 지나간 사건보다 그것을 붙들고 곱씹는 나의 생각에 있음을 짚어 줍니다.","l":"잠들기 전 그날 들은 서운한 말을 몇 번이고 되감아 본 적이 있을 겁니다. 그 말은 한 번 들었지만, 우리는 스스로 열 번을 다시 듣습니다. 생각이 그 장면으로 돌아갈 때 '아, 또 되감고 있구나' 하고 알아차리는 것만으로도 고리는 느슨해집니다.","c":"오늘은 마음속 되감기 버튼을 누르지 않겠습니다. 지나간 장면은 지나간 자리에 두겠습니다."},{"t":"보배","q":"친구가 술에 취해 잠든 사이 그의 옷 속에 값을 매길 수 없는 보배 구슬을 꿰매 주었다. 그는 그것을 모른 채 떠돌며 가난하게 살았다.","s":"『법화경』 「오백제자수기품(五百弟子授記品)」, 옷 속의 보배 구슬(衣裏繫珠) 비유","m":"우리는 이미 귀한 보배, 곧 깨달음의 성품을 지니고 있으면서도 그것을 모른 채 밖에서만 찾아 헤맨다는 비유입니다.","l":"행복과 가치를 밖에서만 찾고 있지는 않나요? 남들의 인정, 더 좋은 조건을 찾아 헤매는 사이 내 안의 보배를 잊고 지냅니다. 이미 가진 것을 먼저 들여다보세요.","c":"내 안에는 이미 귀한 보배가 있습니다. 오늘 그것을 기억하겠습니다."},{"t":"너그러움","q":"한 줌의 소금을 작은 물잔에 넣으면 물이 짜서 마실 수 없다. 그러나 같은 소금을 갠지스강에 넣으면 강물은 짜지지 않는다.","s":"『앙굿따라 니까야』 「소금 덩이 경(Loṇaphala Sutta)」(AN 3.100)","m":"같은 업이라도 마음이 좁은 사람에게는 큰 괴로움이 되고, 마음이 넓은 사람에게는 작은 일로 지나간다는 비유입니다.","l":"같은 실수, 같은 무례함도 마음이 좁을 때는 하루를 망치고, 마음이 넓을 때는 웃고 넘길 수 있습니다. 문제의 크기보다 마음 그릇의 크기가 중요합니다.","c":"오늘 내 마음의 그릇을 강물처럼 넓혀, 소금 한 줌에 흔들리지 않겠습니다."},{"t":"화합","q":"여러 경전의 부분들을 모아 온갖 물줄기를 한맛으로 돌아가게 하고, 부처님 뜻의 지극히 공정함을 열어 백가의 서로 다른 다툼을 화해시킨다.","s":"원효, 『열반종요(涅槃宗要)』 서문 — 원효의 화쟁(和諍) 사상","m":"서로 다른 주장들이 다투어도 각각 일리가 있으니, 그 뜻을 깊이 열어 보면 하나로 화합할 수 있다는 원효 스님의 화쟁 정신입니다.","l":"의견이 다를 때 누가 옳은지만 따지면 다툼은 끝나지 않습니다. 상대 주장의 일리를 먼저 찾아보세요. 많은 갈등이 '둘 다 일리가 있다'는 데서 풀리기 시작합니다.","c":"오늘 나와 다른 의견 속에서 일리를 먼저 찾아보겠습니다.","o":"統衆典之部分 歸萬流之一味 開佛意之至公 和百家之異諍"},{"t":"기쁨","q":"시방의 모든 중생이 지은 공덕은 아무리 작은 것이라도 내가 모두 함께 기뻐하리라.","s":"『화엄경』 「보현행원품(普賢行願品)」, 열 가지 행원 중 '수희공덕(隨喜功德)'","m":"다른 이가 지은 선행과 기쁨을 내 일처럼 함께 기뻐하는 것을 수희(隨喜)라 합니다. 질투 대신 함께 기뻐하는 마음은 그 자체로 큰 공덕입니다.","l":"친구의 승진, 동료의 성공 소식에 마음 한구석이 쓰릴 때가 있습니다. 그럴 때 일부러 진심으로 축하해 보세요. 함께 기뻐하는 순간 질투는 녹고 내 기쁨이 늘어납니다.","c":"오늘 누군가의 좋은 소식을 내 일처럼 기뻐하겠습니다.","o":"隨喜功德"},{"t":"균형","q":"어리석은 사람이 음식에 소금을 조금 넣자 맛이 좋아지는 것을 보고 '소금이 맛을 내는구나' 하며 소금만 한 움큼 먹었다. 입맛만 버리고 도리어 병이 났다.","s":"『백유경(百喩經)』 「어리석은 사람이 소금을 먹은 비유(愚人食鹽喩)」","m":"좋은 것도 적당해야 약이 됩니다. 수행도 지나치면 오히려 해가 된다는 것을 일깨우는 재미있는 비유입니다.","l":"운동이 좋다고 무리하다 다치고, 영양제가 좋다고 과하게 먹고, 일이 좋다고 쉬지 않다가 쓰러집니다. 좋은 것일수록 알맞게 하세요.","c":"오늘 좋은 것이라도 알맞게, 소금처럼 적당히 하겠습니다."},{"t":"고독","q":"홀로 앉고, 홀로 눕고, 홀로 다니며 게으르지 않고, 홀로 자신을 다스리는 이는 숲속에서 즐거움을 누리리라.","s":"『법구경』 제305게, 「여러 가지품」","m":"혼자 있는 시간을 두려워하지 않고 즐길 수 있는 사람은 강합니다. 홀로 있음은 외로움이 아니라 나와 깊이 만나는 시간입니다.","l":"늘 누군가와 연결되어 있어야 불안하지 않은 시대입니다. 하루에 잠깐이라도 휴대폰을 내려놓고 홀로 있어 보세요. 그 시간이 마음을 단단하게 합니다.","c":"오늘 잠시 홀로 있는 시간을 갖고, 그 고요를 즐겨 보겠습니다."},{"t":"자비","q":"약하든 강하든, 길든 짧든, 크든 작든, 보이든 보이지 않든, 가까이 있든 멀리 있든, 살아 있는 모든 존재들이여, 행복하기를.","s":"『숫타니파타』 제146~147게, 「자애경」","m":"자애 명상의 원형이 되는 구절입니다. 어떤 존재도 빠뜨리지 않고 모두의 행복을 비는 마음입니다.","l":"하루를 시작할 때 '나를 만나는 모든 이가 행복하기를' 하고 마음속으로 빌어 보세요. 짧은 기도지만 하루를 대하는 내 마음이 부드러워집니다.","c":"살아 있는 모든 존재들이여, 오늘 행복하소서. 그리고 나도 그 행복의 한 조각이 되겠습니다."},{"t":"나눔","q":"내가 아는 것처럼 사람들이 베풂과 나눔의 결실을 안다면, 그들은 나누지 않고서는 먹지 않을 것이다. 마지막 한 입, 마지막 한 조각이라도 받을 이가 있다면 나누지 않고서는 먹지 않을 것이다.","s":"『이띠웃따까(Itivuttaka)』 제26경","m":"나눔이 가져오는 기쁨과 결실이 얼마나 큰지 안다면 누구라도 기꺼이 나눌 것이라는 말씀입니다. 우리가 나누지 못하는 것은 그 결실을 몰라서입니다.","l":"나눔은 손해가 아니라 투자입니다. 마음의 기쁨, 관계의 깊이, 공동체의 신뢰로 돌아옵니다. 작은 간식 하나라도 나눠 보세요.","c":"오늘 내가 가진 것의 한 조각을 기쁘게 나누겠습니다."},{"t":"위로","q":"아난다여, 누군가 대장장이의 아들 쭌다에게 '그대가 올린 공양 때문에 여래가 열반에 드셨다'며 후회를 일으킬 수 있으니, 그대는 이렇게 말해 그의 후회를 덜어 주어라. '그대의 공양은 큰 공덕이 있다.'","s":"『디가 니까야』 「대반열반경(Mahāparinibbāna Sutta)」(DN 16)","m":"마지막 공양을 드신 뒤 병이 깊어지신 부처님은 그 공양을 올린 쭌다가 자책할 것을 먼저 걱정하셨습니다. 마지막 순간까지 남의 마음을 헤아린 자비입니다.","l":"의도치 않게 일이 잘못되었을 때, 그 일과 관련된 사람이 자책하고 있지는 않은지 먼저 살펴 주세요. 탓하기보다 위로하는 것이 부처님의 마음입니다.","c":"오늘 자책하고 있는 누군가에게 '당신 잘못이 아니에요'라고 말해 주겠습니다."},{"t":"자기다스림","q":"물 대는 이는 물길을 내고, 화살 만드는 이는 화살을 곧게 하며, 목수는 나무를 다듬고, 지혜로운 이는 자기 자신을 다룬다.","s":"『법구경』 제80게, 「현자품」","m":"장인마다 다루는 재료가 있듯, 지혜로운 이가 평생 다듬는 재료는 바로 자기 자신입니다. 수행이란 나를 깎고 다듬는 장인의 일입니다.","l":"우리는 남을 바꾸는 데 많은 에너지를 씁니다. 그러나 가장 확실하게 바꿀 수 있는 작품은 나 자신입니다. 말투 하나, 습관 하나를 다듬는 것이 장인의 작업입니다.","c":"오늘 나라는 작품에서 거친 모서리 하나를 정성스럽게 다듬어 봅니다."},{"t":"멈춤","q":"\"앙굴리말라여, 나는 이미 멈추었다. 그대도 멈추어라.\"","s":"『맛지마 니까야』 「앙굴리말라 경(Aṅgulimāla Sutta)」(MN 86)","m":"수많은 사람을 해친 앙굴리말라가 부처님을 쫓아갔지만 아무리 달려도 따라잡지 못하자 '멈추시오!' 하고 외쳤습니다. 부처님은 '나는 이미 멈추었다, 멈추어야 할 이는 그대'라고 답하셨고, 그는 그 자리에서 칼을 버렸습니다.","l":"우리도 무언가를 쫓으며 숨 가쁘게 달립니다. 더 많은 돈, 더 높은 자리, 더 많은 인정. 잠시 멈추어 보세요. 멈춘 자리에서 비로소 보이는 것이 있습니다.","c":"오늘 숨 가쁘게 달리던 마음을 잠시 멈추겠습니다."},{"t":"인내","q":"코끼리가 전쟁터에서 날아오는 화살을 견디듯, 나는 비난을 참으리라. 세상에는 바르지 못한 사람이 많으니.","s":"『법구경』 제320게, 「코끼리품(象喩品)」","m":"부처님께서 근거 없는 비방을 받으셨을 때 하신 말씀으로 전해집니다. 코끼리처럼 묵묵히 견디는 힘, 그것이 큰 사람의 품격입니다.","l":"억울한 말을 들으면 당장 해명하고 싶어집니다. 그러나 때로는 묵묵히 견디며 시간이 진실을 밝히도록 두는 것이 가장 강한 대응입니다.","c":"오늘 날아오는 화살이 있어도, 코끼리처럼 넉넉히 견디겠습니다."},{"t":"가족","q":"어머니와 아버지를 섬기고, 아내와 자식을 돌보며, 하는 일에 질서가 있는 것, 이것이 더없는 행복이다.","s":"『숫타니파타』 제262게, 「위없는 행복의 경」","m":"최고의 행복이 먼 곳에 있지 않고 가족을 돌보고 자기 일을 차근차근 해 나가는 일상 속에 있다는 소박하고 깊은 가르침입니다.","l":"거창한 성공보다 부모님과의 저녁 식사, 아이와의 산책, 잘 정리된 하루가 더 큰 행복일 수 있습니다. 행복은 일상 속에 있습니다.","c":"오늘 가족을 돌보고 내 일을 차근차근 해내는 행복을 누리겠습니다."},{"t":"배움","q":"배우지 않는 사람은 황소처럼 늙어 간다. 살은 찌지만 지혜는 자라지 않는다.","s":"『법구경』 제152게, 「늙음품」","m":"나이를 먹는 것과 성숙하는 것은 다릅니다. 배움과 성찰이 없으면 몸만 늙고 마음은 그대로라는 따끔한 일침입니다.","l":"평생 학습의 시대라고 하지만, 진짜 배움은 자격증이 아니라 어제보다 조금 더 너그럽고 지혜로워지는 것입니다. 나이 들수록 더 배우려는 사람은 늙어도 늙지 않습니다.","c":"오늘 새로운 것 하나를 배우겠습니다. 마음은 나이 들지 않습니다."},{"t":"평정","q":"얻음과 잃음, 명예와 불명예, 칭찬과 비난, 즐거움과 괴로움. 이 여덟 가지 세상의 법은 사람을 따라다니고, 사람은 이것들을 따라 돈다.","s":"『앙굿따라 니까야』 「세상의 법 경(Lokadhamma Sutta)」(AN 8.5~6)","m":"이른바 '팔풍(八風)'입니다. 누구의 삶에도 이 여덟 가지 바람이 번갈아 붑니다. 지혜로운 이는 이것이 무상함을 알아 그 바람에 휩쓸리지 않습니다.","l":"오늘은 칭찬을, 내일은 비난을 받을 수 있습니다. 바람은 늘 바뀝니다. 바람이 바뀔 때마다 내 마음도 함께 뒤집히지 않도록 중심을 지키세요.","c":"오늘 어떤 바람이 불어도, 나는 내 중심을 지키겠습니다."},{"t":"보시","q":"인색한 이는 천상에 이르지 못하고, 어리석은 이는 베풂을 칭찬하지 않는다. 지혜로운 이는 베풂을 기뻐하여 그로 인해 저 세상에서도 행복하다.","s":"『법구경』 제177게, 「세상품」","m":"베풂은 받는 이뿐 아니라 주는 이를 행복하게 합니다. 지혜로운 이는 남의 베풂도 함께 기뻐합니다.","l":"기부 소식을 들으면 '얼마나 벌길래' 하는 마음보다 '좋은 일이다' 하고 기뻐해 보세요. 남의 선행을 기뻐하는 것만으로도 공덕이 된다고 합니다.","c":"오늘 남의 선행을 진심으로 기뻐하고, 나도 작게 베풀겠습니다."},{"t":"행위","q":"태생에 의해 천한 사람이 되는 것이 아니며, 태생에 의해 고귀한 사람이 되는 것도 아니다. 행위에 의해 천한 사람도 되고, 행위에 의해 고귀한 사람도 된다.","s":"『숫타니파타』 제136게, 「천한 사람의 경(Vasala Sutta)」","m":"카스트 제도가 엄격하던 시대에 부처님이 하신 혁명적 선언입니다. 사람의 가치는 어디서 태어났느냐가 아니라 어떻게 행동하느냐로 결정됩니다.","l":"우리 사회에도 보이지 않는 계급이 있습니다. 그러나 진정한 고귀함은 직업이나 출신이 아니라 매일의 행동에서 나옵니다. 누구나 고귀해질 수 있습니다.","c":"오늘 나의 행동으로, 고귀한 사람이 되겠습니다."},{"t":"덕","q":"선한 이는 히말라야 설산처럼 멀리서도 빛나고, 악한 이는 밤에 쏜 화살처럼 가까이 있어도 보이지 않는다.","s":"『법구경』 제304게, 「여러 가지품」","m":"선한 사람은 스스로 드러내지 않아도 멀리까지 빛나고, 악한 사람은 아무리 가까이 있어도 그 존재가 어둠 속에 묻힌다는 뜻입니다.","l":"묵묵히 좋은 일을 하는 사람은 홍보하지 않아도 결국 알려집니다. 진정한 존재감은 목소리 크기가 아니라 꾸준한 선함에서 나옵니다.","c":"오늘 드러내지 않아도 빛나는 선함을 조용히 쌓아 가겠습니다."},{"t":"참회","q":"이미 지은 악업을 선업으로 덮는 이는, 구름을 벗어난 달처럼 이 세상을 비춘다.","s":"『법구경』 제173게, 「세상품」","m":"사람을 죽이던 앙굴리말라가 출가해 성자가 된 뒤 읊은 것으로 전해지는 게송입니다. 지난 잘못에 갇히지 말고 선한 행으로 삶을 다시 채워 나가라는 희망의 메시지입니다.","l":"실수와 잘못이 없는 사람은 없습니다. 중요한 것은 자책에 머무르는 것이 아니라, 그 자리를 선한 행동으로 채워 나가는 것입니다. 잘못을 인정하고 다시 바르게 살면, 그 변화가 곧 빛이 됩니다.","c":"오늘 지난 실수를 자책하는 대신, 그 자리에 선한 일 하나를 심겠습니다."},{"t":"열린마음","q":"오직 모를 뿐.","s":"숭산 행원(崇山行願) 스님의 가르침","m":"한국 선불교를 세계에 알린 숭산 스님이 늘 강조한 말씀입니다. '모른다'는 마음은 무지가 아니라 선입견 없이 지금을 맑게 보는 마음입니다.","l":"우리는 너무 빨리 '안다'고 결론 내립니다. 그 사람은 원래 그래, 이 일은 안 될 거야. '오직 모를 뿐'의 마음으로 보면 새로운 가능성이 열립니다.","c":"오늘 섣불리 안다고 하지 않고, 모르는 마음으로 새롭게 보겠습니다."},{"t":"선행","q":"선한 일은 서둘러 하고, 마음을 악에서 지켜라. 선을 행하는 데 느린 이의 마음은 악을 즐기게 된다.","s":"『법구경』 제116게, 「악품(惡行品)」","m":"좋은 마음이 일어났을 때 바로 행하지 않으면 그 마음은 곧 식어 버립니다. 선한 충동을 미루지 말고 즉시 실천하라는 가르침입니다.","l":"'나중에 연락해야지', '다음에 기부해야지' 하는 마음은 대부분 다음이 오지 않습니다. 떠오른 순간 감사 문자를 보내고, 떠오른 순간 손을 내미는 것이 선을 지키는 방법입니다.","c":"오늘 떠오르는 좋은 마음은 미루지 않고 바로 행하겠습니다."},{"t":"자비","q":"모든 생명은 폭력을 두려워하고, 모든 생명에게 삶은 소중하다. 자기에게 비추어 남을 해치지도 말고 해치게 하지도 말라.","s":"『법구경』 제130게, 「폭력품」","m":"내 삶이 소중하듯 모든 생명의 삶이 소중합니다. 작은 벌레 하나에도 살고 싶은 마음이 있다는 것을 아는 것이 자비입니다.","l":"길고양이, 반려동물, 작은 곤충, 그리고 우리가 먹는 음식이 된 생명까지. 모든 생명이 소중하다는 마음으로 대하면 일상의 많은 선택이 달라집니다.","c":"오늘 작은 생명 하나도 소중히 대하겠습니다."},{"t":"깨달음","q":"환인 줄 알면 곧 떠난 것이니 따로 방편을 지을 필요가 없고, 환을 떠나면 곧 깨달음이니 따로 차례가 없다.","s":"『대방광원각수다라요의경(원각경)』 「보현보살장」","m":"허상인 줄 알아차리는 그 순간 이미 그것에서 벗어난 것이라는 가르침입니다. 알아차림 자체가 해방입니다.","l":"불안한 생각에 휩쓸리다가 '아, 이건 그냥 생각이구나' 하고 알아차리는 순간, 그 생각의 힘이 빠집니다. 알아차림이 곧 자유입니다.","c":"오늘 나를 휘두르는 생각이 오면, '이건 생각일 뿐'이라고 알아차리겠습니다.","o":"知幻卽離 不作方便 離幻卽覺 亦無漸次"},{"t":"비난","q":"이것은 예부터 그러했다. 침묵하고 앉아 있어도 비난받고, 말을 많이 해도 비난받고, 적게 해도 비난받는다. 이 세상에 비난받지 않는 이는 없다.","s":"『법구경』 제227게, 「분노품」","m":"아무리 잘해도 누군가는 비난합니다. 이것은 세상의 오래된 이치입니다. 모두에게 인정받으려는 마음을 내려놓으라는 위로의 말씀입니다.","l":"무엇을 해도 말이 나오는 세상입니다. 모두를 만족시키려다 지치기보다, 비난은 원래 피할 수 없는 것임을 알고 내 양심에 부끄럽지 않게 사는 것이 중요합니다.","c":"비난받았다고 내가 틀린 것은 아닙니다. 오늘도 내 길을 담담히 가겠습니다."},{"t":"염불","q":"아미타불이 어디에 계신가. 마음에 붙들어 두고 간절히 잊지 말라. 생각하고 생각하여 생각이 다한 곳에 이르면, 여섯 문에서 늘 자줏빛 금빛 광명이 빛나리라.","s":"나옹 혜근, 누이에게 준 게송, 『나옹화상어록』","m":"수행을 청한 누이에게 나옹 선사가 염불을 권하며 준 게송입니다. 한마음으로 간절히 이어 가다 보면 생각마저 끊어진 자리에서 온몸이 빛난다는 가르침입니다.","l":"한 가지에 온 마음을 모으는 것은 그 자체로 수행입니다. 기도든 일이든 공부든, 간절히 이어 가다 보면 잡념이 사라지고 마음이 환해지는 순간이 옵니다.","c":"오늘 한 가지에 온 마음을 모아, 간절하게 이어 가겠습니다.","o":"阿彌陀佛在何方 着得心頭切莫忘 念到念窮無念處 六門常放紫金光"},{"t":"평정","q":"얻고 잃는 것은 인연을 따르니, 마음에는 늘고 줆이 없다.","s":"보리달마, 『이입사행론(二入四行論)』 수연행(隨緣行)","m":"좋은 일도 나쁜 일도 모두 인연 따라 오고 가는 것이니, 그에 따라 마음이 들뜨거나 무너질 필요가 없다는 가르침입니다.","l":"성과급을 받은 날과 손해를 본 날, 내 마음이 롤러코스터를 타지 않게 해 보세요. 얻음과 잃음은 바람처럼 오가지만 내 마음의 중심은 그대로일 수 있습니다.","c":"오늘 얻는 것이 있어도 잃는 것이 있어도, 내 마음은 늘지도 줄지도 않습니다.","o":"得失從緣 心無增減"},{"t":"삼업","q":"말을 삼가고, 마음을 잘 다스리며, 몸으로 악을 짓지 말라. 이 세 가지 업의 길을 깨끗이 하면 성자가 설한 길에 이르리라.","s":"『법구경』 제281게, 「길품」","m":"말과 마음과 몸, 이 세 가지를 깨끗이 하는 것이 곧 깨달음의 길입니다. 특별한 비법이 아니라 일상의 정직한 실천입니다.","l":"오늘 하루를 돌아보며 말로 상처 준 일, 마음으로 미워한 일, 몸으로 잘못한 일이 없었는지 살펴보세요. 그 세 가지를 맑히는 것이 수행입니다.","c":"오늘 말과 마음과 몸, 세 가지 길을 깨끗이 하겠습니다."},{"t":"본래","q":"보리는 본래 나무가 없고, 밝은 거울 또한 받침대가 아니다. 본래 한 물건도 없거늘 어디에 먼지가 일어나랴.","s":"육조 혜능(慧能), 『육조단경(六祖壇經)』 「행유품」","m":"방앗간에서 일하던 나무꾼 출신 혜능이 오조 홍인 대사 앞에서 지은 게송입니다. 마음은 본래 깨끗하여 닦아 낼 먼지조차 없다는 '본래무일물(本來無一物)'의 가르침으로 육조가 되었습니다.","l":"우리는 늘 무언가를 더 갖추고 고쳐야 한다고 생각합니다. 하지만 본래의 나는 이미 온전합니다. 부족함을 채우려 애쓰기 전에, 본래 괜찮은 나를 먼저 믿어 주세요.","c":"나는 본래 온전합니다. 오늘은 그 사실을 믿으며 가볍게 시작하겠습니다.","o":"菩提本無樹 明鏡亦非臺 本來無一物 何處惹塵埃"},{"t":"업","q":"어리석은 이는 자기 자신에게 원수처럼 행동하며 다닌다. 쓰디쓴 열매를 맺을 나쁜 업을 스스로 짓는다.","s":"『법구경』 제66게, 「어리석은 이품」","m":"어리석음이란 남보다 먼저 자기 자신을 해치는 일입니다. 쓴 열매를 맺을 씨앗을 스스로 심는 것과 같습니다.","l":"밤샘, 폭음, 무리한 지출처럼 미래의 나를 괴롭히는 선택을 우리는 종종 합니다. 미래의 나도 소중한 사람입니다. 그에게 원수가 되지 마세요.","c":"오늘 나는 미래의 나에게 좋은 친구가 되는 선택을 하겠습니다."},{"t":"벗","q":"총명하고 바르게 살며 지혜로운 벗을 만난다면, 모든 위험을 이겨 내고 기쁘게 깨어서 그와 함께 가라.","s":"『숫타니파타』 제45게, 「무소의 뿔 경」","m":"'무소의 뿔처럼 혼자서 가라'는 경전 안에 있는 구절입니다. 혼자 가라는 가르침은 좋은 벗을 거부하라는 뜻이 아닙니다. 좋은 벗을 만나면 기쁘게 함께 가라고 하십니다.","l":"혼자서도 설 수 있는 사람이 좋은 동행을 만나면 두 배로 강해집니다. 의존이 아닌 동행, 그것이 건강한 관계입니다.","c":"오늘 좋은 벗과 함께 걷는 기쁨에 감사하겠습니다."},{"t":"진실","q":"어리석은 이여, 땋은 머리가 무슨 소용이며 사슴 가죽 옷이 무슨 소용인가. 그대의 안은 거친 숲과 같은데 겉만 닦고 있구나.","s":"『법구경』 제394게, 「바라문품」","m":"겉모습만 수행자처럼 꾸미고 속은 그대로인 사람을 꾸짖는 게송입니다. 중요한 것은 외양이 아니라 내면의 변화입니다.","l":"보이는 모습에 공을 들이는 시대입니다. 그러나 사진 속 모습보다 아무도 보지 않을 때의 내가 진짜 나입니다.","c":"오늘 겉보다 속을 닦는 데 조금 더 마음을 쓰겠습니다."},{"t":"보시","q":"재물이 없어도 베풀 수 있는 일곱 가지가 있다. 부드러운 눈길, 온화하고 기쁜 얼굴, 다정한 말, 몸으로 돕는 일, 따뜻한 마음, 자리를 내어 주는 일, 쉴 곳을 내어 주는 일이다.","s":"『잡보장경(雜寶藏經)』 권6, 무재칠시(無財七施)","m":"'가진 것이 없어 베풀 수 없다'는 이에게 부처님이 알려 주신 일곱 가지 보시입니다. 누구나 지금 당장 베풀 수 있는 것들입니다.","l":"지하철에서 자리를 양보하는 것, 엘리베이터에서 웃으며 인사하는 것, 길 묻는 사람에게 친절히 알려 주는 것도 훌륭한 보시입니다. 돈이 없어도 우리는 부자처럼 베풀 수 있습니다.","c":"오늘 일곱 가지 중 하나를 골라, 돈 들지 않는 보시를 하겠습니다.","o":"無財七施"},{"t":"재물","q":"재산을 넷으로 나누어, 한 몫으로는 생활을 누리고, 두 몫으로는 일에 쓰며, 남은 한 몫은 어려울 때를 대비해 모아 두라.","s":"『디가 니까야』 「시갈로바다 경」(DN 31)","m":"부처님이 재가자에게 주신 구체적인 재정 지침입니다. 불교는 재물을 무조건 멀리하라 하지 않고 바르게 벌고 지혜롭게 쓰라고 가르칩니다.","l":"2,500년 전의 가르침이지만 오늘날의 재무 설계와 놀랍도록 닮았습니다. 쓰고, 투자하고, 저축하는 균형이 마음의 평화도 지켜 줍니다.","c":"오늘 나의 쓰임새를 돌아보고, 지혜로운 균형을 찾아보겠습니다."},{"t":"평상심","q":"조주가 남전에게 물었다. \"도란 무엇입니까?\" 남전이 답했다. \"평상심이 도이다.\"","s":"『무문관』 제19칙, 남전 보원(南泉普願)과 조주의 문답 (마조 도일의 가르침에서 비롯됨)","m":"도는 특별한 곳에 있지 않고 배고프면 먹고 피곤하면 자는 평범한 마음에 있다는 가르침입니다. 꾸밈없는 일상의 마음이 곧 도입니다.","l":"특별한 경험, 대단한 성취를 쫓다 보면 평범한 하루가 시시해 보입니다. 그러나 평범한 하루를 담담하게 잘 사는 것이야말로 가장 깊은 수행입니다.","c":"오늘 특별하지 않은 하루를, 평상심으로 담담하게 잘 살겠습니다.","o":"平常心是道"},{"t":"깨어있음","q":"꽃을 꺾는 데만 마음을 빼앗긴 이를 죽음이 데려간다. 잠든 마을을 큰 홍수가 휩쓸어 가듯이.","s":"『법구경』 제47게, 「꽃품」","m":"감각적인 즐거움에만 빠져 있으면 삶의 중요한 순간들이 홍수처럼 지나가 버린다는 경고입니다. 깨어 있어야 소중한 것을 지킬 수 있습니다.","l":"즐거움을 누리는 것은 좋습니다. 그러나 즐거움에만 몰두하는 사이 건강 검진, 가족과의 대화, 미뤄 둔 화해가 계속 뒤로 밀려나고 있지는 않은지 살펴볼 일입니다.","c":"오늘 즐거움 속에서도 깨어 있어, 놓쳐서는 안 될 것을 챙기겠습니다."},{"t":"청정","q":"연잎 위의 물방울처럼, 바늘 끝의 겨자씨처럼, 감각적 욕망에 물들지 않는 이, 그를 나는 성자라 부른다.","s":"『법구경』 제401게, 「바라문품」","m":"연잎 위의 물방울은 연잎에 스며들지 않고, 바늘 끝의 겨자씨는 머물지 못합니다. 세상 속에 살면서도 세상에 물들지 않는 마음을 비유한 것입니다.","l":"유혹이 넘치는 세상을 떠날 수는 없습니다. 그러나 그 속에서도 휩쓸리지 않는 중심을 지킬 수 있습니다. 즐기되 빠지지 않는 것, 그것이 연잎의 지혜입니다.","c":"오늘 세상 속에 있으면서도 연잎처럼 물들지 않겠습니다."},{"t":"고통","q":"첫 번째 화살을 맞은 뒤 두 번째 화살을 맞지 않는 것과 같다. 배우지 못한 범부는 괴로운 느낌이 오면 근심하고 슬퍼하며 울부짖는다. 그는 몸과 마음, 두 가지 괴로움을 겪는다.","s":"『상윳따 니까야』 「화살 경(Sallatha Sutta)」(SN 36.6), 한역 『잡아함경』 제470경","m":"유명한 '두 번째 화살'의 비유입니다. 고통스러운 일(첫 번째 화살)은 피할 수 없지만, 그것에 대한 걱정과 자책(두 번째 화살)은 스스로 쏘는 것입니다.","l":"실수를 한 것은 첫 번째 화살입니다. '나는 왜 이 모양일까' 하는 자책은 두 번째 화살입니다. 아픈 것은 아파도, 거기에 화살을 더 쏘지는 마세요.","c":"오늘 첫 번째 화살은 받아들이고, 두 번째 화살은 쏘지 않겠습니다."},{"t":"실천","q":"경전을 아무리 많이 외워도 실천하지 않는 게으른 이는, 남의 소를 세어 주는 목동과 같아 수행자의 결실을 나누지 못한다.","s":"『법구경』 제19게, 「쌍품」","m":"남의 소를 세는 목동은 소의 수를 정확히 알지만 우유 한 잔도 마시지 못합니다. 좋은 가르침도 머리로만 알면 그 결실은 내 것이 되지 않는다는 비유입니다.","l":"자기계발서를 수십 권 읽고, 좋은 강연을 저장해 두고, 명언을 공유하지만 정작 생활은 그대로인 경우가 많습니다. 아는 것 열 가지보다 오늘 해 보는 한 가지가 삶을 바꿉니다.","c":"오늘 읽은 이 한 구절을 하루에 한 번이라도 실제로 살아 보겠습니다."},{"t":"자비","q":"수자타가 바친 우유죽 한 그릇을 드시고 기운을 차린 고따마는, 그날 밤 보리수 아래에서 깨달음을 이루었다.","s":"『자타카(본생경)』 인연 이야기(Nidānakathā), 『불본행집경』 등에 전하는 성도 이야기","m":"6년 고행으로 쇠약해진 싯다르타가 마을 처녀 수자타의 공양을 받고 기력을 회복한 일은 고행을 버리고 중도로 나아간 전환점이었습니다. 한 사람의 소박한 친절이 위대한 깨달음을 도왔습니다.","l":"우리가 건네는 따뜻한 밥 한 끼, 차 한 잔이 누군가에게는 다시 일어설 힘이 됩니다. 작은 친절이 어떤 큰일을 돕게 될지 우리는 알 수 없습니다.","c":"오늘 누군가에게 수자타의 우유죽 같은 작은 친절을 건네겠습니다."},{"t":"효","q":"이 세상에서 어머니를 공경하는 것은 행복이요, 아버지를 공경하는 것은 행복이다. 수행자를 공경하는 것은 행복이요, 성자를 공경하는 것은 행복이다.","s":"『법구경』 제332게, 「코끼리품」","m":"부모를 공경하는 것을 의무가 아니라 '행복'이라고 말씀하신 점이 인상적입니다. 공경하는 마음은 받는 이뿐 아니라 그 마음을 낸 이를 행복하게 합니다.","l":"바쁘다는 이유로 부모님께 연락이 뜸해지기 쉽습니다. 짧은 안부 전화 한 통이 부모님의 하루를, 그리고 나의 하루를 따뜻하게 합니다.","c":"오늘 부모님 혹은 나를 길러 준 분께 안부를 전하겠습니다."},{"t":"벗","q":"언제나 틈만 엿보며 허물을 찾는 이는 벗이 아니다. 아이가 어머니 품에 기대듯 믿고 기댈 수 있고, 남이 갈라놓을 수 없는 이, 그가 참된 벗이다.","s":"『숫타니파타』 제255게, 「부끄러움의 경(Hiri Sutta)」","m":"참된 벗과 거짓 벗을 구별하는 기준입니다. 내 약점을 노리는 사람이 아니라, 아이가 어머니 품에 안기듯 편히 기댈 수 있는 사람이 진정한 벗입니다.","l":"내 실수를 기다렸다는 듯이 지적하는 사람보다, 힘들 때 아무 말 없이 곁에 있어 주는 사람이 진짜 친구입니다. 나도 누군가에게 그런 품이 되어 주세요.","c":"오늘 나는 누군가가 편히 기댈 수 있는 품이 되겠습니다."},{"t":"청정","q":"구름 없는 달처럼 깨끗하고 맑으며, 고요하고 흐림이 없는 이, 그를 나는 성자라 부른다.","s":"『법구경』 제413게, 「바라문품」","m":"구름이 걷힌 밤하늘의 달처럼 번뇌가 걷힌 마음은 본래의 밝음을 드러냅니다. 맑음은 새로 만드는 것이 아니라 가린 것을 걷어 내는 것입니다.","l":"오늘 밤 달을 한번 올려다보세요. 구름이 가려도 달은 늘 그 자리에 있습니다. 내 마음의 밝음도 걱정이라는 구름 뒤에 그대로 있습니다.","c":"내 마음의 달은 늘 밝습니다. 오늘 구름 하나를 걷어 내겠습니다."},{"t":"호흡","q":"숨을 길게 들이쉴 때는 '길게 들이쉰다'고 알고, 길게 내쉴 때는 '길게 내쉰다'고 안다. 짧게 들이쉴 때는 '짧게 들이쉰다'고 알고, 짧게 내쉴 때는 '짧게 내쉰다'고 안다.","s":"『맛지마 니까야』 「들숨날숨에 마음챙김 경(Ānāpānasati Sutta)」(MN 118)","m":"호흡 명상의 기본 가르침입니다. 숨은 언제나 지금 여기에 있으므로, 숨을 알아차리는 것은 지금 이 순간으로 돌아오는 가장 쉬운 방법입니다.","l":"불안하거나 화가 날 때 호흡은 짧고 거칠어집니다. 그때 숨을 알아차리고 천천히 길게 내쉬어 보세요. 몸이 먼저 안정되고 마음이 따라옵니다.","c":"오늘 마음이 흔들릴 때마다 세 번의 긴 호흡으로 돌아오겠습니다."},{"t":"깨달음","q":"홀연히 '콧구멍 없는 소'라는 말을 듣고, 문득 깨달으니 삼천대천세계가 바로 나의 집이로다. 유월 연암산 아랫길에 들사람 일 없이 태평가를 부르네.","s":"경허 성우(鏡虛惺牛), 오도송(悟道頌)","m":"근대 한국 선불교를 중흥시킨 경허 스님이 깨달음을 얻고 읊은 노래입니다. 깨닫고 나니 온 세상이 내 집이요, 아무 걱정 없이 노래하는 자유로운 경지를 보여 줍니다.","l":"우리는 작은 내 공간, 내 사람, 내 것에만 마음을 둡니다. 시야를 넓히면 온 세상이 나와 이어진 집입니다. 그렇게 보면 걱정도 작아지고 노래가 나옵니다.","c":"오늘 온 세상을 내 집처럼 여기며, 가벼운 마음으로 노래하듯 살겠습니다.","o":"忽聞人語無鼻孔 頓覺三千是我家 六月燕巖山下路 野人無事太平歌"},{"t":"마음","q":"마음이 일어나면 갖가지 법이 일어나고, 마음이 사라지면 토굴과 무덤이 둘이 아니다.","s":"원효(元曉) 대사의 깨달음 이야기, 찬녕 『송고승전(宋高僧傳)』 권4 「의상전」 (해골물 이야기는 후대 『임간록』 등의 전승)","m":"당나라 유학길에 비를 피해 토굴인 줄 알고 편히 잔 곳이 무덤이었음을 알자 다음 날 밤 귀신 꿈에 시달린 원효는, 모든 것이 마음에서 비롯됨을 깨닫고 유학을 접었습니다. 후대에는 밤에 달게 마신 물이 해골 물이었다는 이야기로 널리 전해졌습니다.","l":"같은 물이 어젯밤에는 달았고 오늘 아침에는 역겨웠습니다. 바뀐 것은 물이 아니라 마음입니다. 오늘 나를 괴롭히는 일도, 사실은 그것을 바라보는 마음이 만든 것인지 모릅니다.","c":"오늘 세상을 바꾸기 전에, 세상을 보는 내 마음을 먼저 살피겠습니다.","o":"心生故種種法生 心滅故龕墳不二"},{"t":"믿음","q":"믿음은 도의 근원이요 공덕의 어머니라, 모든 선한 법을 길러 낸다.","s":"『화엄경』 「현수품(賢首品)」","m":"모든 수행과 선행은 믿음에서 시작됩니다. 믿음은 어머니가 자식을 기르듯 모든 좋은 것을 키워 낸다는 가르침입니다.","l":"나 자신에 대한 믿음, 사람에 대한 믿음, 좋은 일은 반드시 열매 맺는다는 믿음이 있어야 무엇이든 시작할 수 있습니다. 믿음이 흔들릴 때는 작은 성공 하나를 기억해 보세요.","c":"오늘 나와 세상에 대한 믿음을 다시 일으켜 세우겠습니다.","o":"信爲道元功德母 長養一切諸善法"},{"t":"등불","q":"무엇을 웃고 무엇을 기뻐하랴, 세상은 늘 불타고 있는데. 어둠에 덮여 있으면서 그대는 왜 등불을 찾지 않는가.","s":"『법구경』 제146게, 「늙음품(老耄品)」","m":"늙음, 병, 죽음이라는 불길 속에 있으면서도 헛된 즐거움에만 마음을 빼앗기는 우리에게 던지는 질문입니다. 어둠을 탓하기보다 스스로 등불을 찾으라는 촉구입니다.","l":"마음이 어두울 때 우리는 더 자극적인 오락으로 그것을 덮으려 합니다. 그러나 필요한 것은 더 많은 소음이 아니라 나를 비춰 줄 등불, 곧 지혜와 성찰입니다.","c":"오늘 내 마음에 작은 등불 하나를 켜는 시간을 갖겠습니다."},{"t":"일상","q":"손을 씻을 때는 마땅히 원하오니, 모든 중생이 깨끗한 손을 얻어 부처님 법을 받아 지니기를.","s":"『화엄경』 「정행품(淨行品)」","m":"정행품에는 일상의 모든 행동을 할 때 중생을 위해 발원하는 140여 가지 원이 담겨 있습니다. 손을 씻는 평범한 순간도 자비의 기도가 될 수 있습니다.","l":"하루에 몇 번씩 손을 씻습니다. 그때마다 '모든 이의 손이 깨끗하고 좋은 일을 하기를' 하고 빌어 보세요. 평범한 습관이 하루에 여러 번의 기도가 됩니다.","c":"오늘 손을 씻을 때마다, 모든 이의 행복을 함께 빌겠습니다.","o":"以水盥掌 當願衆生 得淸淨手 受持佛法"},{"t":"벗","q":"나쁜 벗과 사귀지 말고, 저열한 이와 사귀지 말라. 좋은 벗과 사귀고, 훌륭한 이와 사귀어라.","s":"『법구경』 제78게, 「현자품」","m":"사람은 함께하는 이를 닮아 갑니다. 누구와 어울리느냐가 내가 어떤 사람이 될지를 결정한다는 가르침입니다.","l":"자주 만나는 다섯 사람의 평균이 나라는 말이 있습니다. 나를 성장시키는 사람, 함께 있으면 좋은 사람이 되고 싶어지는 사람을 곁에 두세요.","c":"오늘 내 곁의 인연들을 돌아보고, 좋은 벗과의 시간을 늘리겠습니다."},{"t":"마음","q":"어머니도 아버지도, 그 어떤 친척도 해 줄 수 없는 더 큰 이익을, 바르게 향한 마음은 자기에게 가져다준다.","s":"『법구경』 제43게, 「마음품」","m":"앞 게송과 짝을 이루는 구절입니다. 그릇된 마음이 가장 큰 적이라면, 바르게 세운 마음은 가장 든든한 후원자입니다. 누구도 대신 줄 수 없는 선물을 나 스스로 줄 수 있다는 뜻입니다.","l":"아무리 좋은 조언과 지원을 받아도 결국 마음을 일으키는 것은 나 자신입니다. 반대로, 아무것도 갖추지 못한 상황에서도 마음을 바르게 세운 사람은 길을 찾아냅니다.","c":"오늘 내 마음이 나의 가장 좋은 벗이 되도록, 따뜻하게 방향을 잡아 봅니다."},{"t":"침묵","q":"문수보살이 \"둘이 아닌 법문에 드는 것이 무엇입니까?\" 하고 묻자, 유마거사는 아무 말 없이 잠잠히 있었다. 문수보살이 감탄했다. \"참으로 둘이 아닌 법문에 들었도다.\"","s":"『유마경』 「입불이법문품(入不二法門品)」","m":"'유마의 침묵(維摩一默)'으로 유명한 장면입니다. 진리는 말로 다 담을 수 없으며, 때로는 침묵이 가장 깊은 대답이 된다는 가르침입니다.","l":"모든 질문에 말로 답해야 하는 것은 아닙니다. 슬퍼하는 이 곁에서의 침묵, 다툼 앞에서의 침묵이 백 마디 말보다 깊을 때가 있습니다.","c":"오늘 말보다 깊은 침묵의 힘을 믿어 보겠습니다."},{"t":"자기","q":"자기를 바로 봅시다.","s":"퇴옹 성철(退翁性徹) 스님, 1982년 부처님오신날 법어의 제목","m":"성철 스님이 남긴 짧지만 깊은 법어입니다. 모든 문제의 답은 밖이 아니라 나를 바르게 보는 데 있다는 가르침입니다.","l":"남의 잘못, 세상의 문제를 말하기는 쉽습니다. 그러나 가장 먼저 그리고 가장 정직하게 보아야 할 것은 나 자신입니다. 나를 바로 보면 남도 바로 보입니다.","c":"오늘 남을 보기 전에, 나를 바로 보겠습니다."},{"t":"진리","q":"화려하게 꾸민 왕의 수레도 낡고, 이 몸도 늙어 간다. 그러나 선한 이들의 진리는 늙지 않는다. 선한 이들은 선한 이들에게 이를 전한다.","s":"『법구경』 제151게, 「늙음품」","m":"모든 것이 낡아 가지만 진리와 선한 가르침은 세대를 넘어 전해지며 결코 늙지 않습니다. 우리가 남길 수 있는 가장 오래가는 것입니다.","l":"비싼 물건도 유행이 지나면 낡습니다. 그러나 부모님께 배운 정직, 스승께 배운 성실은 평생 나와 함께하고 또 다음 세대로 이어집니다.","c":"오늘 나는 늙지 않는 것을 배우고, 다음 사람에게 전하겠습니다."},{"t":"지혜","q":"이 세상은 눈먼 것과 같아 제대로 보는 이가 드물다. 그물을 벗어난 새처럼 하늘로 날아오르는 이는 적다.","s":"『법구경』 제174게, 「세상품」","m":"대부분의 사람은 습관과 편견의 그물 속에 살아갑니다. 그 그물을 알아차리고 벗어나는 이는 드물지만, 누구나 그 새가 될 수 있습니다.","l":"알고리즘이 보여 주는 것만 보고, 내가 믿고 싶은 것만 믿게 되는 시대입니다. 다른 관점의 글을 읽고 다른 사람의 이야기를 들어 보는 것이 그물을 벗어나는 날갯짓입니다.","c":"오늘 내 생각의 그물을 한 번 살피고, 조금 더 넓게 보겠습니다."},{"t":"근심","q":"자식이 있는 이는 자식으로 근심하고, 소를 가진 이는 소로 근심한다. 집착하는 것이 사람의 근심이니, 집착이 없는 이에게는 근심도 없다.","s":"『숫타니파타』 제34게, 「다니야의 경(Dhaniya Sutta)」","m":"목동 다니야와 부처님의 문답 끝에 마라가 '자식 있는 이는 자식으로 기뻐한다'고 하자 부처님이 답하신 게송입니다. 기쁨을 주는 것이 동시에 근심의 원인이 된다는 통찰입니다.","l":"소중한 것이 많을수록 걱정도 많아집니다. 사랑하는 것을 소중히 하되 그것에 너무 매이지 않을 때, 기쁨은 남고 근심은 줄어듭니다.","c":"오늘 사랑하는 것을 소중히 하되, 근심으로 움켜쥐지는 않겠습니다."},{"t":"지혜","q":"잠 못 드는 이에게 밤은 길고, 지친 이에게 길은 멀다. 바른 법을 알지 못하는 어리석은 이에게 윤회의 길은 길다.","s":"『법구경』 제60게, 「어리석은 이품(愚闇品)」","m":"같은 시간과 거리도 마음 상태에 따라 길게도 짧게도 느껴집니다. 삶의 방향을 모를 때 인생은 끝없이 길고 고단하게 느껴진다는 뜻입니다.","l":"불안으로 뒤척이는 밤이 유난히 길고, 의미를 찾지 못한 일주일은 한 달처럼 느껴집니다. 방향을 아는 사람에게는 같은 길도 덜 지칩니다. 삶의 방향을 묻고 배우는 일이 고단함을 덜어 줍니다.","c":"오늘 밤이 길게 느껴진다면, 내일 아침이 반드시 온다는 것을 기억합니다."},{"t":"자애","q":"데와닷따가 술을 먹여 풀어놓은 사나운 코끼리 날라기리가 달려오자, 부처님은 자애의 마음을 보내셨다. 코끼리는 코를 내리고 부처님 앞에 고요히 섰다.","s":"『율장』 「소품(Cullavagga)」 7, 날라기리 코끼리 이야기","m":"부처님을 해치려는 시도 앞에서도 부처님은 맞서 싸우지 않고 자애로 대하셨고, 그 자애가 사나운 코끼리를 길들였습니다. 자애는 가장 강한 힘입니다.","l":"나를 향해 돌진해 오는 분노와 공격 앞에서 맞받아치면 충돌만 커집니다. 차분하고 따뜻한 태도가 의외로 상대의 분노를 누그러뜨리는 경우가 많습니다.","c":"오늘 거칠게 다가오는 것을 자애의 마음으로 맞이해 보겠습니다."},{"t":"행복","q":"이 세상의 모든 기쁨은 남의 행복을 바라는 데서 오고, 이 세상의 모든 괴로움은 나만의 행복을 바라는 데서 온다.","s":"샨티데바, 『입보리행론』 제8장 129게","m":"행복의 비밀을 역설적으로 보여 주는 게송입니다. 나만 생각할수록 괴로워지고, 남을 생각할수록 기뻐진다는 것입니다.","l":"기분이 가라앉는 날, 나를 위로할 방법만 찾기보다 누군가를 도와 보세요. 신기하게도 남을 위한 일이 내 마음을 가장 빨리 밝게 합니다.","c":"오늘 나의 행복만이 아니라 누군가의 행복을 바라며 하루를 살겠습니다."},{"t":"자기극복","q":"전쟁터에서 백만 대군을 이기는 것보다, 자기 하나를 이기는 이가 참으로 가장 훌륭한 승리자이다.","s":"『법구경』 제103게, 「천품」","m":"세상에서 가장 어려운 싸움은 나 자신과의 싸움입니다. 분노, 게으름, 욕심을 다스리는 사람은 어떤 정복자보다 위대하다는 가르침입니다.","l":"남을 이기는 경쟁은 끝이 없고 늘 더 강한 상대가 나타납니다. 그러나 어제의 나보다 조금 더 참고, 조금 더 부지런해지는 승리는 누구도 빼앗아 가지 못합니다.","c":"오늘 나는 남이 아니라 어제의 나를 이기는 하루를 살겠습니다."},{"t":"평정","q":"마을 사람들이 억울한 누명을 씌우며 아기를 맡기자 스님은 \"그런가?\" 하고 아기를 정성껏 길렀다. 1년 뒤 진실이 밝혀져 사람들이 사과하며 아기를 데려가자, 스님은 다시 \"그런가?\" 하였다.","s":"하쿠인 에카쿠(白隱慧鶴)에 얽혀 전해지는 일화","m":"칭찬에도 비난에도 똑같이 '그런가?'라고 답한 스님의 이야기입니다. 억울함 속에서도 해야 할 일을 묵묵히 하며 평정을 잃지 않는 마음을 보여 줍니다.","l":"오해를 받으면 당장 해명하고 싶어집니다. 하지만 때로는 '그런가?' 하고 내 할 일을 묵묵히 하는 것이 가장 강한 답이 됩니다. 진실은 결국 드러납니다.","c":"오늘 억울한 일이 있어도 '그런가?' 하고, 내 할 일을 정성껏 하겠습니다."},{"t":"계절","q":"봄에는 온갖 꽃, 가을에는 달, 여름에는 시원한 바람, 겨울에는 눈. 쓸데없는 일이 마음에 걸리지 않으면 이것이 바로 인간 세상의 좋은 시절이다.","s":"무문 혜개(無門慧開), 『무문관』 제19칙 송(頌)","m":"사계절마다 그 계절의 아름다움이 있습니다. 쓸데없는 근심만 마음에 걸어 두지 않으면 언제나 좋은 시절이라는 아름다운 선시입니다.","l":"지금 이 계절에도 이 계절만의 선물이 있습니다. 걱정에 마음을 빼앗겨 그것을 놓치고 있지는 않나요? 오늘 창밖의 계절을 한번 바라보세요.","c":"오늘 이 계절의 아름다움을 놓치지 않고 누리겠습니다.","o":"春有百花秋有月 夏有凉風冬有雪 若無閑事掛心頭 便是人間好時節"},{"t":"자기","q":"불도를 배운다는 것은 자기를 배우는 것이다. 자기를 배운다는 것은 자기를 잊는 것이다. 자기를 잊는다는 것은 만물에 의해 깨우쳐지는 것이다.","s":"도겐(道元), 『정법안장(正法眼藏)』 「현성공안(現成公案)」","m":"일본 조동종의 개조 도겐 선사의 유명한 법문입니다. 자기를 깊이 들여다보면 결국 '나'에 대한 집착을 잊게 되고, 그때 온 세상이 나를 깨우쳐 준다는 뜻입니다.","l":"나를 알고 싶어 나만 들여다보다 보면 오히려 더 갇힙니다. '나'를 잠시 잊고 자연, 사람, 일에 몰입할 때 오히려 진짜 나를 만나게 됩니다.","c":"오늘 나를 잠시 잊고, 세상이 나에게 가르쳐 주는 것을 배우겠습니다."},{"t":"건강","q":"몸에 병 없기를 바라지 말라. 몸에 병이 없으면 탐욕이 생기기 쉽다. 그러므로 병고로써 양약을 삼으라.","s":"묘협(妙叶) 스님, 「보왕삼매론(寶王三昧論)」 제1","m":"명나라 묘협 스님의 『보왕삼매염불직지』에 실린 열 가지 가르침으로, 우리나라에서 「보왕삼매론」으로 널리 독송됩니다. 역경을 오히려 수행의 약으로 삼으라는 역설의 지혜입니다.","l":"아파 본 사람은 건강의 소중함을 알고, 겸손해지며, 남의 아픔에 공감하게 됩니다. 아픈 몸을 원망하기보다 그것이 가르쳐 주는 것에 귀 기울여 보세요.","c":"오늘 몸이 불편하다면, 그 아픔이 주는 가르침에 귀 기울이겠습니다.","o":"念身不求無病 身無病則貪欲易生"},{"t":"균형","q":"거문고 줄이 너무 팽팽하면 좋은 소리가 나지 않고, 너무 느슨해도 좋은 소리가 나지 않는다. 알맞게 조율되었을 때 비로소 아름다운 소리가 난다.","s":"『앙굿따라 니까야』 「소나 경(Soṇa Sutta)」(AN 6.55), 『사십이장경』에도 같은 비유가 전함","m":"지나치게 애쓰다 지쳐 수행을 포기하려던 소나 비구에게, 출가 전 거문고 연주자였던 그의 경험을 빌려 주신 가르침입니다. 노력에도 알맞은 조율이 필요합니다.","l":"너무 열심히 하다 번아웃이 오고, 너무 느슨하면 아무것도 이루지 못합니다. 오늘 내 삶의 줄은 너무 팽팽한가요, 너무 느슨한가요? 조금 조율해 보세요.","c":"오늘 내 삶의 줄을 알맞게 조율하여, 좋은 소리를 내겠습니다."},{"t":"집착","q":"사랑하는 이와 지나치게 얽매이지 말고, 싫어하는 이와도 얽매이지 말라. 사랑하는 이를 보지 못함도 괴로움이요, 싫어하는 이를 만남도 괴로움이다.","s":"『법구경』 제210게, 「애정품」","m":"좋아하는 것에 대한 집착도, 싫어하는 것에 대한 집착도 모두 괴로움을 낳습니다. 사랑하되 매이지 않고, 싫어하되 미워하지 않는 마음이 필요합니다.","l":"싫은 사람에 대한 생각에 하루를 다 쓰기도 합니다. 싫어하는 것도 일종의 집착입니다. 그 사람을 마음에서 놓아주면 내가 자유로워집니다.","c":"오늘 좋은 것에도 싫은 것에도 너무 매이지 않겠습니다."},{"t":"인내","q":"인내하고 충고를 기꺼이 받아들이며, 수행자들을 만나고, 때에 맞추어 진리를 논하는 것, 이것이 더없는 행복이다.","s":"『숫타니파타』 제266게, 「위없는 행복의 경」","m":"참을성, 충고를 달게 듣는 열린 마음, 좋은 사람과의 만남, 깊은 대화가 행복이라는 가르침입니다. 행복은 관계 속의 태도에서 피어납니다.","l":"쓴소리를 고맙게 듣는 사람은 계속 자랍니다. 친구와 삶의 의미를 이야기하는 저녁도 큰 행복입니다. 오늘 누군가와 마음을 나누는 깊은 대화를 해 보세요.","c":"오늘 충고에 귀를 열고, 누군가와 진심을 나누는 대화를 하겠습니다."},{"t":"반복","q":"사람이 악을 저질렀다면 다시는 되풀이하지 말라. 사람이 선을 행했다면 그것을 거듭하라. 선이 쌓이면 행복하다.","s":"『법구경』 제117~118게, 「악품」","m":"실수는 한 번으로 끝내고 선행은 반복하라는 단순하고 실천적인 가르침입니다. 반복되는 것이 곧 나의 성품이 됩니다.","l":"같은 실수를 반복하지 않는 것만으로도 충분히 성장입니다. 그리고 한 번 좋았던 일은 습관으로 만들어 보세요. 반복된 선함이 나를 만듭니다.","c":"오늘 어제의 실수는 반복하지 않고, 어제의 선행은 한 번 더 하겠습니다."},{"t":"이기는법","q":"성냄은 성내지 않음으로 이기고, 악은 선으로 이겨라. 인색함은 베풂으로 이기고, 거짓은 진실로 이겨라.","s":"『법구경』 제223게, 「분노품(忿怒品)」","m":"같은 것으로 맞서면 싸움은 커질 뿐입니다. 반대의 것으로 대응할 때 비로소 고리가 끊어진다는, 가장 실천적인 지혜입니다.","l":"화를 내는 고객에게 차분하게, 무례한 사람에게 예의 바르게, 거짓말하는 이에게 정직하게 대하는 것은 지는 것이 아니라 더 높은 차원에서 이기는 것입니다.","c":"오늘 거친 것을 만나면, 그 반대의 것으로 답하겠습니다."},{"t":"가능성","q":"연못의 연꽃 가운데 어떤 것은 물속에 잠겨 있고, 어떤 것은 수면까지 올라왔으며, 어떤 것은 물 위로 솟아 물에 젖지 않는다. 이처럼 세상에는 눈에 먼지가 적은 이들도 있다.","s":"『맛지마 니까야』 「성스러운 구함 경(Ariyapariyesana Sutta)」(MN 26)","m":"깨달음을 얻은 부처님이 '이 법을 이해할 사람이 있을까' 망설이다가, 연못의 연꽃들을 보며 설법을 결심하신 장면입니다. 사람마다 피어나는 때가 다를 뿐 모두 가능성이 있다는 뜻입니다.","l":"아이들, 후배들, 그리고 나 자신도 피어나는 속도가 다릅니다. 아직 물속에 있다고 실망하지 마세요. 연꽃은 저마다의 때에 수면 위로 올라옵니다.","c":"나도, 내 곁의 사람도 저마다의 때에 피어납니다. 조급해하지 않겠습니다."},{"t":"품격","q":"말솜씨나 아름다운 용모만으로 훌륭한 사람이 되는 것이 아니다. 질투와 인색과 속임이 있다면. 그것들을 뿌리째 끊어 낸 이를 훌륭하다고 한다.","s":"『법구경』 제262~263게, 「법에 머무는 이품」","m":"사람의 진정한 아름다움은 겉모습이 아니라 마음에서 나옵니다. 질투, 인색, 속임을 버린 마음이 가장 아름답습니다.","l":"외모와 말솜씨는 첫인상을 만들지만 관계를 오래 지키는 것은 진실함과 너그러움입니다. 마음을 가꾸는 것이 가장 오래가는 아름다움입니다.","c":"오늘 거울 속 얼굴보다 마음의 얼굴을 더 가꾸겠습니다."},{"t":"분수","q":"이익을 분에 넘치게 바라지 말라. 이익이 분에 넘치면 어리석은 마음이 생긴다. 그러므로 적은 이익으로써 부자가 되라.","s":"묘협 스님, 「보왕삼매론」 제9","m":"분수에 넘치는 이익은 사람을 어리석게 만듭니다. 적은 것에 만족하는 마음이 진짜 부자를 만든다는 가르침입니다.","l":"'대박'을 쫓다 큰 손해를 보는 일이 흔합니다. 분에 넘치는 욕심은 판단을 흐립니다. 작지만 정직한 이익에 감사하는 사람이 결국 오래 넉넉합니다.","c":"오늘 작은 이익에 감사하며, 마음의 부자로 살겠습니다.","o":"見利不求霑分 利霑分則癡心亦動"},{"t":"하나","q":"세계는 한 송이 꽃이다.","s":"만공 월면(滿空月面) 스님의 가르침","m":"경허 스님의 제자 만공 스님이 남긴 말씀입니다. 온 세상과 모든 생명이 한 송이 꽃처럼 하나로 이어져 있다는 가르침으로, 나라와 민족을 넘어선 평화의 메시지이기도 합니다.","l":"꽃잎 하나가 다치면 꽃 전체가 아픕니다. 나와 너, 우리나라와 다른 나라가 한 송이 꽃의 꽃잎들이라고 생각하면 서로를 대하는 마음이 달라집니다.","c":"오늘 나도 세계라는 한 송이 꽃의 꽃잎임을 기억하겠습니다.","o":"世界一花"},{"t":"수행","q":"대장장이가 은에서 녹을 벗겨 내듯, 지혜로운 이는 조금씩, 순간순간, 차례대로 자신의 더러움을 벗겨 낸다.","s":"『법구경』 제239게, 「더러움품(塵垢品)」","m":"마음의 때는 한 번에 사라지지 않습니다. 장인이 은을 정성껏 닦듯 조금씩, 꾸준히 닦아 나가는 것이 수행의 본질입니다.","l":"오래된 습관을 단번에 고치려다 실패하면 좌절하기 쉽습니다. 오늘 하나, 내일 하나씩 벗겨 내면 됩니다. 작은 변화가 쌓여 마침내 빛나는 은이 됩니다.","c":"오늘 나의 녹 하나를 조금 벗겨 냅니다. 천천히, 그러나 분명하게."},{"t":"선행","q":"선을 행한 이는 이 세상에서 기뻐하고, 저 세상에서도 기뻐한다. 두 세상에서 기뻐한다. 자신이 지은 깨끗한 업을 보며 기뻐하고 또 기뻐한다.","s":"『법구경』 제16게, 「쌍품」","m":"선행의 기쁨은 미래의 보상만이 아니라 지금 이 순간에도 있습니다. 좋은 일을 한 기억 자체가 마음을 밝게 합니다.","l":"누군가를 도운 날은 잠자리가 편안합니다. 선행은 남을 위한 일이면서 동시에 나를 행복하게 하는 가장 확실한 방법입니다.","c":"오늘 잠들 때 떠올리며 미소 지을 수 있는 일 하나를 하겠습니다."},{"t":"행복","q":"어리석은 이를 가까이하지 않고 지혜로운 이를 가까이하며, 공경할 만한 이를 공경하는 것, 이것이 더없는 행복이다.","s":"『숫타니파타』 제259게, 「위없는 행복의 경(Maṅgala Sutta, 대길상경)」","m":"신들이 부처님께 '무엇이 최고의 행복입니까?' 하고 묻자 답하신 경전입니다. 그 첫 번째 답은 누구와 함께하느냐였습니다.","l":"행복은 어디서 오느냐는 질문에 부처님은 '관계'를 먼저 말씀하셨습니다. 나를 성장시키는 사람과 함께하고, 존경할 만한 이를 존경하는 것이 행복의 기초입니다.","c":"오늘 나를 좋은 길로 이끄는 사람들과 더 많은 시간을 보내겠습니다."},{"t":"업","q":"갓 짠 우유가 곧바로 굳지 않듯, 악업은 곧바로 열매 맺지 않는다. 재에 덮인 불씨처럼 타오르며 어리석은 이를 뒤따른다.","s":"『법구경』 제71게, 「어리석은 이품」","m":"잘못된 행동의 결과가 당장 보이지 않는다고 해서 사라진 것이 아닙니다. 재 속의 불씨처럼 조용히 남아 있다가 언젠가 드러난다는 경고입니다.","l":"건강을 해치는 습관, 신뢰를 깎는 작은 거짓말은 당장 아무 일 없어 보입니다. 그러나 시간이 지나 반드시 결과로 돌아옵니다.","c":"오늘 당장 결과가 보이지 않아도, 바른 선택을 하겠습니다."},{"t":"인내","q":"도적들이 양쪽 손잡이가 달린 톱으로 사지를 자른다 해도, 그 때문에 마음에 성냄을 일으킨다면 그는 나의 가르침을 따르는 이가 아니다.","s":"『맛지마 니까야』 「톱의 비유 경(Kakacūpama Sutta)」(MN 21)","m":"극단적인 비유를 통해 어떤 상황에서도 자애로운 마음을 지키라고 가르치신 경전입니다. 그만큼 분노를 다스리는 것이 중요하다는 뜻입니다.","l":"이 가르침에 비하면 우리가 일상에서 겪는 무례함은 아주 작은 일입니다. 그 작은 일에서부터 성냄 대신 자애를 연습해 보세요.","c":"오늘 작은 무례함 앞에서 자애로운 마음을 연습하겠습니다."},{"t":"행복","q":"행복을 바라는 생명들을 해치면서 자기의 행복을 구하는 이는, 죽은 뒤에도 행복을 얻지 못한다.","s":"『법구경』 제131게, 「폭력품」","m":"남의 행복을 짓밟고 얻은 행복은 진정한 행복이 아닙니다. 모든 생명이 행복을 바란다는 것을 기억하라는 가르침입니다.","l":"경쟁 사회에서는 남을 밀어내야 내가 올라간다고 착각하기 쉽습니다. 그러나 함께 행복해지는 길이 결국 가장 오래가는 행복입니다.","c":"오늘 나의 행복이 누군가의 불행 위에 세워지지 않도록 살피겠습니다."},{"t":"결심","q":"이 자리에서 내 몸이 마르고 살갗과 뼈와 살이 다 스러진다 해도, 위없는 깨달음을 얻기 전에는 결코 이 자리에서 일어나지 않으리라.","s":"『방광대장엄경(Lalitavistara)』, 성도(成道) 직전 보리수 아래의 서원","m":"싯다르타가 보리수 아래 앉으며 세운 굳은 결심입니다. 이 결심 끝에 그는 붓다, 깨달은 이가 되었습니다.","l":"무언가를 이루는 데는 재능보다 결심의 깊이가 중요합니다. 거창한 목표가 아니어도 좋습니다. '이것만큼은 끝까지 하겠다'는 결심 하나가 삶을 바꿉니다.","c":"오늘 나도 작은 보리수 아래 앉듯, 하나의 결심을 굳게 세우겠습니다."},{"t":"새출발","q":"전에는 게을렀어도 나중에 게으르지 않은 이는, 구름을 벗어난 달처럼 이 세상을 비춘다.","s":"『법구경』 제172게, 「세상품(世俗品)」","m":"과거가 어땠는지는 중요하지 않습니다. 지금 깨어나 바르게 살기 시작하면, 구름에 가렸던 달이 다시 환히 빛나듯 그 사람도 빛날 수 있습니다.","l":"'나는 원래 이래', '이미 늦었어'라는 말로 스스로를 가두지 마세요. 늦게 시작한 운동, 늦게 시작한 공부, 늦게 건넨 사과도 충분히 빛납니다.","c":"오늘 나는 구름을 벗어나는 달입니다. 지금부터 빛나면 됩니다."},{"t":"강인함","q":"이 몸이 질그릇처럼 깨지기 쉬움을 알고, 이 마음을 성채처럼 굳건히 세워, 지혜의 무기로 번뇌와 싸우라.","s":"『법구경』 제40게, 「마음품」","m":"몸은 연약하지만 마음은 성채처럼 강하게 세울 수 있습니다. 몸의 한계를 인정하되 마음의 힘을 기르라는 가르침입니다.","l":"아프거나 지칠 때 몸은 마음대로 되지 않습니다. 그러나 그런 순간에도 마음만큼은 단단히 지킬 수 있습니다. 많은 사람이 병상에서도 마음의 성채를 지켜 냈습니다.","c":"몸이 지쳐도 마음은 성채처럼 굳건히 지키겠습니다."},{"t":"성찰","q":"\"라훌라여, 거울은 무엇을 위한 것이냐?\" \"비추어 보기 위한 것입니다.\" \"그와 같이 몸과 말과 마음으로 행동하기 전에도, 하는 중에도, 하고 난 뒤에도 거듭 비추어 보아라.\"","s":"『맛지마 니까야』 「암발랏티까에서 라훌라를 가르치신 경」(MN 61)","m":"부처님이 어린 아들 라훌라에게 주신 가르침입니다. 행동의 전, 중, 후에 스스로를 비추어 보라는 자기 성찰의 방법을 알려 주셨습니다.","l":"행동하기 전에 '이것이 나와 남을 해치지 않을까?', 하는 중에 '지금 괜찮은가?', 한 뒤에 '결과는 어땠나?'를 물어보세요. 세 번의 거울이 나를 성장시킵니다.","c":"오늘 행동하기 전과 중과 후에 마음의 거울을 들여다보겠습니다."},{"t":"부끄러움","q":"부끄러움을 모르고 까마귀처럼 뻔뻔하게 사는 것은 쉽다. 부끄러움을 알고 늘 깨끗함을 구하며 겸손하게 사는 것은 어렵다.","s":"『법구경』 제244~245게, 「더러움품」","m":"부끄러움을 아는 마음(참괴, 慚愧)은 불교에서 세상을 지키는 두 가지 법 중 하나라 할 만큼 중요합니다. 부끄러움을 아는 것이 바른 삶의 출발입니다.","l":"뻔뻔함이 능력처럼 여겨지는 시대지만, 부끄러움을 아는 사람이 결국 신뢰를 얻습니다. 잘못을 부끄러워할 줄 아는 것은 약함이 아니라 양심의 힘입니다.","c":"오늘 부끄러워할 줄 아는 마음을 소중히 지키겠습니다."},{"t":"중도","q":"수행자는 두 극단을 따르지 말아야 한다. 감각적 쾌락에 빠지는 것과 스스로를 괴롭히는 고행이다. 여래는 이 두 극단을 떠난 중도를 깨달았다.","s":"『상윳따 니까야』 「초전법륜경(Dhammacakkappavattana Sutta)」(SN 56.11)","m":"부처님이 깨달음 후 처음 하신 설법의 첫머리입니다. 왕자로서의 쾌락과 6년 고행을 모두 겪어 보신 뒤, 양 극단이 아닌 중도(中道)가 길임을 선언하셨습니다.","l":"극단적인 다이어트와 폭식, 과로와 무기력은 서로 닮았습니다. 건강한 삶은 지나치지도 모자라지도 않은 중간에 있습니다. 균형이 곧 지혜입니다.","c":"오늘 지나치지도 모자라지도 않게, 중도의 하루를 살겠습니다."},{"t":"그릇","q":"보배의 비가 중생을 이롭게 하려 허공에 가득하지만, 중생은 저마다의 그릇만큼 이익을 얻는다.","s":"의상 대사, 「법성게」","m":"진리의 비는 모두에게 가득히 내리지만 각자의 그릇 크기만큼 담을 수 있다는 뜻입니다. 그릇을 넓히는 것은 나의 몫입니다.","l":"같은 강의, 같은 기회, 같은 하루가 주어져도 얻어 가는 것은 사람마다 다릅니다. 마음의 그릇을 넓히면 같은 비에서도 더 많은 것을 담을 수 있습니다.","c":"오늘 내 마음의 그릇을 조금 더 넓혀, 내리는 비를 넉넉히 담겠습니다.","o":"雨寶益生滿虛空 衆生隨器得利益"},{"t":"감사","q":"사람으로 태어나기 어렵고, 죽어야 할 이가 지금 살아 있기 어렵다. 바른 법을 듣기 어렵고, 부처님이 세상에 나오시기 어렵다.","s":"『법구경』 제182게, 「붓다품(佛陀品)」","m":"지금 사람으로 살아 있고, 좋은 가르침을 들을 수 있다는 사실 자체가 매우 드문 행운이라는 뜻입니다. 당연하게 여기던 것들이 사실은 기적입니다.","l":"아침에 눈을 뜨고, 숨을 쉬고, 좋은 글 한 줄을 읽을 수 있는 오늘은 결코 당연하지 않습니다. 이 사실을 기억하면 불평은 줄고 하루가 귀하게 느껴집니다.","c":"오늘 눈을 뜬 것만으로도 감사합니다. 이 귀한 하루를 헛되이 보내지 않겠습니다."},{"t":"무아","q":"\"모든 법에는 고정된 자아가 없다.\" 지혜로써 이것을 볼 때, 괴로움에서 멀어진다. 이것이 청정에 이르는 길이다.","s":"『법구경』 제279게, 「길품」","m":"무아(無我)는 '나'라는 것이 고정불변의 실체가 아니라 끊임없이 변하는 흐름이라는 뜻입니다. 고정된 '나'에 대한 집착을 놓을 때 마음이 가벼워집니다.","l":"'나는 원래 이런 사람이야'라는 생각이 나를 가둡니다. 내가 고정된 존재가 아니라는 것은, 오늘 얼마든지 새로워질 수 있다는 뜻이기도 합니다.","c":"나는 정해져 있지 않습니다. 오늘 나는 조금 다른 내가 될 수 있습니다.","o":"諸法無我"},{"t":"정진","q":"비구들이여, 이제 너희에게 말하노니, 모든 형성된 것은 소멸하기 마련이다. 게으르지 말고 정진하라.","s":"『디가 니까야』 「대반열반경」(DN 16), 부처님의 마지막 유훈","m":"부처님이 열반에 드시기 직전 남기신 마지막 말씀입니다. 모든 것은 변하니 지금 이 순간을 헛되이 보내지 말고 부지런히 수행하라는 당부입니다.","l":"한 해의 끝에서 우리는 지나간 시간을 돌아봅니다. 모든 것이 변하고 끝난다는 것은 슬픔이 아니라 지금을 소중히 살라는 초대입니다. 새해에도 게으르지 않게 걸어가기를.","c":"모든 것은 지나갑니다. 그러니 오늘을, 그리고 다가올 날들을 부지런히 살겠습니다."}];
(function(){
"use strict";
const $ = id => document.getElementById(id);
const WD = ["일","월","화","수","목","금","토"];
const DAY = 86400000;

/* 날짜 → 말씀: 윤년 달력(366칸) 기준 '월-일' 순번. 매년 같은 날엔 같은 말씀. */
function keyIndex(d){ return Math.round((Date.UTC(2000,d.getMonth(),d.getDate()) - Date.UTC(2000,0,1))/DAY); }
function today0(){ const n=new Date(); return new Date(n.getFullYear(),n.getMonth(),n.getDate()); }
function addDays(d,n){ return new Date(d.getFullYear(),d.getMonth(),d.getDate()+n); }
function same(a,b){ return a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate(); }
function iso(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function korDate(d){ return d.getFullYear()+"년 "+(d.getMonth()+1)+"월 "+d.getDate()+"일"; }
function dayOfYear(d){ return Math.round((d - new Date(d.getFullYear(),0,1))/DAY)+1; }
function store(k,v){ try{ if(v===undefined) return localStorage.getItem(k); localStorage.setItem(k,v);}catch(e){ return null; } }

let TODAY = today0();
let viewing = TODAY;

function renderHeader(){
  $("todayDate").textContent = korDate(TODAY);
  $("todaySub").textContent = WD[TODAY.getDay()]+"요일 · 불기 "+(TODAY.getFullYear()+544)+"년";
}

function renderDay(d){
  viewing = d;
  const e = DATA[keyIndex(d)];
  const isToday = same(d,TODAY);
  $("q").textContent = e.q;
  const o=$("o"); if(e.o){ o.textContent=e.o; o.hidden=false; } else { o.textContent=""; o.hidden=true; }
  $("s").textContent = e.s;
  $("m").textContent = e.m;
  $("l").textContent = e.l;
  $("c").textContent = e.c;
  $("tag").textContent = "#"+e.t;
  const doy = dayOfYear(d);
  $("count").textContent = d.getFullYear()+"년의 "+doy+"번째 말씀";
  const seal=$("seal").children;
  seal[0].textContent = isToday?"今":"往"; seal[1].textContent="日";
  $("vowTitle").textContent = isToday ? "오늘의 다짐" : "그날의 다짐";
  $("pastBanner").hidden = isToday;
  $("pastLabel").textContent = (d.getMonth()+1)+"월 "+d.getDate()+"일 ("+WD[d.getDay()]+")의 말씀이에요.";
  $("prevBtn").disabled = (TODAY - d)/DAY >= 365;
  $("nextBtn").disabled = isToday;
  $("nextBtn").textContent = same(addDays(d,1),TODAY) ? "오늘 ›" : "다음날 ›";
}

/* 지난 말씀 목록 */
let listBuilt=false;
function buildList(filter){
  const box=$("list"); box.textContent="";
  const f=(filter||"").trim().toLowerCase();
  let lastMonth=null, n=0;
  const frag=document.createDocumentFragment();
  for(let i=1;i<=365;i++){
    const d=addDays(TODAY,-i), e=DATA[keyIndex(d)];
    if(f && !(e.q+" "+e.s+" "+e.t+" "+(e.o||"")+" "+e.c).toLowerCase().includes(f)) continue;
    const mk=d.getFullYear()+"-"+d.getMonth();
    if(mk!==lastMonth){ lastMonth=mk; const h=document.createElement("div"); h.className="month"; h.textContent=d.getFullYear()+"년 "+(d.getMonth()+1)+"월"; frag.appendChild(h); }
    const a=document.createElement("a"); a.className="row"; a.href="#day-"+iso(d);
    const dd=document.createElement("div"); dd.className="d";
    const b=document.createElement("b"); b.textContent=d.getDate();
    const sp=document.createElement("span"); sp.textContent=WD[d.getDay()]; if(d.getDay()===0) sp.className="sun";
    dd.append(b,sp);
    const tx=document.createElement("div");
    const rq=document.createElement("div"); rq.className="rq"; rq.textContent=e.q;
    const rs=document.createElement("div"); rs.className="rs";
    const ti=document.createElement("i"); ti.textContent="#"+e.t; rs.append(ti, document.createTextNode(e.s));
    tx.append(rq,rs); a.append(dd,tx); frag.appendChild(a); n++;
  }
  if(!n){ const p=document.createElement("p"); p.className="empty"; p.textContent="찾는 말씀이 없어요. 다른 낱말로 찾아보세요."; frag.appendChild(p); }
  box.appendChild(frag);
  listBuilt=true;
}

function setTab(name){
  [["tabToday","day"],["tabPast","past"]].forEach(([id,n])=>{ if(name===n) $(id).setAttribute("aria-current","page"); else $(id).removeAttribute("aria-current"); });
}

function route(){
  const h=(location.hash||"").replace(/^#/,"");
  let m;
  if(h==="past"){
    $("viewDay").hidden=true; $("viewPast").hidden=false; setTab("past");
    if(!listBuilt) buildList($("search").value);
    return;
  }
  let d=TODAY;
  if((m=/^day-(\d{4})-(\d{2})-(\d{2})$/.exec(h))){
    const t=new Date(+m[1],+m[2]-1,+m[3]);
    const diff=Math.round((TODAY-t)/DAY);
    if(!isNaN(t) && diff>0 && diff<=365) d=t;
  }
  $("viewPast").hidden=true; $("viewDay").hidden=false;
  setTab(same(d,TODAY)?"day":"past");
  renderDay(d);
  window.scrollTo(0,0);
}

function go(d){ location.hash = same(d,TODAY) ? "today" : "day-"+iso(d); }
$("prevBtn").addEventListener("click",()=>go(addDays(viewing,-1)));
$("nextBtn").addEventListener("click",()=>go(addDays(viewing,1)));

let toastT;
function toast(msg){ const t=$("toast"); t.textContent=msg; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>t.hidden=true,1800); }
$("copyBtn").addEventListener("click",async()=>{
  const e=DATA[keyIndex(viewing)];
  const text=korDate(viewing)+" 오늘의 말씀\n\n"+e.q+(e.o?"\n"+e.o:"")+"\n— "+e.s+"\n\n"+e.c;
  try{ await navigator.clipboard.writeText(text); toast("말씀을 복사했어요"); }
  catch(err){ toast("이 화면에서는 복사가 막혀 있어요"); }
});

let searchT;
$("search").addEventListener("input",ev=>{ clearTimeout(searchT); searchT=setTimeout(()=>buildList(ev.target.value),150); });
function setJumpBounds(){ const j=$("jump"); j.max=iso(addDays(TODAY,-1)); j.min=iso(addDays(TODAY,-365)); }
$("jump").addEventListener("change",ev=>{
  const v=ev.target.value; if(!v) return;
  const [y,mo,da]=v.split("-").map(Number); const d=new Date(y,mo-1,da);
  const diff=Math.round((TODAY-d)/DAY);
  if(diff>0 && diff<=365) go(d); else toast("지난 1년 안의 날짜를 골라 주세요");
});

/* 날이 바뀌면 새 말씀으로 */
function checkDay(){
  const t=today0();
  if(!same(t,TODAY)){ TODAY=t; renderHeader(); setJumpBounds(); listBuilt=false; route(); fetchWeather(); }
}
document.addEventListener("visibilitychange",()=>{ if(!document.hidden) checkDay(); });
setInterval(checkDay,60000);
window.addEventListener("hashchange",route);

/* 날씨 (Open-Meteo, 키 없이 사용) */
const CITIES=[["서울",37.5665,126.978],["부산",35.1796,129.0756],["인천",37.4563,126.7052],["대구",35.8714,128.6014],["대전",36.3504,127.3845],["광주",35.1595,126.8526],["울산",35.5384,129.3114],["세종",36.48,127.289],["수원",37.2636,127.0286],["춘천",37.8813,127.7298],["강릉",37.7519,128.8761],["청주",36.6424,127.489],["전주",35.8242,127.148],["포항",36.019,129.3435],["창원",35.228,128.6811],["제주",33.4996,126.5312]];
const IC={
 sun:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>',
 part:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4.5v1.2M3.8 8.6H5M4.9 5.4l.9.9M11.2 6.3l.9-.9"/><path d="M5.6 11.2A3.6 3.6 0 0 1 11.6 7"/><path d="M8.5 19h9a3.5 3.5 0 0 0 .2-7 5 5 0 0 0-9.6 1.2A2.9 2.9 0 0 0 8.5 19z"/></svg>',
 cloud:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M7 18.5h10.5a4 4 0 0 0 .3-8 6 6 0 0 0-11.5 1.6A3.3 3.3 0 0 0 7 18.5z"/></svg>',
 fog:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M4 9h16M3 13h18M5 17h14"/></svg>',
 rain:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M7 14.5h10.5a4 4 0 0 0 .3-8 6 6 0 0 0-11.5 1.6A3.3 3.3 0 0 0 7 14.5z"/><path d="M9 17.5l-1 2.5M13 17.5l-1 2.5M17 17.5l-1 2.5"/></svg>',
 snow:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M7 14.5h10.5a4 4 0 0 0 .3-8 6 6 0 0 0-11.5 1.6A3.3 3.3 0 0 0 7 14.5z"/><path d="M9 18.5h.01M13 18.5h.01M17 18.5h.01M11 21h.01M15 21h.01"/></svg>',
 storm:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M7 14.5h10.5a4 4 0 0 0 .3-8 6 6 0 0 0-11.5 1.6A3.3 3.3 0 0 0 7 14.5z"/><path d="M12.5 15.5l-2 3h3l-2 3"/></svg>'
};
function wmo(c){
  if(c===0) return ["sun","맑음"]; if(c===1) return ["sun","대체로 맑음"]; if(c===2) return ["part","구름 조금"]; if(c===3) return ["cloud","흐림"];
  if(c===45||c===48) return ["fog","안개"]; if(c>=51&&c<=57) return ["rain","이슬비"]; if(c>=61&&c<=67) return ["rain","비"];
  if(c>=71&&c<=77) return ["snow","눈"]; if(c>=80&&c<=82) return ["rain","소나기"]; if(c===85||c===86) return ["snow","눈"]; if(c>=95) return ["storm","뇌우"];
  return ["cloud","흐림"];
}
function getPlace(){ try{ const p=JSON.parse(store("bwd-place")); if(p&&p.name) return p; }catch(e){} return {name:"서울",lat:37.5665,lon:126.978}; }
function setPlace(p){ store("bwd-place",JSON.stringify(p)); }
function naverLink(name){ return "https://search.naver.com/search.naver?query="+encodeURIComponent((name==="현재 위치"?"":name+" ")+"날씨"); }

function buildGrid(){
  const g=$("wxGrid"); g.textContent=""; const cur=getPlace().name;
  CITIES.forEach(([n,lat,lon])=>{
    const b=document.createElement("button"); b.type="button"; b.textContent=n; b.setAttribute("aria-pressed",String(cur===n));
    b.addEventListener("click",()=>{ setPlace({name:n,lat,lon}); closeMenu(); fetchWeather(true); });
    g.appendChild(b);
  });
  const L=document.createElement("button"); L.type="button"; L.className="loc"; L.textContent="현재 위치 사용"; L.setAttribute("aria-pressed",String(cur==="현재 위치"));
  L.addEventListener("click",()=>{
    if(!navigator.geolocation){ $("wxNow").textContent="이 기기에서는 위치를 확인할 수 없어요."; return; }
    $("wxNow").textContent="위치를 확인하는 중이에요.";
    navigator.geolocation.getCurrentPosition(
      pos=>{ setPlace({name:"현재 위치",lat:pos.coords.latitude,lon:pos.coords.longitude}); closeMenu(); fetchWeather(true); },
      ()=>{ $("wxNow").textContent="위치 사용이 허용되지 않았어요. 위 목록에서 지역을 골라 주세요."; },
      {timeout:8000,maximumAge:600000});
  });
  g.appendChild(L);
}
let wxState=null;
function paintWeather(){
  const p=getPlace(); $("wxCity").textContent=p.name;
  const now=$("wxNow"); now.textContent="";
  if(wxState&&wxState.ok){
    const [ic,label]=wmo(wxState.code);
    $("wxIcon").innerHTML=IC[ic]; $("wxTemp").textContent=Math.round(wxState.t)+"°";
    $("wxBtn").setAttribute("aria-label",p.name+" 날씨 "+label+" "+Math.round(wxState.t)+"도, 지역 바꾸기");
    const b=document.createElement("b"); b.textContent=p.name+" · "+label+" "+Math.round(wxState.t)+"°";
    now.append(b, document.createElement("br"), document.createTextNode("오늘 최고 "+Math.round(wxState.hi)+"° · 최저 "+Math.round(wxState.lo)+"°"));
  } else {
    $("wxIcon").innerHTML=IC.part; $("wxTemp").textContent="";
    $("wxBtn").setAttribute("aria-label",p.name+" 날씨 보기, 지역 바꾸기");
    if(wxState===null){ now.textContent="날씨를 불러오는 중이에요."; }
    else {
      now.append(document.createTextNode("지금 이 화면에서는 실시간 날씨를 불러올 수 없어요. "));
      const a=document.createElement("a"); a.href=naverLink(p.name); a.target="_blank"; a.rel="noopener"; a.textContent=p.name+" 날씨 보러 가기 ↗";
      now.appendChild(a);
    }
  }
}
async function fetchWeather(force){
  const p=getPlace();
  const ck="bwd-wx-"+p.lat.toFixed(2)+","+p.lon.toFixed(2);
  if(!force){ try{ const c=JSON.parse(store(ck)); if(c && Date.now()-c.at<30*60000){ wxState=c; paintWeather(); return; } }catch(e){} }
  wxState=null; paintWeather();
  const url="https://api.open-meteo.com/v1/forecast?latitude="+p.lat+"&longitude="+p.lon+"&current=temperature_2m,weather_code&daily=temperature_2m_max,temperature_2m_min&timezone=auto&forecast_days=1";
  const ctl=new AbortController(); const to=setTimeout(()=>ctl.abort(),7000);
  try{
    const r=await fetch(url,{signal:ctl.signal}); if(!r.ok) throw 0;
    const j=await r.json();
    wxState={ok:true,t:j.current.temperature_2m,code:j.current.weather_code,hi:j.daily.temperature_2m_max[0],lo:j.daily.temperature_2m_min[0],at:Date.now()};
    store(ck,JSON.stringify(wxState));
  }catch(e){ wxState={ok:false}; }
  clearTimeout(to); paintWeather();
}
function openMenu(){ buildGrid(); paintWeather(); $("wxMenu").hidden=false; $("wxBtn").setAttribute("aria-expanded","true"); }
function closeMenu(){ $("wxMenu").hidden=true; $("wxBtn").setAttribute("aria-expanded","false"); }
$("wxBtn").addEventListener("click",e=>{ e.stopPropagation(); $("wxMenu").hidden?openMenu():closeMenu(); });
document.addEventListener("click",e=>{ if(!$("wxMenu").hidden && !$("wxMenu").contains(e.target)) closeMenu(); });
document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeMenu(); });

renderHeader(); setJumpBounds(); route(); fetchWeather();
})();
</script>
