<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EDEFEA">
<title>불교 오늘의 말씀</title>
<meta name="description" content="경전과 선사들의 말씀 가운데 하루 한 구절과 말씀 풀이, 오늘의 삶에서 새길 점과 다짐을 전하는 불교 오늘의 말씀 앱.">
<link rel="icon" type="image/png" href="../../img/logo-badge.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* layout: one narrow sutra-like column — today's date & weather, the verse with its source, three reading sections; a fixed two-tab bar below */
  --paper:#EBEEE9;
  --surface:#F7F8F5;
  --ink:#1D2521;
  --muted:#5C6862;
  --line:#D2D8D2;
  --accent:#2C594A;
  --accent-soft:#DDE8E2;
  --seal:#B53F2A;
  --font-display:"Gowun Batang","Noto Serif KR","AppleMyungjo","Batang",serif;
  --font-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  --tab-h:64px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#121715; --surface:#1A201D; --ink:#E3E8E4; --muted:#9AA7A0; --line:#2C3531;
    --accent:#86BBA6; --accent-soft:#1F2E28; --seal:#E06A51; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#121715; --surface:#1A201D; --ink:#E3E8E4; --muted:#9AA7A0; --line:#2C3531;
  --accent:#86BBA6; --accent-soft:#1F2E28; --seal:#E06A51; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.75;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:break-word}
button,input{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.wrap{max-width:560px;margin:0 auto;padding:0 20px calc(var(--tab-h) + 32px + env(safe-area-inset-bottom))}

/* header */
.top{position:relative;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:calc(20px + env(safe-area-inset-top)) 0 14px;border-bottom:1px solid var(--line)}
.date{font-family:var(--font-display);font-size:1.45rem;font-weight:700;line-height:1.3;letter-spacing:-0.01em;font-variant-numeric:tabular-nums}
.date-sub{font-size:.82rem;color:var(--muted);margin-top:2px}
.wx{flex:none;display:inline-flex;align-items:center;gap:6px;background:none;border:1px solid var(--line);border-radius:999px;padding:4px 10px 4px 8px;font-size:.8rem;color:var(--muted);cursor:pointer;white-space:nowrap;margin-top:4px}
.wx:hover{border-color:var(--accent);color:var(--ink)}
.wx svg{width:17px;height:17px;flex:none}
.wx .t{font-variant-numeric:tabular-nums;color:var(--ink);font-weight:500}
.wxmenu{position:absolute;right:0;top:calc(100% - 4px);z-index:20;width:min(280px,100%);background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.12);padding:12px;font-size:.85rem}
.wxmenu[hidden]{display:none}
.wxmenu .now{padding:2px 4px 10px;border-bottom:1px solid var(--line);margin-bottom:8px;color:var(--muted);line-height:1.6}
.wxmenu .now b{color:var(--ink);font-weight:600}
.wxmenu .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.wxmenu .grid button{background:none;border:1px solid transparent;border-radius:8px;padding:5px 0;cursor:pointer;font-size:.82rem}
.wxmenu .grid button:hover{border-color:var(--line)}
.wxmenu .grid button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.wxmenu .loc{grid-column:1/-1;margin-top:4px;border:1px dashed var(--line)!important}

/* verse */
.banner{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:16px;padding:10px 14px;border-radius:10px;background:var(--accent-soft);color:var(--accent);font-size:.88rem}
.banner a{font-weight:600;text-decoration:none;white-space:nowrap}
.banner[hidden]{display:none}
.verse{padding:30px 0 26px;display:grid;gap:18px}
.verse-meta{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:.8rem}
.seal{width:40px;height:40px;flex:none;border:2px solid var(--seal);color:var(--seal);border-radius:4px;display:grid;grid-template-columns:1fr 1fr;place-items:center;font-family:var(--font-display);font-weight:700;font-size:.72rem;line-height:1;padding:3px;transform:rotate(-3deg)}
.verse-meta .tag{color:var(--accent);font-weight:600}
.verse-meta .count{font-variant-numeric:tabular-nums}
.q{margin:0;font-family:var(--font-display);font-size:clamp(1.3rem,4.6vw,1.6rem);line-height:1.75;font-weight:700;letter-spacing:-0.005em;padding-left:18px;border-left:3px solid var(--accent);text-wrap:pretty}
.orig{margin:0;padding-left:21px;font-family:var(--font-display);color:var(--muted);font-size:.95rem;letter-spacing:.12em;line-height:1.7}
.orig[hidden]{display:none}
.src{margin:0;padding-left:21px;font-size:.86rem;color:var(--muted);line-height:1.6}
.src::before{content:"출처  ";color:var(--accent);font-weight:600}

.read{padding:22px 0;border-top:1px solid var(--line)}
.read h2,.vow h2{margin:0 0 8px;font-size:.78rem;font-weight:600;letter-spacing:.08em;color:var(--accent);text-wrap:balance}
.read p{margin:0}
.vow{margin:6px 0 0;padding:20px 20px 22px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--seal);border-radius:4px 12px 12px 4px}
.vow p{margin:0;font-family:var(--font-display);font-size:1.15rem;line-height:1.75;font-weight:700}

.actions{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;margin-top:22px;align-items:center}
.actions button{background:none;border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:.85rem;cursor:pointer;color:var(--muted)}
.actions button:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.actions button:disabled{opacity:.35;cursor:default}
.actions .prev{justify-self:start}.actions .next{justify-self:end}
.actions .copy{background:var(--accent);border-color:var(--accent);color:var(--paper);font-weight:500}
.actions .copy:hover{color:var(--paper)!important;opacity:.9}

/* past list */
.past-head{padding:26px 0 6px}
.past-head h1{margin:0;font-family:var(--font-display);font-size:1.4rem;text-wrap:balance}
.past-head p{margin:4px 0 0;color:var(--muted);font-size:.86rem}
.tools{display:grid;grid-template-columns:1fr auto;gap:8px;padding:14px 0 6px}
.tools input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 12px;font-size:.9rem}
.tools input[type="date"]{width:auto;font-variant-numeric:tabular-nums}
.month{position:sticky;top:0;z-index:2;background:var(--paper);padding:16px 0 6px;font-size:.8rem;font-weight:600;color:var(--accent);letter-spacing:.06em;border-bottom:1px solid var(--line)}
.row{display:grid;grid-template-columns:48px 1fr;gap:14px;padding:14px 4px;border-bottom:1px solid var(--line);text-decoration:none;color:inherit}
.row:hover{background:var(--surface)}
.row .d{text-align:center;font-variant-numeric:tabular-nums;line-height:1.2;padding-top:2px}
.row .d b{display:block;font-family:var(--font-display);font-size:1.35rem}
.row .d span{font-size:.72rem;color:var(--muted)}
.row .d span.sun{color:var(--seal)}
.row .rq{font-family:var(--font-display);font-size:1rem;line-height:1.6;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.row .rs{font-size:.76rem;color:var(--muted);margin-top:4px;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.row .rs i{font-style:normal;color:var(--accent);font-weight:600;margin-right:6px}
.empty{padding:40px 0;text-align:center;color:var(--muted)}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabbar .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;height:var(--tab-h)}
.tabbar a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-decoration:none;color:var(--muted);font-size:.76rem;font-weight:500}
.tabbar a svg{width:22px;height:22px}
.tabbar a[aria-current="page"]{color:var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(var(--tab-h) + 18px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 16px;border-radius:999px;font-size:.85rem;z-index:40;transition:opacity .2s}
.toast[hidden]{display:none}
[hidden]{display:none!important}
.home{display:inline-block;margin-top:calc(14px + env(safe-area-inset-top));font-size:.8rem;color:var(--muted);text-decoration:none}
.home:hover{color:var(--accent)}
.home + .top{padding-top:12px}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
@media (max-width:380px){.wrap{padding-left:16px;padding-right:16px}.date{font-size:1.25rem}}
</style>
</head>
<body>
<div class="wrap">
  <a class="home" href="../../index.html">← 스토리패커 홈</a>
  <header class="top">
    <div>
      <div class="date" id="todayDate">2026년 11월 7일</div>
      <div class="date-sub" id="todaySub">토요일 · 불기 2570년</div>
    </div>
    <button class="wx" id="wxBtn" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="wxMenu">
      <span id="wxIcon"></span><span class="t" id="wxTemp"></span><span id="wxCity">서울</span>
    </button>
    <div class="wxmenu" id="wxMenu" hidden role="dialog" aria-label="날씨 지역 선택">
      <div class="now" id="wxNow">날씨를 불러오는 중이에요.</div>
      <div class="grid" id="wxGrid"></div>
    </div>
  </header>

  <main id="viewDay">
    <div class="banner" id="pastBanner" hidden><span id="pastLabel"></span><a href="#today">오늘의 말씀 보기</a></div>
    <article class="verse" aria-labelledby="q">
      <div class="verse-meta">
        <div class="seal" id="seal" aria-hidden="true"><span>今</span><span>日</span><span>法</span><span>語</span></div>
        <div><span class="tag" id="tag"></span><br><span class="count" id="count"></span></div>
      </div>
      <blockquote class="q" id="q"></blockquote>
      <p class="orig" id="o" lang="zh-Hant" hidden></p>
      <p class="src" id="s"></p>
    </article>
    <section class="read"><h2>말씀 풀이</h2><p id="m"></p></section>
    <section class="read"><h2>오늘의 삶에서</h2><p id="l"></p></section>
    <section class="vow"><h2 id="vowTitle">오늘의 다짐</h2><p id="c"></p></section>
    <div class="actions">
      <button class="prev" id="prevBtn" type="button">‹ 전날</button>
      <button class="copy" id="copyBtn" type="button">말씀 복사</button>
      <button class="next" id="nextBtn" type="button">다음날 ›</button>
    </div>
  </main>

  <section id="viewPast" hidden>
    <div class="past-head">
      <h1>지난 말씀</h1>
      <p>지난 1년 동안 하루에 하나씩 받았던 말씀을 다시 읽을 수 있어요.</p>
    </div>
    <div class="tools">
      <input type="search" id="search" aria-label="지난 말씀 찾기" placeholder="말씀·출처·주제 찾기">
      <input type="date" id="jump" aria-label="날짜로 가기">
    </div>
    <div id="list"></div>
  </section>
</div>

<nav class="tabbar" aria-label="메뉴">
  <div class="in">
    <a href="#today" id="tabToday">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20c-4.5 0-8-2.2-9-5 2.6-.6 5.7.1 7.6 1.8M12 20c4.5 0 8-2.2 9-5-2.6-.6-5.7.1-7.6 1.8"/><path d="M12 20c-2.4-1.6-3.6-4.2-3.6-7.2S10 6.8 12 4c2 2.8 3.6 5.8 3.6 8.8S14.4 18.4 12 20z"/><path d="M8.6 12.6C6.6 11 4.5 10.4 3 10.6c.2 2.4 1.6 4.6 3.6 6M15.4 12.6c2-1.6 4.1-2.2 5.6-2 -.2 2.4-1.6 4.6-3.6 6"/></svg>
      오늘의 말씀
    </a>
    <a href="#past" id="tabPast">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 9.5h16M8.5 3v4M15.5 3v4M8 13h3M8 16.5h6"/></svg>
      지난 말씀
    </a>
  </div>
</nav>
<div class="toast" id="toast" hidden role="status"></div>

<script>
const DATA = [{"t":"일상","q":"날마다 좋은 날이다.","s":"운문 문언(雲門文偃), 『벽암록(碧巖錄)』 제6칙","m":"운문 스님이 제자들에게 '보름 전 일은 묻지 않겠다. 보름 뒤의 일을 한마디 일러 보라' 하고는 스스로 답한 말입니다. 좋은 날과 나쁜 날을 가리지 않고 하루하루를 온전히 사는 마음입니다.","l":"새해 첫날, 우리는 좋은 일만 있기를 바랍니다. 그러나 '날마다 좋은 날'은 좋은 일만 생긴다는 뜻이 아니라, 어떤 날이든 온전히 맞이하겠다는 마음입니다. 비 오는 날도, 힘든 날도 나의 소중한 하루입니다.","c":"올해도, 오늘도 날마다 좋은 날. 어떤 날이 와도 온전히 맞이하겠습니다.","o":"日日是好日"},{"t":"지금","q":"과거를 좇지 말고 미래를 바라지 말라. 과거는 이미 지나갔고 미래는 아직 오지 않았다. 다만 지금 일어나는 것을 그 자리에서 바르게 보라.","s":"『맛지마 니까야』 「한밤의 슬기로운 이 경(Bhaddekaratta Sutta)」(MN 131), 한역 『중아함경』 「온천림천경」","m":"'일야현자경(一夜賢者經)'으로도 알려진 경전입니다. 하룻밤이라도 이렇게 지금을 온전히 사는 이를 '슬기로운 이'라 부르셨습니다.","l":"우리는 하루의 많은 시간을 과거의 후회와 미래의 불안 속에서 보냅니다. 지금 내 앞의 사람, 지금 내 손의 일에 온전히 머무는 것이 가장 지혜로운 삶입니다.","c":"오늘 하룻밤이라도 지금 여기를 온전히 사는 슬기로운 이가 되겠습니다."},{"t":"회복","q":"깨어 있음을 즐기고 자기 마음을 잘 지켜라. 진흙에 빠진 코끼리가 스스로 빠져나오듯, 어려운 처지에서 자신을 건져 내라.","s":"『법구경』 제327게, 「코끼리품」","m":"늙은 코끼리가 진흙에 빠졌다가 전쟁의 북소리를 듣고 힘을 내어 스스로 빠져나왔다는 이야기에서 나온 게송입니다. 우리 안에는 스스로를 건져 낼 힘이 있습니다.","l":"무기력, 우울, 나쁜 습관의 늪에 빠질 때가 있습니다. 누군가 꺼내 주기를 기다리기보다, 작은 한 걸음이라도 내 힘으로 내딛는 것이 시작입니다.","c":"지금 진흙 속에 있다 해도, 나는 스스로 빠져나올 힘이 있습니다."},{"t":"평안","q":"병든 이들 가운데서도 병 없이, 근심하는 이들 가운데서도 근심 없이, 우리는 참으로 행복하게 살아가자.","s":"『법구경』 제198게, 「행복품」","m":"여기서 병과 근심은 마음의 번뇌를 뜻합니다. 주변이 번뇌로 가득해도 나만은 평온을 지킬 수 있다는 가르침입니다.","l":"불안이 전염병처럼 퍼지는 시대입니다. 모두가 걱정할 때 함께 걱정하는 대신, 차분하게 할 수 있는 일을 찾는 사람이 주변에 평안을 전합니다.","c":"오늘 근심이 가득한 곳에서도 나는 평온을 지키겠습니다."},{"t":"본성","q":"비구들이여, 이 마음은 본래 빛나는 것이다. 다만 밖에서 들어온 번뇌로 더럽혀졌을 뿐이다.","s":"『앙굿따라 니까야』 「빛나는 마음 경」(AN 1.49~52)","m":"마음의 본바탕은 맑고 빛난다는 가르침입니다. 번뇌는 손님처럼 왔다가 가는 것일 뿐, 마음의 본래 모습이 아닙니다.","l":"화가 나고 질투하고 우울한 나를 보며 '나는 원래 이런 사람'이라고 생각하지 마세요. 그것은 잠시 머문 손님일 뿐, 당신의 본래 마음은 빛나고 있습니다.","c":"내 마음은 본래 빛납니다. 오늘 그 빛을 가린 먼지를 조금 털어 내겠습니다."},{"t":"솔선","q":"먼저 자기 자신을 바르게 세우고, 그다음에 남을 가르쳐라. 그러면 지혜로운 이는 허물을 입지 않으리라.","s":"『법구경』 제158게, 「자기품(己身品)」","m":"남에게 무언가를 요구하기 전에 내가 먼저 그렇게 살고 있는지 돌아보라는 가르침입니다. 스스로 서지 못한 사람의 가르침은 힘이 없습니다.","l":"부모가 휴대폰을 내려놓지 않으면서 아이에게 책을 읽으라 하면 아이는 따르지 않습니다. 리더가 먼저 지키는 원칙만이 팀의 원칙이 됩니다.","c":"오늘 누군가에게 바라는 모습을 내가 먼저 살아 보겠습니다."},{"t":"행복","q":"아무것도 가진 것 없어도 우리는 참으로 행복하게 살아가자. 빛나는 신들처럼 기쁨을 양식으로 삼아 살아가자.","s":"『법구경』 제200게, 「행복품」","m":"탁발할 음식을 얻지 못한 날, 부처님이 하신 말씀으로 전해집니다. 행복은 소유가 아니라 마음에서 길어 올리는 기쁨이라는 뜻입니다.","l":"통장 잔고가 넉넉하지 않은 날에도 햇볕, 바람, 좋은 사람과의 대화는 공짜입니다. 가진 것이 적어도 기쁨을 먹고 사는 사람은 가난하지 않습니다.","c":"오늘 돈으로 살 수 없는 기쁨 하나를 찾아 마음껏 누리겠습니다."},{"t":"집착","q":"무릇 형상 있는 것은 모두 허망하다. 모든 형상이 형상 아님을 본다면 곧 여래를 보리라.","s":"『금강반야바라밀경(금강경)』 제5 「여리실견분(如理實見分)」","m":"금강경의 대표적인 사구게(四句偈)입니다. 눈에 보이는 겉모습은 끊임없이 변하는 것이니, 그 겉모습에 매이지 않을 때 비로소 참된 진리가 보인다는 가르침입니다.","l":"사람을 옷차림, 차, 직함으로 판단하면 그 사람의 진짜 모습을 놓칩니다. 상황도 그렇습니다. 겉으로 보이는 것 너머를 보려 할 때 지혜가 생깁니다.","c":"오늘 겉모습 너머의 참모습을 보려고 한 번 더 마음을 기울이겠습니다.","o":"凡所有相 皆是虛妄 若見諸相非相 卽見如來"},{"t":"삼독","q":"탐욕 같은 불이 없고, 성냄 같은 사로잡힘이 없으며, 어리석음 같은 그물이 없고, 갈애 같은 강물이 없다.","s":"『법구경』 제251게, 「더러움품」","m":"탐욕, 성냄, 어리석음을 불교에서는 삼독(三毒)이라 합니다. 불처럼 태우고, 사슬처럼 묶고, 그물처럼 얽어매는 이 세 가지를 알아차리는 것이 수행입니다.","l":"오늘 하루 나를 괴롭힌 것이 무엇이었는지 돌아보면 대부분 이 셋 중 하나입니다. 더 갖고 싶은 마음, 화나는 마음, 잘못 판단한 마음. 이름을 붙이는 것만으로도 힘이 약해집니다.","c":"오늘 마음이 괴로울 때, 지금 나를 태우는 것이 어떤 불인지 살펴보겠습니다."},{"t":"용기","q":"가자, 가자, 저 언덕으로 가자. 저 언덕으로 함께 가자. 깨달음이여, 영원하라.","s":"『반야심경』의 진언(眞言)","m":"반야심경을 마무리하는 진언입니다. 원래 뜻은 번역하지 않고 소리로 외우지만, 그 의미는 '모두 함께 깨달음의 저 언덕으로 건너가자'는 힘찬 격려입니다.","l":"혼자 건너기 힘든 강도 함께 건너면 건널 수 있습니다. 힘든 시기를 지나고 있는 가족, 동료, 친구에게 '함께 가자'고 말해 주세요.","c":"가자, 가자, 함께 가자. 오늘도 저 언덕을 향해 한 걸음 나아가겠습니다.","o":"揭諦揭諦 波羅揭諦 波羅僧揭諦 菩提娑婆訶"},{"t":"고요","q":"깨진 종처럼 스스로 소리를 내지 않을 수 있다면, 그대는 이미 열반에 이른 것이다. 그대에게는 다툼이 없다.","s":"『법구경』 제134게, 「폭력품」","m":"깨진 종은 아무리 쳐도 울리지 않습니다. 누가 자극해도 반응하지 않는 고요한 마음, 그것이 곧 평화의 경지라는 비유입니다.","l":"누군가 시비를 걸어올 때 꼭 맞대응해야 하는 것은 아닙니다. 울리지 않는 종처럼 반응하지 않는 것이 때로는 가장 지혜로운 대답이 됩니다.","c":"오늘 나를 건드리는 말이 있어도, 고요한 종처럼 울리지 않겠습니다."},{"t":"알아차림","q":"뱀, 악어, 새, 개, 여우, 원숭이를 각각 밧줄로 묶어 한 기둥에 매어 두면, 처음엔 제각기 가려 하지만 지치면 그 기둥 곁에 눕는다. 몸에 대한 마음챙김이 바로 그 튼튼한 기둥이다.","s":"『상윳따 니까야』 「여섯 동물 경(Chappāṇa Sutta)」(SN 35.247)","m":"여섯 동물은 눈, 귀, 코, 혀, 몸, 마음의 여섯 감각을 뜻합니다. 각자 좋아하는 곳으로 달아나려는 감각들을 마음챙김이라는 기둥에 묶어 두면 결국 고요해진다는 비유입니다.","l":"눈은 화면을, 귀는 소문을, 혀는 단 것을 찾아 달아납니다. 마음챙김이라는 기둥이 있으면 이리저리 끌려다니지 않습니다. 처음엔 힘들어도 곧 고요해집니다.","c":"오늘 내 감각들이 달아날 때, 마음챙김의 기둥으로 돌아오겠습니다."},{"t":"마음","q":"마음은 솜씨 좋은 화가와 같아서 온갖 세상을 그려 낸다. 몸과 마음이 모두 마음에서 생겨나니, 마음이 짓지 않는 것은 없다.","s":"『화엄경』 「야마궁중게찬품」, 각림보살 게송","m":"마음을 화가에 비유한 아름다운 게송입니다. 우리가 경험하는 세상은 마음이라는 화가가 그린 그림과 같습니다.","l":"오늘 하루라는 도화지에 무엇을 그릴지는 내가 정할 수 있습니다. 회색 물감만 쓰지 말고 감사와 기쁨의 색도 섞어 보세요.","c":"오늘 내 마음의 화가에게 따뜻한 색을 쥐여 주겠습니다.","o":"心如工畫師 能畫諸世間 五蘊悉從生 無法而不造"},{"t":"참회","q":"백 겁 동안 쌓은 죄도 한 생각에 단번에 없어지니, 마른 풀을 불태우듯 남김없이 사라진다.","s":"『천수경(千手經)』 참회게(懺悔偈)","m":"아무리 오래 쌓인 잘못이라도 진심으로 참회하는 한 생각이면 마른 풀이 타듯 사라진다는 희망의 게송입니다.","l":"과거의 잘못 때문에 스스로를 용서하지 못하는 이가 많습니다. 진심으로 뉘우치고 다시 바르게 살기로 마음먹는 그 순간, 새로운 시작이 가능합니다.","c":"오늘 진심으로 뉘우치고, 마른 풀을 태우듯 무거운 마음을 내려놓겠습니다.","o":"百劫積集罪 一念頓蕩除 如火焚枯草 滅盡無有餘"},{"t":"마음","q":"만약 어떤 사람이 삼세의 모든 부처님을 알고자 한다면, 법계의 본성을 관하라. 모든 것은 오직 마음이 짓는 것이다.","s":"『대방광불화엄경(화엄경)』 「야마궁중게찬품(夜摩宮中偈讚品)」, 각림보살 게송","m":"'일체유심조(一切唯心造)'로 널리 알려진 구절입니다. 세상을 어떻게 경험하는지는 마음이 그려 내는 것이니, 마음을 바로 보면 모든 것을 바로 볼 수 있다는 가르침입니다.","l":"같은 비 오는 날도 누군가에게는 우울한 날이고 누군가에게는 운치 있는 날입니다. 세상을 바꾸기는 어렵지만, 세상을 보는 내 마음은 오늘 바꿀 수 있습니다.","c":"오늘 내 마음이 그리는 세상이 조금 더 밝도록, 마음의 붓을 고르겠습니다.","o":"若人欲了知 三世一切佛 應觀法界性 一切唯心造"},{"t":"부러움","q":"자기가 얻은 것을 하찮게 여기지 말고, 남이 얻은 것을 부러워하지 말라. 남을 부러워하는 수행자는 마음의 고요를 얻지 못한다.","s":"『법구경』 제365게, 「비구품」","m":"비교는 마음의 평화를 빼앗는 가장 흔한 도둑입니다. 내가 가진 것을 소중히 여길 때 마음이 고요해진다는 가르침입니다.","l":"SNS 속 남의 여행, 남의 집, 남의 성공은 편집된 장면입니다. 그것과 나의 일상을 비교하면 늘 내가 초라해 보입니다. 내 삶의 좋은 것을 먼저 세어 보세요.","c":"오늘 남의 것을 부러워하는 대신, 내가 가진 것에 감사하겠습니다."},{"t":"무상","q":"\"여기서 우기를 지내고, 여기서 겨울과 여름을 보내리라.\" 어리석은 이는 이렇게 생각하며 다가오는 위험을 깨닫지 못한다.","s":"『법구경』 제286게, 「길품」","m":"우리는 시간이 무한히 있는 것처럼 계획을 세웁니다. 그러나 삶은 언제 끝날지 모릅니다. 지금 해야 할 일을 미루지 말라는 일깨움입니다.","l":"'언젠가 여행 가야지', '언젠가 감사하다고 말해야지'. 그 '언젠가'가 오지 않을 수도 있습니다. 소중한 일은 지금 하세요.","c":"오늘 '언젠가'로 미뤄 둔 소중한 일 하나를 지금 하겠습니다."},{"t":"깨어남","q":"삼계는 편안함이 없어 마치 불타는 집과 같다. 온갖 괴로움이 가득하여 참으로 두려워할 만하다.","s":"『법화경』 「비유품(譬喩品)」","m":"불이 난 집 안에서 놀이에 빠진 아이들을 구하기 위해 아버지가 좋은 수레를 주겠다고 불러내는 '화택(火宅)의 비유'입니다. 세상의 괴로움을 알아차리고 밖으로 나오라는 자비로운 부름입니다.","l":"우리는 바쁜 일상과 오락에 빠져 내 삶의 어디에 불이 붙었는지 모를 때가 있습니다. 건강, 관계, 마음에 연기가 나고 있지는 않은지 오늘 한번 살펴보세요.","c":"오늘 내 삶에 연기가 나는 곳이 없는지, 깨어서 살펴보겠습니다.","o":"三界無安 猶如火宅"},{"t":"법보시","q":"진리의 보시는 모든 보시를 이기고, 진리의 맛은 모든 맛을 이긴다. 진리의 즐거움은 모든 즐거움을 이기고, 갈애의 소멸은 모든 괴로움을 이긴다.","s":"『법구경』 제354게, 「갈애품」","m":"물질을 나누는 것도 귀하지만, 사람을 일깨우는 지혜를 나누는 것은 더 큰 보시입니다. 진리를 맛본 기쁨은 어떤 감각적 즐거움보다 깊습니다.","l":"좋은 책을 권하고, 힘든 친구에게 위로가 된 말씀을 전하는 것도 큰 보시입니다. 마음을 밝히는 것을 나누면 나눌수록 더 커집니다.","c":"오늘 나에게 힘이 된 좋은 말 한 줄을 누군가와 나누겠습니다."},{"t":"욕망","q":"금화가 비처럼 쏟아져도 욕망은 채워지지 않는다. 욕망은 즐거움이 적고 괴로움이 크다는 것을 지혜로운 이는 안다.","s":"『법구경』 제186게, 「붓다품」","m":"욕망은 채우면 채울수록 더 커지는 그릇과 같습니다. 바깥의 것으로는 끝내 만족할 수 없다는 것을 아는 것이 자유의 시작입니다.","l":"연봉이 오르면 씀씀이도 오르고, 원하던 것을 사면 곧 다음 것이 보입니다. '얼마면 충분할까'를 스스로 정해 두는 사람만이 욕망의 비를 피할 수 있습니다.","c":"오늘 이미 가진 것들을 하나하나 세어 보며, 충분함을 느껴 봅니다."},{"t":"인내","q":"내가 옛날 가리왕에게 몸을 베이고 끊길 때, 나에게는 나라는 생각도, 남이라는 생각도 없었다. 만약 그런 생각이 있었다면 성내고 원망하는 마음이 일어났을 것이다.","s":"『금강경』 제14 「이상적멸분(離相寂滅分)」","m":"부처님이 전생에 인욕선인(忍辱仙人)으로 계실 때의 이야기입니다. '나'에 대한 집착이 없었기에 극한의 고통 속에서도 원망이 일어나지 않았습니다.","l":"상처받는 순간 우리는 '감히 나에게'라는 생각을 합니다. 그 '나'가 조금 가벼워지면 같은 일도 훨씬 덜 아픕니다. 인내는 참는 것이 아니라 '나'를 가볍게 하는 것입니다.","c":"오늘 상처받을 때, '나'를 조금 가볍게 하여 원망을 내려놓겠습니다."},{"t":"정진","q":"부지런함과 깨어 있음, 절제와 자기 다스림으로 지혜로운 이는 홍수도 휩쓸어 가지 못하는 섬을 스스로 만든다.","s":"『법구경』 제25게, 「불방일품」","m":"인생에는 감당하기 어려운 일들이 홍수처럼 밀려올 때가 있습니다. 그때 나를 지켜 주는 것은 평소에 꾸준히 쌓아 온 마음의 힘, 곧 스스로 쌓은 섬입니다.","l":"위기가 닥친 날 갑자기 강해지는 사람은 드뭅니다. 매일의 작은 규칙, 잠자리 시간을 지키는 일, 하루 10분 걷기, 감정이 올라올 때 숨을 고르는 연습이 모여 흔들리지 않는 땅이 됩니다.","c":"오늘도 내 섬에 돌 하나를 얹습니다. 작지만, 분명히 쌓이고 있습니다."},{"t":"지혜","q":"관자재보살이 깊은 반야바라밀다를 행할 때, 몸과 마음의 다섯 무더기가 모두 공함을 비추어 보고 온갖 괴로움과 재앙을 건넜다.","s":"『반야심경』","m":"반야심경의 첫머리입니다. 관세음보살이 깊은 지혜로 나를 이루는 것들이 고정된 실체가 아님을 비추어 보고 모든 괴로움에서 벗어났다는 내용입니다.","l":"괴로움은 '나'를 단단한 실체로 여길 때 커집니다. 내 몸도 감정도 생각도 흘러가는 것임을 비추어 보면, 같은 고통도 지나가는 구름처럼 보입니다.","c":"오늘 내 괴로움을 지혜의 빛으로 비추어 보겠습니다.","o":"照見五蘊皆空 度一切苦厄"},{"t":"내려놓음","q":"재스민 덩굴이 시든 꽃을 떨구듯, 수행자들이여, 탐욕과 성냄을 떨쳐 버려라.","s":"『법구경』 제377게, 「비구품」","m":"꽃은 시든 꽃잎을 붙들지 않고 자연스럽게 떨굽니다. 우리도 시들어 버린 감정을 억지로 붙들지 말고 자연스럽게 놓아 보내라는 아름다운 비유입니다.","l":"이미 지난 일에 대한 분노, 더 이상 맞지 않는 욕심을 계속 붙들고 있으면 새 꽃이 필 자리가 없습니다. 시든 것은 떨궈야 새것이 핍니다.","c":"오늘 시든 감정 하나를 꽃잎처럼 가볍게 떨궈 보냅니다."},{"t":"집착","q":"뗏목으로 강을 건넌 사람이 '이 뗏목이 나를 많이 도왔다'며 그것을 머리에 이고 길을 간다면 옳겠는가? 나는 뗏목처럼, 건너기 위한 것이지 붙잡기 위한 것이 아닌 법을 설하였다.","s":"『맛지마 니까야』 「뱀의 비유 경(Alagaddūpama Sutta)」(MN 22), 한역 『중아함경』 「아리타경」","m":"가르침조차도 목적지에 이르기 위한 도구이지 집착의 대상이 아니라는 '뗏목의 비유'입니다. 금강경에서도 이 비유가 인용됩니다.","l":"한때 나를 도왔던 방법, 생각, 관계도 시간이 지나면 내려놓아야 할 때가 있습니다. 고마움은 간직하되, 무거워진 뗏목은 강가에 두고 가볍게 걸어가세요.","c":"오늘 나를 도왔지만 이제는 무거워진 뗏목 하나를 고맙게 내려놓겠습니다."},{"t":"지혜","q":"말을 많이 한다고 해서 지혜로운 이가 아니다. 평화롭고, 원한이 없으며, 두려움이 없는 이를 지혜롭다고 한다.","s":"『법구경』 제258게, 「법에 머무는 이품(住法品)」","m":"지혜는 말솜씨나 지식의 양이 아니라 그 사람이 지닌 평화로 드러납니다. 말이 적어도 고요하고 원한 없는 사람이 진정 지혜로운 사람입니다.","l":"말 잘하고 아는 것 많은 사람이 늘 지혜로운 것은 아닙니다. 위기 앞에서 흔들리지 않고 누구도 미워하지 않는 사람, 그 곁에 있으면 편안해지는 사람이 지혜로운 사람입니다.","c":"오늘 나는 많이 아는 사람보다 평화로운 사람이 되겠습니다."},{"t":"인과","q":"선이 무르익기 전까지는 선한 이도 괴로움을 겪는다. 그러나 선이 무르익으면 선한 이는 좋은 결과를 본다.","s":"『법구경』 제120게, 「악품」","m":"바르게 사는데도 일이 잘 안 풀릴 때가 있습니다. 부처님은 그것이 아직 열매가 익지 않았을 뿐이라고 위로하십니다.","l":"정직하게 일하는데 손해만 보는 것 같고, 착하게 살아도 알아주는 이 없는 것 같을 때가 있습니다. 씨앗은 땅속에서 자라는 동안 보이지 않을 뿐입니다.","c":"지금 보이지 않아도 괜찮습니다. 내가 심은 선은 반드시 무르익습니다."},{"t":"관계","q":"사람을 감싸 안는 네 가지 방법이 있다. 베풂, 사랑스러운 말, 이롭게 하는 행동, 함께하는 것이다.","s":"『앙굿따라 니까야』 「섭수 경(Saṅgaha Sutta)」(AN 4.32) — 사섭법(四攝法)","m":"사섭법은 사람을 품고 이끄는 네 가지 방법입니다. 나누고, 다정하게 말하고, 도움이 되는 일을 하고, 같은 자리에서 함께하는 것입니다.","l":"좋은 리더, 좋은 부모, 좋은 친구의 공통점이 바로 이것입니다. 위에서 지시하는 것이 아니라 함께 땀 흘리는 '동사(同事)'가 특히 마음을 움직입니다.","c":"오늘 베풂, 다정한 말, 도움, 함께함 중 하나를 꼭 실천하겠습니다.","o":"布施 愛語 利行 同事"},{"t":"나눔","q":"진실을 말하고, 성내지 말며, 적은 것이라도 청하는 이에게는 나누어 주라. 이 세 가지로 하늘에 이르리라.","s":"『법구경』 제224게, 「분노품」","m":"하늘에 이르는 길이 거창한 수행이 아니라 진실, 온화함, 나눔이라는 일상의 덕목이라는 것을 알려 줍니다.","l":"가진 것이 적어도 나눌 수 있습니다. 커피 한 잔, 시간 30분, 따뜻한 한마디도 나눔입니다. 그리고 그 나눔은 받는 이보다 주는 이를 더 풍요롭게 합니다.","c":"오늘 진실하게 말하고, 화내지 않고, 작은 것 하나를 나누겠습니다."},{"t":"불성","q":"모든 중생에게는 다 불성이 있다.","s":"『대반열반경(大般涅槃經)』","m":"모든 생명 안에 부처가 될 가능성, 곧 깨달음의 성품이 있다는 대승불교의 핵심 가르침입니다. 누구도 예외가 없습니다.","l":"아무리 미운 사람에게도, 아무리 실망스러운 나 자신에게도 불성이 있습니다. 그것을 믿으면 사람을 포기하지 않게 되고, 나 자신도 포기하지 않게 됩니다.","c":"내 안에도, 저 사람 안에도 부처가 있습니다. 오늘 아무도 포기하지 않겠습니다.","o":"一切衆生 悉有佛性"},{"t":"감사","q":"이 음식이 어디서 왔는가. 내 덕행으로 받기 부끄럽네. 마음의 온갖 욕심 버리고, 몸을 지탱하는 약으로 알아, 도업을 이루고자 이 공양을 받습니다.","s":"「오관게(五觀偈)」 — 당나라 도선율사의 가르침에서 비롯되어 사찰 공양 때 외는 게송","m":"절에서 밥을 먹기 전에 외는 게송입니다. 한 그릇의 밥에 담긴 수많은 이의 수고를 생각하고, 욕심 없이 감사하게 먹겠다는 다짐입니다.","l":"바쁘게 먹는 한 끼에도 농부의 땀, 요리한 이의 정성, 햇빛과 비가 담겨 있습니다. 오늘 식사 전 잠시 멈추어 그 수고를 떠올려 보세요.","c":"오늘 한 끼의 밥 앞에서 잠시 멈추어 감사하겠습니다.","o":"計功多少量彼來處 忖己德行全缺應供 防心離過貪等爲宗 正思良藥爲療形枯 爲成道業應受此食"},{"t":"진실","q":"땋은 머리나 가문이나 태생으로 성자가 되는 것이 아니다. 진실과 바른 법이 있는 이, 그가 깨끗한 이요 성자이다.","s":"『법구경』 제393게, 「바라문품(婆羅門品)」","m":"부처님 당시 인도는 태생에 따라 신분이 정해졌습니다. 부처님은 사람의 가치는 출신이 아니라 진실한 삶에서 나온다고 선언하셨습니다.","l":"학벌, 집안, 직함으로 사람을 판단하는 일은 지금도 흔합니다. 그러나 진짜 사람의 품격은 그가 어떻게 살아가는지에서 드러납니다.","c":"오늘 나는 출신이 아니라 진실한 삶으로 나를 증명하겠습니다."},{"t":"지금","q":"지나간 것을 슬퍼하지 않고, 오지 않은 것을 애태우지 않으며, 지금 여기에서 살아가니 그 얼굴빛이 맑다.","s":"『상윳따 니까야』 「숲 경(Arañña Sutta)」(SN 1.10)","m":"하루 한 끼만 먹고 숲에 사는 수행자들의 얼굴이 어찌 그리 맑으냐는 물음에 부처님이 답하신 게송입니다. 맑은 얼굴의 비결은 지금 이 순간을 사는 데 있었습니다.","l":"걱정과 후회로 가득한 얼굴은 금세 지쳐 보입니다. 지난 일과 오지 않은 일을 잠시 내려놓고 지금 할 일에 마음을 두면 표정부터 맑아집니다.","c":"오늘 지나간 일도, 오지 않은 일도 내려놓고, 맑은 얼굴로 지금을 살겠습니다."},{"t":"업","q":"쇠에서 생긴 녹이 그 쇠를 갉아먹듯, 행실이 바르지 못한 이는 자기가 지은 업이 자신을 파멸로 이끈다.","s":"『법구경』 제240게, 「더러움품」","m":"녹은 밖에서 오는 것이 아니라 쇠 자체에서 생겨 쇠를 망칩니다. 그릇된 행동은 남보다 먼저 나 자신을 안에서부터 갉아먹습니다.","l":"거짓말을 하면 그것을 지키기 위해 또 거짓말을 해야 하고, 그 불안이 나를 갉아먹습니다. 바르게 사는 것은 남을 위해서가 아니라 나를 녹슬지 않게 하기 위해서입니다.","c":"오늘 녹이 생기지 않도록, 내 마음과 행동을 맑게 닦겠습니다."},{"t":"상생","q":"자기를 지키면 남을 지키는 것이고, 남을 지키면 자기를 지키는 것이다.","s":"『상윳따 니까야』 「곡예사 경(Sedaka Sutta)」(SN 47.19)","m":"장대 위에서 공연하는 곡예사 스승과 제자의 비유입니다. 서로를 지켜 주려 하기보다 각자 자기 균형을 잘 잡을 때 둘 다 안전하다는 뜻이며, 동시에 인내와 자애로 남을 지키는 것이 곧 나를 지키는 길이라는 가르침입니다.","l":"내가 건강하고 평온해야 가족도 돌볼 수 있습니다. 비행기에서 산소마스크를 내가 먼저 쓰라는 안내와 같습니다. 나를 돌보는 것은 이기심이 아니라 남을 위한 준비입니다.","c":"오늘 나를 잘 지켜, 내 곁의 사람들도 함께 지키겠습니다."},{"t":"정진","q":"일어나라, 게으르지 말라. 바른 법을 실천하라. 바른 법대로 사는 이는 이 세상에서도 저 세상에서도 행복하게 잠든다.","s":"『법구경』 제168게, 「세상품」","m":"'일어나라'는 힘찬 외침으로 시작하는 게송입니다. 몸을 일으키고 마음을 일으켜 바르게 살아가라는 격려입니다.","l":"아침에 눈뜨기 힘든 날, 무기력한 날에 이 구절을 떠올려 보세요. 일어나는 것, 그것이 시작입니다. 침대에서 나오는 것도 오늘의 첫 번째 승리입니다.","c":"일어나겠습니다. 오늘이라는 귀한 하루를 시작하겠습니다."},{"t":"본래","q":"여기 한 물건이 있으니, 본래부터 밝고 신령하여 일찍이 나지도 않았고 죽지도 않았으며, 이름 지을 수도 없고 모양을 그릴 수도 없다.","s":"서산 휴정(西山休靜), 『선가귀감(禪家龜鑑)』","m":"조선의 서산대사가 쓴 선가귀감의 첫 구절입니다. 우리 안에 태어나지도 죽지도 않는 밝은 마음, 이름 붙일 수 없는 '한 물건'이 있다는 가르침입니다.","l":"나이, 직업, 역할로는 다 설명되지 않는 나가 있습니다. 모든 것이 변해도 그것을 알아차리는 이 밝은 마음은 늘 여기에 있습니다. 그것이 나의 가장 깊은 근원입니다.","c":"내 안의 밝은 '한 물건'을 믿으며, 오늘을 당당하게 살겠습니다.","o":"有一物於此 從本以來 昭昭靈靈 不曾生 不曾滅 名不得 狀不得"},{"t":"절제","q":"몸으로 짓는 성냄을 지키고 몸을 다스려라. 말로 짓는 성냄을 지키고 말을 다스려라. 마음으로 짓는 성냄을 지키고 마음을 다스려라.","s":"『법구경』 제231~233게, 「분노품」","m":"분노는 몸, 말, 마음 세 가지 통로로 드러납니다. 세 곳 모두를 지켜야 분노가 새어 나가지 않습니다.","l":"문을 쾅 닫는 행동, 날카로운 말투, 속으로 끓어오르는 생각. 분노가 어느 통로로 나가려 하는지 알아차리기만 해도 다스리기가 훨씬 쉬워집니다.","c":"오늘 분노가 올라오면 몸과 말과 마음, 세 문을 차분히 지키겠습니다."},{"t":"시작","q":"털끝만큼이라도 어긋나면 하늘과 땅만큼 벌어진다.","s":"삼조 승찬, 『신심명』","m":"처음의 작은 차이가 나중에는 엄청난 차이가 된다는 가르침입니다. 마음의 방향을 처음부터 바르게 잡는 것이 중요합니다.","l":"각도기 1도의 차이가 먼 거리에서는 엄청난 간격이 됩니다. 오늘의 작은 습관, 작은 말투가 10년 뒤의 나를 결정합니다. 작은 것을 바르게 하세요.","c":"오늘 작은 것 하나를 바르게 하여, 내 삶의 방향을 지키겠습니다.","o":"毫釐有差 天地懸隔"},{"t":"허물","q":"남의 허물은 보기 쉬우나 자기 허물은 보기 어렵다. 남의 허물은 겨를 까부르듯 널리 드러내고, 자기 허물은 노름꾼이 나쁜 패를 숨기듯 감춘다.","s":"『법구경』 제252게, 「더러움품」","m":"인간의 본성을 날카롭게 꿰뚫은 게송입니다. 우리는 남의 잘못에는 돋보기를, 내 잘못에는 가림막을 씁니다. 이 습관을 알아차리는 것이 성숙의 시작입니다.","l":"남의 실수는 단체 대화방에 퍼지고 내 실수는 조용히 묻힙니다. 오늘 누군가의 허물을 말하고 싶을 때, 내 패도 한 번 펼쳐 보면 말이 조심스러워집니다.","c":"오늘은 남의 허물을 까부르지 않고, 내 허물을 정직하게 들여다보겠습니다."},{"t":"역경","q":"세상살이에 곤란 없기를 바라지 말라. 세상살이에 곤란이 없으면 업신여기는 마음과 사치한 마음이 생긴다. 그러므로 근심과 곤란으로써 세상을 살아가라.","s":"묘협 스님, 「보왕삼매론」 제2","m":"어려움이 없는 삶은 사람을 교만하게 만듭니다. 곤란은 우리를 겸손하게 하고 단단하게 만드는 스승이라는 가르침입니다.","l":"일이 너무 순조로우면 오히려 경계하라는 말이 있습니다. 지금의 어려움이 나를 겸손하고 단단하게 만드는 과정이라고 생각하면 견딜 힘이 생깁니다.","c":"오늘의 곤란이 나를 단단하게 만드는 스승임을 믿겠습니다.","o":"處世不求無難 世無難則驕奢必起"},{"t":"작은악","q":"'그 정도는 내게 오지 않겠지' 하며 작은 악을 가볍게 여기지 말라. 물방울이 떨어져 물항아리를 채우듯, 어리석은 이는 조금씩 쌓아 악으로 가득 찬다.","s":"『법구경』 제121게, 「악품」","m":"큰 잘못은 대부분 작은 잘못의 반복에서 시작됩니다. 한 방울은 아무것도 아닌 듯해도 쌓이면 항아리를 넘치게 합니다.","l":"작은 거짓말, 작은 무례, 작은 부정이 '이 정도는 괜찮겠지' 하는 마음과 함께 습관이 됩니다. 작은 것을 지키는 사람이 큰 것도 지킵니다.","c":"오늘은 작은 것 하나도 바르게 하겠습니다. 그 한 방울이 나를 만듭니다."},{"t":"조언","q":"허물을 지적하고 꾸짖어 주는 지혜로운 이를 만나면, 숨겨진 보물이 있는 곳을 알려 주는 사람처럼 따르라. 그런 이를 따르면 좋은 일만 있고 나쁜 일은 없다.","s":"『법구경』 제76게, 「현자품(賢哲品)」","m":"쓴소리를 해 주는 사람은 귀합니다. 부처님은 그런 사람을 보물 지도를 건네는 사람에 비유하셨습니다. 듣기 불편한 말 속에 성장의 열쇠가 있기 때문입니다.","l":"피드백을 들으면 방어하고 싶은 마음이 먼저 올라옵니다. 그 순간 '이 사람이 내게 보물 위치를 알려 주는 중이다'라고 생각해 보면, 서운함 대신 고마움이 자리할 수 있습니다.","c":"오늘 들은 쓴소리 하나를 보물 지도처럼 고맙게 받아 들겠습니다."},{"t":"맑음","q":"애욕을 품은 사람이 도를 보지 못하는 것은, 맑은 물을 손으로 휘저어 놓으면 여러 사람이 들여다보아도 그 그림자를 보지 못하는 것과 같다.","s":"『사십이장경』","m":"물이 맑고 고요해야 얼굴이 비치듯, 욕망과 번뇌로 휘저어진 마음으로는 진실을 볼 수 없다는 가르침입니다.","l":"무언가를 너무 원할 때 우리는 상황을 제대로 보지 못합니다. 사고 싶은 물건, 얻고 싶은 사람, 이기고 싶은 다툼. 휘젓던 손을 잠시 멈추면 물이 가라앉고 진실이 보입니다.","c":"오늘 마음을 휘젓는 손을 멈추고, 맑아지기를 기다리겠습니다.","o":"譬如澄水 致手攪之 衆人共臨 無有覩其影者"},{"t":"시간","q":"시간 시간이 흘러 낮과 밤이 빨리 지나가고, 날과 날이 흘러 한 달이 빨리 지나가며, 달과 달이 흘러 문득 한 해가 이르고, 해와 해가 흘러 잠깐 사이에 죽음의 문에 이른다.","s":"원효, 『발심수행장』","m":"시간이 얼마나 빨리 흐르는지를 리듬감 있게 노래한 구절입니다. 미루지 말고 지금 마음을 내어 수행하라는 간절한 권유입니다.","l":"'벌써 한 해가 다 갔네'라는 말을 매년 합니다. 시간은 기다려 주지 않습니다. 하고 싶은 일, 해야 할 말, 만나고 싶은 사람이 있다면 지금입니다.","c":"시간은 흐릅니다. 오늘 미루던 소중한 일 하나를 지금 하겠습니다.","o":"時時移移 速經日夜 日日移移 速經月晦 月月移移 忽來年至 年年移移 暫到死門"},{"t":"부지런함","q":"어리석은 이는 방일에 빠지고, 지혜로운 이는 부지런함을 가장 귀한 재산처럼 지킨다.","s":"『법구경』 제26게, 「불방일품」","m":"부지런함은 돈이나 재능보다 귀한 재산입니다. 지혜로운 이는 그것을 보물처럼 아끼고 지킨다는 뜻입니다.","l":"재능 있는 사람보다 꾸준한 사람이 결국 멀리 갑니다. 매일 조금씩 하는 습관은 시간이 지날수록 이자처럼 불어나는 재산입니다.","c":"오늘 나의 부지런함이라는 재산을 조금 더 불려 보겠습니다."},{"t":"일","q":"일을 꾀하되 쉽게 되기를 바라지 말라. 일이 쉽게 되면 뜻을 경솔한 데 두게 된다. 그러므로 여러 겁을 겪어서 일을 성취하라.","s":"묘협 스님, 「보왕삼매론」 제5","m":"쉽게 이룬 일은 쉽게 여기게 되고 가볍게 다루게 됩니다. 오래 공들여 이룬 것이 진정 소중하게 남는다는 가르침입니다.","l":"일이 생각보다 더디게 풀려 답답할 때가 있습니다. 그 시간 동안 쌓인 경험과 인내가 결과만큼 귀한 자산이 됩니다. 쉽게 얻었다면 그만큼 아끼지 못했을 것입니다.","c":"오늘 더디게 가는 일 앞에서 조급해하지 않고, 공들여 이루겠습니다.","o":"謀事不求易成 事易成則志存輕慢"},{"t":"행동","q":"한 뒤에 후회하고 눈물 흘리며 그 과보를 받는 행동은 잘한 것이 아니다. 한 뒤에 후회하지 않고 기쁘게 그 과보를 받는 행동이 잘한 것이다.","s":"『법구경』 제67~68게, 「어리석은 이품」","m":"좋은 행동과 나쁜 행동을 구별하는 간단한 기준을 제시합니다. 그 결과를 기쁘게 받을 수 있는가를 물으면 됩니다.","l":"순간의 감정으로 한 말, 충동적으로 한 결정은 대개 눈물로 돌아옵니다. 행동하기 전 '이 결과를 웃으며 받을 수 있을까?'를 물어보세요.","c":"오늘 웃으며 결과를 받을 수 있는 행동만 하겠습니다."},{"t":"분노","q":"공덕을 빼앗는 도적 가운데 성냄보다 더한 것은 없다.","s":"『불유교경』","m":"오랫동안 쌓아 온 선행과 신뢰도 한 번의 분노로 무너질 수 있습니다. 그래서 성냄을 가장 무서운 도적이라 하셨습니다.","l":"10년 쌓은 관계가 한순간의 화로 무너지기도 합니다. 화가 날 때 '지금 도적이 들어오려 한다'고 생각하며 마음의 문단속을 해 보세요.","c":"오늘 성냄이라는 도적이 내 공덕을 훔쳐 가지 못하게 문을 지키겠습니다.","o":"劫功德賊 無過瞋恚"},{"t":"관계","q":"남이 내 뜻대로 순종해 주기를 바라지 말라. 남이 내 뜻대로 순종해 주면 마음이 스스로 교만해진다. 그러므로 내 뜻에 맞지 않는 사람들로써 원림을 삼으라.","s":"묘협 스님, 「보왕삼매론」 제7","m":"모두가 내 뜻대로 따라 주면 나는 교만해집니다. 나와 다른 사람들이 오히려 나를 성장시키는 정원이라는 가르침입니다.","l":"반대 의견을 내는 동료, 말을 듣지 않는 아이가 답답할 수 있습니다. 그러나 그들 덕분에 나는 설득하는 법, 기다리는 법, 겸손해지는 법을 배웁니다.","c":"오늘 내 뜻대로 되지 않는 사람을, 나를 키우는 정원으로 여기겠습니다.","o":"於人不求順適 人順適則心必自矜"},{"t":"비움","q":"수행자여, 이 배의 물을 퍼내라. 물을 퍼내면 배는 가볍게 나아가리라. 탐욕과 성냄을 끊으면 그대는 열반에 이르리라.","s":"『법구경』 제369게, 「비구품」","m":"물이 찬 배는 무거워 나아가지 못합니다. 마음에 가득 찬 탐욕과 분노를 퍼낼 때 삶이 가볍게 앞으로 나아간다는 비유입니다.","l":"마음이 무거울 때는 무언가를 더하기보다 덜어 낼 때입니다. 쌓인 감정을 글로 쏟아 내고, 필요 없는 약속을 줄이고, 방 하나를 정리하는 것도 물을 퍼내는 일입니다.","c":"오늘 내 마음의 배에서 무거운 물 한 바가지를 퍼내겠습니다."},{"t":"생각","q":"수행자가 무엇이든 자주 생각하고 곱씹는 것, 그쪽으로 마음이 기운다.","s":"『맛지마 니까야』 「두 갈래 생각 경(Dvedhāvitakka Sutta)」(MN 19)","m":"마음은 자주 가는 길로 길이 납니다. 미움을 자주 생각하면 미움으로, 자애를 자주 생각하면 자애로 마음이 기울어집니다.","l":"하루 종일 불평을 생각하면 불평하는 사람이 되고, 감사를 생각하면 감사하는 사람이 됩니다. 내가 자주 머무는 생각이 곧 나의 성격이 됩니다.","c":"오늘 자주 감사를 생각하여, 내 마음이 감사 쪽으로 기울게 하겠습니다."},{"t":"희망","q":"큰길가에 버려진 쓰레기 더미에서도 맑은 향기를 품은 아름다운 연꽃이 피어나듯, 눈먼 중생들 가운데서도 부처님의 제자는 지혜로 빛난다.","s":"『법구경』 제58~59게, 「꽃품」","m":"연꽃은 깨끗한 물이 아니라 진흙에서 핍니다. 아무리 혼탁한 환경이라도 그 속에서 맑음을 꽃피울 수 있다는 것이 불교가 연꽃을 사랑하는 이유입니다.","l":"'환경이 이러니 어쩔 수 없다'는 말은 때로 사실이지만, 그 환경 속에서도 다르게 피어난 사람들이 있습니다. 거친 직장, 어려운 가정 형편 속에서도 맑음을 지키는 것, 그것이 연꽃의 길입니다.","c":"지금 내가 선 자리가 진흙이라 해도, 나는 그 위에 꽃을 피울 수 있습니다."},{"t":"주인","q":"머무는 곳마다 주인이 되면, 서 있는 곳이 모두 참되다.","s":"임제 의현(臨濟義玄), 『임제록(臨濟錄)』","m":"어떤 상황에서도 끌려다니지 않고 주인으로 살면 그곳이 곧 진리의 자리라는 가르침입니다. 한국 선불교에서 가장 사랑받는 구절 중 하나입니다.","l":"원하지 않은 부서, 원하지 않은 상황에 놓일 때가 있습니다. 그곳에서 손님처럼 불평하며 지낼 수도, 주인처럼 의미를 찾을 수도 있습니다. 주인이 될 때 그 자리가 빛납니다.","c":"오늘 내가 선 이 자리에서 손님이 아닌 주인으로 살겠습니다.","o":"隨處作主 立處皆眞"},{"t":"선지식","q":"지혜롭고, 많이 배우고, 인내하며, 계를 지키는 거룩한 이를 따르라. 달이 별들의 길을 따르듯 그런 선한 이를 따르라.","s":"『법구경』 제208게, 「행복품」","m":"좋은 스승과 선배를 찾아 따르는 것은 밤하늘의 달이 별의 길을 따르듯 자연스럽고 아름다운 일입니다.","l":"존경할 만한 사람을 찾아 그 사람의 습관과 태도를 배워 보세요. 직접 만나지 못해도 책이나 강연으로 따를 수 있습니다.","c":"오늘 내가 본받고 싶은 사람의 좋은 점 하나를 따라 해 보겠습니다."},{"t":"업","q":"나는 내 업의 주인이고, 업의 상속자이며, 업에서 태어났고, 업을 친척으로 하며, 업을 의지처로 한다. 선이든 악이든 내가 지은 업을 나는 이어받는다.","s":"『앙굿따라 니까야』 「늘 성찰해야 할 다섯 가지 경」(AN 5.57)","m":"다섯 가지 성찰 중 마지막입니다. 내 행위의 결과는 내가 이어받습니다. 이것은 두려운 말이면서 동시에 내 삶을 내가 만들 수 있다는 희망의 말입니다.","l":"나의 오늘은 어제의 내가 지은 결과이고, 나의 내일은 오늘의 내가 짓는 것입니다. 운명을 탓하기보다 지금 좋은 업을 짓는 데 집중하세요.","c":"나는 내 삶의 주인입니다. 오늘 좋은 업을 짓겠습니다."},{"t":"보시","q":"공덕을 베풀려면 과보를 바라지 말라. 과보를 바라면 도모하는 뜻을 갖게 된다. 그러므로 덕 베푼 것을 헌신처럼 버리라.","s":"묘협 스님, 「보왕삼매론」 제8","m":"보답을 바라는 베풂은 거래가 되어 버립니다. 베푼 뒤에는 헌 신발 버리듯 잊어버리라는 시원한 가르침입니다.","l":"도와준 사람이 고마워하지 않으면 서운해집니다. 베풂은 주는 순간 이미 끝난 것입니다. 기억하고 계산할수록 내 마음만 무거워집니다.","c":"오늘 베푼 일은 헌 신발처럼 가볍게 잊어버리겠습니다.","o":"施德不求望報 德望報則意有所圖"},{"t":"후회","q":"악행은 하지 않는 것이 낫다. 하고 나면 나중에 괴롭다. 선행은 하는 것이 낫다. 하고 나서 후회가 없다.","s":"『법구경』 제314게, 「지옥품(地獄品)」","m":"행동의 기준을 '나중에 후회할 것인가'로 삼으라는 단순하고도 명확한 가르침입니다. 선행은 그 자체로 마음의 평화를 남깁니다.","l":"무언가를 할까 말까 망설여질 때 '내일 아침의 나는 이 선택에 감사할까?'라고 물어보세요. 대부분의 답은 이미 마음속에 있습니다.","c":"오늘 내일의 내가 고마워할 선택을 하겠습니다."},{"t":"선행","q":"꽃 무더기에서 많은 꽃다발을 엮을 수 있듯, 사람으로 태어난 이는 많은 선을 행해야 한다.","s":"『법구경』 제53게, 「꽃품」","m":"우리 삶은 꽃 무더기와 같습니다. 그 꽃으로 무엇을 엮을지는 우리에게 달려 있습니다. 사람으로 태어난 기회를 선행으로 아름답게 엮으라는 뜻입니다.","l":"하루라는 꽃 무더기로 무엇을 엮을지 선택할 수 있습니다. 불평으로 엮을 수도, 감사와 친절로 엮을 수도 있습니다.","c":"오늘 하루의 꽃으로 누군가에게 줄 아름다운 꽃다발을 엮겠습니다."},{"t":"감사","q":"눈먼 거북이가 백 년에 한 번 바다 위로 떠올라, 떠다니는 나무판자의 구멍에 우연히 목을 넣는 것보다 사람의 몸을 받기가 더 어렵다.","s":"『잡아함경』 제406경, 『상윳따 니까야』 「구멍 경(Chiggaḷa Sutta)」(SN 56.48)","m":"'맹구우목(盲龜遇木)'의 비유입니다. 사람으로 태어난 것이 얼마나 드문 기회인지를 보여 줍니다. 이 귀한 삶을 헛되이 보내지 말라는 가르침입니다.","l":"우리는 살아 있다는 기적을 너무 쉽게 잊습니다. 오늘 하루가 눈먼 거북이가 나무판자를 만난 것만큼 귀하다는 것을 기억하면, 하루를 대하는 마음이 달라집니다.","c":"이 귀한 삶, 이 귀한 하루를 결코 헛되이 보내지 않겠습니다.","o":"盲龜遇木"},{"t":"맑음","q":"물동이의 물이 물감으로 흐려져 있거나, 불에 끓고 있거나, 이끼로 덮여 있거나, 바람에 출렁이면, 그 물에 자기 얼굴을 비추어 보아도 제대로 보이지 않는다.","s":"『상윳따 니까야』 「상가라와 경(Saṅgārava Sutta)」(SN 46.55)","m":"탐욕, 분노, 무기력, 들뜸, 의심이라는 다섯 가지 장애가 마음을 흐리면 바른 판단을 할 수 없다는 비유입니다. 물이 맑고 고요해야 얼굴이 비칩니다.","l":"화가 끓을 때, 욕심에 물들 때, 불안에 출렁일 때는 중요한 결정을 미루세요. 마음의 물이 가라앉은 뒤에 비추어 보면 답이 보입니다.","c":"오늘 마음의 물이 흐리면, 맑아질 때까지 기다렸다가 결정하겠습니다."},{"t":"행복","q":"미워하는 이들 가운데서도 미워하지 않으며, 우리는 참으로 행복하게 살아가자. 미워하는 사람들 속에서 미움 없이 머물자.","s":"『법구경』 제197게, 「행복품(安樂品)」","m":"주변이 미움으로 가득해도 나까지 미움에 물들 필요는 없습니다. 행복은 환경이 아니라 내 마음이 선택하는 것이라는 가르침입니다.","l":"험담이 오가는 직장, 갈등이 가득한 뉴스 속에서 함께 분노하기는 쉽습니다. 그 흐름에 휩쓸리지 않고 따뜻함을 지키는 것, 그것이 이 시대의 수행입니다.","c":"오늘 미움이 오가는 자리에서도 나는 미움 없이 머물겠습니다."},{"t":"쉼","q":"일 없는 사람이 귀한 사람이다. 다만 억지로 꾸미지 말라.","s":"임제 의현, 『임제록』","m":"'무사(無事)'는 할 일이 없다는 뜻이 아니라, 밖에서 무언가를 구하려 애쓰지 않고 본래 마음 그대로 쉬는 상태를 말합니다.","l":"늘 무언가를 해야 하고, 무언가가 되어야 한다는 압박 속에 삽니다. 가끔은 아무것도 꾸미지 않고 그냥 있는 것도 괜찮습니다. 쉼은 낭비가 아니라 귀한 시간입니다.","c":"오늘 잠시라도 아무것도 꾸미지 않고, 그저 편안히 쉬겠습니다.","o":"無事是貴人 但莫造作"},{"t":"겸손","q":"어리석은 이가 스스로 어리석음을 안다면 그만큼은 지혜롭다. 어리석으면서 스스로 지혜롭다고 여기는 이, 그를 참으로 어리석다 한다.","s":"『법구경』 제63게, 「어리석은 이품」","m":"모른다는 것을 아는 것이 지혜의 시작입니다. 가장 위험한 것은 모르면서 안다고 확신하는 마음입니다.","l":"인터넷에서 몇 분 찾아본 지식으로 전문가를 가르치려 들 때가 있습니다. '내가 틀릴 수도 있다'는 한 줄을 마음에 품으면 대화가 부드러워지고 배움이 열립니다.","c":"오늘 \"제가 잘 몰라서요, 알려 주시겠어요?\"라고 말할 용기를 내 봅니다."},{"t":"무아","q":"\"대왕이여, 바퀴가 수레입니까? 굴대가 수레입니까? 멍에가 수레입니까?\" \"아닙니다.\" \"그 모든 것을 떠나 따로 수레가 있습니까?\" \"없습니다.\" \"그와 같이 '나'라는 것도 여러 요소가 모여 이루어진 이름일 뿐입니다.\"","s":"『밀린다왕문경(Milindapañha)』, 나가세나 존자와 밀린다왕의 문답","m":"그리스계 왕 밀린다와 나가세나 스님의 유명한 문답입니다. 수레가 부품들이 모인 이름이듯, '나'도 몸과 마음의 여러 요소가 모여 이루어진 것이라는 무아(無我)의 가르침입니다.","l":"나를 하나의 단단한 덩어리로 여기면 작은 비판에도 통째로 무너지는 느낌이 듭니다. 나는 여러 면이 모인 존재입니다. 한 부분의 실수가 나 전체는 아닙니다.","c":"오늘 하나의 실수로 나 전체를 판단하지 않겠습니다."},{"t":"집착","q":"애착에서 슬픔이 생기고, 애착에서 두려움이 생긴다. 애착에서 벗어난 이에게는 슬픔이 없는데, 어찌 두려움이 있으랴.","s":"『법구경』 제212게, 「애정품(愛好品)」","m":"여기서 말하는 애착은 사랑 자체가 아니라, 놓지 못하고 움켜쥐는 마음입니다. 사랑하되 집착하지 않을 때 사랑은 두려움 대신 자유가 됩니다.","l":"연인이나 자녀를 사랑할수록 잃을까 두려워 통제하려 들 때가 있습니다. 그 사람을 있는 그대로 존중하고 놓아줄 때, 사랑은 오히려 더 깊고 편안해집니다.","c":"오늘 내가 사랑하는 이를 움켜쥐지 않고, 넓게 품어 보겠습니다."},{"t":"본성","q":"모든 법의 공한 모습은 생겨나지도 사라지지도 않고, 더럽지도 깨끗하지도 않으며, 늘지도 줄지도 않는다.","s":"『반야심경』","m":"존재의 본바탕은 생겨나고 사라지는 것, 더럽고 깨끗한 것, 늘고 주는 것이라는 상대적인 구별을 넘어서 있다는 가르침입니다.","l":"실패했다고 내가 줄어드는 것이 아니고, 성공했다고 내가 늘어나는 것도 아닙니다. 나의 본래 가치는 오르내리지 않습니다. 그 사실이 흔들리는 날의 버팀목이 됩니다.","c":"오늘 무슨 일이 있어도, 나의 본래 가치는 줄지도 늘지도 않습니다.","o":"不生不滅 不垢不淨 不增不減"},{"t":"균형","q":"실천과 지혜가 함께 갖추어짐은 수레의 두 바퀴와 같고, 나를 이롭게 하고 남을 이롭게 함은 새의 두 날개와 같다.","s":"원효, 『발심수행장』","m":"수레는 한 바퀴로 가지 못하고 새는 한 날개로 날지 못합니다. 알고 행하는 것, 나와 남을 함께 돕는 것이 균형을 이룰 때 비로소 앞으로 나아갈 수 있습니다.","l":"아는 것만 많고 실천이 없거나, 열심히 하지만 방향을 모르면 제자리를 맴돕니다. 나만 챙기거나 남만 챙겨도 지칩니다. 두 바퀴, 두 날개의 균형을 살펴보세요.","c":"오늘 앎과 행함, 나와 남, 두 날개로 균형 있게 날아오르겠습니다.","o":"行智具備 如車二輪 自利利他 如鳥兩翼"},{"t":"말","q":"자신을 괴롭히지 않고 남을 해치지도 않는 말, 오직 그런 말만을 하라. 그것이 참으로 잘 설해진 말이다.","s":"『숫타니파타』 제451게, 「잘 설해진 말의 경(Subhāsita Sutta)」","m":"좋은 말의 기준을 간결하게 제시합니다. 내 마음을 괴롭히지도, 상대를 다치게 하지도 않는 말이 잘 설해진 말입니다.","l":"말하고 나서 후회하는 말은 나를 괴롭히는 말이고, 듣고 나서 아픈 말은 남을 해치는 말입니다. 둘 다 아닌 말만 해도 하루가 평화롭습니다.","c":"오늘 나도 괴롭지 않고 남도 다치지 않는 말만 하겠습니다."},{"t":"분노","q":"달리는 수레를 멈추듯 치밀어 오르는 분노를 다스리는 이, 그를 나는 참된 마부라 부른다. 다른 이들은 그저 고삐만 쥐고 있을 뿐이다.","s":"『법구경』 제222게, 「분노품」","m":"고삐를 쥐었다고 마부가 아니라, 폭주하는 말을 멈출 수 있어야 진짜 마부입니다. 화가 났을 때 멈출 수 있는 사람이 진정으로 자기 삶을 운전하는 사람입니다.","l":"운전 중 끼어드는 차, 회의 중 무시하는 발언에 분노가 확 치밀 때, 그 순간 멈출 수 있다면 우리는 마부입니다. 분노에 끌려가면 고삐만 쥔 승객이 됩니다.","c":"오늘 분노가 달리기 시작하면, 고삐를 당겨 멈추겠습니다."},{"t":"수행","q":"수행하는 데 마가 없기를 바라지 말라. 수행하는 데 마가 없으면 서원이 굳건해지지 못한다. 그러므로 모든 마군으로써 수행을 도와주는 벗을 삼으라.","s":"묘협 스님, 「보왕삼매론」 제4","m":"수행을 방해하는 장애와 유혹이 오히려 결심을 단단하게 만든다는 가르침입니다. 시험이 없으면 다짐은 단단해지지 않습니다.","l":"새해 결심을 흔드는 유혹, 다이어트를 방해하는 회식은 나의 적이 아니라 결심을 단련시키는 훈련 상대입니다. 넘어져도 괜찮습니다. 그때마다 다짐이 단단해집니다.","c":"오늘 나를 흔드는 유혹을 내 다짐을 단련시키는 벗으로 삼겠습니다.","o":"立行不求無魔 行無魔則誓願不堅"},{"t":"부부","q":"이 생에서도 서로 만나고 다음 생에서도 만나기를 바란다면, 믿음이 같고, 계가 같고, 베풂이 같고, 지혜가 같아야 한다.","s":"『앙굿따라 니까야』 「함께 사는 삶 경(Samajīvī Sutta)」(AN 4.55)","m":"평생 서로를 아끼며 산 나꿀라삐따 부부에게 주신 말씀입니다. 오래 함께하는 관계의 비결은 가치관과 삶의 방향을 함께 가꾸어 가는 데 있다는 뜻입니다.","l":"오래 사랑하는 부부는 같은 곳을 바라봅니다. 서로 다른 점은 존중하되, 무엇을 소중히 여기는지에 대해서는 자주 이야기를 나누어 보세요.","c":"오늘 사랑하는 이와 우리가 함께 소중히 여기는 것에 대해 이야기해 보겠습니다."},{"t":"무상","q":"우리가 여기서 언젠가 죽어야 한다는 것을 사람들은 알지 못한다. 그러나 이것을 아는 이들에게서 다툼은 가라앉는다.","s":"『법구경』 제6게, 「쌍품」","m":"삶이 유한하다는 사실을 진정으로 기억하면, 사소한 다툼에 쏟는 시간이 얼마나 아까운지 깨닫게 됩니다. 죽음에 대한 자각은 우울이 아니라 지금을 소중히 여기게 하는 지혜입니다.","l":"사랑하는 사람과 별것 아닌 일로 언성을 높이다가도, 그 사람과 함께할 날이 무한하지 않다는 생각이 들면 목소리가 낮아집니다. 이겨야 할 말싸움보다 함께 웃을 저녁이 더 귀하다는 것을 우리는 이미 알고 있습니다.","c":"오늘 곁에 있는 사람에게, 이기는 말보다 고마운 말을 하나 더 건네겠습니다."},{"t":"정진","q":"게으르고 정진하지 않으며 백 년을 사는 것보다, 굳건히 정진하며 사는 하루가 더 낫다.","s":"『법구경』 제112게, 「천품」","m":"삶의 가치는 길이가 아니라 깊이에 있습니다. 의미 없이 흘려보낸 긴 세월보다 깨어서 애쓴 하루가 더 값지다는 뜻입니다.","l":"'언젠가 시작해야지' 하며 미룬 일들이 있습니다. 백 번의 계획보다 오늘 한 시간의 실행이 낫습니다. 하루를 제대로 사는 것이 쌓여 인생이 됩니다.","c":"오늘 하루를, 백 년 같은 하루로 정성껏 살아 보겠습니다."},{"t":"본래면목","q":"선도 생각하지 말고 악도 생각하지 말라. 바로 이러한 때, 어떤 것이 그대의 본래 면목인가?","s":"『육조단경』 「행유품」, 『무문관』 제23칙","m":"혜능을 쫓아온 혜명에게 던진 물음입니다. 좋고 나쁨을 나누는 생각을 잠시 멈추었을 때 드러나는 본래의 나, 그것을 보라는 화두입니다.","l":"우리는 하루 종일 좋다 나쁘다, 옳다 그르다를 판단하며 삽니다. 그 판단을 잠시 멈추고 그저 있어 보세요. 판단 이전의 고요한 나를 만날 수 있습니다.","c":"오늘 잠시 판단을 멈추고, 판단 이전의 나를 만나 보겠습니다.","o":"不思善 不思惡 正與麽時 那箇是明上座本來面目"},{"t":"업","q":"악한 사람이 어진 이를 해치려는 것은 하늘을 향해 침을 뱉는 것과 같다. 침은 하늘에 닿지 못하고 도리어 자기 얼굴에 떨어진다.","s":"『사십이장경(四十二章經)』","m":"중국에 처음 전해진 불교 경전으로 알려진 사십이장경의 한 구절입니다. 남을 해치려는 마음은 결국 자기 자신에게 돌아온다는 비유입니다.","l":"누군가 나를 깎아내리려 할 때 크게 흔들릴 필요가 없습니다. 그 침은 하늘에 닿지 않습니다. 그리고 나 역시 누군가를 향해 침을 뱉지 않도록 조심하면 됩니다.","c":"오늘 나를 향한 침에 흔들리지 않고, 나도 누구를 향해 침 뱉지 않겠습니다.","o":"惡人害賢者 猶仰天而唾 唾不至天 還從己墮"},{"t":"생명","q":"생명을 해치는 이는 거룩한 이가 아니다. 모든 생명을 해치지 않는 이를 거룩한 이라 부른다.","s":"『법구경』 제270게, 「법에 머무는 이품」","m":"불살생(不殺生)은 불교 계율의 첫 번째입니다. 모든 생명을 존중하는 마음이 거룩함의 기본이라는 가르침입니다.","l":"생명 존중은 거창한 것이 아닙니다. 함부로 벌레를 죽이지 않고, 음식을 남기지 않고, 반려동물을 책임지는 것에서 시작됩니다.","c":"오늘 내 손길이 닿는 모든 생명을 아끼겠습니다."},{"t":"노력","q":"믿음은 씨앗이요, 수행은 비이며, 지혜는 나의 멍에와 쟁기이다. 부끄러움을 아는 마음은 쟁기 자루, 마음은 고삐, 깨어 있음은 나의 보습과 몰이 막대이다.","s":"『숫타니파타』 제77게, 「밭 가는 바라드바자의 경(Kasibhāradvāja Sutta)」","m":"농부가 부처님께 '당신은 밭을 갈지 않고 먹는다'고 비난하자, 부처님도 마음의 밭을 가는 농부라고 답하신 장면입니다. 수행은 성실한 농사와 같습니다.","l":"무엇이든 열매를 얻으려면 씨를 뿌리고 물을 주고 밭을 갈아야 합니다. 마음도 그렇습니다. 믿음의 씨, 노력의 비, 지혜의 쟁기로 오늘도 마음 밭을 갈아 보세요.","c":"오늘 나는 내 마음 밭을 가는 성실한 농부가 되겠습니다."},{"t":"해탈","q":"앞에도 뒤에도 가운데에도 아무것도 붙들지 않고, 가진 것 없고 집착 없는 이, 그를 나는 성자라 부른다.","s":"『법구경』 제421게, 「바라문품」","m":"과거에도 미래에도 현재에도 매이지 않는 자유로운 마음을 노래한 게송입니다. 가진 것이 없다는 것은 무엇에도 매이지 않았다는 뜻입니다.","l":"짐을 가볍게 꾸린 여행자가 더 자유롭게 다닙니다. 마음의 짐도 그렇습니다. 꼭 필요한 것만 지니고 나머지는 내려놓는 연습을 해 보세요.","c":"오늘 마음의 짐을 가볍게 꾸리고, 자유롭게 하루를 여행하겠습니다."},{"t":"수행","q":"얼어붙은 연못이 본래 물인 줄 온전히 알지만, 햇볕의 기운을 빌려야 녹아 흐른다.","s":"보조 지눌, 『수심결(修心訣)』 — 돈오점수(頓悟漸修)","m":"내 마음이 본래 부처임을 단번에 깨달았더라도(돈오), 오랜 습관은 얼음처럼 남아 있어 꾸준히 녹여야 한다(점수)는 가르침입니다.","l":"'이제 알았다'고 해서 하루아침에 바뀌지는 않습니다. 아는 것과 몸에 배는 것 사이에는 시간이 필요합니다. 조급해하지 말고 햇볕을 쬐듯 꾸준히 녹여 가세요.","c":"오늘도 햇볕처럼 꾸준히, 내 안의 얼음을 조금씩 녹이겠습니다.","o":"如氷池而全知是水 借陽氣以鎔消"},{"t":"친절","q":"늘 친절하게 대하고 바르게 행동하라. 그러면 기쁨이 가득하여 괴로움을 끝내리라.","s":"『법구경』 제376게, 「비구품」","m":"친절과 바른 행동은 남을 위한 것이기도 하지만, 그로부터 생기는 기쁨이 결국 나의 괴로움을 녹여 줍니다.","l":"친절은 가장 쉬운 수행입니다. 미소, 감사 인사, 문 잡아 주기. 연구에 따르면 친절을 베푼 사람의 행복감도 함께 올라간다고 합니다.","c":"오늘 만나는 모든 이에게 조금 더 친절하겠습니다."},{"t":"사명","q":"모든 부처님은 오직 하나의 큰일, 곧 중생으로 하여금 부처의 지혜를 열고, 보이고, 깨닫게 하고, 그 길에 들게 하기 위해 세상에 나오셨다.","s":"『묘법연화경(법화경)』 「방편품(方便品)」","m":"'일대사인연(一大事因緣)'의 출처입니다. 부처님이 세상에 오신 이유는 오직 모든 존재가 자신 안의 부처의 지혜를 깨닫도록 돕기 위해서라는 선언입니다.","l":"나는 왜 이 세상에 왔을까요? 거창한 답이 아니어도 좋습니다. 누군가를 돕고, 나를 성장시키는 것. 각자의 '일대사'를 찾는 것이 의미 있는 삶의 시작입니다.","c":"오늘 내 삶의 '하나의 큰일'이 무엇인지 조용히 물어보겠습니다.","o":"諸佛世尊 唯以一大事因緣故 出現於世"},{"t":"마음","q":"대매가 마조에게 물었다. \"무엇이 부처입니까?\" 마조가 답했다. \"마음이 곧 부처이다.\"","s":"『무문관』 제30칙, 마조 도일(馬祖道一)","m":"부처는 멀리 있는 존재가 아니라 지금 이 마음이 곧 부처라는 가르침입니다. 대매 스님은 이 한마디에 깨닫고 평생 산에 머물렀다고 합니다.","l":"구원과 행복을 밖에서 찾아 헤매지만, 그 모든 것을 알아보는 이 마음이 이미 그 자리에 있습니다. 내 마음을 함부로 대하지 마세요. 그 마음이 부처입니다.","c":"오늘 내 마음을 부처님처럼 귀하게 대하겠습니다.","o":"卽心卽佛"},{"t":"평등","q":"이 법은 평등하여 높고 낮음이 없다.","s":"『금강경』 제23 「정심행선분(淨心行善分)」","m":"진리 앞에서는 높은 이도 낮은 이도 없습니다. 모든 존재가 평등하게 깨달음의 가능성을 지니고 있다는 가르침입니다.","l":"우리는 자꾸 사람을 줄 세웁니다. 학벌, 연봉, 집의 크기로. 그러나 존재의 가치에는 높고 낮음이 없습니다. 오늘 만나는 모든 이를 같은 눈높이로 대해 보세요.","c":"오늘 누구도 높이거나 낮추지 않고 같은 눈높이로 대하겠습니다.","o":"是法平等 無有高下"},{"t":"희망","q":"비록 젊은 수행자라도 부처님 가르침에 힘쓰는 이는, 구름을 벗어난 달처럼 이 세상을 비춘다.","s":"『법구경』 제382게, 「비구품」","m":"나이가 어리거나 경험이 적어도 바른 길에 힘쓰는 이는 세상을 밝힐 수 있습니다. 빛나는 데 자격은 필요 없습니다.","l":"'내가 뭘 할 수 있겠어'라고 생각하지 마세요. 신입 사원의 성실함, 학생의 정직함, 아이의 순수함도 주변을 환히 밝힙니다.","c":"지금의 나 그대로, 오늘 내 자리를 환히 밝히겠습니다."},{"t":"기초","q":"어리석은 부자가 이웃의 아름다운 삼층 누각을 보고 목수를 불러 \"아래 두 층은 필요 없으니 삼층만 지어 달라\"고 하였다.","s":"『백유경』 「삼층 누각의 비유(三重樓喩)」","m":"기초 없이 결과만 원하는 어리석음을 꼬집은 비유입니다. 높은 경지도 아래층부터 차근차근 쌓아야 이를 수 있습니다.","l":"하루아침에 성공하고 싶고, 단번에 실력을 갖추고 싶은 마음이 있습니다. 그러나 모든 탑은 1층부터 올라갑니다. 지금 쌓고 있는 기초가 결코 헛되지 않습니다.","c":"오늘 눈에 띄지 않는 1층을 정성껏 쌓겠습니다."},{"t":"성실","q":"부지런하고 깨어 있으며, 행실이 깨끗하고 신중하며, 스스로 절제하고 바르게 살며 게으르지 않은 이의 명성은 날로 커진다.","s":"『법구경』 제24게, 「불방일품」","m":"진정한 명성은 홍보가 아니라 성실한 삶에서 저절로 쌓입니다. 하나하나의 바른 태도가 모여 그 사람의 이름이 됩니다.","l":"신뢰는 하루아침에 만들어지지 않습니다. 약속 시간을 지키고, 맡은 일을 끝까지 하고, 보이지 않는 곳에서도 성실한 태도가 쌓여 '믿을 만한 사람'이라는 이름이 됩니다.","c":"오늘 내 이름에 성실함 한 줄을 더 새기겠습니다."},{"t":"존중","q":"자기 종교만을 높이고 다른 종교를 헐뜯는 사람은, 그렇게 함으로써 오히려 자기 종교에 큰 해를 끼친다. 그러므로 서로의 가르침을 듣고 존중하는 화합이 좋은 것이다.","s":"아소카왕 「바위 칙령 제12」(기원전 3세기)","m":"불교를 널리 펼친 인도의 아소카왕이 바위에 새긴 칙령입니다. 2,300년 전에 이미 다른 신앙을 존중하는 것이 자기 신앙을 지키는 길이라고 선언했습니다.","l":"종교뿐 아니라 정치적 견해, 생활 방식이 다른 사람을 대할 때도 마찬가지입니다. 상대를 깎아내리는 순간 내 신념의 품격도 떨어집니다.","c":"오늘 나와 다른 믿음과 생각을 가진 이를 존중하겠습니다."},{"t":"경청","q":"성급하게 판단한다고 해서 법에 머무는 이가 아니다. 옳고 그름을 함께 살펴 바르게 판단하는 이를 지혜롭다 한다.","s":"『법구경』 제256게, 「법에 머무는 이품」","m":"한쪽 이야기만 듣고 빠르게 결론 내리는 것은 지혜가 아닙니다. 양쪽을 살피고 신중하게 판단할 때 공정함이 생깁니다.","l":"기사 제목 하나, 소문 한 줄로 사람을 판단하는 일이 흔합니다. '다른 쪽 이야기는 무엇일까?'를 한 번 묻는 것만으로도 많은 오해를 막을 수 있습니다.","c":"오늘 누군가를 판단하기 전에, 다른 쪽 이야기를 한 번 더 들어 보겠습니다."},{"t":"연결","q":"하나의 작은 티끌 속에 온 시방세계가 담겨 있고, 모든 티끌 속에도 또한 그러하다.","s":"의상(義湘) 대사, 「화엄일승법계도(법성게)」","m":"화엄경의 방대한 사상을 210자로 압축한 법성게의 한 구절입니다. 가장 작은 것 안에 가장 큰 것이 담겨 있고, 모든 것은 서로를 비추며 이어져 있다는 가르침입니다.","l":"사소해 보이는 오늘 하루 안에 내 인생 전체가 담겨 있습니다. 작은 친절 하나가 세상 전체와 이어져 있습니다. 작은 것을 결코 작게 여기지 마세요.","c":"오늘의 작은 순간 안에 온 세상이 담겨 있음을 기억하겠습니다.","o":"一微塵中含十方 一切塵中亦如是"},{"t":"고요","q":"마음이 고요하고, 말이 고요하며, 행동이 고요하고, 바른 지혜로 해탈하여 평화로워진 이, 그런 이는 참으로 고요하다.","s":"『법구경』 제96게, 「아라한품」","m":"진정한 고요함은 마음, 말, 행동이 모두 평화로울 때 이루어집니다. 그런 사람 곁에 있으면 주변도 함께 고요해집니다.","l":"바쁜 하루 속에서도 고요한 사람이 있습니다. 서두르지 않는 말투, 차분한 몸짓이 주변 사람들까지 안정시킵니다.","c":"오늘 내 마음과 말과 행동에 고요함을 담겠습니다."},{"t":"실천","q":"백거이가 물었다. \"불법의 큰 뜻이 무엇입니까?\" 도림 선사가 답했다. \"모든 악을 짓지 말고 온갖 선을 받들어 행하라.\" \"그것은 세 살 아이도 아는 말입니다.\" \"세 살 아이도 알지만 여든 노인도 행하기 어렵다.\"","s":"조과 도림(鳥窠道林)과 시인 백거이(白居易)의 문답, 『전등록』 권4","m":"나무 위에 살아 '새둥지 선사'라 불린 도림 스님의 일화입니다. 진리는 어렵지 않지만 실천하기가 어렵다는 것을 꿰뚫은 대답입니다.","l":"정직하라, 친절하라, 화내지 말라. 누구나 아는 말입니다. 그러나 평생 실천하는 사람은 드뭅니다. 아는 것을 행하는 것, 그것이 전부입니다.","c":"오늘 이미 알고 있는 쉬운 가르침 하나를 실제로 행하겠습니다.","o":"三歲孩兒雖道得 八十老人行不得"},{"t":"수행","q":"수행에서 지혜가 생기고, 수행하지 않으면 지혜가 사라진다. 얻음과 잃음의 이 두 길을 알아, 지혜가 자라도록 자신을 이끌어라.","s":"『법구경』 제282게, 「길품」","m":"지혜는 한 번 얻으면 영원한 것이 아니라 근육처럼 쓰면 자라고 쓰지 않으면 줄어듭니다. 꾸준한 수행만이 지혜를 지켜 줍니다.","l":"한때 열심히 하던 명상, 운동, 공부를 멈추면 금세 예전으로 돌아갑니다. 거창하지 않아도 매일 조금씩 이어 가는 것이 지혜를 지키는 방법입니다.","c":"오늘도 작게나마 이어 갑니다. 멈추지 않는 것이 가장 큰 힘입니다."},{"t":"성찰","q":"남의 잘못을 살피지 말고, 남이 한 일과 하지 않은 일을 살피지 말라. 오직 자신이 한 일과 하지 않은 일을 살펴라.","s":"『법구경』 제50게, 「꽃품」","m":"우리의 시선은 늘 바깥을 향해 있어서 남의 허물은 잘 보이고 내 허물은 잘 보이지 않습니다. 부처님은 그 시선을 안으로 돌리라고 하십니다. 내가 바꿀 수 있는 것은 오직 나의 행동이기 때문입니다.","l":"팀 프로젝트에서 '저 사람은 왜 안 하지?' 하는 생각에 에너지를 다 써 버리기 쉽습니다. 시선을 '내가 할 수 있는 일은 무엇이지?'로 옮기면 불평은 줄고 일은 앞으로 갑니다.","c":"오늘 누군가를 탓하고 싶어질 때, 먼저 내가 한 일과 하지 않은 일을 돌아보겠습니다."},{"t":"분별","q":"지극한 도는 어렵지 않으니 오직 가려서 고르는 것을 꺼릴 뿐이다. 다만 미워하고 사랑하지만 않으면 툭 트여 명백하리라.","s":"삼조 승찬(僧璨), 『신심명(信心銘)』","m":"신심명의 첫 구절입니다. 도는 어려운 것이 아니라 좋다 싫다 따지는 마음이 그것을 어렵게 만든다는 가르침입니다.","l":"날씨가 덥다 춥다, 음식이 맛있다 없다, 사람이 좋다 싫다. 하루에도 수없이 고르고 따집니다. 그 따짐을 조금만 내려놓아도 마음은 놀랍도록 편안해집니다.","c":"오늘 좋고 싫음을 조금 덜 따지고, 있는 그대로 받아들이겠습니다.","o":"至道無難 唯嫌揀擇 但莫憎愛 洞然明白"},{"t":"일상","q":"세존께서 공양하실 때가 되어 가사를 입고 발우를 들고 성에 들어가 차례로 걸식하셨다. 처소로 돌아와 공양을 마치신 뒤 가사와 발우를 거두시고, 발을 씻으시고 자리를 펴고 앉으셨다.","s":"『금강경』 제1 「법회인유분(法會因由分)」","m":"금강경은 놀랍게도 지극히 평범한 장면으로 시작합니다. 밥을 빌고, 먹고, 정리하고, 발을 씻고 앉는 일상. 깨달음이 일상의 한가운데 있음을 보여 줍니다.","l":"설거지하고, 정리하고, 손을 씻는 평범한 일들을 정성스럽게 하는 것이 곧 수행입니다. 특별한 순간을 기다리지 말고 평범한 순간을 깨어서 사세요.","c":"오늘 밥 먹고 정리하고 손 씻는 평범한 일을 정성스럽게 하겠습니다."},{"t":"말","q":"사람은 태어날 때 입안에 도끼를 지니고 태어난다. 어리석은 이는 나쁜 말을 함으로써 그 도끼로 자기 자신을 찍는다.","s":"『숫타니파타』 제657게, 「코칼리야의 경(Kokāliya Sutta)」","m":"말을 도끼에 비유한 강렬한 게송입니다. 함부로 내뱉은 말은 남보다 먼저 나 자신에게 상처를 냅니다.","l":"홧김에 한 말, 뒤에서 한 험담은 결국 내 평판과 관계를 찍어 냅니다. 입안의 도끼를 조심스럽게 다루세요.","c":"오늘 내 입안의 도끼를 조심스럽게 다루겠습니다."},{"t":"두려움","q":"마음에 걸림이 없고, 걸림이 없으므로 두려움이 없으며, 뒤바뀐 헛된 생각을 멀리 떠나 마침내 열반에 이른다.","s":"『반야심경』","m":"지혜의 눈으로 세상을 보면 마음에 걸리는 것이 없어지고, 걸리는 것이 없으면 두려움도 사라집니다. 두려움의 뿌리는 뒤바뀐 생각에 있다는 가르침입니다.","l":"우리가 두려워하는 것들 중 상당수는 실제로 일어나지 않습니다. 머릿속의 최악의 시나리오가 '뒤바뀐 헛된 생각'일 수 있습니다. 생각과 사실을 구별해 보세요.","c":"오늘 두려움이 올 때, 그것이 사실인지 생각인지 살펴보겠습니다.","o":"心無罣礙 無罣礙故 無有恐怖 遠離顚倒夢想 究竟涅槃"},{"t":"걱정","q":"고칠 수 있는 일이라면 무엇 때문에 근심하는가. 고칠 수 없는 일이라면 근심한들 무슨 소용이 있는가.","s":"샨티데바, 『입보리행론』 제6장 10게","m":"걱정에 대한 가장 명쾌한 가르침 중 하나입니다. 해결할 수 있으면 해결하면 되고, 해결할 수 없으면 걱정해도 달라지지 않습니다.","l":"걱정이 꼬리를 물 때 이 질문을 던져 보세요. '이건 내가 할 수 있는 일인가?' 그렇다면 지금 할 일을 하고, 아니라면 내려놓으세요. 둘 다 걱정보다 낫습니다.","c":"오늘 걱정이 올 때, 할 수 있는 일은 하고 할 수 없는 일은 내려놓겠습니다."},{"t":"평정","q":"단단한 바위가 바람에 흔들리지 않듯, 지혜로운 이는 비난과 칭찬에 흔들리지 않는다.","s":"『법구경』 제81게, 「현자품」","m":"칭찬에 들뜨고 비난에 무너지는 마음은 바람에 날리는 잎과 같습니다. 남의 평가가 아니라 자신의 중심에 뿌리내린 사람은 어떤 바람에도 흔들리지 않습니다.","l":"'좋아요' 숫자와 댓글 한 줄에 하루 기분이 오르내립니다. 칭찬도 비난도 그저 지나가는 바람임을 알면, 그것을 듣되 휘둘리지 않을 수 있습니다.","c":"오늘 어떤 말을 들어도, 나는 바위처럼 내 자리를 지키겠습니다."},{"t":"스승","q":"내가 도움을 주고 큰 기대를 걸었던 사람이 도리어 나를 크게 해칠 때, 그 사람을 가장 귀한 스승으로 여기게 하소서.","s":"랑리 탕파, 『마음 수련 8게송(Lojong Tsigyema)』 제6게(11세기 티베트)","m":"배신당했을 때 그 사람을 원망하는 대신 나를 가장 깊이 단련시키는 스승으로 보라는, 가장 어렵고도 깊은 가르침입니다.","l":"믿었던 사람에게 받은 상처는 가장 아픕니다. 당장 스승으로 여기기는 어렵겠지만, 시간이 지나면 그 일이 나를 더 단단하고 지혜롭게 만들었음을 알게 될 것입니다.","c":"오늘의 상처가 언젠가 나의 스승이 되리라 믿겠습니다."},{"t":"깨어있음","q":"깨어 있음은 죽음 없는 길이요, 방일은 죽음의 길이다. 깨어 있는 이는 죽지 않으며, 방일한 이는 이미 죽은 이와 같다.","s":"『법구경』 제21게, 「불방일품(不放逸品)」","m":"'방일(放逸)'은 마음을 놓아 버리고 흘러가는 대로 사는 것을 말합니다. 몸은 살아 있어도 매 순간을 알아차리지 못하고 흘려보낸다면 진정으로 살고 있다고 할 수 없다는 강한 경책입니다.","l":"하루가 어떻게 지나갔는지 기억나지 않는 날이 있습니다. 자동조종 상태로 일하고, 먹고, 화면을 넘기다 보면 시간은 흘렀는데 내가 산 것 같지 않습니다. 깨어 있음이란 거창한 것이 아니라 지금 하는 일을 알면서 하는 것입니다.","c":"오늘 밥 한 끼만큼은 깨어서 먹겠습니다. 맛과 온기와 감사를 온전히 느끼면서."},{"t":"마음","q":"더럽고 얼룩진 천은 염색공이 어떤 물감에 담가도 빛깔이 곱지 않다. 그러나 깨끗한 천은 어떤 물감에 담가도 빛깔이 곱다. 마음이 더러우면 좋은 결과를 기대하기 어렵고, 마음이 깨끗하면 좋은 결과를 기대할 수 있다.","s":"『맛지마 니까야』 「옷감의 비유 경(Vatthūpama Sutta)」(MN 7)","m":"같은 경험도 어떤 마음으로 받아들이느냐에 따라 전혀 다른 빛깔이 됩니다. 마음이라는 천을 먼저 깨끗이 하라는 가르침입니다.","l":"같은 여행, 같은 선물, 같은 하루도 불평으로 가득한 마음에서는 칙칙하고, 감사하는 마음에서는 선명합니다. 먼저 마음을 빨아 두세요.","c":"오늘 내 마음의 천을 깨끗이 하여, 하루를 고운 빛깔로 물들이겠습니다."},{"t":"꾸준함","q":"너희가 부지런히 정진하면 어려운 일이 없을 것이다. 비유하자면 작은 물줄기도 끊임없이 흐르면 능히 돌을 뚫는 것과 같다.","s":"『불유교경』","m":"낙숫물이 바위를 뚫는다는 말의 불교적 원형입니다. 큰 힘이 아니라 끊임없이 이어지는 작은 힘이 결국 단단한 것을 이깁니다.","l":"하루 10분 운동, 하루 한 페이지 독서, 하루 한 번 감사. 너무 작아 보여도 끊임없이 이어지면 언젠가 바위를 뚫습니다. 중요한 것은 크기가 아니라 멈추지 않는 것입니다.","c":"오늘도 작은 물줄기처럼, 멈추지 않고 흐르겠습니다.","o":"譬如小水長流 則能穿石"},{"t":"자비","q":"지옥이 비지 않으면 결코 성불하지 않으리라. 중생을 다 건진 뒤에야 깨달음을 이루리라.","s":"지장보살(地藏菩薩)의 대원(大願) — 『지장보살본원경』의 서원을 압축한 게송으로 전함","m":"가장 고통받는 이들이 있는 곳까지 내려가 모두를 구하기 전에는 자신의 깨달음조차 미루겠다는 지장보살의 큰 서원입니다.","l":"가장 어려운 처지에 있는 사람을 먼저 생각하는 마음, 그것이 지장보살의 마음입니다. 내 주변에서 가장 외롭고 힘든 이는 누구인지 떠올려 보세요.","c":"오늘 내 곁의 가장 힘든 이를 먼저 생각하고 손을 내밀겠습니다.","o":"地獄未空 誓不成佛 衆生度盡 方證菩提"},{"t":"깨어있음","q":"게으른 이들 가운데 부지런하고, 잠든 이들 가운데 깨어 있는 지혜로운 이는, 준마가 둔한 말을 앞지르듯 앞으로 나아간다.","s":"『법구경』 제29게, 「불방일품」","m":"모두가 잠들어 있을 때 깨어 있는 사람이 결국 앞서갑니다. 주변의 흐름에 휩쓸리지 않고 자기 길을 가는 힘을 말합니다.","l":"모두가 '대충 하자'고 할 때 정성을 다하는 사람, 모두가 불평할 때 해결책을 찾는 사람이 결국 신뢰를 얻습니다.","c":"오늘 주변이 어떻든, 나는 깨어서 내 몫을 다하겠습니다."},{"t":"내려놓음","q":"앞을 놓아라, 뒤를 놓아라, 가운데를 놓아라. 존재의 저 언덕으로 건너가라. 마음이 모든 것에서 풀려나면, 다시는 태어남과 늙음을 겪지 않으리라.","s":"『법구경』 제348게, 「갈애품」","m":"앞은 미래, 뒤는 과거, 가운데는 현재를 뜻합니다. 과거의 후회, 미래의 걱정, 현재의 집착을 모두 내려놓을 때 마음은 진정한 자유에 이릅니다.","l":"어제의 실수와 내일의 걱정을 양손에 들고 오늘을 살면 지칠 수밖에 없습니다. 양손을 비워야 지금 이 순간을 온전히 잡을 수 있습니다.","c":"오늘 어제를 놓고, 내일을 놓고, 가볍게 지금을 걷겠습니다."},{"t":"진실","q":"믿음은 이 세상에서 사람의 가장 귀한 재산이요, 진실은 가장 감미로운 맛이다. 지혜롭게 사는 삶이 가장 훌륭한 삶이라 한다.","s":"『숫타니파타』 제182게, 「알라바까의 경(Āḷavaka Sutta)」","m":"사나운 야차 알라바까의 질문에 부처님이 답하신 게송입니다. 무엇이 최고의 재산이며, 최고의 맛이며, 최고의 삶인지를 말씀하셨습니다.","l":"비싼 음식보다 진실한 대화가 더 맛있고, 많은 재산보다 흔들리지 않는 믿음이 더 든든합니다. 지혜롭게 사는 삶은 누구에게나 열려 있습니다.","c":"오늘 진실의 맛을 음미하며, 지혜롭게 살아 보겠습니다."},{"t":"생각","q":"숙련된 목수가 가는 쐐기로 굵은 쐐기를 쳐내고 빼내듯, 해로운 생각이 일어나면 다른 유익한 생각으로 그것을 몰아내라.","s":"『맛지마 니까야』 「생각을 가라앉힘 경(Vitakkasaṇṭhāna Sutta)」(MN 20)","m":"나쁜 생각을 억지로 누르기보다 좋은 생각으로 바꾸어 끼우는 지혜로운 방법입니다. 마음은 동시에 두 가지를 생각할 수 없기 때문입니다.","l":"걱정이 꼬리를 물 때 '그만 생각해!'라고 해도 잘 안 됩니다. 대신 감사할 일, 좋아하는 사람, 지금 할 수 있는 작은 일을 떠올려 보세요. 새 쐐기가 헌 쐐기를 밀어냅니다.","c":"오늘 해로운 생각이 오면, 좋은 생각 하나로 바꾸어 끼우겠습니다."},{"t":"성찰","q":"모든 탓을 한 곳으로 돌려라.","s":"체카와 예셰 도르제, 『로종(마음 수련) 7조』(12세기 티베트)","m":"티베트 마음 수련의 유명한 경구입니다. 여기서 '한 곳'은 나를 혹독하게 탓하라는 뜻이 아니라, 괴로움의 진짜 원인인 나의 집착과 자기중심적인 마음을 살피라는 뜻입니다.","l":"일이 꼬이면 남 탓, 상황 탓을 하기 쉽습니다. 그때 '내 안의 어떤 고집이 이 괴로움을 키우고 있을까?' 하고 물어보세요. 비난 대신 성찰이 시작됩니다.","c":"오늘 남을 탓하고 싶을 때, 내 안의 고집 하나를 먼저 살펴보겠습니다."},{"t":"화합","q":"부처님의 출현은 행복이요, 바른 법을 설함은 행복이다. 승가의 화합은 행복이요, 화합한 이들의 수행은 행복이다.","s":"『법구경』 제194게, 「붓다품」","m":"함께하는 이들이 화합하여 같은 길을 걷는 것 자체가 행복이라는 가르침입니다. 화합은 공동체의 가장 큰 복입니다.","l":"가정, 직장, 모임이 화목할 때 그 안의 모든 사람이 행복합니다. 화합은 저절로 되지 않고 각자 조금씩 양보하고 배려할 때 만들어집니다.","c":"오늘 내가 속한 곳의 화합을 위해 먼저 한 걸음 양보하겠습니다."},{"t":"내려놓음","q":"엄양 존자가 물었다. \"한 물건도 가지고 오지 않았을 때는 어떻게 합니까?\" 조주가 말했다. \"내려놓아라.\" \"한 물건도 가져오지 않았는데 무엇을 내려놓습니까?\" \"그렇다면 짊어지고 가거라.\"","s":"『오등회원(五燈會元)』 권4, 조주와 엄양 존자의 문답","m":"'방하착(放下著)'의 출처입니다. 아무것도 가지지 않았다는 생각조차 하나의 짐이라는 날카로운 가르침입니다.","l":"'나는 욕심이 없어', '나는 다 내려놓았어'라는 생각도 하나의 짐이 될 수 있습니다. 내려놓았다는 생각마저 내려놓을 때 진짜 가벼워집니다.","c":"오늘 내가 짊어진 줄도 몰랐던 짐 하나를 발견하고 내려놓겠습니다.","o":"放下著"},{"t":"수행","q":"사흘 닦은 마음은 천 년의 보배요, 백 년 탐한 물건은 하루아침의 티끌이다.","s":"야운(野雲) 스님, 『자경문(自警文)』","m":"고려 말 야운 스님이 스스로를 경계하며 쓴 글입니다. 짧게라도 마음을 닦은 공덕은 오래가지만, 평생 모은 재물은 한순간에 사라진다는 대비가 선명합니다.","l":"사흘이면 됩니다. 사흘만 마음을 다해 감사하고, 사흘만 화를 다스려 보세요. 그 경험이 평생의 보배가 됩니다. 반면 물건은 아무리 모아도 언젠가 먼지가 됩니다.","c":"오늘부터 사흘, 마음을 닦는 일에 정성을 기울여 보겠습니다.","o":"三日修心千載寶 百年貪物一朝塵"},{"t":"지금","q":"\"다른 사람이 하면 내가 한 것이 아니오. 지금 하지 않으면 언제 하겠소?\"","s":"도겐, 『전좌교훈(典座敎訓)』","m":"젊은 도겐이 중국 절에서 뙤약볕 아래 버섯을 말리는 늙은 전좌(취사 담당) 스님에게 '왜 젊은 사람을 시키지 않느냐, 왜 더 시원할 때 하지 않느냐'고 묻자 들은 대답입니다.","l":"'누군가 하겠지', '나중에 하지'라는 생각이 들 때 이 말을 떠올려 보세요. 내 일은 내가 할 때 비로소 내 수행이 되고, 지금이 아니면 그때는 오지 않습니다.","c":"오늘 내가 할 일을, 지금 하겠습니다.","o":"他不是吾 更待何時"},{"t":"서원","q":"허공이 다할 때까지, 중생이 남아 있는 한, 나 또한 머물러 세상의 괴로움을 없애리라.","s":"샨티데바, 『입보리행론』 제10장 55게","m":"보살의 끝없는 서원을 담은 게송입니다. 단 한 생명이라도 괴로움 속에 있다면 그를 위해 남겠다는 무한한 자비의 다짐입니다.","l":"우리는 이 정도의 서원을 세우기 어렵지만, 그 마음을 조금 빌려 올 수는 있습니다. 내가 있는 동안, 내 주변에서만큼은 괴로움을 줄이겠다는 작은 서원 말입니다.","c":"내가 머무는 동안, 내 곁의 괴로움을 조금이라도 덜어 내겠습니다."},{"t":"업","q":"악을 행한 이는 이 세상에서 슬퍼하고 저 세상에서도 슬퍼한다. 자기가 지은 더러운 업을 보고 슬퍼하고 괴로워한다.","s":"『법구경』 제15게, 「쌍품」","m":"잘못된 행동의 가장 큰 벌은 외부의 처벌이 아니라 스스로 그것을 돌아볼 때의 괴로움입니다. 양심은 가장 가까운 심판관입니다.","l":"아무도 모르는 잘못이라도 내 마음은 압니다. 그 무게가 밤잠을 설치게 하고 사람들 앞에서 떳떳하지 못하게 합니다. 떳떳함은 그 자체로 큰 자유입니다.","c":"오늘 나는 스스로 돌아보아 부끄럽지 않은 하루를 살겠습니다."},{"t":"마음","q":"온 땅을 덮을 만큼의 가죽을 어디서 구하겠는가. 그러나 내 신발 밑창에 가죽을 대면 온 땅을 덮은 것과 같다. 이처럼 바깥 세상을 다 막을 수는 없지만, 내 마음을 다스리면 다른 것을 막을 필요가 있겠는가.","s":"샨티데바(寂天), 『입보리행론(入菩提行論)』 제5장 13~14게","m":"8세기 인도의 학승 샨티데바의 유명한 비유입니다. 세상의 모든 가시밭을 없앨 수는 없지만, 내 발에 신발을 신으면 어디든 걸을 수 있습니다.","l":"무례한 사람, 불공정한 상황, 시끄러운 세상을 모두 바꿀 수는 없습니다. 그러나 그것을 대하는 내 마음에 신발을 신기면 어디든 걸어갈 수 있습니다.","c":"오늘 세상을 다 바꾸려 하기보다, 내 마음에 튼튼한 신발을 신기겠습니다."},{"t":"고요","q":"탐욕 같은 불은 없고, 성냄 같은 허물은 없다. 몸과 마음의 무더기 같은 괴로움은 없고, 고요함보다 더 큰 행복은 없다.","s":"『법구경』 제202게, 「행복품」","m":"가장 큰 행복은 자극이나 흥분이 아니라 고요함에 있다는 가르침입니다. 마음이 고요할 때 비로소 진정한 행복을 맛봅니다.","l":"우리는 행복을 더 큰 자극에서 찾으려 합니다. 그러나 아무 일 없는 조용한 저녁, 차 한 잔의 고요함이 주는 행복이 더 깊고 오래갑니다.","c":"오늘 잠시 모든 것을 멈추고, 고요함이라는 행복을 맛보겠습니다."},{"t":"평정","q":"선한 이는 어디서나 집착을 버리고, 쾌락을 바라며 수다 떨지 않는다. 즐거움을 만나도 괴로움을 만나도 지혜로운 이는 들뜨거나 가라앉지 않는다.","s":"『법구경』 제83게, 「현자품」","m":"좋은 일에 지나치게 들뜨지도, 나쁜 일에 지나치게 가라앉지도 않는 마음을 '평정'이라 합니다. 감정을 없애는 것이 아니라 감정의 파도 위에서 중심을 잃지 않는 것입니다.","l":"승진의 기쁨도, 실패의 낙담도 지나갑니다. 오늘의 기분이 영원할 것처럼 반응하지 않으면 기쁨은 더 오래 맑게 누리고, 슬픔은 더 빨리 지나보낼 수 있습니다.","c":"오늘 어떤 일이 찾아와도, 이 또한 지나가는 파도임을 기억하겠습니다."},{"t":"무상","q":"팔십 년 전에는 그가 나이더니, 팔십 년 뒤에는 내가 그로구나.","s":"서산 휴정, 입적 직전 자신의 영정(影幀)에 쓴 글","m":"85세로 입적하기 직전, 서산대사가 자신의 초상화를 보며 쓴 글입니다. 그림 속의 나와 지금의 나, 몸과 그 몸을 보는 이를 넘나드는 무상과 무아의 통찰이 담겨 있습니다.","l":"오래된 사진 속 나를 보면 낯설기도 하고 그립기도 합니다. 나는 늘 변해 왔고 앞으로도 변할 것입니다. 그 변화를 담담히 받아들일 때 나이 듦도 편안해집니다.","c":"변해 가는 나를 담담히 바라보며, 오늘의 나에게도 미소 지어 주겠습니다.","o":"八十年前渠是我 八十年後我是渠"},{"t":"비교","q":"사람들은 저마다 자신의 믿음과 기쁨에 따라 베푼다. 남이 받은 음식과 물을 보고 마음 상해하는 이는 밤에도 낮에도 마음의 고요를 얻지 못한다.","s":"『법구경』 제249게, 「더러움품」","m":"남이 받은 대접과 내가 받은 대접을 비교하는 마음이 평화를 깨뜨립니다. 각자의 인연에 따라 주고받는 것이니 비교하지 말라는 가르침입니다.","l":"'왜 저 사람만 챙겨 주지?' 하는 마음이 들 때가 있습니다. 그 생각에 머물수록 나만 괴롭습니다. 내가 받은 것에 감사하는 쪽으로 마음을 돌려 보세요.","c":"오늘 남이 받은 것과 비교하지 않고, 내가 받은 것에 감사하겠습니다."},{"t":"지금","q":"지나간 마음도 얻을 수 없고, 지금의 마음도 얻을 수 없으며, 오지 않은 마음도 얻을 수 없다.","s":"『금강경』 제18 「일체동관분(一體同觀分)」","m":"덕산 스님이 떡 파는 노파에게 '어느 마음에 점을 찍으려(點心) 하느냐'는 질문을 받고 말문이 막혔다는 일화로 유명한 구절입니다. 마음은 붙잡을 수 있는 고정된 실체가 아닙니다.","l":"과거의 상처, 지금의 불안, 미래의 걱정. 그 어느 것도 붙잡아 둘 수 있는 실체가 아닙니다. 붙잡을 수 없는 것을 붙잡으려 애쓰지 않을 때 마음이 쉽니다.","c":"오늘 붙잡을 수 없는 마음을 놓아주고, 가볍게 숨 쉬겠습니다.","o":"過去心不可得 現在心不可得 未來心不可得"},{"t":"나이","q":"머리가 희었다고 해서 장로가 되는 것이 아니다. 나이만 먹었다면 그를 '헛되이 늙은이'라 부른다.","s":"『법구경』 제260게, 「법에 머무는 이품」","m":"존경은 나이가 아니라 덕에서 나옵니다. 세월을 보낸 것만으로는 어른이 될 수 없고, 진실과 자비를 갖춘 이가 참된 어른입니다.","l":"'내가 나이가 몇인데'라는 말이 나올 때 한 번 멈춰 보세요. 나이는 대접받을 이유가 아니라 더 너그럽고 지혜로워야 할 책임입니다.","c":"오늘 나이만큼 깊어진 사람이 되도록, 더 너그럽게 살겠습니다."},{"t":"일상수행","q":"고요한 곳에서 공부하여 얻은 힘보다 시끄러운 곳에서 공부하여 얻은 힘이 훨씬 크다.","s":"대혜 종고(大慧宗杲), 『서장(書狀)』의 가르침","m":"바쁜 관료와 선비들에게 편지로 수행을 지도한 대혜 스님은, 세상일 속에서 닦는 공부가 조용한 산속에서 닦는 공부보다 훨씬 힘 있다고 하셨습니다.","l":"'조용한 곳에 가야 마음을 닦을 수 있다'고 생각하기 쉽습니다. 그러나 붐비는 지하철, 시끄러운 사무실에서 평정을 지키는 연습이 진짜 힘이 됩니다.","c":"오늘 시끄러운 곳에서 고요함을 지키는 연습을 하겠습니다."},{"t":"선택","q":"작은 즐거움을 버림으로써 큰 즐거움을 볼 수 있다면, 지혜로운 이는 큰 즐거움을 보고 작은 즐거움을 버린다.","s":"『법구경』 제290게, 「여러 가지품(廣衍品)」","m":"눈앞의 작은 쾌락에 매이면 더 큰 행복을 놓칩니다. 무엇을 내려놓아야 더 소중한 것을 얻는지 아는 것이 지혜입니다.","l":"밤늦은 야식 대신 상쾌한 아침, 충동구매 대신 여유로운 통장, 끝없는 영상 대신 깊은 잠. 작은 즐거움을 내려놓을 때 더 큰 즐거움이 찾아옵니다.","c":"오늘 하나의 작은 즐거움을 내려놓고, 더 큰 즐거움을 선택하겠습니다."},{"t":"인내","q":"욕설과 매질과 결박을 성내지 않고 참아 내는 이, 인내를 힘으로 삼고 인내를 군대로 삼는 이, 그를 나는 성자라 부른다.","s":"『법구경』 제399게, 「바라문품」","m":"인내는 약함이 아니라 군대와 같은 힘입니다. 모욕 앞에서 흔들리지 않는 사람이 진정 강한 사람이라는 가르침입니다.","l":"무례한 사람 앞에서 똑같이 무례해지는 것은 쉽습니다. 참아 내는 것이 더 큰 힘이 필요하고, 그 힘이 결국 상황을 바꿉니다.","c":"오늘 인내를 나의 힘으로 삼아, 쉽게 무너지지 않겠습니다."},{"t":"감사","q":"모든 이에게 감사하라.","s":"체카와 예셰 도르제, 『로종(마음 수련) 7조』(12세기 티베트)","m":"나를 돕는 이뿐 아니라 나를 힘들게 하는 이에게도 감사하라는 가르침입니다. 그들이 나에게 인내와 자비를 연습할 기회를 주기 때문입니다.","l":"까다로운 상사, 무례한 고객, 고집 센 가족이 나를 단련시키는 스승일 수 있습니다. 쉽지 않지만 '덕분에 내가 조금 더 성장한다'고 생각해 보세요.","c":"오늘 나를 힘들게 하는 이에게도, 나를 키워 주어 고맙다고 마음속으로 말해 보겠습니다."},{"t":"수행","q":"몸은 보리의 나무요 마음은 밝은 거울의 받침대이니, 때때로 부지런히 털고 닦아서 먼지가 끼지 않게 하라.","s":"신수(神秀), 『육조단경』 「행유품」","m":"혜능의 게송과 짝을 이루는 신수 대사의 게송입니다. 깨달음의 경지에서는 혜능에 못 미친다 평가받았지만, 꾸준히 마음을 닦는 점수(漸修)의 지혜로 오늘날에도 많은 이에게 귀감이 됩니다.","l":"본래 깨끗한 마음이라도 일상의 먼지는 쌓입니다. 매일 아침 세수하듯 마음도 닦아 주세요. 짧은 명상, 감사 일기, 조용한 산책이 마음의 걸레입니다.","c":"오늘도 부지런히 마음의 거울을 닦겠습니다.","o":"身是菩提樹 心如明鏡臺 時時勤拂拭 勿使惹塵埃"},{"t":"효","q":"한쪽 어깨에 어머니를, 다른 쪽 어깨에 아버지를 업고 백 년을 살며 온갖 봉양을 다해도 부모의 은혜는 다 갚을 수 없다.","s":"『앙굿따라 니까야』 「둘의 모음」 은혜에 관한 경(AN 2.33)","m":"부모의 은혜가 얼마나 큰지를 보여 주는 비유입니다. 이어서 부처님은 부모가 바른 믿음과 지혜를 갖도록 돕는 것이 그 은혜를 갚는 길이라고 하셨습니다.","l":"부모님께 물질로 다 갚을 수는 없습니다. 그러나 함께 시간을 보내고, 건강을 챙겨 드리고, 마음의 평화를 나누는 것으로 조금씩 갚아 갈 수 있습니다.","c":"오늘 부모님의 은혜를 떠올리며, 작은 효도 하나를 하겠습니다."},{"t":"모욕","q":"\"바라문이여, 손님에게 음식을 대접했는데 손님이 받지 않으면 그 음식은 누구의 것인가?\" \"대접한 사람의 것입니다.\" \"그대가 나에게 퍼부은 욕설을 내가 받지 않으니, 그것은 그대의 것이다.\"","s":"『상윳따 니까야』 「욕설 경(Akkosa Sutta)」(SN 7.2), 한역 『잡아함경』 제1152경","m":"부처님께 욕설을 퍼붓는 바라문에게 하신 말씀입니다. 모욕은 내가 받아들일 때만 내 것이 됩니다. 받지 않으면 그것은 보낸 사람에게 그대로 남습니다.","l":"누군가 무례한 말을 던질 때, 그 말을 집어 들고 하루 종일 들고 다닐 필요는 없습니다. '그건 당신의 것입니다' 하고 마음속에서 정중히 돌려보내세요.","c":"오늘 받을 필요 없는 말은 정중히 돌려보내고, 가볍게 걷겠습니다."},{"t":"변화","q":"예전에 이 마음은 원하는 대로, 좋아하는 대로, 즐거운 대로 떠돌아다녔다. 이제 나는 그 마음을 지혜롭게 다스리리라, 조련사가 사나운 코끼리를 다스리듯.","s":"『법구경』 제326게, 「코끼리품」","m":"과거의 내가 마음 가는 대로 살았다면, 이제부터는 지혜로 마음을 이끌겠다는 다짐의 게송입니다. 변화는 '이제부터'라는 결심에서 시작됩니다.","l":"늘 끌려다니던 습관 앞에서 '오늘부터는 다르게'라고 말하는 순간이 있습니다. 한 번에 길들여지지 않더라도 조련사처럼 인내심을 갖고 반복하면 됩니다.","c":"오늘부터 나는 내 마음의 조련사가 되겠습니다."},{"t":"말","q":"누구에게도 거친 말을 하지 말라. 그 말을 들은 이도 그대에게 거칠게 되돌려 주리라. 성난 말은 참으로 괴로움이니, 그 앙갚음이 그대에게 돌아오리라.","s":"『법구경』 제133게, 「폭력품」","m":"말은 메아리처럼 되돌아옵니다. 거친 말은 상대를 다치게 할 뿐 아니라 관계를 망가뜨려 결국 나에게도 상처로 돌아옵니다.","l":"화가 났을 때 보낸 메시지는 지워지지 않고 남습니다. 한 번 내뱉은 말을 주워 담는 데는 수많은 사과가 필요합니다. 보내기 전 30초만 멈춰도 많은 후회를 막을 수 있습니다.","c":"오늘 화가 나면, 말하기 전에 세 번 숨을 쉬겠습니다."},{"t":"벗","q":"\"아난다여, 좋은 벗과 좋은 동료와 함께하는 것은 청정한 삶의 절반이 아니라 전부이다.\"","s":"『상윳따 니까야』 「절반 경(Upaḍḍha Sutta)」(SN 45.2)","m":"아난다가 '좋은 벗은 수행의 절반'이라고 하자 부처님은 '절반이 아니라 전부'라고 고쳐 주셨습니다. 좋은 인연이 수행의 모든 것이라는 놀라운 말씀입니다.","l":"혼자 결심한 일은 쉽게 무너지지만, 함께하는 사람이 있으면 오래갑니다. 운동도, 공부도, 수행도 좋은 동료가 있을 때 지속됩니다.","c":"오늘 나의 좋은 도반들에게 깊이 감사하겠습니다."},{"t":"작은선","q":"'그 정도로는 내게 아무 결실이 없겠지' 하며 작은 선을 가볍게 여기지 말라. 물방울이 떨어져 물항아리를 채우듯, 지혜로운 이는 조금씩 쌓아 선으로 가득 찬다.","s":"『법구경』 제122게, 「악품」","m":"앞 게송과 짝을 이룹니다. 작은 선행이 하찮아 보여도 쌓이면 삶 전체를 채웁니다. 선은 크기보다 꾸준함이 중요합니다.","l":"엘리베이터 문을 잡아 주는 일, 경비원께 드리는 인사, 분리수거를 꼼꼼히 하는 일. 너무 작아서 의미 없어 보이는 이런 일들이 모여 나라는 사람의 향기가 됩니다.","c":"오늘 작은 선 한 방울을 떨어뜨립니다. 항아리는 조용히 차오르고 있습니다."},{"t":"효","q":"자신은 풍족하게 살면서 늙고 쇠약해진 어머니와 아버지를 봉양하지 않는 것, 이것이 파멸의 문이다.","s":"『숫타니파타』 제98게, 「파멸의 경」","m":"부모를 돌보지 않는 것을 부처님은 파멸의 문이라 하셨습니다. 나를 키워 준 은혜를 잊는 것은 삶의 뿌리를 잃는 것과 같습니다.","l":"부모님은 기다려 주지 않습니다. 바쁘다는 이유로 미루던 방문, 함께하지 못한 식사가 나중에 큰 후회로 남지 않도록 지금 마음을 표현하세요.","c":"오늘 부모님께, 혹은 나를 키워 준 분께 마음을 전하겠습니다."},{"t":"무상","q":"모든 함이 있는 법은 꿈과 같고 환상과 같으며 물거품과 그림자 같고, 이슬과 같고 번개와 같으니, 마땅히 이와 같이 볼지니라.","s":"『금강경』 제32 「응화비진분(應化非眞分)」","m":"금강경의 마지막 게송으로, 조건 따라 생겨난 모든 것이 여섯 가지 비유처럼 덧없음을 노래합니다. 이렇게 보면 집착이 줄고 마음이 자유로워집니다.","l":"오늘 나를 괴롭히는 걱정도, 나를 들뜨게 하는 기쁨도 이슬처럼 사라집니다. 그러니 걱정은 가볍게, 기쁨은 지금 충분히 누리세요.","c":"오늘의 걱정은 이슬처럼 가볍게, 오늘의 기쁨은 번개처럼 선명하게 누리겠습니다.","o":"一切有爲法 如夢幻泡影 如露亦如電 應作如是觀"},{"t":"희망","q":"높은 언덕 마른 땅에서는 연꽃이 피지 않고, 낮고 습한 진흙에서 이 꽃이 핀다.","s":"『유마경』 「불도품(佛道品)」","m":"깨달음의 꽃은 번뇌 없는 깨끗한 곳이 아니라 번뇌의 진흙 속에서 피어난다는 가르침입니다. 괴로움이 있는 곳이 곧 깨달음이 피어나는 곳입니다.","l":"지금의 어려움, 실패, 아픔이 나를 피워 낼 진흙일 수 있습니다. 편안하기만 한 땅에서는 꽃이 피지 않습니다. 지금의 진흙을 원망하지 마세요.","c":"지금 내가 선 진흙이 곧 나의 연꽃이 피어날 자리입니다.","o":"譬如高原陸地 不生蓮華 卑濕淤泥 乃生此華"},{"t":"극복","q":"너의 첫 번째 군대는 욕망이요, 두 번째는 싫증, 세 번째는 굶주림과 목마름, 네 번째는 갈애, 다섯 번째는 게으름과 무기력, 여섯 번째는 두려움, 일곱 번째는 의심, 여덟 번째는 위선과 완고함이다.","s":"『숫타니파타』 제436~438게, 「정진의 경(Padhāna Sutta)」","m":"수행하시던 부처님께 마라(악마)가 다가왔을 때 부처님이 마라의 군대를 하나하나 이름 붙여 부르신 장면입니다. 적의 이름을 알면 싸울 수 있습니다.","l":"무언가를 시작하려 할 때 나를 막는 것들이 있습니다. 게으름, 두려움, 의심. 그것들에 이름을 붙여 보세요. '아, 지금 두려움이 왔구나.' 이름을 부르는 순간 힘이 약해집니다.","c":"오늘 나를 막는 마음에 이름을 붙이고, 그 군대를 하나씩 이겨 내겠습니다."},{"t":"본성","q":"큰 바닷물이 바람으로 인해 물결이 일지만, 물의 모습과 바람의 모습은 서로 떨어지지 않는다. 바람이 그치면 움직이는 모습은 사라지나 물의 젖는 성품은 사라지지 않는다.","s":"『대승기신론(大乘起信論)』","m":"마음의 본바탕은 바다와 같고, 번뇌는 바람에 이는 물결과 같다는 비유입니다. 물결이 아무리 거칠어도 바다의 본성은 변하지 않습니다.","l":"감정의 파도가 거센 날에도 내 마음의 바다는 그대로입니다. 바람이 지나가면 물결은 잦아듭니다. 파도를 나 자신으로 착각하지 마세요.","c":"오늘 감정의 물결이 일어도, 내 마음의 바다는 고요하다는 것을 기억하겠습니다.","o":"如大海水 因風波動 水相風相 不相捨離"},{"t":"선택","q":"나쁜 일, 자기에게 해로운 일은 하기 쉽다. 이롭고 좋은 일은 참으로 하기 어렵다.","s":"『법구경』 제163게, 「자기품」","m":"좋은 일이 어려운 것은 당연합니다. 어렵다고 해서 내가 잘못된 것이 아니라, 원래 그런 것이라는 솔직한 위로이기도 합니다.","l":"운동보다 소파가, 공부보다 영상이 쉬운 것은 의지가 약해서만이 아닙니다. 원래 좋은 일이 어려운 법이니, 어려움을 느끼는 나를 너무 탓하지 마세요. 그리고 한 걸음만 내딛어 보세요.","c":"어려운 것이 당연합니다. 그래도 오늘 좋은 일 하나를 해내겠습니다."},{"t":"마음","q":"멀리 떠돌고, 홀로 움직이며, 형체 없이 몸이라는 동굴에 숨어 있는 이 마음을 다스리는 이는 마라의 속박에서 벗어나리라.","s":"『법구경』 제37게, 「마음품」","m":"마음은 눈 깜짝할 사이에 먼 과거와 미래를 오가고, 형체가 없어 붙잡기 어렵습니다. 그런 마음을 알아차리고 다스리는 것이 해탈의 길입니다.","l":"몸은 회의실에 있는데 마음은 주말 여행지에, 몸은 아이 곁에 있는데 마음은 회사 일에 가 있습니다. 마음을 지금 여기로 불러오는 연습이 필요합니다.","c":"오늘 몇 번이라도, 떠도는 마음을 지금 여기로 불러오겠습니다."},{"t":"실천","q":"나는 좋은 의사와 같아서 병을 알고 약을 처방하지만, 먹고 먹지 않는 것은 의사의 허물이 아니다. 또 좋은 길잡이와 같아서 좋은 길로 이끌지만, 듣고도 가지 않는 것은 길잡이의 허물이 아니다.","s":"『불유교경』","m":"부처님은 길을 알려 주실 뿐, 걷는 것은 각자의 몫이라는 가르침입니다. 좋은 처방도 먹어야 낫습니다.","l":"좋은 강의를 듣고, 좋은 책을 읽고, 좋은 조언을 받아도 실천하지 않으면 아무 소용이 없습니다. 오늘 받은 처방 하나를 실제로 먹어 보세요.","c":"오늘 알고 있는 좋은 처방 하나를 직접 실천하겠습니다.","o":"我如良醫 知病說藥 服與不服 非醫咎也"},{"t":"벗","q":"지혜롭고 바르게 사는 어진 벗을 만나면, 모든 어려움을 이겨 내며 기쁜 마음으로 깨어서 함께 가라.","s":"『법구경』 제328게, 「코끼리품」","m":"좋은 벗을 만나는 것은 인생의 큰 복입니다. 그런 벗을 만나면 기꺼이 함께 걸으며 서로를 일깨우라는 가르침입니다.","l":"나를 더 좋은 사람이 되게 하는 친구, 함께 있으면 바르게 살고 싶어지는 친구가 있다면 그 인연을 소중히 하세요. 그리고 나도 누군가에게 그런 벗이 되어 주세요.","c":"오늘 나의 좋은 벗에게 고맙다는 연락을 해 보겠습니다."},{"t":"자유","q":"청산은 나를 보고 말없이 살라 하고, 창공은 나를 보고 티 없이 살라 하네. 사랑도 벗어 놓고 미움도 벗어 놓고, 물같이 바람같이 살다가 가라 하네.","s":"나옹 혜근(懶翁惠勤) 선사의 선시로 전함","m":"고려 말의 고승 나옹 선사의 시로 전해지며 오늘날에도 널리 애송됩니다. 자연처럼 집착 없이, 물과 바람처럼 걸림 없이 살라는 노래입니다.","l":"복잡한 관계와 감정에 지칠 때 산과 하늘을 바라보세요. 말없이 묵묵하고 티 없이 맑은 자연이 우리에게 가르쳐 주는 삶의 방식이 있습니다.","c":"오늘 하루, 물같이 바람같이 가볍게 살아 보겠습니다.","o":"靑山兮要我以無語 蒼空兮要我以無垢 聊無愛而無憎兮 如水如風而終我"},{"t":"용서","q":"이 세상에서 원한은 원한으로 결코 사라지지 않는다. 원한을 내려놓을 때에만 사라진다. 이것은 변함없는 진리이다.","s":"『법구경』 제5게, 「쌍품」","m":"미움에 미움으로 답하면 불에 장작을 넣는 것과 같아 끝없이 이어집니다. 부처님은 원한의 고리를 끊는 유일한 방법이 내 쪽에서 먼저 놓는 것임을 '영원한 법'이라고까지 강조하셨습니다.","l":"오래된 서운함, 끝나지 않는 댓글 싸움, 가족 사이의 냉전은 대개 '저쪽이 먼저 사과해야 한다'는 마음 때문에 길어집니다. 원한을 놓는다는 것은 상대가 옳았다고 인정하는 일이 아니라, 그 일이 더 이상 내 마음을 끌고 다니지 못하게 하는 일입니다. 놓는 사람이 먼저 자유로워집니다.","c":"오늘 하나의 묵은 원망을 조용히 내려놓아 봅니다. 가벼워진 그 자리에 평화가 들어설 것입니다."},{"t":"존엄","q":"하늘 위 하늘 아래 오직 나 홀로 존귀하다. 삼계가 모두 괴로움에 빠져 있으니 내가 마땅히 그들을 편안하게 하리라.","s":"『수행본기경(修行本起經)』, 부처님 탄생게(誕生偈)","m":"부처님이 태어나 일곱 걸음을 걸으며 외치셨다는 탄생게입니다. 여기서 '나'는 교만한 자아가 아니라 모든 생명이 지닌 존귀한 본성을 뜻하며, 그 존귀함은 괴로운 이들을 편안하게 하는 데로 이어집니다.","l":"나는 존귀한 존재입니다. 그리고 내 앞의 사람도 똑같이 존귀합니다. 자존감은 남을 깎아내리는 데서가 아니라, 나와 남의 존귀함을 함께 아는 데서 옵니다.","c":"오늘 나의 존귀함을 믿고, 그 힘으로 누군가를 편안하게 하겠습니다.","o":"天上天下 唯我獨尊 三界皆苦 我當安之"},{"t":"자기다스림","q":"자기야말로 자기의 주인이요, 자기야말로 자기의 의지처이다. 그러므로 상인이 좋은 말을 다루듯 자기를 잘 다스려라.","s":"『법구경』 제380게, 「비구품」","m":"좋은 말을 가진 상인은 말을 혹사하지도 방치하지도 않고 정성껏 돌봅니다. 나 자신도 그렇게 아끼며 바르게 이끌라는 뜻입니다.","l":"자기 관리는 스스로를 몰아붙이는 것이 아니라 소중한 말을 돌보듯 쉬게 할 때 쉬게 하고 달릴 때 달리게 하는 것입니다.","c":"오늘 나를 혹사하지도 방치하지도 않고, 아끼며 이끌겠습니다."},{"t":"보시","q":"굶주린 나그네에게 줄 것이 없던 토끼는 \"저를 드십시오\" 하며 스스로 불 속으로 뛰어들었다. 나그네로 변해 있던 제석천은 그 마음에 감동하여 달에 토끼의 모습을 새겨 두었다.","s":"『자타카(본생경)』 「토끼 본생 이야기(Sasa Jātaka)」(J 316)","m":"부처님의 전생 이야기 중 하나입니다. 가진 것이 없어도 자신의 전부를 내어 줄 수 있는 마음, 그 순수한 보시가 달 속의 토끼 전설이 되었다고 전합니다.","l":"오늘 밤 달을 보면 이 이야기를 떠올려 보세요. 줄 것이 없다고 생각할 때도 우리에게는 시간, 관심, 마음이라는 나눌 것이 있습니다.","c":"오늘 가진 것이 없다고 말하지 않고, 내 마음과 시간을 나누겠습니다."},{"t":"마음","q":"모든 일은 마음이 앞서 가고, 마음이 주인이 되며, 마음으로 지어진다. 맑은 마음으로 말하고 행동하면 즐거움이 그를 따르리라. 그림자가 몸을 떠나지 않듯이.","s":"『법구경』(Dhammapada) 제2게, 「쌍품(雙品)」","m":"법구경의 두 번째 게송입니다. 바로 앞의 제1게는 '나쁜 마음으로 말하고 행하면 괴로움이 따른다'고 하고, 이 게송은 그 반대편을 보여 줍니다. 행복과 불행의 출발점이 바깥 사건보다 먼저 내 마음의 상태에 있다는 가르침입니다.","l":"같은 출근길, 같은 회의라도 어떤 마음으로 들어서느냐에 따라 하루의 결이 달라집니다. 짜증을 품고 보낸 메시지는 짜증으로 돌아오고, 다정하게 건넨 한마디는 오래 남습니다. 오늘 내가 겪는 일의 상당 부분은 내가 먼저 꺼낸 마음이 되돌아온 것일 수 있습니다.","c":"오늘 아침, 첫마디를 맑은 마음으로 건네 봅니다. 그 마음이 그림자처럼 하루를 따라올 것입니다."},{"t":"미소","q":"늘 부드럽고 온화한 얼굴로 사람을 대하는 것, 이것이 화안열색시(和顔悅色施)이다.","s":"『잡보장경』 권6, 무재칠시 중 두 번째","m":"무재칠시 가운데 가장 쉽고도 큰 보시가 바로 밝은 얼굴입니다. 환한 얼굴 하나가 주변 사람들의 하루를 밝힙니다.","l":"아침에 만나는 가족, 동료, 가게 점원에게 먼저 미소 지어 보세요. 미소는 돈 한 푼 들지 않지만 받는 사람에게는 큰 선물이 되고, 나에게도 기분 좋은 하루를 선물합니다.","c":"오늘 만나는 모든 이에게 환한 얼굴이라는 선물을 건네겠습니다.","o":"和顔悅色施"},{"t":"돌봄","q":"비구들이여, 나를 시봉하려는 이는 병든 이를 돌보아라.","s":"『율장(Vinaya)』 「대품(Mahāvagga)」 8.26","m":"아무도 돌보지 않아 오물 속에 누워 있던 병든 비구를 부처님이 직접 씻기시고 하신 말씀입니다. 부처님을 섬기는 길은 가장 약한 이를 돌보는 데 있습니다.","l":"신앙은 기도에서 끝나지 않습니다. 아픈 가족, 외로운 이웃, 소외된 동료를 돌보는 것이 곧 부처님을 모시는 일입니다.","c":"오늘 내 곁의 아픈 이, 약한 이를 한 번 더 돌보겠습니다."},{"t":"수행","q":"비방하지 않고, 해치지 않으며, 계율을 지켜 자신을 다스리고, 음식을 절제하며, 한적한 곳에 머물러 높은 마음에 전념하는 것, 이것이 부처님들의 가르침이다.","s":"『법구경』 제185게, 「붓다품」","m":"칠불통게에 이어 수행자의 생활 지침을 구체적으로 보여 줍니다. 말을 삼가고, 해치지 않고, 절제하고, 고요히 머무는 삶입니다.","l":"현대인에게 적용하면 이렇습니다. 험담하지 않기, 상처 주지 않기, 원칙 지키기, 과식하지 않기, 하루에 잠시라도 혼자 조용히 있기.","c":"오늘 이 다섯 가지 중 하나만이라도 정성껏 지키겠습니다."},{"t":"억울함","q":"억울함을 당해서 밝히려고 하지 말라. 억울함을 밝히면 원망하는 마음을 돕게 된다. 그러므로 억울함을 당하는 것으로써 수행의 문을 삼으라.","s":"묘협 스님, 「보왕삼매론」 제10","m":"억울함을 따지고 밝히려 할수록 원망이 커질 수 있다는 가르침입니다. 억울함을 견디는 그 자리가 오히려 수행의 문이 됩니다.","l":"부당한 일을 무조건 참으라는 뜻은 아닙니다. 다만 사소한 오해까지 하나하나 해명하려다 보면 마음이 원망으로 가득해집니다. 때로는 흘려보내는 것이 나를 지킵니다.","c":"오늘 사소한 억울함은 흘려보내고, 그 자리를 수행의 문으로 삼겠습니다.","o":"被抑不求申明 抑申明則怨恨滋生"},{"t":"지혜","q":"지혜가 없는 이에게는 선정이 없고, 선정이 없는 이에게는 지혜가 없다. 선정과 지혜를 함께 갖춘 이는 참으로 열반에 가까이 있다.","s":"『법구경』 제372게, 「비구품」","m":"고요한 마음(선정)과 밝게 보는 힘(지혜)은 서로를 키웁니다. 마음이 고요해야 바르게 보이고, 바르게 보아야 마음이 고요해집니다.","l":"흥분한 상태에서 내린 결정은 대개 후회로 남습니다. 중요한 결정 앞에서 먼저 마음을 가라앉히면, 그때 비로소 무엇이 옳은지 보입니다.","c":"오늘 중요한 결정 앞에서 먼저 마음을 고요히 하겠습니다."},{"t":"회복","q":"땅에 넘어진 사람은 땅을 짚고 일어서야 한다. 땅을 떠나서 일어서려 하면 그럴 수 없다.","s":"보조 지눌(普照知訥), 『권수정혜결사문(勸修定慧結社文)』","m":"고려의 지눌 스님이 결사를 시작하며 쓴 글의 첫 구절입니다. 마음 때문에 넘어진 사람은 그 마음을 딛고 일어서야 한다는 뜻입니다.","l":"실패한 자리, 상처받은 자리를 피하고만 싶습니다. 그러나 다시 일어서는 힘은 바로 넘어진 그 자리에서 나옵니다. 넘어진 경험을 딛고 일어서세요.","c":"넘어진 이 자리를 짚고, 오늘 다시 일어서겠습니다.","o":"因地而倒者 因地而起 離地求起 無有是處"},{"t":"행복","q":"일이 생겼을 때 벗이 있으면 즐겁고, 무엇이든 만족할 줄 알면 즐겁다. 생의 마지막에 공덕이 있으면 즐겁고, 모든 괴로움을 버리면 즐겁다.","s":"『법구경』 제331게, 「코끼리품」","m":"행복의 순간들을 소박하게 짚어 낸 게송입니다. 어려울 때의 벗, 만족하는 마음, 쌓아 온 선행, 그리고 괴로움에서 벗어남이 진정한 즐거움입니다.","l":"행복은 거창한 성공보다 힘들 때 전화할 수 있는 친구, 작은 것에도 만족하는 마음에 있습니다. 그리고 그런 것들은 지금 당장 가꿀 수 있습니다.","c":"오늘 내 곁의 벗과 만족하는 마음, 이 두 가지 즐거움을 누리겠습니다."},{"t":"위로","q":"한량없는 중생이 온갖 괴로움을 받을 때, 관세음보살의 이름을 듣고 한마음으로 부르면, 관세음보살은 곧 그 음성을 살펴 모두 벗어나게 한다.","s":"『법화경』 「관세음보살보문품(觀世音菩薩普門品)」","m":"관세음(觀世音)은 '세상의 소리를 살피는 이'라는 뜻입니다. 괴로운 이의 부르짖음을 외면하지 않고 듣는 자비의 상징입니다.","l":"힘들 때 누군가 내 이야기를 들어 주는 것만으로 큰 위로가 됩니다. 나도 누군가의 관세음보살이 될 수 있습니다. 오늘 힘든 이의 이야기를 끝까지 들어 주세요.","c":"오늘 나는 누군가의 괴로운 목소리를 살펴 듣는 사람이 되겠습니다."},{"t":"말","q":"입을 잘 다스리고, 지혜롭게 말하며, 들뜨지 않고, 진리와 그 뜻을 밝히는 수행자의 말은 달콤하다.","s":"『법구경』 제363게, 「비구품」","m":"말을 다스리는 사람의 말은 듣는 이에게 꿀처럼 달콤합니다. 적절할 때 적절한 말을 하는 것이 지혜입니다.","l":"말을 많이 하는 사람보다 필요한 말을 제때 하는 사람이 존중받습니다. 오늘 말하기 전에 '이 말이 지금 필요한가?'를 한 번 물어보세요.","c":"오늘 필요한 말을, 따뜻하게, 제때 하겠습니다."},{"t":"배움","q":"선재동자는 문수보살의 가르침을 받고 선지식을 찾아 남쪽으로 길을 떠났다. 그가 만난 쉰세 명의 스승 가운데에는 뱃사공도, 장사꾼도, 어린아이도, 이교도도 있었다.","s":"『화엄경』 「입법계품(入法界品)」, 선재동자의 구도 여행","m":"선재동자는 스님뿐 아니라 온갖 직업과 신분의 사람들에게서 배움을 얻었습니다. 깨달음의 스승은 어디에나 있다는 가르침입니다.","l":"배움은 학교와 책에만 있지 않습니다. 택배 기사님의 성실함, 아이의 솔직함, 나와 생각이 다른 사람의 관점에서도 배울 수 있습니다.","c":"오늘 만나는 모든 사람을 나의 선지식으로 여기고 배우겠습니다."},{"t":"스스로","q":"그대 스스로 애써야 한다. 여래는 다만 길을 가리켜 줄 뿐이다. 길에 들어 선정을 닦는 이는 마라의 속박에서 벗어나리라.","s":"『법구경』 제276게, 「길품(道行品)」","m":"부처님조차 대신 걸어 주실 수는 없습니다. 길을 알려 주는 것은 스승의 몫이고, 걷는 것은 나의 몫이라는 가르침입니다.","l":"좋은 책, 좋은 멘토, 좋은 앱이 있어도 결국 실행은 내가 해야 합니다. 누군가 대신 운동해 줄 수 없고, 대신 마음을 닦아 줄 수 없습니다.","c":"길은 이미 보입니다. 오늘 나는 내 발로 한 걸음을 내딛겠습니다."},{"t":"만족","q":"건강은 가장 큰 이익이요, 만족은 가장 큰 재산이다. 믿을 수 있는 벗은 가장 좋은 친척이요, 열반은 가장 큰 행복이다.","s":"『법구경』 제204게, 「행복품」","m":"진정한 부(富)가 무엇인지 알려 주는 유명한 게송입니다. 건강, 만족, 신뢰, 마음의 평화. 이 네 가지는 돈으로 살 수 없는 최고의 재산입니다.","l":"아파 본 사람은 건강이 얼마나 큰 재산인지 압니다. 만족을 아는 사람은 부자보다 부유하고, 믿을 수 있는 친구 하나는 어떤 인맥보다 든든합니다.","c":"오늘 내가 가진 진짜 재산들을 헤아려 보고, 그것을 소중히 돌보겠습니다."},{"t":"지금","q":"한 스님이 \"제가 처음 왔습니다. 가르침을 주십시오\" 하자, 조주가 물었다. \"죽은 먹었느냐?\" \"먹었습니다.\" \"그러면 발우를 씻어라.\"","s":"『무문관』 제7칙, 조주세발(趙州洗鉢)","m":"거창한 가르침을 기대한 스님에게 조주는 지금 해야 할 일을 하라고 했습니다. 밥을 먹었으면 그릇을 씻는 것, 그것이 도입니다.","l":"인생의 큰 답을 찾느라 지금 해야 할 작은 일을 놓칠 때가 있습니다. 먹었으면 치우고, 약속했으면 지키고, 시작했으면 마무리하세요. 그것이 수행입니다.","c":"오늘 거창한 답을 찾기 전에, 지금 내 앞의 발우부터 씻겠습니다.","o":"喫粥了也未 洗鉢盂去"},{"t":"무상","q":"\"모든 형성된 것은 무상하다.\" 지혜로써 이것을 볼 때, 괴로움에서 멀어진다. 이것이 청정에 이르는 길이다.","s":"『법구경』 제277게, 「길품」","m":"세상의 모든 것은 변합니다. 이 진리를 거부할 때 괴로움이 생기고, 받아들일 때 마음이 자유로워집니다. 불교의 세 가지 진리 중 첫째입니다.","l":"좋은 시절도, 힘든 시절도 모두 지나갑니다. 행복할 때 무상을 기억하면 그 순간을 더 소중히 누리고, 힘들 때 무상을 기억하면 견딜 힘이 생깁니다.","c":"지금 힘든 일이 있다면, 그것도 변합니다. 지금 좋은 일이 있다면, 오늘 마음껏 누리겠습니다.","o":"諸行無常"},{"t":"우정","q":"친구를 사귀되 내가 이롭기를 바라지 말라. 내가 이롭고자 하면 의리를 상하게 된다. 그러므로 순결로써 사귐을 길게 하라.","s":"묘협 스님, 「보왕삼매론」 제6","m":"이익을 바라고 사귀는 관계는 이익이 사라지면 끝납니다. 순수한 마음으로 사귈 때 우정이 오래간다는 가르침입니다.","l":"인맥을 '관리'하는 시대입니다. 그러나 진짜 친구는 계산 없이 만나는 사람입니다. 오늘 아무 용건 없이, 그냥 보고 싶어서 연락할 친구를 떠올려 보세요.","c":"오늘 아무 계산 없이, 그저 반가운 마음으로 친구에게 연락하겠습니다.","o":"交情不求益吾 交益吾則虧損道義"},{"t":"마음","q":"붙잡기 어렵고 가볍게 날뛰며 바라는 곳마다 내려앉는 마음, 그 마음을 다스리는 것은 훌륭하다. 잘 다스려진 마음은 행복을 가져온다.","s":"『법구경』 제35게, 「마음품」","m":"마음은 원숭이처럼 이 가지에서 저 가지로 뛰어다닙니다. 부처님은 그런 마음을 억누르라 하지 않고 '다스리라'고 하셨습니다. 길들여진 마음이 곧 행복의 바탕입니다.","l":"일하다가 알림 하나에 마음이 휙 날아가고, 돌아와 보면 30분이 지나 있습니다. 마음이 내려앉는 자리를 내가 고를 수 있을 때 집중도, 휴식도, 관계도 깊어집니다.","c":"오늘은 한 가지 일을 할 때 그 일에만 마음을 내려앉혀 보겠습니다."},{"t":"성찰","q":"나는 늙기 마련이고 늙음을 피할 수 없다. 나는 병들기 마련이고, 죽기 마련이며, 사랑하는 모든 것과 헤어지기 마련이다. 이것을 늘 성찰해야 한다.","s":"『앙굿따라 니까야』 「늘 성찰해야 할 다섯 가지 경(Upajjhatthana Sutta)」(AN 5.57)","m":"누구나 매일 성찰해야 할 다섯 가지 중 네 가지입니다. 이를 성찰하면 젊음과 건강에 대한 교만이 줄고, 소중한 것을 더 아끼게 된다고 하셨습니다.","l":"무거운 이야기 같지만, 이것을 받아들이면 오히려 오늘이 선명해집니다. 언젠가 헤어질 사람이기에 오늘 더 다정하게 대하게 됩니다.","c":"언젠가 헤어질 소중한 사람들에게, 오늘 더 다정하겠습니다."},{"t":"깨달음","q":"향엄 스님이 마당을 쓸다가 빗자루에 튕긴 기왓조각이 대나무에 부딪쳐 '딱' 하는 소리를 듣는 순간 크게 깨달았다.","s":"향엄 지한(香嚴智閑)의 깨달음 이야기, 『전등록』 권11","m":"경전 지식으로는 스승의 물음에 답하지 못해 책을 모두 태우고 묘지기로 살던 향엄 스님은, 평범한 일을 하다가 한 순간의 소리에 깨달았습니다. 깨달음은 일상 속에 숨어 있습니다.","l":"답이 안 풀릴 때 억지로 붙들기보다 잠시 내려놓고 일상으로 돌아가 보세요. 설거지하다, 산책하다 문득 답이 떠오르는 경험을 누구나 해 보았을 것입니다.","c":"오늘 평범한 일 속에서 '딱' 하고 마음이 열리는 순간을 만나기를."},{"t":"탐욕","q":"잡초가 밭을 망치듯 탐욕이 사람을 망친다. 그러므로 탐욕을 떠난 이에게 베푼 것은 큰 결실을 맺는다.","s":"『법구경』 제356게, 「갈애품」","m":"아무리 좋은 밭도 잡초가 무성하면 작물이 자라지 못합니다. 마음의 밭에서 탐욕이라는 잡초를 뽑아야 좋은 것이 자랍니다.","l":"더 많이, 더 빨리, 더 좋은 것을 원하는 마음이 삶의 밭을 덮고 있지는 않나요? 잡초를 조금 뽑아내면 감사와 여유가 자랄 자리가 생깁니다.","c":"오늘 내 마음 밭의 탐욕 잡초 하나를 뽑겠습니다."},{"t":"실천","q":"빛깔은 아름다우나 향기가 없는 꽃처럼, 잘 설해진 말도 실천하지 않는 이에게는 열매가 없다. 빛깔도 곱고 향기도 있는 꽃처럼, 잘 설해진 말을 실천하는 이에게는 열매가 있다.","s":"『법구경』 제51~52게, 「꽃품」","m":"말과 행동이 일치할 때 비로소 향기가 납니다. 겉으로 보기 좋은 말은 빛깔에 불과하고, 실천이 더해져야 사람의 마음을 움직이는 향기가 된다는 비유입니다.","l":"그럴듯한 말과 멋진 다짐은 넘쳐나지만, 사람들이 오래 기억하는 것은 묵묵히 약속을 지킨 사람입니다. 말을 줄이고 한 가지라도 해내는 사람에게서 신뢰의 향기가 납니다.","c":"오늘은 말보다 행동이 먼저인 하루를 살겠습니다."},{"t":"인내","q":"한 번 추위가 뼛속까지 사무치지 않았다면 어찌 매화가 코를 찌르는 향기를 얻었으랴.","s":"황벽 희운(黃檗希運)의 게송으로 전함","m":"매화는 혹독한 추위를 견딘 뒤에 가장 짙은 향기를 피웁니다. 고난을 견뎌 낸 사람에게서 깊은 향기가 난다는 가르침입니다.","l":"지금 겪고 있는 추위가 있다면, 그것이 당신의 향기를 만들고 있는 중입니다. 쉽게 얻은 것보다 견뎌서 얻은 것이 훨씬 깊고 오래갑니다.","c":"지금의 추위를 견디는 나는, 머지않아 매화처럼 향기로울 것입니다.","o":"不是一番寒徹骨 爭得梅花撲鼻香"},{"t":"습관","q":"뿌리가 다치지 않고 튼튼하면 나무를 베어도 다시 자라나듯, 갈애의 잠재된 뿌리를 뽑지 않으면 이 괴로움은 거듭거듭 생겨난다.","s":"『법구경』 제338게, 「갈애품」","m":"겉으로 드러난 문제만 잘라 내면 다시 자랍니다. 괴로움의 뿌리인 집착을 살펴야 진정한 변화가 일어난다는 가르침입니다.","l":"스트레스를 받을 때마다 같은 습관으로 돌아가는 이유가 있습니다. 행동만 막기보다 '내가 왜 이것을 찾을까?'라는 뿌리를 들여다볼 때 비로소 끊어집니다.","c":"오늘 반복되는 나의 습관 하나의 뿌리를 조용히 들여다보겠습니다."},{"t":"마음","q":"그 마음이 깨끗하면 곧 불국토가 깨끗하다.","s":"『유마경』 「불국품(佛國品)」","m":"정토는 먼 곳에 있는 것이 아니라 깨끗한 마음이 머무는 곳이 곧 정토라는 가르침입니다. 마음이 세상을 만듭니다.","l":"같은 집, 같은 직장도 내 마음이 맑으면 편안한 곳이 되고, 내 마음이 어두우면 답답한 곳이 됩니다. 장소를 바꾸기 전에 마음을 먼저 맑혀 보세요.","c":"오늘 내 마음을 맑혀, 내가 있는 이곳을 정토로 만들겠습니다.","o":"隨其心淨 則佛土淨"},{"t":"조화","q":"벌이 꽃의 빛깔과 향기를 해치지 않고 꿀만 따서 날아가듯, 성자는 마을을 다녀야 한다.","s":"『법구경』 제49게, 「꽃품(華品)」","m":"수행자가 탁발하러 마을에 갈 때의 자세를 벌에 비유했습니다. 필요한 만큼만 얻고, 머문 자리에 해를 남기지 않으며, 오히려 꽃이 열매 맺도록 돕고 떠나는 삶입니다.","l":"우리가 머무는 직장, 모임, 여행지, 그리고 지구에서도 벌처럼 살 수 있습니다. 쓰레기를 남기지 않는 캠핑, 상대를 지치게 하지 않는 부탁, 머문 자리를 오히려 더 좋게 만드는 태도가 그것입니다.","c":"오늘 내가 다녀간 자리가 조금 더 향기로워지기를 바랍니다."},{"t":"사성제","q":"이것이 괴로움이다. 이것이 괴로움의 원인이다. 이것이 괴로움의 소멸이다. 이것이 괴로움의 소멸에 이르는 길이다.","s":"『상윳따 니까야』 「초전법륜경」(SN 56.11) — 네 가지 거룩한 진리(사성제)","m":"불교의 핵심인 사성제(四聖諦)입니다. 의사가 병을 진단하고, 원인을 찾고, 나을 수 있음을 알리고, 처방을 내리는 것과 같은 구조입니다.","l":"삶의 문제 앞에서도 이 네 단계를 써 볼 수 있습니다. 무엇이 문제인가, 원인은 무엇인가, 해결된 모습은 어떤가, 무엇을 하면 되는가. 막막한 고민도 정리됩니다.","c":"오늘 나를 괴롭히는 문제를 네 단계로 차분히 살펴보겠습니다.","o":"苦集滅道"},{"t":"시간","q":"국경의 성을 안팎으로 굳게 지키듯 자신을 지켜라. 한순간도 헛되이 보내지 말라. 순간을 놓친 이들은 지옥에 떨어져 슬퍼한다.","s":"『법구경』 제315게, 「지옥품」","m":"국경의 성은 한순간만 방심해도 무너집니다. 마음도 그렇습니다. 지금 이 순간을 소중히 여기라는 간절한 당부입니다.","l":"'잠깐만'이 쌓여 하루가 되고, 하루가 쌓여 한 해가 됩니다. 지금 이 순간을 어떻게 쓰느냐가 결국 인생을 결정합니다.","c":"오늘 지금 이 순간을 놓치지 않겠습니다. 이 순간이 곧 내 삶입니다."},{"t":"존중","q":"여섯 방향에 예배하는 것은 이와 같다. 동쪽은 부모, 남쪽은 스승, 서쪽은 아내와 자식, 북쪽은 벗, 아래는 일하는 사람들, 위는 수행자이다.","s":"『디가 니까야』 「시갈로바다 경(Sigālovāda Sutta)」(DN 31), 한역 『장아함경』 「선생경(善生經)」","m":"아버지의 유언대로 여섯 방향에 절하던 청년 시갈라에게 부처님이 그 참뜻을 알려 주신 경전입니다. 진정한 예배는 내 주변의 모든 관계를 존중하는 것입니다.","l":"기도는 법당에서만 하는 것이 아닙니다. 부모를 공경하고, 스승을 존중하고, 가족을 아끼고, 친구에게 신의를 지키고, 함께 일하는 사람을 배려하는 것이 일상의 예배입니다.","c":"오늘 내 주변 여섯 방향의 인연에게 마음으로 예를 올리겠습니다."},{"t":"업","q":"하늘에도, 바다 한가운데에도, 산속 동굴에 들어가도, 악업에서 벗어날 수 있는 곳은 이 세상 어디에도 없다.","s":"『법구경』 제127게, 「악품」","m":"내가 지은 행위의 결과는 어디로 숨어도 따라옵니다. 그러므로 피하려 하기보다 처음부터 짓지 않는 것이 지혜라는 가르침입니다.","l":"문제를 덮어 두면 사라질 것 같지만 대개 더 커져서 돌아옵니다. 회피보다 정면으로 마주하고 바로잡는 것이 결국 가장 빠른 길입니다.","c":"오늘 피하고 싶은 일이 있다면, 숨지 않고 정직하게 마주하겠습니다."},{"t":"스스로","q":"자신을 등불로 삼고 자신을 의지처로 삼아라. 진리를 등불로 삼고 진리를 의지처로 삼아라. 다른 것을 의지처로 삼지 말라.","s":"『디가 니까야』 「대반열반경」(DN 16), 한역 『장아함경』 「유행경(遊行經)」","m":"열반을 앞둔 부처님께 아난다가 '이제 누구를 의지해야 합니까?' 하고 묻자 하신 말씀입니다. 스승이 떠나도 자기 자신과 진리가 가장 확실한 등불이라는 가르침입니다.","l":"누군가에게 기대야만 설 수 있다면 그 사람이 떠날 때 무너집니다. 스스로를 등불 삼는 힘, 그리고 흔들리지 않는 원칙을 등불 삼는 힘을 길러야 합니다.","c":"오늘 나는 나 자신과 진리를 등불 삼아 내 길을 밝히겠습니다.","o":"自燈明 法燈明"},{"t":"집착","q":"마땅히 머무는 바 없이 그 마음을 낼지어다.","s":"『금강경』 제10 「장엄정토분(莊嚴淨土分)」","m":"육조 혜능 스님이 나무를 팔다가 이 구절을 듣고 깨달았다고 전해지는 유명한 구절입니다. 어디에도 집착하지 않되 마음을 일으켜 자비롭게 행하라는 뜻입니다.","l":"좋은 일을 하면서도 '내가 했다'는 생각에 머물면 서운함이 생깁니다. 집착 없이 마음을 내면 결과에 흔들리지 않고 기쁘게 행할 수 있습니다.","c":"오늘 머무는 바 없이, 가벼운 마음으로 좋은 일을 하겠습니다.","o":"應無所住 而生其心"},{"t":"분별","q":"소문이나 전통이나 경전에 쓰여 있다고 해서, 추론이나 그럴듯함이나 스승의 말이라고 해서 받아들이지 말라. 스스로 '이것은 유익하고 지혜로운 이들이 칭찬하는 것'임을 알 때 받아들여라.","s":"『앙굿따라 니까야』 「깔라마 경(Kālāma Sutta)」(AN 3.65)","m":"여러 스승의 상반된 주장에 혼란스러워하던 깔라마 사람들에게 주신 가르침입니다. 부처님은 맹신이 아니라 스스로 검증하는 지혜를 권하셨습니다.","l":"가짜 뉴스와 근거 없는 주장이 넘쳐 나는 시대에 꼭 필요한 가르침입니다. 많이 공유된다고, 유명한 사람이 말했다고 믿지 말고, 스스로 살펴보고 판단하세요.","c":"오늘 듣는 말을 그대로 믿기보다, 스스로 살펴 지혜롭게 판단하겠습니다."},{"t":"미루기","q":"한 달 뒤 잔치에 쓸 우유를 넉넉히 모으려고, 어리석은 이는 '소 뱃속에 모아 두었다 한꺼번에 짜리라' 하며 한 달 동안 젖을 짜지 않았다. 막상 짜려 하니 젖이 말라 버렸다.","s":"『백유경』 「어리석은 사람이 우유를 모은 비유(愚人集牛乳喩)」","m":"베풂과 선행을 '나중에 넉넉해지면 한꺼번에 하겠다'며 미루는 어리석음을 비유한 이야기입니다. 그때가 되면 기회도 마음도 말라 버립니다.","l":"'여유가 생기면 기부해야지', '시간이 나면 효도해야지'. 그러나 그때는 오지 않을 수 있습니다. 지금 할 수 있는 만큼 조금씩 하는 것이 지혜입니다.","c":"오늘 미뤄 둔 선행을, 지금 할 수 있는 만큼 조금이라도 하겠습니다."},{"t":"인내","q":"참고 견디는 인욕은 최고의 수행이요, 열반은 최상의 경지라고 부처님들은 말씀하신다.","s":"『법구경』 제184게, 「붓다품」","m":"인욕(忍辱)은 억지로 참는 것이 아니라, 어려움 속에서도 마음의 평정을 잃지 않는 힘입니다. 부처님은 이것을 가장 뛰어난 수행이라 하셨습니다.","l":"기다려야 하는 결과, 이해되지 않는 사람, 풀리지 않는 문제 앞에서 인내는 포기가 아니라 가장 성숙한 대응입니다. 서두르지 않고 견디는 사람이 끝내 길을 엽니다.","c":"오늘 조급함이 올라오면, 이것도 수행이라 여기며 한 번 더 기다려 보겠습니다."},{"t":"섬김","q":"중생을 따르고 섬기는 것이 곧 모든 부처님을 따르고 섬기는 것이며, 중생을 기쁘게 하는 것이 곧 모든 부처님을 기쁘게 하는 것이다.","s":"『화엄경』 「보현행원품」, 열 가지 행원 중 '항순중생(恒順衆生)'","m":"부처님을 기쁘게 하는 길은 멀리 있지 않습니다. 내 앞의 사람을 존중하고 기쁘게 하는 것이 곧 부처님을 공경하는 일이라는 가르침입니다.","l":"절에서 올리는 기도도 소중하지만, 집에 돌아와 가족에게 웃어 주고 이웃을 돕는 것이 더 큰 공양일 수 있습니다.","c":"오늘 내 앞의 사람을 기쁘게 하는 것으로 부처님께 공양을 올리겠습니다.","o":"若令衆生生歡喜者 則令一切如來歡喜"},{"t":"마음","q":"원수가 원수에게, 미워하는 이가 미워하는 이에게 끼치는 해보다, 그릇되게 향한 마음이 자기에게 더 큰 해를 끼친다.","s":"『법구경』 제42게, 「마음품」","m":"우리는 흔히 나를 해치는 것이 바깥의 적이라고 생각합니다. 그러나 이 게송은 잘못된 방향으로 굴러가는 내 마음이 어떤 원수보다 더 깊은 상처를 낼 수 있다고 말합니다.","l":"비교하는 마음, 스스로를 깎아내리는 마음, 최악을 상상하는 마음은 누가 시키지 않아도 하루 종일 나를 공격합니다. 가장 먼저 화해해야 할 상대는 어쩌면 내 안의 목소리인지도 모릅니다.","c":"오늘 나를 향한 혹독한 말을 한 번 멈추고, 친구에게 하듯 나에게 말해 주겠습니다."},{"t":"수행","q":"지붕을 허술하게 이은 집에 비가 새어 들듯, 닦지 않은 마음에는 탐욕이 스며든다. 지붕을 잘 이은 집에 비가 새지 않듯, 잘 닦은 마음에는 탐욕이 스며들지 못한다.","s":"『법구경』 제13~14게, 「쌍품」","m":"마음을 집에 비유한 게송입니다. 평소에 마음을 돌보는 습관이 지붕 역할을 해서, 유혹과 충동이라는 비가 쏟아질 때 나를 지켜 줍니다.","l":"피곤하고 지친 날일수록 충동구매, 과식, 의미 없는 스크롤에 쉽게 빠집니다. 비가 온 뒤에 지붕을 고치기는 어렵습니다. 맑은 날에 해 두는 짧은 명상, 산책, 일기 쓰기가 궂은 날의 나를 지키는 지붕이 됩니다.","c":"오늘 맑은 시간에 마음의 지붕을 한 장 더 얹어 둡니다. 비 오는 날의 나를 위해서."},{"t":"노동","q":"하루 일하지 않으면 하루 먹지 않는다.","s":"백장 회해(百丈懷海), 『오등회원』 권3 등","m":"노년의 백장 스님이 제자들이 숨겨 둔 농기구를 찾지 못하자 그날 끼니를 거르며 한 말입니다. 노동 또한 수행이라는 선불교의 정신을 세운 말씀입니다.","l":"이 말은 남을 다그치는 말이 아니라 스스로에게 하는 다짐입니다. 내 몫의 일을 정성껏 하는 것, 그 자체가 수행이고 자존감의 근원입니다.","c":"오늘 내 몫의 일을 수행처럼 정성껏 하겠습니다.","o":"一日不作 一日不食"},{"t":"일상","q":"불법은 세간에 있으니 세간을 떠나서 깨닫는 것이 아니다. 세간을 떠나 보리를 찾는 것은 토끼의 뿔을 구하는 것과 같다.","s":"『육조단경』 「반야품」, 무상송(無相頌)","m":"깨달음은 산속이나 절에만 있는 것이 아니라 우리가 사는 이 세상 한가운데 있다는 가르침입니다. 세상을 떠나 찾는 깨달음은 토끼 뿔처럼 없는 것입니다.","l":"일상이 번잡해서 수행할 수 없다고 말하지 마세요. 출근길, 회의실, 부엌, 아이 곁이 바로 수행처입니다. 이곳을 떠나서 따로 찾을 곳은 없습니다.","c":"오늘 내 일상의 한가운데서 깨어 있겠습니다. 여기가 곧 도량입니다.","o":"佛法在世間 不離世間覺 離世覓菩提 恰如求兎角"},{"t":"벗","q":"길을 가다가 나보다 낫거나 나와 같은 이를 만나지 못하면, 차라리 굳게 홀로 가라. 어리석은 이와는 벗할 수 없다.","s":"『법구경』 제61게, 「어리석은 이품」","m":"함께 가는 사람이 삶의 방향을 크게 좌우합니다. 나를 끌어내리는 관계에 매달리기보다 홀로 바르게 걷는 편이 낫다는 단호한 가르침입니다.","l":"외로움이 두려워 나를 소모시키는 관계를 붙들고 있을 때가 있습니다. 혼자 있는 시간은 실패가 아니라, 좋은 인연을 알아볼 눈을 기르는 시간이 될 수 있습니다.","c":"오늘 혼자 걷는 길이라 해도, 바르게 걷고 있다면 외롭지 않습니다."},{"t":"본분","q":"남의 일이 아무리 크더라도 자기의 할 일을 소홀히 하지 말라. 자기의 할 일을 잘 알아 그 일에 전념하라.","s":"『법구경』 제166게, 「자기품」","m":"남을 돕는 일도 소중하지만, 그로 인해 내가 반드시 해야 할 일을 놓쳐서는 안 됩니다. 자기 본분을 아는 것이 지혜의 출발입니다.","l":"남의 일에 신경 쓰고, 남의 인생에 조언하느라 정작 내 삶의 숙제를 미루는 경우가 많습니다. 내 건강, 내 공부, 내 가족이라는 본분을 먼저 챙기는 것이 이기심이 아닙니다.","c":"오늘 내가 꼭 해야 할 일 하나를 분명히 알고, 거기에 마음을 모으겠습니다."},{"t":"분노","q":"화내는 사람은 원수가 바라는 일을 스스로 한다. 그는 추해지고, 편히 잠들지 못하며, 이익을 잃고, 명성을 잃으며, 벗들이 멀어진다.","s":"『앙굿따라 니까야』 「화내는 사람 경(Kodhana Sutta)」","m":"원수가 나에게 바라는 일들을 분노가 대신 해 준다는 날카로운 통찰입니다. 화를 내면 나를 미워하는 이가 원하는 대로 되어 버립니다.","l":"나를 화나게 한 사람에게 가장 좋은 복수는 내가 평온하게 잘 지내는 것입니다. 화를 내어 잠을 설치고 건강을 해치면 그것이야말로 상대가 바라는 일입니다.","c":"오늘 화를 내지 않는 것으로, 나 자신을 지키겠습니다."},{"t":"벗","q":"참된 벗에는 네 종류가 있다. 도움을 주는 벗, 즐거울 때나 괴로울 때나 한결같은 벗, 이로운 것을 일러 주는 벗, 연민을 지닌 벗이다.","s":"『디가 니까야』 「시갈로바다 경」(DN 31)","m":"좋은 친구의 네 가지 모습을 구체적으로 알려 주는 가르침입니다. 이런 벗을 알아보고, 나도 그런 벗이 되라는 뜻입니다.","l":"내 친구들 가운데 이런 사람이 있는지 떠올려 보세요. 그리고 나는 누군가에게 이 네 가지 중 어떤 벗인지도 생각해 보세요.","c":"오늘 나는 누군가에게 한결같고 연민 어린 벗이 되겠습니다."},{"t":"평등","q":"큰 구름이 일어나 온 세상에 고루 비를 내리면, 큰 나무와 작은 나무, 큰 풀과 작은 풀이 각자의 크기와 성품에 따라 그 비를 받아 자란다.","s":"『법화경』 「약초유품(藥草喩品)」","m":"부처님의 가르침은 비처럼 모두에게 평등하게 내리지만, 각자의 그릇과 때에 따라 다르게 자란다는 '삼초이목(三草二木)'의 비유입니다.","l":"같은 가르침을 받아도 아이마다, 사람마다 자라는 모습이 다릅니다. 비교하지 말고 각자의 크기대로 자라는 것을 존중해 주세요. 나 자신에게도 그렇게 해 주세요.","c":"오늘 나와 내 곁의 사람이 각자의 속도로 자라는 것을 존중하겠습니다."},{"t":"무상","q":"이 몸이 물거품 같음을 알고, 아지랑이 같은 것임을 깨달은 이는, 마라의 꽃 화살을 꺾고 죽음의 왕이 보지 못하는 곳으로 간다.","s":"『법구경』 제46게, 「꽃품」","m":"물거품과 아지랑이는 실재하는 듯 보이지만 금세 사라집니다. 이 몸과 세상의 덧없음을 깨달으면 헛된 유혹에 덜 흔들리게 됩니다.","l":"영원히 붙들 수 없는 것을 위해 너무 애쓰고 있지는 않나요? 덧없음을 아는 것은 허무가 아니라, 무엇에 마음을 써야 할지 분명해지는 지혜입니다.","c":"오늘 사라질 것에 매이지 않고, 남길 만한 것에 마음을 쓰겠습니다."},{"t":"시작","q":"처음 마음을 낼 때가 곧 바른 깨달음을 이룬 때이다.","s":"『화엄경』 「범행품(梵行品)」 / 의상 「법성게」에도 '初發心時便正覺'으로 실림","m":"깨달음을 향해 처음 마음을 낸 그 순간에 이미 깨달음의 씨앗이 온전히 담겨 있다는 가르침입니다. 시작하는 마음 자체가 소중합니다.","l":"무언가를 처음 시작할 때의 그 설렘과 진심을 기억하세요. 그 첫 마음이 길을 잃지 않게 해 주는 나침반입니다. '초심을 잃지 말라'는 말이 여기서 나왔습니다.","c":"오늘 처음 그 일을 시작하던 날의 마음을 다시 떠올리겠습니다.","o":"初發心時 便成正覺"},{"t":"핵심","q":"모든 악을 짓지 말고, 온갖 선을 받들어 행하며, 스스로 그 마음을 맑히는 것, 이것이 모든 부처님의 가르침이다.","s":"『법구경』 제183게, 「붓다품」 — 과거 일곱 부처님이 공통으로 설하신 '칠불통게(七佛通偈)'","m":"불교의 모든 가르침을 한 줄로 요약한 게송입니다. 악을 멈추고, 선을 행하고, 마음을 맑히는 것. 단순하지만 평생을 다해도 다 이루기 어려운 길입니다.","l":"복잡한 교리를 몰라도 이 세 가지만 기억하면 됩니다. 오늘 해서는 안 될 일 하나를 하지 않고, 해야 할 좋은 일 하나를 하고, 잠깐이라도 마음을 고요히 하는 것
