<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f5efe4">
<title>기독교 오늘의 말씀</title>
<meta name="description" content="날마다 다른 성경 말씀과 말씀 풀이, 설교 묵상, 오늘의 기도를 전하는 기독교 오늘의 말씀 앱.">
<link rel="icon" type="image/png" href="../../img/logo-badge.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5efe4; --paper:#fffcf6; --ink:#2b241e; --ink2:#5a4f45; --muted:#968a7d;
  --line:#e6dccd; --accent:#9a5b2a; --accent-soft:#f1e3d0; --gold:#c08a3e;
  --shadow:0 1px 2px rgba(60,40,20,.06),0 8px 24px rgba(60,40,20,.07);
  --fs:17px;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#191512;--paper:#221d19;--ink:#eee5d8;--ink2:#cbbfb0;--muted:#8f8476;
  --line:#352d26;--accent:#dba56b;--accent-soft:#3a2d22;--gold:#d8a75e;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25)}
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg)}
body{font-family:"Noto Sans KR",system-ui,-apple-system,sans-serif;color:var(--ink);
  font-size:var(--fs);line-height:1.75;-webkit-font-smoothing:antialiased;word-break:keep-all}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.app{max-width:520px;margin:0 auto;min-height:100vh;padding:0 18px calc(96px + env(safe-area-inset-bottom))}

/* header */
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:22px 2px 14px;
  position:sticky;top:0;background:var(--bg);z-index:5}
.date .ymd{font-family:"Gowun Batang",serif;font-size:1.32em;font-weight:700;letter-spacing:-.01em;line-height:1.3}
.date .dow{font-size:.8em;color:var(--muted);margin-top:2px}
.wx{text-align:right;font-size:.74em;color:var(--ink2);line-height:1.45;flex-shrink:0;position:relative}
.wx .now{font-size:1.05em;color:var(--ink);white-space:nowrap}
.wx .now b{font-weight:500}
.wx .city{color:var(--muted);display:inline-flex;align-items:center;gap:2px;padding:2px 0}
.wx a{color:var(--accent);text-decoration:none}
.cityMenu{position:absolute;right:0;top:100%;margin-top:6px;background:var(--paper);border:1px solid var(--line);
  border-radius:12px;box-shadow:var(--shadow);padding:6px;display:none;grid-template-columns:repeat(3,auto);gap:2px;z-index:20;width:max-content}
.cityMenu.open{display:grid}
.cityMenu button{padding:6px 10px;border-radius:8px;font-size:.95em;text-align:center}
.cityMenu button:hover,.cityMenu button.on{background:var(--accent-soft);color:var(--accent)}
.cityMenu .here{grid-column:1/-1}

/* verse card */
.card{background:var(--paper);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow)}
.verse{padding:28px 24px 22px;position:relative;overflow:hidden}
.verse:before{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:linear-gradient(90deg,var(--gold),var(--accent))}
.eyebrow{display:flex;justify-content:space-between;align-items:center;font-size:.74em;color:var(--muted);margin-bottom:16px}
.chip{display:inline-block;padding:2px 10px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-weight:500}
.vtext{font-family:"Gowun Batang",serif;font-size:1.28em;line-height:1.85;letter-spacing:-.005em}
.vref{margin-top:16px;font-size:.86em;color:var(--accent);font-weight:500}
.vref small{color:var(--muted);font-weight:400}
.tools{display:flex;justify-content:space-between;align-items:center;margin-top:18px;padding-top:14px;border-top:1px dashed var(--line)}
.tools .grp{display:flex;gap:6px}
.ibtn{display:inline-flex;align-items:center;gap:6px;font-size:.78em;color:var(--ink2);padding:7px 11px;border-radius:99px;border:1px solid var(--line);background:transparent}
.ibtn:hover{border-color:var(--accent);color:var(--accent)}
.ibtn[disabled]{opacity:.35;pointer-events:none}
.ibtn.on{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
.ibtn svg{width:15px;height:15px}

/* sections */
.sec{margin-top:26px;padding:0 4px}
.sec h3{display:flex;align-items:center;gap:8px;font-size:.8em;font-weight:700;color:var(--accent);letter-spacing:.02em;margin-bottom:8px}
.sec h3 i{width:22px;height:22px;border-radius:7px;background:var(--accent-soft);display:inline-grid;place-items:center;font-style:normal;font-size:.95em}
.sec p{color:var(--ink2);font-size:.95em}
.prayer p{font-family:"Gowun Batang",serif;color:var(--ink);font-size:1em;line-height:1.8;padding:14px 18px;border-left:3px solid var(--gold);background:var(--paper);border-radius:0 14px 14px 0}
.pledge{margin-top:28px;padding:22px 22px 20px;border-radius:18px;background:var(--accent-soft);position:relative}
.pledge .lbl{font-size:.74em;font-weight:700;color:var(--accent);margin-bottom:6px}
.pledge p{font-family:"Gowun Batang",serif;font-size:1.08em;line-height:1.75;color:var(--ink)}
.note{margin:28px 4px 0;font-size:.7em;color:var(--muted);line-height:1.6}
.backbar{display:flex;align-items:center;gap:6px;margin:4px 0 14px;font-size:.85em;color:var(--accent)}
.daytitle{font-size:.82em;color:var(--muted);margin:0 2px 10px}

/* list */
.search{width:100%;padding:12px 16px;border-radius:14px;border:1px solid var(--line);background:var(--paper);color:var(--ink);font:inherit;font-size:.9em;outline:none}
.search:focus{border-color:var(--accent)}
.mhead{font-size:.78em;font-weight:700;color:var(--muted);margin:22px 4px 8px}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;gap:14px;align-items:flex-start;text-align:left;width:100%;padding:14px 16px;border-radius:16px;background:var(--paper);border:1px solid var(--line)}
.item:hover{border-color:var(--accent)}
.item .d{flex-shrink:0;width:44px;text-align:center;line-height:1.2}
.item .d b{display:block;font-family:"Gowun Batang",serif;font-size:1.35em;color:var(--ink)}
.item .d span{font-size:.68em;color:var(--muted)}
.item .t{min-width:0}
.item .r{font-size:.78em;color:var(--accent);font-weight:500}
.item .x{font-size:.86em;color:var(--ink2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-family:"Gowun Batang",serif}
.empty{text-align:center;color:var(--muted);font-size:.88em;padding:48px 10px}
.intro{font-size:.82em;color:var(--muted);margin:2px 4px 14px}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:color-mix(in srgb,var(--paper) 92%,transparent);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabs .in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 0 9px;font-size:.68em;color:var(--muted)}
.tab svg{width:22px;height:22px}
.tab.on{color:var(--accent);font-weight:700}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(10px);opacity:0;
  background:var(--ink);color:var(--bg);font-size:.8em;padding:9px 16px;border-radius:99px;transition:.25s;pointer-events:none;z-index:30}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.fade{animation:fade .35s ease}
.home{display:inline-block;margin-top:14px;font-size:.78em;color:var(--muted);text-decoration:none}
.home:hover{color:var(--accent)}
[hidden]{display:none!important}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div class="app">
  <a class="home" href="../../index.html">← 스토리패커 홈</a>
  <header class="top">
    <div class="date"><div class="ymd" id="ymd"></div><div class="dow" id="dow"></div></div>
    <div class="wx" id="wx">
      <div class="now" id="wxNow">날씨 불러오는 중…</div>
      <button class="city" id="cityBtn" aria-haspopup="true"><span id="cityName">서울</span> ▾</button>
      <div class="cityMenu" id="cityMenu"></div>
    </div>
  </header>
  <main id="view"></main>
</div>

<nav class="tabs"><div class="in">
  <button class="tab" data-tab="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M4 20.5A2.5 2.5 0 0 0 6.5 23H20v-5"/><path d="M12 7v6M9 10h6"/></svg>오늘의 말씀</button>
  <button class="tab" data-tab="past"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="16.5" rx="2.5"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/><path d="M8 14h3M8 17.5h6"/></svg>지난 말씀</button>
  <button class="tab" data-tab="saved"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20.5s-7.5-4.6-7.5-10.2A4.3 4.3 0 0 1 12 7.6a4.3 4.3 0 0 1 7.5 2.7c0 5.6-7.5 10.2-7.5 10.2z"/></svg>마음에 담은 말씀</button>
</div></nav>
<div class="toast" id="toast"></div>

<script>
const DAYS = [["이사야 43:19","보라 내가 새 일을 행하리니 이제 나타낼 것이라 너희가 그것을 알지 못하겠느냐 정녕히 내가 광야에 길과 사막에 강을 내리니","소망","바벨론 포로로 끌려가 모든 것을 잃은 이스라엘에게 주신 약속입니다. 하나님은 과거의 영광을 되풀이하시는 분이 아니라, 길이 없는 광야에 길을 내고 메마른 사막에 강을 내시는 분이라고 선포합니다.","새해를 맞으며 지난해의 실패를 그대로 끌고 오기 쉽습니다. 오늘은 ‘이미 끝났다’고 단정했던 영역 하나를 적어 보고, 그곳에 하나님이 내실 새 길을 기대하며 작은 첫걸음을 정해 보세요.","광야 같은 시간에도 길은 열립니다. 올해, 나는 하나님이 행하실 새 일을 기대하며 걸어가겠습니다.","1792년 영국의 구두 수선공 출신 목사 윌리엄 캐리는 ‘하나님께 위대한 일을 기대하고, 하나님을 위해 위대한 일을 시도하라’는 설교로 근대 선교 운동의 문을 열었습니다. 하나님과 동행하는 사람은 기대와 시도를 함께합니다.","새 일을 행하시는 하나님, 올해 제가 걸어갈 광야에도 길을 내어 주소서. 지난날에 머물지 않고 주님이 여실 새 길을 기대하며 걷게 하소서."],["예레미야 29:11","나 여호와가 말하노라 너희를 향한 나의 생각을 내가 아나니 평안이요 재앙이 아니니라 너희 장래에 소망을 주려 하는 생각이라","소망","포로 생활이 70년이나 계속될 것이라는 말씀 바로 뒤에 이어지는 약속입니다. 당장 상황이 바뀌지 않아도 하나님의 생각은 처음부터 끝까지 ‘평안과 소망’이라는 것이 핵심입니다.","계획이 뜻대로 되지 않을 때 우리는 하나님의 마음까지 의심합니다. 기다림이 길어지는 일이 있다면, 그 시간을 버티는 시간이 아니라 뿌리내리는 시간으로 바라보세요.","나를 향한 하나님의 생각은 재앙이 아니라 평안입니다. 오늘의 기다림 속에서도 내일의 소망을 붙듭니다.","바벨론 포로들은 당장 돌아갈 날만 기다렸지만, 하나님은 그 땅에서 집을 짓고 밭을 일구며 그 성의 평안을 구하라고 하셨습니다(렘 29:5-7). 소망은 현재를 버리고 미래로 도망가는 것이 아니라, 지금 있는 자리에 뿌리를 내리고 성실히 사는 힘입니다. 하나님의 ‘장래’는 오늘의 성실함 위에 세워집니다.","평안의 생각을 품으신 하나님, 기다림의 자리에서도 낙심하지 않고 오늘 맡겨진 자리에 성실히 뿌리내리게 하소서."],["잠언 16:9","사람이 마음으로 자기의 길을 계획할지라도 그 걸음을 인도하는 자는 여호와시니라","동행","계획하는 것 자체를 나무라는 말씀이 아닙니다. 계획은 사람의 몫이지만, 한 걸음 한 걸음의 실제 방향은 하나님께서 이끄신다는 겸손한 고백입니다.","올해 계획표를 세웠다면 그 위에 ‘주님이 고치셔도 좋습니다’라고 적어 보세요. 계획이 틀어지는 순간이 실패가 아니라 인도하심의 신호일 수 있습니다.","나는 계획하되 움켜쥐지 않겠습니다. 내 걸음을 인도하시는 분을 신뢰합니다.","우리는 지도를 다 받은 뒤에 출발하고 싶어 하지만, 하나님은 대개 한 걸음 앞만 비추십니다. 아브라함도 갈 바를 알지 못하고 떠났습니다(히 11:8). 계획을 세우는 것은 성실함이고, 그 계획을 하나님 손에 올려 두는 것은 믿음입니다. 걸음을 인도하시는 분이 계시기에 우리는 지도가 없어도 길을 잃지 않습니다.","제 걸음을 인도하시는 주님, 계획을 세우되 움켜쥐지 않게 하시고 주님이 바꾸시는 길도 기쁘게 따르게 하소서."],["시편 37:5","너의 길을 여호와께 맡기라 저를 의지하면 저가 이루시고","동행","‘맡기다’의 히브리어는 ‘굴리다’라는 뜻으로, 무거운 짐을 굴려서 다른 이에게 넘기는 모습을 그립니다. 악인이 잘되는 것 같아 속상한 이들에게 다윗이 건넨 권면입니다.","혼자 짊어진 걱정 하나를 구체적으로 떠올려 기도로 ‘굴려’ 드리세요. 맡긴다는 것은 손을 놓는 게 아니라, 결과에 대한 집착을 내려놓고 오늘 할 일을 하는 것입니다.","무거운 짐을 주님께 굴려 드립니다. 이루시는 분은 내가 아니라 하나님이십니다.","맡긴다는 것은 아무것도 하지 않는 것이 아니라 결과에 대한 무거운 집착을 내려놓는 것입니다. 농부는 씨를 뿌리고 물을 주지만, 싹을 틔우는 일은 하나님께 맡깁니다. 다윗은 바로 다음 절에서 하나님이 우리의 의를 빛같이, 공의를 정오의 빛같이 드러내신다고 말합니다. 맡긴 사람은 억울함 속에서도 조급하지 않습니다.","신실하신 하나님, 혼자 짊어진 무거운 짐을 주님께 굴려 드립니다. 결과는 주님께 맡기고 오늘 할 일에 충실하게 하소서."],["고린도후서 5:17","그런즉 누구든지 그리스도 안에 있으면 새로운 피조물이라 이전 것은 지나갔으니 보라 새것이 되었도다","은혜","바울은 이 변화를 ‘조금 나아진 사람’이 아니라 ‘새로운 창조’라고 부릅니다. 과거가 나를 정의하지 못하게 하는 복음의 선언입니다.","과거의 실수나 남이 붙인 꼬리표로 스스로를 판단하고 있지는 않나요? 오늘 하루는 ‘나는 새로 지음 받은 사람’이라는 정체성으로 한 가지 다른 선택을 해 보세요.","이전 것은 지나갔습니다. 나는 오늘 새것으로 살아갑니다.","찬송 「나 같은 죄인 살리신」을 쓴 존 뉴턴은 한때 노예 무역선의 선장이었습니다. 폭풍 속에서 하나님을 만난 그는 훗날 목사가 되었고, 노예 무역 폐지 운동을 지지했습니다. 그는 노년에 기억력이 흐려졌지만 두 가지만은 분명히 기억한다고 말했습니다. 자신이 큰 죄인이라는 것, 그리고 그리스도가 큰 구주라는 것입니다.","저를 새롭게 하신 주님, 과거의 실패와 남이 붙인 꼬리표에 묶이지 않게 하시고 새로 지음 받은 사람답게 오늘을 살게 하소서."],["빌립보서 3:13-14","형제들아 나는 아직 잡은 줄로 여기지 아니하고 오직 한 일 즉 뒤에 있는 것은 잊어버리고 앞에 있는 것을 잡으려고 푯대를 향하여 그리스도 예수 안에서 하나님이 위에서 부르신 부름의 상을 위하여 좇아가노라","소망","감옥에 갇힌 노년의 바울이 쓴 고백입니다. 그는 과거의 실패뿐 아니라 과거의 자랑까지 ‘뒤에 있는 것’으로 내려놓고 경주자처럼 앞을 향해 몸을 내밉니다.","지난 영광에 머물거나 지난 상처에 묶여 있는 마음을 점검해 보세요. 올해 내가 향할 ‘푯대’를 한 문장으로 적어 책상 앞에 붙여 두는 것도 좋습니다.","뒤를 붙들지 않고 앞을 향해 달리겠습니다. 나를 부르신 분이 기다리십니다.","경주자는 뒤를 돌아보는 순간 속도를 잃습니다. 바울이 ‘잊어버린다’고 한 것은 기억을 지운다는 뜻이 아니라, 과거가 더 이상 나의 방향을 결정하지 못하게 한다는 뜻입니다. 지난날의 상처도, 지난날의 영광도 오늘의 발목을 잡을 수 있습니다. 푯대를 분명히 할 때 우리는 뒤가 아니라 앞을 보게 됩니다.","부르신 주님, 뒤에 있는 것에 붙들리지 않고 주님이 정하신 푯대를 향해 오늘 한 걸음 더 나아가게 하소서."],["여호수아 1:9","내가 네게 명한 것이 아니냐 마음을 강하게 하고 담대히 하라 두려워 말며 놀라지 말라 네가 어디로 가든지 네 하나님 여호와가 너와 함께 하느니라 하시니라","담대","모세라는 큰 지도자를 잃고 가나안 땅 앞에 선 여호수아에게 주신 말씀입니다. 담대함의 근거는 여호수아의 능력이 아니라 ‘함께하신다’는 약속에 있습니다.","새 직장, 새 학기, 새 역할 앞에서 떨리는 것은 자연스럽습니다. 두려움이 없어지기를 기다리지 말고, 함께하심을 붙들고 오늘 해야 할 한 걸음을 내디뎌 보세요.","어디로 가든지 주님이 함께하십니다. 그러므로 나는 두려움 속에서도 담대히 나아갑니다.","하나님은 여호수아에게 같은 말씀을 세 번이나 반복하십니다(수 1:6, 7, 9). 그만큼 두려움이 컸다는 뜻이고, 하나님이 그 두려움을 아셨다는 뜻입니다. 담대함은 성격이 아니라 약속에서 나옵니다. ‘네가 어디로 가든지’라는 말씀은, 내가 가는 모든 자리가 이미 하나님의 동행 안에 있다는 선언입니다.","함께하시는 하나님, 새로운 자리 앞에서 떨리는 마음을 아시오니 주님의 약속을 붙들고 담대히 한 걸음 내딛게 하소서."],["시편 90:12","우리에게 우리 날 계수함을 가르치사 지혜로운 마음을 얻게 하소서","지혜","성경에서 유일하게 모세의 이름이 붙은 시편입니다. 인생이 짧다는 사실을 아는 것이 허무가 아니라 지혜의 출발점이라고 노래합니다.","‘언젠가’로 미뤄 둔 감사 인사, 화해, 꿈이 있나요? 하루를 선물로 계수하는 사람은 중요한 일을 미루지 않습니다. 오늘 하나만 실행해 보세요.","오늘 하루는 다시 오지 않는 선물입니다. 소중한 것을 소중히 여기며 살겠습니다.","하루를 세는 사람은 하루를 낭비하지 않습니다. 모세는 광야에서 한 세대가 지나가는 것을 지켜보며 인생의 짧음을 깊이 알았습니다. 날을 계수하는 지혜는 조급함이 아니라 분별입니다. 중요한 것과 급한 것을 구별하고, 영원에 잇닿은 일에 시간을 드리는 것입니다.","영원하신 하나님, 제게 주신 하루를 귀하게 세게 하시고 정말 중요한 일에 마음과 시간을 드리는 지혜를 주소서."],["잠언 3:5-6","너는 마음을 다하여 여호와를 의뢰하고 네 명철을 의지하지 말라 너는 범사에 그를 인정하라 그리하면 네 길을 지도하시리라","믿음","‘명철을 의지하지 말라’는 생각을 멈추라는 뜻이 아니라, 내 판단을 최종 기준으로 삼지 말라는 뜻입니다. ‘범사에 인정하라’는 삶의 모든 영역에 하나님을 초대하라는 말입니다.","큰 결정만이 아니라 메일 한 통, 대화 한마디에도 하나님을 인정하는 연습을 해 보세요. 결정을 앞두고 있다면 ‘주님, 이 길이 옳습니까?’ 하고 먼저 묻는 습관을 가져 보세요.","내 생각보다 크신 하나님을 의지합니다. 오늘의 모든 길에 주님을 모셔 들입니다.","‘마음을 다하여’라는 말은 일부만 맡기고 나머지는 내가 쥐고 있는 신앙을 돌아보게 합니다. 우리는 큰 문제는 하나님께 맡기면서도 일상의 작은 결정은 습관처럼 혼자 내립니다. 범사에 하나님을 인정한다는 것은 출근길, 대화, 지출 같은 평범한 순간에도 하나님을 초대하는 것입니다. 그때 길이 곧게 펴집니다.","주님, 제 명철보다 주님을 더 의지하게 하소서. 오늘 작은 결정 하나에도 주님을 먼저 인정하는 사람이 되게 하소서."],["예레미야애가 3:22-23","여호와의 자비와 긍휼이 무궁하시므로 우리가 진멸되지 아니함이니이다 이것이 아침마다 새로우니 주의 성실이 크도소이다","은혜","예루살렘이 무너진 폐허 속에서 쓴 애가의 한가운데에 이 고백이 있습니다. 가장 깊은 슬픔 속에서도 ‘아침마다 새로운’ 하나님의 성실을 발견한 것입니다.","어제의 실패가 오늘 아침까지 따라왔다면 기억하세요. 하나님의 긍휼은 어제 것을 재활용하지 않고 매일 아침 새로 주어집니다. 눈 뜬 아침에 짧게 감사를 고백해 보세요.","주님의 긍휼은 오늘 아침에도 새롭습니다. 나는 새 은혜로 하루를 시작합니다.","예레미야애가는 무너진 도성에서 부른 장송곡입니다. 그런데 그 한가운데, 3장 21절에서 시인은 ‘이것을 내가 마음에 회상한즉 오히려 소망이 있사옴은’이라고 말합니다. 소망은 상황이 바뀌어서가 아니라 기억을 바꾸었을 때 찾아왔습니다. 무엇을 기억하느냐가 오늘의 마음을 결정합니다.","아침마다 새로운 긍휼을 주시는 주님, 어제의 실패보다 주님의 신실하심을 기억하며 오늘을 시작하게 하소서."],["이사야 40:31","오직 여호와를 앙망하는 자는 새 힘을 얻으리니 독수리의 날개치며 올라감 같을 것이요 달음박질하여도 곤비치 아니하겠고 걸어가도 피곤치 아니하리로다","소망","‘앙망하다’는 기대하며 기다린다는 뜻입니다. 독수리는 날갯짓보다 상승기류를 타고 오릅니다. 새 힘은 쥐어짜는 것이 아니라 하나님께로부터 받는 것임을 보여 줍니다.","번아웃은 내 힘으로만 달릴 때 찾아옵니다. 오늘 바쁜 일정 사이에 5분이라도 멈추어 하나님을 바라보는 ‘기다림의 시간’을 떼어 두세요.","내 힘이 다한 곳에서 주님의 새 힘이 시작됩니다. 나는 주님을 바라보며 다시 일어섭니다.","독수리는 폭풍이 올 때 바람을 피하지 않고 그 바람을 타고 더 높이 오른다고 알려져 있습니다. 하나님을 앙망하는 사람에게 역경은 추락의 이유가 아니라 상승의 기류가 될 수 있습니다. 이 구절의 순서도 의미가 있습니다. 날아오름, 달려감, 걸어감. 화려한 순간보다 묵묵히 걷는 날에도 지치지 않게 하시는 것이 더 큰 은혜입니다.","새 힘을 주시는 하나님, 지친 저를 아시오니 주님을 바라보며 다시 일어서게 하시고 평범한 걸음에도 힘을 더하소서."],["시편 118:24","이 날은 여호와의 정하신 것이라 이 날에 우리가 즐거워하고 기뻐하리로다","기쁨","유월절에 부르던 찬양의 일부로, 버린 돌이 머릿돌이 된 구원의 날을 기뻐하는 노래입니다. 오늘이라는 하루 자체가 하나님이 정하신 선물이라는 고백입니다.","특별한 일이 없는 평범한 날일수록 이 말씀을 소리 내어 읽어 보세요. 기쁨은 상황이 아니라 오늘을 주신 분을 기억하는 데서 시작됩니다.","오늘은 하나님이 지으신 날입니다. 나는 이 하루를 기뻐하기로 선택합니다.","이 시편은 예수님이 최후의 만찬 후 제자들과 함께 부르셨을 유월절 찬송(할렐)에 속합니다. 십자가를 앞둔 밤에도 ‘이 날은 여호와가 정하신 날’이라고 노래하셨을 것입니다. 기쁨은 좋은 날에만 허락된 감정이 아니라, 모든 날을 주관하시는 분을 신뢰하는 고백입니다.","오늘을 지으신 하나님, 이 하루를 선물로 받습니다. 특별한 일이 없어도 주님 때문에 기뻐하는 하루가 되게 하소서."],["마태복음 6:33","너희는 먼저 그의 나라와 그의 의를 구하라 그리하면 이 모든 것을 너희에게 더하시리라","믿음","산상수훈에서 먹고 입을 것을 염려하는 사람들에게 주신 말씀입니다. 필요를 무시하라는 것이 아니라 삶의 ‘우선순위’를 바로 세우라는 초대입니다.","오늘 일정표를 보고 하나님 나라에 속한 일—사랑, 정의, 정직—이 어디에 있는지 살펴보세요. ‘먼저’라는 단어는 시간의 순서이자 마음의 순서입니다.","먼저 구할 것을 먼저 구하겠습니다. 나머지는 아버지께서 아십니다.","오스왈드 챔버스의 묵상집 『주님은 나의 최고봉』은 하나님께 나의 가장 좋은 것을 드리는 삶을 이야기합니다. 거룩은 금지 목록을 지키는 소극적인 삶이 아니라, 가장 좋은 것을 하나님께 드리려는 적극적인 사랑입니다.","주님, 제 삶의 우선순위를 바로 세워 주소서. 먼저 구할 것을 먼저 구하며, 필요한 것은 아버지께서 아심을 믿게 하소서."],["신명기 31:8","여호와 그가 너의 앞서 행하시며 너와 함께 하사 너를 떠나지 아니하시며 버리지 아니하시리니 너는 두려워 말라 놀라지 말라","동행","모세가 죽음을 앞두고 백성과 여호수아에게 남긴 유언 같은 말씀입니다. 하나님은 앞서 가시고, 곁에 계시며, 결코 떠나지 않으신다는 세 겹의 약속입니다.","가 본 적 없는 길이 두렵다면, 그 길에 이미 하나님이 먼저 가 계신다는 사실을 기억하세요. 오늘 마주할 낯선 자리를 위해 미리 기도해 보세요.","주님은 나보다 앞서 가시고 나를 떠나지 않으십니다. 나는 혼자가 아닙니다.","‘앞서 행하신다’는 말은 목자가 양 떼 앞에서 길을 살피며 걷는 모습입니다. 우리가 내일 들어갈 자리에 하나님은 이미 오늘 계십니다. 두려움은 대개 아직 오지 않은 일을 미리 상상할 때 커집니다. 그러나 그 미래에도 하나님은 먼저 가 계십니다.","앞서 가시는 주님, 아직 가 보지 않은 길이 두렵지만 그곳에 먼저 계신 주님을 믿고 따라가게 하소서."],["시편 32:8","내가 너의 갈 길을 가르쳐 보이고 너를 주목하여 훈계하리로다","동행","죄를 고백하고 용서받은 다윗에게 하나님이 직접 하시는 말씀입니다. ‘주목하여’는 눈을 떼지 않고 지켜보신다는 뜻으로, 세심한 인도를 약속합니다.","방향을 모를 때 조급하게 결정하기보다 말씀을 읽고 믿음의 선배에게 조언을 구해 보세요. 하나님은 다양한 통로로 길을 가르쳐 주십니다.","주님의 눈이 나를 지키십니다. 나는 가르쳐 주시는 길로 걷겠습니다.","바로 다음 절에서 하나님은 ‘재갈과 굴레로 단속하여야 하는 말이나 노새 같이 되지 말라’고 하십니다. 하나님은 억지로 끌고 가시기보다 눈빛만으로도 알아듣는 관계를 원하십니다. 말씀과 기도로 가까이 머무는 사람은 작은 눈짓에도 방향을 압니다.","저를 주목하시는 하나님, 억지로 끌려가는 사람이 아니라 주님의 눈빛을 알아듣는 가까운 자녀가 되게 하소서."],["잠언 16:3","너의 행사를 여호와께 맡기라 그리하면 너의 경영하는 것이 이루리라","동행","‘행사’는 우리가 하는 모든 일을 가리킵니다. 일을 하나님께 맡기면 생각과 계획까지 견고해진다는 지혜자의 권면입니다.","중요한 업무나 공부를 시작하기 전, 1분이라도 ‘이 일을 주님께 맡깁니다’라고 기도해 보세요. 결과보다 과정을 하나님께 드리는 훈련입니다.","내 일을 주님께 맡깁니다. 주님이 내 계획을 견고하게 하십니다.","‘맡기라’의 원어에는 ‘굴리다’라는 뜻이 있습니다. 시편 37편 5절과 같은 그림입니다. 일을 맡긴다는 것은 일을 대충 한다는 뜻이 아니라, 일의 주인을 바꾸는 것입니다. 내가 주인일 때 일은 나를 짓누르지만, 하나님이 주인이실 때 나는 청지기로 가볍게 성실할 수 있습니다.","주님, 오늘 제가 하는 모든 일의 주인이 되어 주소서. 무거운 부담 대신 맡은 청지기의 기쁨으로 일하게 하소서."],["야고보서 4:14","내일 일을 너희가 알지 못하는도다 너희 생명이 무엇이뇨 너희는 잠깐 보이다가 없어지는 안개니라","겸손","장사 계획을 자신만만하게 세우는 사람들에게 주신 경고입니다. 이어지는 15절은 ‘주의 뜻이면 우리가 살기도 하고 이것이나 저것을 하리라’ 말하라고 가르칩니다.","‘당연히 내일도 있다’는 생각을 잠시 내려놓으면 오늘이 달라 보입니다. 미루던 연락과 고마운 마음을 오늘 표현해 보세요.","내일은 주님 손에 있습니다. 나는 오늘을 성실하게 살겠습니다.","안개는 아침에 짙게 깔리지만 해가 뜨면 금세 사라집니다. 야고보가 인생을 안개에 비유한 것은 허무를 말하려는 것이 아니라 겸손을 가르치려는 것입니다. 내일을 장담하는 사람은 하나님 없이 계획하는 사람입니다. ‘주의 뜻이면’이라는 짧은 말이 우리의 계획을 겸손하게 합니다.","생명의 주인이신 하나님, 내일을 장담하지 않고 주님의 뜻을 구하며 오늘을 성실하고 감사하게 살게 하소서."],["시편 23:1","여호와는 나의 목자시니 내가 부족함이 없으리로다","평안","목동 출신 다윗의 고백입니다. 양은 스스로 길을 찾지 못하고 맹수를 이길 힘도 없지만, 좋은 목자가 있으면 부족함이 없습니다.","‘부족함이 없다’는 모든 것을 가졌다는 뜻이 아니라, 필요한 것을 아시는 목자가 있다는 뜻입니다. 오늘 부족하다고 느끼는 것 대신 이미 받은 것을 세어 보세요.","주님이 나의 목자이시니 나는 부족함이 없습니다.","양은 시력이 나쁘고 길을 잘 잃으며 스스로를 지킬 무기도 없습니다. 그래서 양에게 가장 중요한 것은 무엇을 가졌느냐가 아니라 누가 목자냐입니다. ‘부족함이 없다’는 고백은 소유의 목록이 아니라 관계의 고백입니다. 좋은 목자가 있는 양은 오늘 필요한 것을 이미 가진 셈입니다.","나의 목자 되신 주님, 부족한 것을 세기보다 주님이 나의 목자이심을 기억하게 하시고 그 안에서 만족하게 하소서."],["이사야 41:10","두려워 말라 내가 너와 함께 함이니라 놀라지 말라 나는 네 하나님이 됨이니라 내가 너를 굳세게 하리라 참으로 너를 도와 주리라 참으로 나의 의로운 오른손으로 너를 붙들리라","담대","하나님은 두려워하는 백성에게 ‘함께함, 굳세게 함, 도움, 붙듦’이라는 약속을 연이어 쏟아 부으십니다. ‘오른손’은 능력과 신실함을 상징합니다.","불안이 몰려올 때 이 구절을 천천히 세 번 읽어 보세요. 두려움을 이기는 힘은 상황 분석이 아니라 붙드시는 손을 기억하는 데 있습니다.","하나님의 오른손이 나를 붙드십니다. 나는 두려워하지 않겠습니다.","성경에는 ‘두려워 말라’는 말이 수없이 반복됩니다. 설교자들은 하나님이 두려움을 꾸짖으시기보다 두려워하는 사람을 다독이신다는 점에 주목합니다. 담대함은 두려움이 없는 상태가 아니라, 두려움보다 크신 하나님을 바라보며 한 걸음을 내딛는 것입니다.","두려워 말라 하시는 하나님, 불안이 몰려올 때 주님의 오른손이 저를 붙들고 계심을 기억하게 하소서."],["로마서 8:28","우리가 알거니와 하나님을 사랑하는 자 곧 그 뜻대로 부르심을 입은 자들에게는 모든 것이 합력하여 선을 이루느니라","믿음","모든 일이 다 좋다는 말이 아니라, 좋지 않은 일까지도 하나님의 손에서 ‘합력하여’ 선으로 엮인다는 고백입니다. 여기서 ‘선’은 29절에 따르면 그리스도를 닮아 가는 것입니다.","지금 이해되지 않는 일이 있다면 퍼즐 한 조각으로 바라보세요. 전체 그림은 하나님이 보고 계십니다. 오늘은 그 조각을 원망 대신 기도로 올려 드리세요.","이해되지 않는 일도 주님 손에서 선이 됩니다. 나는 끝까지 신뢰하겠습니다.","‘합력하여’는 여러 재료가 함께 섞여 하나의 요리가 되는 모습과 같습니다. 밀가루만, 소금만 따로 맛보면 쓰고 짜지만, 함께 어우러지면 빵이 됩니다. 요셉의 생애처럼 쓰라린 재료들도 하나님의 손에서 선한 결과로 빚어집니다. 지금 맛보는 쓴맛이 이야기의 끝이 아닙니다.","모든 것을 합력하여 선을 이루시는 하나님, 이해되지 않는 오늘의 일도 주님의 손에 맡기며 끝까지 신뢰하게 하소서."],["히브리서 11:1","믿음은 바라는 것들의 실상이요 보지 못하는 것들의 증거니","믿음","‘실상’은 집문서처럼 아직 들어가 살지 않아도 소유를 보장하는 ‘보증서’라는 뜻을 담고 있습니다. 믿음은 막연한 희망이 아니라 약속에 근거한 확신입니다.","눈에 보이는 결과가 없어 낙심되는 기도 제목이 있나요? 그 약속을 붙들고 오늘도 성실히 사는 것이 믿음의 실상입니다.","보이지 않아도 약속은 실재합니다. 나는 믿음으로 오늘을 삽니다.","히브리서 11장에 등장하는 믿음의 사람들은 대부분 약속의 성취를 직접 보지 못했습니다. 그러나 그들은 그것을 ‘멀리서 보고 환영하며’ 살았습니다. 오늘의 설교자들은 이를 두고, 믿음이란 결과가 보장된 길을 가는 것이 아니라 약속하신 분을 신뢰하며 오늘 한 걸음을 내딛는 것이라고 말합니다.","보이지 않는 것을 믿게 하시는 주님, 아직 결과가 보이지 않는 기도 제목도 주님의 약속 안에서 끝까지 붙들게 하소서."],["시편 121:1-2","내가 산을 향하여 눈을 들리라 나의 도움이 어디서 올꼬 나의 도움이 천지를 지으신 여호와에게서로다","동행","예루살렘으로 올라가던 순례자들이 부르던 ‘성전에 올라가는 노래’입니다. 험한 산길 앞에서 도움을 묻고, 산을 지으신 창조주께 답을 찾습니다.","도움이 필요할 때 사람이나 돈보다 먼저 하나님께 눈을 드는 연습을 해 보세요. 그분은 도움을 주는 이들을 보내 주시기도 합니다.","천지를 지으신 분이 나의 도움이십니다. 나는 오늘도 눈을 들어 주님을 봅니다.","예루살렘으로 가는 순례길의 산에는 도적과 들짐승이 숨어 있었고, 산당의 우상들도 그 산 위에 있었습니다. 순례자는 산을 바라보며 묻습니다. ‘나의 도움이 저 산에서 오는가?’ 그리고 답합니다. 산을 지으신 분에게서 온다고. 우리도 눈앞의 거대한 것들 너머에 계신 창조주를 바라봐야 합니다.","천지를 지으신 하나님, 눈앞의 산 같은 문제보다 그 산을 지으신 주님을 바라보게 하시고 저의 도움이 되어 주소서."],["이사야 30:21","너희가 우편으로 치우치든지 좌편으로 치우치든지 네 뒤에서 말소리가 네 귀에 들려 이르기를 이것이 정로니 너희는 이리로 행하라 할 것이며","동행","애굽을 의지하려던 이스라엘을 향해 하나님은 여전히 은혜를 베풀겠다고 하십니다. 길에서 벗어날 때마다 뒤에서 바른 길을 일러 주시는 선생님 같은 모습입니다.","하루 중 마음이 불편해지는 순간은 하나님의 ‘말소리’일 수 있습니다. 양심의 작은 목소리를 무시하지 말고 잠시 멈춰 들어 보세요.","내가 치우칠 때도 주님은 바른 길을 일러 주십니다. 그 음성에 귀 기울이겠습니다.","하나님의 음성은 앞에서가 아니라 ‘뒤에서’ 들립니다. 선생님이 학생 뒤에서 지켜보다가 길을 벗어나면 조용히 바로잡아 주는 모습입니다. 우리가 바른 길을 걸을 때는 고요하다가, 치우칠 때 말씀하십니다. 마음에 생기는 작은 불편함은 우리를 지키시는 하나님의 사랑일 수 있습니다.","제 뒤에서 바른 길을 일러 주시는 주님, 양심의 작은 음성에도 귀 기울이며 오늘 주님의 길로 행하게 하소서."],["출애굽기 14:14","여호와께서 너희를 위하여 싸우시리니 너희는 가만히 있을지니라","믿음","앞에는 홍해, 뒤에는 애굽 군대가 쫓아오던 절체절명의 순간에 모세가 한 말입니다. ‘가만히 있으라’는 포기가 아니라 하나님이 일하실 자리를 비워 드리라는 뜻입니다.","해결하려고 애쓸수록 더 꼬이는 문제가 있다면, 오늘은 잠시 손을 멈추고 기도로 하나님께 맡겨 보세요. 침묵 속에서 길이 보이기도 합니다.","주님이 나를 위해 싸우십니다. 나는 조급함을 내려놓고 잠잠히 신뢰합니다.","홍해 앞에서 백성은 불평했고, 모세는 ‘가만히 서서 여호와의 구원을 보라’고 했습니다. 그런데 바로 다음 절에서 하나님은 ‘앞으로 나아가라’고 하십니다. 가만히 있음과 나아감은 모순이 아닙니다. 불안한 몸부림을 멈추고 마음은 잠잠히 하되, 하나님이 보여 주시는 길로는 담대히 발을 내딛는 것입니다.","저를 위해 싸우시는 하나님, 조급한 몸부림을 멈추게 하시고 주님이 열어 주시는 길로 믿음의 걸음을 떼게 하소서."],["시편 46:1","하나님은 우리의 피난처시요 힘이시니 환난 중에 만날 큰 도움이시라","평안","땅이 흔들리고 산이 바다에 빠지는 듯한 혼돈 속에서 부른 노래입니다. 마르틴 루터는 이 시편을 바탕으로 찬송 ‘내 주는 강한 성이요’를 지었습니다.","흔들리는 소식과 걱정이 많은 날, 잠시 휴대폰을 내려놓고 이 구절로 기도해 보세요. 피난처는 문제를 없애 주기 전에 먼저 나를 지켜 주는 곳입니다.","하나님은 나의 피난처이십니다. 환난 중에도 나는 그 품에 숨습니다.","피난처는 폭풍이 없는 곳이 아니라 폭풍 속에서도 안전한 곳입니다. 시편 46편은 산이 흔들리고 물이 솟아나는 혼돈을 숨기지 않습니다. 그러나 그 혼돈 한가운데 ‘하나님의 성’을 기쁘게 하는 시내가 흐른다고 노래합니다(4절). 세상이 흔들려도 흔들리지 않는 중심이 있습니다.","저의 피난처 되시는 하나님, 흔들리는 세상 속에서도 주님 안에서 안전함을 누리게 하시고 환난 날에 큰 도움이 되어 주소서."],["미가 6:8","사람아 주께서 선한 것이 무엇임을 네게 보이셨나니 여호와께서 네게 구하시는 것이 오직 공의를 행하며 인자를 사랑하며 겸손히 네 하나님과 함께 행하는 것이 아니냐","거룩","백성이 ‘무슨 제물을 드려야 하나님이 기뻐하실까’ 묻자 예언자는 제물보다 삶을 요구합니다. 공의(바르게 행함), 인자(변함없는 사랑), 겸손(하나님과 동행)의 세 가지입니다.","오늘 하루, 공정하지 못한 자리에서 한 번 바른 편에 서고, 한 사람에게 친절을 베풀고, 겸손히 기도하는 시간을 가져 보세요.","의를 행하고 사랑하며 겸손히 주님과 걷겠습니다.","성경은 에녹에 대해 ‘하나님과 동행하였다’고 짧게 기록합니다. 설교자들은 동행이란 함께 걷는 것이므로, 앞서 달려가지도 뒤처지지도 않고 하나님의 보폭에 맞추는 것이라고 말합니다. 조급함도, 게으름도 동행을 방해합니다.","공의와 인자의 하나님, 오늘 바르게 행하고 긍휼을 사랑하며 겸손히 주님과 함께 걷는 하루가 되게 하소서."],["에베소서 2:10","우리는 그의 만드신 바라 그리스도 예수 안에서 선한 일을 위하여 지으심을 받은 자니 이 일은 하나님이 전에 예비하사 우리로 그 가운데서 행하게 하려 하심이니라","은혜","‘만드신 바’는 헬라어 ‘포이에마’로, 시(poem)라는 단어의 어원입니다. 우리 각자가 하나님의 작품이며, 할 선한 일까지 미리 준비되어 있다는 뜻입니다.","나 자신을 실패작처럼 느끼는 날이 있다면 ‘나는 하나님의 작품’이라고 되뇌어 보세요. 오늘 내 앞에 놓인 일 가운데 하나님이 예비하신 선한 일을 찾아보세요.","나는 하나님의 작품입니다. 예비하신 선한 일을 기쁘게 행하겠습니다.","하나님이 우리를 위해 ‘미리 예비하신’ 선한 일이 있다는 것은 큰 위로입니다. 우리는 선한 일을 억지로 만들어 낼 필요가 없습니다. 오늘 마주치는 사람, 우연처럼 보이는 기회 속에 하나님이 준비해 두신 일이 있습니다. 눈을 뜨고 그것을 발견하며 걸어가는 것이 그리스도인의 하루입니다.","저를 작품으로 지으신 하나님, 오늘 제 앞에 예비하신 선한 일을 알아보는 눈을 주시고 기쁘게 행하게 하소서."],["갈라디아서 6:9","우리가 선을 행하되 낙심하지 말찌니 피곤하지 아니하면 때가 이르매 거두리라","인내","농부의 비유입니다. 씨를 뿌린 날 바로 거두는 농부는 없습니다. 선을 행하는 일에도 반드시 열매 맺는 ‘때’가 있다는 약속입니다.","아무도 알아주지 않는 섬김이나 꾸준한 노력에 지쳐 있다면, 그것이 땅에 심긴 씨앗이라는 사실을 기억하세요. 오늘도 한 번 더 성실히 심어 보세요.","선을 행하다 지치지 않겠습니다. 거둘 때는 반드시 옵니다.","영국의 정치가 윌리엄 윌버포스는 신앙적 회심 뒤 노예 무역 폐지를 위해 수십 년간 의회에서 싸웠습니다. 법안은 거듭 부결되었지만 그는 포기하지 않았고, 1807년 노예 무역 폐지법이 통과되었습니다. 그리고 노예제 자체를 폐지하는 법안이 의회를 통과했다는 소식은 그가 세상을 떠나기 불과 며칠 전에 전해졌습니다.","포기하지 않게 하시는 주님, 아무도 알아주지 않는 수고에 지칠 때 거둘 때가 반드시 온다는 약속으로 다시 힘을 내게 하소서."],["고린도전서 15:58","그러므로 내 사랑하는 형제들아 견고하며 흔들리지 말며 항상 주의 일에 더욱 힘쓰는 자들이 되라 이는 너희 수고가 주 안에서 헛되지 않은 줄을 앎이니라","소망","부활을 길게 설명한 15장의 결론입니다. 죽음이 끝이 아니기에, 이 땅에서의 수고도 결코 사라지지 않는다는 논리입니다.","반복되는 일상과 보이지 않는 수고가 허무하게 느껴질 때, ‘주 안에서 헛되지 않다’는 말씀을 붙드세요. 작은 일도 영원과 연결되어 있습니다.","주 안에서 나의 수고는 헛되지 않습니다. 흔들리지 않고 오늘을 감당하겠습니다.","이 구절의 ‘그러므로’는 앞의 57절, ‘우리에게 승리를 주시는 하나님께 감사하노니’를 가리킵니다. 승리가 이미 주어졌기에 수고할 수 있는 것입니다. 이기기 위해 싸우는 것이 아니라 이긴 자로서 섬기는 것, 그것이 그리스도인이 지치지 않고 견고할 수 있는 이유입니다.","승리를 주신 하나님, 이긴 자로서 흔들리지 않고 주님의 일에 힘쓰게 하시며 저의 수고가 헛되지 않음을 믿게 하소서."],["시편 127:1","여호와께서 집을 세우지 아니하시면 세우는 자의 수고가 헛되며 여호와께서 성을 지키지 아니하시면 파수꾼의 경성함이 허사로다","믿음","솔로몬의 시로 알려진 이 노래는 인간의 수고 자체를 부정하지 않습니다. 다만 그 수고의 열매를 맺게 하시는 분이 하나님이심을 고백합니다.","가정, 일터, 건강 등 내가 쌓고 지키려는 것들 가운데 하나님께 맡기지 않은 영역은 무엇인지 돌아보세요. 오늘은 그것을 위해 기도하세요.","내 집과 내 삶을 세우시는 분은 주님이십니다. 수고하되 주님을 의지하겠습니다.","이 시편 2절은 ‘여호와께서 그 사랑하시는 자에게는 잠을 주시는도다’라고 이어집니다. 일찍 일어나고 늦게 눕는 수고만으로는 집을 세울 수 없다는 고백 끝에 쉼의 선물이 놓여 있습니다. 쉬는 것은 게으름이 아니라 하나님이 일하심을 믿는 신앙의 표현입니다.","제 삶을 세우시는 하나님, 쉼 없이 애쓰는 마음을 내려놓게 하시고 주님이 주시는 단잠과 쉼을 감사로 누리게 하소서."],["요한계시록 21:5","보좌에 앉으신 이가 가라사대 보라 내가 만물을 새롭게 하노라 하시고 또 가라사대 이 말은 신실하고 참되니 기록하라 하시고","소망","성경의 마지막 부분에서 하나님이 직접 하시는 선언입니다. ‘새로운 것들을 만든다’가 아니라 ‘만물을 새롭게 한다’는 표현은, 지금 있는 것을 회복하신다는 소망을 담고 있습니다.","한 달을 마무리하며 새롭게 되기를 바라는 관계나 습관 하나를 적어 보세요. 하나님은 버리시는 분이 아니라 새롭게 하시는 분입니다.","주님은 만물을 새롭게 하십니다. 내 삶도 날마다 새로워집니다.","‘만물을 새롭게’라는 말씀은 하나님이 이 세상을 버리고 다른 세상을 만드시는 것이 아니라, 망가진 것들을 고치신다는 뜻입니다. 우리의 상처, 관계, 일터도 그 회복의 대상입니다. 한 달을 마무리하며 다 이루지 못한 것이 있더라도, 새롭게 하시는 분의 손에 맡길 수 있습니다.","만물을 새롭게 하시는 주님, 이번 달 다 이루지 못한 것들을 주님께 맡기며 제 삶의 망가진 부분도 새롭게 하여 주소서."],["요한복음 3:16","하나님이 세상을 이처럼 사랑하사 독생자를 주셨으니 이는 저를 믿는 자마다 멸망치 않고 영생을 얻게 하려 하심이니라","사랑","‘작은 복음서’라고 불리는 구절입니다. 밤에 찾아온 바리새인 니고데모와의 대화 속에서 예수님은 하나님의 사랑이 ‘세상’ 전체를 향하며, 가장 귀한 것을 내어 주는 사랑이라고 말씀하십니다.","하나님이 사랑하신 ‘세상’에는 내가 불편해하는 사람도 포함됩니다. 오늘 마음이 닫혀 있던 한 사람을 위해 짧게 기도해 보세요.","나는 하나님께 이처럼 사랑받는 사람입니다. 그 사랑으로 오늘을 살겠습니다.","요한복음 3장 16절은 ‘이처럼’이라는 말로 시작합니다. 앞 절에서 예수님은 광야에서 들린 놋뱀 이야기를 꺼내셨습니다(민 21장). 뱀에 물린 사람이 장대에 달린 놋뱀을 바라보기만 하면 살았던 것처럼, 하나님의 사랑은 우리가 갚을 수 있는 무엇이 아니라 바라보고 받아들이는 것입니다.","세상을 이처럼 사랑하신 하나님, 그 사랑을 다시 바라봅니다. 제가 받은 사랑으로 오늘 만나는 이들을 품게 하소서."],["고린도전서 13:4","사랑은 오래 참고 사랑은 온유하며 투기하는 자가 되지 아니하며 사랑은 자랑하지 아니하며 교만하지 아니하며","사랑","분열과 경쟁으로 시끄러웠던 고린도 교회에 보낸 ‘사랑장’입니다. 바울은 사랑을 감정이 아니라 동사, 곧 구체적인 행동으로 정의합니다.","구절의 ‘사랑’ 자리에 내 이름을 넣어 읽어 보세요. 가장 어색하게 느껴지는 부분이 오늘 연습할 사랑입니다.","사랑은 오래 참는 것입니다. 오늘 한 번 더 참고 온유하게 대하겠습니다.","바울이 사랑을 설명하며 맨 처음 꺼낸 단어는 ‘오래 참음’입니다. 사랑의 첫 시험대는 감정이 뜨거운 순간이 아니라 상대가 나를 답답하게 할 때입니다. 사랑장의 사랑은 결혼식에서 낭독되기 전에, 다투고 갈라진 교회에 보낸 처방전이었습니다.","사랑의 주님, 오늘 저를 답답하게 하는 사람 앞에서 오래 참고 온유하게 하시고 자랑과 교만을 내려놓게 하소서."],["고린도전서 13:13","그런즉 믿음, 소망, 사랑, 이 세가지는 항상 있을 것인데 그 중에 제일은 사랑이라","사랑","은사와 지식은 언젠가 그치지만 믿음, 소망, 사랑은 남습니다. 그중 사랑이 제일인 이유는 영원 속에서 믿음은 보는 것으로, 소망은 이루어짐으로 바뀌지만 사랑은 영원히 계속되기 때문입니다.","성과와 능력이 강조되는 세상에서 ‘사랑이 제일’이라는 기준으로 하루를 평가해 보세요. 오늘 나는 얼마나 사랑했는가?","가장 큰 것은 사랑입니다. 오늘 하루의 성적표를 사랑으로 채우겠습니다.","C.S. 루이스는 『네 가지 사랑』에서 애정, 우정, 연인의 사랑, 그리고 하나님의 사랑(아가페)을 구분했습니다. 그는 앞의 세 사랑도 아름답지만 스스로는 쉽게 변질될 수 있고, 하나님의 사랑이 붙들어 줄 때 비로소 온전해진다고 보았습니다. 많은 설교자들이 사랑을 ‘감정’보다 ‘의지와 선택’으로 설명하는 이유가 여기에 있습니다. 좋아하는 마음이 들지 않을 때에도 상대의 유익을 구하기로 결단하는 것, 그것이 성경이 말하는 사랑입니다.","믿음과 소망과 사랑을 주신 하나님, 그중 제일인 사랑으로 오늘 하루를 평가하며 살게 하소서."],["요한일서 4:8","사랑하지 아니하는 자는 하나님을 알지 못하나니 이는 하나님은 사랑이심이라","사랑","‘하나님은 사랑이시다’는 성경이 하나님의 본질을 가장 짧게 정의한 문장입니다. 하나님을 안다는 것은 지식이 아니라 사랑으로 증명된다는 사도 요한의 가르침입니다.","교리를 아는 것과 사랑하는 것 사이에 간격은 없나요? 오늘은 말보다 작은 친절 한 가지로 하나님을 아는 지식을 표현해 보세요.","하나님은 사랑이십니다. 나는 사랑함으로 하나님을 알아 갑니다.","요한은 ‘하나님은 사랑이시다’라고 말할 뿐 ‘사랑이 하나님이다’라고 하지 않습니다. 사랑이 하나님을 정의하는 것이 아니라 하나님이 사랑을 정의하십니다. 그래서 참된 사랑을 배우려면 감정이 아니라 하나님이 어떻게 사랑하셨는지를 보아야 합니다. 바로 다음 절이 그 답입니다. 아들을 보내심입니다.","사랑이신 하나님, 세상이 말하는 사랑이 아니라 주님이 보여 주신 사랑을 배우게 하시고 그 사랑으로 살게 하소서."],["요한일서 4:18","사랑 안에 두려움이 없고 온전한 사랑이 두려움을 내어 쫓나니 두려움에는 형벌이 있음이라 두려워하는 자는 사랑 안에서 온전히 이루지 못하였느니라","사랑","하나님 앞에서 벌받을까 두려워하는 신앙은 아직 사랑을 다 알지 못한 신앙이라는 뜻입니다. 사랑받는다는 확신이 두려움을 몰아냅니다.","실수할까, 버림받을까 두려워서 움츠러드는 영역이 있나요? 그곳에 하나님의 사랑을 먼저 비추어 보세요. 사랑받는 사람은 담대해집니다.","온전한 사랑이 내 두려움을 내어 쫓습니다. 나는 사랑받는 자로 담대히 삽니다.","두려움은 ‘내가 충분히 잘하지 못하면 버림받을 것’이라는 생각에서 자랍니다. 그러나 하나님의 사랑은 우리의 성과에 따라 오르내리지 않습니다. 어린아이가 부모의 사랑을 확신할 때 마음껏 뛰어놀 수 있듯, 사랑을 확신하는 사람은 실수를 두려워하지 않고 새로운 일에 도전할 수 있습니다.","온전한 사랑의 하나님, 버림받을까 하는 두려움을 내어 쫓아 주시고 주님의 사랑 안에서 담대하게 살게 하소서."],["요한일서 4:19","우리가 사랑함은 저가 먼저 우리를 사랑하셨음이라","사랑","사랑의 출발점은 우리가 아니라 하나님입니다. 우리의 사랑은 받은 사랑에 대한 응답이자 메아리입니다.","사랑하기 힘든 날에는 억지로 쥐어짜기보다 먼저 받은 사랑을 떠올려 보세요. 채워진 그릇에서 넘쳐흐르는 것이 사랑입니다.","주님이 먼저 나를 사랑하셨습니다. 나는 그 사랑으로 사랑합니다.","거울은 스스로 빛을 내지 않고 받은 빛을 비춥니다. 우리의 사랑도 그렇습니다. 사랑이 메말랐다고 느낄 때 더 노력하기보다 먼저 빛 앞에 서야 합니다. 받은 사랑을 묵상하는 시간이 결국 사랑할 힘을 만들어 냅니다.","먼저 저를 사랑하신 주님, 사랑이 메마를 때 주님의 사랑 앞에 다시 서게 하시고 받은 사랑을 비추는 사람이 되게 하소서."],["요한복음 13:34","새 계명을 너희에게 주노니 서로 사랑하라 내가 너희를 사랑한 것같이 너희도 서로 사랑하라","사랑","제자들의 발을 씻기신 직후 주신 계명입니다. ‘서로 사랑하라’는 옛 계명에도 있었지만, ‘내가 너희를 사랑한 것같이’라는 기준이 이 계명을 새롭게 합니다.","예수님의 사랑은 발을 씻기는 섬김의 사랑이었습니다. 오늘 가족이나 동료를 위해 아무도 하기 싫어하는 작은 일을 먼저 해 보세요.","주님이 사랑하신 것처럼 나도 서로 사랑하겠습니다.","예수님은 이 새 계명 바로 뒤에 ‘너희가 서로 사랑하면 이로써 모든 사람이 너희가 내 제자인 줄 알리라’고 하셨습니다(35절). 교회를 세상에 증명하는 것은 화려한 건물이나 큰 행사가 아니라 서로 사랑하는 모습입니다. 사랑은 가장 강력한 전도입니다.","주님, 제가 속한 공동체가 서로 사랑함으로 주님의 제자임을 드러내게 하시고 제가 먼저 그 사랑을 실천하게 하소서."],["요한복음 15:13","사람이 친구를 위하여 자기 목숨을 버리면 이보다 더 큰 사랑이 없나니","사랑","십자가를 앞두고 예수님이 제자들을 ‘종’이 아니라 ‘친구’라고 부르시며 하신 말씀입니다. 가장 큰 사랑은 자신을 내어 주는 사랑입니다.","목숨을 버리는 일은 드물지만 시간과 편안함, 자존심을 내려놓는 일은 매일 가능합니다. 오늘 누군가를 위해 내 것을 조금 내어 주세요.","주님은 나를 친구라 부르셨습니다. 나도 누군가의 좋은 친구가 되겠습니다.","예수님은 친구를 위해 목숨을 버리는 사랑을 말씀하신 직후 ‘이제부터는 너희를 종이라 하지 아니하고 친구라 하리라’고 하셨습니다. 종은 주인의 일을 모르지만 친구는 마음을 나눕니다. 우리는 하나님의 일꾼이기 전에 하나님의 친구로 초대받았습니다.","저를 친구라 불러 주신 주님, 주님과 마음을 나누는 친구가 되게 하시고 저도 누군가의 좋은 친구가 되게 하소서."],["로마서 5:8","우리가 아직 죄인 되었을 때에 그리스도께서 우리를 위하여 죽으심으로 하나님께서 우리에게 대한 자기의 사랑을 확증하셨느니라","사랑","하나님의 사랑은 우리가 착해졌을 때가 아니라 ‘아직 죄인일 때’ 주어졌습니다. ‘확증하셨다’는 말은 이 사랑이 감정이 아니라 십자가라는 역사적 사건으로 증명되었다는 뜻입니다.","자격이 있어야 사랑받는다는 생각이 나를 지치게 하지 않나요? 오늘은 조건 없이 사랑받는 자로서, 조건 없이 한 사람을 대해 보세요.","나의 가장 못난 순간에도 주님은 나를 사랑하셨습니다.","‘우리가 아직 죄인 되었을 때’라는 말 앞에는 6절의 ‘연약할 때’, 10절의 ‘원수 되었을 때’가 함께 있습니다. 연약하고, 죄인이고, 원수였던 우리를 하나님이 먼저 찾아오셨습니다. 사람의 사랑은 조건을 따지지만 하나님의 사랑은 조건이 갖추어지기 전에 시작됩니다.","조건 없이 저를 사랑하신 하나님, 그 사랑에 감사하며 저도 자격을 따지지 않고 이웃을 사랑하게 하소서."],["로마서 8:38-39","내가 확신하노니 사망이나 생명이나 천사들이나 권세자들이나 현재 일이나 장래 일이나 능력이나 높음이나 깊음이나 다른 아무 피조물이라도 우리를 우리 주 그리스도 예수 안에 있는 하나님의 사랑에서 끊을 수 없으리라","사랑","바울은 상상할 수 있는 모든 위협을 하나하나 열거한 뒤, 그 어떤 것도 하나님의 사랑을 끊을 수 없다고 선언합니다. 로마서 8장의 절정입니다.","지금 나를 위협하는 ‘현재 일’과 걱정되는 ‘장래 일’을 구절에 넣어 읽어 보세요. 그것들도 하나님의 사랑을 끊지 못합니다.","무엇도 나를 하나님의 사랑에서 끊을 수 없습니다.","바울이 이 고백을 할 때 그는 이미 매 맞고, 파선하고, 굶주리는 일을 겪은 사람이었습니다(고후 11장). 그러니 이 말은 고난을 모르는 사람의 낙관이 아니라 모든 것을 겪어 본 사람의 확신입니다. 세상의 어떤 것도 우리를 하나님의 사랑에서 떼어 놓을 수 없습니다.","끊을 수 없는 사랑으로 붙드시는 하나님, 어떤 상황에서도 그 사랑을 의심하지 않게 하시고 평안히 주님 안에 거하게 하소서."],["로마서 13:10","사랑은 이웃에게 악을 행치 아니하나니 그러므로 사랑은 율법의 완성이니라","사랑","바울은 ‘간음하지 말라, 살인하지 말라, 도둑질하지 말라’ 같은 계명이 결국 ‘네 이웃을 네 몸과 같이 사랑하라’는 한 문장으로 요약된다고 말합니다.","사랑은 거창한 선행이기 전에 남을 해치지 않는 것에서 시작합니다. 오늘 나의 말과 댓글, 운전 습관이 누군가에게 해가 되지는 않았는지 돌아보세요.","이웃을 해치지 않고 사랑하는 것, 그것이 오늘 나의 순종입니다.","율법은 수백 가지 조항으로 이루어져 있지만, 바울은 그 모든 것을 ‘사랑’ 한 단어로 묶습니다. 규칙은 최소한을 요구하지만 사랑은 최선을 찾습니다. ‘해치지 않는 것’에서 시작해 ‘살리는 것’으로 나아갈 때 율법은 완성됩니다.","율법을 완성하신 주님, 해치지 않는 것을 넘어 이웃을 살리는 사랑을 실천하게 하소서."],["로마서 12:10","형제를 사랑하여 서로 우애하고 존경하기를 서로 먼저 하며","사랑","‘우애’는 가족 사이의 따뜻한 애정을 뜻하는 단어입니다. ‘존경하기를 먼저 하라’는 말은 상대를 높이는 일에서 경쟁하라는 재치 있는 권면입니다.","오늘 만나는 사람에게 먼저 인사하고, 먼저 칭찬하고, 먼저 감사를 표현해 보세요. 존중은 받기 전에 주는 것입니다.","오늘 나는 먼저 존중하고 먼저 사랑하겠습니다.","‘존경하기를 서로 먼저 하라’는 말은 존중의 경쟁을 하라는 뜻입니다. 대부분의 갈등은 ‘나를 먼저 존중해 달라’는 요구에서 시작됩니다. 그런데 먼저 존중을 건네는 사람이 관계의 온도를 바꿉니다. 존중은 받기 위해 기다리는 것이 아니라 먼저 주는 것입니다.","주님, 오늘 제가 먼저 인사하고 먼저 칭찬하고 먼저 존중하는 사람이 되게 하소서."],["갈라디아서 5:13","형제들아 너희가 자유를 위하여 부르심을 입었으나 그러나 그 자유로 육체의 기회를 삼지 말고 오직 사랑으로 서로 종노릇하라","사랑","율법에서 자유롭게 된 성도들에게 바울은 자유의 목적을 일러 줍니다. 자유는 내 마음대로 하는 권리가 아니라 사랑으로 섬길 수 있는 능력입니다.","‘내 권리’를 주장하고 싶은 순간이 오늘 있었나요? 그 자유를 사랑하는 데 써 보세요. 섬김을 선택할 수 있는 것이 진짜 자유입니다.","주신 자유로 사랑하고 섬기겠습니다.","바울은 자유를 ‘종노릇하는 자유’라고 부릅니다. 역설처럼 들리지만, 진짜 자유는 무엇이든 할 수 있는 상태가 아니라 옳은 것을 선택할 수 있는 상태입니다. 자기만을 위해 사는 사람은 결국 자기 욕망의 종이 됩니다. 사랑으로 섬길 때 우리는 오히려 가장 자유롭습니다.","자유를 주신 주님, 그 자유를 제 욕심이 아니라 사랑으로 섬기는 데 쓰게 하소서."],["베드로전서 4:8","무엇보다도 열심으로 서로 사랑할찌니 사랑은 허다한 죄를 덮느니라","사랑","박해 속에 흩어진 성도들에게 ‘무엇보다도’ 사랑하라고 권합니다. ‘덮는다’는 죄를 숨긴다는 뜻이 아니라, 허물을 들추지 않고 용납한다는 뜻입니다.","가까운 사람의 반복되는 실수를 오늘은 지적 대신 덮어 주는 사랑으로 대해 보세요. 사랑은 기억력이 짧습니다.","사랑으로 허물을 덮어 주는 사람이 되겠습니다.","베드로는 바로 앞 절에서 ‘만물의 마지막이 가까웠으니’라고 말합니다. 시간이 많지 않다고 느낄 때 우리가 가장 먼저 해야 할 일이 ‘서로 사랑하는 것’이라는 뜻입니다. 인생의 마지막에 사람들이 후회하는 것은 일을 덜 한 것이 아니라 사랑을 덜 표현한 것이라고 합니다.","주님, 시간이 넉넉하지 않음을 기억하며 미루지 않고 사랑을 표현하게 하시고 허물을 덮어 주는 넉넉함을 주소서."],["마태복음 22:37-39","예수께서 가라사대 네 마음을 다하고 목숨을 다하고 뜻을 다하여 주 너의 하나님을 사랑하라 하셨으니 이것이 크고 첫째 되는 계명이요 둘째도 그와 같으니 네 이웃을 네 몸과 같이 사랑하라 하셨으니","사랑","어느 계명이 가장 크냐는 율법사의 시험에 예수님은 하나님 사랑과 이웃 사랑을 하나로 묶어 답하십니다. 십자가의 세로축과 가로축과 같습니다.","하나님을 사랑하는 마음이 이웃을 대하는 태도로 드러나고 있나요? 오늘 예배와 일상이 분리되지 않도록 한 가지를 실천해 보세요.","온 마음으로 하나님을 사랑하고, 내 몸처럼 이웃을 사랑하겠습니다.","예수님은 하나님 사랑을 ‘마음, 목숨, 뜻’ 곧 감정과 생명과 생각 전체로 하라고 하십니다. 신앙은 마음의 감동만도, 머리의 지식만도 아닙니다. 그리고 그 사랑은 반드시 이웃에게로 흘러갑니다. 하나님을 향한 사랑과 이웃을 향한 사랑은 한 동전의 양면입니다.","온 마음과 생각으로 주님을 사랑하게 하시고, 그 사랑이 제 곁의 이웃에게 흘러가게 하소서."],["마태복음 5:44","나는 너희에게 이르노니 너희 원수를 사랑하며 너희를 핍박하는 자를 위하여 기도하라","사랑","‘이웃은 사랑하고 원수는 미워하라’는 당시의 통념을 예수님은 뒤집으십니다. 원수 사랑은 감정보다 먼저 ‘기도’라는 행동으로 시작됩니다.","나를 힘들게 하는 사람을 당장 좋아할 수는 없어도, 그를 위해 한 문장 기도할 수는 있습니다. 기도는 내 마음을 먼저 바꿉니다.","미워하는 대신 기도하겠습니다. 주님이 내 마음을 넓혀 주십니다.","1948년 여수·순천 사건 때 손양원 목사는 두 아들을 잃었습니다. 그런데 그는 아들들을 죽음에 이르게 한 청년이 처형될 위기에 처하자 구명에 나섰고, 마침내 그를 양아들로 삼았습니다. 한국 교회는 그를 ‘사랑의 원자탄’이라 부릅니다. 그의 용서는 감정이 아니라, 하나님의 사랑에 붙들린 사람의 결단이었습니다.","원수를 사랑하라 하신 주님, 저를 힘들게 하는 사람을 위해 기도할 힘을 주시고 미움 대신 긍휼을 선택하게 하소서."],["누가복음 6:31","남에게 대접을 받고자 하는 대로 너희도 남을 대접하라","사랑","흔히 ‘황금률’이라고 불리는 말씀입니다. ‘하지 말라’는 소극적 윤리가 아니라 ‘먼저 하라’는 적극적 사랑입니다.","오늘 내가 받고 싶은 대우—경청, 인정, 배려—를 누군가에게 먼저 건네 보세요. 메신저 답장 하나에도 황금률을 적용할 수 있습니다.","내가 받고 싶은 사랑을 먼저 건네겠습니다.","황금률은 다른 문화권에도 비슷한 가르침이 있지만, 대부분 ‘네가 원치 않는 일을 남에게 하지 말라’는 소극적 형태입니다. 예수님은 이것을 ‘네가 받고 싶은 대로 먼저 하라’는 적극적 형태로 말씀하셨습니다. 피해를 주지 않는 것으로 만족하지 말고 먼저 선을 행하라는 초대입니다.","주님, 제가 받고 싶은 친절과 존중을 오늘 누군가에게 먼저 건네는 사람이 되게 하소서."],["골로새서 3:14","이 모든 것 위에 사랑을 더하라 이는 온전하게 매는 띠니라","사랑","긍휼, 자비, 겸손, 온유, 오래 참음이라는 옷을 입으라고 한 뒤, 그 모든 것을 하나로 묶는 ‘띠’로 사랑을 더하라고 합니다. 사랑이 없으면 덕목들이 흩어집니다.","오늘 나의 친절과 성실이 사랑에서 나온 것인지, 평판을 위한 것인지 살펴보세요. 사랑이 동기가 될 때 모든 덕이 아름답게 엮입니다.","모든 일 위에 사랑을 더하겠습니다.","옷을 여러 겹 입어도 띠로 묶지 않으면 흘러내립니다. 긍휼, 겸손, 온유가 아무리 좋아도 사랑이 동기가 되지 않으면 오래가지 못합니다. 친절이 피곤해지고 섬김이 생색이 되는 순간, 우리는 띠를 다시 매어야 합니다.","주님, 제 모든 선한 행동 위에 사랑의 띠를 매어 주소서. 생색이 아니라 사랑으로 섬기게 하소서."],["에베소서 4:2","모든 겸손과 온유로 하고 오래 참음으로 사랑 가운데서 서로 용납하고","사랑","‘용납하다’는 상대의 약점과 다름을 견디며 품는다는 뜻입니다. 교회의 하나 됨은 똑같아지는 것이 아니라 서로를 품는 데서 이루어집니다.","나와 성향이 다른 사람 때문에 답답했다면, 오늘은 그 다름을 고쳐야 할 문제가 아니라 품어야 할 선물로 바라보세요.","겸손과 온유로 서로를 품겠습니다.","‘용납하라’는 서로 같아지라는 말이 아닙니다. 교회는 성격도 배경도 다른 사람들이 모인 곳이고, 바울은 그 다름을 없애라고 하지 않고 견디며 품으라고 합니다. 모난 돌들이 서로 부딪히며 둥글어지듯, 우리는 서로를 통해 다듬어집니다.","주님, 저와 다른 사람을 고치려 하기보다 품게 하시고 그 다름을 통해 저도 다듬어지게 하소서."],["에베소서 5:2","그리스도께서 너희를 사랑하신 것같이 너희도 사랑 가운데서 행하라 그는 우리를 위하여 자신을 버리사 향기로운 제물과 생축으로 하나님께 드리셨느니라","사랑","‘사랑 가운데서 행하라’는 사랑을 삶의 걸음걸이로 삼으라는 말입니다. 예수님의 자기희생은 하나님께 ‘향기로운 제물’이 되었습니다.","나의 하루가 하나님께 향기로 올라가려면 무엇이 필요할까요? 오늘 하나의 수고를 사랑의 제물로 드린다는 마음으로 해 보세요.","내 하루가 사랑의 향기가 되게 하소서.","구약 제사에서 ‘향기로운 냄새’는 하나님이 기쁘게 받으셨다는 표현입니다. 예수님의 희생이 그러했고, 바울은 우리의 삶도 그렇게 될 수 있다고 말합니다(고후 2:15). 평범한 하루의 섬김도 사랑으로 드려질 때 하나님께 향기가 됩니다.","주님, 오늘 저의 작은 섬김과 수고가 사랑으로 드려져 주님께 향기로운 예물이 되게 하소서."],["아가 8:7","이 사랑은 많은 물이 끄지 못하겠고 홍수라도 엄몰하지 못하나니 사람이 그 온 가산을 다 주고 사랑과 바꾸려 할지라도 오히려 멸시를 받으리라","사랑","아가서는 신랑과 신부의 사랑 노래이며, 오래전부터 하나님과 백성, 그리스도와 교회의 사랑을 비추는 노래로도 읽혀 왔습니다. 참된 사랑은 돈으로 살 수 없습니다.","소중한 사람과의 관계를 돈과 시간의 계산으로 대하고 있지는 않나요? 오늘은 계산 없이 마음을 표현해 보세요.","어떤 홍수도 끄지 못하는 사랑이 나를 붙들고 있습니다.","아가서는 성경에서 하나님의 이름이 거의 등장하지 않는 책입니다. 그런데도 성경에 들어 있다는 것은 사람 사이의 진실한 사랑 자체가 하나님이 주신 선물이라는 뜻입니다. 돈으로 살 수 없고 물로도 끌 수 없는 사랑, 그것은 결국 하나님의 사랑을 닮은 사랑입니다.","사랑을 선물로 주신 하나님, 제게 주신 소중한 관계들을 계산하지 않고 진실하게 사랑하게 하소서."],["잠언 10:12","미움은 다툼을 일으켜도 사랑은 모든 허물을 가리우느니라","사랑","미움은 작은 불씨를 큰 다툼으로 키우지만, 사랑은 허물을 들추지 않고 덮어 관계를 지킵니다. 베드로도 이 잠언을 인용했습니다.","갈등 상황에서 ‘누가 옳은가’보다 ‘무엇이 관계를 살리는가’를 먼저 물어 보세요. 오늘 하나의 다툼을 사랑으로 멈추어 보세요.","다툼 대신 사랑을 선택하겠습니다.","미움은 지나간 일을 자꾸 꺼내어 다시 불을 붙이고, 사랑은 지나간 일을 덮어 불을 끕니다. 덮는다는 것은 잘못을 모른 척하는 것이 아니라, 그 잘못이 관계 전체를 삼키지 않도록 지키는 것입니다. 관계를 지키는 것은 정답이 아니라 사랑입니다.","주님, 지나간 허물을 자꾸 들추는 대신 사랑으로 덮어 관계를 지키는 사람이 되게 하소서."],["잠언 17:17","친구는 사랑이 끊이지 아니하고 형제는 위급한 때까지 위하여 났느니라","사랑","좋은 친구는 형편이 좋을 때만이 아니라 ‘항상’ 사랑하는 사람입니다. 형제는 어려운 때를 함께하라고 주어진 존재라는 지혜입니다.","힘든 시간을 보내고 있는 친구가 떠오르나요? 오늘 안부 메시지 하나를 보내 보세요. 위급한 때의 작은 연락은 큰 위로가 됩니다.","나는 어려울 때 곁에 있어 주는 친구가 되겠습니다.","좋은 날에 친구는 많지만 어려운 날에 남는 친구는 적습니다. 잠언은 그 차이를 ‘사랑이 끊이지 아니하는 것’으로 설명합니다. 예수님은 우리가 가장 위급할 때 떠나지 않으신 친구이십니다. 그 사랑을 받은 우리도 누군가의 어려운 날에 곁에 남아 줄 수 있습니다.","변함없는 친구 되신 주님, 어려움을 겪는 이웃을 외면하지 않고 그 곁에 머물러 주는 사람이 되게 하소서."],["스바냐 3:17","너의 하나님 여호와가 너의 가운데 계시니 그는 구원을 베푸실 전능자시라 그가 너로 인하여 기쁨을 이기지 못하시며 너를 잠잠히 사랑하시며 너로 인하여 즐거이 부르며 기뻐하시리라 하리라","사랑","심판의 경고로 가득한 스바냐서는 이처럼 놀라운 사랑의 장면으로 끝납니다. 하나님이 우리 때문에 기뻐 노래하신다는 표현은 성경에서도 드문 따뜻함입니다.","내가 하나님께 짐이나 실망이라고 느껴질 때, 그분이 나로 인해 노래하신다는 이 말씀을 기억하세요.","하나님은 나로 인해 기뻐하십니다. 나는 사랑받는 자녀입니다.","‘잠잠히 사랑하시며’라는 표현은 엄마가 잠든 아기를 바라보며 아무 말 없이 미소 짓는 모습을 떠올리게 합니다. 그리고 다음 구절은 하나님이 노래하신다고 말합니다. 하나님은 우리를 위해 침묵하기도 하시고 노래하기도 하십니다. 우리는 하나님의 기쁨입니다.","저로 인해 기뻐하시는 하나님, 제가 주님께 짐이 아니라 기쁨임을 믿게 하시고 그 사랑 안에서 쉬게 하소서."],["예레미야 31:3","나 여호와가 옛적에 이스라엘에게 나타나 이르기를 내가 무궁한 사랑으로 너를 사랑하는 고로 인자함으로 너를 이끌었다 하였노라","사랑","‘무궁한 사랑’은 끝이 없는 사랑, ‘인자함’은 언약을 끝까지 지키는 신실한 사랑을 뜻합니다. 눈물의 선지자 예레미야가 전한 위로의 약속입니다.","사랑이 식거나 변할까 불안하다면, 영원하신 하나님의 사랑에 마음의 닻을 내려 보세요. 사람의 사랑은 그 위에서 더 건강해집니다.","나는 영원한 사랑으로 사랑받고 있습니다.","하나님은 ‘무궁한 사랑으로’ 사랑하신다고 말씀하시며 이스라엘의 회복을 약속하십니다. 그런데 이 약속은 백성이 가장 실패했을 때 주어졌습니다. 하나님의 사랑은 우리의 성공에 대한 보상이 아니라 우리의 실패를 넘어서는 신실함입니다.","영원한 사랑으로 저를 이끄시는 하나님, 실패한 날에도 그 사랑을 의심하지 않게 하소서."],["이사야 49:15","여인이 어찌 그 젖먹는 자식을 잊겠으며 자기 태에서 난 아들을 긍휼히 여기지 않겠느냐 그들은 혹시 잊을찌라도 나는 너를 잊지 아니할 것이라","사랑","‘하나님이 나를 버리셨다’고 탄식하는 시온에게 주신 응답입니다. 가장 강한 사랑인 어머니의 사랑보다 더 깊은 하나님의 사랑을 말합니다.","잊힌 것 같은 외로움을 느낄 때, 다음 절의 말씀처럼 하나님이 내 이름을 손바닥에 새기셨다는 사실을 떠올려 보세요.","주님은 결코 나를 잊지 않으십니다.","헨리 나우웬은 렘브란트의 그림 「탕자의 귀향」 앞에서 여러 날을 머물며 묵상했고, 그 경험을 같은 제목의 책으로 남겼습니다. 그는 우리가 때로는 집 나간 작은아들이고 때로는 불평하는 큰아들이지만, 결국 우리의 부르심은 두 아들을 모두 품는 ‘아버지처럼 되는 것’이라고 말했습니다. 사랑받은 사람은 사랑하는 사람이 되도록 부름받았습니다.","저를 잊지 않으시는 하나님, 외롭고 잊힌 것 같은 날에도 주님의 손바닥에 새겨진 제 이름을 기억하게 하소서."],["요한일서 3:18","자녀들아 우리가 말과 혀로만 사랑하지 말고 오직 행함과 진실함으로 하자","사랑","사도 요한은 바로 앞에서 형제의 궁핍을 보고도 마음을 닫는 사람을 이야기합니다. 사랑은 말이 아니라 행동과 진실로 증명됩니다.","‘언제 밥 한번 먹자’는 말을 실제 약속으로 바꿔 보세요. 오늘 사랑을 한 가지 구체적인 행동으로 옮겨 보세요.","말뿐인 사랑이 아니라 행함과 진실로 사랑하겠습니다.","많은 목회자들은 오늘날 사랑을 ‘시간’이라는 말로 번역합니다. 모두가 바쁜 시대에 가장 귀한 것이 시간이기에, 누군가에게 시간을 내어 주는 것이 가장 정직한 사랑의 표현이라는 것입니다. 하나님은 우리를 위해 영원을 내어 주셨습니다. 우리는 오늘 한 사람에게 온전한 30분을 내어 줄 수 있습니다.","말과 혀로만이 아니라 행함과 진실로 사랑하게 하소서. 오늘 사랑을 한 가지 구체적인 행동으로 옮기게 하소서."],["고린도전서 16:14","너희 모든 일을 사랑으로 행하라","사랑","편지의 끝인사에서 바울이 남긴 짧고 강력한 권면입니다. 거창한 일만이 아니라 ‘모든 일’이 사랑으로 행해져야 합니다.","설거지, 보고서, 운전, 대화—오늘 하는 평범한 일 하나하나에 ‘사랑으로’라는 말을 붙여 보세요. 일의 의미가 달라집니다.","오늘 나의 모든 일을 사랑으로 하겠습니다.","마더 테레사의 말로 널리 알려진 한 문장이 있습니다. 우리 모두가 위대한 일을 할 수는 없지만, 작은 일을 큰 사랑으로 할 수는 있다는 것입니다. 설교자들은 섬김의 크기보다 그 안에 담긴 사랑의 크기를 보라고 말합니다. 하나님 나라는 작은 친절들로 세워집니다.","주님, 오늘 제가 하는 평범한 모든 일에 사랑을 담게 하소서."],["요한일서 4:11","사랑하는 자들아 하나님이 이같이 우리를 사랑하셨은즉 우리도 서로 사랑하는 것이 마땅하도다","사랑","4년에 한 번 오는 날에 만나는 말씀입니다. 하나님의 사랑을 받은 사람에게 서로 사랑하는 것은 선택이 아니라 ‘마땅한’ 응답이라고 요한은 말합니다.","드물게 찾아온 이 하루를 특별하게, 평소 표현하지 못한 사랑을 전하는 날로 삼아 보세요.","이렇게 사랑받았으니 나도 마땅히 사랑하겠습니다.","‘마땅하도다’라는 말은 빚을 갚는 것처럼 당연하다는 뜻입니다. 그런데 이 빚은 하나님께 직접 갚는 것이 아니라 서로에게 갚는 빚입니다. 하나님은 우리가 받은 사랑을 이웃에게 흘려보내기를 원하십니다. 4년에 한 번 오는 오늘을 그 빚을 갚는 날로 삼아 보세요.","이토록 사랑하신 하나님, 받은 사랑을 서로 사랑함으로 갚게 하시고 이 특별한 하루를 사랑으로 채우게 하소서."],["히브리서 11:6","믿음이 없이는 기쁘시게 못하나니 하나님께 나아가는 자는 반드시 그가 계신 것과 또한 그가 자기를 찾는 자들에게 상 주시는 이심을 믿어야 할찌니라","믿음","믿음의 영웅들을 소개하는 ‘믿음장’의 핵심 구절입니다. 믿음은 하나님이 ‘계신다’는 믿음과, 그분이 ‘찾는 자에게 응답하신다’는 신뢰 두 가지로 이루어집니다.","하나님을 찾는 일이 막연하게 느껴진다면 오늘 정해진 시간에 성경 한 장을 읽어 보세요. 찾는 자에게 하나님은 자신을 보여 주십니다.","하나님은 살아 계시고 찾는 자에게 응답하십니다. 오늘 주님을 찾겠습니다.","믿음은 하나님을 ‘찾는 것’과 연결되어 있습니다. 찾는 사람은 이미 무언가가 있다고 믿는 사람입니다. 잃어버린 동전을 찾는 여인이 등불을 켜고 집 안을 쓸듯이(눅 15:8), 믿음은 수동적인 생각이 아니라 하나님을 향해 움직이는 행동입니다. 하나님은 찾는 자에게 상으로 자신을 주십니다.","찾는 자에게 상 주시는 하나님, 오늘 제가 주님을 부지런히 찾게 하시고 주님을 만나는 기쁨을 누리게 하소서."],["로마서 10:9","네가 만일 네 입으로 예수를 주로 시인하며 또 하나님께서 그를 죽은 자 가운데서 살리신 것을 네 마음에 믿으면 구원을 얻으리니","믿음","구원은 마음의 믿음과 입의 고백이 함께하는 것이라고 바울은 말합니다. ‘예수는 주’라는 고백은 로마 황제를 주로 섬기던 시대에 목숨을 건 선언이었습니다.","내 삶의 ‘주인’ 자리에 지금 무엇이 앉아 있는지 돌아보세요. 오늘 하루 한 번, 입으로 ‘예수님이 나의 주인이십니다’라고 고백해 보세요.","예수님은 나의 주님이십니다. 나는 마음으로 믿고 입으로 고백합니다.","바울은 믿음을 ‘마음’과 ‘입’ 두 곳에 둡니다. 마음으로만 믿고 입으로 고백하지 않으면 믿음은 숨겨지고, 입으로만 고백하고 마음으로 믿지 않으면 믿음은 공허해집니다. 고백은 믿음을 세상에 드러내는 문입니다. 우리가 무엇을 주라고 부르느냐가 우리가 누구인지를 말해 줍니다.","주님, 마음으로 믿고 입으로 고백합니다. 예수님이 저의 주인이심을 오늘 삶으로도 고백하게 하소서."],["에베소서 2:8","너희가 그 은혜를 인하여 믿음으로 말미암아 구원을 얻었나니 이것이 너희에게서 난 것이 아니요 하나님의 선물이라","은혜","구원은 노력의 대가가 아니라 선물입니다. 바로 다음 절은 ‘행위에서 난 것이 아니니 이는 누구든지 자랑치 못하게 함이니라’고 말합니다.","인정받기 위해 지나치게 애쓰고 있다면, 이미 값없이 받은 선물을 떠올려 보세요. 선물을 받은 사람은 증명하려 하지 않고 감사합니다.","나는 은혜로 구원받았습니다. 증명 대신 감사로 살겠습니다.","선물은 받는 사람이 값을 치르면 더 이상 선물이 아닙니다. 구원이 선물이라는 것은 우리가 그 값을 보탤 수 없다는 뜻입니다. 그래서 구원받은 사람에게 남는 것은 자랑이 아니라 감사입니다. 이어지는 10절은 그 감사가 선한 일로 흘러나온다고 말합니다.","은혜로 구원하신 하나님, 이 선물을 감사로 받습니다. 증명하려 애쓰는 대신 감사로 응답하며 살게 하소서."],["마가복음 9:23","예수께서 이르시되 할 수 있거든이 무슨 말이냐 믿는 자에게는 능치 못할 일이 없느니라 하시니","믿음","귀신 들린 아들을 둔 아버지가 ‘하실 수 있거든 도와 주소서’ 하자 예수님이 하신 말씀입니다. 아버지는 곧 ‘내가 믿나이다 나의 믿음 없는 것을 도와 주소서’라고 울며 고백합니다.","완벽한 믿음이 아니어도 괜찮습니다. 흔들리는 믿음 그대로 ‘제 믿음 없음을 도와주세요’라고 정직하게 기도해 보세요.","믿음 없는 나를 도우시는 주님께 오늘도 나아갑니다.","이 아버지의 기도 ‘내가 믿나이다 나의 믿음 없는 것을 도와주소서’는 성경에서 가장 정직한 기도 가운데 하나입니다. 믿음과 의심이 한 문장 안에 함께 있습니다. 예수님은 그 흔들리는 믿음을 꾸짖지 않으시고 아들을 고쳐 주셨습니다. 완벽한 믿음이 아니라 정직한 믿음이 주님 앞에 나아갑니다.","주님, 제가 믿습니다. 그러나 제 믿음 없는 것을 도와주소서. 흔들리는 마음 그대로 주님께 나아갑니다."],["마태복음 17:20","가라사대 너희 믿음이 적은 연고니라 진실로 너희에게 이르노니 만일 너희에게 믿음이 겨자씨 한 알 만큼만 있으면 이 산을 명하여 여기서 저기로 옮기라 하여도 옮길 것이요 또 너희가 못할 것이 없으리라","믿음","겨자씨는 당시 가장 작은 씨앗의 상징이었습니다. 믿음의 크기보다 믿음이 향하는 대상, 곧 전능하신 하나님이 중요하다는 가르침입니다.","내 믿음이 너무 작다고 실망하고 있나요? 작은 믿음이라도 하나님께 드리면 산 같은 문제 앞에서도 한 걸음을 뗄 수 있습니다.","겨자씨만 한 믿음이라도 주님께 드립니다. 주님이 산을 옮기십니다.","겨자씨는 작지만 살아 있습니다. 믿음의 힘은 크기보다 생명에 있습니다. 작은 씨앗이 땅에 심기면 새들이 깃드는 나무가 되듯(마 13:32), 작은 믿음도 하나님께 심기면 자랍니다. 우리 믿음의 크기를 재지 말고, 믿음이 향하고 있는 하나님의 크기를 보십시오.","주님, 제 믿음이 작아도 살아 있게 하소서. 겨자씨 같은 믿음을 심고 주님이 자라게 하심을 보게 하소서."],["고린도후서 5:7","이는 우리가 믿음으로 행하고 보는 것으로 행하지 아니함이로라","믿음","바울은 이 땅의 몸을 ‘장막’에 비유하며, 우리가 아직 영원한 집을 보지 못하지만 믿음으로 걸어간다고 말합니다.","눈앞의 숫자, 평가, 상황만으로 삶을 판단하고 있다면 잠시 멈춰 하나님의 약속을 떠올려 보세요. 보이는 것이 전부가 아닙니다.","나는 보이는 것이 아니라 믿음으로 걸어갑니다.","밤에 운전할 때 전조등은 수십 미터 앞만 비추지만, 그것만으로도 우리는 먼 목적지까지 갈 수 있습니다. 믿음으로 걷는다는 것은 전체를 보지 못해도 보이는 만큼씩 신실하게 걷는 것입니다. 보는 것으로만 걷는 사람은 앞이 안 보이면 멈추지만, 믿음으로 걷는 사람은 어둠 속에서도 나아갑니다.","주님, 앞이 다 보이지 않아도 믿음으로 한 걸음씩 걷게 하소서. 보이는 것에 흔들리지 않게 하소서."],["갈라디아서 2:20","내가 그리스도와 함께 십자가에 못 박혔나니 그런즉 이제는 내가 사는 것이 아니요 오직 내 안에 그리스도께서 사신 것이라 이제 내가 육체 가운데 사는 것은 나를 사랑하사 나를 위하여 자기 몸을 버리신 하나님의 아들을 믿는 믿음 안에서 사는 것이라","믿음","그리스도인의 정체성을 가장 깊이 표현한 구절 중 하나입니다. 옛 자아는 십자가에서 죽고, 이제 그리스도께서 내 안에 사신다는 고백입니다.","오늘 화가 나거나 욕심이 생기는 순간, ‘내 안에 사시는 그리스도라면 어떻게 하실까?’ 하고 한 번 물어보세요.","이제는 내가 아니라 내 안의 그리스도께서 사십니다.","‘그리스도와 함께 십자가에 못 박혔다’는 고백은 과거형이지만 그 효과는 현재형입니다. 옛 자아는 끊임없이 다시 살아나려 하지만, 우리는 날마다 십자가로 돌아가 이미 이루어진 사실을 확인합니다. 그리스도인의 삶은 노력으로 나를 고치는 것이 아니라 내 안에 사시는 그리스도께 자리를 내어 드리는 것입니다.","제 안에 사시는 주님, 오늘 제 자아가 아니라 주님이 다스리시게 하소서. 주님의 사랑을 믿는 믿음으로 살게 하소서."],["로마서 10:17","그러므로 믿음은 들음에서 나며 들음은 그리스도의 말씀으로 말미암았느니라","말씀","믿음은 스스로 만들어 내는 것이 아니라 말씀을 들을 때 생겨납니다. 말씀을 가까이하는 것이 믿음을 자라게 하는 길입니다.","출퇴근길이나 집안일을 하며 성경 낭독을 들어 보세요. 귀로 듣는 말씀이 마음에 믿음의 씨를 심습니다.","말씀을 들을 때 믿음이 자랍니다. 오늘도 귀를 열겠습니다.","1738년 5월 24일, 존 웨슬리는 런던 올더스게이트 거리의 한 모임에서 루터의 로마서 서문이 낭독되는 것을 듣다가 마음이 ‘이상하게 뜨거워지는’ 경험을 했다고 일기에 적었습니다. 그 후 그는 영국 전역을 다니며 복음을 전했습니다. 성령의 역사는 말씀을 들을 때 마음에 불을 붙입니다.","말씀을 듣게 하시는 주님, 제 귀를 열어 주님의 음성을 듣게 하시고 그 말씀으로 믿음이 자라게 하소서."],["야고보서 2:17","이와 같이 행함이 없는 믿음은 그 자체가 죽은 것이라","믿음","헐벗고 굶주린 형제에게 ‘평안히 가라’는 말만 하는 것이 무슨 유익이냐고 야고보는 묻습니다. 살아 있는 믿음은 반드시 행동으로 드러납니다.","믿음이 머리에만 머물러 있지는 않은지 돌아보세요. 오늘 도움이 필요한 사람에게 말 대신 구체적인 손길을 건네 보세요.","살아 있는 믿음으로 오늘 행동하겠습니다.","바울과 야고보는 서로 다른 말을 하는 것처럼 보이지만, 사실은 같은 나무의 뿌리와 열매를 말하고 있습니다. 바울은 뿌리, 곧 믿음으로 의롭게 됨을 말하고, 야고보는 열매, 곧 살아 있는 믿음이 맺는 행함을 말합니다. 열매 없는 나무는 뿌리가 죽은 것입니다.","주님, 저의 믿음이 말에 머물지 않고 행동으로 열매 맺게 하소서. 오늘 도움이 필요한 이웃에게 손을 내밀게 하소서."],["요한일서 5:4","대저 하나님께로서 난 자마다 세상을 이기느니라 세상을 이긴 이김은 이것이니 우리의 믿음이니라","믿음","요한이 말하는 ‘세상’은 하나님을 떠난 가치관과 유혹을 뜻합니다. 그것을 이기는 힘은 강한 의지보다 하나님을 신뢰하는 믿음입니다.","돈, 인기, 비교의 압력이 나를 흔들 때 그 앞에서 ‘나는 하나님께 속한 사람’이라고 선언해 보세요.","믿음이 세상을 이깁니다. 나는 하나님께 속한 사람입니다.","요한이 말하는 승리는 세상을 정복하는 것이 아니라 세상에 정복당하지 않는 것입니다. 세상의 기준과 유혹이 나를 휩쓸어 가지 못하게 하는 힘, 그것이 믿음입니다. 다니엘이 바벨론 한가운데서 뜻을 정했듯(단 1:8), 믿음의 사람은 세상 속에 있지만 세상에 속하지 않습니다.","세상을 이기신 주님, 세상의 기준에 휩쓸리지 않고 믿음으로 제 자리를 지키게 하소서."],["창세기 15:6","아브람이 여호와를 믿으니 여호와께서 이를 그의 의로 여기시고","믿음","자식이 없던 노년의 아브람에게 하나님은 밤하늘의 별처럼 많은 자손을 약속하셨습니다. 아브람이 그 약속을 믿었을 때 하나님은 그것을 ‘의’로 인정하셨습니다. 바울은 이 구절을 이신칭의의 근거로 삼았습니다.","오늘 밤 하늘을 한 번 올려다보세요. 불가능해 보이는 약속을 믿은 아브람처럼 나의 기도 제목을 하나님께 다시 맡겨 보세요.","약속하신 분은 신실하십니다. 나는 그 약속을 믿습니다.","아브람은 별을 셀 수 없었지만 별을 만드신 분은 믿었습니다. 그는 완벽한 사람이 아니었습니다. 이후에도 실수하고 의심했습니다. 그러나 하나님은 그의 흔들림이 아니라 그가 약속을 붙든 그 믿음을 의로 여기셨습니다. 하나님은 우리의 완벽함이 아니라 신뢰를 보십니다.","약속하신 하나님, 아브람처럼 밤하늘을 보며 주님의 약속을 신뢰하게 하소서. 제 흔들림보다 주님의 신실하심을 바라보게 하소서."],["요엘 2:13","너희는 옷을 찢지 말고 마음을 찢고 너희 하나님 여호와께로 돌아올찌어다 그는 은혜로우시며 자비로우시며 노하기를 더디하시며 인애가 크시사 뜻을 돌이켜 재앙을 내리지 아니하시나니","회개","옷을 찢는 것은 당시 슬픔과 회개의 외적 표현이었습니다. 하나님은 겉모습이 아니라 진심으로 찢어진 마음을 원하십니다.","형식적인 사과나 의례적인 기도 대신, 오늘 마음 깊은 곳에서 돌이켜야 할 한 가지를 정직하게 하나님께 고백해 보세요.","겉이 아니라 마음으로 주님께 돌아갑니다. 주님은 자비로우십니다.","요엘은 메뚜기 떼가 땅을 휩쓴 재앙 앞에서 이 말씀을 전했습니다. 그리고 2장 25절에서 하나님은 메뚜기가 먹은 햇수를 갚아 주겠다고 약속하십니다. 회개는 잃어버린 세월을 끝내는 것이 아니라, 하나님이 그 세월까지 회복하시는 길을 여는 것입니다.","자비로우신 하나님, 겉이 아니라 마음을 찢고 주님께 돌아갑니다. 잃어버린 시간까지 회복하시는 은혜를 베풀어 주소서."],["이사야 1:18","여호와께서 말씀하시되 오라 우리가 서로 변론하자 너희 죄가 주홍 같을지라도 눈과 같이 희어질 것이요 진홍 같이 붉을지라도 양털 같이 되리라","회개","‘변론하자’는 법정에서 따져 보자는 말입니다. 그런데 하나님은 판결 대신 놀라운 용서를 제안하십니다. 주홍빛은 지워지지 않는 염료의 색이었습니다.","지워지지 않을 것 같은 과거의 잘못이 있나요? 하나님은 그것까지 희게 하실 수 있습니다. 오늘 그 짐을 고백하고 내려놓으세요.","주홍 같은 죄도 눈처럼 희게 하시는 은혜를 믿습니다.","하나님은 ‘오라 우리가 서로 변론하자’고 하십니다. 하나님은 우리를 일방적으로 정죄하지 않으시고 대화로 초대하십니다. 그리고 그 대화의 결론은 판결이 아니라 용서입니다. 하나님 앞에 숨기지 않고 나아가는 사람은 정죄가 아니라 깨끗함을 얻습니다.","대화로 초대하시는 하나님, 숨기지 않고 주님 앞에 나아갑니다. 주홍 같은 제 죄를 눈같이 희게 하소서."],["요한일서 1:9","만일 우리가 우리 죄를 자백하면 저는 미쁘시고 의로우사 우리 죄를 사하시며 우리를 모든 불의에서 깨끗케 하실 것이요","회개","‘자백하다’는 하나님과 같은 말을 한다, 곧 죄를 죄라고 인정한다는 뜻입니다. 하나님은 ‘미쁘시고(신실하시고) 의로우셔서’ 반드시 용서하십니다.","하루를 마치며 오늘 잘못한 말과 행동을 솔직하게 하나님께 이야기하는 ‘저녁 성찰’을 시작해 보세요.","내가 자백하면 주님은 반드시 깨끗하게 하십니다.","바로 앞 8절은 ‘우리가 죄 없다 하면 스스로 속이는 것’이라고 말합니다. 죄를 부인하는 것은 병을 부인하는 것과 같아서 치료를 막습니다. 자백은 하나님께 정보를 알려 드리는 것이 아니라, 이미 아시는 하나님 앞에서 정직해지는 것입니다. 정직은 치유의 시작입니다.","신실하신 주님, 오늘 제 잘못을 정직하게 고백합니다. 저를 모든 불의에서 깨끗하게 하소서."],["시편 51:10","하나님이여 내 속에 정한 마음을 창조하시고 내 안에 정직한 영을 새롭게 하소서","회개","밧세바 사건 이후 선지자 나단의 책망을 받은 다윗의 회개 기도입니다. ‘창조하다’는 하나님만이 하실 수 있는 일을 가리키는 단어로, 다윗은 스스로 고칠 수 없음을 인정합니다.","내 힘으로 고쳐지지 않는 습관이나 마음이 있다면, 오늘은 다짐 대신 ‘새 마음을 창조해 주세요’라고 기도해 보세요.","주님, 내 안에 깨끗한 마음을 새로 지어 주소서.","다윗은 ‘정한 마음을 고쳐 달라’고 하지 않고 ‘창조해 달라’고 기도합니다. 창세기 1장에 쓰인 바로 그 단어입니다. 그는 자기 마음이 수리로 될 수준이 아니라 새로 지어져야 한다는 것을 알았습니다. 깊은 실패를 겪은 사람의 가장 깊은 기도는 ‘새롭게 해 주소서’입니다.","창조주 하나님, 제 안에 깨끗한 마음을 새로 지어 주시고 정직한 영을 새롭게 하소서."],["시편 51:17","하나님의 구하시는 제사는 상한 심령이라 하나님이여 상하고 통회하는 마음을 주께서 멸시치 아니하시리이다","회개","다윗은 수많은 제물보다 깨어진 마음이 하나님께 더 귀하다고 고백합니다. 하나님은 무너진 사람을 외면하지 않으십니다.","실패 앞에서 자신을 숨기고 싶은 날, 오히려 무너진 마음 그대로 하나님 앞에 나아가 보세요. 그 마음이 가장 귀한 예배입니다.","상한 마음을 멸시하지 않으시는 주님께 나아갑니다.","하나님은 화려한 예물보다 깨어진 마음을 원하십니다. 깨어진 그릇은 쓸모없어 보이지만, 깨진 틈으로 빛이 들어옵니다. 자기 의로 가득 찬 마음에는 은혜가 들어갈 자리가 없지만, 상한 마음에는 하나님이 들어오실 자리가 있습니다.","상한 마음을 멸시하지 않으시는 주님, 무너진 제 마음 그대로 주님께 드립니다. 그 틈으로 은혜를 부어 주소서."],["역대하 7:14","내 이름으로 일컫는 내 백성이 그 악한 길에서 떠나 스스로 낮추고 기도하여 내 얼굴을 구하면 내가 하늘에서 듣고 그 죄를 사하고 그 땅을 고칠찌라","회개","솔로몬이 성전을 봉헌한 밤에 하나님이 나타나 주신 응답입니다. 공동체의 회복은 하나님의 백성이 먼저 낮아지고 돌이키는 데서 시작됩니다.","사회와 나라의 문제를 비판하기 전에, 나 자신과 교회가 먼저 돌이켜야 할 것은 무엇인지 생각하며 기도해 보세요.","내가 먼저 낮아지고 돌이키겠습니다. 주님, 이 땅을 고쳐 주소서.","1907년 평양 장대현교회 사경회에서 사람들이 자신의 죄를 공개적으로 고백하며 통곡했고, 이 회개 운동은 ‘평양 대부흥’으로 불리며 전국으로 퍼졌습니다. 회개한 이들은 훔친 물건을 돌려주고 원수와 화해했습니다. 참된 회개는 눈물로 끝나지 않고 삶의 변화로 이어집니다.","주님, 제가 먼저 낮아지고 악한 길에서 돌이키게 하소서. 이 땅을 고쳐 주시고 저부터 새롭게 하소서."],["누가복음 15:7","내가 너희에게 이르노니 이와 같이 죄인 하나가 회개하면 하늘에서는 회개할 것 없는 의인 아흔 아홉을 인하여 기뻐하는 것보다 더하리라","회개","잃은 양 한 마리를 찾아 나선 목자의 비유입니다. 하나님은 숫자가 아니라 한 사람을 소중히 여기시며, 돌아오는 한 사람 때문에 하늘이 기뻐합니다.","나는 아흔아홉에 속한다고 안심하고 있지는 않나요? 혹은 길 잃은 한 마리라고 느끼나요? 어느 쪽이든 하나님은 나를 찾으십니다.","하늘은 돌아오는 한 사람을 기뻐합니다. 나도 그 한 사람을 귀히 여기겠습니다.","목자는 아흔아홉 마리를 들에 두고 한 마리를 찾아 나섭니다. 경제적으로는 손해 보는 선택이지만, 사랑은 계산하지 않습니다. 하나님에게 우리는 숫자가 아니라 이름입니다. 그리고 그 한 마리를 찾았을 때 목자는 어깨에 메고 기뻐하며 돌아옵니다.","한 사람을 찾으시는 하나님, 길 잃은 저를 찾아 주심에 감사합니다. 저도 주변의 잃어버린 한 사람을 귀히 여기게 하소서."],["누가복음 15:20","이에 일어나서 아버지께로 돌아가니라 아직도 상거가 먼데 아버지가 저를 보고 측은히 여겨 달려가 목을 안고 입을 맞추니","회개","탕자의 비유에서 가장 감동적인 장면입니다. 당시 체면을 중시하던 문화에서 나이 든 아버지가 달려가는 것은 상상하기 어려운 일이었습니다. 하나님은 돌아오는 자를 향해 달려오십니다.","하나님께 돌아가기 너무 멀어졌다고 느끼나요? 한 걸음만 돌이키면, 나머지 거리는 아버지가 달려오십니다.","아버지는 나를 향해 달려오십니다. 나는 오늘 집으로 돌아갑니다.","팀 켈러는 『탕부 하나님』에서 탕자 비유의 두 아들 모두가 아버지에게서 멀어져 있었다고 말합니다. 작은아들은 방탕으로, 큰아들은 자기 의로 멀어졌습니다. 회개는 나쁜 일뿐 아니라, 착한 일로 하나님을 움직이려 했던 마음까지 돌이키는 것입니다.","달려오시는 아버지, 너무 멀리 왔다고 느낄 때에도 한 걸음 돌이키게 하시고 아버지의 품에 안기게 하소서."],["이사야 55:7","악인은 그 길을, 불의한 자는 그 생각을 버리고 여호와께로 돌아오라 그리하면 그가 긍휼히 여기시리라 우리 하나님께로 돌아오라 그가 널리 용서하시리라","회개","회개는 행동(길)뿐 아니라 생각까지 바꾸는 것입니다. ‘널리 용서하신다’는 넉넉하고 풍성하게 용서하신다는 뜻입니다.","겉으로는 바뀌었지만 마음속에 여전히 붙들고 있는 생각이 있나요? 오늘은 그 생각까지 하나님께 내려놓아 보세요.","길과 생각을 돌이켜 넉넉히 용서하시는 주님께 갑니다.","이사야 55장은 ‘값없이 와서 사 먹으라’는 초대로 시작합니다. 그리고 8절은 ‘내 생각은 너희 생각과 다르다’고 말합니다. 우리는 이렇게 큰 잘못을 용서받을 수 있을까 의심하지만, 하나님의 용서는 우리의 계산을 넘어섭니다. 넉넉한 용서가 우리를 기다립니다.","넉넉히 용서하시는 하나님, 제 생각과 길을 버리고 주님께 돌아갑니다. 제 계산보다 크신 은혜를 믿게 하소서."],["사도행전 3:19","그러므로 너희가 회개하고 돌이켜 너희 죄 없이 함을 받으라 이같이 하면 유쾌하게 되는 날이 주 앞으로부터 이를 것이요","회개","베드로가 성전 미문의 앉은뱅이를 고친 뒤 전한 설교입니다. 회개는 무거운 의무가 아니라 ‘유쾌하게 되는 날’, 곧 새 힘을 얻는 회복의 길입니다.","마음이 무겁고 답답할 때, 혹시 해결하지 않은 잘못이 있는지 살펴보세요. 정직한 회개 뒤에는 상쾌한 자유가 찾아옵니다.","회개는 무거움이 아니라 새로운 시작입니다.","‘유쾌하게 되는 날’은 무더운 날 불어오는 시원한 바람, 숨 돌릴 틈과 같은 뜻을 담고 있습니다. 회개는 무거운 짐을 더 지는 것이 아니라 오히려 짐을 내려놓고 숨을 쉬게 되는 것입니다. 돌이킨 사람은 하나님 앞에서 새 공기를 마십니다.","새롭게 하시는 주님, 회개함으로 무거운 짐을 내려놓고 주님 앞에서 시원한 새 숨을 쉬게 하소서."],["마태복음 4:17","이 때부터 예수께서 비로소 전파하여 가라사대 회개하라 천국이 가까왔느니라 하시더라","회개","예수님의 첫 공적 메시지입니다. ‘회개’(메타노이아)는 생각의 방향을 완전히 바꾸는 것을 뜻하며, 하나님 나라가 가까이 왔기 때문에 가능한 초대입니다.","오늘 내 삶의 방향을 바꿔야 할 영역 하나를 정해 보세요. 회개는 후회에 머무는 것이 아니라 방향을 트는 것입니다.","하나님 나라를 향해 내 삶의 방향을 바꿉니다.","루터의 95개조 반박문 첫 번째 조항은, 주님께서 ‘회개하라’고 하셨을 때 신자의 삶 전체가 회개이기를 원하셨다는 내용입니다. 회개는 한 번의 사건이 아니라 평생 계속되는 방향 전환입니다.","주님, 하나님 나라를 향해 제 삶의 방향을 바꾸게 하소서. 후회에 머무르지 않고 돌이켜 새 길을 걷게 하소서."],["호세아 6:1","오라 우리가 여호와께로 돌아가자 여호와께서 우리를 찢으셨으나 도로 낫게 하실 것이요 우리를 치셨으나 싸매어 주실 것임이니라","회개","배신한 아내를 다시 품은 선지자 호세아는 하나님의 끈질긴 사랑을 전합니다. 하나님의 징계는 버리심이 아니라 치료를 위한 것입니다.","지금의 어려움이 하나님께 돌아가라는 부르심은 아닌지 조용히 물어보세요. 상처를 싸매시는 분께 돌아가는 것이 회복입니다.","나를 싸매어 주시는 주님께 돌아갑니다.","호세아는 배신한 아내 고멜을 다시 사 오라는 명령을 받았습니다(호 3장). 그의 결혼 자체가 하나님의 사랑을 보여 주는 설교였습니다. 하나님은 우리가 떠나도 포기하지 않으시고 다시 데려오십니다. 징계도 버림이 아니라 돌아오게 하려는 사랑입니다.","포기하지 않으시는 하나님, 상처를 싸매시는 주님께 돌아갑니다. 저를 다시 회복시켜 주소서."],["시편 103:12","동이 서에서 먼 것 같이 우리 죄과를 우리에게서 멀리 옮기셨으며","은혜","북과 남은 끝이 있지만 동과 서는 아무리 가도 만나지 않습니다. 하나님은 용서하신 죄를 그만큼 멀리 옮기셔서 다시 꺼내지 않으십니다.","하나님이 이미 용서하신 일을 내가 자꾸 다시 꺼내 자책하고 있지는 않나요? 오늘 그것을 동과 서처럼 멀리 보내 주세요.","주님이 옮기신 죄를 나는 다시 붙들지 않겠습니다.","하나님은 우리의 죄를 용서하실 뿐 아니라 ‘기억하지 아니하리라’고 하십니다(렘 31:34). 전지하신 하나님이 잊으신다는 것은 그 죄를 다시는 우리에게 불리하게 사용하지 않으신다는 뜻입니다. 하나님이 기억하지 않으시는 것을 우리가 계속 꺼내어 자신을 정죄할 이유는 없습니다.","용서하신 하나님, 주님이 멀리 옮기신 죄를 제가 다시 꺼내지 않게 하시고 용서받은 자유를 누리게 하소서."],["이사야 53:5","그가 찔림은 우리의 허물을 인함이요 그가 상함은 우리의 죄악을 인함이라 그가 징계를 받음으로 우리가 평화를 누리고 그가 채찍에 맞음으로 우리가 나음을 입었도다","은혜","예수님보다 약 700년 전에 기록된 ‘고난받는 종의 노래’입니다. 교회는 이 말씀이 십자가에서 그대로 이루어졌다고 고백해 왔습니다.","나의 평화와 나음이 누군가의 상처 위에 세워졌다는 사실을 묵상하며, 오늘은 받은 은혜에 대해 조용히 감사해 보세요.","주님의 상처로 내가 나음을 입었습니다.","이사야 53장은 ‘우리’라는 말을 반복합니다. 그분이 찔리신 것은 ‘우리’의 허물 때문이고, 그분이 맞으신 것은 ‘우리’의 나음을 위해서입니다. 십자가는 멀리서 구경하는 사건이 아니라 나와 직접 관련된 사건입니다. 그 앞에서 우리는 관객이 아니라 수혜자입니다.","저를 위해 상하신 주님, 그 상처로 제가 나음을 입었습니다. 받은 은혜를 잊지 않고 감사로 살게 하소서."],["마가복음 8:34","무리와 제자들을 불러 이르시되 아무든지 나를 따라오려거든 자기를 부인하고 자기 십자가를 지고 나를 좇을 것이니라","거룩","예수님이 처음으로 고난과 죽음을 예고하신 직후의 말씀입니다. ‘자기 부인’은 자신을 미워하는 것이 아니라, 내 뜻보다 주님의 뜻을 앞세우는 것입니다.","오늘 ‘내 방식대로’ 하고 싶은 순간이 올 때, 한 번은 하나님이 원하시는 쪽을 선택해 보세요. 그것이 매일 지는 작은 십자가입니다.","오늘 나의 작은 십자가를 지고 주님을 따르겠습니다.","디트리히 본회퍼는 『나를 따르라』에서 ‘값싼 은혜’와 ‘값비싼 은혜’를 구분했습니다. 회개와 제자도 없이 위로만 받는 은혜는 값싼 은혜이고, 예수님을 따르도록 부르는 은혜는 값비싼 은혜입니다. 은혜는 값없이 주어지지만, 결코 싸구려가 아닙니다.","주님, 오늘 제 뜻보다 주님의 뜻을 앞세우며 저의 작은 십자가를 지고 주님을 따르게 하소서."],["마태복음 16:26","사람이 만일 온 천하를 얻고도 제 목숨을 잃으면 무엇이 유익하리요 사람이 무엇을 주고 제 목숨을 바꾸겠느냐","지혜","예수님은 세상의 모든 것을 얻어도 영혼을 잃으면 아무 소용이 없다고 말씀하십니다. 인생의 가치를 무엇으로 계산하는지 묻는 질문입니다.","성공을 위해 건강, 가족, 양심을 희생하고 있지는 않은지 점검해 보세요. 무엇과도 바꿀 수 없는 것을 지키는 것이 지혜입니다.","온 천하보다 귀한 것을 잃지 않도록 살겠습니다.","짐 엘리엇은 1956년 에콰도르의 한 부족에게 복음을 전하려다 스물여덟의 나이로 목숨을 잃었습니다. 그는 대학 시절 일기에, 잃을 수 없는 것을 얻기 위해 지킬 수 없는 것을 내어 주는 사람은 어리석지 않다고 적었습니다. 이후 그의 아내 엘리자베스는 바로 그 부족에게 돌아가 함께 살며 복음을 전했습니다.","주님, 온 천하보다 귀한 것을 잃지 않게 하소서. 성공을 위해 영혼과 사랑하는 이들을 희생하지 않게 하소서."],["요한복음 20:29","예수께서 가라사대 너는 나를 본 고로 믿느냐 보지 못하고 믿는 자들은 복되도다 하시니라","믿음","부활하신 예수님을 직접 보고서야 믿은 도마에게 하신 말씀입니다. 이 말씀은 예수님을 직접 보지 못한 오늘의 우리를 향한 축복이기도 합니다.","의심이 드는 것은 부끄러운 일이 아닙니다. 도마처럼 정직하게 질문하되, 오늘은 보지 못하고도 믿는 복을 구해 보세요.","보지 못하고도 믿는 자의 복이 내게 있습니다.","도마는 ‘의심 많은 도마’로 불리지만, 그의 의심 끝에서 성경에서 가장 높은 고백이 나왔습니다. ‘나의 주시며 나의 하나님이시니이다’(28절). 정직한 질문은 믿음의 적이 아니라 더 깊은 믿음으로 가는 길이 될 수 있습니다. 예수님은 의심하는 도마를 찾아오셨습니다.","보지 못하고도 믿는 복을 주시는 주님, 제 질문과 의심도 주님께 가져가게 하시고 더 깊은 고백으로 이끌어 주소서."],["마태복음 14:31","예수께서 즉시 손을 내밀어 저를 붙잡으시며 가라사대 믿음이 적은 자여 왜 의심하였느냐 하시고","믿음","물 위를 걷던 베드로가 바람을 보고 무서워 빠져갈 때, 예수님은 ‘즉시’ 손을 내미셨습니다. 책망보다 먼저 붙잡아 주신 손길이 있었습니다.","걱정의 바람에 눈을 빼앗겨 가라앉는 것 같다면, ‘주여 나를 구원하소서’라고 짧게 외쳐 보세요. 주님의 손은 즉시 내밀어집니다.","가라앉을 때도 즉시 붙잡아 주시는 주님을 신뢰합니다.","베드로가 물 위를 걸은 것도 믿음이었고, 빠져갈 때 ‘주여 나를 구원하소서’라고 외친 것도 믿음이었습니다. 그는 가라앉았지만 주님께 부르짖었습니다. 믿음은 한 번도 흔들리지 않는 것이 아니라, 흔들릴 때 누구에게 손을 뻗어야 하는지 아는 것입니다.","즉시 손을 내미시는 주님, 걱정의 바람에 가라앉을 때 주님께 부르짖게 하시고 저를 붙잡아 주소서."],["히브리서 12:2","믿음의 주요 또 온전케 하시는 이인 예수를 바라보자 저는 그 앞에 있는 즐거움을 위하여 십자가를 참으사 부끄러움을 개의치 아니하시더니 하나님 보좌 우편에 앉으셨느니라","믿음","믿음의 경주를 하는 성도에게 히브리서는 ‘예수를 바라보라’고 권합니다. 예수님은 믿음을 시작하게 하시고 완성하시는 분입니다.","SNS와 남의 삶을 바라보며 지쳤다면, 시선을 예수님께로 옮겨 보세요. 무엇을 바라보느냐가 어떻게 달리느냐를 결정합니다.","나는 믿음을 완성하시는 예수님을 바라봅니다.","달리기 선수는 결승선을 보며 달립니다. 예수님은 ‘앞에 있는 즐거움’을 바라보며 십자가를 참으셨습니다. 고통을 견디는 힘은 고통 너머의 기쁨을 볼 때 생깁니다. 우리도 예수님을 바라볼 때, 오늘의 고난 너머에 있는 하나님의 기쁨을 봅니다.","믿음을 시작하고 완성하시는 예수님, 오늘의 고난 너머 주님이 준비하신 기쁨을 바라보며 달려가게 하소서."],["베드로전서 1:8","예수를 너희가 보지 못하였으나 사랑하는도다 이제도 보지 못하나 믿고 말할 수 없는 영광스러운 즐거움으로 기뻐하니","기쁨","예수님을 직접 본 사도 베드로가, 보지 못하고도 사랑하는 성도들을 향해 감탄하며 쓴 말씀입니다. 시련 중에도 그들에게는 말할 수 없는 기쁨이 있었습니다.","보이지 않는 주님을 사랑한다는 것은 놀라운 일입니다. 오늘 하루 그 사랑을 짧은 찬양이나 감사 기도로 표현해 보세요.","보지 못하나 사랑하는 주님 때문에 나는 기뻐합니다.","베드로전서는 흩어져 고난받는 나그네들에게 보낸 편지입니다. 그들은 예수님을 직접 본 적도 없었고, 오히려 그분을 믿는다는 이유로 고난을 받았습니다. 그런데도 ‘말할 수 없는 영광스러운 즐거움’이 있었습니다. 기쁨은 환경이 아니라 사랑하는 분과의 관계에서 나옵니다.","보지 못하나 사랑하는 주님, 어떤 형편에서도 말할 수 없는 기쁨으로 주님을 노래하게 하소서."],["요한복음 11:25","예수께서 가라사대 나는 부활이요 생명이니 나를 믿는 자는 죽어도 살겠고","생명","죽은 지 나흘 된 나사로의 무덤 앞에서, 슬퍼하는 마르다에게 하신 말씀입니다. 예수님은 ‘부활이 있다’가 아니라 ‘내가 부활이다’라고 말씀하십니다.","사랑하는 이를 잃은 슬픔이나 끝나 버린 것 같은 일 앞에서, 이 말씀은 끝이 끝이 아님을 알려 줍니다. 오늘 부활의 소망으로 슬픔을 바라보세요.","예수님은 부활이요 생명이십니다. 죽음도 끝이 아닙니다.","마르다는 ‘마지막 날 부활 때에는 다시 살 줄을 내가 아나이다’라고 정확한 교리로 대답했습니다. 그러나 예수님은 부활을 먼 미래의 사건에서 지금 눈앞에 서 있는 자신에게로 끌어오셨습니다. 부활은 언젠가 일어날 일이기 전에 지금 만나는 인격입니다. 교리를 아는 것과 부활이신 분을 만나는 것은 다릅니다.","부활이요 생명이신 주님, 교리로만 아는 것이 아니라 지금 살아 계신 주님을 만나게 하시고 죽음 앞에서도 소망을 품게 하소서."],["요한복음 14:6","예수께서 가라사대 내가 곧 길이요 진리요 생명이니 나로 말미암지 않고는 아버지께로 올 자가 없느니라","생명","‘어디로 가시는지 모르는데 길을 어찌 알겠느냐’는 도마의 질문에 대한 답입니다. 예수님은 길을 알려 주시는 분이 아니라 그분 자신이 길이십니다.","방향을 잃은 것 같을 때 ‘무엇을 할까’보다 ‘누구를 따를까’를 먼저 물어 보세요. 길이신 분을 따르면 길을 잃지 않습니다.","예수님이 나의 길, 진리, 생명이십니다.","예수님은 길을 가르쳐 주는 안내자가 아니라 길 자체이십니다. 안내자는 길을 알려 주고 떠나지만, 길이신 분은 우리와 끝까지 함께 걸으십니다. 진리는 외워야 할 명제가 아니라 따라야 할 인격이고, 생명은 지켜야 할 규칙이 아니라 누려야 할 관계입니다.","길이요 진리요 생명이신 주님, 방향을 잃을 때 무엇을 할지보다 누구를 따를지를 먼저 묻게 하소서."],["요한복음 10:10","도적이 오는 것은 도적질하고 죽이고 멸망시키려는 것뿐이요 내가 온 것은 양으로 생명을 얻게 하고 더 풍성히 얻게 하려는 것이라","생명","예수님은 자신을 양의 문이자 선한 목자로 소개하십니다. 그분이 주시는 생명은 겨우 살아 있는 것이 아니라 ‘풍성한’ 생명입니다.","삶에서 기쁨과 생기를 빼앗아 가는 것들—중독, 비교, 쉼 없는 일—을 점검해 보세요. 오늘 풍성한 생명을 누리는 작은 선택을 하세요.","주님은 나에게 풍성한 생명을 주러 오셨습니다.","예수님이 주시는 ‘더 풍성한 생명’은 더 많은 소유나 더 바쁜 일정이 아닙니다. 그것은 하나님과 이웃과의 관계 속에서 누리는 깊이 있는 삶입니다. 도적은 빼앗아 가지만, 선한 목자는 채워 주십니다. 무엇이 내 삶을 빼앗고 있는지, 누가 내 삶을 채우고 있는지 돌아보아야 합니다.","풍성한 생명을 주시는 주님, 제 삶의 기쁨을 빼앗는 것들을 분별하게 하시고 주님 안에서 참된 풍성함을 누리게 하소서."],["요한복음 10:11","나는 선한 목자라 선한 목자는 양들을 위하여 목숨을 버리거니와","사랑","삯꾼은 이리가 오면 도망가지만, 선한 목자는 양을 위해 목숨을 버립니다. 예수님은 자신의 죽음을 양을 위한 자발적 희생으로 설명하십니다.","나는 맡겨진 사람들에게 목자인가요, 삯꾼인가요? 가족과 동료, 맡은 이들을 위해 오늘 조금 더 책임 있게 행동해 보세요.","선한 목자가 나를 위해 목숨을 버리셨습니다.","선한 목자는 양을 위해 목숨을 버리고, 또 양을 ‘압니다’(14절). 우리 각자의 이름과 형편, 약점과 상처를 아십니다. 많은 사람 중 하나로 대충 아시는 것이 아니라, 아버지가 아들을 아시듯 깊이 아십니다. 알려진다는 것, 그것은 사랑받는다는 뜻입니다.","저를 아시는 선한 목자여, 제 이름과 형편을 아시는 주님 안에서 안심하게 하시고 그 음성을 따르게 하소서."],["마태복음 28:6","그가 여기 계시지 않고 그의 말씀하시던 대로 살아나셨느니라 와서 그의 누우셨던 곳을 보라","생명","안식 후 첫날 새벽, 무덤을 찾은 여인들에게 천사가 전한 소식입니다. ‘말씀하시던 대로’라는 표현은 부활이 약속의 성취임을 강조합니다.","빈 무덤은 하나님의 약속이 반드시 이루어진다는 증거입니다. 오늘 붙들고 있는 약속 하나를 다시 꺼내 신뢰를 고백해 보세요.","주님은 말씀하신 대로 살아나셨습니다. 그분의 약속은 반드시 이루어집니다.","동방 교회 성도들은 지금도 부활절이 되면 ‘그리스도께서 부활하셨습니다!’ ‘참으로 부활하셨습니다!’라고 인사를 나눕니다. 부활 신앙은 머릿속의 교리가 아니라 서로를 일으키는 삶의 인사가 되었습니다.","살아나신 주님, 빈 무덤의 소식이 오늘 제 삶의 인사가 되게 하시고 부활의 기쁨으로 이웃을 일으키게 하소서."],["고린도전서 15:20","그러나 이제 그리스도께서 죽은 자 가운데서 다시 살아 잠자는 자들의 첫 열매가 되셨도다","생명","‘첫 열매’는 추수의 시작을 알리는 첫 곡식입니다. 예수님의 부활은 그분을 믿는 모든 사람의 부활을 보증하는 첫 열매입니다.","죽음을 ‘잠’이라고 부르는 성경의 표현처럼, 그리스도인에게 죽음은 깨어날 날을 기다리는 쉼입니다. 오늘 이 소망을 붙들어 보세요.","그리스도의 부활은 나의 부활의 첫 열매입니다.","유대인들은 보리 추수의 첫 단을 하나님께 흔들어 드리는 ‘초실절’을 지켰는데, 예수님은 바로 그 절기에 부활하셨습니다. 첫 열매가 드려지면 나머지 추수도 하나님의 것이 됩니다. 예수님의 부활은 그분께 속한 모든 사람의 부활을 약속하는 보증입니다.","첫 열매가 되신 주님, 주님의 부활이 제 부활의 보증임을 믿습니다. 죽음 너머를 바라보며 오늘을 살게 하소서."],["고린도전서 15:55","사망아 너의 이기는 것이 어디 있느냐 사망아 너의 쏘는 것이 어디 있느냐","생명","바울은 부활의 승리를 선포하며 죽음을 향해 조롱하듯 외칩니다. 죽음의 독침은 그리스도의 부활로 이미 힘을 잃었습니다.","나를 가장 두렵게 하는 것을 떠올리고 그 이름을 이 구절에 넣어 외쳐 보세요. 부활의 주님 앞에서 그것은 마지막 말이 아닙니다.","사망이 이기지 못합니다. 승리는 부활의 주님께 있습니다.","디트리히 본회퍼는 처형장으로 끌려가기 직전, 동료에게 ‘이것이 끝입니다. 그러나 내게는 생명의 시작입니다’라는 말을 남긴 것으로 전해집니다. 부활을 믿는 사람은 죽음 앞에서도 끝이 아니라 시작을 봅니다.","사망을 이기신 주님, 제가 가장 두려워하는 것도 마지막 말이 아님을 믿게 하소서. 부활의 소망으로 담대하게 하소서."],["로마서 6:23","죄의 삯은 사망이요 하나님의 은사는 그리스도 예수 우리 주 안에 있는 영생이니라","은혜","‘삯’은 일한 대가로 받는 품삯이고 ‘은사’는 값없이 받는 선물입니다. 죄는 결국 죽음이라는 대가를 치르게 하지만, 하나님은 영생을 선물로 주십니다.","노력과 보상의 논리에 지쳐 있다면, 가장 중요한 것은 선물로 주어졌다는 사실을 기억하세요. 오늘 누군가에게 대가 없는 친절을 베풀어 보세요.","영생은 내가 번 것이 아니라 하나님의 선물입니다.","설교자들은 흔히 ‘긍휼’은 마땅히 받을 벌을 받지 않는 것이고, ‘은혜’는 받을 자격 없는 선물을 받는 것이라고 구분합니다. 하나님은 우리에게서 벌을 거두실 뿐 아니라, 그 빈자리를 선물로 채우십니다.","값없이 영생을 주신 하나님, 이 선물을 감사로 받으며 저도 대가 없이 이웃에게 친절을 베풀게 하소서."],["로마서 6:4","그러므로 우리가 그의 죽으심과 합하여 세례를 받음으로 그와 함께 장사되었나니 이는 아버지의 영광으로 그리스도를 죽은 자 가운데서 일으키심과 같이 우리로 또한 새 생명 가운데서 행하게 하려 함이니라","생명","세례는 물에 잠기며 그리스도와 함께 죽고, 물에서 나오며 함께 다시 사는 것을 보여 줍니다. 부활은 미래의 일일 뿐 아니라 오늘의 새로운 삶의 방식입니다.","오늘 하루, 예전 같으면 했을 행동 하나를 내려놓고 ‘새 생명’답게 다른 선택을 해 보세요.","나는 그리스도와 함께 새 생명 가운데서 걷습니다.","옛 생활의 습관은 쉽게 사라지지 않습니다. 그래서 바울은 6장 11절에서 ‘여길지어다’라고 말합니다. 이미 일어난 사실을 날마다 믿음으로 확인하라는 것입니다. 새 생명은 감정이 아니라 사실이며, 그 사실을 믿고 행할 때 습관도 바뀌기 시작합니다.","새 생명을 주신 주님, 옛 습관 앞에서 이미 주님과 함께 죽고 살아났음을 기억하며 새롭게 행하게 하소서."],["베드로전서 2:24","친히 나무에 달려 그 몸으로 우리 죄를 담당하셨으니 이는 우리로 죄에 대하여 죽고 의에 대하여 살게 하려 하심이라 저가 채찍에 맞음으로 너희는 나음을 얻었나니","은혜","베드로는 이사야 53장을 인용하며, 부당하게 고난받는 종들에게 예수님의 고난을 보여 줍니다. 십자가는 죄를 담당하실 뿐 아니라 새 삶을 여는 문입니다.","억울한 일을 당했다면 십자가에서 억울함을 감당하신 예수님을 바라보세요. 그분은 나의 상처까지 이해하십니다.","주님이 내 죄를 지셨으니 나는 의를 위해 삽니다.","베드로는 이 말씀을 억울하게 고난받는 종들에게 썼습니다. 예수님은 욕을 받으시되 대신 욕하지 않으셨고, 고난을 받으시되 위협하지 않으셨습니다(23절). 십자가는 우리의 죄를 지셨을 뿐 아니라, 억울함을 다루는 새로운 방법도 보여 줍니다. 보복이 아니라 하나님께 맡김입니다.","억울함을 감당하신 주님, 부당한 일 앞에서 보복하지 않고 공의로 판단하시는 하나님께 맡기게 하소서."],["이사야 53:6","우리는 다 양 같아서 그릇 행하여 각기 제 길로 갔거늘 여호와께서는 우리 무리의 죄악을 그에게 담당시키셨도다","은혜","‘우리는 다’로 시작해 ‘우리 무리의’로 끝나는 이 구절은 모든 사람이 길을 잃었고, 모든 사람의 죄가 한 분에게 지워졌음을 보여 줍니다.","남의 잘못이 크게 보일 때, ‘우리는 다 양 같아서’라는 고백을 기억하세요. 겸손한 사람은 정죄보다 긍휼을 선택합니다.","길 잃은 나를 위해 대신 짐을 지신 주님께 감사합니다.","양은 한 마리가 길을 벗어나면 다른 양들도 따라가는 습성이 있습니다. ‘각기 제 길로 갔다’는 말은 우리 모두가 자기 방식대로 길을 잃었다는 뜻입니다. 그런데 하나님은 그 모든 양의 죄를 한 분에게 지우셨습니다. 길을 잃은 우리를 찾으시려고 목자가 대신 상처를 입으셨습니다.","길 잃은 저를 위해 대신 짐을 지신 주님, 제 길이 아니라 주님의 길로 돌아오게 하시고 남을 정죄하지 않게 하소서."],["누가복음 23:34","이에 예수께서 가라사대 아버지 저희를 사하여 주옵소서 자기의 하는 것을 알지 못함이니이다 하시더라","용서","십자가 위에서 하신 첫 번째 말씀입니다. 극심한 고통 속에서도 예수님은 자신을 못 박는 사람들을 위해 기도하셨습니다.","나에게 상처 준 사람을 위해 기도하기 어렵다면, 오늘은 이 기도문을 그대로 따라 해 보세요. 용서는 감정보다 기도에서 시작됩니다.","주님처럼 나도 용서의 기도를 드리겠습니다.","‘저희를 사하여 주옵소서’라는 기도는 십자가 위에서 계속 반복된 기도였다고 보는 해석도 있습니다. 못이 박히는 순간에도, 조롱이 이어지는 동안에도 예수님은 용서를 구하셨습니다. 용서는 상처가 끝난 뒤에 하는 것이 아니라 상처 한가운데서 시작될 수 있습니다.","십자가에서 용서를 구하신 주님, 저도 상처 한가운데서 용서의 기도를 드릴 수 있게 하소서."],["요한복음 19:30","예수께서 신 포도주를 받으신 후 가라사대 다 이루었다 하시고 머리를 숙이시고 영혼이 돌아가시니라","은혜","‘다 이루었다’(테텔레스타이)는 당시 빚 문서에 ‘완불’이라고 쓰던 단어이기도 합니다. 구원의 값이 완전히 치러졌다는 승리의 선언입니다.","무언가를 더 해야 하나님께 사랑받을 것 같아 불안하다면 이 말씀을 들으세요. 이미 다 이루어졌습니다.","주님이 다 이루셨습니다. 나는 그 안에서 안식합니다.","‘다 이루었다’는 실패의 탄식이 아니라 완성의 선언입니다. 예수님은 ‘내가 끝났다’고 하지 않으시고 ‘다 이루었다’고 하셨습니다. 구원을 위해 우리가 더 보탤 것이 없다는 뜻입니다. 그래서 그리스도인의 삶은 구원을 얻기 위한 노력이 아니라 이미 얻은 구원에 대한 응답입니다.","다 이루신 주님, 더 보탤 것 없는 그 은혜 안에서 안식하며 감사로 응답하는 삶을 살게 하소서."],["누가복음 24:5-6","여자들이 두려워 얼굴을 땅에 대니 두 사람이 이르되 어찌하여 산 자를 죽은 자 가운데서 찾느냐 여기 계시지 않고 살아나셨느니라","생명","향품을 들고 무덤을 찾은 여인들은 죽은 예수님을 찾았지만, 천사는 그분이 살아나셨다고 전합니다.","나는 혹시 살아 계신 하나님을 과거의 추억이나 형식 속에서만 찾고 있지 않나요? 오늘 내 삶의 현장에서 살아 계신 주님을 찾아보세요.","살아 계신 주님을 오늘 내 삶에서 만납니다.","여인들은 향품을 준비해 무덤으로 갔습니다. 사랑은 있었지만 기대는 없었습니다. 그들은 죽은 예수님을 위해 최선을 다했지만 살아 계신 예수님은 생각하지 못했습니다. 우리도 하나님께 최선을 다하면서 정작 그분이 지금 일하고 계심을 기대하지 않을 때가 있습니다.","살아 계신 주님, 죽은 것 같은 형식 속에서가 아니라 지금 제 삶에서 일하시는 주님을 기대하게 하소서."],["요한복음 20:21","예수께서 또 가라사대 너희에게 평강이 있을찌어다 아버지께서 나를 보내신 것같이 나도 너희를 보내노라","섬김","두려워 문을 닫고 숨어 있던 제자들에게 부활하신 주님이 오셔서 평강을 주시고, 곧바로 세상으로 보내십니다. 평강은 숨기 위한 것이 아니라 보냄을 받기 위한 것입니다.","나의 일터와 가정이 하나님이 나를 보내신 선교지입니다. 오늘 그곳에서 평강을 전하는 사람이 되어 보세요.","주님의 평강을 받아 내가 보냄 받은 곳으로 갑니다.","1885년 부활절, 언더우드와 아펜젤러 선교사가 제물포에 도착했습니다. 이후 선교사들은 교회와 함께 학교와 병원을 세웠고, 이것은 한국 근대 교육과 의료의 중요한 뿌리가 되었습니다. 복음은 말로만이 아니라 섬김을 통해 이 땅에 뿌리내렸습니다.","보내시는 주님, 주님의 평강을 받아 제가 보냄 받은 가정과 일터에서 평강을 전하는 사람이 되게 하소서."],["베드로전서 1:3","찬송하리로다 우리 주 예수 그리스도의 아버지 하나님이 그 많으신 긍휼대로 예수 그리스도를 죽은 자 가운데서 부활하게 하심으로 말미암아 우리를 거듭나게 하사 산 소망이 있게 하시며","소망","예수님을 세 번 부인했던 베드로가 부활의 주님을 만나 쓴 고백입니다. 부활은 시들지 않는 ‘산 소망’을 줍니다.","세상의 소망은 상황에 따라 시들지만, 부활의 소망은 살아 있습니다. 오늘 낙심되는 일이 있다면 ‘산 소망’이라는 말을 붙들어 보세요.","나는 살아 있는 소망을 가진 사람입니다.","독일 신학자 위르겐 몰트만은 제2차 세계대전 뒤 전쟁 포로로 수용소에 있을 때 한 군목에게서 받은 성경을 읽으며 소망을 발견했고, 훗날 『희망의 신학』을 썼습니다. 그는 기독교 신앙이 처음부터 끝까지 소망이라고 말했습니다. 그 소망은 막연한 낙관이 아니라, 죽음에서 예수님을 일으키신 하나님이 미래를 붙들고 계신다는 확신입니다.","산 소망을 주신 하나님, 시들지 않는 부활의 소망으로 낙심한 마음을 일으켜 주소서."],["고린도후서 4:16","그러므로 우리가 낙심하지 아니하노니 겉사람은 후패하나 우리의 속은 날로 새롭도다","소망","‘후패하다’는 낡고 쇠약해진다는 뜻입니다. 고난 속의 바울은 몸이 약해져도 속사람은 날마다 새로워진다고 고백합니다.","나이 들고 지쳐 가는 몸 때문에 우울하다면, 날마다 새로워지는 속사람을 위해 오늘 말씀과 기도의 시간을 가져 보세요.","겉은 약해져도 내 속은 날마다 새로워집니다.","바울은 ‘겉사람은 후패하나’라고 솔직하게 인정합니다. 그는 몸이 약해지는 것을 부정하지 않았습니다. 그러나 속사람은 ‘날로’ 새로워진다고 말합니다. 하루하루 조금씩입니다. 극적인 변화가 아니어도 괜찮습니다. 매일의 말씀과 기도가 속사람을 새롭게 합니다.","날마다 새롭게 하시는 주님, 겉사람이 약해져도 낙심하지 않게 하시고 오늘도 속사람을 새롭게 하소서."],["고린도후서 4:7","우리가 이 보배를 질그릇에 가졌으니 이는 심히 큰 능력이 하나님께 있고 우리에게 있지 아니함을 알게 하려 함이라","겸손","질그릇은 흔하고 깨지기 쉬운 그릇입니다. 하나님은 복음이라는 보배를 연약한 사람에게 맡기셔서 능력이 하나님께 있음을 드러내십니다.","나의 연약함이 부끄럽다면, 그 금 간 틈으로 하나님의 빛이 새어 나온다는 사실을 기억하세요.","나는 연약한 질그릇이지만, 그 안에 보배가 있습니다.","고대에는 귀한 보물을 오히려 값싼 질그릇에 숨겨 보관하기도 했습니다. 아무도 그 안에 보물이 있으리라 생각하지 않았기 때문입니다. 하나님은 복음이라는 보물을 평범하고 연약한 사람들에게 맡기셨습니다. 그래야 그 능력이 그릇이 아니라 보물에서 나온다는 것이 드러나기 때문입니다.","보배를 맡기신 하나님, 연약한 질그릇 같은 저를 통해서도 주님의 능력이 드러나게 하소서."],["빌립보서 3:10","내가 그리스도와 그 부활의 권능과 그 고난에 참예함을 알아 그의 죽으심을 본받아","거룩","바울이 모든 것을 해로 여기면서까지 얻고 싶었던 것은 그리스도를 아는 것이었습니다. 부활의 능력과 고난의 참여는 함께 갑니다.","편안한 신앙만 원하고 있지는 않나요? 오늘 누군가의 아픔에 함께하는 것이 그리스도의 고난에 참여하는 길일 수 있습니다.","그리스도를 더 깊이 알기를 원합니다.","15세기 토마스 아 켐피스의 『그리스도를 본받아』는 오랫동안 성경 다음으로 많이 읽힌 신앙 고전 가운데 하나로 꼽힙니다. 이 책이 던지는 질문은 단순합니다. ‘그리스도라면 어떻게 사셨을까?’ 거룩은 거창한 종교 행위가 아니라 날마다 예수님을 닮아 가는 것입니다.","주님, 그리스도를 더 깊이 알기를 원합니다. 부활의 능력과 함께 이웃의 아픔에도 참여하게 하소서."],["로마서 8:11","예수를 죽은 자 가운데서 살리신 이의 영이 너희 안에 거하시면 그리스도 예수를 죽은 자 가운데서 살리신 이가 너희 안에 거하시는 그의 영으로 말미암아 너희 죽을 몸도 살리시리라","성령","예수님을 살리신 바로 그 성령께서 우리 안에 계신다는 놀라운 선언입니다. 부활의 능력은 먼 이야기가 아니라 내 안에 있는 능력입니다.","무기력한 하루를 보내고 있다면, 내 안에 계신 성령님께 새 힘을 구하는 기도로 시작해 보세요.","부활의 능력이 성령으로 내 안에 계십니다.","성령은 우리를 위로하시는 분일 뿐 아니라 죽은 것을 살리시는 분입니다. 예수님을 무덤에서 일으키신 바로 그 능력이 우리 안에 있습니다. 무기력하고 메마른 영역에도 생명을 불어넣으실 수 있습니다. 에스겔이 본 마른 뼈 골짜기처럼(겔 37장), 성령이 임하시면 다시 일어섭니다.","부활의 영이신 성령님, 제 안의 메마르고 무기력한 곳에 생명을 불어넣어 다시 일어서게 하소서."],["요한복음 12:24","진실로 진실로 너희에게 이르노니 한 알의 밀이 땅에 떨어져 죽지 아니하면 한 알 그대로 있고 죽으면 많은 열매를 맺느니라","생명","예수님은 자신의 죽음을 땅에 떨어지는 씨앗에 비유하십니다. 죽음처럼 보이는 것이 오히려 풍성한 생명의 시작이 됩니다.","내려놓기 아까운 것—자존심, 고집, 욕심—을 땅에 심는다는 마음으로 내려놓아 보세요. 그곳에서 열매가 시작됩니다.","내가 내려놓은 것이 많은 열매가 될 것을 믿습니다.","씨앗은 땅에 묻혀 껍질이 깨질 때 비로소 싹이 납니다. 예수님은 이 원리를 자신에게 먼저 적용하시고, 이어서 ‘자기 생명을 사랑하는 자는 잃어버릴 것이요’라고 제자들에게 적용하십니다. 움켜쥔 손에는 아무것도 자라지 않습니다. 내려놓은 자리에서 열매가 시작됩니다.","한 알의 밀이 되신 주님, 제가 움켜쥔 것을 내려놓게 하시고 그 자리에서 많은 열매가 맺히게 하소서."],["요한복음 6:35","예수께서 가라사대 나는 생명의 떡이니 내게 오는 자는 결코 주리지 아니할 터이요 나를 믿는 자는 영원히 목마르지 아니하리라","생명","오병이어의 기적 다음 날, 또 빵을 원하는 무리에게 예수님은 영혼의 배고픔을 채우는 참된 떡이 자신임을 말씀하십니다.","채워도 채워도 허전한 마음이 있다면, 그 허기가 물질로 채워지는 것인지 돌아보세요. 오늘 예수님께 나아가 영혼의 양식을 구해 보세요.","예수님이 나의 생명의 떡이십니다.","이스라엘 백성은 광야에서 날마다 만나를 거두었고, 하루치 이상을 쌓아 두면 썩었습니다. 예수님은 자신이 하늘에서 내려온 참 떡이라고 하십니다. 영혼의 양식도 하루치씩 받습니다. 어제 받은 은혜로 오늘을 살 수 없기에, 우리는 매일 주님께 나아갑니다.","생명의 떡이신 주님, 오늘도 하루치 은혜를 구합니다. 허기진 제 영혼을 주님으로 채워 주소서."],["요한복음 8:12","예수께서 또 일러 가라사대 나는 세상의 빛이니 나를 따르는 자는 어두움에 다니지 아니하고 생명의 빛을 얻으리라","생명","초막절에 성전 뜰을 환하게 밝히던 등불 축제를 배경으로 하신 말씀입니다. 예수님은 축제의 등불보다 더 참된 빛이 자신이라고 선언하십니다.","마음이 어두운 날, 빛을 피하지 말고 빛 앞에 나아가세요. 숨기던 것을 드러낼 때 오히려 자유가 시작됩니다.","세상의 빛이신 주님을 따라 어둠을 걷지 않겠습니다.","빛은 어둠을 쫓아내는 것뿐 아니라 숨은 것을 드러내고 길을 보여 줍니다. 예수님을 따르는 사람은 어둠에 다니지 않는다는 말은 어둠이 없다는 뜻이 아니라, 어둠 속에서도 빛을 가지고 걷는다는 뜻입니다. 그리고 예수님은 우리에게도 ‘너희는 세상의 빛이라’고 하셨습니다.","세상의 빛이신 주님, 어둠 속에서도 주님의 빛을 따라 걷게 하시고 제 삶도 누군가에게 빛이 되게 하소서."],["요한복음 15:5","나는 포도나무요 너희는 가지라 저가 내 안에, 내가 저 안에 있으면 사람이 과실을 많이 맺나니 나를 떠나서는 너희가 아무 것도 할 수 없음이라","동행","가지는 스스로 열매를 맺으려 애쓰지 않고 나무에 붙어 있을 뿐입니다. 열매의 비결은 노력이 아니라 ‘거함’, 곧 주님과의 연결입니다.","너무 바빠 기도할 시간이 없다면, 그 바쁨이 열매 없는 수고가 되지 않도록 오늘 10분이라도 주님 안에 머물러 보세요.","나는 포도나무에 붙은 가지입니다. 주님 안에 머물겠습니다.","포도원 농부는 열매를 더 맺게 하려고 가지를 깨끗하게 하는데, 이것을 가지치기라고 합니다(2절). 잘려 나가는 것이 아프지만, 그 덕분에 더 좋은 열매가 맺힙니다. 하나님이 우리 삶에서 무언가를 정리하실 때, 그것은 벌이 아니라 더 풍성한 열매를 위한 손길일 수 있습니다.","포도나무 되신 주님, 주님 안에 머물게 하시고 제 삶을 가지치시는 손길도 신뢰하며 열매 맺게 하소서."],["요한복음 4:14","내가 주는 물을 먹는 자는 영원히 목마르지 아니하리니 나의 주는 물은 그 속에서 영생하도록 솟아나는 샘물이 되리라","생명","사람들을 피해 한낮에 물을 길으러 온 사마리아 여인에게 하신 말씀입니다. 예수님은 그녀의 깊은 목마름을 아시고 결코 마르지 않는 샘을 약속하십니다.","관계, 인정, 성취로 갈증을 채우려다 지쳤다면, 내 안에서 솟아나는 샘이신 주님께 나아가 보세요.","내 안에 마르지 않는 생명의 샘이 있습니다.","사마리아 여인은 물동이를 버려두고 마을로 달려가 ‘와서 보라’고 외쳤습니다(28-29절). 사람들을 피하던 그녀가 사람들에게 달려간 것입니다. 참된 목마름이 채워지면 우리는 더 이상 숨지 않고, 오히려 다른 이들을 생명의 샘으로 초대하게 됩니다.","생수의 근원이신 주님, 제 깊은 목마름을 채워 주시고 저도 다른 이들을 주님께로 초대하게 하소서."],["요한계시록 21:4","모든 눈물을 그 눈에서 씻기시매 다시 사망이 없고 애통하는 것이나 곡하는 것이나 아픈 것이 다시 있지 아니하리니 처음 것들이 다 지나갔음이러라","소망","새 하늘과 새 땅의 모습입니다. 하나님은 멀리서 눈물을 그치라 명하시는 분이 아니라, 직접 눈물을 닦아 주시는 분입니다.","지금 흘리는 눈물이 있다면, 그 눈물을 닦아 주실 하나님의 손을 기억하세요. 이 땅의 아픔은 마지막이 아닙니다.","하나님이 내 모든 눈물을 닦아 주실 날이 옵니다.","성경의 마지막 장면은 낙원으로 돌아가는 것이 아니라 하나님이 사람들과 함께 거하시는 새 도성입니다. 처음 창조에서 바다는 혼돈의 상징이었는데, 새 하늘과 새 땅에는 ‘바다도 다시 있지 않다’(1절)고 합니다. 모든 혼돈과 눈물이 끝나는 날이 옵니다.","눈물을 닦아 주실 하나님, 지금의 슬픔이 마지막이 아님을 믿게 하시고 새 하늘과 새 땅을 소망하게 하소서."],["시편 16:11","주께서 생명의 길로 내게 보이시리니 주의 앞에는 충만한 기쁨이 있고 주의 우편에는 영원한 즐거움이 있나이다","기쁨","베드로는 오순절 설교에서 이 시편을 예수님의 부활에 대한 예언으로 인용했습니다. 참된 기쁨은 하나님의 임재 안에 있습니다.","기쁨을 찾아 여기저기 헤매기보다, 오늘 잠시 조용히 하나님 앞에 머물러 보세요. 충만한 기쁨은 그 앞에 있습니다.","주님 앞에 충만한 기쁨이 있습니다.","C.S. 루이스는 자신의 회심 이야기를 담은 책에 『예기치 못한 기쁨』이라는 제목을 붙였습니다. 그는 어린 시절부터 갈망하던 그 기쁨이 결국 하나님을 가리키는 표지판이었다고 고백했습니다. 참된 기쁨은 하나님을 향한 갈망 속에서 발견됩니다.","충만한 기쁨이 있는 주님 앞에 머뭅니다. 다른 곳에서 기쁨을 찾아 헤매지 않고 주님 안에서 참된 즐거움을 누리게 하소서."],["신명기 30:19","내가 오늘날 천지를 불러서 너희에게 증거를 삼노라 내가 생명과 사망과 복과 저주를 네 앞에 두었은즉 너와 네 자손이 살기 위하여 생명을 택하고","생명","모세가 가나안을 앞둔 백성에게 마지막으로 촉구한 말씀입니다. 하나님은 선택을 강요하지 않으시지만, 간절히 ‘생명을 택하라’고 권하십니다.","오늘 하루에도 생명을 살리는 선택과 그렇지 않은 선택이 있습니다. 말 한마디, 식습관, 시간 사용에서 생명 쪽을 택해 보세요.","나는 오늘 생명을 택하겠습니다.","모세는 생명을 택하라고 말한 뒤 바로 그 방법을 알려 줍니다. ‘여호와를 사랑하고 그 말씀을 순종하며 그에게 부종하라 그는 네 생명이시요’(20절). 생명을 택한다는 것은 결국 생명이신 하나님께 붙어 있기로 선택하는 것입니다. 선택은 매일, 작은 결정 속에서 이루어집니다.","생명이신 하나님, 오늘 작은 선택들 속에서 생명을 택하게 하시고 주님께 붙어 있게 하소서."],["요한일서 5:12","아들이 있는 자에게는 생명이 있고 하나님의 아들이 없는 자에게는 생명이 없느니라","생명","요한은 영생이 막연한 미래의 상태가 아니라 예수님과의 관계라고 말합니다. 생명은 예수님 안에 있습니다.","나에게 가장 소중한 것이 무엇인지 돌아보세요. 모든 것을 가졌어도 생명의 근원이신 분을 놓치면 안 됩니다.","예수님이 계시기에 내게 생명이 있습니다.","설교자들은 영생을 ‘끝없이 긴 시간’보다 ‘하나님과 함께하는 질적으로 새로운 생명’으로 설명합니다. 요한복음 17장 3절은 영생을 하나님과 예수 그리스도를 ‘아는 것’이라고 정의합니다. 영생은 죽은 뒤에야 시작되는 것이 아니라 오늘 이미 시작됩니다.","영생을 주시는 주님, 영생이 먼 훗날이 아니라 오늘 주님을 아는 것에서 시작됨을 믿고 주님을 더 깊이 알아 가게 하소서."],["골로새서 3:1","그러므로 너희가 그리스도와 함께 다시 살리심을 받았으면 위의 것을 찾으라 거기는 그리스도께서 하나님 우편에 앉아 계시느니라","거룩","부활의 신앙은 삶의 시선을 바꿉니다. ‘위의 것’은 현실 도피가 아니라, 땅의 일을 하늘의 가치로 바라보는 것입니다.","오늘 마음을 빼앗는 걱정과 욕심을 ‘영원의 관점에서도 중요한가?’라는 질문으로 걸러 보세요.","나는 위의 것을 바라보며 땅에서 살아갑니다.","‘위의 것을 찾으라’는 말씀 다음에 바울은 아주 구체적인 땅의 일들을 이야기합니다. 분노와 거짓말을 버리고, 가정과 일터에서 성실하라고 합니다(3:5-4:1). 위의 것을 찾는 사람은 땅을 떠나는 사람이 아니라, 하늘의 가치로 땅의 일을 다르게 하는 사람입니다.","부활하신 주님, 위의 것을 바라보며 땅의 일을 하늘의 가치로 성실히 감당하게 하소서."],["여호수아 24:15","만일 여호와를 섬기는 것이 너희에게 좋지 않게 보이거든 너희 열조가 강 저편에서 섬기던 신이든지 혹 너희의 거하는 땅 아모리 사람의 신이든지 너희 섬길 자를 오늘날 택하라 오직 나와 내 집은 여호와를 섬기겠노라","가정","노년의 여호수아가 백성을 모아 놓고 한 마지막 연설입니다. 남이 어떻게 하든 ‘나와 내 집’은 하나님을 섬기겠다는 가정의 결단입니다.","가정의 달을 시작하며, 우리 집이 함께 지키고 싶은 신앙의 습관(식사 기도, 가정 예배, 감사 나눔) 하나를 정해 보세요.","나와 내 집은 여호와를 섬기겠습니다.","설교자들은 가정을 ‘작은 교회’라고 부릅니다. 예배당에서 드린 예배가 식탁과 거실의 사랑으로 이어질 때 신앙은 다음 세대로 흘러갑니다. 자녀는 부모의 설교보다 부모의 뒷모습을 보고 신앙을 배운다는 말이 있습니다.","가정을 세우신 하나님, 저와 제 집이 주님을 섬기게 하시고 우리 가정이 작은 교회가 되게 하소서."],["시편 127:3","자식들은 여호와의 주신 기업이요 태의 열매는 그의 상급이로다","가정","‘기업’은 하나님이 맡기신 유산을 뜻합니다. 자녀는 부모의 소유가 아니라 하나님이 잠시 맡기신 선물입니다.","자녀를 내 뜻대로 만들려 하기보다, 하나님이 그 아이에게 두신 고유한 계획을 존중해 보세요. 오늘 자녀를 위해 축복 기도를 해 주세요.","내게 맡기신 자녀는 하나님의 선물입니다.","‘기업’은 대대로 물려받는 땅, 곧 하나님이 맡기신 유산을 뜻합니다. 땅의 주인이 하나님이시듯 자녀의 주인도 하나님이십니다. 부모는 소유자가 아니라 청지기입니다. 이 사실을 기억하면 자녀를 향한 지나친 욕심과 불안을 내려놓고, 하나님이 그 아이에게 두신 계획을 존중하게 됩니다.","자녀를 선물로 주신 하나님, 제가 소유자가 아니라 청지기임을 기억하며 주님의 뜻대로 자녀를 사랑하게 하소서."],["잠언 22:6","마땅히 행할 길을 아이에게 가르치라 그리하면 늙어도 그것을 떠나지 아니하리라","가정","‘가르치라’는 단어에는 입맛을 들인다는 뜻도 있습니다. 어려서부터 맛본 신앙과 삶의 태도는 평생을 이끕니다.","아이들은 말보다 본을 보고 배웁니다. 오늘 내가 가르치고 싶은 가치를 먼저 행동으로 보여 주세요.","말이 아니라 삶으로 다음 세대에게 길을 보여 주겠습니다.","‘마땅히 행할 길’은 아이 각자의 기질과 은사에 맞는 길이라고 해석하기도 합니다. 모든 아이를 같은 틀에 맞추는 것이 아니라 그 아이에게 맞는 방식으로 하나님의 길을 보여 주는 것입니다. 좋은 교육은 아이를 부모의 복사본으로 만드는 것이 아니라 하나님이 지으신 그 아이가 되게 돕는 것입니다.","지혜의 하나님, 자녀 각자의 고유한 모습을 존중하며 그에 맞게 주님의 길을 보여 주는 지혜를 주소서."],["시편 128:3","네 집 내실에 있는 네 아내는 결실한 포도나무 같으며 네 상에 둘린 자식은 어린 감람나무 같으리로다","가정","하나님을 경외하는 가정에 주시는 복을 그림처럼 묘사합니다. 함께 둘러앉은 식탁은 하나님이 주시는 복의 상징입니다.","바쁜 가족이 함께 식탁에 모이기 어렵다면, 이번 주 한 끼라도 휴대폰 없이 함께 식사하며 대화해 보세요.","우리 집 식탁이 복의 자리가 되게 하소서.","포도나무와 감람나무는 이스라엘에서 가장 귀한 나무입니다. 감람나무는 오래 자라 수백 년 동안 열매를 맺습니다. 자녀를 ‘어린 감람나무’로 부른 것은 지금은 작아도 오랫동안 복의 열매를 맺을 존재라는 뜻입니다. 식탁에 둘러앉은 가족이 하나님의 복의 그림입니다.","식탁의 복을 주신 하나님, 우리 가족이 함께 둘러앉는 시간을 소중히 여기며 그 자리에서 사랑을 나누게 하소서."],["마가복음 10:14","예수께서 보시고 분히 여겨 이르시되 어린 아이들의 내게 오는 것을 용납하고 금하지 말라 하나님의 나라가 이런 자의 것이니라","가정","제자들이 아이들을 데려오는 사람들을 꾸짖자 예수님이 화를 내셨습니다. 당시 아이들은 사회적으로 무시당하던 존재였지만 예수님은 그들을 품으셨습니다.","어린이날, 아이들의 이야기에 끝까지 귀 기울여 주세요. 주변의 소외된 아이들을 위해서도 기도하고 관심을 가져 보세요.","주님이 아이들을 품으셨듯 나도 아이들을 귀히 여기겠습니다.","당시 랍비들은 바쁜 선생님을 아이들이 방해하지 않도록 막는 것을 당연하게 여겼습니다. 그런데 예수님은 그것을 보고 ‘분히 여기셨다’고 합니다. 복음서에서 예수님이 화를 내셨다고 기록된 드문 장면입니다. 아이들을 소홀히 대하는 것은 예수님을 화나게 하는 일입니다.","아이들을 품으신 주님, 어린이를 귀히 여기는 마음을 주시고 주변의 소외된 아이들에게도 관심을 갖게 하소서."],["마태복음 18:3","가라사대 진실로 너희에게 이르노니 너희가 돌이켜 어린 아이들과 같이 되지 아니하면 결단코 천국에 들어가지 못하리라","겸손","‘누가 크냐’고 다투는 제자들에게 예수님은 어린아이를 세우시고 말씀하십니다. 어린아이처럼 된다는 것은 순진함이 아니라 의존하고 신뢰하는 겸손입니다.","어른이 되면서 잃어버린 신뢰와 감탄을 회복해 보세요. 오늘 아이처럼 하나님께 솔직하게 도움을 구해 보세요.","어린아이처럼 주님을 신뢰하겠습니다.","어린아이는 자신이 작다는 것을 압니다. 그래서 도움을 청하는 것을 부끄러워하지 않습니다. 예수님이 말씀하신 어린아이 같음은 순진함이 아니라 의존입니다. 어른이 될수록 우리는 혼자 할 수 있다고 믿지만, 하나님 나라는 ‘도와주세요’라고 말할 줄 아는 사람에게 열립니다.","하늘 아버지, 어른이 되며 잃어버린 신뢰를 회복하게 하시고 어린아이처럼 주님께 도움을 구하게 하소서."],["에베소서 6:1","자녀들아 주 안에서 너희 부모에게 순종하라 이것이 옳으니라","가정","‘주 안에서’라는 말은 순종의 근거이자 한계입니다. 부모를 존중하는 것은 하나님을 섬기는 일의 일부입니다.","부모님께 순종하는 것이 쉽지 않은 나이라도, 존중하는 말투와 태도는 선택할 수 있습니다. 오늘 부모님께 고맙다는 말을 전해 보세요.","주 안에서 부모님을 존중하겠습니다.","바울은 자녀에게도 직접 말을 겁니다. 당시 편지는 교회에서 낭독되었으니, 아이들도 예배 자리에 함께 있었다는 뜻입니다. 자녀는 교회의 미래가 아니라 지금 교회의 일원입니다. 그리고 자녀의 순종은 부모에 대한 것이기 전에 ‘주 안에서’ 하나님께 드리는 것입니다.","주님, 부모님을 주 안에서 존중하게 하시고 자녀들도 지금 교회의 귀한 일원으로 자라게 하소서."],["출애굽기 20:12","너의 부모를 공경하라 그리하면 너의 하나님 나 여호와가 네게 준 땅에서 너의 생명이 길리라","가정","십계명 중 사람과의 관계에 관한 첫 계명이며, 바울은 이것을 ‘약속 있는 첫 계명’이라 불렀습니다. ‘공경’은 무겁게 여긴다, 곧 귀하게 대한다는 뜻입니다.","어버이날, 부모님께 직접 감사의 마음을 표현해 보세요. 곁에 계시지 않다면 부모님께 받은 사랑을 기억하며 감사 기도를 드려 보세요.","부모님을 귀하게 여기고 공경하겠습니다.","십계명은 두 돌판에 새겨졌는데, 부모 공경은 하나님과의 관계를 다루는 계명 바로 다음에 놓여 있습니다. 부모를 공경하는 것은 하나님을 공경하는 것과 이어져 있습니다. 공경은 무조건적인 순종과는 다릅니다. 부모의 연약함까지 알면서도 그 존재를 귀하게 여기는 것입니다.","부모님을 주신 하나님, 부모님의 수고를 기억하며 공경하게 하시고 그 연약함까지 사랑으로 품게 하소서."],["잠언 23:25","네 부모를 즐겁게 하며 너를 낳은 어미를 기쁘게 하라","가정","지혜로운 자녀는 부모의 기쁨이 됩니다. 부모를 기쁘게 하는 것은 비싼 선물보다 바르게 사는 삶입니다.","오늘 부모님께 안부 전화를 드리고 근황을 나눠 보세요. 자녀의 목소리 자체가 부모님께 큰 기쁨이 됩니다.","나의 삶이 부모님의 기쁨이 되게 하소서.","부모를 가장 기쁘게 하는 것은 비싼 선물보다 자녀가 바르게 사는 모습입니다. 잠언의 아버지도 바로 앞 절에서 ‘의인의 아비는 크게 즐거울 것’이라고 말합니다. 부모님이 바라시는 것은 대단한 성공보다 자녀가 하나님 앞에서 정직하게 사는 것입니다.","주님, 제 삶이 부모님께 기쁨이 되게 하시고 하나님 앞에서 정직하게 살게 하소서."],["잠언 1:8","내 아들아 네 아비의 훈계를 들으며 네 어미의 법을 떠나지 말라","가정","잠언은 아버지와 어머니가 함께 자녀를 가르치는 모습으로 시작합니다. 부모의 가르침은 자녀의 머리를 꾸미는 아름다운 관이 된다고 이어집니다.","부모님께 들었던 잔소리 중 지금 생각하니 옳았던 말 한 가지를 떠올려 보세요. 그 지혜를 오늘 실천해 보세요.","부모님께 받은 지혜를 소중히 간직하겠습니다.","잠언은 아버지의 훈계와 어머니의 법을 함께 말합니다. 고대 사회에서 어머니의 가르침을 아버지와 나란히 둔 것은 의미 있는 일입니다. 가정의 신앙 교육은 한 사람의 몫이 아니라 함께 지는 책임입니다. 부모의 가르침은 9절의 말처럼 자녀의 머리에 씌우는 아름다운 관이 됩니다.","주님, 부모님께 받은 지혜를 소중히 간직하게 하시고 저도 다음 세대에게 아름다운 가르침을 전하게 하소서."],["에베소서 6:4","또 아비들아 너희 자녀를 노엽게 하지 말고 오직 주의 교양과 훈계로 양육하라","가정","가부장적 권위가 당연하던 시대에 바울은 아버지들에게 자녀를 화나게 하지 말라고 권합니다. 양육은 통제가 아니라 주님의 방식으로 기르는 것입니다.","자녀에게 감정적으로 화를 낸 일이 있다면 오늘 먼저 사과해 보세요. 부모의 사과는 자녀에게 큰 신앙 교육이 됩니다.","주님의 방법으로 자녀를 양육하겠습니다.","‘노엽게 하지 말라’는 말은 부모의 권위를 부정하는 것이 아니라 그 권위의 쓰임을 바로잡는 것입니다. 하나님이 우리를 대하시는 방식, 오래 참으시고 다시 기회를 주시는 그 방식이 ‘주의 교양과 훈계’입니다. 부모는 하나님이 자신을 양육하신 방식으로 자녀를 양육하도록 부름받았습니다.","오래 참으시는 하나님, 주님이 저를 대하신 방식으로 자녀를 양육하게 하시고 감정적인 말을 절제하게 하소서."],["룻기 1:16","룻이 가로되 나로 어머니를 떠나며 어머니를 따르지 말고 돌아가라 강권하지 마옵소서 어머니께서 가시는 곳에 나도 가고 어머니께서 유숙하시는 곳에서 나도 유숙하겠나이다 어머니의 백성이 나의 백성이 되고 어머니의 하나님이 나의 하나님이 되시리니","가정","남편을 잃은 모압 여인 룻이 같은 처지의 시어머니 나오미를 떠나지 않겠다고 한 고백입니다. 혈연을 넘어선 신실한 사랑이 다윗 왕가의 뿌리가 되었습니다.","가족이란 피를 나눈 사이만이 아닙니다. 오늘 외로운 이웃이나 어르신에게 가족 같은 관심을 건네 보세요.","나는 끝까지 곁을 지키는 신실한 사랑을 하겠습니다.","룻은 이방 여인이었지만 이 고백으로 하나님 백성의 일원이 되었고, 결국 다윗과 예수님의 족보에 이름을 올렸습니다(마 1:5). 피가 아니라 신실한 사랑이 그녀를 가족으로 만들었습니다. 하나님의 가족은 혈연이 아니라 신실함으로 이어집니다.","신실하신 하나님, 룻처럼 끝까지 곁을 지키는 사랑을 하게 하시고 외로운 이웃에게 가족이 되어 주게 하소서."],["에베소서 5:25","남편들아 아내 사랑하기를 그리스도께서 교회를 사랑하시고 위하여 그 몸을 주심 같이 하라","가정","바울은 남편에게 아내를 사랑하되 ‘그리스도께서 교회를 위해 자신을 내어 주신 것처럼’ 하라고 합니다. 이는 권위가 아니라 희생의 사랑입니다.","배우자를 위해 오늘 내가 내려놓을 수 있는 것은 무엇일까요? 작은 집안일 하나, 경청하는 30분이 사랑의 표현입니다.","그리스도의 사랑처럼 자신을 내어 주는 사랑을 하겠습니다.","바울은 아내에게 한 문장으로 말하고, 남편에게는 아홉 절에 걸쳐 말합니다(22-33절). 그만큼 남편의 책임을 무겁게 보았다는 뜻입니다. 그리고 그 기준은 그리스도의 자기희생입니다. 가정에서의 리더십은 지배가 아니라 먼저 내어 주는 사랑입니다.","자신을 내어 주신 주님, 가정 안에서 먼저 내어 주고 섬기는 사랑을 실천하게 하소서."],["잠언 31:10","누가 현숙한 여인을 찾아 얻겠느냐 그 값은 진주보다 더 하니라","가정","잠언의 마지막 장은 지혜롭고 성실한 여인을 노래합니다. ‘현숙한’은 강하고 유능하다는 뜻도 담고 있어, 가정을 세우는 힘 있는 인격을 칭찬합니다.","가정을 위해 묵묵히 수고하는 사람에게 오늘 구체적으로 감사와 인정을 표현해 보세요.","가정을 세우는 수고에 감사하며 서로를 귀히 여기겠습니다.","잠언 31장의 여인은 장사를 하고, 밭을 사고, 가난한 자를 돕고, 지혜롭게 가르칩니다. 그녀는 집 안에만 머무는 사람이 아니라 가정과 사회를 함께 세우는 사람입니다. 그리고 그 모든 것의 뿌리를 30절은 ‘여호와를 경외하는 것’이라고 말합니다.","주님, 가정을 세우는 모든 수고를 귀히 여기게 하시고 그 뿌리가 주님을 경외하는 마음에 있게 하소서."],["디모데후서 3:14","그러나 너는 배우고 확신한 일에 거하라 너는 네가 뉘게서 배운 것을 알며","가정","바울은 영적 아들 디모데에게, 무엇을 배웠는지뿐 아니라 ‘누구에게서’ 배웠는지 기억하라고 합니다. 가르침은 가르친 사람의 삶과 함께 전해집니다.","스승의 날, 내 신앙과 인생에 영향을 준 선생님을 떠올리고 감사 메시지를 보내 보세요.","나를 가르쳐 준 이들에게 감사하며 배운 것을 지키겠습니다.","디모데는 어려서부터 성경을 알았습니다(15절). 바울은 그 배움을 기억하라고 하며 가르쳐 준 사람들을 떠올리게 합니다. 좋은 스승은 지식뿐 아니라 삶을 전합니다. 그래서 무엇을 배웠는지와 함께 누구에게 배웠는지가 중요합니다.","좋은 스승들을 보내 주신 하나님, 저를 가르친 이들에게 감사하며 배운 것을 지키고 저도 좋은 본이 되게 하소서."],["골로새서 3:21","아비들아 너희 자녀를 격노케 말찌니 낙심할까 함이라","가정","지나친 요구와 비판은 자녀를 낙심하게 만듭니다. 바울은 자녀의 마음이 꺾이지 않도록 배려하라고 부모에게 권합니다.","오늘 자녀나 아랫사람에게 지적보다 격려를 세 배 더 해 보세요. 칭찬은 마음을 일으키는 힘입니다.","격려로 다음 세대의 마음을 세우겠습니다.","사람의 마음은 비판보다 격려에 더 빨리 반응합니다. 바울이 굳이 ‘낙심할까 함이라’는 이유를 덧붙인 것은 자녀의 마음이 꺾이는 것을 하나님이 얼마나 염려하시는지를 보여 줍니다. 부모의 한마디가 아이의 평생 자기 이해를 만들 수 있습니다.","격려의 하나님, 자녀와 아랫사람에게 비판보다 격려를 더 많이 하게 하시고 그들의 마음을 세우게 하소서."],["베드로전서 3:7","남편들아 이와 같이 지식을 따라 너희 아내와 동거하고 저는 더 연약한 그릇이요 또 생명의 은혜를 유업으로 함께 받을 자로 알아 귀히 여기라 이는 너희 기도가 막히지 아니하게 하려 함이라","가정","‘지식을 따라’는 배우자를 깊이 이해하며 함께 살라는 뜻입니다. 부부는 ‘생명의 은혜를 함께 받을 동역자’이며, 부부 관계가 기도에까지 영향을 미친다고 말합니다.","배우자의 요즘 고민과 기쁨을 알고 있나요? 오늘 질문하고 경청하는 시간을 가져 보세요.","배우자를 이해하고 귀히 여기는 동역자가 되겠습니다.","베드로는 부부를 ‘생명의 은혜를 함께 이어받을 자’라고 부릅니다. 하나님 앞에서 남편과 아내는 동등한 상속자입니다. 그리고 부부 관계가 바르지 않으면 기도가 막힌다고까지 말합니다. 하나님과의 관계와 배우자와의 관계는 따로 떨어져 있지 않습니다.","부부를 동역자로 세우신 하나님, 배우자를 이해하고 귀히 여기게 하시며 함께 드리는 기도가 막히지 않게 하소서."],["잠언 31:28","그 자식들은 일어나 사례하며 그 남편은 칭찬하기를","가정","현숙한 여인의 가족들이 그녀에게 감사와 칭찬을 돌리는 장면입니다. 수고에 대한 감사와 인정은 가정을 더욱 단단하게 합니다.","가족에게 ‘당연하다’고 여기던 수고를 하나 찾아 오늘 소리 내어 칭찬해 보세요.","가족의 수고를 당연히 여기지 않고 감사하겠습니다.","가족의 칭찬을 받는 사람은 대단한 일을 한 사람이 아니라 매일 성실했던 사람입니다. 잠언 31장의 여인은 ‘새벽 미명에 일어나’(15절) 가족을 돌보았습니다. 그 보이지 않는 수고를 가족이 알아보고 감사할 때 가정은 더욱 단단해집니다.","주님, 가족의 보이지 않는 수고를 알아보고 감사를 표현하는 사람이 되게 하소서."],["잠언 17:6","손자는 노인의 면류관이요 아비는 자식의 영화니라","가정","세대가 서로에게 자랑과 영광이 되는 아름다운 그림입니다. 조부모와 손주, 부모와 자녀가 서로를 빛나게 합니다.","조부모님이나 어르신과 함께 시간을 보내며 옛이야기를 들어 보세요. 세대 간 대화는 서로에게 면류관이 됩니다.","세대와 세대가 서로를 빛내는 가정이 되게 하소서.","면류관은 승리와 명예의 상징입니다. 손자는 노인의 면류관이고, 아버지는 자녀의 자랑입니다. 세대가 서로를 부끄러워하지 않고 자랑스러워하는 것이 하나님이 원하시는 가정입니다. 세대 간의 대화가 끊어진 시대에, 서로를 존중하는 가정은 그 자체로 복음의 증거입니다.","세대를 이어 가시는 하나님, 우리 가정의 세대들이 서로를 자랑스러워하며 존중하게 하소서."],["신명기 6:6-7","오늘날 내가 네게 명하는 이 말씀을 너는 마음에 새기고 네 자녀에게 부지런히 가르치며 집에 앉았을 때에든지 길에 행할 때에든지 누웠을 때에든지 일어날 때에든지 이 말씀을 강론할 것이며","가정","유대인들이 매일 고백하는 ‘쉐마’의 일부입니다. 신앙 교육은 정해진 시간만이 아니라 일상의 모든 순간에 이루어져야 한다고 말합니다.","등굣길, 잠자리, 식사 시간처럼 일상의 순간에 자녀와 짧게 말씀을 나눠 보세요. 신앙은 생활 속에서 자랍니다.","말씀을 마음에 새기고 일상에서 나누겠습니다.","‘강론하다’는 반복해서 말한다는 뜻입니다. 앉았을 때, 길을 갈 때, 누울 때, 일어날 때—이것은 하루의 모든 순간입니다. 신앙 교육은 주일학교에 맡기는 것이 아니라 일상의 대화 속에서 이루어집니다. 아이들은 특별한 시간보다 평범한 시간에 더 많이 배웁니다.","주님, 말씀을 마음에 새기게 하시고 일상의 평범한 순간마다 자녀와 함께 말씀을 나누게 하소서."],["창세기 2:24","이러므로 남자가 부모를 떠나 그 아내와 연합하여 둘이 한 몸을 이룰찌로다","가정","창조 때 하나님이 세우신 결혼의 원리입니다. 부모를 ‘떠나’ 새 가정을 이루고, ‘연합하여’ 한 몸이 되는 것이 결혼의 신비입니다.","부부의 날, 배우자와 처음 만났을 때를 이야기하며 감사를 나눠 보세요. 결혼은 매일 새롭게 하나 되어 가는 여정입니다.","둘이 한 몸 되게 하신 하나님의 뜻을 소중히 지키겠습니다.","본회퍼는 감옥에서 조카의 결혼을 위해 쓴 설교에서, 이제부터는 두 사람의 사랑이 결혼을 지탱하는 것이 아니라 결혼이 두 사람의 사랑을 지탱한다는 취지로 말했습니다. 사랑은 감정이기 전에 하나님 앞에서 맺은 약속이며, 그 약속이 흔들리는 날의 사랑을 붙들어 줍니다.","둘이 한 몸 되게 하신 하나님, 우리 부부가 날마다 새롭게 하나 되어 가게 하시고 약속으로 사랑을 지키게 하소서."],["전도서 4:12","한 사람이면 패하겠거니와 두 사람이면 능히 당하나니 삼겹줄은 쉽게 끊어지지 아니하느니라","가정","혼자보다 둘이 낫다는 지혜의 결론입니다. 많은 주례자들이 ‘삼겹줄’을 남편과 아내, 그리고 그 가운데 계신 하나님으로 풀어 축복합니다.","가정이나 공동체에서 혼자 버티고 있다면 도움을 요청해 보세요. 함께할 때 우리는 훨씬 강해집니다.","하나님과 함께 엮인 삼겹줄은 끊어지지 않습니다.","한 줄은 쉽게 끊어지지만 세 줄을 꼬아 만든 줄은 끊기 어렵습니다. 전도자는 혼자 일하며 쌓기만 하는 사람의 허무함을 이야기한 뒤 이 말씀을 합니다(8절). 성공보다 함께하는 사람이 더 귀합니다. 가정과 우정 속에 하나님을 모실 때 그 관계는 더욱 단단해집니다.","함께하시는 하나님, 우리 관계 속에 주님을 모셔 끊어지지 않는 삼겹줄이 되게 하소서."],["시편 133:1","보라 형제가 연합하여 동거함이 어찌 그리 선하고 아름다운고","가정","성전에 올라가는 순례자들이 함께 부르던 노래입니다. 형제가 하나 되어 사는 모습을 아론의 머리에 부은 향기로운 기름과 헐몬산의 이슬에 비유합니다.","형제자매나 가족과 서먹해진 관계가 있다면 오늘 먼저 안부를 물어 보세요. 연합은 누군가의 첫걸음에서 시작됩니다.","하나 되어 사는 아름다움을 내가 먼저 만들겠습니다.","시인은 형제의 연합을 대제사장 아론의 머리에 부어 수염과 옷깃까지 흘러내리는 기름에 비유합니다. 연합은 위에서부터 아래로 흘러내리는 은혜입니다. 그리고 마지막 절은 ‘거기서 여호와께서 복을 명하셨다’고 말합니다. 하나 되는 곳에 하나님의 복이 머뭅니다.","하나 되게 하시는 하나님, 우리 가정과 공동체가 연합하게 하시고 그곳에 주님의 복이 머물게 하소서."],["잠언 14:1","무릇 지혜로운 여인은 그 집을 세우되 미련한 자는 자기 손으로 그것을 허느니라","가정","가정은 저절로 세워지지 않습니다. 같은 손이 지혜롭게 쓰이면 집을 세우고, 미련하게 쓰이면 무너뜨립니다.","오늘 나의 말과 행동이 가정을 세우고 있는지 허물고 있는지 돌아보세요. 비난 대신 격려의 말로 집을 세워 보세요.","나의 손과 말로 가정을 세우겠습니다.","집을 허무는 것은 거창한 사건보다 작은 말과 습관인 경우가 많습니다. 무시하는 말투, 반복되는 불평, 지켜지지 않는 약속이 벽돌을 하나씩 빼냅니다. 반대로 작은 감사, 따뜻한 인사, 지켜진 약속이 집을 세웁니다. 지혜로운 사람은 매일 벽돌 하나씩을 쌓습니다.","주님, 제 말과 습관이 가정을 허물지 않고 세우게 하소서. 오늘 작은 벽돌 하나를 쌓게 하소서."],["디모데전서 5:8","누구든지 자기 친족 특히 자기 가족을 돌아보지 아니하면 믿음을 배반한 자요 불신자보다 더 악한 자니라","가정","가까운 가족을 돌보는 것은 신앙의 기본입니다. 교회 봉사나 사회 활동이 가족을 소홀히 하는 핑계가 되어서는 안 된다는 경고입니다.","바쁘다는 이유로 가족에게 소홀하지는 않았나요? 오늘 가족을 위한 시간을 우선순위에 두어 보세요.","가장 가까운 가족부터 사랑으로 돌보겠습니다.","바울은 교회가 과부를 돌보는 문제를 다루며, 먼저 가족이 책임지라고 말합니다(4절). 신앙은 멀리 있는 사람을 돕는 것만이 아니라 가장 가까운 사람을 책임지는 데서 증명됩니다. 가족을 돌보는 일은 사소한 일이 아니라 믿음의 기본입니다.","주님, 가장 가까운 가족을 먼저 사랑으로 돌보게 하시고 바쁨을 핑계로 소홀하지 않게 하소서."],["이사야 66:13","어미가 자식을 위로함 같이 내가 너희를 위로할 것인즉 너희가 예루살렘에서 위로를 받으리니","평안","하나님은 자신을 아이를 품에 안고 달래는 어머니에 비유하십니다. 하나님의 위로는 따뜻하고 섬세합니다.","어머니의 품 같은 위로가 필요한 날이라면, 하나님 앞에서 마음껏 울어도 괜찮습니다. 그분은 나를 품에 안으십니다.","어머니처럼 나를 품어 위로하시는 하나님을 의지합니다.","성경은 하나님을 아버지로 부를 뿐 아니라 어머니의 모습으로도 그립니다. 이사야는 젖 먹는 아이를 무릎에 앉히고 어르는 어머니를 떠올리게 합니다(12절). 하나님의 위로는 멀리서 내리는 지시가 아니라 품에 안고 다독이는 손길입니다.","어머니처럼 품으시는 하나님, 지친 저를 품에 안아 위로하시고 저도 누군가를 그렇게 품게 하소서."],["시편 103:13","아비가 자식을 불쌍히 여김 같이 여호와께서 자기를 경외하는 자를 불쌍히 여기시나니","은혜","이어지는 14절은 ‘이는 저가 우리의 체질을 아시며 우리가 진토임을 기억하심이로다’라고 말합니다. 하나님은 우리의 연약함
