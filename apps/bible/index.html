을 아시고 아버지처럼 긍휼히 여기십니다.","나 자신에게 너무 엄격하지는 않나요? 하나님이 나를 대하시는 긍휼의 눈으로 오늘 나 자신과 가족을 바라보세요.","아버지처럼 나를 긍휼히 여기시는 하나님께 감사합니다.","‘불쌍히 여기다’라는 히브리어는 ‘태’(자궁)라는 단어와 뿌리가 같습니다. 하나님의 긍휼은 어머니가 자기 몸에서 난 자식을 향해 느끼는 깊은 애틋함과 같습니다. 그리고 다음 절은 하나님이 우리의 체질을 아시며 우리가 먼지임을 기억하신다고 말합니다.","긍휼의 하나님, 저의 약함을 아시는 주님 앞에서 안심하게 하시고 저도 가족을 긍휼의 눈으로 보게 하소서."],["레위기 19:32","너는 센 머리 앞에 일어서고 노인의 얼굴을 공경하며 네 하나님을 경외하라 나는 여호와니라","가정","노인을 공경하는 것을 하나님을 경외하는 것과 나란히 두었습니다. 어른을 존중하는 것은 신앙의 표현입니다.","오늘 만나는 어르신께 먼저 인사하고 자리를 양보해 보세요. 연로한 가족에게 안부 전화를 드리는 것도 좋습니다.","어르신을 공경하는 것으로 하나님을 경외하겠습니다.","‘센 머리 앞에 일어서라’는 계명 바로 뒤에는 ‘네 하나님을 경외하라’가 붙어 있습니다. 노인을 공경하는 것이 하나님을 경외하는 일과 직결되어 있다는 뜻입니다. 빠르게 변하는 세상에서 어른의 지혜는 쉽게 무시되지만, 하나님은 오랜 세월을 견딘 삶을 귀하게 보십니다.","주님, 어르신들의 삶과 지혜를 귀히 여기게 하시고 그분들을 공경함으로 주님을 경외하게 하소서."],["잠언 20:7","완전히 행하는 자가 의인이라 그 후손에게 복이 있느니라","가정","부모의 정직하고 바른 삶은 자녀에게 물려줄 수 있는 가장 큰 유산입니다.","재산보다 더 귀한 유산은 정직한 삶입니다. 오늘 아무도 보지 않는 곳에서도 정직하게 행동해 보세요.","정직한 삶을 다음 세대의 유산으로 남기겠습니다.","‘완전히 행한다’는 흠이 하나도 없다는 뜻이 아니라 한결같이 정직하다는 뜻입니다. 자녀는 부모의 말보다 부모의 일관성을 보고 자랍니다. 집 안과 밖에서 같은 사람이 되는 것, 그것이 자녀에게 물려줄 수 있는 가장 큰 유산입니다.","정직하신 하나님, 집 안과 밖에서 같은 사람이 되게 하시고 자녀에게 정직한 삶을 유산으로 남기게 하소서."],["디모데후서 1:5","이는 네 속에 거짓이 없는 믿음이 있음을 생각함이라 이 믿음은 먼저 네 외조모 로이스와 네 어머니 유니게 속에 있더니 네 속에도 있는 줄을 확신하노라","가정","디모데의 믿음은 외할머니와 어머니에게서 이어진 것이었습니다. 신앙은 가정에서 세대를 따라 흐릅니다.","나에게 믿음을 전해 준 사람을 떠올려 감사하고, 내가 믿음을 전할 다음 사람을 위해 기도해 보세요.","받은 믿음을 다음 세대로 전하겠습니다.","18세기 영국의 수잔나 웨슬리는 많은 자녀를 키우는 고단한 형편 속에서도, 자녀 한 명 한 명과 따로 시간을 내어 신앙을 나누었다고 전해집니다. 그 자녀 가운데 감리교 운동을 일으킨 존 웨슬리와 수많은 찬송을 지은 찰스 웨슬리가 있었습니다. 한 어머니의 성실함이 한 시대의 부흥으로 이어졌습니다.","믿음의 유산을 주신 하나님, 제게 믿음을 전해 준 이들에게 감사하며 저도 다음 세대에게 믿음을 전하게 하소서."],["사도행전 16:31","가로되 주 예수를 믿으라 그리하면 너와 네 집이 구원을 얻으리라 하고","가정","빌립보 감옥에서 바울과 실라가 간수에게 한 말입니다. 그날 밤 간수와 그의 온 가족이 세례를 받고 함께 기뻐했습니다.","아직 신앙을 갖지 않은 가족이 있다면 포기하지 말고 이름을 불러 기도해 보세요. 한 사람의 믿음이 온 가정의 복이 됩니다.","나와 내 집이 함께 구원의 기쁨을 누리게 하소서.","빌립보의 간수는 그날 밤 바울과 실라의 상처를 씻어 주고 자기 집으로 데려가 음식을 대접했습니다(33-34절). 구원은 한 사람의 마음에서 시작되어 그 집의 식탁으로 이어졌습니다. 가정의 달을 마치며, 우리 집 식탁이 구원의 기쁨을 나누는 자리가 되기를 소망합니다.","구원의 하나님, 저와 제 집이 함께 구원의 기쁨을 누리게 하시고 아직 믿지 않는 가족에게도 은혜를 베풀어 주소서."],["마태복음 11:28","수고하고 무거운 짐 진 자들아 다 내게로 오라 내가 너희를 쉬게 하리라","평안","율법의 짐과 삶의 무게에 눌린 사람들을 향한 예수님의 초대입니다. 이어지는 말씀에서 예수님은 자신의 멍에는 쉽고 짐은 가볍다고 하십니다.","지쳐 있다면 해결책을 찾기 전에 먼저 예수님께 가 보세요. 오늘 잠들기 전, 하루의 짐을 하나하나 말씀드리고 내려놓으세요.","무거운 짐을 주님께 내려놓고 참된 쉼을 누립니다.","어거스틴은 『고백록』 첫머리에서, 하나님이 우리를 당신을 향하도록 지으셨기에 우리 마음은 하나님 안에서 쉬기까지 쉼을 얻지 못한다고 고백했습니다. 1,600년이 지난 지금도 이 고백은 유효합니다. 휴가와 여가로도 채워지지 않는 깊은 피로는, 영혼이 돌아갈 곳을 찾고 있다는 신호일 수 있습니다.","쉼을 주시는 주님, 수고하고 무거운 짐을 진 채로 주님께 나아갑니다. 제 영혼이 주님 안에서 참된 쉼을 얻게 하소서."],["요한복음 14:27","평안을 너희에게 끼치노니 곧 나의 평안을 너희에게 주노라 내가 너희에게 주는 것은 세상이 주는 것 같지 아니하니라 너희는 마음에 근심도 말고 두려워하지도 말라","평안","십자가를 앞두고 제자들에게 남기신 유산입니다. 세상의 평안은 상황이 좋을 때 오지만, 예수님의 평안은 폭풍 속에서도 주어집니다.","불안한 소식이 많은 날, 상황이 바뀌기를 기다리기 전에 주님의 평안을 먼저 구해 보세요.","세상이 줄 수 없는 주님의 평안이 내 안에 있습니다.","예수님이 이 평안을 말씀하신 것은 십자가에 달리시기 전날 밤이었습니다. 배신과 체포가 몇 시간 뒤에 기다리고 있었습니다. 세상의 평안은 문제가 없어야 오지만, 예수님의 평안은 문제 한가운데서 주어집니다. 그것은 상황이 아니라 아버지에 대한 신뢰에서 나오는 평안입니다.","평안을 주시는 주님, 세상이 줄 수 없는 주님의 평안으로 근심하는 제 마음을 지켜 주소서."],["빌립보서 4:6-7","아무 것도 염려하지 말고 다만 모든 일에 기도와 간구로, 너희 구할 것을 감사함으로 하나님께 아뢰라 그리하면 모든 지각에 뛰어난 하나님의 평강이 그리스도 예수 안에서 너희 마음과 생각을 지키시리라","평안","감옥에 갇힌 바울이 쓴 편지입니다. 염려의 해독제는 ‘감사가 담긴 기도’이며, 그때 하나님의 평강이 마음을 지키는 파수꾼이 됩니다.","걱정 목록을 적어 보고 하나씩 기도로 바꿔 보세요. 각 기도 끝에 감사 한 가지를 덧붙이면 마음이 달라집니다.","염려 대신 감사로 기도합니다. 하나님의 평강이 나를 지키십니다.","‘지키리라’는 말은 군대가 성을 지키는 모습입니다. 감옥에 갇힌 바울은 매일 로마 군인이 지키는 것을 보았을 것입니다. 그는 하나님의 평강이 그렇게 우리의 마음과 생각을 지키는 파수꾼이 된다고 말합니다. 염려가 침입하려 할 때 감사의 기도가 그 문을 지킵니다.","평강의 하나님, 염려 대신 감사로 기도합니다. 주님의 평강이 제 마음과 생각을 지키게 하소서."],["이사야 26:3","주께서 심지가 견고한 자를 평강하고 평강하도록 지키시리니 이는 그가 주를 의뢰함이니이다","평안","히브리어 원문은 ‘샬롬 샬롬’으로, 완전한 평강을 뜻합니다. 평강의 비결은 마음을 하나님께 단단히 고정하는 것입니다.","생각이 이리저리 흔들릴 때, 하나님의 약속 한 구절을 정해 반복해서 묵상해 보세요. 마음의 닻이 됩니다.","주님께 마음을 고정하니 완전한 평강이 있습니다.","‘심지가 견고한 자’는 마음이 한곳에 기대어 있는 사람입니다. 흔들리는 배에서 멀리 있는 등대를 바라보면 멀미가 줄어든다고 합니다. 가까운 파도만 보면 마음이 요동하지만, 변하지 않는 한 점을 바라보면 중심을 잡을 수 있습니다. 하나님께 마음을 고정할 때 평강이 찾아옵니다.","변함없는 하나님, 흔들리는 상황이 아니라 주님께 제 마음을 고정하게 하시고 완전한 평강을 누리게 하소서."],["시편 23:4","내가 사망의 음침한 골짜기로 다닐찌라도 해를 두려워하지 않을 것은 주께서 나와 함께 하심이라 주의 지팡이와 막대기가 나를 안위하시나이다","평안","시편 23편은 이 구절에서 ‘그’에서 ‘주’로, 하나님에 대한 이야기에서 하나님께 드리는 고백으로 바뀝니다. 가장 어두운 골짜기에서 하나님은 더 가까이 계십니다.","지금 어두운 골짜기를 지나고 있다면, 골짜기는 ‘지나가는’ 곳임을 기억하세요. 주님이 함께 걸으십니다.","어두운 골짜기에서도 주님이 함께하시니 두렵지 않습니다.","‘지팡이와 막대기’는 목자의 도구입니다. 막대기는 맹수를 쫓는 무기이고, 지팡이는 구덩이에 빠진 양을 끌어올리는 갈고리입니다. 어두운 골짜기에서 목자는 보호와 구조를 동시에 하십니다. 그 소리가 들리는 것만으로도 양은 안심합니다.","나의 목자 되신 주님, 어두운 골짜기에서도 주님의 지팡이와 막대기로 저를 지키시고 안심하게 하소서."],["시편 34:18","여호와는 마음이 상한 자에게 가까이 하시고 중심에 통회하는 자를 구원하시는도다","평안","다윗이 사울을 피해 도망 다니며 미친 척까지 해야 했던 비참한 시절에 쓴 시입니다. 하나님은 상처 입은 사람에게 더 가까이 오십니다.","마음이 무너진 날, 하나님이 멀리 계신다고 느껴질 수 있지만 사실은 가장 가까이 계십니다. 그 곁에서 마음껏 털어놓으세요.","상한 마음 곁에 주님이 가까이 계십니다.","하나님은 마음이 상한 사람에게서 멀어지시는 것이 아니라 가까이 오십니다. 의사가 가장 아픈 환자에게 먼저 가듯, 하나님은 가장 아픈 마음을 먼저 찾으십니다. 무너진 것 같은 순간이 하나님이 가장 가까이 계신 순간일 수 있습니다.","상한 마음 곁에 계신 하나님, 무너진 제 마음에 가까이 오셔서 위로하시고 다시 일으켜 주소서."],["시편 147:3","상심한 자를 고치시며 저희 상처를 싸매시는도다","평안","다음 절에서 하나님은 별의 수를 세시고 이름을 부르신다고 노래합니다. 우주를 다스리시는 하나님이 동시에 한 사람의 상처를 싸매시는 분입니다.","말하지 못한 상처가 있다면 오늘 하나님께 구체적으로 이야기해 보세요. 필요하다면 믿을 만한 사람이나 상담가의 도움을 받는 것도 하나님의 치유 방법입니다.","별을 세시는 하나님이 내 상처를 싸매십니다.","시편 147편은 하나님이 예루살렘을 세우시고 흩어진 사람들을 모으신다는 노래로 시작합니다. 그리고 곧바로 상처 입은 마음을 싸매신다고 합니다. 도시를 재건하시는 하나님은 한 사람의 마음도 재건하십니다. 하나님의 치유는 거대한 계획과 세밀한 손길을 모두 포함합니다.","상한 자를 고치시는 하나님, 말하지 못한 제 상처도 주님 앞에 내어놓습니다. 저를 싸매어 고쳐 주소서."],["고린도후서 1:3-4","찬송하리로다 그는 우리 주 예수 그리스도의 하나님이시요 자비의 아버지시요 모든 위로의 하나님이시며 우리의 모든 환난 중에서 우리를 위로하사 우리로 하여금 하나님께 받는 위로로써 모든 환난 중에 있는 자들을 능히 위로하게 하시는 이시로다","평안","하나님의 위로는 받는 것으로 끝나지 않고 흘러가야 합니다. 고난을 겪은 사람만이 줄 수 있는 위로가 있습니다.","내가 겪었던 아픔을 지금 겪고 있는 사람이 주변에 있나요? 오늘 그에게 위로의 말을 건네 보세요.","위로받은 나는 이제 누군가의 위로가 되겠습니다.","바울은 하나님을 ‘모든 위로의 하나님’이라고 부릅니다. 그런데 이 위로는 고난을 없애 주는 것이 아니라 고난 속에서 함께하는 것입니다. ‘위로’라는 단어에는 ‘곁에 부름받아 오다’라는 뜻이 있습니다. 하나님이 우리 곁에 오시듯, 우리도 고난받는 이의 곁에 가는 사람이 됩니다.","모든 위로의 하나님, 제가 받은 위로를 기억하며 고난 중에 있는 이웃 곁에 머무는 사람이 되게 하소서."],["베드로전서 5:7","너희 염려를 다 주께 맡겨 버리라 이는 저가 너희를 권고하심이니라","평안","‘맡겨 버리라’는 짐을 던져 놓는다는 뜻입니다. ‘권고하신다’는 돌보신다, 신경 쓰신다는 뜻으로, 하나님은 우리 일에 관심이 많으십니다.","가장 큰 걱정 하나를 종이에 적은 뒤 ‘주님께 맡깁니다’라고 쓰고 접어 보세요. 다시 걱정이 떠오를 때 그 종이를 기억하세요.","나의 모든 염려를 주님께 맡겨 버립니다.","바로 앞 절은 ‘하나님의 능하신 손 아래서 겸손하라’고 말합니다. 염려를 맡기는 것은 겸손과 연결되어 있습니다. 모든 것을 내가 해결해야 한다는 생각은 사실 교만의 한 모습일 수 있습니다. 하나님께 맡긴다는 것은 내가 하나님이 아니라는 것을 인정하는 것입니다.","저를 돌보시는 하나님, 모든 것을 제가 해결하려는 마음을 내려놓고 저의 모든 염려를 주님께 맡깁니다."],["시편 55:22","네 짐을 여호와께 맡겨 버리라 너를 붙드시고 의인의 요동함을 영영히 허락지 아니하시리로다","평안","가까운 친구에게 배신당한 아픔 속에서 다윗이 쓴 시입니다. 사람에게 실망했을 때도 하나님은 나를 붙드십니다.","사람에게 받은 상처가 크다면, 그 상처를 반복해서 곱씹기보다 하나님께 맡겨 보세요. 하나님은 나를 넘어지지 않게 붙드십니다.","나를 붙드시는 주님께 짐을 맡깁니다.","이 시편에서 다윗은 함께 성전에 다니던 가까운 친구에게 배신당했다고 말합니다(13-14절). 원수의 공격보다 친구의 배신이 더 아픕니다. 다윗은 그 아픔을 숨기지 않고 하나님께 다 쏟아놓은 뒤 이 고백에 이릅니다. 맡기는 것은 감정을 억누르는 것이 아니라 하나님 앞에 정직하게 쏟아놓는 것입니다.","저를 붙드시는 하나님, 사람에게 받은 상처를 정직하게 주님께 쏟아놓습니다. 제가 넘어지지 않게 붙들어 주소서."],["시편 4:8","내가 평안히 눕고 자기도 하리니 나를 안전히 거하게 하시는 이는 오직 여호와시니이다","평안","아들 압살롬에게 쫓기던 다윗의 저녁 기도로 알려진 시편입니다. 위험한 상황에서도 하나님을 신뢰하는 사람은 평안히 잠들 수 있습니다.","걱정으로 잠 못 이루는 밤이라면, 잠들기 전 휴대폰을 내려놓고 이 구절을 기도로 드려 보세요.","오늘 밤 나를 지키시는 주님 안에서 평안히 잠듭니다.","잠은 하나님을 신뢰하는 행위입니다. 우리가 잠들어 있는 동안에도 세상은 돌아가고, 하나님은 졸지도 주무시지도 않으십니다(시 121:4). 다윗이 쫓기는 중에도 잘 수 있었던 것은 상황이 안전해서가 아니라 지키시는 분이 계셨기 때문입니다.","졸지 않으시는 하나님, 오늘 밤 걱정을 내려놓고 주님 안에서 평안히 잠들게 하소서."],["시편 62:1","나의 영혼이 잠잠히 하나님만 바람이여 나의 구원이 저에게서 나는도다","평안","‘잠잠히’는 소란한 마음을 가라앉히고 고요해진다는 뜻입니다. 구원이 하나님께로부터 온다는 확신이 마음을 잠잠하게 합니다.","오늘 5분 동안 아무 말 없이 조용히 하나님 앞에 앉아 보세요. 소음이 가득한 시대에 침묵은 가장 깊은 기도가 됩니다.","내 영혼이 잠잠히 하나님만 바랍니다.","시편 62편은 ‘오직’이라는 단어를 여러 번 반복합니다. 오직 하나님만이 반석이시고 구원이십니다. 우리는 하나님‘도’ 의지하지만, 하나님‘만’ 의지하지는 않을 때가 많습니다. 잠잠함은 다른 의지할 것들을 내려놓을 때 찾아옵니다.","오직 주님만 바랍니다. 제 영혼이 소란함을 멈추고 주님 앞에서 잠잠하게 하소서."],["시편 46:10","이르시기를 너희는 가만히 있어 내가 하나님 됨을 알지어다 내가 열방과 세계 중에서 높임을 받으리라 하시도다","평안","전쟁과 혼란 속에서 하나님이 직접 하시는 말씀입니다. ‘가만히 있으라’는 손을 놓고 멈추라, 싸움을 그치라는 뜻입니다.","해결하려고 분주하게 뛰어다니는 마음을 잠시 멈추세요. 하나님이 하나님 되심을 인정할 때 진짜 쉼이 옵니다.","멈추어 하나님이 하나님이심을 압니다.","‘가만히 있으라’는 히브리어에는 ‘손을 놓다, 느슨하게 하다’라는 뜻이 있습니다. 꽉 쥔 주먹을 펴는 모습입니다. 우리는 통제하려고 애쓸수록 더 불안해집니다. 손을 펴고 하나님이 하나님 되심을 인정할 때, 비로소 마음에 공간이 생깁니다.","하나님, 꽉 쥔 손을 펴고 주님이 하나님이심을 인정합니다. 통제하려는 마음을 내려놓게 하소서."],["마태복음 6:34","그러므로 내일 일을 위하여 염려하지 말라 내일 일은 내일 염려할 것이요 한 날 괴로움은 그 날에 족하니라","평안","예수님은 염려가 미래를 바꾸지 못하고 오늘의 힘만 빼앗는다고 말씀하십니다. 하나님은 하루치 은혜를 하루씩 주십니다.","내일 걱정이 오늘을 삼키고 있다면, 오늘 할 수 있는 일 한 가지에만 집중해 보세요. 내일의 은혜는 내일 주어집니다.","오늘의 은혜로 오늘을 살겠습니다.","신학자 라인홀드 니버의 것으로 알려진 ‘평온을 비는 기도’는 바꿀 수 없는 것을 받아들이는 평온, 바꿀 수 있는 것을 바꾸는 용기, 그리고 그 둘을 구별하는 지혜를 구합니다. 오늘 나를 불안하게 하는 일들을 이 기도에 비추어 나누어 보면, 내려놓을 것과 붙들 것이 조금 더 분명해집니다.","주님, 내일의 걱정이 오늘을 삼키지 않게 하시고 오늘 주시는 은혜로 오늘을 살게 하소서."],["마태복음 6:26","공중의 새를 보라 심지도 않고 거두지도 않고 창고에 모아 들이지도 아니하되 너희 천부께서 기르시나니 너희는 이것들보다 귀하지 아니하냐","평안","예수님은 염려하는 사람들에게 하늘의 새를 보라고 하십니다. 일하지 말라는 것이 아니라, 하나님의 돌보심을 신뢰하라는 초대입니다.","오늘 밖에 나가면 새를 한 마리 찾아보세요. 새를 기르시는 하나님이 나를 더 귀하게 여기신다는 사실을 기억하세요.","새를 먹이시는 아버지께서 나를 더욱 돌보십니다.","예수님은 새를 보라고 하신 뒤 들의 백합화를 보라고 하십니다(28절). 새는 일하지 않는 것이 아니라 열심히 먹이를 찾습니다. 그러나 염려하지는 않습니다. 성실함과 염려는 다릅니다. 하나님은 우리에게 성실하되 염려하지 말라고 하십니다.","새를 먹이시는 아버지, 성실하게 일하되 염려하지 않게 하시고 주님의 돌보심을 신뢰하게 하소서."],["이사야 43:2","네가 물 가운데로 지날 때에 내가 함께 할 것이라 강을 건널 때에 물이 너를 침몰치 못할 것이며 네가 불 가운데로 행할 때에 타지도 아니할 것이요 불꽃이 너를 사르지도 못하리니","평안","하나님은 물과 불을 피하게 해 주시겠다고 하지 않으시고, 그 가운데를 지날 때 ‘함께하겠다’고 약속하십니다.","고난이 없기를 바라는 기도에서 고난 속에서 함께해 주시기를 바라는 기도로 바꿔 보세요. 함께하심이 가장 큰 약속입니다.","물과 불 가운데서도 주님이 함께하십니다.","1873년, 미국의 변호사 호레이쇼 스패포드는 대서양을 건너던 배의 침몰 사고로 네 딸을 모두 잃었습니다. 홀로 살아남은 아내를 만나러 가는 배 위에서, 딸들이 잠긴 바다 근처를 지나며 그는 찬송 「내 평생에 가는 길」의 가사를 썼습니다. 그의 소망은 슬픔이 없는 소망이 아니라, 슬픔 속에서도 꺼지지 않는 소망이었습니다.","물과 불 가운데서도 함께하시는 하나님, 고난 속에서 저를 지키시고 주님의 함께하심으로 넉넉히 이기게 하소서."],["시편 42:5","내 영혼아 네가 어찌하여 낙망하며 어찌하여 내 속에서 불안하여 하는고 너는 하나님을 바라라 나는 그 얼굴의 도우심을 인하여 오히려 찬송하리로다","소망","시인은 자기 영혼에게 말을 겁니다. 감정에 끌려다니는 대신, 자신의 마음을 향해 하나님을 바라라고 설교하는 것입니다.","우울한 마음이 들 때 감정을 무시하지 말되, 그 감정에게 ‘하나님을 바라라’고 말해 보세요. 마음이 너무 무겁다면 전문가의 도움을 받는 것도 지혜입니다.","내 영혼아, 하나님을 바라라. 나는 다시 찬송하리라.","시편 42편과 43편에서 이 질문과 대답은 세 번 반복됩니다. 한 번 고백했다고 우울이 사라지지 않았다는 뜻입니다. 낙심은 다시 찾아오고, 그때마다 시인은 다시 자기 영혼에게 말을 겁니다. 믿음은 감정을 한 번에 이기는 것이 아니라 반복해서 하나님께로 돌아가는 것입니다.","소망의 하나님, 낙심이 다시 찾아올 때마다 제 영혼에게 하나님을 바라라고 말하게 하소서."],["이사야 40:29","피곤한 자에게는 능력을 주시며 무능한 자에게는 힘을 더하시나니","평안","하나님은 강한 사람이 아니라 지치고 힘없는 사람에게 힘을 주십니다. 이 말씀은 유명한 40장 31절의 독수리 약속으로 이어집니다.","더 이상 힘이 없다고 느낄 때가 바로 하나님의 힘을 구할 때입니다. 오늘 정직하게 ‘저는 지쳤습니다’라고 기도해 보세요.","내 힘이 없을 때 주님이 힘을 더하십니다.","바로 다음 절은 ‘소년이라도 피곤하며 곤비하며 장정이라도 넘어지며 쓰러지되’라고 말합니다. 가장 힘센 사람도 지칩니다. 하나님의 힘은 강한 사람이 아니라 지친 사람에게 주어집니다. 지쳤다는 고백은 실패가 아니라 하나님의 힘을 받을 준비입니다.","피곤한 자에게 힘을 주시는 하나님, 지친 저를 아시오니 주님의 힘을 더하여 주소서."],["시편 91:1","지존자의 은밀한 곳에 거하는 자는 전능하신 자의 그늘 아래 거하리로다","평안","‘그늘’은 뜨거운 광야에서 생명을 지켜 주는 보호를 상징합니다. 하나님 가까이 머무는 사람은 그분의 보호 아래 삽니다.","하루의 시작을 하나님의 ‘은밀한 곳’, 곧 혼자 기도하는 시간으로 시작해 보세요. 그 그늘이 하루를 지켜 줍니다.","전능하신 분의 그늘 아래 나는 안전합니다.","‘은밀한 곳’과 ‘그늘’은 둘 다 가까움을 뜻합니다. 그늘에 있으려면 그늘을 만드는 존재 가까이 있어야 합니다. 멀리 떨어지면 그늘은 나를 덮지 못합니다. 하나님의 보호는 하나님과의 가까움 속에서 누리는 것입니다.","전능하신 하나님, 주님 가까이 머물게 하시고 그 그늘 아래서 보호받게 하소서."],["요한복음 16:33","이것을 너희에게 이름은 너희로 내 안에서 평안을 누리게 하려 함이라 세상에서는 너희가 환난을 당하나 담대하라 내가 세상을 이기었노라","담대","예수님은 제자들에게 환난이 없을 것이라고 약속하지 않으셨습니다. 대신 환난 속에서도 평안할 수 있는 이유, ‘내가 세상을 이기었다’를 주셨습니다.","어려움이 있다는 것이 하나님이 나를 떠나셨다는 뜻은 아닙니다. 이미 이기신 주님 안에서 오늘의 문제를 바라보세요.","주님이 세상을 이기셨으니 나는 담대합니다.","예수님은 이 말씀을 하신 직후 17장에서 제자들을 위해 기도하십니다. ‘세상에서 데려가 달라는 것이 아니라 악에 빠지지 않게 지켜 달라’고요(17:15). 우리는 환난이 없는 곳으로 피하는 것이 아니라 환난 속에서 지켜지는 것입니다. 이기신 분이 우리를 위해 기도하십니다.","세상을 이기신 주님, 환난 속에서도 저를 지켜 주시고 주님 안에서 담대하게 하소서."],["데살로니가후서 3:16","평강의 주께서 친히 때마다 일마다 너희에게 평강을 주시고 주는 너희 모든 사람과 함께 하실찌어다","평안","바울의 축도입니다. ‘때마다 일마다’라는 말은 평강이 특별한 순간이 아니라 모든 상황에 주어지는 선물임을 보여 줍니다.","오늘 일정 사이사이에 ‘주님, 지금 이 일에도 평강을 주세요’라고 짧게 기도해 보세요.","때마다 일마다 평강의 주님이 함께하십니다.","성경의 ‘평강’(샬롬)은 단지 다툼이 없는 상태가 아니라, 모든 것이 제자리에 있는 온전함을 뜻합니다. 하나님과의 관계, 나 자신과의 관계, 이웃과 세상과의 관계가 바르게 회복된 상태입니다. 그래서 설교자들은 평안을 ‘느끼는 것’이기 전에 ‘회복되는 것’이라고 말합니다.","평강의 주님, 때마다 일마다 평강을 주시고 모든 관계가 주님 안에서 회복되게 하소서."],["민수기 6:24-26","여호와는 네게 복을 주시고 너를 지키시기를 원하며 여호와는 그 얼굴로 네게 비취사 은혜 베푸시기를 원하며 여호와는 그 얼굴을 네게로 향하여 드사 평강 주시기를 원하노라 할찌니라","평안","하나님이 제사장 아론에게 직접 가르쳐 주신 ‘아론의 축복’입니다. 수천 년 동안 예배의 끝에서 선포되어 온 축복의 말씀입니다.","오늘 사랑하는 사람의 이름을 넣어 이 축복을 기도해 주세요. 축복은 말할 때 더 힘이 있습니다.","주님의 얼굴이 나를 향하시고 평강을 주십니다.","이 축복은 ‘여호와’라는 이름을 세 번 부르며, 점점 깊어집니다. 지키심에서 은혜로, 은혜에서 평강으로. 그리고 ‘얼굴’이라는 말이 두 번 나옵니다. 하나님이 얼굴을 돌리지 않으시고 우리를 향해 미소 지으신다는 것, 그것이 가장 큰 복입니다.","얼굴을 우리에게 향하시는 하나님, 오늘 저와 제가 사랑하는 이들에게 복과 은혜와 평강을 베풀어 주소서."],["시편 30:5","그 노염은 잠간이요 그 은총은 평생이로다 저녁에는 울음이 기숙할찌라도 아침에는 기쁨이 오리로다","소망","‘기숙하다’는 하룻밤 묵어간다는 뜻입니다. 슬픔은 손님처럼 잠시 머물다 가지만, 하나님의 은총은 평생 머뭅니다.","눈물의 밤을 보내고 있다면 그 슬픔이 영원하지 않다는 것을 기억하세요. 아침은 반드시 옵니다.","울음은 밤에 머물러도 아침에는 기쁨이 옵니다.","‘기숙하다’는 나그네가 하룻밤 머물고 떠나는 것입니다. 슬픔은 집주인이 아니라 손님입니다. 밤은 길게 느껴지지만 아침은 반드시 옵니다. 이 시편은 다윗이 죽음의 위기에서 건짐 받은 뒤 쓴 감사의 노래이며, 11절은 ‘나의 슬픔을 변하여 춤이 되게 하시며’라고 고백합니다.","슬픔을 춤으로 바꾸시는 하나님, 지금의 눈물이 손님처럼 지나가게 하시고 기쁨의 아침을 맞게 하소서."],["시편 126:5","눈물을 흘리며 씨를 뿌리는 자는 기쁨으로 거두리로다","소망","바벨론 포로에서 돌아온 사람들의 노래입니다. 메마른 땅에 눈물로 씨를 뿌리는 농부의 수고는 반드시 기쁨의 추수로 바뀝니다.","지금 눈물로 하고 있는 일이 있다면 그것은 헛되지 않습니다. 오늘도 포기하지 말고 씨를 뿌려 보세요.","눈물로 뿌린 씨앗이 기쁨으로 돌아올 것을 믿습니다.","다음 절은 ‘울며 씨를 뿌리러 나가는 자는 정녕 기쁨으로 그 단을 가지고 돌아오리로다’라고 말합니다. 씨앗을 아끼면 추수도 없습니다. 굶주린 해에 씨앗을 먹지 않고 땅에 심는 농부의 눈물은 믿음의 눈물입니다. 눈물로 심은 것은 반드시 기쁨으로 거둡니다.","추수의 하나님, 눈물로 심은 씨앗이 헛되지 않게 하시고 기쁨으로 거두는 날을 보게 하소서."],["마태복음 5:4","애통하는 자는 복이 있나니 저희가 위로를 받을 것임이요","평안","팔복 중 두 번째입니다. 예수님은 슬퍼하는 사람이 불행한 것이 아니라, 하나님의 위로를 받을 복된 사람이라고 하십니다.","슬픔을 억지로 감추지 마세요. 애도는 연약함이 아니라 사랑의 증거입니다. 오늘 슬픈 마음을 하나님 앞에 정직하게 내어놓으세요.","슬퍼하는 나에게 하나님의 위로가 임합니다.","애통은 슬픔을 피하지 않는 것입니다. 우리 문화는 슬픔을 빨리 극복하라고 재촉하지만, 예수님은 애통하는 사람이 복되다고 하십니다. 나사로의 무덤 앞에서 예수님도 우셨습니다(요 11:35). 슬픔을 충분히 슬퍼하는 사람에게 하나님의 위로가 깊이 스며듭니다.","함께 우시는 주님, 슬픔을 서둘러 감추지 않게 하시고 애통하는 제게 주님의 깊은 위로를 주소서."],["시편 27:1","여호와는 나의 빛이요 나의 구원이시니 내가 누구를 두려워하리요 여호와는 내 생명의 능력이시니 내가 누구를 무서워하리요","담대","다윗은 하나님을 빛, 구원, 생명의 능력으로 고백하며 두려움에 맞섭니다. 두려움의 크기보다 하나님의 크기를 더 크게 보는 신앙입니다.","나를 두렵게 하는 사람이나 상황이 있다면, 그보다 크신 하나님을 먼저 떠올려 보세요.","주님이 나의 빛이시니 누구를 두려워하리요.","주기철 목사는 일제강점기에 신사참배를 거부하다 여러 차례 투옥되었고, 1944년 평양 감옥에서 순교했습니다. 그의 ‘일사각오’(一死覺悟)는 죽음을 각오하고 신앙을 지킨다는 뜻으로 지금도 기억됩니다. 그의 담대함은 두려움이 없어서가 아니라, 사람보다 하나님을 더 두려워했기 때문이었습니다.","나의 빛과 구원이신 하나님, 두려운 사람과 상황보다 크신 주님을 바라보며 담대하게 하소서."],["시편 61:2","내 마음이 눌릴 때에 땅 끝에서부터 주께 부르짖으오리니 나보다 높은 바위에 나를 인도하소서","평안","‘땅 끝’은 하나님에게서 가장 멀리 떨어진 것 같은 곳을 말합니다. 그곳에서도 시인은 자신보다 높은 반석으로 이끌어 달라고 기도합니다.","내 힘과 지혜로는 이겨낼 수 없을 때, 나보다 높으신 하나님께 피해 보세요. 그분은 흔들리지 않는 바위이십니다.","내 마음이 눌릴 때 나보다 높은 반석이신 주님께 피합니다.","‘나보다 높은 바위’라는 표현이 마음에 남습니다. 문제를 해결하려면 나보다 높은 곳에 올라서야 합니다. 같은 높이에서는 길이 보이지 않지만, 높은 곳에서는 전체가 보입니다. 기도는 하나님이라는 높은 바위에 올라 내 상황을 다시 바라보는 시간입니다.","나보다 높은 바위이신 주님, 마음이 눌릴 때 주님께로 올라가 제 상황을 새롭게 보게 하소서."],["출애굽기 33:14","여호와께서 가라사대 내가 친히 가리라 내가 너를 쉬게 하리라","평안","금송아지 사건 뒤, 하나님께 함께 가 달라고 간청하는 모세에게 주신 응답입니다. 하나님의 임재가 곧 쉼입니다.","여행이나 휴가로도 채워지지 않는 피곤함이 있다면, 하나님의 임재 안에서 쉬는 시간을 가져 보세요.","주님이 친히 함께 가시며 나를 쉬게 하십니다.","모세는 하나님께 이렇게 대답합니다. ‘주께서 친히 가지 아니하시려거든 우리를 이곳에서 올려 보내지 마옵소서’(15절). 약속의 땅보다 하나님의 임재가 더 중요했습니다. 좋은 곳에 가는 것보다 하나님과 함께 가는 것이 참된 쉼입니다.","친히 함께 가시는 하나님, 좋은 곳보다 주님과 함께하는 것을 더 원하게 하시고 그 임재 안에서 쉬게 하소서."],["시편 116:7","내 영혼아 네 평안함에 돌아갈찌어다 여호와께서 너를 후대하심이로다","평안","죽음의 위기에서 건짐 받은 시인이 자기 영혼에게 쉼으로 돌아가라고 말합니다. ‘후대하다’는 넉넉하게 잘 대해 주셨다는 뜻입니다.","한 해의 절반이 지났습니다. 지난 반년 동안 하나님이 나를 후대하신 일을 세 가지 적어 보세요.","내 영혼아, 평안으로 돌아가라. 주님이 나를 선대하셨다.","시인은 자신의 영혼을 집 나간 새처럼 부릅니다. ‘돌아올지어다.’ 불안에 휩쓸려 이리저리 떠돌던 마음을 하나님의 품이라는 둥지로 불러들이는 것입니다. 반년을 지나며 지친 마음도 다시 쉼의 자리로 돌아올 수 있습니다.","저를 후대하신 하나님, 이리저리 떠돌던 제 영혼이 주님의 평안으로 돌아오게 하소서."],["로마서 15:13","소망의 하나님이 모든 기쁨과 평강을 믿음 안에서 너희에게 충만케 하사 성령의 능력으로 소망이 넘치게 하시기를 원하노라","소망","바울의 축복 기도입니다. 소망, 기쁨, 평강이 믿음 안에서 ‘충만하고 넘치기를’ 원한다는 표현이 풍성합니다.","하반기를 시작하며 소망이 필요한 사람에게 이 구절로 축복의 메시지를 보내 보세요.","소망의 하나님이 내 삶을 기쁨과 평강으로 채우십니다.","바울은 로마서를 마무리하며 유대인과 이방인이 함께 하나님을 찬양하는 모습을 그립니다. 그리고 소망의 하나님께 축복을 구합니다. 소망은 혼자 품는 것이 아니라 공동체가 함께 나누는 것입니다. 성령의 능력으로 넘치는 소망은 결국 다른 사람에게로 흘러갑니다.","소망의 하나님, 성령의 능력으로 제 마음에 소망이 넘치게 하시고 그 소망이 이웃에게 흘러가게 하소서."],["로마서 5:3-4","다만 이뿐 아니라 우리가 환난 중에도 즐거워하나니 이는 환난은 인내를, 인내는 연단을, 연단은 소망을 이루는 줄 앎이로다","인내","바울은 고난을 즐거워한다고 말합니다. 고난 자체가 좋아서가 아니라, 고난이 인내와 성숙한 인격을 거쳐 소망으로 이어진다는 것을 알기 때문입니다.","지금의 어려움이 나를 어떤 사람으로 빚어 가고 있는지 생각해 보세요. 고난은 낭비되지 않습니다.","환난은 인내를, 인내는 소망을 낳습니다.","‘연단’은 시험을 거쳐 증명된 상태를 말합니다. 불에 넣어 녹여 보고 불순물이 빠진 금속을 가리킬 때 쓰던 말입니다. 고난은 우리가 어떤 사람인지 드러내고, 동시에 우리를 더 단단한 사람으로 만듭니다. 바울은 이 과정의 끝이 ‘소망’이며, 그 소망은 부끄럽게 하지 않는다고 말합니다(5절).","연단하시는 하나님, 지금의 환난이 인내와 소망으로 이어지게 하시고 그 과정에서 저를 단단하게 빚어 주소서."],["야고보서 1:2-3","내 형제들아 너희가 여러 가지 시험을 만나거든 온전히 기쁘게 여기라 이는 너희 믿음의 시련이 인내를 만들어 내는 줄 너희가 앎이라","인내","‘시험’은 유혹이 아니라 믿음을 단련하는 시련을 뜻합니다. 금이 불 속에서 정련되듯 믿음도 시련 속에서 단단해집니다.","예상치 못한 문제를 만났을 때 ‘왜 나에게?’ 대신 ‘이것을 통해 무엇을 배울까?’라고 질문해 보세요.","시련은 내 믿음을 단단하게 하는 과정입니다.","야고보는 시험을 ‘만나거든’이라고 말합니다. 피할 수 있다면 좋겠지만, 길을 걷다 보면 반드시 만나는 것이 시험입니다. 그 시험을 ‘기쁘게 여기라’는 것은 감정을 꾸미라는 것이 아니라 관점을 바꾸라는 것입니다. 시험은 믿음이 근육처럼 단련되는 시간입니다.","주님, 예기치 않은 시험을 만날 때 원망 대신 그것을 통해 배울 것을 찾게 하시고 믿음이 단련되게 하소서."],["야고보서 1:12","시험을 참는 자는 복이 있나니 이는 시련을 견디어 낸 자가 주께서 자기를 사랑하는 자들에게 약속하신 생명의 면류관을 얻을 것임이니라","인내","면류관은 경기에서 끝까지 달린 사람에게 주어지는 승리의 관입니다. 하나님은 끝까지 견딘 사람에게 생명의 면류관을 약속하십니다.","포기하고 싶은 일이 있다면 오늘 하루만 더 견뎌 보세요. 하루씩 견디는 것이 결국 완주가 됩니다.","끝까지 견디는 자에게 생명의 면류관이 있습니다.","‘복이 있나니’는 팔복과 같은 표현입니다. 시험을 견디는 사람은 이미 지금 복된 사람입니다. 면류관은 미래의 상이지만, 견디는 과정 자체도 하나님 앞에서 복입니다. 아무도 몰라주는 버팀도 하나님은 다 보고 계십니다.","생명의 면류관을 약속하신 하나님, 오늘 하루를 한 번 더 견딜 힘을 주시고 견디는 그 자리도 복되게 하소서."],["히브리서 12:1","이러므로 우리에게 구름 같이 둘러싼 허다한 증인들이 있으니 모든 무거운 것과 얽매이기 쉬운 죄를 벗어 버리고 인내로써 우리 앞에 당한 경주를 경주하며","인내","11장의 믿음의 선배들이 관중석에서 응원하는 장면을 떠올리게 합니다. 경주를 잘하려면 무거운 짐을 벗어야 합니다.","내 신앙의 경주를 무겁게 하는 것—과한 일정, 나쁜 습관, 미련—하나를 오늘 내려놓아 보세요.","무거운 것을 벗고 인내로 나의 경주를 달립니다.","『천로역정』을 쓴 존 번연은 허가 없이 설교했다는 이유로 오랜 세월 감옥에 갇혔습니다. 가족과 떨어진 그 긴 시간 동안 그는 순례자가 하늘 도성을 향해 걸어가는 이야기를 구상하고 썼습니다. 감옥은 그를 멈춰 세웠지만, 그 이야기는 수백 년 동안 수많은 사람을 걷게 했습니다.","주님, 저를 무겁게 하는 짐을 벗게 하시고 인내로 제 앞에 놓인 경주를 끝까지 달리게 하소서."],["히브리서 10:36","너희에게 인내가 필요함은 너희가 하나님의 뜻을 행한 후에 약속을 받기 위함이라","인내","핍박 속에서 재산을 빼앗기면서도 기쁨으로 견뎠던 성도들에게, 마지막까지 담대함을 버리지 말라고 권하는 말씀입니다.","약속의 성취가 더디게 느껴질 때, 그 사이의 시간을 하나님의 뜻을 행하는 시간으로 채워 보세요.","하나님의 뜻을 행하며 인내로 약속을 기다립니다.","히브리서 기자는 바로 앞 절에서 ‘너희 담대함을 버리지 말라 이것이 큰 상을 얻게 하느니라’고 말합니다. 인내는 담대함을 붙들고 있는 것입니다. 많은 사람이 결승선 바로 앞에서 포기합니다. 약속을 받는 사람은 가장 뛰어난 사람이 아니라 끝까지 버틴 사람입니다.","약속하신 하나님, 결승선 앞에서 포기하지 않게 하시고 담대함을 버리지 않고 끝까지 주님의 뜻을 행하게 하소서."],["고린도후서 12:9","나에게 이르시기를 내 은혜가 네게 족하도다 이는 내 능력이 약한 데서 온전하여짐이라 하신지라 그러므로 도리어 크게 기뻐함으로 나의 여러 약한 것들에 대하여 자랑하리니 이는 그리스도의 능력으로 내게 머물게 하려 함이라","은혜","바울은 ‘육체의 가시’를 없애 달라고 세 번 기도했지만, 하나님은 가시를 없애는 대신 은혜가 충분하다고 답하셨습니다.","고쳐지지 않는 약점이 있다면, 그것이 하나님의 능력이 드러나는 통로가 될 수 있습니다. 오늘 그 약함을 인정하고 은혜를 구하세요.","주님의 은혜가 나에게 충분합니다.","바울의 ‘육체의 가시’가 무엇이었는지는 알려져 있지 않습니다. 그래서 오히려 누구나 자신의 가시를 이 자리에 넣어 읽을 수 있습니다. 하나님은 가시를 없애 주시는 대신 은혜를 주셨습니다. 때로 하나님의 응답은 ‘예’도 ‘아니요’도 아닌 ‘내가 충분하다’입니다.","은혜가 족하다 하시는 주님, 제 약함을 숨기지 않고 인정하며 그 자리에 주님의 능력이 머물게 하소서."],["고린도후서 4:8-9","우리가 사방으로 우겨쌈을 당하여도 싸이지 아니하며 답답한 일을 당하여도 낙심하지 아니하며 핍박을 받아도 버린 바 되지 아니하며 거꾸러뜨림을 당하여도 망하지 아니하고","인내","바울은 고난을 숨기지 않습니다. 사방이 막히고 넘어지기도 하지만, ‘그러나’ 결코 끝나지 않는다는 고백이 반복됩니다.","‘~하여도 ~하지 아니하며’ 형식으로 나의 고백을 써 보세요. 예: ‘일이 꼬여도 포기하지 아니하며.’","넘어져도 망하지 않습니다. 주님이 나를 붙드십니다.","바울은 네 번 ‘~하여도 ~하지 아니하며’를 반복합니다. 고난을 부정하지 않으면서도 고난이 마지막 말이 되지 못하게 합니다. 앞 절의 질그릇 비유처럼, 깨지기 쉬운 그릇이지만 그 안의 보배 때문에 끝내 부서지지 않습니다.","저를 붙드시는 하나님, 사방이 막힌 것 같아도 낙심하지 않게 하시고 넘어져도 다시 일어서게 하소서."],["고린도전서 10:13","사람이 감당할 시험 밖에는 너희가 당한 것이 없나니 오직 하나님은 미쁘사 너희가 감당치 못할 시험 당함을 허락지 아니하시고 시험 당할 즈음에 또한 피할 길을 내사 너희로 능히 감당하게 하시느니라","인내","유혹과 시련 앞에서 하나님은 ‘피할 길’을 함께 주십니다. 나만 이런 일을 겪는다는 고립감에서 벗어나게 해 주는 말씀이기도 합니다.","반복되는 유혹이 있다면, 그 순간을 피할 구체적인 길—장소, 사람, 시간—을 미리 정해 두세요.","하나님은 감당할 힘과 피할 길을 주십니다.","‘감당할 시험 밖에는’이라는 말은 우리가 겪는 일이 특별히 나에게만 닥친 일이 아니라는 위로입니다. 고립감은 시험을 더 무겁게 만듭니다. 그리고 하나님이 내시는 ‘피할 길’은 종종 도움을 청할 사람, 자리를 피할 용기, 시간을 버틸 인내의 모습으로 옵니다.","신실하신 하나님, 시험 앞에서 혼자라고 느끼지 않게 하시고 주님이 내신 피할 길을 보고 선택하게 하소서."],["베드로전서 5:10","모든 은혜의 하나님 곧 그리스도 안에서 너희를 부르사 자기의 영원한 영광에 들어가게 하신 이가 잠간 고난을 받은 너희를 친히 온전케 하시며 굳게 하시며 강하게 하시며 터를 견고케 하시리라","인내","‘잠깐’의 고난 뒤에 하나님이 ‘친히’ 하실 네 가지 일이 이어집니다. 온전케, 굳게, 강하게, 견고케 하심입니다.","지금의 고난이 영원할 것 같아도 하나님의 시간에서는 ‘잠깐’입니다. 오늘 그 약속의 네 단어를 소리 내어 읽어 보세요.","잠깐의 고난 뒤에 주님이 나를 견고하게 세우십니다.","‘온전케, 굳게, 강하게, 견고케’라는 네 동사는 모두 건축과 관련된 말이기도 합니다. 무너진 집을 수리하고, 기초를 다지고, 기둥을 세우는 모습입니다. 고난이 우리 삶의 일부를 무너뜨렸다면, 하나님은 그 자리를 더 튼튼하게 다시 세우십니다.","모든 은혜의 하나님, 고난으로 무너진 제 삶의 자리를 주님이 친히 견고하게 다시 세워 주소서."],["욥기 23:10","그러나 나의 가는 길을 오직 그가 아시나니 그가 나를 단련하신 후에는 내가 정금 같이 나오리라","인내","모든 것을 잃고 친구들의 비난까지 받은 욥은 하나님이 보이지 않는다고 탄식합니다. 그러나 하나님이 자신의 길을 아신다는 사실에서 소망을 찾습니다.","내가 하나님을 볼 수 없을 때에도 하나님은 나를 보고 계십니다. 오늘의 연단이 나를 정금처럼 만들 것을 믿으세요.","주님은 내 길을 아시며, 나는 정금같이 나오리라.","욥은 끝까지 하나님이 왜 고난을 허락하셨는지 설명을 듣지 못했습니다. 그러나 그는 하나님을 만났습니다(42:5). 고난 속에서 우리가 얻는 것은 답보다 하나님 자신일 때가 많습니다. 설명보다 임재가 우리를 정금같이 만듭니다.","제 길을 아시는 하나님, 이유를 다 알지 못해도 주님을 신뢰하게 하시고 연단 후에 정금같이 나오게 하소서."],["시편 119:71","고난 당한 것이 내게 유익이라 이로 인하여 내가 주의 율례를 배우게 되었나이다","인내","고난을 통과한 시인의 고백입니다. 고난은 하나님의 말씀을 더 깊이 배우게 하는 학교가 되었습니다.","지난 고난을 돌아보며 그것을 통해 배운 것을 한 가지 적어 보세요. 고난도 나를 가르치는 선생이 될 수 있습니다.","고난도 나에게 유익이 되게 하시는 하나님을 신뢰합니다.","시편 119편은 성경에서 가장 긴 장으로, 거의 모든 절이 하나님의 말씀을 노래합니다. 그 가운데 시인은 고난이 말씀을 배우게 했다고 고백합니다. 평안할 때는 대충 읽던 말씀이 고난 속에서는 생명줄이 됩니다. 고난은 말씀을 새롭게 읽게 하는 안경입니다.","말씀의 하나님, 고난의 시간에 주님의 말씀을 더 깊이 배우게 하시고 그것이 제게 유익이 되게 하소서."],["로마서 8:18","생각건대 현재의 고난은 장차 우리에게 나타날 영광과 족히 비교할 수 없도다","소망","바울은 고난과 영광을 저울에 달아 봅니다. 그 결과 다가올 영광이 비교할 수 없을 만큼 무겁다는 결론을 내립니다.","지금의 어려움을 영원의 저울 위에 올려 보세요. 고난이 가벼워지지는 않아도, 그 의미가 달라집니다.","다가올 영광이 지금의 고난보다 큽니다.","바울은 이어서 ‘피조물이 다 함께 탄식하며 고통을 겪는다’고 말합니다(22절). 그런데 그것을 ‘해산의 고통’이라고 부릅니다. 해산의 고통은 새 생명을 낳기 위한 고통입니다. 지금 세상과 우리가 겪는 아픔도 새로운 창조를 향한 진통입니다.","영광을 준비하시는 하나님, 지금의 고통이 새 생명을 위한 진통임을 믿고 장차 나타날 영광을 바라보게 하소서."],["하박국 2:3","이 묵시는 정한 때가 있나니 그 종말이 속히 이르겠고 결코 거짓되지 아니하리라 비록 더딜찌라도 기다리라 지체되지 않고 정녕 응하리라","인내","악이 형통하는 현실에 질문하던 하박국에게 하나님이 주신 답입니다. 하나님의 약속에는 ‘정한 때’가 있습니다.","응답이 더디게 느껴지는 기도 제목이 있다면, 오늘 ‘더딜지라도 기다리겠습니다’라고 고백해 보세요.","더딜지라도 기다리겠습니다. 주님의 약속은 반드시 이루어집니다.","하박국은 ‘언제까지니이까’라는 질문으로 책을 시작했습니다(1:2). 하나님의 답은 ‘판에 명백히 새겨 달려가면서도 읽을 수 있게 하라’는 것이었습니다(2:2). 약속을 분명하게 적어 두라는 것입니다. 기다림의 시간에는 붙들 약속을 눈앞에 두는 것이 힘이 됩니다.","정한 때를 아시는 하나님, 더딜지라도 기다리게 하시고 주님의 약속을 눈앞에 두고 붙들게 하소서."],["시편 27:14","너는 여호와를 바랄찌어다 강하고 담대하며 여호와를 바랄찌어다","인내","‘바라라’는 말이 두 번 반복됩니다. 기다림은 약함이 아니라 강하고 담대한 마음이 필요한 일입니다.","기다리는 동안 조급하게 다른 길을 찾고 싶어질 때, 이 말씀으로 마음을 다잡아 보세요.","나는 강하고 담대하게 주님을 기다립니다.","이 시편은 ‘여호와는 나의 빛이요’로 시작해 ‘여호와를 바랄지어다’로 끝납니다. 강한 고백으로 시작했지만 결국 기다림으로 마칩니다. 신앙의 고백과 현실의 기다림은 함께 갑니다. 기다림은 약한 신앙이 아니라 강하고 담대한 신앙의 표현입니다.","주님, 강하고 담대하게 주님을 기다리게 하시고 기다림 속에서도 주님이 나의 빛이심을 고백하게 하소서."],["시편 40:1","내가 여호와를 기다리고 기다렸더니 귀를 기울이사 나의 부르짖음을 들으셨도다","인내","‘기다리고 기다렸다’는 히브리어 표현은 끈질기게 오래 기다렸다는 뜻입니다. 그 결과 하나님은 귀를 기울여 들으셨습니다.","오래 기도했는데 응답이 없다고 낙심하지 마세요. 오늘도 같은 기도를 다시 한 번 드려 보세요.","기다리고 기다리는 나의 기도를 주님이 들으십니다.","시인은 기다린 끝에 ‘기가 막힐 웅덩이와 수렁에서’ 끌어올려졌다고 말합니다(2절). 그리고 ‘새 노래’를 입에 두셨다고 합니다(3절). 기다림의 끝에는 구원만이 아니라 새로운 노래가 있습니다. 기다려 본 사람만이 부를 수 있는 노래입니다.","부르짖음을 들으시는 하나님, 수렁 같은 자리에서 저를 끌어올리시고 제 입에 새 노래를 주소서."],["예레미야애가 3:26","사람이 여호와의 구원을 바라고 잠잠히 기다림이 좋도다","인내","폐허가 된 예루살렘에서 시인은 서두르지 않고 잠잠히 하나님의 구원을 기다리는 것이 ‘좋다’고 고백합니다.","결과를 서둘러 확인하려는 마음을 내려놓고, 오늘은 맡겨진 일을 묵묵히 해 보세요.","잠잠히 주님의 구원을 기다립니다.","예레미야애가 3장은 ‘잠잠히’, ‘기다림’, ‘바라고’라는 말을 반복합니다. 바로 다음 절은 ‘사람이 젊었을 때에 멍에를 메는 것이 좋으니’라고 말합니다. 기다림은 시간 낭비가 아니라 사람을 깊어지게 하는 훈련입니다. 서두르는 사람은 얕아지고, 기다리는 사람은 깊어집니다.","주님, 조급함을 내려놓고 잠잠히 주님의 구원을 기다리게 하시고 그 기다림 속에서 깊어지게 하소서."],["이사야 54:10","산들은 떠나며 작은 산들은 옮길찌라도 나의 인자는 네게서 떠나지 아니하며 화평케 하는 나의 언약은 옮기지 아니하리라 너를 긍휼히 여기는 여호와의 말이니라","소망","가장 견고해 보이는 산도 옮겨질 수 있지만, 하나님의 사랑과 언약은 결코 흔들리지 않습니다.","믿었던 것이 무너지는 경험을 했다면, 결코 흔들리지 않는 하나님의 사랑에 마음을 기대 보세요.","산이 옮겨져도 주님의 사랑은 나를 떠나지 않습니다.","설교자들은 소망을 자주 ‘영혼의 닻’(히 6:19)에 비유합니다. 닻은 폭풍을 없애 주지 않지만 배가 떠내려가지 않게 붙들어 줍니다. 소망을 가진 사람도 여전히 흔들립니다. 그러나 결코 떠내려가지 않습니다.","흔들리지 않는 사랑의 하나님, 믿었던 것이 흔들릴 때에도 주님의 언약 위에 제 마음의 닻을 내리게 하소서."],["로마서 12:12","소망 중에 즐거워하며 환난 중에 참으며 기도에 항상 힘쓰며","인내","그리스도인의 삶의 리듬을 세 줄로 요약한 말씀입니다. 소망은 즐거움을, 환난은 인내를, 그리고 모든 상황은 기도를 요구합니다.","오늘 하루를 이 세 가지로 점검해 보세요. 즐거워했나요? 참았나요? 기도했나요?","소망 중에 즐거워하고, 환난 중에 참고, 기도에 힘쓰겠습니다.","신약의 ‘인내’(휘포모네)는 ‘무거운 짐 아래 머물러 있다’는 뜻을 담고 있습니다. 도망치지 않고 그 자리를 지키는 힘입니다. 설교자들은 인내가 수동적인 기다림이 아니라 능동적인 버팀이며, 바로 그 버팀 속에서 인격이 빚어진다고 말합니다.","주님, 소망 중에 즐거워하고 환난 중에 참으며 기도에 항상 힘쓰게 하소서."],["히브리서 12:11","무릇 징계가 당시에는 즐거워 보이지 않고 슬퍼 보이나 후에 그로 말미암아 연달한 자에게는 의의 평강한 열매를 맺나니","인내","부모가 사랑하는 자녀를 훈련하듯, 하나님의 훈련도 당장은 아프지만 결국 평강의 열매를 맺습니다.","지금 겪는 어려움이 나를 훈련하는 과정이라면 무엇을 배워야 할까요? 운동처럼, 훈련은 근육을 만듭니다.","오늘의 훈련이 내일 평강의 열매가 됩니다.","‘연달한 자’는 훈련받은 자라는 뜻입니다. 운동선수는 고통스러운 훈련 없이 실력을 얻을 수 없습니다. 히브리서는 하나님의 징계를 아버지의 훈련으로 설명하며, 그것이 ‘의의 평강한 열매’를 맺는다고 말합니다. 훈련받는 순간은 고통스럽지만, 그 열매는 평화입니다.","훈련하시는 아버지, 지금의 어려움이 저를 단련하는 과정임을 믿고 의와 평강의 열매를 맺게 하소서."],["베드로전서 1:7","너희 믿음의 시련이 불로 연단하여도 없어질 금보다 더 귀하여 예수 그리스도의 나타나실 때에 칭찬과 영광과 존귀를 얻게 할 것이니라","인내","금은 불에 정련될수록 순수해집니다. 시련을 통과한 믿음은 금보다 귀하며, 마지막 날 영광으로 드러납니다.","믿음이 흔들리는 시련을 겪고 있다면, 그것이 믿음을 순금처럼 만드는 과정임을 기억하세요.","불 같은 시련 속에서 나의 믿음은 금보다 귀해집니다.","금은 불로 정련해도 결국 없어질 것이지만, 믿음은 영원히 남습니다. 그래서 믿음은 금보다 귀합니다. 시련은 우리 믿음이 가짜인지 진짜인지 드러내는 동시에, 진짜 믿음을 더 빛나게 합니다. 예수님이 다시 오실 때 그 믿음은 칭찬과 영광으로 드러날 것입니다.","주님, 불 같은 시련 속에서 제 믿음이 순금처럼 정련되게 하시고 주님 오실 때 칭찬받는 믿음이 되게 하소서."],["창세기 50:20","당신들은 나를 해하려 하였으나 하나님은 그것을 선으로 바꾸사 오늘과 같이 만민의 생명을 구원하게 하시려 하셨나니","용서","형들에게 팔려 노예가 되고 감옥까지 갔던 요셉이 형들을 용서하며 한 말입니다. 하나님은 악한 의도까지 선한 결과로 바꾸셨습니다.","누군가 나를 해하려 했던 경험이 있다면, 하나님이 그 일을 어떻게 선으로 바꾸고 계신지 찾아보세요. 용서는 그 시선에서 시작됩니다.","사람의 악도 하나님은 선으로 바꾸십니다.","요셉은 형들에게 ‘내가 하나님을 대신하리이까’라고 말합니다(19절). 그는 복수할 힘이 있었지만 심판의 자리를 하나님께 맡겼습니다. 용서는 상대가 잘못하지 않았다고 말하는 것이 아니라, 그 잘못을 다루실 분이 내가 아니라 하나님이시라고 인정하는 것입니다.","선으로 바꾸시는 하나님, 저를 해하려 했던 일도 주님 손에 맡기며 심판의 자리를 주님께 내어 드리게 하소서."],["빌립보서 4:13","내게 능력 주시는 자 안에서 내가 모든 것을 할 수 있느니라","담대","흔히 성공의 구호처럼 인용되지만, 문맥은 ‘배부름과 배고픔, 풍부와 궁핍에 처할 줄 아는 일체의 비결’입니다. 어떤 형편에서도 견딜 힘을 주신다는 고백입니다.","형편이 좋든 나쁘든 만족하며 사는 것이 진짜 능력입니다. 오늘 내 형편 그대로 감사할 이유를 찾아보세요.","어떤 형편에서도 주님 안에서 나는 감당할 수 있습니다.","‘모든 것을 할 수 있다’는 말 앞에서 바울은 ‘비천에 처할 줄도 알고 풍부에 처할 줄도 안다’고 말합니다(12절). 이 구절은 원하는 것을 다 이루는 능력이 아니라, 어떤 형편에서도 흔들리지 않는 능력에 대한 고백입니다. 가장 큰 능력은 만족하는 능력입니다.","능력 주시는 주님, 형편이 좋든 어렵든 주님 안에서 만족하며 감당하게 하소서."],["빌립보서 1:6","너희 속에 착한 일을 시작하신 이가 그리스도 예수의 날까지 이루실 줄을 우리가 확신하노라","소망","하나님은 시작만 하시고 그만두는 분이 아닙니다. 우리 안에서 시작하신 일을 반드시 완성하십니다.","내 신앙이나 성품이 더디게 자라는 것 같아 실망된다면, 하나님이 아직 작업 중이시라는 것을 기억하세요.","나를 시작하신 하나님이 나를 완성하십니다.","하나님은 미완성 작품을 버려두는 화가가 아닙니다. 우리 안에서 시작하신 일을 ‘그리스도 예수의 날까지’ 이루십니다. 지금 내 모습이 실망스러워도 그것은 완성이 아니라 과정입니다. 그리고 그 과정의 주인은 내가 아니라 하나님이십니다.","시작하신 일을 이루시는 하나님, 더디게 자라는 제 모습에 실망하지 않게 하시고 주님의 손길을 신뢰하게 하소서."],["디모데후서 4:7","나는 선한 싸움을 싸우고 나의 달려갈 길을 마치고 믿음을 지켰으니","인내","순교를 앞둔 바울의 마지막 편지에 담긴 고백입니다. 그는 크게 성공했다고 하지 않고 ‘믿음을 지켰다’고 말합니다.","인생의 끝에서 어떤 고백을 하고 싶나요? 그 고백을 위해 오늘 지켜야 할 것 한 가지를 정해 보세요.","선한 싸움을 싸우며 끝까지 믿음을 지키겠습니다.","바울은 ‘선한 싸움’이라고 말합니다. 그리스도인의 삶에는 싸움이 있습니다. 그러나 그 싸움은 사람을 이기는 싸움이 아니라 믿음을 지키는 싸움입니다. 바울은 많은 것을 잃었지만 믿음은 지켰습니다. 인생의 성적표는 무엇을 얻었는지가 아니라 무엇을 지켰는지로 매겨집니다.","주님, 선한 싸움을 싸우며 제 달려갈 길을 마치게 하시고 끝까지 믿음을 지키게 하소서."],["시편 37:7","여호와 앞에 잠잠하고 참아 기다리라 자기 길이 형통하며 악한 꾀를 이루는 자를 인하여 불평하여 하지 말찌어다","인내","불의한 사람들이 잘되는 것을 보면 마음이 불편해집니다. 다윗은 그들을 보며 속을 끓이지 말고 하나님 앞에서 잠잠히 기다리라고 말합니다.","남과 비교하며 억울한 마음이 든다면, SNS를 잠시 닫고 하나님 앞에서 마음을 가라앉혀 보세요.","비교와 불평 대신 잠잠히 주님을 기다립니다.","‘불평하지 말라’는 원어로 ‘속을 끓이지 말라’는 뜻입니다. 남이 잘되는 것을 보며 속을 끓이는 것은 결국 나를 태웁니다. 시인은 8절에서 ‘분을 그치고 노를 버리라’고 말합니다. 비교와 불평을 멈추고 하나님 앞에서 잠잠할 때 마음이 식고 평안이 찾아옵니다.","주님, 남과 비교하며 속을 끓이지 않게 하시고 주님 앞에서 잠잠히 참아 기다리게 하소서."],["잠언 24:16","대저 의인은 일곱번 넘어질찌라도 다시 일어나려니와 악인은 재앙으로 인하여 엎드러지느니라","인내","의인도 넘어집니다. 의인과 악인의 차이는 넘어지지 않는 데 있지 않고, 다시 일어나는 데 있습니다.","넘어진 자신을 정죄하기보다 다시 일어나는 데 집중하세요. 오늘 다시 시작할 한 가지를 정해 보세요.","일곱 번 넘어져도 나는 다시 일어납니다.","‘일곱 번’은 완전수로, 셀 수 없이 많이 넘어진다는 뜻입니다. 의인은 넘어지지 않는 사람이 아니라 계속 다시 일어나는 사람입니다. 아기가 걸음마를 배울 때 넘어지는 것을 실패라고 하지 않습니다. 넘어짐은 걷는 법을 배우는 과정입니다.","다시 일으키시는 하나님, 넘어진 저를 정죄하지 않고 다시 일어서게 하시며 오늘 새롭게 시작하게 하소서."],["미가 7:8","나의 대적이여 나로 인하여 기뻐하지 말찌어다 나는 엎드러질찌라도 일어날 것이요 어두운데 앉을찌라도 여호와께서 나의 빛이 되실 것임이로다","소망","무너진 공동체 속에서 선지자가 외친 소망의 선언입니다. 어둠 속에 앉아 있는 순간에도 하나님이 빛이 되어 주십니다.","지금 어둠 속에 있다면, 그 어둠이 마지막이 아님을 선포해 보세요. ‘나는 다시 일어날 것이다.’","어둠 속에서도 주님이 나의 빛이 되십니다.","미가서는 이스라엘이 무너진 상황에서 끝납니다. 그러나 7장 마지막에서 미가는 ‘주께서 우리의 모든 죄를 깊은 바다에 던지시리이다’(19절)라고 노래합니다. 어둠 속에 앉아 있을 때에도 회복의 노래를 부를 수 있는 것은 하나님이 빛이 되시기 때문입니다.","저의 빛이 되시는 하나님, 어둠 속에 앉아 있을 때에도 회복을 노래하게 하시고 다시 일어서게 하소서."],["이사야 42:3","상한 갈대를 꺾지 아니하며 꺼져가는 등불을 끄지 아니하고 진리로 공의를 베풀 것이며","은혜","메시아의 모습을 그린 말씀으로, 마태복음은 이것을 예수님께 적용합니다. 그분은 부러지기 직전의 연약한 사람을 버리지 않고 일으키십니다.","스스로를 상한 갈대처럼 느낀다면, 예수님은 나를 꺾지 않으신다는 것을 기억하세요. 주변의 연약한 사람에게도 그렇게 대해 주세요.","주님은 상한 갈대 같은 나를 꺾지 않으십니다.","갈대는 연약해서 쉽게 꺾이고, 심지가 다 탄 등불은 곧 꺼집니다. 세상은 쓸모없어진 것을 버리지만, 예수님은 그것을 다시 일으키십니다. 마태복음 12장은 예수님이 병자들을 고치시고 소문내지 말라 하신 장면에서 이 말씀을 인용합니다. 주님은 조용히, 그러나 끝까지 연약한 자를 돌보십니다.","상한 갈대를 꺾지 않으시는 주님, 연약한 저를 일으키시고 저도 주변의 연약한 이들을 그렇게 대하게 하소서."],["마태복음 24:13","그러나 끝까지 견디는 자는 구원을 얻으리라","인내","혼란과 미혹이 가득한 마지막 때에 대한 말씀입니다. 신앙은 단거리가 아니라 끝까지 달리는 마라톤입니다.","신앙생활이 지루하고 메마르게 느껴지는 시기에도 꾸준함을 놓지 마세요. 작은 습관이 끝까지 가게 합니다.","나는 끝까지 견디겠습니다.","예수님은 이 말씀 앞에서 ‘불법이 성하므로 많은 사람의 사랑이 식어지리라’고 하셨습니다(12절). 끝까지 견딘다는 것은 상황을 견디는 것만이 아니라 사랑이 식지 않도록 지키는 것입니다. 냉소와 무관심이 퍼지는 시대에 사랑을 지키는 것이 인내입니다.","끝까지 지키시는 주님, 어려운 시대에도 제 사랑이 식지 않게 하시고 끝까지 믿음으로 견디게 하소서."],["시편 18:2","여호와는 나의 반석이시요 나의 요새시요 나를 건지시는 자시요 나의 하나님이시요 나의 피할 바위시요 나의 방패시요 나의 구원의 뿔이시요 나의 산성이시로다","담대","사울의 손에서 건짐 받은 다윗이 하나님을 향해 여러 이름을 쏟아 냅니다. 하나님을 경험한 만큼 고백의 언어가 풍성해집니다.","오늘 내가 경험한 하나님을 나만의 단어로 불러 보세요. ‘주님은 나의 ○○이십니다.’","주님은 나의 반석, 요새, 방패이십니다.","다윗은 하나님을 여러 이름으로 부릅니다. 반석, 요새, 바위, 방패, 산성. 모두 전쟁터에서 생명을 지켜 주는 것들입니다. 그는 머리로 하나님을 안 것이 아니라 도망 다니던 광야에서 몸으로 하나님을 경험했습니다. 경험한 하나님은 이름이 많아집니다.","나의 반석이요 방패이신 하나님, 제 삶에서 경험한 주님을 새로운 이름으로 고백하며 찬양하게 하소서."],["고린도후서 4:17","우리의 잠시 받는 환난의 경한 것이 지극히 크고 영원한 영광의 중한 것을 우리에게 이루게 함이니","소망","바울은 매를 맞고 감옥에 갇히는 고난을 ‘잠시, 가벼운 것’이라 부릅니다. 영원한 영광의 무게와 비교했기 때문입니다.","한 달을 마무리하며, 이번 달 겪은 어려움이 나에게 남긴 것은 무엇인지 돌아보세요.","잠시의 환난이 영원한 영광을 이룹니다.","바울은 ‘잠시’와 ‘영원’, ‘가벼움’과 ‘무거움’을 대조합니다. 그리고 18절에서 ‘보이는 것은 잠깐이요 보이지 않는 것은 영원함이니라’고 덧붙입니다. 한 달을 마치며, 보이는 것에 흔들렸던 날들을 보이지 않는 영원의 눈으로 다시 바라봅니다.","영원하신 하나님, 잠시의 환난보다 영원한 영광을 바라보게 하시고 보이지 않는 것에 소망을 두게 하소서."],["잠언 1:7","여호와를 경외하는 것이 지식의 근본이어늘 미련한 자는 지혜와 훈계를 멸시하느니라","지혜","잠언 전체의 주제 문장입니다. ‘경외’는 무서워 떠는 것이 아니라 하나님을 존중하고 그분 앞에서 사는 태도입니다. 이것이 모든 지혜의 출발점입니다.","정보는 넘치지만 지혜는 부족한 시대입니다. 오늘 결정을 내리기 전에 ‘하나님 앞에서 이것이 옳은가?’를 먼저 물어보세요.","하나님을 경외하는 것에서 나의 지혜가 시작됩니다.","잠언의 지혜는 철학이 아니라 생활입니다. 말하는 법, 돈 쓰는 법, 친구를 고르는 법, 성실하게 일하는 법을 다룹니다. 그래서 설교자들은 지혜를 ‘하나님을 경외하는 마음으로 일상을 살아내는 기술’이라고 정의합니다. 지혜는 서재가 아니라 부엌과 사무실과 거리에서 증명됩니다.","지혜의 근본이신 하나님, 주님을 경외하는 마음으로 오늘의 일상을 지혜롭게 살아내게 하소서."],["잠언 4:23","무릇 지킬만한 것보다 더욱 네 마음을 지키라 생명의 근원이 이에서 남이니라","지혜","‘마음’은 생각, 감정, 의지의 중심입니다. 샘의 근원이 오염되면 모든 물이 오염되듯, 마음이 삶의 모든 것을 결정합니다.","오늘 내 마음에 무엇이 들어오는지 살펴보세요. 보는 영상, 듣는 말, 반복하는 생각이 내 마음을 만듭니다.","무엇보다 내 마음을 지키겠습니다.","‘지키라’는 성문을 지키는 파수꾼처럼 경계하라는 말입니다. 잠언은 이어서 입술, 눈, 발을 차례로 말합니다(24-27절). 마음을 지키는 것은 결국 무엇을 말하고, 무엇을 보고, 어디로 가는지를 지키는 것입니다. 오늘 마음의 문으로 무엇이 드나드는지 살펴보아야 합니다.","생명의 근원이신 하나님, 제 마음을 지키게 하시고 제 입술과 눈과 발도 주님 앞에서 바르게 하소서."],["야고보서 1:5","너희 중에 누구든지 지혜가 부족하거든 모든 사람에게 후히 주시고 꾸짖지 아니하시는 하나님께 구하라 그리하면 주시리라","지혜","하나님은 지혜를 구하는 사람을 ‘왜 그것도 모르냐’고 꾸짖지 않으시고 넉넉하게 주십니다.","결정하기 어려운 문제가 있다면 혼자 고민하기보다 하나님께 지혜를 구하는 기도부터 시작하세요.","지혜를 구하는 나에게 주님은 후히 주십니다.","야고보는 지혜를 구하되 ‘의심하지 말고 믿음으로 구하라’고 덧붙입니다(6절). 의심하는 사람은 바람에 밀려 요동하는 바다 물결 같다고 합니다. 지혜를 구한다는 것은 답을 받으면 따르겠다는 결심과 함께 구하는 것입니다.","후히 주시는 하나님, 제게 부족한 지혜를 믿음으로 구합니다. 주시는 지혜를 따르는 순종도 주소서."],["잠언 15:1","유순한 대답은 분노를 쉬게 하여도 과격한 말은 노를 격동하느니라","지혜","같은 내용이라도 어떻게 말하느냐가 갈등을 키우기도 하고 잠재우기도 합니다.","오늘 누군가 날카롭게 말할 때, 한 박자 쉬고 부드럽게 대답해 보세요. 부드러움은 약함이 아니라 힘입니다.","유순한 말로 분노를 잠재우겠습니다.","불에 기름을 부으면 더 타오르고 물을 부으면 꺼집니다. 과격한 말은 기름이고 유순한 대답은 물입니다. 유순함은 상대에게 지는 것이 아니라 상황을 다스리는 힘입니다. 예수님도 고발당하는 자리에서 침묵과 부드러움으로 오히려 상황을 주도하셨습니다.","온유하신 주님, 날카로운 말 앞에서 기름 대신 물을 붓는 유순한 대답을 하게 하소서."],["잠언 16:24","선한 말은 꿀송이 같아서 마음에 달고 뼈에 양약이 되느니라","지혜","좋은 말은 듣는 사람의 마음뿐 아니라 몸까지 건강하게 한다고 잠언은 말합니다.","오늘 세 사람에게 진심 어린 칭찬이나 격려를 건네 보세요. 말 한마디가 누군가에게는 약이 됩니다.","오늘 나의 말이 누군가에게 꿀과 약이 되게 하소서.","‘꿀송이’는 바위틈에서 흘러나오는 귀한 꿀입니다. 고대 사회에서 꿀은 영양과 약으로 쓰였습니다. 선한 말이 ‘뼈에 양약’이 된다는 것은 말이 몸과 마음 깊은 곳까지 영향을 준다는 뜻입니다. 오늘 내가 건넨 말이 누군가의 하루를 살릴 수 있습니다.","주님, 제 입술의 말이 누군가에게 꿀과 약이 되게 하시고 사람을 살리는 말을 하게 하소서."],["잠언 18:21","죽고 사는 것이 혀의 권세에 달렸나니 혀를 쓰기 좋아하는 자는 그 열매를 먹으리라","지혜","말에는 생명을 살리는 힘과 죽이는 힘이 함께 있습니다. 말을 많이 하는 사람은 그 말의 결과를 거두게 됩니다.","댓글, 메시지, 뒷담화를 포함해 오늘 내가 한 말이 사람을 살렸는지 죽였는지 돌아보세요.","생명을 살리는 말을 하겠습니다.","혀는 작은 지체이지만 야고보는 그것을 큰 숲을 태우는 작은 불에 비유했습니다(약 3:5). 말은 한 번 나가면 되돌릴 수 없습니다. 그래서 말을 아끼는 것도 지혜이고, 생명을 살리는 말을 고르는 것도 지혜입니다. 온라인의 짧은 글 한 줄도 혀의 권세에 포함됩니다.","주님, 제 혀를 다스려 주소서. 말과 글로 사람을 죽이지 않고 살리게 하소서."],["에베소서 4:29","무릇 더러운 말은 너희 입 밖에도 내지 말고 오직 덕을 세우는데 소용되는 대로 선한 말을 하여 듣는 자들에게 은혜를 끼치게 하라","지혜","바울은 말의 기준을 ‘듣는 사람에게 유익한가’에 둡니다. 말은 상대를 세우는 도구가 되어야 합니다.","말하기 전에 세 가지를 물어보세요. 사실인가? 필요한가? 친절한가?","내 말이 듣는 이에게 은혜가 되게 하겠습니다.","바울은 ‘더러운 말’을 버리라고 하면서, 그 대신 ‘덕을 세우는 말’을 하라고 합니다. 나쁜 말을 안 하는 것만으로는 부족합니다. 빈자리를 좋은 말로 채워야 합니다. 바로 다음 절은 ‘성령을 근심하게 하지 말라’고 이어집니다. 우리의 말은 성령님을 기쁘시게도, 근심하시게도 합니다.","주님, 더러운 말을 버리고 그 자리를 덕을 세우는 말로 채우게 하소서. 제 말이 성령님을 기쁘시게 하소서."],["야고보서 1:19","내 사랑하는 형제들아 너희가 알거니와 사람마다 듣기는 속히 하고 말하기는 더디 하며 성내기도 더디 하라","지혜","하나님이 귀는 두 개, 입은 하나를 주셨다는 말이 있습니다. 잘 듣는 것이 관계와 지혜의 시작입니다.","오늘 대화에서 상대가 말을 마칠 때까지 끝까지 들어 보세요. 대답을 준비하지 말고 이해하려고 들어 보세요.","듣기는 빨리, 말하기와 화내기는 천천히 하겠습니다.","디트리히 본회퍼는 『신도의 공동생활』에서 공동체 안의 여러 섬김을 이야기하며, 그중 ‘귀 기울여 들어 주는 것’을 우리가 이웃에게 해야 할 첫 번째 섬김으로 꼽았습니다. 그다음이 실제로 손을 내미는 섬김, 그리고 서로의 짐을 지는 섬김입니다. 섬김은 거창한 일이 아니라 들어 주는 귀에서 시작됩니다.","주님, 듣기는 빨리, 말하기와 화내기는 천천히 하게 하시고 귀 기울여 들어 주는 섬김을 하게 하소서."],["잠언 12:25","근심이 사람의 마음에 있으면 그것으로 번뇌케 하나 선한 말은 그것을 즐겁게 하느니라","지혜","근심은 마음을 무겁게 짓누르지만, 따뜻한 한마디가 그 마음을 가볍게 만들 수 있습니다.","주변에 근심 있어 보이는 사람이 있다면 오늘 ‘요즘 어때요?’라고 먼저 물어보세요.","나의 따뜻한 한마디로 누군가의 근심을 덜겠습니다.","근심은 마음을 짓누르는 무게입니다. 잠언은 그 무거운 마음을 가볍게 하는 것이 대단한 해결책이 아니라 ‘선한 말’ 한마디라고 말합니다. 우리는 다른 사람의 문제를 다 해결해 줄 수는 없어도, 그 마음을 가볍게 하는 말은 건넬 수 있습니다.","위로의 하나님, 근심하는 이웃에게 따뜻한 말 한마디를 건네게 하시고 그 마음이 가벼워지게 하소서."],["잠언 16:18","교만은 패망의 선봉이요 거만한 마음은 넘어짐의 앞잡이니라","겸손","교만은 넘어짐보다 앞서 가는 선발대와 같습니다. 성공했을 때가 가장 조심해야 할 때입니다.","일이 잘 풀릴 때 오히려 감사와 겸손을 점검해 보세요. 내가 이룬 것 뒤에 있는 도움의 손길을 기억하세요.","교만을 경계하고 겸손히 걷겠습니다.","교만은 넘어짐의 ‘앞잡이’, 곧 먼저 가는 선발대라고 합니다. 교만이 보이면 넘어짐이 가까이 왔다는 신호입니다. 그래서 성공의 순간이 가장 위험한 순간입니다. 사울 왕도 처음에는 겸손했지만 왕좌에 앉은 뒤 교만해졌습니다. 높아질수록 더 낮아져야 합니다.","주님, 일이 잘될 때 교만하지 않게 하시고 높아질수록 더 겸손히 주님을 의지하게 하소서."],["잠언 9:10","여호와를 경외하는 것이 지혜의 근본이요 거룩하신 자를 아는 것이 명철이니라","지혜","1장 7절과 짝을 이루는 말씀입니다. 참된 명철은 하나님을 아는 데서 옵니다.","공부와 일에 쏟는 시간만큼 하나님을 알아 가는 시간도 소중히 여기고 있나요? 오늘 말씀 한 장을 읽어 보세요.","하나님을 아는 것이 나의 지혜입니다.","잠언 9장은 지혜와 어리석음이 각각 잔치를 열고 사람들을 초대하는 장면입니다. 둘 다 ‘어리석은 자는 이리로 오라’고 부릅니다. 같은 초대처럼 보이지만 하나는 생명으로, 하나는 죽음으로 이끕니다. 하나님을 아는 것이 그 둘을 분별하는 명철입니다.","거룩하신 하나님, 수많은 초대 가운데 생명으로 이끄는 지혜를 분별하게 하시고 주님을 더 깊이 알게 하소서."],["전도서 3:1","범사에 기한이 있고 천하에 무슨 목적이든지 다 이룰 때가 있나니","지혜","전도자는 날 때와 죽을 때, 울 때와 웃을 때 등 인생의 모든 일에 때가 있다고 노래합니다. 그 때를 정하시는 분은 하나님이십니다.","지금 내 인생은 어떤 ‘때’를 지나고 있나요? 심을 때인지, 기다릴 때인지, 거둘 때인지 분별해 보세요.","모든 일에 때가 있음을 믿고 주님의 때를 기다립니다.","전도서 3장은 ‘때’를 스물여덟 번 말합니다. 그리고 11절에서 ‘하나님이 모든 것을 지으시되 때를 따라 아름답게 하셨다’고 결론짓습니다. 지금이 우는 때라면 우는 것도 아름답고, 기다리는 때라면 기다리는 것도 아름답습니다. 모든 계절에는 그 계절의 아름다움이 있습니다.","때를 따라 아름답게 하시는 하나님, 제 인생의 지금 이 계절을 받아들이고 그 안의 아름다움을 보게 하소서."],["전도서 12:13","일의 결국을 다 들었으니 하나님을 경외하고 그 명령을 지킬찌어다 이것이 사람의 본분이니라","지혜","‘헛되고 헛되다’로 시작한 전도서의 최종 결론입니다. 모든 것을 다 경험해 본 사람이 내린 결론은 하나님을 경외하는 삶이었습니다.","무엇을 위해 살고 있는지 공허하게 느껴진다면, 사람의 본분이 무엇인지 다시 생각해 보세요.","하나님을 경외하는 것이 나의 본분입니다.","웨스트민스터 소요리문답의 첫 질문은 ‘사람의 제일 되는 목적이 무엇인가?’이고, 그 답은 ‘하나님을 영화롭게 하고 그분을 영원히 즐거워하는 것’입니다. 지혜로운 삶이란 결국 오늘의 작은 선택들을 이 목적에 맞추어 정렬하는 삶입니다.","주님, 하나님을 영화롭게 하고 주님을 즐거워하는 삶의 목적에 맞추어 오늘의 선택을 하게 하소서."],["잠언 27:17","철이 철을 날카롭게 하는 것 같이 사람이 그 친구의 얼굴을 빛나게 하느니라","지혜","칼을 갈 때 철과 철이 부딪히듯, 좋은 친구는 서로를 연마하여 더 나은 사람이 되게 합니다.","나를 정직하게 조언해 주는 친구가 있나요? 오늘 그런 친구에게 감사를 표현하거나, 내가 누군가에게 그런 친구가 되어 주세요.","서로를 빛나게 하는 친구가 되겠습니다.","철은 서로 부딪힐 때 불꽃이 튀고 소리가 납니다. 좋은 우정도 늘 편안하지만은 않습니다. 정직한 조언은 아프지만 우리를 날카롭게 합니다. 잠언 27장 6절은 ‘친구의 통책은 충성에서 말미암는다’고 말합니다. 듣기 좋은 말만 하는 친구보다 진실을 말해 주는 친구가 더 귀합니다.","주님, 서로를 날카롭게 하는 정직한 친구를 주시고 저도 누군가에게 그런 친구가 되게 하소서."],["갈라디아서 5:1","그리스도께서 우리로 자유케 하려고 자유를 주셨으니 그러므로 굳세게 서서 다시는 종의 멍에를 메지 말라","거룩","광복절에 읽는 말씀입니다. 바울은 율법주의의 굴레에서 해방된 성도들에게 그 자유를 굳게 지키라고 말합니다.","나라의 자유를 위해 헌신한 분들을 기억하며 감사하세요. 동시에 나를 다시 묶으려는 죄와 두려움의 멍에는 무엇인지 돌아보세요.","그리스도께서 주신 자유 안에 굳게 서겠습니다.","광복절은 외적인 해방을 기억하는 날입니다. 바울은 내적인 해방을 말합니다. 율법주의, 죄책감, 사람의 시선이라는 멍에에서 그리스도께서 우리를 자유롭게 하셨습니다. 그 자유는 저절로 유지되지 않습니다. ‘굳세게 서서’ 지켜야 합니다. 나라의 자유를 위해 희생한 이들을 기억하듯, 우리를 자유롭게 하신 분을 기억합니다.","자유를 주신 주님, 나라의 자유를 위해 희생한 이들을 기억하며 감사하게 하시고 그리스도 안의 자유에 굳게 서게 하소서."],["시편 19:14","나의 반석이시요 나의 구속자이신 여호와여 내 입의 말과 마음의 묵상이 주의 앞에 열납되기를 원하나이다","지혜","창조와 말씀의 아름다움을 노래한 시편의 마지막 기도입니다. 겉으로 드러나는 말과 속으로 하는 생각이 모두 하나님 앞에 드려지기를 구합니다.","이 구절을 하루의 시작 기도로 삼아 보세요. 말과 생각을 하나님 앞에 드린다는 마음으로 하루를 살아 보세요.","내 말과 생각이 주님 앞에 기쁨이 되게 하소서.","시편 19편은 하늘이 하나님의 영광을 선포하는 것으로 시작해서 말씀의 완전함을 노래하고, 마지막에 시인 자신의 말과 생각으로 끝납니다. 우주에서 시작해 말씀을 거쳐 내 마음에 이릅니다. 하나님의 영광을 본 사람은 자기 입술과 마음까지 하나님께 드리고 싶어집니다.","나의 반석이요 구속자이신 주님, 오늘 제 입의 말과 마음의 묵상이 주님 앞에 기쁨이 되게 하소서."],["잠언 25:11","경우에 합당한 말은 아로새긴 은 쟁반에 금 사과니라","지혜","적절한 때에 꼭 맞는 말은 은 쟁반 위의 금 사과처럼 아름답고 귀하다는 비유입니다.","같은 말이라도 때를 잘 맞추는 것이 지혜입니다. 오늘 꼭 필요한 순간에 꼭 필요한 한마디를 건네 보세요.","때에 맞는 말로 아름다움을 더하겠습니다.","같은 금 사과도 아무 데나 놓으면 그 가치가 드러나지 않지만, 아름다운 은 쟁반에 놓이면 빛납니다. 말도 그렇습니다. 옳은 말이라도 때와 방식이 맞지 않으면 상처가 됩니다. 지혜는 무엇을 말할지와 함께 언제, 어떻게 말할지를 아는 것입니다.","지혜의 하나님, 옳은 말을 넘어 때에 맞는 말, 사랑이 담긴 방식으로 말하게 하소서."],["잠언 13:20","지혜로운 자와 동행하면 지혜를 얻고 미련한 자와 사귀면 해를 받느니라","지혜","함께하는 사람이 나를 만듭니다. 누구와 시간을 보내는지가 내가 어떤 사람이 되어 가는지를 결정합니다.","내가 가장 많이 시간을 보내는 사람, 보는 콘텐츠를 점검해 보세요. 지혜로운 사람과의 만남을 의도적으로 만들어 보세요.","지혜로운 사람과 동행하며 지혜를 배우겠습니다.","사람은 함께하는 사람을 닮아 갑니다. 이것은 오늘날 우리가 매일 보는 영상과 글에도 해당됩니다. 무엇을 보고 누구의 목소리를 듣는지가 우리를 만들어 갑니다. 지혜로운 사람과 함께 걷는다는 것은 지혜로운 말씀과 사람을 의도적으로 가까이 두는 것입니다.","주님, 제가 가까이하는 사람과 콘텐츠를 분별하게 하시고 지혜로운 이들과 동행하게 하소서."],["잠언 11:25","구제를 좋아하는 자는 풍족하여질 것이요 남을 윤택하게 하는 자는 자기도 윤택하여지리라","섬김","주는 사람이 오히려 풍성해진다는 역설의 지혜입니다. 나눔은 손해가 아니라 삶을 윤택하게 하는 길입니다.","오늘 작은 나눔을 실천해 보세요. 커피 한 잔, 기부, 시간을 내어 주는 것도 좋습니다.","나누는 삶이 나를 더 풍성하게 합니다.","‘윤택하게 하다’는 물을 준다는 뜻입니다. 다른 사람에게 물을 주는 사람은 자신도 물을 받게 됩니다. 고인 물은 썩지만 흐르는 물은 맑습니다. 나눔은 손해가 아니라 우리 삶이 흐르게 하는 통로입니다.","풍성하신 하나님, 받은 것을 흘려보내는 사람이 되게 하시고 나눔을 통해 제 삶도 윤택하게 하소서."],["잠언 22:1","많은 재물보다 명예를 택할 것이요 은이나 금보다 은총을 더욱 택할 것이니라","지혜","여기서 ‘명예’는 좋은 이름, 곧 신뢰받는 평판을 뜻합니다. 재물은 잃어도 다시 얻을 수 있지만 무너진 신뢰는 회복하기 어렵습니다.","작은 이익을 위해 정직함을 포기하고 싶은 유혹이 있다면, 이름의 가치를 기억하세요.","재물보다 좋은 이름을 지키겠습니다.","좋은 이름은 하루아침에 만들어지지 않습니다. 작은 약속을 지키고, 작은 이익 앞에서 정직하고, 아무도 보지 않을 때도 바르게 행한 시간이 쌓여 만들어집니다. 그리고 그렇게 쌓인 신뢰는 어떤 재물보다 오래갑니다.","주님, 작은 일에 정직하고 약속을 지켜 재물보다 귀한 좋은 이름을 얻게 하소서."],["골로새서 4:6","너희 말을 항상 은혜 가운데서 소금으로 고루게 함 같이 하라 그리하면 각 사람에게 마땅히 대답할 것을 알리라","지혜","소금은 맛을 내고 부패를 막습니다. 은혜롭고 지혜로운 말은 대화를 살리고 관계를 건강하게 지킵니다.","오늘 대화에 은혜라는 양념을 더해 보세요. 비판보다 이해, 정답보다 공감을 먼저 건네 보세요.","내 말이 은혜와 소금으로 맛을 내게 하겠습니다.","소금은 적당해야 합니다. 너무 없으면 싱겁고 너무 많으면 짭니다. 은혜 없는 진리는 사람을 아프게 하고, 진리 없는 은혜는 사람을 무르게 합니다. 바울은 우리의 말이 은혜 가운데 소금으로 맛을 낸 것이 되어야 한다고 말합니다. 진실하되 따뜻하게, 따뜻하되 진실하게.","주님, 제 말이 은혜와 진리가 균형을 이루어 듣는 이에게 맛을 내게 하소서."],["마태복음 7:24","그러므로 누구든지 나의 이 말을 듣고 행하는 자는 그 집을 반석 위에 세운 지혜로운 사람 같으리니","지혜","산상수훈의 결론입니다. 지혜로운 사람과 어리석은 사람의 차이는 말씀을 ‘들었느냐’가 아니라 ‘행했느냐’에 있습니다.","최근 들은 설교나 읽은 말씀 중 한 가지를 오늘 실제로 실천해 보세요. 그것이 반석을 놓는 일입니다.","말씀을 듣고 행하여 반석 위에 집을 짓겠습니다.","두 집은 겉으로 보면 똑같았을 것입니다. 차이는 보이지 않는 기초에 있었습니다. 그리고 그 차이는 비가 오고 바람이 불 때 드러났습니다. 평소에 말씀을 실천하며 놓은 기초는 위기의 순간에 우리를 지켜 줍니다.","반석이신 주님, 들은 말씀을 실천하게 하시고 제 삶의 기초가 위기 속에서도 무너지지 않게 하소서."],["마태복음 7:1","비판을 받지 아니하려거든 비판하지 말라","겸손","분별까지 하지 말라는 뜻이 아니라, 남을 정죄하고 깎아내리는 태도를 경계하는 말씀입니다. 이어서 예수님은 남의 눈 속 티보다 내 눈 속 들보를 먼저 보라고 하십니다.","누군가를 판단하고 싶어질 때, 먼저 나 자신을 돌아보는 시간을 가져 보세요.","남을 판단하기 전에 나를 먼저 돌아보겠습니다.","예수님은 비판하지 말라고 하신 뒤 같은 장에서 ‘거짓 선지자들을 삼가라’, ‘열매로 그들을 알리라’고 하십니다(15-16절). 분별은 필요합니다. 예수님이 금하신 것은 상대를 정죄하고 깎아내리며 나를 높이는 판단입니다. 먼저 내 눈의 들보를 볼 때 우리는 정죄 대신 긍휼로 분별할 수 있습니다.","주님, 남을 정죄하기 전에 제 눈의 들보를 먼저 보게 하시고 긍휼의 마음으로 분별하게 하소서."],["로마서 12:2","너희는 이 세대를 본받지 말고 오직 마음을 새롭게 함으로 변화를 받아 하나님의 선하시고 기뻐하시고 온전하신 뜻이 무엇인지 분별하도록 하라","지혜","‘본받다’는 틀에 찍혀 나오는 것을 뜻하고, ‘변화’는 애벌레가 나비가 되는 탈바꿈을 뜻합니다. 세상의 틀이 아니라 새로워진 마음으로 사는 삶입니다.","유행과 여론에 따라 생각이 흔들릴 때, 하나님의 뜻은 무엇인지 말씀으로 분별해 보세요.","세상의 틀이 아니라 새로운 마음으로 살겠습니다.","성경에서 ‘거룩’은 ‘구별되다’라는 뜻입니다. 설교자들은 거룩을 세상을 피해 숨는 것이 아니라 세상 한가운데서 다르게 사는 것이라고 설명합니다. 소금이 음식 속에 녹아 맛을 내듯, 그리스도인은 세상 속에서 구별된 삶으로 맛을 냅니다.","주님, 이 세대의 틀에 맞추어지지 않고 새로워진 마음으로 주님의 선하신 뜻을 분별하며 살게 하소서."],["빌립보서 4:8","종말로 형제들아 무엇에든지 참되며 무엇에든지 경건하며 무엇에든지 옳으며 무엇에든지 정결하며 무엇에든지 사랑할 만하며 무엇에든지 칭찬할 만하며 무슨 덕이 있든지 무슨 기림이 있든지 이것들을 생각하라","지혜","생각의 다이어트를 권하는 말씀입니다. 무엇을 생각하느냐가 마음의 평강과 삶의 방향을 결정합니다.","오늘 부정적인 생각이 떠오를 때 이 목록에 비추어 보세요. 참되고 아름다운 것을 일부러 찾아 생각해 보세요.","참되고 아름다운 것을 생각하겠습니다.","바울은 생각할 거리 목록을 준 다음, 9절에서 ‘내게 배우고 받고 듣고 본 바를 행하라’고 합니다. 좋은 생각은 좋은 행동으로 이어집니다. 무엇을 생각하느냐가 무엇을 하느냐를 만들고, 무엇을 하느냐가 결국 어떤 사람이 되느냐를 결정합니다.","주님, 참되고 아름답고 칭찬받을 만한 것을 생각하게 하시고 그 생각이 선한 행동으로 이어지게 하소서."],["잠언 17:22","마음의 즐거움은 양약이라도 심령의 근심은 뼈로 마르게 하느니라","기쁨","마음과 몸이 연결되어 있다는 오래된 지혜입니다. 즐거운 마음은 좋은 약처럼 사람을 건강하게 합니다.","오늘 일부러 웃을 일을 만들어 보세요. 가족이나 친구와 즐거운 이야기를 나누는 것도 좋은 약입니다.","즐거운 마음이 나를 살리는 약이 됩니다.","잠언은 마음과 몸이 깊이 연결되어 있다고 말합니다. 즐거운 마음은 좋은 약처럼 몸을 살리고, 근심은 뼈를 마르게 합니다. 하나님은 우리가 웃기를 원하십니다. 그리스도인의 기쁨은 문제를 모른 척하는 것이 아니라 문제보다 크신 하나님을 아는 데서 나옵니다.","기쁨의 하나님, 근심에 짓눌리지 않게 하시고 주님 안에서 즐거운 마음을 누리게 하소서."],["잠언 14:30","마음의 화평은 육신의 생명이나 시기는 뼈의 썩음이니라","평안","평안한 마음은 몸에 생명을 주지만, 시기심은 뼈까지 썩게 합니다. 비교와 질투는 결국 나를 해칩니다.","누군가를 부러워하는 마음이 든다면, 그 사람을 축복하는 기도로 바꾸어 보세요. 시기는 축복으로 이깁니다.","시기 대신 평안을, 비교 대신 축복을 선택합니다.","시기는 남이 가진 것을 보며 내 것을 잃게 만듭니다. 사울은 다윗을 시기하다가 결국 자신을 무너뜨렸습니다. 마음의 화평은 비교를 멈출 때 찾아옵니다. 남을 축복할 수 있는 사람은 자기 안에 이미 충분한 것이 있음을 아는 사람입니다.","화평의 하나님, 남과 비교하며 시기하는 마음을 내려놓게 하시고 이웃의 잘됨을 진심으로 축복하게 하소서."],["시편 139:23-24","하나님이여 나를 살피사 내 마음을 아시며 나를 시험하사 내 뜻을 아옵소서 내게 무슨 악한 행위가 있나 보시고 나를 영원한 길로 인도하소서","거룩","하나님이 나를 모태에서부터 아신다고 노래한 시편의 마지막 기도입니다. 스스로는 보지 못하는 내 마음을 하나님께 비추어 달라고 구합니다.","잠들기 전, 이 구절로 기도하며 오늘 하루 하나님이 보여 주시는 것을 조용히 기다려 보세요.","주님, 나를 살피시고 영원한 길로 인도하소서.","종교개혁자 칼뱅은 『기독교 강요』를 하나님을 아는 지식과 우리 자신을 아는 지식에서 시작합니다. 그는 이 두 지식이 서로 얽혀 있어서, 하나님을 알 때 나를 바로 알게 되고 나를 정직하게 볼 때 하나님을 찾게 된다고 말했습니다. 성경의 지혜는 정보의 양이 아니라 이 두 가지 앎의 깊이입니다.","주님, 저를 살피시고 제 마음을 아시오니 제 안의 악한 길을 보여 주시고 영원한 길로 인도하소서."],["잠언 19:11","노하기를 더디 하는 것이 사람의 슬기요 허물을 용서하는 것이 자기의 영광이니라","용서","참는 것은 지는 것이 아니라 지혜이고, 용서하는 것은 굴욕이 아니라 영광이라는 말씀입니다.","오늘 화가 날 때 열을 세어 보세요. 그리고 작은 허물 하나를 그냥 넘어가 주세요.","노하기를 더디 하고 허물을 덮어 주겠습니다.","노하기를 더디 하는 것은 하나님의 성품입니다. 출애굽기 34장 6절에서 하나님은 스스로를 ‘노하기를 더디 하는’ 분으로 소개하셨습니다. 그러니 화를 참는 것은 단지 처세술이 아니라 하나님을 닮아 가는 일입니다. 허물을 덮을 때 우리는 하나님의 영광을 반영합니다.","노하기를 더디 하시는 하나님, 주님을 닮아 화를 참고 허물을 덮어 주는 넉넉함을 주소서."],["잠언 6:6","게으른 자여 개미에게로 가서 그 하는 것을 보고 지혜를 얻으라","지혜","개미는 감독자가 없어도 여름에 양식을 준비합니다. 성실함은 누가 보지 않아도 할 일을 하는 것입니다.","미뤄 둔 일 하나를 오늘 시작해 보세요. 작은 성실이 쌓여 큰 결실이 됩니다.","작은 개미처럼 성실하게 오늘을 살겠습니다.","개미에게는 ‘두령도 없고 감독자도 없고 주권자도 없으되’ 스스로 양식을 준비합니다(7절). 누가 시키지 않아도 해야 할 일을 하는 것, 그것이 성실함입니다. 게으름은 큰 결심으로 고쳐지지 않습니다. 오늘 해야 할 작은 일 하나를 지금 시작하는 것으로 고쳐집니다.","주님, 누가 보지 않아도 맡은 일을 성실히 하게 하시고 미뤄 둔 일을 오늘 시작하게 하소서."],["시편 1:1","복 있는 사람은 악인의 꾀를 좇지 아니하며 죄인의 길에 서지 아니하며 오만한 자의 자리에 앉지 아니하고","거룩","시편 전체의 문을 여는 말씀입니다. ‘좇고, 서고, 앉는’ 동사의 흐름은 악에 점점 깊이 빠져드는 과정을 보여 줍니다.","나도 모르게 젖어 든 잘못된 습관이나 대화 자리가 있나요? 그 자리에서 일어나는 것이 복의 시작입니다.","나는 복 있는 길을 선택하겠습니다.","시편 1편은 두 길을 보여 줍니다. 복 있는 사람의 길과 악인의 길. 그리고 마지막 절은 ‘여호와께서 의인의 길은 인정하시나 악인의 길은 망하리로다’로 끝납니다. 지혜의 달을 마치며, 오늘 나는 어느 길에 서 있는지, 어떤 자리에 앉아 있는지 돌아봅니다.","의인의 길을 인정하시는 하나님, 악인의 꾀를 따르지 않고 복 있는 길을 선택하며 걷게 하소서."],["마가복음 10:45","인자가 온 것은 섬김을 받으려 함이 아니라 도리어 섬기려 하고 자기 목숨을 많은 사람의 대속물로 주려 함이니라","섬김","누가 높은 자리에 앉을지 다투는 제자들에게 하신 말씀입니다. 예수님은 리더십을 섬김으로 다시 정의하셨습니다.","오늘 내 자리에서 섬김을 받으려 하기보다 먼저 섬길 기회를 찾아보세요. 직장, 가정, 교회 어디서든 가능합니다.","섬기러 오신 예수님을 따라 나도 섬기겠습니다.","예수님은 이 말씀 직전에 야고보와 요한이 높은 자리를 구하는 것을 들으셨습니다. 다른 제자들은 분개했습니다. 그런데 사실 모두가 같은 것을 원하고 있었습니다. 예수님은 그들 모두에게 새로운 위대함을 보여 주십니다. 아래로 내려가는 것, 그것이 하나님 나라의 올라감입니다.","섬기러 오신 주님, 높은 자리를 구하는 마음을 내려놓고 오늘 제 자리에서 먼저 섬기게 하소서."],["빌립보서 2:3","아무 일에든지 다툼이나 허영으로 하지 말고 오직 겸손한 마음으로 각각 자기보다 남을 낫게 여기고","겸손","빌립보 교회 안의 갈등을 염두에 둔 권면입니다. 겸손은 나를 낮추는 것이라기보다 남을 귀하게 여기는 것입니다.","오늘 만나는 사람에게서 배울 점 한 가지를 찾아보세요. 남을 낫게 여기는 연습입니다.","나보다 남을 낫게 여기는 겸손을 배우겠습니다.","C.S. 루이스는 『순전한 기독교』에서, 정말 겸손한 사람을 만난다면 그는 겸손에 대해서도, 자기 자신에 대해서도 그다지 생각하지 않는 사람일 것이라고 말했습니다. 겸손은 나를 깎아내리는 것이 아니라, 관심이 나에게서 하나님과 이웃에게로 옮겨 가는 것입니다.","주님, 다툼과 허영을 내려놓고 겸손한 마음으로 남을 낫게 여기게 하소서."],["빌립보서 2:4","각각 자기 일을 돌아볼 뿐더러 또한 각각 다른 사람들의 일을 돌아보아","섬김","자기 일만 챙기지 말고 이웃의 필요에도 관심을 두라는 말씀입니다. 바로 다음 구절에서 바울은 그리스도의 마음을 품으라고 이어 갑니다.","오늘 주변 사람의 필요를 하나 발견하고 도와주세요. 작은 관심이 공동체를 따뜻하게 합니다.","내 일과 함께 이웃의 일도 돌아보겠습니다.","바울은 ‘자기 일을 돌아보지 말라’고 하지 않고 ‘자기 일을 돌아볼 뿐더러’라고 말합니다. 자기 일을 책임지는 것도 중요합니다. 다만 거기서 멈추지 말고 이웃의 일까지 시야를 넓히라는 것입니다. 바쁜 하루 속에서도 고개를 들어 옆 사람을 보는 여유가 사랑입니다.","주님, 제 일에 충실하면서도 고개를 들어 이웃의 필요를 보게 하시고 기꺼이 돕게 하소서."],["마태복음 5:16","이같이 너희 빛을 사람 앞에 비취게 하여 저희로 너희 착한 행실을 보고 하늘에 계신 너희 아버지께 영광을 돌리게 하라","섬김","빛은 숨기라고 있는 것이 아닙니다. 그리스도인의 착한 행실은 자기 자랑이 아니라 하나님께 영광을 돌리는 통로가 됩니다.","오늘 나의 일터에서 정직과 친절로 빛을 비춰 보세요. 말보다 삶이 더 강력한 증거입니다.","내 삶의 빛으로 하나님께 영광을 돌리겠습니다.","빛은 자신을 비추지 않고 다른 것을 비춥니다. 그래서 사람들은 빛을 보는 것이 아니라 빛 덕분에 다른 것을 봅니다. 그리스도인의 착한 행실도 자기를 드러내기 위한 것이 아니라 하나님을 보게 하는 것입니다. 사람들이 우리를 칭찬하는 것이 아니라 하나님께 영광을 돌릴 때 빛은 제 역할을 한 것입니다.","세상의 빛 되게 하신 주님, 제 착한 행실이 저를 드러내지 않고 하나님께 영광이 되게 하소서."],["에베소서 4:32","서로 인자하게 하며 불쌍히 여기며 서로 용서하기를 하나님이 그리스도 안에서 너희를 용서하심과 같이 하라","용서","용서의 기준은 상대가 얼마나 잘못했느냐가 아니라, 하나님이 나를 얼마나 용서하셨느냐입니다.","용서하기 어려운 사람이 있다면, 하나님이 용서하신 나의 허물을 먼저 떠올려 보세요.","주님이 나를 용서하셨듯 나도 용서하겠습니다.","바울은 용서하라고 하기 전에 ‘서로 인자하게 하며 불쌍히 여기라’고 합니다. 용서는 갑자기 생기지 않습니다. 평소에 친절하고 긍휼히 여기는 마음이 쌓여 있을 때 용서가 가능해집니다. 용서의 근육은 작은 친절로 단련됩니다.","용서하신 하나님, 평소에 친절하고 긍휼한 마음을 품게 하시고 주님이 저를 용서하신 것처럼 용서하게 하소서."],["마태복음 5:9","화평케 하는 자는 복이 있나니 저희가 하나님의 아들이라 일컬음을 받을 것임이요","섬김","화평을 ‘지키는’ 사람이 아니라 ‘만드는’ 사람이 복이 있습니다. 갈등을 피하는 것이 아니라 적극적으로 화해를 이루는 사람입니다.","갈등 중인 두 사람 사이에서, 혹은 나와 누군가 사이에서 화해의 다리를 놓아 보세요.","나는 화평을 만드는 사람이 되겠습니다.","화평을 만드는 사람은 하나님의 아들이라 불립니다. 하나님이 하시는 일을 하기 때문입니다. 하나님은 십자가를 통해 원수 된 우리와 화평을 이루셨습니다(골 1:20). 화평을 만드는 데는 대가가 따릅니다. 갈등 사이에 서는 사람은 양쪽에서 오해받을 수도 있지만, 그것이 하나님의 아들다운 길입니다.","화평의 하나님, 갈등 사이에 다리를 놓는 사람이 되게 하시고 그 대가도 기꺼이 감당하게 하소서."],["마태복음 25:40","임금이 대답하여 가라사대 내가 진실로 너희에게 이르노니 너희가 여기 내 형제 중에 지극히 작은 자 하나에게 한 것이 곧 내게 한 것이니라","섬김","굶주린 자, 나그네, 병든 자, 갇힌 자를 섬긴 것이 곧 예수님을 섬긴 것이라는 말씀입니다. 예수님은 가장 작은 이들 속에 계십니다.","오늘 만나는 가장 작고 약한 사람을 예수님을 대하듯 대해 보세요.","지극히 작은 자 속에서 주님을 만나겠습니다.","이 비유에서 놀라운 것은 의인들도 자신이 예수님을 섬긴 줄 몰랐다는 사실입니다. ‘주여 우리가 어느 때에 주께서 주리신 것을 보고...?’ 그들은 예수님께 점수를 따려고 한 것이 아니라 그저 눈앞의 사람을 도왔을 뿐입니다. 진짜 섬김은 계산하지 않습니다.","가장 작은 자 안에 계신 주님, 계산하지 않고 눈앞의 이웃을 섬기게 하시고 그 안에서 주님을 만나게 하소서."],["갈라디아서 6:2","너희가 짐을 서로 지라 그리하여 그리스도의 법을 성취하라","섬김","‘그리스도의 법’은 사랑의 법입니다. 서로의 짐을 나누어 지는 것이 그리스도를 따르는 삶입니다.","혼자 무거운 짐을 지고 있는 사람이 주변에 있나요? 오늘 그 짐의 일부를 함께 들어 주세요.","서로의 짐을 지는 것으로 사랑의 법을 이루겠습니다.","갈라디아서 6장 5절은 ‘각각 자기의 짐을 질 것이라’고 말합니다. 2절과 모순처럼 보이지만 서로 다른 단어입니다. 2절의 짐은 혼자 들 수 없는 무거운 짐이고, 5절의 짐은 각자가 져야 할 배낭입니다. 각자의 몫은 성실히 지되, 누군가 감당할 수 없는 짐을 질 때는 함께 들어야 합니다.","주님, 제 몫의 짐은 성실히 지게 하시고 이웃이 감당할 수 없는 짐을 질 때 함께 들어 주게 하소서."],["갈라디아서 6:10","그러므로 우리는 기회 있는대로 모든 이에게 착한 일을 하되 더욱 믿음의 가정들에게 할찌니라","섬김","선을 행할 기회는 항상 있는 것이 아닙니다. 기회가 왔을 때 놓치지 않는 것이 지혜입니다.","오늘 선을 행할 기회가 보이면 미루지 말고 바로 행동해 보세요.","기회 있는 대로 선을 행하겠습니다.","‘기회 있는 대로’라는 말은 기회가 늘 있지 않다는 뜻이기도 합니다. 선을 행할 수 있는 순간은 왔다가 지나갑니다. 내일 하겠다고 미루는 사이 그 사람은 떠나고, 그 상황은 바뀝니다. 지금 내 앞에 있는 기회가 하나님이 주신 기회입니다.","주님, 선을 행할 기회를 알아보는 눈을 주시고 미루지 않고 지금 행하게 하소서."],["히브리서 13:16","오직 선을 행함과 서로 나눠 주기를 잊지 말라 이같은 제사는 하나님이 기뻐하시느니라","섬김","구약의 동물 제사가 끝난 뒤, 그리스도인이 드리는 새로운 제사는 선행과 나눔입니다.","나눔을 ‘잊지 말라’는 것은 우리가 쉽게 잊는다는 뜻입니다. 오늘 정기적인 나눔 계획을 세워 보세요.","선을 행하고 나누는 것이 나의 예배입니다.","히브리서는 우리가 드릴 제사를 두 가지로 말합니다. 15절은 ‘찬미의 제사’, 16절은 ‘선을 행함과 나눔의 제사’입니다. 입술로 드리는 예배와 손으로 드리는 예배가 함께 있어야 합니다. 찬양만 있고 나눔이 없거나, 나눔만 있고 찬양이 없으면 반쪽 예배입니다.","주님, 입술의 찬양과 손의 나눔이 함께하는 온전한 예배를 드리게 하소서."],["베드로전서 4:10","각각 은사를 받은대로 하나님의 각양 은혜를 맡은 선한 청지기 같이 서로 봉사하라","섬김","은사는 내 것이 아니라 맡겨진 것입니다. 청지기는 주인의 것을 주인의 뜻대로 사용하는 사람입니다.","나에게 주신 재능과 시간을 오늘 누군가를 위해 사용해 보세요. 작은 재능도 귀하게 쓰입니다.","받은 은사로 서로를 섬기겠습니다.","‘각양 은혜’라는 말은 여러 색깔의 은혜라는 뜻입니다. 하나님의 은혜는 한 가지 색이 아니라 다채롭습니다. 그래서 우리는 서로 다른 은사를 받았습니다. 누군가는 말하는 은사, 누군가는 돕는 은사. 서로 다른 색이 모일 때 하나님의 은혜가 온전히 드러납니다.","다양한 은사를 주신 하나님, 제게 주신 은사를 귀히 여기고 다른 이의 은사도 존중하며 함께 섬기게 하소서."],["베드로전서 5:5","젊은 자들아 이와 같이 장로들에게 순복하고 다 서로 겸손으로 허리를 동이라 하나님이 교만한 자를 대적하시되 겸손한 자들에게는 은혜를 주시느니라","겸손","‘허리를 동이다’는 종이 일하기 위해 앞치마를 두르는 모습입니다. 겸손은 섬기기 위해 준비된 태도입니다.","오늘 나보다 경험 많은 사람의 조언을 경청하고, 나보다 어린 사람을 존중해 보세요.","겸손으로 허리를 동이고 은혜를 구합니다.","‘허리를 동이라’는 동사는 종이 일할 때 두르던 앞치마를 묶는 모습입니다. 베드로는 예수님이 수건을 허리에 두르시고 제자들의 발을 씻기신 밤을 기억하고 있었을 것입니다(요 13:4). 겸손은 마음의 태도이면서 동시에 섬기기 위해 준비된 몸짓입니다.","겸손히 섬기신 주님, 저도 겸손의 앞치마를 두르고 섬길 준비가 된 사람이 되게 하소서."],["야고보서 4:10","주 앞에서 낮추라 그리하면 주께서 너희를 높이시리라","겸손","높아지는 길은 스스로 올라가는 것이 아니라 하나님 앞에서 낮아지는 것입니다. 하나님의 나라는 세상과 반대 방향으로 움직입니다.","인정받고 싶은 마음이 강한 날, 오히려 하나님 앞에서 낮아지는 기도를 드려 보세요.","주님 앞에서 낮아지고 주님의 때를 기다립니다.","1992년 한경직 목사는 ‘종교계의 노벨상’이라 불리는 템플턴상을 받았습니다. 그런데 그는 수상을 축하하는 자리에서 일제강점기에 신사참배에 참여했던 자신의 죄를 먼저 고백했습니다. 가장 높이 인정받은 자리에서 가장 낮게 엎드린 그 모습은 지금도 한국 교회에 깊은 울림을 줍니다.","주님, 주님 앞에서 낮아집니다. 높아지려는 마음을 내려놓고 주님의 때에 높이심을 기다리게 하소서."],["잠언 11:2","교만이 오면 욕도 오거니와 겸손한 자에게는 지혜가 있느니라","겸손","교만은 수치를 데려오지만, 겸손은 지혜를 데려옵니다. 배우려는 마음이 겸손이고, 겸손한 사람이 지혜로워집니다.","‘내가 틀릴 수도 있다’는 마음으로 오늘 대화에 임해 보세요. 겸손이 새로운 배움의 문을 엽니다.","겸손한 마음으로 지혜를 배우겠습니다.","남아프리카의 목회자 앤드류 머레이는 『겸손』에서 겸손을 여러 덕목 중 하나가 아니라 모든 덕의 뿌리라고 말했습니다. 그에게 겸손은 자신을 비하하는 것이 아니라, 하나님 앞에서 피조물로서의 제자리를 아는 것이었습니다. 제자리를 아는 사람은 남과 비교하며 높아지거나 낮아지지 않습니다.","주님, 교만 대신 겸손을 입게 하시고 배우려는 마음으로 지혜를 얻게 하소서."],["누가복음 14:11","무릇 자기를 높이는 자는 낮아지고 자기를 낮추는 자는 높아지리라","겸손","잔치에서 높은 자리를 다투는 사람들을 보신 예수님의 말씀입니다. 스스로 높은 자리를 차지하면 부끄러움을 당하지만, 낮은 자리에 앉으면 높여 주신다고 하십니다.","모임에서 좋은 자리, 먼저 말할 기회를 다른 사람에게 양보해 보세요.","스스로 높이지 않고 낮은 자리를 선택하겠습니다.","예수님은 잔치에 초대받으면 끝자리에 앉으라고 하신 뒤, 잔치를 베풀 때는 갚을 수 없는 사람들을 초대하라고 하십니다(12-14절). 겸손은 내가 어디에 앉느냐의 문제만이 아니라 누구를 초대하느냐의 문제이기도 합니다. 낮은 자리를 택하는 사람은 낮은 자리의 사람들을 볼 수 있습니다.","주님, 낮은 자리를 기꺼이 택하게 하시고 갚을 수 없는 이들을 환대하는 넉넉함을 주소서."],["요한복음 13:14","내가 주와 또는 선생이 되어 너희 발을 씻겼으니 너희도 서로 발을 씻기는 것이 옳으니라","섬김","발을 씻기는 일은 가장 낮은 종이 하던 일이었습니다. 예수님은 마지막 만찬에서 친히 제자들의 발을 씻기시며 섬김의 본을 보이셨습니다.","오늘 아무도 하고 싶어 하지 않는 일을 기꺼이 맡아 보세요. 그것이 발을 씻기는 섬김입니다.","주님이 본을 보이신 섬김을 따르겠습니다.","예수님이 발을 씻기신 제자들 중에는 곧 자신을 배반할 유다도 있었습니다. 예수님은 그 사실을 아시면서도 그의 발을 씻기셨습니다. 섬김은 상대가 그럴 자격이 있을 때만 하는 것이 아닙니다. 그래서 예수님의 섬김은 우리에게 가장 어려운 도전입니다.","배반할 자의 발도 씻기신 주님, 자격을 따지지 않고 섬기는 사랑을 배우게 하소서."],["마태복음 20:26","너희 중에는 그렇지 아니하니 너희 중에 누구든지 크고자 하는 자는 너희를 섬기는 자가 되고","섬김","세상의 권력자들은 사람들을 지배하지만, 예수님의 공동체는 다르다고 하십니다. 큰 사람은 섬기는 사람입니다.","리더의 자리에 있다면, 오늘 팀원 한 사람의 필요를 물어보고 도와주세요.","크고자 한다면 먼저 섬기겠습니다.","‘섬기는 자’로 번역된 단어는 식탁에서 시중드는 사람을 뜻합니다. 이것이 ‘집사’라는 말의 어원입니다. 교회의 직분은 높아지는 자리가 아니라 시중드는 자리입니다. 직장과 가정에서도 리더는 가장 많이 섬기는 사람이어야 합니다.","주님, 제가 맡은 자리가 높아지는 자리가 아니라 시중드는 자리임을 기억하게 하소서."],["로마서 12:15","즐거워하는 자들로 함께 즐거워하고 우는 자들로 함께 울라","사랑","공감은 사랑의 기본입니다. 함께 울기보다 함께 기뻐하기가 더 어렵다는 말도 있습니다. 남의 성공을 진심으로 축하하는 것도 사랑입니다.","오늘 기쁜 소식이 있는 사람에게 진심으로 축하하고, 슬픈 일이 있는 사람 곁에 함께 있어 주세요.","함께 웃고 함께 우는 사람이 되겠습니다.","함께 우는 것보다 함께 기뻐하는 것이 더 어렵다는 말이 있습니다. 남의 슬픔에는 동정이 생기지만, 남의 기쁨에는 시기가 생기기 쉽기 때문입니다. 진정한 사랑은 다른 사람의 성공을 내 것처럼 기뻐하는 것입니다. 그것은 내 마음이 하나님 안에서 안정되어 있을 때 가능합니다.","주님, 이웃의 기쁨을 시기하지 않고 진심으로 함께 기뻐하며, 슬퍼하는 이와 함께 울게 하소서."],["로마서 12:18","할 수 있거든 너희로서는 모든 사람으로 더불어 평화하라","섬김","‘할 수 있거든’과 ‘너희로서는’이라는 단서가 현실적입니다. 모든 관계가 다 좋을 수는 없지만, 내 쪽에서 할 수 있는 노력은 다하라는 말씀입니다.","관계가 틀어진 사람에게 내가 할 수 있는 한 가지—사과, 안부, 기도—를 실천해 보세요.","내 쪽에서 할 수 있는 만큼 화평을 이루겠습니다.","바울은 화평이 늘 가능하지는 않다는 것을 압니다. 그래서 ‘할 수 있거든’이라는 단서를 붙입니다. 상대가 원하지 않으면 화평은 이루어지지 않을 수 있습니다. 그러나 내 쪽의 문은 열어 두어야 합니다. 다음 절은 ‘원수 갚는 것은 하나님께 맡기라’고 이어집니다.","화평의 하나님, 제 쪽에서 할 수 있는 만큼 화평을 이루게 하시고 나머지는 주님께 맡기게 하소서."],["로마서 15:1","우리 강한 자가 마땅히 연약한 자의 약점을 담당하고 자기를 기쁘게 하지 아니할 것이라","섬김","믿음이 강한 사람은 약한 사람을 무시하는 것이 아니라, 그 약함을 함께 짊어져야 한다고 바울은 말합니다.","나보다 약한 사람의 속도에 맞춰 걸어 주세요. 공동체는 가장 약한 사람의 속도로 함께 갑니다.","강한 자로서 약한 자의 짐을 함께 지겠습니다.","바울은 이어서 ‘그리스도께서도 자기를 기쁘게 하지 아니하셨다’고 말합니다(3절). 강한 사람의 특권은 약한 사람을 무시하는 것이 아니라 그들을 위해 자기 편리를 내려놓는 것입니다. 공동체의 건강함은 가장 약한 사람이 어떻게 대우받는지로 드러납니다.","주님, 제가 가진 힘을 약한 이웃을 위해 쓰게 하시고 제 편리보다 그들의 필요를 먼저 보게 하소서."],["히브리서 10:24","서로 돌아보아 사랑과 선행을 격려하며","섬김","‘격려하다’는 원래 자극하다, 불을 붙인다는 뜻입니다. 서로가 사랑과 선행을 하도록 북돋는 공동체가 건강한 공동체입니다.","오늘 누군가의 선한 행동을 발견하고 칭찬해 주세요. 격려는 더 큰 선을 낳습니다.","서로를 사랑과 선행으로 북돋겠습니다.","‘서로 돌아보라’는 말은 주의 깊게 살펴보라는 뜻입니다. 대충 보는 것이 아니라 그 사람의 형편과 마음을 헤아리는 것입니다. 그래야 어떤 격려가 필요한지 알 수 있습니다. 바로 다음 절은 ‘모이기를 폐하지 말라’고 이어집니다. 서로를 돌아보려면 함께 있어야 합니다.","주님, 서로를 주의 깊게 돌아보게 하시고 공동체 안에서 사랑과 선행을 북돋는 사람이 되게 하소서."],["히브리서 13:2","손님 대접하기를 잊지 말라 이로써 부지중에 천사들을 대접한 이들이 있었느니라","섬김","아브라함이 나그네를 대접했는데 그들이 천사였던 이야기를 떠올리게 합니다. 환대는 하나님을 만나는 통로가 될 수 있습니다.","새로 온 동료, 이웃, 교인에게 먼저 다가가 환영해 주세요. 낯선 이를 향한 환대가 귀한 만남을 엽니다.","낯선 이를 환대하며 주님을 만나겠습니다.","‘손님 대접’으로 번역된 단어는 원래 ‘낯선 사람을 사랑함’이라는 뜻입니다. 아는 사람을 대접하는 것은 쉽지만, 낯선 사람을 환영하는 것은 용기가 필요합니다. 초대 교회는 나그네를 환대하는 것으로 유명했고, 그것이 복음이 퍼지는 통로가 되었습니다.","나그네를 환대하신 하나님, 낯선 이를 두려워하지 않고 사랑으로 맞이하는 넉넉함을 주소서."],["사도행전 20:35","범사에 너희에게 모본을 보였노니 곧 이같이 수고하여 약한 사람들을 돕고 또 주 예수의 친히 말씀하신 바 주는 것이 받는 것보다 복이 있다 하심을 기억하여야 할찌니라","섬김","에베소 장로들에게 남긴 바울의 고별 설교입니다. 복음서에 기록되지 않은 예수님의 말씀을 인용하며, 주는 기쁨을 강조합니다.","오늘 받기보다 주는 기쁨을 경험해 보세요. 시간, 물질, 칭찬 무엇이든 좋습니다.","주는 것이 받는 것보다 복됨을 오늘 경험하겠습니다.","바울은 에베소 장로들과 작별하며 자신이 손수 일해서 필요를 채웠다고 말합니다(34절). 그는 받을 권리가 있었지만 주는 쪽을 택했습니다. 주는 것이 받는 것보다 복되다는 말씀은 바울에게 이론이 아니라 삶이었습니다. 주는 사람은 소유에 매이지 않는 자유를 누립니다.","주님, 받기보다 주는 기쁨을 알게 하시고 소유에 매이지 않는 자유를 누리게 하소서."],["고린도후서 9:7","각각 그 마음에 정한대로 할 것이요 인색함으로나 억지로 하지 말찌니 하나님은 즐겨 내는 자를 사랑하시느니라","섬김","예루살렘의 가난한 성도를 돕는 헌금에 대한 말씀입니다. 액수보다 마음이 중요합니다. ‘즐겨 내는’은 기쁨으로 내는 것을 말합니다.","나눔이 의무감으로 무겁게 느껴졌다면, 이번에는 미리 마음에 정하고 기쁨으로 드려 보세요.","억지가 아니라 기쁨으로 나누겠습니다.","‘즐겨 내는 자’의 ‘즐겨’는 헬라어로 ‘힐라로스’, 영어 ‘hilarious’의 어원입니다. 즐거움이 넘쳐 웃음이 나는 모습입니다. 하나님은 억지로 짜낸 큰 헌금보다 기쁨으로 드리는 작은 헌금을 더 기뻐하십니다. 드리는 기쁨을 아는 사람은 이미 부자입니다.","즐겨 내는 자를 사랑하시는 하나님, 억지가 아니라 기쁨으로 드리고 나누는 사람이 되게 하소서."],["잠언 3:27","네 손이 선을 베풀 힘이 있거든 마땅히 받을 자에게 베풀기를 아끼지 말며","섬김","선을 베풀 수 있는 힘이 있을 때 미루지 말라는 말씀입니다. 다음 절은 ‘내일 주겠다’고 하지 말라고 이어집니다.","도울 수 있는데 미루고 있는 일이 있다면 오늘 바로 실행해 보세요.","선을 베풀 수 있을 때 아끼지 않겠습니다.","다음 절은 ‘네게 있거든 이웃에게 이르기를 갔다가 다시 오라 내일 주겠노라 하지 말며’라고 말합니다. 미루는 것은 종종 거절의 다른 이름입니다. 도울 수 있을 때 돕는 것, 그것이 선을 베푸는 지혜입니다.","주님, 도울 수 있는데 미루지 않게 하시고 지금 제 손으로 선을 베풀게 하소서."],["잠언 19:17","가난한 자를 불쌍히 여기는 것은 여호와께 꾸이는 것이니 그 선행을 갚아 주시리라","섬김","가난한 이를 돕는 것은 하나님께 빌려 드리는 것과 같다는 놀라운 표현입니다. 하나님은 그 빚을 반드시 갚으십니다.","주변의 어려운 이웃이나 구호 단체를 위해 작은 나눔을 실천해 보세요.","가난한 이웃을 돕는 것은 하나님께 드리는 것입니다.","하나님은 가난한 사람과 자신을 동일시하십니다. 그들에게 베푸는 것을 하나님께 빌려 드리는 것으로 여기시고 반드시 갚겠다고 하십니다. 하나님께 빚을 지게 하는 유일한 방법이 가난한 이웃을 돕는 것이라는 말도 있습니다.","가난한 자를 돌보시는 하나님, 어려운 이웃을 외면하지 않고 긍휼의 손을 내밀게 하소서."],["누가복음 10:37","가로되 자비를 베푼 자니이다 예수께서 이르시되 가서 너도 이와 같이 하라 하시니라","섬김","선한 사마리아인 비유의 결론입니다. ‘누가 내 이웃인가’를 묻던 율법사에게 예수님은 ‘누가 이웃이 되어 주었는가’로 질문을 바꾸십니다.","오늘 ‘저 사람이 내 이웃인가?’를 따지기보다 내가 먼저 이웃이 되어 주세요.","가서 나도 이와 같이 자비를 베풀겠습니다.","율법사는 ‘내 이웃이 누구입니까?’라고 물었습니다. 이웃의 범위를 정하고 싶었던 것입니다. 그러나 예수님은 질문을 뒤집으셨습니다. ‘누가 이웃이 되어 주었느냐?’ 이웃은 정해진 범위가 아니라 내가 되어 주는 관계입니다. 그리고 그 비유의 주인공은 당시 멸시받던 사마리아인이었습니다.","주님, 이웃의 범위를 정하지 않고 제가 먼저 누군가의 이웃이 되어 주게 하소서."],["마태복음 6:3","너는 구제할 때에 오른손의 하는 것을 왼손이 모르게 하여","겸손","당시 일부 사람들은 나팔을 불며 자신의 선행을 자랑했습니다. 예수님은 사람에게 보이려는 선행이 아니라 하나님께 드리는 선행을 원하십니다.","오늘 아무도 모르게 선행 하나를 해 보세요. 숨겨진 선행은 하나님만 아시는 기쁨이 됩니다.","보이기 위함이 아니라 하나님께 드리는 마음으로 섬기겠습니다.","예수님은 구제와 기도와 금식에 대해 같은 원칙을 반복하십니다(마 6:1-18). 사람에게 보이려 하지 말고 은밀한 중에 보시는 아버지께 하라. 칭찬을 받으면 이미 상을 받은 것입니다. 숨겨진 선행은 하나님과 나만 아는 비밀이 되고, 그 비밀이 우리 영혼을 깊게 합니다.","은밀한 중에 보시는 아버지, 사람의 칭찬을 구하지 않고 주님께만 드리는 마음으로 섬기게 하소서."],["골로새서 3:13","누가 뉘게 혐의가 있거든 서로 용납하여 피차 용서하되 주께서 너희를 용서하신 것과 같이 너희도 그리하고","용서","공동체 안에서 갈등은 피할 수 없습니다. 바울은 서로 참아 주고 용서하되, 그 기준을 주님의 용서에 두라고 합니다.","오래된 서운함을 마음에 품고 있다면, 오늘 그것을 하나님께 내려놓는 기도를 드려 보세요.","주님이 용서하신 것처럼 나도 용서합니다.","코리 텐 붐은 유대인을 숨겨 주다 나치 수용소에 갇혔고, 그곳에서 언니를 잃었습니다. 전쟁 뒤 용서를 전하던 그녀 앞에 수용소 간수였던 사람이 다가와 손을 내밀었을 때, 그녀는 도저히 손을 내밀 수 없어 속으로 기도했다고 고백합니다. 그리고 손을 내민 순간 하나님이 주시는 사랑을 경험했다고 말합니다. 용서는 내 힘으로 짜내는 것이 아니라 하나님께 구하는 것입니다.","주님, 서로 용납하고 용서하게 하소서. 오래된 서운함을 주님께 내려놓습니다."],["에베소서 4:3","평안의 매는 줄로 성령의 하나 되게 하신 것을 힘써 지키라","섬김","하나 됨은 우리가 만드는 것이 아니라 성령이 이미 주신 것입니다. 우리의 일은 그것을 ‘힘써 지키는 것’입니다.","공동체 안에서 분열을 일으키는 말 대신 하나 됨을 지키는 말을 선택해 보세요.","성령이 주신 하나 됨을 힘써 지키겠습니다.","바울은 이어서 ‘몸이 하나요 성령이 하나이니’로 시작해 ‘하나’를 일곱 번 반복합니다(4-6절). 우리를 하나 되게 하는 것이 우리를 나누는 것보다 훨씬 많고 깊습니다. 그러니 작은 차이로 하나 됨을 깨뜨릴 이유가 없습니다.","하나 되게 하시는 성령님, 작은 차이보다 우리를 묶는 큰 은혜를 보게 하시고 하나 됨을 힘써 지키게 하소서."],["예레미야 33:3","너는 내게 부르짖으라 내가 네게 응답하겠고 네가 알지 못하는 크고 비밀한 일을 네게 보이리라","기도","예루살렘이 포위되고 예레미야가 감옥에 갇혀 있을 때 주신 말씀입니다. 가장 막막한 순간에 하나님은 ‘부르짖으라’고 초대하십니다.","기도의 달을 시작하며, 오랫동안 포기했던 기도 제목 하나를 다시 꺼내 하나님께 부르짖어 보세요.","내가 부르짖을 때 주님은 응답하십니다.","1906년 평양 장대현교회의 길선주 목사는 교인들과 함께 새벽마다 모여 기도하기 시작했습니다. 이것이 한국 교회 새벽기도의 뿌리가 되었고, 이듬해 평양 대부흥으로 이어졌다고 평가됩니다. 하루의 첫 시간을 하나님께 드리는 습관은 지금도 많은 성도의 삶을 지탱하고 있습니다.","부르짖으라 하시는 하나님, 오랫동안 포기했던 기도 제목을 다시 주님께 올려 드립니다. 크고 비밀한 일을 보여 주소서."],["마태복음 7:7","구하라 그리하면 너희에게 주실 것이요 찾으라 그리하면 찾을 것이요 문을 두드리라 그리하면 너희에게 열릴 것이니","기도","‘구하라, 찾으라, 두드리라’는 헬라어로 계속해서 하라는 현재형입니다. 기도는 한 번이 아니라 끈기 있게 이어 가는 것입니다.","포기하지 않고 계속 두드릴 기도 제목 하나를 정해 이번 달 매일 기도해 보세요.","나는 계속 구하고 찾고 두드리겠습니다.","예수님은 이어서 아버지 비유를 드십니다. 아들이 떡을 달라는데 돌을 줄 아버지가 어디 있겠느냐고(9-11절). 기도의 확신은 우리의 끈기가 아니라 아버지의 선하심에서 옵니다. 우리는 귀찮게 해야 겨우 들어주는 재판관이 아니라 좋은 것을 주고 싶어 하시는 아버지께 구합니다.","좋은 것을 주시는 아버지, 주님의 선하심을 믿고 계속 구하고 찾고 두드리게 하소서."],["마가복음 11:24","그러므로 내가 너희에게 말하노니 무엇이든지 기도하고 구하는 것은 받은 줄로 믿으라 그리하면 너희에게 그대로 되리라","기도","말라 버린 무화과나무 앞에서 하신 말씀입니다. 이어지는 25절은 기도할 때 먼저 용서하라고 덧붙입니다. 믿음의 기도는 용서하는 마음과 함께 갑니다.","기도할 때 혹시 마음에 걸리는 사람이 있다면 먼저 용서하고, 믿음으로 구해 보세요.","믿음으로 구하고 용서하는 마음으로 기도합니다.","마르틴 루터는 할 일이 너무 많은 날일수록 기도에 더 많은 시간을 들여야 한다는 취지의 말을 남긴 것으로 전해집니다. 설교자들은 이 말을 바쁜 현대인에게 자주 들려줍니다. 기도는 일을 미루는 시간이 아니라, 일을 바르게 하기 위해 방향을 맞추는 시간입니다.","주님, 바쁠수록 먼저 기도하게 하시고 받은 줄로 믿는 믿음과 용서하는 마음으로 구하게 하소서."],["야고보서 5:16","이러므로 너희 죄를 서로 고하며 병 낫기를 위하여 서로 기도하라 의인의 간구는 역사하는 힘이 많으니라","기도","야고보는 비를 멈추고 내리게 한 엘리야도 ‘우리와 성정이 같은 사람’이었다고 말합니다. 평범한 사람의 기도도 큰 힘이 있습니다.","믿을 만한 친구와 서로 기도 제목을 나누고 함께 기도해 보세요. 나눔 자체가 치유의 시작입니다.","나의 기도에는 역사하는 힘이 있습니다.","야고보는 기도와 함께 ‘서로 고하라’고 말합니다. 혼자 감당하는 죄와 아픔은 점점 무거워지지만, 믿을 만한 사람과 나누면 가벼워집니다. 치유는 하나님과의 관계뿐 아니라 공동체 안에서도 일어납니다. 서로를 위한 기도는 서로의 짐을 나누어 지는 일입니다.","주님, 믿을 만한 이들과 서로의 짐을 나누게 하시고 서로를 위해 기도하는 공동체가 되게 하소서."],["마태복음 6:6","너는 기도할 때에 네 골방에 들어가 문을 닫고 은밀한 중에 계신 네 아버지께 기도하라 은밀한 중에 보시는 너의 아버지가 갚으시리라","기도","사람들에게 보이려고 길거리에서 기도하던 이들과 달리, 참된 기도는 하나님과의 은밀한 만남입니다.","오늘 나만의 ‘골방’을 정해 보세요. 출근 전 차 안, 잠들기 전 침대 위도 좋습니다.","은밀한 중에 보시는 아버지와 깊이 만나겠습니다.","‘골방’은 당시 집에서 가장 안쪽에 있는 창고 방을 가리켰습니다. 화려한 곳이 아니라 곡식과 물건을 보관하던 평범한 공간이었습니다. 하나님을 만나는 장소는 특별할 필요가 없습니다. 문을 닫고 다른 소리를 차단할 수 있는 곳이면 어디든 골방이 됩니다.","은밀한 중에 계신 아버지, 제 일상의 평범한 공간을 주님과 만나는 골방으로 삼게 하소서."],["마태복음 6:9","그러므로 너희는 이렇게 기도하라 하늘에 계신 우리 아버지여 이름이 거룩히 여김을 받으시오며","기도","주기도문의 첫 부분입니다. 기도는 내 필요보다 하나님이 누구신지를 고백하는 것으로 시작합니다. ‘우리’ 아버지라는 표현은 기도가 공동체적임을 보여 줍니다.","오늘은 구하는 기도 전에 하나님의 이름을 높이는 찬양으로 기도를 시작해 보세요.","하늘에 계신 우리 아버지의 이름을 높입니다.","주기도문은 ‘우리 아버지’로 시작합니다. ‘나의 아버지’가 아닙니다. 혼자 기도할 때도 우리는 공동체의 일원으로 기도합니다. 그리고 첫 간구는 내 필요가 아니라 ‘이름이 거룩히 여김을 받으시오며’입니다. 기도는 나를 중심에서 내려놓고 하나님을 중심에 모시는 연습입니다.","하늘에 계신 우리 아버지, 제 필요보다 먼저 주님의 이름을 높이며 기도를 시작하게 하소서."],["마태복음 6:14","너희가 사람의 과실을 용서하면 너희 천부께서도 너희 과실을 용서하시려니와","용서","주기도문 바로 뒤에 예수님이 덧붙이신 설명입니다. 주기도문의 여러 간구 중 유일하게 다시 강조하신 것이 ‘용서’입니다.","주기도문을 드릴 때 ‘우리가 우리에게 죄 지은 자를 사하여 준 것같이’라는 부분에서 잠시 멈추고 한 사람을 떠올려 보세요.","용서받은 나는 용서하는 사람이 되겠습니다.","C.S. 루이스는 『순전한 기독교』에서, 사람들은 용서가 아름다운 생각이라고 말하지만 막상 자신이 용서해야 할 일이 생기기 전까지만 그렇다고 꼬집었습니다. 그래서 설교자들은 용서를 한 번의 사건이 아니라 과정이라고 말합니다. 같은 상처가 떠오를 때마다 다시 용서를 선택하는 것, 그것이 ‘일흔 번씩 일곱 번’의 용서입니다.","용서하신 아버지, 주기도문을 드릴 때마다 용서해야 할 사람을 떠올리게 하시고 용서를 선택하게 하소서."],["요한복음 15:7","너희가 내 안에 거하고 내 말이 너희 안에 거하면 무엇이든지 원하는대로 구하라 그리하면 이루리라","기도","포도나무 비유 가운데 주신 말씀입니다. 주님 안에 거하고 말씀이 내 안에 있을 때, 나의 소원이 주님의 뜻을 닮아 갑니다.","기도하기 전에 말씀을 먼저 읽어 보세요. 말씀이 나의 기도를 바르게 이끌어 줍니다.","주님 안에 머물며 주님의 뜻대로 구하겠습니다.","‘원하는 대로 구하라’는 말씀은 백지수표가 아닙니다. 조건은 ‘내 안에 거하고 내 말이 너희 안에 거하면’입니다. 주님 안에 머물수록 우리의 소원은 주님의 소원을 닮아 갑니다. 그래서 그런 사람이 구하는 것은 결국 주님이 이루고 싶으신 것입니다.","주님 안에 머물게 하소서. 제 소원이 주님의 소원을 닮아 가게 하시고 주님의 뜻대로 구하게 하소서."],["로마서 8:26","이와 같이 성령도 우리 연약함을 도우시나니 우리가 마땅히 빌 바를 알지 못하나 오직 성령이 말할 수 없는 탄식으로 우리를 위하여 친히 간구하시느니라","성령","무엇을 기도해야 할지 모를 때가 있습니다. 그때 성령께서 말로 표현할 수 없는 탄식으로 우리를 위해 대신 기도하신다는 위로의 말씀입니다.","기도할 말이 떠오르지 않는다면 조용히 하나님 앞에 머물러 있는 것만으로도 충분합니다.","말이 막힐 때도 성령께서 나를 위해 기도하십니다.","‘말할 수 없는 탄식’은 신음 소리와 같습니다. 아픈 아이가 말을 못 하고 끙끙 앓을 때 엄마는 그 소리만 듣고도 무엇이 필요한지 압니다. 성령님은 우리의 말이 끝나는 곳에서 기도를 이어 가십니다. 그러니 기도할 말이 없는 날에도 기도는 멈추지 않습니다.","저를 위해 탄식하시는 성령님, 기도할 말을 찾지 못하는 날에도 주님 앞에 머물게 하시고 저를 대신해 기도해 주소서."],["데살로니가전서 5:17","쉬지 말고 기도하라","기도","하루 종일 무릎 꿇고 있으라는 말이 아니라, 하나님과의 대화를 일상 속에서 끊지 말라는 뜻입니다. 17세기 수도사 로렌스 형제는 부엌에서 일하면서도 하나님의 임재를 연습했습니다.","오늘 일하는 중간중간 ‘주님, 함께해 주세요’ 같은 짧은 기도를 드려 보세요.","일상의 모든 순간을 하나님과의 대화로 채우겠습니다.","17세기 프랑스의 로렌스 형제는 수도원 부엌에서 일하던 평신도 수사였습니다. 그는 냄비를 닦고 요리하는 중에도 하나님과 대화하는 법을 익혔고, 그의 대화와 편지는 『하나님의 임재 연습』으로 엮였습니다. 하나님과의 동행은 특별한 장소가 아니라 평범한 일상에서 이루어집니다.","쉬지 말고 기도하라 하신 주님, 일하고 쉬는 모든 순간에 주님과 대화하는 하루가 되게 하소서."],["시편 145:18","여호와께서는 자기에게 간구하는 모든 자 곧 진실하게 간구하는 모든 자에게 가까이 하시는도다","기도","하나님이 가까이하시는 조건은 화려한 말이 아니라 ‘진실함’입니다.","잘 정리된 기도보다 솔직한 기도가 더 중요합니다. 오늘 있는 그대로의 감정을 하나님께 말씀드려 보세요.","진실하게 부르는 나에게 주님은 가까이 오십니다.","하나님이 가까이하시는 사람은 기도를 잘하는 사람이 아니라 ‘진실하게’ 부르는 사람입니다. 정리되지 않은 말, 원망 섞인 질문, 눈물로 범벅된 침묵도 진실하면 하나님께 닿습니다. 시편에는 그런 기도가 가득합니다. 하나님은 꾸민 말보다 정직한 마음을 원하십니다.","가까이 계신 하나님, 꾸미지 않고 있는 그대로의 마음으로 주님께 나아가게 하소서."],["마태복음 18:20","두 세 사람이 내 이름으로 모인 곳에는 나도 그들 중에 있느니라","기도","적은 수의 모임이라도 예수님의 이름으로 모이면 주님이 함께하신다는 약속입니다. 교회는 건물이 아니라 모임입니다.","가족이나 친구와 함께 짧게라도 기도하는 시간을 만들어 보세요. 두세 사람의 기도에 주님이 함께하십니다.","두세 사람이 모인 곳에 주님이 계십니다.","예수님은 이 약속을 공동체 안의 갈등을 다루는 말씀 끝에 하셨습니다(15-19절). 잘못한 형제를 찾아가고, 화해하고, 함께 기도하는 자리에 주님이 계십니다. 두세 사람의 모임은 단순한 숫자가 아니라 화해와 합심의 자리입니다.","함께하시는 주님, 우리가 주님의 이름으로 모여 화해하고 합심하여 기도할 때 그 가운데 계셔 주소서."],["마태복음 26:41","시험에 들지 않게 깨어 기도하라 마음에는 원이로되 육신이 약하도다 하시고","기도","겟세마네에서 잠든 제자들에게 하신 말씀입니다. 예수님은 제자들의 연약함을 아시면서도 깨어 기도하라고 권하십니다.","유혹에 약해지는 시간대가 있다면, 그 시간 직전에 기도하는 습관을 만들어 보세요.","약한 나이기에 깨어 기도하겠습니다.","설교자들은 기도를 하나님을 내 뜻대로 움직이는 수단이 아니라, 나를 하나님의 뜻에 맞추는 시간이라고 말합니다. 겟세마네에서 예수님의 기도가 ‘나의 원대로 마시고 아버지의 원대로’로 끝났듯이, 가장 깊은 기도는 내려놓음으로 완성됩니다.","주님, 제 원대로가 아니라 아버지의 원대로 되기를 기도하게 하시고 깨어 기도하게 하소서."],["시편 119:105","주의 말씀은 내 발에 등이요 내 길에 빛이니이다","말씀","고대의 등불은 멀리까지 비추지 못하고 바로 앞 한두 걸음만 비췄습니다. 하나님의 말씀은 인생 전체를 한꺼번에 보여 주기보다 오늘 걸을 길을 비춥니다.","앞날이 다 보이지 않아 불안하다면, 오늘 한 걸음을 비추는 말씀 한 구절을 붙들어 보세요.","주님의 말씀이 오늘 나의 걸음을 비춥니다.","시편 119편 105절의 ‘등’과 ‘빛’은 서로 다른 것을 비춥니다. 등은 발 바로 앞을, 빛은 길 전체를 비춥니다. 말씀은 오늘 내딛을 한 걸음과 인생 전체의 방향을 동시에 보여 줍니다. 오늘의 작은 순종이 인생의 큰 방향과 이어져 있습니다.","등불 되신 말씀, 오늘 한 걸음을 비추시고 제 인생의 방향도 밝혀 주소서."],["디모데후서 3:16","모든 성경은 하나님의 감동으로 된 것으로 교훈과 책망과 바르게 함과 의로 교육하기에 유익하니","말씀","‘감동으로 된’은 하나님이 숨을 불어넣으셨다는 뜻입니다. 성경은 가르치고, 잘못을 지적하고, 바로잡고, 훈련하는 네 가지 유익이 있습니다.","성경을 읽을 때 ‘오늘 이 말씀이 나에게 가르치는 것, 지적하는 것, 바로잡는 것은 무엇인가?’ 질문해 보세요.","하나님의 숨결이 담긴 말씀으로 나를 빚어 가겠습니다.","종교개혁자들은 ‘오직 성경’을 외치며 성경을 사람들의 언어로 옮겼습니다. 루터는 바르트부르크성에 숨어 지내던 시기에 신약성경을 독일어로 번역했습니다. 말씀이 성직자만이 아니라 평범한 사람의 손에 들려질 때, 교회와 사회가 새로워졌습니다.","하나님의 숨결이 담긴 말씀이 저를 가르치고 바로잡게 하소서. 말씀 앞에서 겸손히 배우게 하소서."],["히브리서 4:12","하나님의 말씀은 살았고 운동력이 있어 좌우에 날선 어떤 검보다도 예리하여 혼과 영과 및 관절과 골수를 찔러 쪼개기까지 하며 또 마음의 생각과 뜻을 감찰하나니","말씀","성경은 옛날 책이 아니라 지금도 살아 움직이는 말씀입니다. 우리의 숨은 생각과 동기까지 드러냅니다.","말씀을 읽다가 마음이 찔리는 구절이 있다면 피하지 말고 그 구절 앞에 머물러 보세요.","살아 있는 말씀이 나의 마음을 새롭게 합니다.","양날 검은 앞으로도 뒤로도 벱니다. 하나님의 말씀은 다른 사람을 찌르기 위한 무기가 아니라 먼저 나를 찌르고 쪼개는 검입니다. 말씀을 읽다가 다른 사람이 떠오른다면, 그 말씀을 먼저 나에게 비추어 보아야 합니다. 그때 말씀은 나를 수술하는 의사의 칼이 됩니다.","살아 있는 말씀이여, 다른 사람이 아니라 먼저 저를 비추어 제 마음을 새롭게 하소서."],["이사야 40:8","풀은 마르고 꽃은 시드나 우리 하나님의 말씀은 영영히 서리라 하라","말씀","인간의 영광은 풀과 꽃처럼 잠시 피었다 사라지지만, 하나님의 말씀은 영원히 변하지 않습니다.","변하는 유행과 정보에 지친다면, 변하지 않는 말씀을 하루의 기준으로 삼아 보세요.","영원한 말씀 위에 내 삶을 세웁니다.","한국 교회는 선교사보다 성경이 먼저 들어온 드문 역사를 가지고 있습니다. 만주에서 스코틀랜드 선교사 존 로스와 한국인 청년들이 함께 번역한 누가복음이 1882년에 출간되었고, 이 성경을 읽고 믿은 이들이 고향에 신앙 공동체를 세웠습니다. 말씀은 스스로 길을 내며 사람을 찾아갑니다.","영원한 말씀 위에 제 삶을 세우게 하시고 변하는 세상 속에서도 변하지 않는 말씀을 붙들게 하소서."],["마태복음 4:4","예수께서 대답하여 가라사대 기록되었으되 사람이 떡으로만 살 것이 아니요 하나님의 입으로 나오는 모든 말씀으로 살 것이라 하였느니라","말씀","40일 금식 후 시험받으실 때, 예수님은 신명기 말씀으로 사탄을 물리치셨습니다. 몸에 양식이 필요하듯 영혼에는 말씀이 필요합니다.","하루 세 끼를 챙기듯, 말씀도 하루 한 끼 챙겨 보세요. 아침 식사 전에 한 구절이라도 좋습니다.","나는 떡으로만이 아니라 말씀으로 삽니다.","예수님은 세 번의 시험을 모두 신명기 말씀으로 이기셨습니다. 그분은 하나님이시면서도 자신의 능력이 아니라 기록된 말씀으로 싸우셨습니다. 우리에게 주신 가장 강력한 무기도 말씀입니다. 평소에 말씀을 먹은 사람만이 시험의 순간에 그 말씀을 꺼내 쓸 수 있습니다.","말씀으로 시험을 이기신 주님, 평소에 말씀을 먹게 하시고 시험의 순간에 그 말씀으로 이기게 하소서."],["시편 119:11","내가 주께 범죄치 아니하려 하여 주의 말씀을 내 마음에 두었나이다","말씀","말씀을 마음에 ‘두었다’는 것은 귀한 보물을 숨겨 둔다는 뜻입니다. 암송한 말씀은 유혹의 순간에 나를 지킵니다.","이번 주 외울 말씀 한 구절을 정해 카드에 적어 다니며 암송해 보세요.","주님의 말씀을 마음에 간직하며 지켜 행하겠습니다.","설교자들은 말씀을 ‘읽는 것’과 ‘먹는 것’을 구별합니다. 에스겔과 요한은 두루마리를 먹으라는 명령을 받았습니다. 말씀을 먹는다는 것은 천천히 곱씹어 내 삶의 일부가 되게 하는 것입니다. 많이 읽는 것보다 한 구절을 깊이 소화하는 것이 더 큰 힘이 될 때가 있습니다.","주님의 말씀을 마음에 간직하게 하시고 천천히 곱씹어 제 삶의 일부가 되게 하소서."],["여호수아 1:8","이 율법책을 네 입에서 떠나지 말게 하며 주야로 그것을 묵상하여 그 가운데 기록한 대로 다 지켜 행하라 그리하면 네 길이 평탄하게 될 것이라 네가 형통하리라","말씀","‘묵상하다’는 소리 내어 중얼거린다는 뜻입니다. 말씀을 입에 달고 살며 실천할 때 길이 열린다는 약속입니다.","오늘의 말씀을 하루 중 여러 번 소리 내어 읽어 보세요. 반복할수록 말씀이 내 것이 됩니다.","말씀을 밤낮으로 묵상하고 지켜 행하겠습니다.","하나님은 모세를 잃은 여호수아에게 군사 전략이 아니라 말씀을 주셨습니다. 지도자의 성공 비결은 전쟁 기술보다 말씀 묵상에 있었습니다. 그리고 ‘형통’은 모든 일이 쉽게 풀린다는 뜻이 아니라 하나님의 뜻대로 바르게 나아간다는 뜻입니다.","말씀의 하나님, 밤낮으로 말씀을 묵상하게 하시고 그 말씀대로 행하여 바른 길로 나아가게 하소서."],["시편 1:2","오직 여호와의 율법을 즐거워하여 그 율법을 주야로 묵상하는 자로다","말씀","복 있는 사람은 말씀을 의무로 읽지 않고 ‘즐거워합니다’. 이어지는 3절은 그를 시냇가에 심은 나무에 비유합니다.","말씀 읽기가 숙제처럼 느껴졌다면, 좋아하는 차 한 잔과 함께 편안하게 읽는 시간을 만들어 보세요.","말씀을 즐거워하는 시냇가의 나무가 되겠습니다.","시편 1편 3절은 말씀을 즐거워하는 사람을 ‘시냇가에 심은 나무’에 비유합니다. 나무가 스스로 시냇가로 걸어간 것이 아니라 ‘심겨진’ 것입니다. 하나님이 우리를 말씀이라는 시냇가에 심으셨습니다. 우리가 할 일은 그 물을 마시며 뿌리를 내리는 것입니다.","시냇가에 저를 심으신 하나님, 말씀을 즐거워하게 하시고 그 물을 마시며 철을 따라 열매 맺게 하소서."],["요한복음 1:1","태초에 말씀이 계시니라 이 말씀이 하나님과 함께 계셨으니 이 말씀은 곧 하나님이시니라","말씀","창세기 1장 1절을 떠올리게 하는 요한복음의 첫 문장입니다. ‘말씀’(로고스)은 바로 예수 그리스도를 가리킵니다.","성경을 읽을 때 정보를 얻는 것을 넘어, 말씀이신 예수님을 만나는 시간으로 삼아 보세요.","말씀이신 예수님을 날마다 만납니다.","‘말씀’(로고스)은 헬라 철학에서 우주를 다스리는 이성과 질서를 뜻했습니다. 요한은 그 단어를 가져와 놀라운 선언을 합니다. 그 우주의 원리가 한 사람이 되어 우리 가운데 오셨다고. 성경을 읽는다는 것은 정보를 얻는 것이 아니라 말씀이신 분을 만나는 것입니다.","말씀이신 예수님, 성경을 읽을 때 정보가 아니라 주님을 만나게 하소서."],["로마서 15:4","무엇이든지 전에 기록한 바는 우리의 교훈을 위하여 기록된 것이니 우리로 하여금 인내로 또는 성경의 안위로 소망을 가지게 함이니라","말씀","구약 성경의 이야기들은 오래된 옛날이야기가 아니라 오늘의 우리에게 인내와 위로, 소망을 주기 위해 기록되었습니다.","힘든 시기에 성경 속 인물 중 비슷한 상황을 겪은 사람의 이야기를 읽어 보세요. 큰 위로가 됩니다.","성경의 위로로 소망을 가집니다.","바울은 구약 성경이 ‘우리의 교훈을 위하여’ 기록되었다고 말합니다. 아브라함의 기다림, 요셉의 억울함, 다윗의 눈물, 엘리야의 탈진은 오래된 이야기가 아니라 오늘 우리를 위한 이야기입니다. 성경 속 인물들의 실패와 회복은 우리에게 인내와 위로와 소망을 줍니다.","소망의 하나님, 성경 속 인물들의 이야기를 통해 오늘 저에게 인내와 위로와 소망을 주소서."],["사도행전 1:8","오직 성령이 너희에게 임하시면 너희가 권능을 받고 예루살렘과 온 유대와 사마리아와 땅 끝까지 이르러 내 증인이 되리라 하시니라","성령","승천하시기 직전 예수님의 마지막 약속입니다. 증인이 되는 힘은 우리 능력이 아니라 성령에게서 옵니다. 증인의 범위는 가까운 곳에서 시작해 땅끝까지 넓어집니다.","나의 ‘예루살렘’은 가족과 직장입니다. 오늘 가장 가까운 곳에서 그리스도인다운 삶으로 증인이 되어 보세요.","성령의 능력으로 내 자리에서 증인이 되겠습니다.","오순절 성령 강림 이후 제자들은 숨어 있던 방에서 거리로 나왔습니다. 설교자들은 성령의 역사를 신비한 체험에만 가두지 말라고 말합니다. 두려움이 담대함으로, 이기심이 나눔으로 바뀌는 것, 사도행전 2장 끝에 나오는 서로 나누는 공동체가 바로 성령 충만의 열매였습니다.","권능을 주시는 성령님, 두려움에서 나와 제가 있는 자리에서 주님의 증인으로 살게 하소서."],["갈라디아서 5:22-23","오직 성령의 열매는 사랑과 희락과 화평과 오래 참음과 자비와 양선과 충성과 온유와 절제니 이같은 것을 금지할 법이 없느니라","성령","‘열매들’이 아니라 단수 ‘열매’입니다. 아홉 가지는 따로 노력해서 얻는 것이 아니라, 성령 안에서 함께 맺히는 한 송이 포도와 같습니다.","아홉 가지 중 지금 나에게 가장 필요한 열매 하나를 골라 오늘 그것을 위해 기도하고 실천해 보세요.","성령의 열매가 내 삶에 풍성히 맺히게 하소서.","성령의 열매 목록은 앞의 ‘육체의 일’ 목록과 대조됩니다(19-21절). 육체의 일은 ‘일들’이라는 복수형이지만, 성령의 열매는 ‘열매’라는 단수형입니다. 육체는 우리를 산산이 흩어 놓지만, 성령은 우리를 하나의 온전한 인격으로 묶어 줍니다.","성령님, 흩어진 제 마음을 하나로 묶어 주시고 사랑과 희락과 화평의 열매를 맺게 하소서."],["요한복음 14:26","보혜사 곧 아버지께서 내 이름으로 보내실 성령 그가 너희에게 모든 것을 가르치시고 내가 너희에게 말한 모든 것을 생각나게 하리라","성령","‘보혜사’는 곁에서 돕는 분, 변호하고 위로하는 분이라는 뜻입니다. 성령은 예수님의 말씀을 기억나게 하고 깨닫게 하십니다.","성경을 읽기 전 ‘성령님, 오늘 이 말씀을 깨닫게 해 주세요’라고 짧게 기도해 보세요.","내 곁의 보혜사 성령님이 나를 가르치십니다.","예수님은 성령을 ‘보혜사’, 곧 곁으로 부름받아 오신 분이라고 소개하셨습니다. 법정에서 변호하고, 넘어진 사람을 일으키고, 슬퍼하는 사람을 위로하는 분입니다. 성령은 멀리 계신 막연한 능력이 아니라, 오늘 내 곁에 계신 인격적인 동반자입니다.","보혜사 성령님, 제 곁에서 저를 가르치시고 주님의 말씀을 생각나게 하시며 위로해 주소서."],["로마서 8:14","무릇 하나님의 영으로 인도함을 받는 사람은 곧 하나님의 아들이라","성령","하나님의 자녀의 표지는 성령의 인도하심을 받는 것입니다. 다음 절은 우리가 ‘아빠 아버지’라 부르는 양자의 영을 받았다고 말합니다.","결정을 내리기 전 마음의 평안과 불안을 살펴보세요. 성령은 말씀과 양심을 통해 인도하십니다.","성령의 인도하심을 받는 하나님의 자녀로 살겠습니다.","바로 다음 절에서 바울은 우리가 ‘아빠 아버지’라고 부르짖는 양자의 영을 받았다고 말합니다. ‘아빠’는 아이가 아버지를 부르는 친밀한 말입니다. 성령의 인도를 받는다는 것은 무서운 주인의 명령을 따르는 것이 아니라 사랑하는 아버지의 손을 잡고 걷는 것입니다.","아빠 아버지, 성령의 인도하심을 따라 두려움이 아니라 사랑하는 자녀의 마음으로 걷게 하소서."],["고린도전서 3:16","너희는 너희가 하나님의 성전인 것과 하나님의 성령이 너희 안에 거하시는 것을 알지 못하느뇨","성령","하나님은 이제 돌로 지은 성전이 아니라 우리 안에 거하십니다. 이 구절은 교회 공동체 전체를 향한 말씀이며, 동시에 각 사람의 삶과도 이어집니다.","내 몸과 마음이 하나님이 거하시는 성전이라면, 오늘 어떻게 돌보아야 할까요? 쉼과 건강도 신앙의 일부입니다.","나는 하나님이 거하시는 성전입니다.","고린도 교회는 분열로 시끄러웠습니다. 바울은 그들에게 ‘너희가 하나님의 성전’이라고 말합니다. 여기서 ‘너희’는 복수형입니다. 한 사람 한 사람이 성전일 뿐 아니라 공동체 전체가 하나님이 거하시는 성전입니다. 교회를 분열시키는 것은 성전을 허무는 일입니다.","거하시는 성령님, 제 몸과 우리 공동체가 주님의 성전임을 기억하며 거룩하게 지키게 하소서."],["에베소서 5:18","술 취하지 말라 이는 방탕한 것이니 오직 성령의 충만을 받으라","성령","술에 취하면 술의 지배를 받듯이, 성령으로 충만하면 성령의 다스림을 받습니다. ‘충만을 받으라’는 계속해서 채워지라는 현재형입니다.","스트레스를 풀기 위해 의지하는 것이 무엇인가요? 오늘은 그 대신 찬양과 기도로 성령의 충만을 구해 보세요.","날마다 성령으로 충만하기를 원합니다.","바울은 성령 충만의 결과를 이어서 말합니다. 서로 찬양으로 화답하고, 감사하고, 서로 복종하는 것입니다(19-21절). 성령 충만은 혼자만의 신비한 체험이 아니라 관계 속에서 드러나는 변화입니다. 노래와 감사와 겸손한 섬김이 성령 충만의 증거입니다.","성령님, 저를 날마다 충만하게 하시고 그 충만함이 찬양과 감사와 겸손한 섬김으로 드러나게 하소서."],["스가랴 4:6","그가 내게 일러 가로되 여호와께서 스룹바벨에게 하신 말씀이 이러하니라 이는 힘으로 되지 아니하며 능으로 되지 아니하고 오직 나의 신으로 되느니라","성령","포로에서 돌아와 무너진 성전을 다시 지으려던 지도자 스룹바벨에게 주신 말씀입니다. 큰 일은 사람의 힘이 아니라 하나님의 영으로 이루어집니다.","내 힘으로 버거운 일 앞에서 ‘오직 주님의 영으로’라고 고백하며 시작해 보세요.","힘으로도 능력으로도 아니라 주님의 영으로 됩니다.","스룹바벨 앞에는 큰 산 같은 장애물이 있었습니다. 그러나 하나님은 ‘큰 산아 네가 무엇이냐 네가 스룹바벨 앞에서 평지가 되리라’고 하십니다(7절). 그리고 10절은 ‘작은 일의 날을 멸시하는 자가 누구냐’고 묻습니다. 성령의 일은 종종 작은 시작에서 출발합니다.","주님의 영으로 일하시는 하나님, 제 앞의 큰 산을 평지가 되게 하시고 작은 시작을 멸시하지 않게 하소서."],["로마서 1:17","복음에는 하나님의 의가 나타나서 믿음으로 믿음에 이르게 하나니 기록된바 오직 의인은 믿음으로 말미암아 살리라 함과 같으니라","믿음","1517년 10월 31일, 마르틴 루터는 비텐베르크에서 95개조 반박문을 게시했습니다. 그가 이 구절을 통해 구원이 행위가 아니라 믿음으로 주어진다는 진리를 깨달은 것이 종교개혁의 출발점이 되었습니다.","종교개혁 기념일에, 나의 신앙이 형식과 공로에 기대고 있지는 않은지 돌아보세요. 오직 믿음, 오직 은혜를 다시 붙드세요.","의인은 믿음으로 삽니다. 나는 오직 은혜로 삽니다.","마르틴 루터가 외친 ‘오직 믿음’의 믿음은 머리로 동의하는 것이 아니라, 하나님의 약속에 삶 전체를 거는 신뢰였습니다. 설교자들은 흔히 믿음을 의자에 비유합니다. 의자가 튼튼하다고 아는 것과 실제로 그 위에 앉는 것은 다릅니다. 믿음은 하나님이라는 의자에 내 무게를 온전히 싣는 것입니다.","의인은 믿음으로 산다 하신 하나님, 형식과 공로가 아니라 오직 믿음, 오직 은혜로 살게 하소서."],["데살로니가전서 5:16","항상 기뻐하라","기쁨","성경에서 가장 짧은 구절 중 하나이지만 가장 어려운 명령이기도 합니다. 박해를 받던 데살로니가 교회에 주신 말씀이라는 점에서, 기쁨은 상황이 아니라 하나님께 뿌리내린 것임을 보여 줍니다.","감사의 달을 시작하며, 오늘 기뻐할 이유 세 가지를 찾아 적어 보세요. 작고 평범한 것이어도 괜찮습니다.","나는 오늘 기뻐하기로 선택합니다.","‘항상 기뻐하라, 쉬지 말고 기도하라, 범사에 감사하라.’ 이 세 문장은 따로 떨어져 있지 않습니다. 기도가 기쁨과 감사를 이어 주는 다리입니다. 기도하는 사람은 하나님과 연결되어 있기에 상황에 상관없이 기뻐할 이유를 찾고, 감사할 거리를 발견합니다.","기쁨의 하나님, 감사의 달을 시작하며 오늘 기뻐할 이유를 찾게 하시고 기도 안에서 그 기쁨을 지키게 하소서."],["데살로니가전서 5:18","범사에 감사하라 이것이 그리스도 예수 안에서 너희를 향하신 하나님의 뜻이니라","감사","‘모든 일 때문에’가 아니라 ‘모든 일 가운데서’ 감사하라는 뜻입니다. 하나님의 뜻을 찾는 사람에게 바울은 분명하게 답합니다. 감사가 하나님의 뜻입니다.","오늘 감사하기 어려운 일 하나를 골라, 그 가운데서도 감사할 수 있는 점을 찾아보세요.","모든 일 가운데서 감사하는 것이 하나님의 뜻입니다.","‘범사에’는 ‘모든 일 가운데서’라는 뜻입니다. 암 진단 때문에 감사하라는 것이 아니라, 그 진단 속에서도 하나님이 함께하심에 감사하라는 것입니다. 감사는 고통을 부정하는 것이 아니라 고통 속에서도 하나님의 손길을 찾는 것입니다. 그것이 하나님의 뜻입니다.","모든 일 가운데 함께하시는 하나님, 감사하기 어려운 상황 속에서도 주님의 손길을 찾아 감사하게 하소서."],["시편 100:4","감사함으로 그 문에 들어가며 찬송함으로 그 궁정에 들어가서 그에게 감사하며 그 이름을 송축할찌어다","감사","성전에 들어가는 예배자의 노래입니다. 하나님께 나아가는 문을 여는 열쇠는 감사입니다.","기도할 때 요청보다 감사로 먼저 시작해 보세요. 감사는 하나님의 임재로 들어가는 문입니다.","감사함으로 주님 앞에 나아갑니다.","성전에는 바깥 문이 있고, 안뜰이 있고, 지성소가 있었습니다. 시인은 감사로 문에 들어가고 찬송으로 뜰에 들어가라고 합니다. 감사는 하나님께 나아가는 첫걸음입니다. 불평으로는 문 앞에서 서성이지만, 감사는 우리를 하나님의 임재 안으로 이끕니다.","감사로 주님의 문에 들어갑니다. 불평이 아니라 감사로 주님의 임재 안으로 나아가게 하소서."],["시편 103:2","내 영혼아 여호와를 송축하며 그 모든 은택을 잊지 말찌어다","감사","다윗은 자신의 영혼에게 은혜를 ‘잊지 말라’고 명령합니다. 우리는 받은 은혜를 쉽게 잊는 존재이기 때문입니다.","하나님이 내 삶에 베푸신 은혜를 시간 순서대로 떠올려 적어 보세요. ‘감사 일기’를 시작하는 것도 좋습니다.","주님이 베푸신 모든 은혜를 잊지 않겠습니다.","요즘은 감사 일기를 쓰는 사람이 더 행복하고 건강하다는 연구도 많습니다. 하지만 성경의 감사는 기분을 좋게 하는 기술을 넘어섭니다. 감사는 ‘내가 가진 모든 좋은 것이 선물’이라는 진실을 인정하는 것입니다. 그래서 감사하는 사람은 교만해질 수 없고, 쉽게 절망하지도 않습니다.","주님이 베푸신 모든 은택을 잊지 않게 하소서. 오늘 받은 은혜를 기록하며 감사하게 하소서."],["시편 136:1","여호와께 감사하라 그는 선하시며 그 인자하심이 영원함이로다","감사","시편 136편은 26절 모두가 ‘그 인자하심이 영원함이로다’로 끝납니다. 창조부터 구원까지 모든 역사에 하나님의 사랑이 반복됩니다.","내 삶의 사건들을 하나씩 떠올리며 그 뒤에 ‘그 인자하심이 영원함이로다’를 붙여 기도해 보세요.","주님은 선하시고 그 사랑은 영원합니다.","이 시편에서 이스라엘은 창조, 출애굽, 광야, 가나안 정복을 차례로 노래하며 매 절마다 ‘그 인자하심이 영원함이로다’를 반복합니다. 반복은 지루함이 아니라 확신입니다. 좋은 일에도, 힘든 일에도 그 사랑은 변하지 않았다는 고백이 역사 전체를 꿰뚫습니다.","영원한 사랑의 하나님, 제 인생의 모든 순간에도 주님의 인자하심이 영원했음을 고백하며 감사합니다."],["시편 50:23","감사로 제사를 드리는 자가 나를 영화롭게 하나니 그 행위를 옳게 하는 자에게 내가 하나님의 구원을 보이리라","감사","하나님은 동물 제사보다 감사의 제사를 원하십니다. 감사하는 삶 자체가 하나님께 영광을 돌리는 예배입니다.","오늘 하루를 ‘감사의 제사’로 드려 보세요. 불평이 나오려 할 때마다 감사로 바꿔 말해 보세요.","감사가 나의 예배가 되게 하소서.","시편 50편에서 하나님은 ‘내가 수소를 먹으며 염소의 피를 마시겠느냐’고 물으십니다(13절). 하나님은 우리의 제물이 필요하지 않으십니다. 원하시는 것은 감사입니다. 감사는 우리가 하나님께 드릴 수 있는 유일하게 새로운 것입니다. 모든 것이 이미 하나님의 것이지만, 감사는 우리의 마음에서 나오기 때문입니다.","모든 것의 주인이신 하나님, 제가 드릴 수 있는 감사의 제사를 기쁘게 받아 주소서."],["골로새서 3:15","그리스도의 평강이 너희 마음을 주장하게 하라 평강을 위하여 너희가 한 몸으로 부르심을 받았나니 너희는 또한 감사하는 자가 되라","감사","‘주장하다’는 운동 경기의 심판처럼 판정을 내린다는 뜻입니다. 그리스도의 평강이 마음의 심판이 되고, 그 결과는 감사입니다.","결정을 앞두고 마음이 복잡할 때, 그리스도의 평강이 있는 쪽을 선택해 보세요. 그리고 감사로 마무리하세요.","주님의 평강이 내 마음을 다스리고, 나는 감사합니다.","바울은 ‘평강을 위하여 너희가 한 몸으로 부르심을 받았나니’라고 말합니다. 그리스도의 평강은 개인의 마음뿐 아니라 공동체 전체를 다스립니다. 그리고 그 결과가 감사입니다. 서로를 향한 감사가 있는 공동체에는 다툼이 설 자리가 없습니다.","평강의 주님, 그리스도의 평강이 제 마음과 우리 공동체를 다스리게 하시고 서로에게 감사하게 하소서."],["골로새서 3:17","또 무엇을 하든지 말에나 일에나 다 주 예수의 이름으로 하고 그를 힘입어 하나님 아버지께 감사하라","감사","신앙은 교회 안에서만이 아니라 말과 일, 곧 삶의 모든 영역에서 드러납니다. 그 모든 일의 마무리는 감사입니다.","오늘 하는 일 하나하나를 ‘주님의 이름으로’ 한다는 마음으로 해 보세요. 일이 끝날 때마다 짧게 감사하세요.","말과 일 모두를 주님의 이름으로 하고 감사하겠습니다.","‘주 예수의 이름으로’ 한다는 것은 예수님이 그 일에 서명하실 수 있도록 한다는 뜻입니다. 오늘 하는 일과 말에 예수님의 이름을 붙일 수 있는지 생각해 보면, 우리의 삶이 달라집니다. 그리고 그 모든 일 끝에 감사가 따라옵니다.","주님, 오늘 제 말과 일에 주님의 이름을 붙일 수 있도록 살게 하시고 그 끝을 감사로 마무리하게 하소서."],["골로새서 2:7","그 안에 뿌리를 박으며 세움을 받아 교훈을 받은대로 믿음에 굳게 서서 감사함을 넘치게 하라","감사","뿌리 깊은 나무와 튼튼한 건물의 비유입니다. 그리스도 안에 깊이 뿌리내린 사람의 삶에는 감사가 넘쳐흐릅니다.","감사가 메말랐다면 뿌리를 점검해 보세요. 말씀과 기도로 뿌리를 깊게 할 때 감사는 저절로 넘칩니다.","그리스도 안에 뿌리내려 감사가 넘치게 하소서.","‘뿌리를 박으며’는 농사의 비유이고 ‘세움을 받아’는 건축의 비유입니다. 뿌리는 보이지 않는 곳에서 영양을 끌어올리고, 기초는 보이지 않는 곳에서 건물을 지탱합니다. 감사가 넘치는 삶은 눈에 보이지 않는 깊은 뿌리에서 나옵니다.","주님, 제 삶이 그리스도 안에 깊이 뿌리내리게 하시고 그 뿌리에서 감사가 넘치게 하소서."],["빌립보서 4:4","주 안에서 항상 기뻐하라 내가 다시 말하노니 기뻐하라","기쁨","감옥에 갇힌 바울이 ‘기뻐하라’를 두 번이나 말합니다. 비결은 ‘주 안에서’입니다. 상황이 아니라 주님이 기쁨의 근원입니다.","기뻐할 이유가 없어 보이는 날, ‘주 안에서’ 변하지 않는 것들—구원, 사랑, 약속—을 떠올려 보세요.","주 안에서 나는 항상 기뻐합니다.","설교자들은 행복과 기쁨을 구분합니다. 행복은 일어나는 일에 따라 오르내리지만, 기쁨은 변하지 않는 하나님께 뿌리를 둡니다. 그래서 감옥에 갇힌 바울도 ‘기뻐하라’고 쓸 수 있었습니다.","주 안에서 항상 기뻐하게 하소서. 상황이 아니라 변하지 않는 주님 때문에 기뻐하게 하소서."],["빌립보서 4:11","내가 궁핍하므로 말하는 것이 아니라 어떠한 형편에든지 나는 자족하기를 배웠노니","감사","바울은 자족을 ‘배웠다’고 말합니다. 만족은 타고나는 것이 아니라 훈련을 통해 배우는 것입니다.","‘이것만 있으면 행복할 텐데’라는 생각이 들 때, 지금 이미 가진 것에 감사하는 연습을 해 보세요.","어떤 형편에서도 자족하기를 배우겠습니다.","바울은 감사 헌금을 보낸 빌립보 교회에 감사하면서도 ‘내가 궁핍하므로 말하는 것이 아니라’고 덧붙입니다. 그는 도움을 받아서 기뻤지만, 도움이 없어도 괜찮았습니다. 자족은 필요가 없는 상태가 아니라 필요가 채워지든 아니든 하나님 안에서 평안한 상태입니다.","주님, 어떤 형편에서도 자족하는 법을 배우게 하시고 채워짐과 부족함 속에서 모두 주님을 신뢰하게 하소서."],["하박국 3:17-18","비록 무화과나무가 무성치 못하며 포도나무에 열매가 없으며 감람나무에 소출이 없으며 밭에 식물이 없으며 우리에 양이 없으며 외양간에 소가 없을찌라도 나는 여호와를 인하여 즐거워하며 나의 구원의 하나님을 인하여 기뻐하리로다","감사","모든 것이 무너진 상황을 하나씩 열거한 뒤 ‘그럴지라도’ 기뻐하겠다는 하박국의 고백입니다. 조건 없는 감사의 절정입니다.","지금 내 삶에서 ‘없는 것’ 목록을 적어 보고, 그 끝에 ‘그럴지라도 나는 주님 때문에 기뻐합니다’라고 써 보세요.","모든 것이 없을지라도 나는 주님 때문에 기뻐합니다.","찬송 「다 감사드리세」를 쓴 독일 목사 마르틴 링카르트는 30년 전쟁과 전염병이 휩쓴 도시 아일렌부르크에서 한 해에 수천 명의 장례를 치러야 했습니다. 그 가운데는 그의 아내도 있었습니다. 그런 시절에 그는 온 마음과 입과 손으로 하나님께 감사하자는 노래를 지었습니다. 가장 어두운 시대에 태어난 감사가 가장 오래 불리는 감사가 되었습니다.","그럴지라도 기뻐하게 하소서. 모든 것이 없어 보이는 날에도 구원의 하나님 때문에 즐거워하게 하소서."],["에베소서 5:20","범사에 우리 주 예수 그리스도의 이름으로 항상 아버지 하나님께 감사하며","감사","성령 충만한 사람의 특징 중 하나가 ‘항상, 범사에 감사하는 것’입니다. 감사는 성령 충만의 증거입니다.","오늘 하루 ‘감사합니다’라는 말을 몇 번 하는지 세어 보세요. 사람에게도 하나님께도 말이죠.","항상 모든 일에 감사하겠습니다.","바울은 감사를 성령 충만의 열매로 말합니다(18-20절). 감사가 부족하다는 것은 영적인 건강의 신호일 수 있습니다. 감사하는 사람은 하나님이 일하고 계심을 볼 수 있는 눈이 열린 사람입니다. 감사는 영혼의 시력입니다.","성령님, 제 영혼의 눈을 열어 범사에 주님이 일하심을 보게 하시고 항상 감사하게 하소서."],["시편 92:1","지존자여 여호와께 감사하며 주의 이름을 찬양하며","감사","‘안식일의 찬송 시’라는 제목이 붙은 시편입니다. 다음 절은 아침에는 주의 인자하심을, 밤마다 주의 성실하심을 알리는 것이 좋다고 이어집니다.","아침에 일어나서 하나님의 사랑에, 잠들기 전 하나님의 신실하심에 감사하는 습관을 만들어 보세요.","아침과 저녁마다 주님께 감사를 드립니다.","이 시편은 2절에서 ‘아침마다 주의 인자하심을 알리며 밤마다 주의 성실하심을 베풂이 좋으니이다’라고 말합니다. 하루의 시작과 끝을 감사로 감싸는 것입니다. 아침의 감사는 하루를 기대하게 하고, 저녁의 감사는 하루를 정리하게 합니다.","아침마다 사랑을, 밤마다 신실하심을 베푸시는 하나님, 하루의 시작과 끝을 감사로 감싸게 하소서."],["시편 9:1","내가 전심으로 여호와께 감사하오며 주의 모든 기사를 전하리이다","감사","‘전심으로’는 마음을 나누지 않고 온전히 드리는 것입니다. 감사는 하나님이 하신 일을 다른 사람에게 전하는 것으로 이어집니다.","하나님이 내 삶에 하신 일을 오늘 한 사람에게 이야기해 보세요. 감사는 나눌 때 커집니다.","온 마음으로 감사하며 주님의 일을 전하겠습니다.","‘전심으로’는 마음을 나누지 않는다는 뜻입니다. 우리는 감사하면서도 동시에 부족한 것을 생각합니다. 시인은 마음 전체를 감사에 쏟습니다. 그리고 그 감사는 ‘주의 모든 기사를 전하리이다’로 이어집니다. 진짜 감사는 혼자 간직하지 못하고 이야기하게 됩니다.","주님, 온 마음으로 감사하게 하시고 주님이 제게 행하신 일을 이웃에게 이야기하게 하소서."],["시편 34:1","내가 여호와를 항상 송축함이여 그를 송축함이 내 입에 계속하리로다","감사","다윗이 적국 왕 앞에서 미친 척을 해야 했던 굴욕적인 순간 직후에 쓴 시입니다. 가장 낮은 자리에서 나온 찬양이기에 더 깊습니다.","오늘 출퇴근길이나 집안일 중에 좋아하는 찬양을 흥얼거려 보세요. 찬양이 입에 머물면 마음도 바뀝니다.","내 입에 주님을 찬양함이 끊이지 않게 하소서.","다윗이 이 시를 쓸 때 그는 사울에게 쫓겨 블레셋 왕 앞에서 미친 척을 해야 했습니다. 가장 굴욕적인 순간이었습니다. 그런데 그 직후 그는 ‘항상’ 찬양하겠다고 노래합니다. 찬양은 좋은 일이 있을 때만이 아니라 낮아진 자리에서도 드릴 수 있습니다.","주님, 낮아진 자리에서도 주님을 찬양하게 하시고 제 입에 찬양이 끊이지 않게 하소서."],["시편 150:6","호흡이 있는 자마다 여호와를 찬양할찌어다 할렐루야","감사","시편 150편 전체의 마지막 구절입니다. 찬양의 자격은 단 하나, 숨 쉬고 있다는 것입니다.","천천히 깊게 숨을 세 번 쉬어 보세요. 숨 쉬는 지금이 찬양할 이유입니다.","호흡이 있는 동안 주님을 찬양하겠습니다.","시편은 150편으로 끝나는데, 마지막 다섯 편은 모두 ‘할렐루야’로 시작하고 끝납니다. 탄식과 질문으로 가득했던 시편이 결국 찬양으로 마무리됩니다. 우리 인생도 그렇습니다. 지금은 탄식의 시편을 지나고 있더라도, 마지막은 할렐루야입니다.","호흡을 주신 하나님, 숨 쉬는 동안 주님을 찬양하게 하시고 제 인생의 마지막이 할렐루야가 되게 하소서."],["시편 116:12","내게 주신 모든 은혜를 내가 여호와께 무엇으로 보답할꼬","감사","죽음에서 건짐 받은 시인이 감사로 고민합니다. 다음 절에서 그는 ‘구원의 잔을 들고 여호와의 이름을 부르겠다’고 답합니다.","받은 은혜에 보답하는 한 가지 방법을 정해 실천해 보세요. 예배, 섬김, 나눔 무엇이든 좋습니다.","받은 은혜에 감사로 보답하겠습니다.","시인은 보답할 방법을 묻고 스스로 답합니다. ‘구원의 잔을 들고 여호와의 이름을 부르며’(13절). 하나님께 보답하는 방법은 더 많이 받는 것입니다. 구원의 잔을 들고 하나님을 부르는 것, 곧 더 의지하는 것이 하나님이 가장 기뻐하시는 보답입니다.","은혜의 하나님, 받은 은혜에 감사하며 구원의 잔을 들고 더욱 주님을 의지하게 하소서."],["시편 65:11","주의 은택으로 년사에 관 씌우시니 주의 길에는 기름이 떨어지며","감사","풍성한 추수를 하나님의 은혜로 노래하는 시편입니다. 한 해의 결실을 하나님이 씌워 주시는 면류관에 비유합니다.","올해 거둔 열매—성장, 관계, 일의 성과—를 돌아보며 그것이 하나님의 은혜였음을 고백해 보세요.","한 해에 은혜의 면류관을 씌우신 주님께 감사합니다.","1620년 메이플라워호를 타고 아메리카에 도착한 청교도들은 첫 겨울에 절반 가까운 사람을 잃었습니다. 그럼에도 이듬해 가을, 그들은 첫 수확을 거두고 감사의 잔치를 열었습니다. 감사는 넉넉해서 드리는 것이 아니라, 남은 것을 보며 주신 분을 기억할 때 시작됩니다.","한 해에 은혜의 면류관을 씌우신 하나님, 올해 거둔 모든 열매가 주님의 은혜였음을 고백하며 감사합니다."],["고린도후서 9:15","말할 수 없는 그의 은사를 인하여 하나님께 감사하노라","감사","헌금과 나눔에 대해 길게 이야기하던 바울은 결국 하나님이 주신 가장 큰 선물, 곧 예수 그리스도를 향한 감사로 마무리합니다.","오늘 받은 많은 선물 가운데 가장 큰 선물인 예수님을 떠올리며 감사 기도를 드려 보세요.","말로 다 할 수 없는 선물을 주신 하나님께 감사합니다.","바울은 헌금과 나눔에 대해 두 장에 걸쳐 길게 이야기한 뒤, 갑자기 감탄사처럼 이 구절을 외칩니다. 모든 나눔의 출발점은 하나님이 먼저 우리에게 주신 ‘말할 수 없는 선물’, 곧 예수 그리스도입니다. 가장 큰 선물을 받은 사람은 작은 것을 아끼지 않습니다.","말할 수 없는 선물을 주신 하나님, 예수님이라는 가장 큰 선물에 감사하며 저도 아낌없이 나누게 하소서."],["고린도후서 9:6","이것이 곧 적게 심는 자는 적게 거두고 많이 심는 자는 많이 거둔다 하는 말이로다","섬김","농사의 원리로 나눔을 설명하는 말씀입니다. 나눔은 잃는 것이 아니라 씨앗을 심는 것입니다.","추수감사의 계절에 감사의 열매를 나누어 보세요. 나눔은 다음 추수를 위한 씨앗이 됩니다.","넉넉히 심고 기쁨으로 거두겠습니다.","농부는 씨앗을 아까워하면 추수를 기대할 수 없습니다. 그러나 이 말씀은 많이 심으면 많이 받는다는 투자 원리가 아닙니다. 8절은 ‘하나님이 모든 은혜를 넘치게 하시나니’라고 말합니다. 넉넉히 나누는 사람에게 하나님은 다시 나눌 수 있는 넉넉함을 주십니다.","추수의 하나님, 씨앗을 아끼지 않고 넉넉히 심게 하시고 다시 나눌 수 있는 은혜를 넘치게 하소서."],["누가복음 17:17","예수께서 대답하여 가라사대 열 사람이 다 깨끗함을 받지 아니하였느냐 그 아홉은 어디 있느냐","감사","나병에서 고침받은 열 명 중 돌아와 감사한 사람은 사마리아인 한 명뿐이었습니다. 감사는 은혜를 받은 사람이 아니라 은혜를 기억하는 사람의 것입니다.","당연하게 여겼던 도움에 대해 오늘 감사 인사를 전해 보세요. 나는 돌아온 한 사람이 되겠습니다.","은혜를 기억하고 돌아와 감사하는 한 사람이 되겠습니다.","열 명의 나병 환자는 모두 제사장에게 가라는 예수님의 말씀에 순종했습니다. 아홉 명도 믿음이 있었습니다. 차이는 감사였습니다. 오직 한 사람만 돌아왔고, 예수님은 그에게만 ‘네 믿음이 너를 구원하였다’고 하셨습니다(19절). 감사는 치유를 넘어 구원의 관계로 이끕니다.","은혜를 베푸신 주님, 받은 복만 누리고 떠나는 아홉이 아니라 돌아와 감사하는 한 사람이 되게 하소서."],["디모데전서 4:4","하나님의 지으신 모든 것이 선하매 감사함으로 받으면 버릴 것이 없나니","감사","하나님이 창조하신 것은 선하며, 감사로 받을 때 거룩해진다는 말씀입니다. 식사 기도의 의미이기도 합니다.","오늘 식사할 때 음식이 내 앞에 오기까지 수고한 많은 사람과 하나님께 감사하며 기도해 보세요.","감사로 받으니 모든 것이 선합니다.","19세기 영국 브리스틀의 조지 뮬러는 평생 1만 명이 넘는 고아를 돌보면서도 누구에게도 후원을 요청하지 않고 기도로 필요를 채운 것으로 유명합니다. 먹을 것이 없는 아침 식탁에서 감사 기도를 드리자 빵과 우유가 도착했다는 일화는 지금도 자주 회자됩니다. 그의 믿음은 한 번의 큰 기적보다 매일의 신실한 의존 속에서 빛났습니다.","주님, 제 앞의 음식과 모든 것을 감사로 받게 하시고 매일의 필요를 채우시는 주님을 신뢰하게 하소서."],["다니엘 6:10","다니엘이 이 조서에 어인이 찍힌 것을 알고도 자기 집에 돌아가서는 그 방의 예루살렘으로 향하여 열린 창에서 전에 행하던대로 하루 세번씩 무릎을 꿇고 기도하며 그 하나님께 감사하였더라","감사","왕 외의 다른 신에게 기도하면 사자 굴에 던져진다는 법이 공포되었지만, 다니엘은 ‘전에 행하던 대로’ 감사의 기도를 계속했습니다.","위기가 닥쳤을 때 갑자기 기도하는 것보다 평소의 기도 습관이 힘이 됩니다. 오늘 매일 기도할 시간을 정해 보세요.","어떤 상황에서도 전에 하던 대로 감사하며 기도합니다.","다니엘은 이 일이 있을 때 이미 80대였을 것으로 봅니다. 평생 하루 세 번 기도하던 습관이 위기의 순간에 그를 지켰습니다. 그는 위기 때문에 기도를 시작한 것이 아니라 늘 하던 대로 기도했습니다. 그리고 그 기도에는 감사가 있었습니다. 위기 속의 감사는 평소의 감사에서 나옵니다.","다니엘처럼 평소에 감사하며 기도하는 습관을 주시고 어떤 위기 속에서도 그 자리를 지키게 하소서."],["시편 145:2","내가 날마다 주를 송축하며 영영히 주의 이름을 송축하리이다","감사","‘날마다’와 ‘영영히’가 나란히 놓여 있습니다. 영원한 찬양은 오늘 하루의 찬양에서 시작됩니다.","오늘의 찬양을 내일로 미루지 마세요. 지금 짧게라도 하나님을 찬양하는 시간을 가져 보세요.","날마다 주님을 찬양하겠습니다.","‘날마다’와 ‘영영히’가 한 절 안에 함께 있습니다. 영원한 찬양은 하늘에서 갑자기 시작되는 것이 아니라 오늘 이 땅에서의 찬양으로 연습되는 것입니다. 오늘 드리는 작은 감사가 영원한 찬양의 첫 소절입니다.","날마다 찬양받으실 하나님, 오늘의 작은 감사가 영원한 찬양으로 이어지게 하소서."],["야고보서 1:17","각양 좋은 은사와 온전한 선물이 다 위로부터 빛들의 아버지께로서 내려오나니 그는 변함도 없으시고 회전하는 그림자도 없으시니라","감사","해와 달은 그림자를 만들며 변하지만, 빛들을 지으신 하나님은 변함이 없으십니다. 모든 좋은 것은 그분께로부터 옵니다.","오늘 누린 좋은 것 하나하나—햇살, 대화, 음식—을 하나님이 보내신 선물로 바라보세요.","모든 좋은 선물을 주시는 아버지께 감사합니다.","야고보는 바로 앞에서 시험을 하나님 탓으로 돌리지 말라고 경고합니다(13절). 그리고 이 구절에서 하나님은 오직 좋은 것을 주시는 분이라고 말합니다. 우리는 나쁜 일이 생기면 하나님을 원망하고, 좋은 일이 생기면 우리의 공으로 돌리기 쉽습니다. 감사는 그 습관을 뒤집습니다.","빛들의 아버지, 모든 좋은 것이 주님께로부터 왔음을 인정하며 감사하게 하소서."],["히브리서 13:15","이러므로 우리가 예수로 말미암아 항상 찬미의 제사를 하나님께 드리자 이는 그 이름을 증거하는 입술의 열매니라","감사","감사와 찬양은 ‘입술의 열매’입니다. 나무가 열매로 알려지듯, 그리스도인은 입술의 감사로 알려집니다.","오늘 내 입술에서 어떤 열매가 맺혔는지 돌아보세요. 불평이 아니라 감사의 열매를 맺어 보세요.","내 입술에서 감사의 열매가 맺히게 하소서.","‘입술의 열매’는 호세아 14장 2절에서 온 표현입니다. 짐승 제물 대신 입술로 드리는 고백입니다. 나무가 열매로 알려지듯, 우리의 입술에서 나오는 말이 우리가 어떤 나무인지 보여 줍니다. 불평의 열매를 맺는지, 감사의 열매를 맺는지.","주님, 제 입술에서 불평이 아니라 감사와 찬양의 열매가 맺히게 하소서."],["시편 95:2","우리가 감사함으로 그 앞에 나아가며 시를 지어 즐거이 그를 노래하자","감사","시편 95편은 오랫동안 예배를 시작하는 부름으로 사용되어 왔습니다. 감사와 노래로 하나님 앞에 나아가자는 초대입니다.","나만의 감사 시를 짧게 써 보세요. 서툴러도 진심이 담기면 아름다운 찬양이 됩니다.","감사와 노래로 주님 앞에 나아갑니다.","시편 95편은 감사와 찬양으로 시작하지만, 후반부에서는 광야에서 마음을 강퍅하게 한 조상들처럼 되지 말라고 경고합니다(8절). 감사는 마음을 부드럽게 유지하는 길입니다. 감사가 멈추면 마음이 굳어지기 시작합니다.","주님, 감사함으로 주님 앞에 나아가게 하시고 제 마음이 굳어지지 않게 지켜 주소서."],["시편 126:3","여호와께서 우리를 위하여 대사를 행하셨으니 우리는 기쁘도다","기쁨","포로에서 돌아온 사람들은 마치 꿈꾸는 것 같았다고 노래합니다. 이웃 나라들까지 하나님이 큰일을 행하셨다고 말할 정도였습니다.","올 한 해 하나님이 나를 위해 행하신 ‘큰일’은 무엇인가요? 그것을 가족이나 친구와 나눠 보세요.","주님이 나를 위해 큰일을 행하셨으니 나는 기쁩니다.","느헤미야 시대, 율법의 말씀을 듣고 울던 백성에게 느헤미야는 ‘여호와를 기뻐하는 것이 너희의 힘’이라고 말했습니다. 기쁨은 가벼운 기분이 아니라 무너진 성벽을 다시 쌓게 하는 힘입니다.","큰일을 행하신 하나님, 올해 저를 위해 행하신 일들을 기억하며 기뻐하고 이웃과 그 기쁨을 나누게 하소서."],["신명기 8:10","네가 먹어서 배불리고 네 하나님 여호와께서 옥토로 네게 주셨음을 인하여 그를 찬송하리라","감사","광야 40년을 지나 풍요로운 땅에 들어갈 백성에게 주신 말씀입니다. 바로 다음 구절은 배부를 때 하나님을 잊지
