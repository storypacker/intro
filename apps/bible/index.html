말라고 경고합니다.","풍요로울 때 오히려 감사를 잊기 쉽습니다. 감사의 달을 마무리하며 올해 누린 풍요를 하나하나 세어 보세요.","배부를 때에도 주님을 잊지 않고 찬송하겠습니다.","바로 다음 절은 ‘네 하나님 여호와를 잊어버리지 않도록 삼갈지어다’라고 경고합니다. 광야에서는 매일 만나를 기다리며 하나님을 의지했지만, 풍요로운 땅에서는 하나님을 잊기 쉽습니다. 배부를 때 드리는 감사가 가장 어렵고 가장 귀합니다.","풍성하게 채우신 하나님, 배부를 때에도 주님을 잊지 않게 하시고 누리는 모든 것을 감사로 찬송하게 하소서."],["이사야 9:6","이는 한 아기가 우리에게 났고 한 아들을 우리에게 주신 바 되었는데 그 어깨에는 정사를 메었고 그 이름은 기묘자라, 모사라, 전능하신 하나님이라, 영존하시는 아버지라, 평강의 왕이라 할 것임이라","성탄","예수님 탄생 약 700년 전의 예언입니다. 연약한 아기로 오시는 분이 동시에 전능하신 하나님이시며 평강의 왕이시라는 놀라운 역설입니다.","대림절을 시작하며, 다섯 가지 이름 중 지금 나에게 가장 필요한 이름을 부르며 기도해 보세요.","평강의 왕이신 주님을 기다립니다.","이사야가 이 예언을 전한 때는 아시리아의 위협으로 나라가 어둠에 덮인 시기였습니다. 하나님의 해답은 군대가 아니라 한 아기였습니다. 하나님은 가장 강한 방법이 아니라 가장 연약한 방법으로 세상을 구원하십니다. 대림절은 그 연약함 속에 숨겨진 능력을 기다리는 시간입니다.","평강의 왕이신 주님, 대림절을 시작하며 연약한 아기로 오신 주님을 기다립니다. 제 마음에 평강으로 오소서."],["이사야 7:14","그러므로 주께서 친히 징조로 너희에게 주실 것이라 보라 처녀가 잉태하여 아들을 낳을 것이요 그 이름을 임마누엘이라 하리라","성탄","두려움에 떠는 아하스 왕에게 주신 징조입니다. 마태는 이 예언이 예수님의 탄생으로 이루어졌다고 기록합니다. ‘임마누엘’은 하나님이 우리와 함께하신다는 뜻입니다.","하나님이 함께하신다는 사실이 오늘 나의 걱정을 어떻게 바꿀 수 있을지 생각해 보세요.","임마누엘, 하나님이 나와 함께하십니다.","아하스 왕은 하나님께 징조를 구하라는 말씀을 듣고도 ‘구하지 않겠다’며 경건한 척 거절했습니다(12절). 사실은 하나님보다 강대국을 의지하려 했던 것입니다. 그래도 하나님은 친히 징조를 주셨습니다. 우리의 불신앙에도 불구하고 하나님은 함께하시겠다는 약속을 포기하지 않으십니다.","임마누엘의 하나님, 제가 다른 것을 의지하려 할 때에도 포기하지 않고 함께하시는 주님께 감사합니다."],["이사야 40:3","외치는 자의 소리여 가로되 너희는 광야에서 여호와의 길을 예비하라 사막에서 우리 하나님의 대로를 평탄케 하라","성탄","세례 요한이 자신을 소개하며 인용한 말씀입니다. 왕이 오실 때 길을 고르고 평평하게 만들듯, 우리 마음도 주님 맞을 준비가 필요합니다.","대림절 동안 내 마음의 굽은 길—미움, 욕심, 무관심—하나를 곧게 펴 보세요.","내 마음에 주님 오실 길을 예비합니다.","대림절은 ‘오심’을 기다리는 절기입니다. 설교자들은 대림절을 세 가지 오심을 묵상하는 시간이라고 말합니다. 2천 년 전 베들레헴에 오신 예수님, 오늘 내 마음에 오시는 예수님, 그리고 다시 오실 예수님입니다.","주님 오실 길을 예비합니다. 제 마음의 굽은 길을 곧게 하시고 주님을 맞을 준비를 하게 하소서."],["미가 5:2","베들레헴 에브라다야 너는 유다 족속 중에 작을찌라도 이스라엘을 다스릴 자가 네게서 내게로 나올 것이라 그의 근본은 상고에, 태초에니라","성탄","하나님은 수도 예루살렘이 아니라 작은 마을 베들레헴을 메시아 탄생지로 택하셨습니다. 작은 것을 들어 쓰시는 하나님의 방식입니다.","내가 작고 보잘것없다고 느껴진다면, 하나님은 작은 베들레헴을 택하셨다는 것을 기억하세요.","작은 나를 통해서도 주님은 큰일을 이루십니다.","베들레헴은 ‘떡집’이라는 뜻입니다. 생명의 떡이신 예수님이 떡집에서 태어나셨습니다. 그리고 그곳은 다윗이 양을 치던 작은 마을이었습니다. 하나님은 큰 도시보다 작은 마을을, 왕궁보다 들판을 택하십니다. 우리의 작고 평범한 자리도 하나님이 일하시기에 충분합니다.","작은 베들레헴을 택하신 하나님, 제 작고 평범한 자리에서도 주님이 큰일을 이루실 것을 믿게 하소서."],["이사야 60:1","일어나라 빛을 발하라 이는 네 빛이 이르렀고 여호와의 영광이 네 위에 임하였음이니라","성탄","어둠이 땅을 덮은 때에 하나님의 빛이 임한다는 약속입니다. 빛을 받은 사람은 스스로 빛을 발하는 사람이 됩니다.","해가 짧아지는 겨울, 주변의 어두운 곳에 따뜻한 빛이 되어 줄 방법을 찾아보세요.","주님의 빛이 임했으니 일어나 빛을 발하겠습니다.","‘일어나라’는 명령은 엎드려 있던 사람에게 하는 말입니다. 그리고 ‘빛을 발하라’는 스스로 빛을 만들라는 것이 아니라, 받은 빛을 반사하라는 것입니다. 달은 스스로 빛나지 않지만 해의 빛을 받아 밤을 밝힙니다. 우리도 주님의 빛을 받아 어두운 세상을 밝힙니다.","빛으로 오시는 주님, 엎드려 있던 저를 일으키시고 주님의 빛을 받아 어두운 곳을 밝히게 하소서."],["누가복음 1:37","대저 하나님의 모든 말씀은 능치 못하심이 없느니라","성탄","천사 가브리엘이 마리아에게 수태를 알리며 한 말입니다. 불가능해 보이는 상황에서 하나님의 말씀은 반드시 이루어집니다.","나에게 불가능해 보이는 일이 있다면, 오늘 그것을 하나님의 말씀 앞에 내어놓고 기도해 보세요.","하나님의 말씀에는 불가능이 없습니다.","천사는 마리아에게 엘리사벳의 임신 소식을 먼저 전한 뒤 이 말을 합니다. 하나님은 불가능을 믿으라고만 하지 않으시고, 그 믿음을 도울 증거를 함께 주셨습니다. 우리의 믿음이 약할 때 하나님은 다른 사람의 이야기를 통해 우리를 격려하십니다.","불가능이 없으신 하나님, 믿음이 약할 때 다른 이의 간증을 통해 저를 격려하시고 주님의 말씀을 신뢰하게 하소서."],["누가복음 1:38","마리아가 가로되 주의 계집종이오니 말씀대로 내게 이루어지이다 하매 천사가 떠나가니라","성탄","결혼하지 않은 처녀가 임신한다는 것은 당시 목숨이 위험할 수도 있는 일이었습니다. 그럼에도 마리아는 순종으로 응답했습니다.","하나님의 뜻이 내 계획과 다를 때, 마리아처럼 ‘말씀대로 이루어지이다’라고 고백할 수 있나요?","말씀대로 내게 이루어지이다.","마리아는 모든 것을 이해한 뒤에 순종한 것이 아니었습니다. 그녀는 ‘어찌 이 일이 있으리이까’라고 물었고(34절), 답을 다 듣지 못했지만 순종했습니다. 순종은 이해의 끝이 아니라 신뢰의 시작입니다. 그리고 그 순종이 세상을 바꾸었습니다.","주님, 다 이해하지 못해도 신뢰하며 순종하게 하소서. ‘말씀대로 내게 이루어지이다’라고 고백하게 하소서."],["누가복음 1:46-47","마리아가 가로되 내 영혼이 주를 찬양하며 내 마음이 하나님 내 구주를 기뻐하였음은","성탄","‘마리아의 찬가’로 불리는 노래의 시작입니다. 이어지는 노래는 하나님이 비천한 자를 높이시고 교만한 자를 흩으신다고 찬양합니다.","나의 영혼을 크게 하는 찬양을 드려 보세요. 하나님은 낮은 자를 돌보시는 분입니다.","내 영혼이 주님을 높이고 기뻐합니다.","마리아의 찬가는 놀라운 노래입니다. 하나님이 권세 있는 자를 내리치시고 비천한 자를 높이시며, 주린 자를 좋은 것으로 배불리시고 부자는 빈손으로 보내신다고 노래합니다(52-53절). 성탄은 달콤한 이야기만이 아니라 세상의 질서를 뒤집는 혁명의 노래입니다.","비천한 자를 높이시는 하나님, 제 영혼이 주님을 높이며 낮은 자를 돌보시는 주님의 마음을 품게 하소서."],["마태복음 1:21","아들을 낳으리니 이름을 예수라 하라 이는 그가 자기 백성을 저희 죄에서 구원할 자이심이라 하니라","성탄","‘예수’는 ‘여호와는 구원이시다’라는 뜻입니다. 그분의 이름 자체가 그분이 오신 목적을 말해 줍니다.","예수님의 이름을 부를 때 그 이름의 의미를 기억하며 기도해 보세요.","예수, 나를 구원하시는 이름입니다.","‘예수’는 구약의 ‘여호수아’와 같은 이름으로, 당시 흔한 이름이었습니다. 하나님의 아들은 특별한 이름이 아니라 평범한 이름으로 오셨습니다. 그러나 그 이름에는 ‘자기 백성을 죄에서 구원하실 자’라는 사명이 담겨 있었습니다. 평범함 속에 비범한 사명이 숨어 있습니다.","예수님, 주님의 이름을 부를 때마다 저를 구원하신 그 사랑을 기억하게 하소서."],["마태복음 1:23","보라 처녀가 잉태하여 아들을 낳을 것이요 그의 이름은 임마누엘이라 하리라 하셨으니 이를 번역한즉 하나님이 우리와 함께 계시다 함이라","성탄","마태복음은 ‘하나님이 우리와 함께 계시다’로 시작해서 ‘세상 끝날까지 너희와 항상 함께 있으리라’(28:20)로 끝납니다. 복음서 전체가 임마누엘의 이야기입니다.","오늘 하루, 혼자라고 느끼는 순간마다 ‘임마누엘’을 조용히 불러 보세요.","하나님은 처음부터 끝까지 나와 함께하십니다.","요셉은 마리아의 임신을 알고 조용히 파혼하려 했습니다(19절). 그는 의로운 사람이었지만 이해할 수 없었습니다. 그때 천사가 꿈에 나타나 ‘임마누엘’을 말합니다. 하나님이 함께하신다는 약속이 요셉의 결정을 바꾸었습니다. 그 약속은 이해되지 않는 상황 속에서 우리의 결정도 바꿉니다.","함께하시는 하나님, 이해되지 않는 상황 속에서도 주님의 약속을 붙들고 바른 결정을 내리게 하소서."],["요한복음 1:14","말씀이 육신이 되어 우리 가운데 거하시매 우리가 그 영광을 보니 아버지의 독생자의 영광이요 은혜와 진리가 충만하더라","성탄","‘거하시매’는 장막을 치셨다는 뜻으로, 광야의 성막을 떠올리게 합니다. 하나님이 사람이 되어 우리 동네에 이사 오신 것입니다.","하나님이 내 일상 한가운데로 오셨다면, 오늘 나의 평범한 장소들이 거룩한 곳이 될 수 있습니다.","말씀이 육신이 되어 내 곁에 오셨습니다.","요한은 ‘우리가 그 영광을 보니’라고 말합니다. 그는 예수님과 함께 먹고 자고 걸었던 사람입니다. 하나님의 영광은 멀리 있는 빛이 아니라 피곤해하시고 우시고 웃으시는 한 사람 안에서 보였습니다. 하나님은 우리 일상 한가운데로 이사 오셨습니다.","육신이 되어 오신 주님, 제 평범한 일상 속에서 주님의 은혜와 진리를 보게 하소서."],["요한복음 1:12","영접하는 자 곧 그 이름을 믿는 자들에게는 하나님의 자녀가 되는 권세를 주셨으니","성탄","자기 땅에 오셨으나 자기 백성이 영접하지 않았다는 슬픈 구절 다음에 이 약속이 이어집니다. 영접하는 사람은 하나님의 자녀가 됩니다.","성탄의 분주함 속에서 예수님을 내 마음의 주인으로 맞이하는 시간을 따로 가져 보세요.","주님을 영접한 나는 하나님의 자녀입니다.","‘권세’는 법적인 권리를 뜻합니다. 하나님의 자녀가 되는 것은 감정이 아니라 신분의 변화입니다. 13절은 이것이 ‘혈통으로나 육정으로나 사람의 뜻으로 나지 아니하고 오직 하나님께로서 난 자’라고 말합니다. 우리의 출신과 배경이 아니라 하나님이 우리의 정체성을 정하십니다.","하나님의 자녀가 되게 하신 주님, 제 배경이 아니라 주님이 주신 새 신분으로 당당하게 살게 하소서."],["이사야 9:2","흑암에 행하던 백성이 큰 빛을 보고 사망의 그늘진 땅에 거하던 자에게 빛이 비취도다","성탄","전쟁으로 짓밟힌 북쪽 갈릴리 지역에 주신 약속입니다. 예수님은 바로 그 갈릴리에서 사역을 시작하셨습니다.","가장 어두운 곳에 가장 밝은 빛이 비칩니다. 내 삶의 어두운 부분을 주님의 빛 앞에 내어놓아 보세요.","흑암 속에 있던 나에게 큰 빛이 비쳤습니다.","‘사망의 그늘진 땅’은 갈릴리 북쪽, 외세에게 가장 먼저 짓밟힌 땅이었습니다. 하나님은 가장 먼저 무너진 곳에 가장 먼저 빛을 비추셨습니다. 마태는 예수님이 바로 그곳에서 사역을 시작하셨다고 기록합니다(마 4:15-16). 하나님의 빛은 가장 어두운 곳을 먼저 찾아갑니다.","가장 어두운 곳을 먼저 찾아오시는 주님, 제 마음의 그늘진 곳에도 주님의 빛을 비추어 주소서."],["누가복음 2:10","천사가 이르되 무서워 말라 보라 내가 온 백성에게 미칠 큰 기쁨의 좋은 소식을 너희에게 전하노라","성탄","성탄의 첫 소식은 왕궁이 아니라 들판에서 밤을 지새우던 목자들에게 전해졌습니다. 당시 사회적으로 낮게 여겨지던 이들이 첫 번째 증인이 되었습니다.","이번 성탄에 소외된 이웃에게 기쁜 소식을 전할 방법을 찾아보세요. 따뜻한 연락, 작은 선물도 좋습니다.","온 백성에게 미칠 큰 기쁨이 내게도 임했습니다.","목자들은 당시 사회에서 증인으로 인정받지 못할 만큼 낮게 여겨지던 사람들이었습니다. 하나님은 바로 그들에게 첫 소식을 전하셨습니다. 그리고 그들은 들은 대로 전했습니다(17절). 복음은 자격 있는 사람이 아니라 기쁨을 경험한 사람이 전합니다.","낮은 자에게 먼저 기쁜 소식을 전하신 하나님, 그 기쁨을 경험한 저도 이웃에게 전하게 하소서."],["누가복음 2:14","지극히 높은 곳에서는 하나님께 영광이요 땅에서는 기뻐하심을 입은 사람들 중에 평화로다 하니라","성탄","하늘의 천군이 부른 찬양입니다. 예수님의 탄생은 하늘에는 영광을, 땅에는 평화를 가져왔습니다.","갈등이 있는 관계 속에 평화를 가져오는 사람이 되어 보세요. 성탄의 평화는 우리를 통해 이 땅에 퍼집니다.","하늘에는 영광, 땅에는 평화가 있게 하소서.","1914년 제1차 세계대전 중 성탄 전야, 서부 전선의 여러 곳에서 독일군과 영국군 병사들이 참호에서 나와 캐럴을 부르고 인사를 나누었습니다. ‘크리스마스 휴전’으로 알려진 이 일은 평화의 왕이 오셨다는 의미를 보여 주는 장면으로 지금도 자주 회자됩니다.","하늘에는 영광, 땅에는 평화가 있게 하소서. 갈등이 있는 곳에 성탄의 평화를 전하는 사람이 되게 하소서."],["갈라디아서 4:4","때가 차매 하나님이 그 아들을 보내사 여자에게서 나게 하시고 율법 아래 나게 하신 것은","성탄","하나님은 가장 적절한 때에 아들을 보내셨습니다. 하나님의 시간표는 늦지도 이르지도 않습니다.","기다림에 지쳐 있다면, 하나님의 ‘때가 차매’를 신뢰하세요. 그분의 때는 언제나 가장 좋은 때입니다.","하나님의 때는 언제나 가장 좋습니다.","‘때가 차매’는 그릇에 물이 가득 차는 모습입니다. 로마의 도로망, 공용어인 헬라어, 메시아를 기다리는 간절함이 모두 갖추어진 때였습니다. 하나님은 우연이 아니라 준비된 때에 일하십니다. 우리 인생의 때도 하나님의 손에 있습니다.","때를 정하신 하나님, 제 인생의 기다림 속에서도 주님의 때가 차기를 신뢰하며 기다리게 하소서."],["디도서 2:11","모든 사람에게 구원을 주시는 하나님의 은혜가 나타나","은혜","예수님의 오심은 하나님의 은혜가 눈에 보이게 나타난 사건입니다. 다음 절은 그 은혜가 우리를 바르게 살도록 ‘양육한다’고 말합니다.","은혜는 받는 것으로 끝나지 않고 우리를 변화시킵니다. 올해 은혜가 나를 어떻게 바꾸었는지 돌아보세요.","모든 사람에게 나타난 은혜가 나를 새롭게 합니다.","바울은 은혜가 나타나 ‘우리를 양육하신다’고 말합니다(12절). 은혜는 한 번 받고 끝나는 선물이 아니라 우리를 가르치고 키우는 선생님입니다. 은혜는 우리를 그대로 두지 않습니다. 경건하지 않은 것을 버리고 바르게 살도록 우리를 빚어 갑니다.","양육하시는 은혜의 하나님, 은혜가 저를 가르치고 키워 날마다 주님을 닮아 가게 하소서."],["요한일서 4:9","하나님의 사랑이 우리에게 이렇게 나타난바 되었으니 하나님이 자기의 독생자를 세상에 보내심은 저로 말미암아 우리를 살리려 하심이니라","성탄","성탄은 하나님의 사랑이 눈에 보이게 ‘나타난’ 사건입니다. 그 목적은 우리를 살리려는 것이었습니다.","성탄 선물을 준비하며, 하나님이 주신 가장 큰 선물을 기억해 보세요.","하나님의 사랑이 예수님으로 나타났습니다.","요한은 하나님의 사랑을 설명하며 ‘독생자’라는 말을 씁니다. 하나뿐인 아들을 보내신 것입니다. 성탄의 선물은 넉넉해서 나눈 것이 아니라 가장 귀한 것을 내어 준 것입니다. 그 목적은 ‘우리를 살리려 하심’이었습니다.","가장 귀한 것을 내어 주신 하나님, 그 사랑으로 살아난 제가 이웃을 살리는 사랑을 하게 하소서."],["고린도후서 8:9","우리 주 예수 그리스도의 은혜를 너희가 알거니와 부요하신 자로서 너희를 위하여 가난하게 되심은 저의 가난함을 인하여 너희로 부요케 하려 하심이니라","은혜","하늘 영광을 버리고 가난한 마구간에 오신 예수님의 은혜입니다. 바울은 이 은혜를 근거로 가난한 이들을 돕자고 권합니다.","예수님이 나를 위해 가난해지셨듯, 이번 연말 어려운 이웃을 위해 나눔을 실천해 보세요.","나를 부요하게 하려고 가난해지신 주님의 은혜에 감사합니다.","바울은 마게도냐 교회가 극심한 가난 속에서도 넘치게 나누었다고 칭찬합니다(2절). 그들이 그렇게 할 수 있었던 이유가 이 구절에 있습니다. 부요하신 분이 가난해지셨기 때문입니다. 성탄은 하나님의 하향 이동입니다. 우리의 나눔은 그 하향 이동을 따라가는 것입니다.","가난해지신 주님, 그 은혜를 기억하며 이번 연말 어려운 이웃을 위해 기꺼이 나누게 하소서."],["빌립보서 2:7","오히려 자기를 비어 종의 형체를 가져 사람들과 같이 되었고","겸손","‘자기를 비우셨다’(케노시스)는 성육신의 신비를 보여 줍니다. 하나님이 종의 모습으로 오신 것은 겸손의 절정입니다.","높아지려는 세상 속에서 오늘 나를 비우는 작은 선택 하나를 해 보세요.","자기를 비우신 주님처럼 나도 낮아지겠습니다.","빌립보서 2장 6-11절은 초대 교회가 부르던 찬송으로 여겨집니다. 내려가심(6-8절)과 높아지심(9-11절)의 두 부분으로 나뉩니다. 예수님은 스스로 높아지지 않으셨고, 하나님이 높이셨습니다. 우리에게 요구되는 것은 높아지는 것이 아니라 그분의 마음을 품는 것입니다(5절).","자기를 비우신 주님, 높아지려는 마음을 비우고 주님의 마음을 품게 하소서."],["마태복음 2:10","저희가 별을 보고 가장 크게 기뻐하고 기뻐하더라","성탄","먼 동방에서 별을 따라온 박사들은 아기 예수께서 계신 곳 위에 별이 멈추자 크게 기뻐했습니다. 긴 여정 끝의 기쁨이었습니다.","나를 주님께 인도해 준 ‘별’ 같은 사람이나 사건을 떠올리며 감사해 보세요.","나를 주님께 인도하신 은혜를 기뻐합니다.","박사들은 먼 동방에서 별을 따라왔습니다. 그런데 예루살렘에 들러 길을 묻느라 잠시 별을 놓쳤습니다. 다시 길을 떠났을 때 별이 나타나자 그들은 ‘매우 크게’ 기뻐했습니다. 잠시 방향을 잃어도 다시 하나님의 인도를 발견할 때의 기쁨은 더 큽니다.","인도하시는 하나님, 잠시 길을 잃어도 다시 주님의 인도를 발견하는 기쁨을 주소서."],["누가복음 2:19","마리아는 이 모든 말을 마음에 지키어 생각하니라","성탄","목자들의 이야기를 들은 마리아는 그것을 마음에 간직하고 곰곰이 생각했습니다. 이해되지 않는 일도 서둘러 판단하지 않고 품는 지혜입니다.","올 한 해 이해되지 않았던 일들을 서둘러 결론 내리지 말고, 마리아처럼 마음에 품고 기도해 보세요.","이해되지 않는 일도 마음에 품고 주님을 신뢰합니다.","‘마음에 지키어 생각하니라’는 여러 조각을 모아 맞춰 본다는 뜻입니다. 마리아는 천사의 말, 목자들의 이야기, 아기의 모습을 하나씩 마음에 모아 두었습니다. 그 조각들의 의미는 30여 년 뒤 십자가와 부활에서야 완성되었습니다. 이해되지 않는 조각도 버리지 말고 간직해야 합니다.","주님, 지금 이해되지 않는 조각들도 마음에 간직하며 주님이 완성하실 그림을 기다리게 하소서."],["이사야 52:7","좋은 소식을 가져오며 평화를 공포하며 복된 좋은 소식을 가져오며 구원을 공포하며 시온을 향하여 이르기를 너의 하나님이 통치하신다 하는 자의 산을 넘는 발이 어찌 그리 아름다운고","성탄","전쟁의 승리 소식을 전하러 산을 넘어 달려오는 전령의 모습입니다. 바울은 이 구절을 복음 전하는 사람에게 적용했습니다.","이번 성탄에 기쁜 소식을 전하는 아름다운 발이 되어 보세요. 성탄 카드 한 장에 마음을 담아 보내는 것도 좋습니다.","좋은 소식을 전하는 아름다운 발이 되겠습니다.","산을 넘어오는 발은 먼지투성이고 지쳐 있었을 것입니다. 그런데 이사야는 그 발이 ‘아름답다’고 말합니다. 좋은 소식을 전하는 사람의 아름다움은 겉모습이 아니라 그가 전하는 소식에 있습니다. 성탄의 기쁨을 전하는 우리의 서툰 말과 발걸음도 하나님 앞에 아름답습니다.","좋은 소식을 주신 하나님, 서툴러도 성탄의 기쁨을 전하는 아름다운 발이 되게 하소서."],["누가복음 2:7","첫아들을 낳아 강보로 싸서 구유에 뉘었으니 이는 사관에 있을 곳이 없음이러라","성탄","세상을 지으신 분이 세상에 오셨을 때 머물 곳이 없었습니다. 그분은 가축의 먹이통인 구유에 누우셨습니다.","내 마음에는 예수님이 머무실 자리가 있나요? 성탄 전야, 분주함을 내려놓고 주님을 위한 자리를 마련해 보세요.","내 마음의 방을 비워 주님을 모십니다.","1223년 아시시의 프란치스코는 이탈리아 그레초의 한 동굴에 실제 구유와 소, 나귀를 두고 성탄 예배를 드렸습니다. 오늘날 성탄 구유 장식의 시작으로 알려진 장면입니다. 그는 하나님이 얼마나 낮은 곳으로 오셨는지를 사람들이 눈으로 보기를 원했습니다.","구유에 누우신 주님, 분주함을 내려놓고 제 마음의 방을 비워 주님을 모십니다."],["누가복음 2:11","오늘날 다윗의 동네에 너희를 위하여 구주가 나셨으니 곧 그리스도 주시니라","성탄","천사는 ‘오늘날’, ‘너희를 위하여’라고 말합니다. 성탄은 오래전 남의 이야기가 아니라 오늘 나를 위한 소식입니다.","메리 크리스마스! 오늘 나를 위해 오신 구주께 감사하며, 사랑하는 사람들과 이 기쁨을 나누세요.","오늘 나를 위해 구주가 나셨습니다.","「고요한 밤 거룩한 밤」은 1818년 성탄 전야 오스트리아의 작은 마을 오베른도르프에서 처음 불렸습니다. 요제프 모어 신부가 쓴 가사에 교사 프란츠 그루버가 기타 반주로 곡을 붙였습니다. 가장 소박한 자리에서 시작된 노래가 온 세계의 성탄 찬송이 되었습니다.","오늘 저를 위해 오신 구주 예수님, 성탄의 기쁨을 사랑하는 이들과 나누게 하소서."],["요한복음 1:16","우리가 다 그의 충만한데서 받으니 은혜 위에 은혜러라","은혜","‘은혜 위에 은혜’는 파도가 끊임없이 밀려오듯 은혜가 계속 이어진다는 뜻입니다.","올 한 해 받은 은혜를 떠올려 보면 하나가 아니라 겹겹이 쌓여 있을 것입니다. 그 은혜를 하나씩 세어 보세요.","은혜 위에 은혜를 받은 한 해였습니다.","‘충만한 데서’라는 말은 바다에서 물을 길어 올리는 모습과 같습니다. 아무리 많이 길어도 바다는 줄어들지 않습니다. 성탄을 지나며 우리가 받은 은혜를 다 세어 보아도, 그분의 충만함은 조금도 줄지 않았습니다. 내일도 은혜 위에 은혜가 이어집니다.","충만하신 주님, 은혜 위에 은혜를 주심에 감사하며 내일도 그 충만함에서 길어 올리게 하소서."],["에베소서 1:7","우리가 그리스도 안에서 그의 은혜의 풍성함을 따라 그의 피로 말미암아 구속 곧 죄 사함을 받았으니","은혜","‘구속’은 값을 치르고 노예를 자유롭게 하는 것을 뜻합니다. 그 값은 ‘은혜의 풍성함을 따라’ 넉넉하게 치러졌습니다.","한 해 동안 쌓인 후회와 잘못을 주님 앞에 내려놓으세요. 풍성한 은혜가 그것을 덮습니다.","풍성한 은혜로 나는 자유롭게 되었습니다.","바울은 에베소서 1장 3절부터 14절까지를 한 문장으로 썼습니다. 숨 쉴 틈 없이 하나님의 복을 나열합니다. 선택하심, 양자 삼으심, 구속하심, 기업이 되게 하심. 그 한가운데 이 구절이 있습니다. 한 해를 마무리하며 우리도 숨 쉴 틈 없이 감사할 이유가 있습니다.","풍성한 은혜의 하나님, 숨 쉴 틈 없이 이어진 올해의 은혜를 세어 보며 감사드립니다."],["시편 103:4","네 생명을 파멸에서 구속하시고 인자와 긍휼로 관을 씌우시며","은혜","하나님은 우리를 무너짐에서 건지실 뿐 아니라 사랑과 긍휼이라는 왕관까지 씌워 주십니다.","올해 무너질 뻔했던 순간에 나를 건지신 하나님의 손길을 떠올려 보세요.","나를 건지시고 사랑으로 관 씌우신 주님께 감사합니다.","시편 103편 3-5절은 하나님이 하시는 일을 다섯 가지 동사로 나열합니다. 사하시고, 고치시고, 구속하시고, 관 씌우시고, 만족케 하십니다. 한 해 동안 이 다섯 가지 은혜를 모두 경험했을 것입니다. 하나님은 건지실 뿐 아니라 왕관을 씌우십니다.","저를 건지시고 관 씌우신 하나님, 올해 받은 용서와 치유와 구원을 기억하며 감사합니다."],["사무엘상 7:12","사무엘이 돌을 취하여 미스바와 센 사이에 세워 가로되 여호와께서 여기까지 우리를 도우셨다 하고 그 이름을 에벤에셀이라 하니라","감사","블레셋과의 전쟁에서 승리한 후 사무엘이 세운 기념비입니다. ‘에벤에셀’은 ‘도움의 돌’이라는 뜻입니다. 많은 교회가 송구영신 때 이 말씀을 나눕니다.","올 한 해 하나님이 도우신 순간들을 적어 나만의 ‘에벤에셀’ 기념비를 세워 보세요.","여기까지 주님이 나를 도우셨습니다.","사무엘이 돌을 세운 미스바는 20여 년 전 이스라엘이 블레셋에게 크게 패하고 언약궤까지 빼앗겼던 에벤에셀 근처였습니다(삼상 4장). 패배의 기억이 서린 그 땅에 이제 ‘도움의 돌’이 세워졌습니다. 하나님은 실패의 자리를 은혜의 기념비로 바꾸십니다. ‘여기까지’라는 말에는 지나온 길에 대한 감사와 앞으로의 길에 대한 신뢰가 함께 담겨 있습니다.","여기까지 도우신 하나님, 올해의 모든 순간에 함께하신 주님을 기억하며 에벤에셀의 감사를 드립니다."],["시편 23:6","나의 평생에 선하심과 인자하심이 정녕 나를 따르리니 내가 여호와의 집에 영원히 거하리로다","은혜","‘따르리니’는 원어로 ‘뒤쫓는다’는 뜻입니다. 하나님의 선하심과 사랑은 우리 뒤를 끈질기게 따라옵니다.","지난 일 년을 되돌아보면, 하나님의 선하심이 나를 따라온 흔적을 볼 수 있을 것입니다. 그 흔적에 감사하세요.","주님의 선하심과 사랑이 평생 나를 따릅니다.","시편 23편은 목자의 이미지로 시작해서 집주인의 이미지로 끝납니다. 5절에서 하나님은 원수 앞에서 상을 차려 주시는 주인이 되십니다. 광야를 걷던 양이 결국 주인의 집에 머무는 손님이 됩니다. 한 해의 여정 끝에 우리를 기다리는 것은 하나님의 집입니다.","선하심과 인자하심으로 저를 따르신 하나님, 한 해의 끝에서 주님의 집에 거하는 평안을 누리게 하소서."],["신명기 2:7","네 하나님 여호와가 네 손으로 하는 모든 일에 복을 주시고 네가 이 광대한 광야에 두루 행함을 알으셨으며 네 하나님 여호와가 이 사십년 동안 너와 함께 하였으므로 네게 부족함이 없었느니라","감사","광야 40년을 돌아보며 모세가 한 고백입니다. 힘든 광야였지만 하나님이 함께하셨기에 부족함이 없었습니다.","올해의 마지막 날입니다. 광야 같았던 순간에도 함께하신 하나님께 감사하며 새해를 맞이하세요.","올 한 해도 주님이 함께하셨기에 부족함이 없었습니다.","모세는 백성들에게 40년 광야를 돌아보게 합니다. 그 시간은 실패와 불평과 방황으로 가득했습니다. 그런데 그 결론은 ‘부족함이 없었다’입니다. 만나가 매일 내렸고, 옷이 해어지지 않았습니다(신 8:4). 우리의 한 해도 돌아보면 그렇습니다. 부족해 보였지만, 부족함이 없었습니다.","올 한 해도 함께하신 하나님, 부족해 보였던 날들에도 부족함이 없게 하신 은혜에 감사하며 새해를 주님께 맡깁니다."]];
const CUM=[0,31,60,91,121,152,182,213,244,274,305,335];
const DOW=["일","월","화","수","목","금","토"];
const ICON={sec1:"📖",sec2:"🕊️",sec3:"🌱",sec4:"🙏"};
const $=s=>document.querySelector(s);
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},
             set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

function idxOf(d){return CUM[d.getMonth()]+d.getDate()-1}
function mdOf(i){let m=0;while(m<11&&CUM[m+1]<=i)m++;return [m+1,i-CUM[m]+1]}
function sameDay(a,b){return a.getFullYear()==b.getFullYear()&&a.getMonth()==b.getMonth()&&a.getDate()==b.getDate()}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}
function today(){const n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate())}
function esc(s){return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}

let state={tab:"today",date:today(),from:null,q:""};
let saved=store.get("wotd_saved",[]);

function header(){
  const t=today();
  $("#ymd").textContent=`${t.getFullYear()}년 ${t.getMonth()+1}월 ${t.getDate()}일`;
  $("#dow").textContent=`${DOW[t.getDay()]}요일 · 오늘의 말씀`;
}

function dayView(date,opts={}){
  const i=idxOf(date), e=DAYS[i], [ref,text,theme,meaning,apply,closing,sermon,prayer]=e;
  const isToday=sameDay(date,today());
  const minDate=addDays(today(),-365);
  const label=opts.savedView?`${mdOf(i)[0]}월 ${mdOf(i)[1]}일의 말씀`
    :isToday?"오늘의 말씀":`${date.getFullYear()}년 ${date.getMonth()+1}월 ${date.getDate()}일 (${DOW[date.getDay()]})의 말씀`;
  const on=saved.includes(i);
  return `<div class="fade">
  ${opts.back?`<button class="backbar" data-act="back">‹ ${opts.back}</button>`:""}
  <article class="card verse">
    <div class="eyebrow"><span>${label}</span><span class="chip">${theme}</span></div>
    <p class="vtext">${esc(text)}</p>
    <p class="vref">— ${ref} <small>(개역한글)</small></p>
    <div class="tools">
      <div class="grp">
        <button class="ibtn ${on?"on":""}" data-act="save" data-i="${i}" aria-label="마음에 담기">${on?"♥":"♡"} 담기</button>
        <button class="ibtn" data-act="copy" data-i="${i}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="8" y="8" width="13" height="13" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"/></svg>복사</button>
      </div>
      ${opts.savedView?"":`<div class="grp">
        <button class="ibtn" data-act="prev" ${date<=minDate?"disabled":""} aria-label="전날">‹ 전날</button>
        <button class="ibtn" data-act="next" ${isToday?"disabled":""} aria-label="다음날">다음날 ›</button>
      </div>`}
    </div>
  </article>
  <section class="sec"><h3><i>${ICON.sec1}</i>말씀 풀이</h3><p>${esc(meaning)}</p></section>
  <section class="sec"><h3><i>${ICON.sec2}</i>설교 묵상</h3><p>${esc(sermon)}</p></section>
  <section class="sec"><h3><i>${ICON.sec3}</i>오늘의 삶에서</h3><p>${esc(apply)}</p></section>
  <section class="sec prayer"><h3><i>${ICON.sec4}</i>오늘의 기도</h3><p>${esc(prayer)} 예수님의 이름으로 기도합니다. 아멘.</p></section>
  <div class="pledge"><div class="lbl">오늘의 다짐</div><p>${esc(closing)}</p></div>
  <p class="note">본문은 개역한글판(1961)을 따랐습니다. 말씀 풀이와 설교 묵상은 본문의 문맥, 교회사 속 인물·사건, 널리 알려진 해석을 바탕으로 정리했습니다. 1년(366일) 동안 구절·설교 묵상·기도문이 날마다 모두 다르게 나옵니다.</p>
  </div>`;
}

function itemHTML(i,date){
  const [ref,text]=DAYS[i];const [m,d]=mdOf(i);
  const dd=date?`<b>${date.getDate()}</b><span>${DOW[date.getDay()]}요일</span>`:`<b>${d}</b><span>${m}월</span>`;
  return `<button class="item" data-act="open" data-i="${i}" ${date?`data-t="${+date}"`:""}><div class="d">${dd}</div><div class="t"><div class="r">${ref}</div><div class="x">${esc(text)}</div></div></button>`;
}

function pastView(){
  const q=state.q.trim();
  let html=`<input class="search" id="q" placeholder="성경 구절이나 단어로 찾기 (예: 시편, 평안)" value="${esc(q)}">`;
  let curM=null,count=0,t=today();
  for(let k=1;k<=365;k++){
    const d=addDays(t,-k), i=idxOf(d), e=DAYS[i];
    if(q && !(e[0]+e[1]+e[2]+e[5]).includes(q)) continue;
    const key=`${d.getFullYear()}-${d.getMonth()}`;
    if(key!==curM){ if(curM) html+=`</div>`; html+=`<div class="mhead">${d.getFullYear()}년 ${d.getMonth()+1}월</div><div class="list">`; curM=key;}
    html+=itemHTML(i,d); count++;
  }
  if(curM) html+=`</div>`;
  if(!count) html+=`<div class="empty">찾는 말씀이 지난 1년 안에 없어요.</div>`;
  return `<div class="fade"><p class="intro">지난 1년 동안의 오늘의 말씀입니다.</p>${html}</div>`;
}

function savedView(){
  if(!saved.length) return `<div class="empty fade">아직 마음에 담은 말씀이 없어요.<br>말씀 카드의 ♡ 담기를 눌러 모아 보세요.</div>`;
  return `<div class="fade"><p class="intro">내가 마음에 담은 말씀 ${saved.length}개</p><div class="list">${[...saved].reverse().map(i=>itemHTML(i)).join("")}</div></div>`;
}

function render(scroll=true){
  document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("on",b.dataset.tab===state.tab));
  let html="";
  if(state.tab==="today") html=dayView(state.date,sameDay(state.date,today())?{}:{back:"오늘의 말씀으로"});
  else if(state.tab==="past") html=state.from==="past"?dayView(state.date,{back:"지난 말씀 목록"}):pastView();
  else html=state.from==="saved"?dayView(state.date,{back:"마음에 담은 말씀",savedView:true}):savedView();
  $("#view").innerHTML=html;
  if(scroll) window.scrollTo({top:0});
  const q=$("#q"); if(q){q.addEventListener("input",ev=>{state.q=ev.target.value;const pos=ev.target.selectionStart;render(false);const n=$("#q");n.focus();n.setSelectionRange(pos,pos)})}
}

function toast(msg){const t=$("#toast");t.textContent=msg;t.classList.add("show");clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove("show"),1600)}

async function copyText(s){
  try{await navigator.clipboard.writeText(s);toast("말씀을 복사했어요");}
  catch(e){const ta=document.createElement("textarea");ta.value=s;document.body.appendChild(ta);ta.select();
    try{document.execCommand("copy");toast("말씀을 복사했어요")}catch(_){toast("복사할 수 없어요")}ta.remove();}
}

document.addEventListener("click",ev=>{
  const tab=ev.target.closest(".tab");
  if(tab){state.tab=tab.dataset.tab;state.from=null;state.date=today();render();return}
  const b=ev.target.closest("[data-act]"); if(!b) return;
  const a=b.dataset.act, i=+b.dataset.i;
  if(a==="prev"||a==="next"){state.date=addDays(state.date,a==="prev"?-1:1);render(false)}
  else if(a==="back"){ if(state.tab==="today") state.date=today(); state.from=null; render(); }
  else if(a==="open"){ state.from=state.tab; if(b.dataset.t) state.date=new Date(+b.dataset.t); else {const [m,d]=mdOf(i);state.date=new Date(today().getFullYear(),m-1,d)} render(); }
  else if(a==="save"){ saved=saved.includes(i)?saved.filter(x=>x!==i):[...saved,i]; store.set("wotd_saved",saved);
    toast(saved.includes(i)?"마음에 담았어요":"담은 말씀에서 뺐어요"); render(false); }
  else if(a==="copy"){ const e=DAYS[i]; copyText(`${e[1]}\n— ${e[0]} (개역한글)\n\n🙏 ${e[7]} 예수님의 이름으로 기도합니다. 아멘.\n\n${e[5]}`); }
});

/* ---------- 날씨 (Open-Meteo, 키 없이 사용) ---------- */
const CITIES={"서울":[37.5665,126.978],"부산":[35.1796,129.0756],"대구":[35.8714,128.6014],"인천":[37.4563,126.7052],
"광주":[35.1595,126.8526],"대전":[36.3504,127.3845],"울산":[35.5384,129.3114],"세종":[36.48,127.289],"수원":[37.2636,127.0286],
"춘천":[37.8813,127.7298],"강릉":[37.7519,128.8761],"청주":[36.6424,127.489],"전주":[35.8242,127.148],"포항":[36.019,129.3435],
"창원":[35.2279,128.6811],"제주":[33.4996,126.5312]};
function wmo(c){
  if(c===0)return["☀️","맑음"]; if(c<=2)return["🌤️","구름 조금"]; if(c===3)return["☁️","흐림"];
  if(c===45||c===48)return["🌫️","안개"]; if(c>=51&&c<=57)return["🌦️","이슬비"]; if(c>=61&&c<=67)return["🌧️","비"];
  if(c>=71&&c<=77)return["🌨️","눈"]; if(c>=80&&c<=82)return["🌦️","소나기"]; if(c===85||c===86)return["🌨️","눈"];
  if(c>=95)return["⛈️","뇌우"]; return["🌡️",""];
}
let city=store.get("wotd_city","서울");
function buildMenu(){
  $("#cityMenu").innerHTML=`<button class="here ${city==="현재 위치"?"on":""}" data-city="현재 위치">📍 현재 위치</button>`+
    Object.keys(CITIES).map(c=>`<button data-city="${c}" class="${c===city?"on":""}">${c}</button>`).join("");
}
$("#cityBtn").addEventListener("click",e=>{e.stopPropagation();buildMenu();$("#cityMenu").classList.toggle("open")});
$("#cityMenu").addEventListener("click",e=>{const b=e.target.closest("[data-city]");if(!b)return;e.stopPropagation();
  city=b.dataset.city;store.set("wotd_city",city);$("#cityMenu").classList.remove("open");loadWeather(true)});
document.addEventListener("click",()=>$("#cityMenu").classList.remove("open"));

function getPos(){return new Promise((res,rej)=>{if(!navigator.geolocation)return rej();
  navigator.geolocation.getCurrentPosition(p=>res([p.coords.latitude,p.coords.longitude]),rej,{timeout:7000,maximumAge:1800000})})}

async function loadWeather(force){
  $("#cityName").textContent=city;
  const cacheKey="wotd_wx_"+city, cached=store.get(cacheKey,null);
  if(!force&&cached&&Date.now()-cached.t<30*60*1000) return showWx(cached.d);
  $("#wxNow").textContent="날씨 불러오는 중…";
  try{
    let ll=CITIES[city];
    if(city==="현재 위치"){ try{ll=await getPos()}catch(e){ll=CITIES["서울"];$("#cityName").textContent="서울(위치 확인 불가)"} }
    const ctl=new AbortController(); const to=setTimeout(()=>ctl.abort(),7000);
    const url=`https://api.open-meteo.com/v1/forecast?latitude=${ll[0]}&longitude=${ll[1]}&current=temperature_2m,weather_code&daily=temperature_2m_max,temperature_2m_min&timezone=Asia%2FSeoul&forecast_days=1`;
    const r=await fetch(url,{signal:ctl.signal}); clearTimeout(to);
    if(!r.ok) throw 0; const j=await r.json();
    const d={temp:j.current.temperature_2m,code:j.current.weather_code,hi:j.daily.temperature_2m_max[0],lo:j.daily.temperature_2m_min[0]};
    store.set(cacheKey,{t:Date.now(),d}); showWx(d);
  }catch(e){
    $("#wxNow").innerHTML=`<a href="https://www.weather.go.kr/w/index.do" target="_blank" rel="noopener">🌤️ 날씨 보기 ›</a>`;
  }
}
function showWx(d){const [ic,txt]=wmo(d.code);
  $("#wxNow").innerHTML=`${ic} <b>${Math.round(d.temp)}°</b> ${txt}`;
  $("#cityName").textContent=`${city} · ${Math.round(d.hi)}°/${Math.round(d.lo)}°`;}

/* ---------- 시작 ---------- */
header(); render(); loadWeather();
// 앱을 켜 둔 채 날짜가 바뀌면 자동으로 새 말씀으로
let lastDay=+today();
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible"&&+today()!==lastDay){lastDay=+today();state={tab:"today",date:today(),from:null,q:""};header();render();loadWeather(true)} });
setInterval(()=>{ if(+today()!==lastDay){lastDay=+today();if(state.tab==="today"&&!state.from){state.date=today();render(false)}header()} },60000);
</script>
