<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F6F1E7">
<title>가톨릭 오늘의 말씀</title>
<meta name="description" content="한국천주교주교회의 『성경』을 바탕으로 하루 한 구절과 말씀 풀이, 오늘의 삶에서 새길 점과 다짐을 전하는 가톨릭 오늘의 말씀 앱.">
<link rel="icon" type="image/png" href="../../img/logo-badge.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F1E7; --paper:#FFFDF8; --ink:#2A2420; --sub:#6F655C; --faint:#A39886;
  --line:#E7DECF; --accent:#8A2E3B; --accent-soft:#F3E4E2; --gold:#A8854A; --gold-soft:#F4EBDA;
  --shadow:0 1px 2px rgba(60,40,20,.05),0 8px 24px rgba(60,40,20,.06);
  --serif:"Gowun Batang","Nanum Myeongjo","AppleMyungjo",serif;
  --sans:"Noto Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#1B1816; --paper:#242020; --ink:#EDE6DB; --sub:#B5AA9C; --faint:#7E7468;
    --line:#3A3330; --accent:#E39AA5; --accent-soft:#3A2629; --gold:#D3B27A; --gold-soft:#332B1F;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); }
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--sans);font-size:16px;line-height:1.7;-webkit-font-smoothing:antialiased;
  min-height:100vh;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.wrap{max-width:560px;margin:0 auto;padding:0 20px}

/* header */
header.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line);
  padding-top:env(safe-area-inset-top)}
.top-in{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 20px 12px;max-width:560px;margin:0 auto}
.brand{font-size:12px;letter-spacing:.08em;color:var(--accent);font-weight:700;display:flex;align-items:center;gap:6px}
.date{font-family:var(--serif);font-size:21px;font-weight:700;line-height:1.3;margin-top:2px}
.date small{font-family:var(--sans);font-size:13px;font-weight:500;color:var(--sub);margin-left:6px}
.weather{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--sub);text-align:right;
  padding:6px 10px;border-radius:999px;border:1px solid var(--line);background:var(--paper);white-space:nowrap}
.weather .wi{font-size:17px;line-height:1}
.weather .wt{font-weight:700;color:var(--ink);font-size:14px}
.weather .wp{font-size:11px;color:var(--faint)}

/* card */
main{padding:18px 0 24px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);overflow:hidden}
.verse-box{padding:30px 26px 26px;position:relative;text-align:center;
  background:linear-gradient(180deg,var(--gold-soft),transparent 85%)}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:12px;letter-spacing:.14em;color:var(--gold);font-weight:700}
.eyebrow::before,.eyebrow::after{content:"";width:22px;height:1px;background:var(--gold);opacity:.6}
.cross{display:block;margin:14px auto 6px;width:18px;height:24px;color:var(--accent);opacity:.85}
.verse{font-family:var(--serif);font-size:21px;line-height:1.85;margin:10px 0 18px;word-break:keep-all;letter-spacing:-.005em}
.verse::before{content:"“";color:var(--gold)} .verse::after{content:"”";color:var(--gold)}
.ref{font-size:14px;color:var(--accent);font-weight:700;word-break:keep-all}
.ref span{display:block;font-weight:400;color:var(--faint);font-size:12px;margin-top:2px}
.sec{padding:22px 26px;border-top:1px solid var(--line)}
.sec h3{font-size:13px;letter-spacing:.06em;color:var(--sub);font-weight:700;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.sec h3 i{font-style:normal;display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-size:12px}
.sec p{font-size:16px;color:var(--ink);word-break:keep-all}
.vow{margin:4px 18px 20px;padding:20px 22px;border-radius:14px;background:var(--accent-soft);text-align:center}
.vow .lbl{font-size:12px;letter-spacing:.12em;color:var(--accent);font-weight:700}
.vow p{font-family:var(--serif);font-size:18px;line-height:1.7;margin-top:6px;word-break:keep-all;color:var(--ink)}
.actions{display:flex;gap:8px;padding:0 18px 20px}
.btn{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:11px 12px;border-radius:12px;
  border:1px solid var(--line);font-size:14px;font-weight:500;color:var(--sub);background:var(--bg)}
.btn:active{transform:scale(.98)}
.btn.on{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
.daynav{display:flex;justify-content:space-between;align-items:center;margin:16px 2px 0;font-size:14px}
.daynav button{padding:8px 12px;border-radius:10px;color:var(--sub)}
.daynav button:disabled{opacity:.3;cursor:default}
.daynav .mid{color:var(--faint);font-size:13px}
.back{display:inline-flex;align-items:center;gap:4px;color:var(--sub);font-size:14px;padding:6px 0;margin-bottom:10px}
.pastlabel{font-size:12px;color:var(--gold);font-weight:700;letter-spacing:.06em;margin-bottom:8px}

/* lists */
.page-h{font-family:var(--serif);font-size:22px;font-weight:700;margin:4px 0 4px}
.page-d{font-size:14px;color:var(--sub);margin-bottom:16px}
.picker{display:flex;gap:8px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:18px}
.picker label{font-size:13px;color:var(--sub);white-space:nowrap}
.picker input{flex:1;min-width:0;font:inherit;font-size:15px;color:var(--ink);background:transparent;border:0;outline:0}
.picker button{font-size:13px;font-weight:700;color:var(--paper);background:var(--accent);padding:7px 12px;border-radius:9px}
.month{font-size:13px;font-weight:700;color:var(--gold);margin:20px 4px 8px;letter-spacing:.04em}
.list{background:var(--paper);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.item{display:flex;gap:14px;width:100%;text-align:left;padding:14px 16px;border-top:1px solid var(--line);align-items:flex-start}
.item:first-child{border-top:0}
.item:active{background:var(--bg)}
.item .d{flex:0 0 46px;text-align:center;line-height:1.15;padding-top:2px}
.item .d b{display:block;font-family:var(--serif);font-size:21px;color:var(--ink)}
.item .d small{font-size:11px;color:var(--faint)}
.item .d.sun b{color:var(--accent)}
.item .t{flex:1;min-width:0}
.item .t .r{font-size:12.5px;color:var(--accent);font-weight:700}
.item .t .v{font-family:var(--serif);font-size:15px;color:var(--ink);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:keep-all;margin-top:2px;line-height:1.6}
.more{display:block;width:100%;margin-top:14px;padding:12px;border-radius:12px;border:1px dashed var(--line);color:var(--sub);font-size:14px}
.empty{text-align:center;color:var(--sub);padding:48px 20px;font-size:15px}
.empty .big{font-size:34px;margin-bottom:8px;color:var(--gold)}
.note{font-size:12px;color:var(--faint);text-align:center;margin:26px 10px 0;line-height:1.6;word-break:keep-all}

/* tabbar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--paper);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom)}
.tabs-in{display:flex;max-width:560px;margin:0 auto}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 0 10px;font-size:11.5px;color:var(--faint);font-weight:500}
.tab svg{width:23px;height:23px}
.tab.on{color:var(--accent);font-weight:700}

/* sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:20;display:none;align-items:flex-end;justify-content:center}
.sheet-bg.open{display:flex}
.sheet{background:var(--paper);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom))}
.sheet h4{font-size:15px;margin-bottom:4px}
.sheet p{font-size:12.5px;color:var(--sub);margin-bottom:12px}
.cities{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cities button{padding:10px 6px;border:1px solid var(--line);border-radius:10px;font-size:14px;background:var(--bg)}
.cities button.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft);font-weight:700}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(10px);
  background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:13.5px;opacity:0;transition:.25s;pointer-events:none;z-index:30}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.fade{animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (min-width:600px){ .verse{font-size:23px} .date{font-size:23px} }
[hidden]{display:none!important}
.home{display:block;max-width:560px;margin:0 auto;padding:10px 20px 0;font-size:12.5px;color:var(--sub);text-decoration:none}
.home:hover{color:var(--accent)}
</style>
</head>
<body>
<header class="top">
  <a class="home" href="../../index.html">← 스토리패커 홈</a>
  <div class="top-in">
    <div>
      <div class="brand">✝ 가톨릭 오늘의 말씀</div>
      <div class="date" id="today-date"></div>
    </div>
    <button class="weather" id="weather" aria-label="날씨 지역 선택">
      <span class="wi">…</span><span><span class="wt"></span> <span class="wp">날씨 불러오는 중</span></span>
    </button>
  </div>
</header>

<main class="wrap" id="view"></main>

<nav class="tabs">
  <div class="tabs-in">
    <button class="tab" data-tab="today">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18M7 8h10"/></svg>오늘의 말씀</button>
    <button class="tab" data-tab="past">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>지난 말씀</button>
    <button class="tab" data-tab="saved">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg>간직한 말씀</button>
  </div>
</nav>

<div class="sheet-bg" id="sheet">
  <div class="sheet">
    <h4>날씨 지역 선택</h4>
    <p>현재 위치를 사용할 수 없을 때 선택한 지역의 날씨를 보여 드립니다.</p>
    <div class="cities" id="cities"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const D={};
D[1]=[
["민수 6,24-26","주님께서 그대에게 복을 내리시고 그대를 지켜 주시리라. 주님께서 그대에게 당신 얼굴을 비추시고 그대에게 은혜를 베푸시리라. 주님께서 그대에게 당신 얼굴을 들어 보이시고 그대에게 평화를 베푸시리라.","하느님께서 모세를 통해 사제 아론에게 알려 주신 ‘축복의 기도’입니다. 복과 보호, 은혜와 평화가 모두 하느님의 ‘얼굴’에서 흘러나온다고 말합니다. 하느님이 나를 외면하지 않고 마주 보고 계신다는 것이 축복의 핵심입니다.","새해 첫날 우리는 계획과 결심부터 세우곤 합니다. 하지만 그보다 먼저 ‘나는 이미 복을 받은 사람’이라는 사실을 기억하면 한 해를 대하는 마음이 달라집니다. 성모 마리아를 천주의 어머니로 기리는 오늘, 내가 받은 축복을 가족과 이웃에게 말로 건네 보세요.","올해 나는 축복을 받는 사람이자, 축복을 건네는 사람이 되겠습니다."],
["이사 43,19","보라, 내가 새 일을 하려 한다. 이미 드러나고 있는데 너희는 그것을 알지 못하느냐? 정녕 나는 광야에 길을 내고 사막에 강을 내리라.","바빌론 유배 중 절망에 빠진 이스라엘에게 하느님께서 주신 약속입니다. 길이 없는 광야와 물 없는 사막은 우리 삶의 막막한 순간을 뜻합니다. 하느님은 바로 그곳에 길과 강을 내시는 분입니다.","지난해의 실패나 상처가 올해도 이어질 것 같아 두려울 때가 있습니다. 그러나 하느님의 새 일은 이미 ‘드러나고 있다’고 합니다. 작은 변화와 기회를 알아차리는 눈을 가지는 것, 그것이 새로움을 맞이하는 첫걸음입니다.","나의 광야에도 길이 나고 있음을 믿으며, 오늘의 작은 새로움을 찾아보겠습니다."],
["2코린 5,17","그러므로 누구든지 그리스도 안에 있으면 그는 새로운 피조물입니다. 옛것은 지나갔습니다. 보십시오, 새것이 생겨났습니다.","바오로 사도는 그리스도를 만난 사람은 겉모습이 아니라 존재 자체가 새로워진다고 고백합니다. 과거의 죄와 실패가 더 이상 나를 규정하지 못한다는 선언입니다.","우리는 종종 ‘나는 원래 이런 사람이야’라며 스스로를 과거에 가둡니다. 신앙은 그 꼬리표를 떼어 내는 용기입니다. 오래된 습관 하나를 내려놓고 새로운 방식으로 하루를 시작해 보세요.","주님 안에서 나는 날마다 새롭게 지어지는 사람입니다."],
["애가 3,22-23","주님의 자애는 다함이 없고 그분의 자비는 끝이 없어 아침마다 새롭다네. 당신의 성실은 크기도 합니다.","예루살렘이 무너진 폐허 한가운데에서 나온 고백입니다. 모든 것을 잃은 듯한 순간에도 하느님의 사랑은 바닥나지 않고 아침마다 새로 채워진다고 노래합니다.","어제 실수했어도 오늘 아침은 새로 주어집니다. 하느님은 어제의 나를 기준으로 오늘의 나를 대하지 않으십니다. 아침에 눈을 뜨면 ‘오늘도 새로운 자비가 주어졌다’고 짧게 감사해 보세요.","오늘 아침 새로 주어진 자비에 감사하며 다시 시작하겠습니다."],
["예레 29,11","정녕 나는 너희를 위하여 내가 세운 계획들을 잘 알고 있다. 주님의 말씀이다. 그것은 재앙이 아니라 평화의 계획이며, 너희에게 미래와 희망을 주려는 것이다.","유배지에서 언제 돌아갈지 모르는 백성에게 예레미야가 전한 편지의 한 구절입니다. 당장 상황이 바뀌지 않아도 하느님의 계획은 평화와 희망을 향해 있다는 약속입니다.","취업, 건강, 관계 등 앞날이 보이지 않을 때 우리는 최악을 상상합니다. 하지만 나를 지으신 분의 계획은 ‘재앙’이 아니라 ‘미래와 희망’입니다. 불안한 마음이 들 때마다 이 구절을 떠올려 보세요.","내 삶을 향한 하느님의 계획이 평화임을 믿고 오늘을 성실히 살겠습니다."],
["마태 2,10","그들은 그 별을 보고 더없이 기뻐하였다.","동방의 박사들이 먼 길 끝에 아기 예수님이 계신 곳을 가리키는 별을 다시 보았을 때의 기쁨입니다. 그들은 먼 곳에서 별 하나를 믿고 길을 떠났고, 결국 구세주를 만났습니다.","우리 삶에도 하느님께로 이끄는 ‘별’이 있습니다. 좋은 사람, 말씀 한 구절, 마음을 움직이는 순간이 그렇습니다. 그 별을 놓치지 않으려면 가끔 고개를 들어 하늘을 볼 여유가 필요합니다.","오늘 나를 주님께 이끄는 작은 별을 발견하고 기뻐하겠습니다."],
["잠언 3,5-6","마음을 다하여 주님을 신뢰하고 너의 예지에는 의지하지 마라. 어떠한 길을 걷든 그분을 알아 모셔라. 그분께서 네 앞길을 올바르게 해 주시리라.","지혜 문학의 대표적인 가르침입니다. 내 판단과 계산만으로는 삶의 모든 길을 알 수 없으니, 모든 길에서 하느님을 인정하고 그분께 맡기라는 권고입니다.","정보가 넘치는 시대에 우리는 모든 것을 스스로 통제하려 합니다. 그러나 열심히 계획해도 뜻대로 되지 않는 일이 많습니다. 최선을 다한 뒤에는 ‘주님, 이제 맡깁니다’ 하고 내려놓는 연습이 필요합니다.","내 생각보다 크신 주님을 신뢰하며 오늘의 길을 걷겠습니다."],
["시편 37,5","네 길을 주님께 맡기고 그분을 신뢰하여라. 그분께서 몸소 해 주시리라.","악인이 잘되는 것처럼 보여 마음이 흔들리는 이에게 주는 시편입니다. 조급해하지 말고 내 길을 주님께 ‘굴려 맡기라’는 뜻이 담겨 있습니다.","남들과 비교하며 초조해질 때가 많습니다. 하지만 내 길은 나만의 속도로 펼쳐집니다. 걱정되는 일 하나를 적어 두고 ‘주님께 맡깁니다’라고 기도한 뒤, 내가 할 수 있는 일에만 집중해 보세요.","조급함을 내려놓고 내 길을 주님께 맡기겠습니다."],
["필리 3,13-14","뒤에 있는 것은 잊어버리고 앞에 있는 것을 향하여 내달리면서, 하느님께서 그리스도 예수님을 통하여 위로 부르시어 주시는 상을 얻으려고, 그 목표를 향하여 달려가고 있습니다.","바오로 사도는 자신이 아직 완전하지 않다고 인정하면서도, 지난 일에 붙잡히지 않고 앞을 향해 달린다고 말합니다. 신앙은 완성된 상태가 아니라 계속 달려가는 여정입니다.","과거의 영광에 머물러도, 과거의 실수에 매여도 앞으로 나아갈 수 없습니다. 오늘 해야 할 한 걸음에 집중하세요. 지난 일을 곱씹는 시간을 줄이고 그 시간에 한 가지 좋은 일을 시작해 보세요.","지난 일에 머물지 않고 오늘의 한 걸음을 내딛겠습니다."],
["마르 1,15","때가 차서 하느님의 나라가 가까이 왔다. 회개하고 복음을 믿어라.","예수님께서 공생활을 시작하며 처음 하신 선포입니다. ‘회개’는 단순한 반성이 아니라 삶의 방향을 하느님께로 돌리는 것입니다. 하느님 나라는 먼 미래가 아니라 지금 가까이 와 있습니다.","하느님 나라는 내가 사랑을 선택하는 바로 그 자리에서 시작됩니다. 오늘 하루 중 방향을 바꿔야 할 작은 습관이 있다면 무엇일까요? 짜증 대신 인내를, 무관심 대신 관심을 선택해 보세요.","내 삶의 방향을 주님께로 돌리며, 오늘 가까이 와 있는 하느님 나라를 살겠습니다."],
["여호 1,9","힘과 용기를 내어라. 무서워하지도 말고 놀라지도 마라. 네가 어디를 가든지 주 너의 하느님이 너와 함께 있어 주겠다.","모세가 세상을 떠난 뒤 백성을 이끌게 된 여호수아에게 하느님께서 하신 말씀입니다. 큰 책임 앞에서 두려워하는 그에게 용기의 근거는 자신의 능력이 아니라 ‘함께 계시는 하느님’이었습니다.","새 직장, 새 학교, 새 역할 앞에서 누구나 떨립니다. 용기는 두려움이 없는 상태가 아니라 두려움 속에서도 한 걸음 내딛는 것입니다. 어디를 가든 혼자가 아니라는 사실을 기억하세요.","주님께서 함께 계시니 두려움 속에서도 용기를 내겠습니다."],
["마태 3,17","이는 내가 사랑하는 아들, 내 마음에 드는 아들이다.","예수님께서 요르단 강에서 세례를 받으실 때 하늘에서 들려온 아버지의 음성입니다. 예수님은 아직 아무 업적도 이루기 전에 ‘사랑받는 아들’이라는 선언을 들으셨습니다.","우리는 무언가를 이루어야 사랑받을 자격이 있다고 생각합니다. 그러나 세례를 받은 우리 역시 하느님께 ‘사랑하는 자녀’입니다. 성과로 나를 증명하려 지칠 때, 존재 자체로 사랑받고 있음을 기억하세요.","나는 하느님께서 사랑하시는 자녀임을 잊지 않겠습니다."],
["이사 40,31","주님께 바라는 이들은 새 힘을 얻고 독수리처럼 날개 치며 올라간다. 그들은 뛰어도 지칠 줄 모르고 걸어도 피곤한 줄 모른다.","젊은이도 지치고 넘어진다고 말한 뒤 이어지는 약속입니다. 사람의 힘은 바닥나지만, 하느님께 희망을 두는 이는 위로부터 새 힘을 받는다고 합니다.","번아웃과 피로가 일상이 된 시대입니다. 나를 충전하는 방법이 휴식과 취미만은 아닙니다. 잠시 멈추어 하느님께 마음을 여는 기도가 깊은 회복을 가져다줍니다. 오늘 5분만이라도 조용히 머물러 보세요.","지칠 때마다 주님께 바라며 새 힘을 얻겠습니다."],
["시편 119,105","당신 말씀은 제 발을 비추는 등불, 저의 길을 밝히는 빛입니다.","성경에서 가장 긴 시편은 하느님 말씀을 사랑하는 노래입니다. 말씀은 먼 미래 전체를 한꺼번에 밝히는 탐조등이 아니라, 지금 내딛는 한 걸음을 비추는 등불이라고 고백합니다.","앞날이 다 보이지 않아 불안할 때가 많습니다. 하지만 등불은 한 걸음씩만 비춰도 끝까지 걸어갈 수 있게 해 줍니다. 매일 말씀 한 구절을 마음에 품고, 그 말씀대로 오늘 한 가지를 실천해 보세요.","오늘 받은 말씀을 등불 삼아 한 걸음씩 걷겠습니다."],
["요한 1,5","그 빛이 어둠 속에서 비치고 있지만 어둠은 그를 깨닫지 못하였다.","요한 복음은 예수님을 세상에 온 참 빛으로 소개합니다. 어둠은 빛을 이기지 못합니다. 어둠이 아무리 깊어도 작은 빛 하나를 끄지 못합니다.","뉴스를 보면 세상이 어둡게만 느껴집니다. 하지만 어둠을 탓하기보다 작은 촛불 하나를 켜는 사람이 세상을 바꿉니다. 오늘 누군가에게 따뜻한 말 한마디로 빛이 되어 주세요.","어둠을 탓하기보다 작은 빛을 밝히는 사람이 되겠습니다."],
["마태 6,34","그러므로 내일을 걱정하지 마라. 내일 걱정은 내일이 할 것이다. 그날 고생은 그날로 충분하다.","산상 설교에서 예수님은 먹을 것과 입을 것을 걱정하는 이들에게 하느님 아버지의 돌보심을 믿으라고 하십니다. 걱정은 내일을 바꾸지 못하고 오늘의 힘만 빼앗아 갑니다.","우리는 일어나지도 않은 일을 미리 걱정하며 잠을 설칩니다. 오늘 할 수 있는 일은 하고, 할 수 없는 일은 하느님께 맡기는 지혜가 필요합니다. 잠들기 전 걱정거리를 하나씩 봉헌해 보세요.","내일은 주님께 맡기고 오늘 하루에 충실하겠습니다."],
["히브 11,1","믿음은 우리가 바라는 것들의 보증이며 보이지 않는 실체들의 확증입니다.","히브리서는 믿음을 이렇게 정의한 뒤 아브라함과 모세 등 믿음의 선조들을 소개합니다. 믿음은 막연한 기대가 아니라 아직 보이지 않는 것을 이미 손에 쥔 듯 확신하는 힘입니다.","눈에 보이는 결과만 믿는 시대에 신앙은 용기가 필요합니다. 기도의 응답이 늦어도, 선행의 열매가 보이지 않아도 하느님은 일하고 계십니다. 보이지 않는 씨앗을 믿고 오늘도 심어 보세요.","보이지 않아도 일하시는 주님을 믿으며 오늘을 살겠습니다."],
["요한 17,21","모두 하나가 되게 하소서. 아버지, 아버지께서 제 안에 계시고 제가 아버지 안에 있듯이, 저들도 우리 안에 있게 하소서.","최후의 만찬 때 예수님께서 제자들과 앞으로 믿게 될 모든 이를 위해 바치신 기도입니다. 교회는 이 무렵 그리스도인 일치 기도 주간을 지내며 이 기도를 함께 바칩니다.","생각이 다르다는 이유로 쉽게 편을 가르는 세상입니다. 일치는 모두가 똑같아지는 것이 아니라 서로 다름 안에서 사랑으로 연결되는 것입니다. 오늘 나와 다른 의견을 가진 사람의 말을 끝까지 들어 보세요.","다름을 넘어 하나 되게 하시는 주님의 기도에 마음을 모으겠습니다."],
["에페 4,2-3","겸손과 온유를 다하고 인내심을 가지고 사랑으로 서로 참아 주며, 성령께서 평화의 끈으로 이루어 주신 일치를 보존하도록 애쓰십시오.","바오로 사도가 공동체에게 당부하는 말입니다. 일치는 저절로 유지되지 않고, 겸손·온유·인내라는 구체적인 노력으로 지켜진다고 말합니다.","가정이나 직장에서 갈등은 피할 수 없습니다. 중요한 것은 갈등이 생겼을 때 ‘참아 주는’ 사랑입니다. 오늘 거슬리는 일이 있어도 한 번 더 참고 부드럽게 말해 보세요.","겸손과 온유로 내 곁의 평화를 지키겠습니다."],
["마태 7,7","청하여라, 너희에게 주실 것이다. 찾아라, 너희가 얻을 것이다. 문을 두드려라, 너희에게 열릴 것이다.","예수님은 기도를 포기하지 말라고 가르치십니다. 청하고, 찾고, 두드리는 세 동사는 점점 더 적극적인 행동을 뜻하며, 하느님은 좋은 것을 주시는 아버지라는 믿음이 바탕에 있습니다.","몇 번 기도하고 응답이 없으면 쉽게 포기하곤 합니다. 하느님은 내가 원하는 방식이 아닐지라도 나에게 가장 좋은 것을 주십니다. 오랫동안 미뤄 둔 간절한 기도를 다시 시작해 보세요.","포기하지 않고 청하고 찾고 두드리겠습니다."],
["1사무 16,7","사람들은 눈에 들어오는 대로 보지만 주님은 마음을 본다.","사무엘이 이스라엘의 새 임금을 찾을 때, 키 크고 잘생긴 이들이 아니라 막내 다윗이 선택되었습니다. 하느님의 기준은 외모나 조건이 아니라 마음입니다.","SNS 속 화려한 모습으로 서로를 평가하는 시대입니다. 하느님은 나의 스펙이 아니라 중심을 보십니다. 오늘 다른 사람을 겉모습으로 판단하려는 순간, 그 사람의 마음을 보려고 노력해 보세요.","겉모습이 아니라 마음을 보시는 주님처럼 사람을 바라보겠습니다."],
["시편 46,11","너희는 멈추고 내가 하느님임을 알아라.","전쟁과 혼란 속에서 하느님께서 직접 하시는 말씀입니다. ‘멈추다’는 손을 내려놓고 싸움을 그친다는 뜻입니다. 내가 모든 것을 해결하려는 손을 내려놓을 때 하느님을 알게 됩니다.","바쁘게 움직이지 않으면 불안한 시대입니다. 하지만 멈춤 속에서야 들리는 목소리가 있습니다. 오늘 휴대전화를 내려놓고 잠시 아무것도 하지 않는 시간을 가져 보세요.","잠시 멈추어 나의 하느님을 바라보겠습니다."],
["요한 2,5","그분께서 너희에게 무엇이든 시키는 대로 하여라.","카나의 혼인 잔치에서 포도주가 떨어지자 성모 마리아가 일꾼들에게 하신 말씀입니다. 성모님의 이 짧은 말씀은 모든 신앙인에게 주는 가장 확실한 길잡이입니다.","해결책이 보이지 않는 문제 앞에서 성모님은 예수님께 맡기고, 우리에게는 순종하라고 하십니다. 내 방식을 고집하기보다 복음이 말하는 대로 해 보는 것, 그것이 기적의 시작입니다.","성모님의 말씀대로, 주님께서 이르시는 것은 무엇이든 하겠습니다."],
["이사 41,10","두려워하지 마라, 내가 너와 함께 있다. 겁내지 마라, 내가 너의 하느님이다. 내가 너를 굳세게 하고 도와주리라. 내 의로운 오른손으로 너를 붙들어 주리라.","하느님께서 약해진 백성에게 거듭 ‘두려워하지 마라’고 말씀하십니다. 함께 있고, 굳세게 하고, 돕고, 붙들어 주겠다는 네 겹의 약속이 담겨 있습니다.","걱정과 두려움은 우리를 혼자라고 느끼게 만듭니다. 하지만 하느님의 오른손이 나를 붙들고 계십니다. 두려운 일이 생기면 이 구절을 소리 내어 읽어 보세요. 말씀이 마음을 붙들어 줍니다.","주님의 오른손이 나를 붙드심을 믿고 두려움을 이기겠습니다."],
["갈라 2,20","이제는 내가 사는 것이 아니라 그리스도께서 내 안에 사시는 것입니다.","사울이 다마스쿠스 길에서 회심하여 바오로가 된 것을 기념하는 날입니다. 그는 회심 후 자기 삶의 주인이 더 이상 자신이 아니라 그리스도라고 고백했습니다.","‘내가 사는 것’과 ‘그리스도께서 내 안에 사시는 것’은 어떻게 다를까요? 내 욕심이 아니라 예수님의 마음으로 선택하는 것입니다. 오늘 결정의 순간마다 ‘예수님이라면 어떻게 하셨을까?’ 물어보세요.","내 안에 사시는 그리스도의 마음으로 오늘을 살겠습니다."],
["2티모 1,7","하느님께서는 우리에게 비겁함의 영이 아니라 힘과 사랑과 절제의 영을 주셨습니다.","바오로 사도가 젊은 제자 티모테오를 격려하는 말입니다. 하느님께서 주신 영은 우리를 움츠러들게 하는 영이 아니라 힘, 사랑, 그리고 스스로를 다스리는 절제의 영입니다.","옳은 일 앞에서 망설이거나 불의를 보고도 침묵할 때가 있습니다. 내 안에는 이미 용기의 영이 있습니다. 오늘 해야 할 말을 사랑을 담아 절제 있게 해 보세요.","힘과 사랑과 절제의 영에 기대어 용기 있게 살겠습니다."],
["코헬 3,1","모든 것에는 시기가 있고 하늘 아래 모든 일에는 때가 있다.","코헬렛은 태어날 때와 죽을 때, 울 때와 웃을 때가 있다고 노래합니다. 삶의 모든 순간에는 하느님께서 정하신 때가 있으며, 우리는 그 흐름을 겸손히 받아들여야 합니다.","모든 것이 빨리 이루어지기를 바라는 시대입니다. 하지만 꽃이 피는 데에도 때가 있듯 우리 삶에도 기다림의 시간이 필요합니다. 지금이 씨 뿌리는 때인지, 거두는 때인지 헤아려 보세요.","조급해하지 않고 하느님의 때를 기다리겠습니다."],
["지혜 7,7","그래서 내가 기도하자 예지가 주어지고 간청하자 지혜의 영이 나에게 왔다.","솔로몬의 입을 빌려 지혜를 찬미하는 구절입니다. 지혜는 스스로 쌓는 지식이 아니라 기도로 청하여 받는 선물입니다. 오늘은 위대한 신학자 성 토마스 아퀴나스를 기념하는 날입니다.","정보는 넘쳐나지만 지혜는 귀한 시대입니다. 중요한 결정을 앞두고 검색만 하기보다 먼저 기도해 보세요. 성 토마스 아퀴나스도 공부하기 전에 늘 기도했다고 합니다.","결정의 순간마다 먼저 지혜를 청하겠습니다."],
["마태 5,14","너희는 세상의 빛이다. 산 위에 자리 잡은 고을은 감추어질 수 없다.","예수님은 제자들에게 ‘빛이 되어라’가 아니라 ‘너희는 빛이다’라고 말씀하십니다. 그리스도인은 이미 빛으로 부름받았으며, 그 빛은 숨길 수 없습니다.","신앙을 드러내는 것이 부담스러울 때가 있습니다. 하지만 빛은 말이 아니라 삶으로 드러납니다. 정직함, 친절함, 성실함이 가장 밝은 빛입니다. 오늘 내 자리에서 조용히 빛나 보세요.","나는 세상의 빛이라는 부르심에 맞게 살겠습니다."],
["마태 5,13","너희는 세상의 소금이다. 소금이 제맛을 잃으면 무엇으로 짜게 하겠느냐?","소금은 음식의 맛을 내고 부패를 막습니다. 예수님은 제자들이 세상에 맛을 더하고 썩지 않게 지키는 존재가 되기를 바라십니다.","소금은 음식에 녹아 보이지 않지만 맛을 결정합니다. 우리도 드러나지 않게 공동체를 건강하게 만들 수 있습니다. 험담이 오갈 때 화제를 바꾸고, 지친 동료에게 격려를 건네 보세요.","드러나지 않아도 세상에 맛을 더하는 소금이 되겠습니다."],
["마르 10,14","어린이들이 나에게 오는 것을 막지 말고 그냥 놔두어라. 사실 하느님의 나라는 이런 어린이와 같은 사람들의 것이다.","제자들이 아이들을 막자 예수님은 화를 내시며 아이들을 안고 축복하셨습니다. 오늘은 청소년의 아버지 성 요한 보스코를 기념하는 날입니다.","어린이는 자신을 증명하지 않고 그저 사랑을 받아들입니다. 하느님 앞에서 우리도 그렇게 단순해질 필요가 있습니다. 또한 우리 곁의 아이들과 청소년에게 따뜻한 관심을 보여 주세요.","어린이처럼 단순한 마음으로 주님께 다가가겠습니다."]
];

D[2]=[
["1코린 13,4-5","사랑은 참고 기다립니다. 사랑은 친절합니다. 사랑은 시기하지 않고 뽐내지 않으며 교만하지 않습니다. 사랑은 무례하지 않고 자기 이익을 추구하지 않으며 성을 내지 않고 앙심을 품지 않습니다.","‘사랑의 찬가’로 불리는 이 구절은 사랑을 감정이 아니라 구체적인 태도로 설명합니다. 참고, 친절하고, 시기하지 않는 것. 사랑은 느끼는 것이 아니라 행하는 것입니다.","이 구절의 ‘사랑’ 자리에 내 이름을 넣어 읽어 보세요. ‘○○는 참고 기다립니다’가 어색하게 느껴진다면 그 부분이 오늘 내가 연습할 사랑입니다. 가까운 사람일수록 무례해지기 쉽다는 것도 기억하세요.","오늘 한 사람에게 참고 기다리는 사랑을 실천하겠습니다."],
["루카 2,30-32","제 눈이 당신의 구원을 보았습니다. 이는 당신께서 모든 민족들 앞에서 마련하신 것으로 다른 민족들에게는 계시의 빛이며 당신 백성 이스라엘에게는 영광입니다.","주님 봉헌 축일에 성전에서 아기 예수님을 안은 노인 시메온의 찬미가입니다. 평생 메시아를 기다려 온 그는 마침내 구원을 눈으로 보고 평화롭게 떠날 수 있다고 고백합니다.","시메온의 기다림은 헛되지 않았습니다. 우리도 오래 기다리는 일이 있다면 시메온처럼 희망을 놓지 말아야 합니다. 오늘 하루를 마무리하며 ‘오늘 내가 본 하느님의 손길’ 하나를 떠올려 보세요.","오래 기다리는 일 속에서도 주님의 구원을 바라보겠습니다."],
["1요한 4,18","사랑에는 두려움이 없습니다. 완전한 사랑은 두려움을 쫓아냅니다.","요한 사도는 하느님을 벌주는 분으로만 생각하면 두려움에 갇히게 된다고 말합니다. 하느님의 사랑을 깊이 체험할수록 두려움은 설 자리를 잃습니다.","거절당할까, 실패할까 두려워 사랑을 표현하지 못할 때가 있습니다. 하느님께 이미 온전히 사랑받고 있다는 확신이 있으면 다른 사람에게도 용기 있게 사랑을 건넬 수 있습니다.","하느님의 사랑으로 두려움을 내보내고 먼저 사랑하겠습니다."],
["요한 15,12","내가 너희를 사랑한 것처럼 너희도 서로 사랑하여라. 이것이 나의 계명이다.","예수님께서 남기신 새 계명입니다. 사랑의 기준은 ‘내가 할 수 있는 만큼’이 아니라 ‘예수님께서 사랑하신 것처럼’입니다. 발을 씻어 주고 목숨까지 내어 주신 사랑입니다.","사랑의 기준이 너무 높다고 느껴질 수 있습니다. 하지만 예수님은 먼저 우리를 그렇게 사랑하셨기에 우리도 할 수 있습니다. 오늘 섬김받기보다 섬기는 쪽을 선택해 보세요.","주님께서 나를 사랑하신 것처럼 오늘 이웃을 사랑하겠습니다."],
["1코린 13,7","사랑은 모든 것을 덮어 주고 모든 것을 믿으며 모든 것을 바라고 모든 것을 견디어 냅니다.","사랑의 찬가가 절정에 이르는 구절입니다. 네 번 반복되는 ‘모든 것’은 사랑이 조건과 한계를 두지 않는다는 뜻입니다.","상대의 허물을 들추기보다 덮어 주고, 의심하기보다 믿어 주는 것은 쉽지 않습니다. 하지만 그렇게 해 줄 때 사람은 변합니다. 오늘 가족의 작은 실수를 말없이 덮어 주세요.","오늘 누군가의 허물을 덮어 주고 끝까지 믿어 주겠습니다."],
["1요한 4,16","하느님은 사랑이십니다. 사랑 안에 머무르는 사람은 하느님 안에 머무르고 하느님께서도 그 사람 안에 머무르십니다.","성경 전체에서 하느님을 가장 간결하게 정의한 구절입니다. 하느님은 사랑을 ‘하시는’ 분일 뿐 아니라 사랑 그 자체이십니다.","하느님을 만나는 길은 멀리 있지 않습니다. 누군가를 진심으로 사랑하는 바로 그 순간, 우리는 하느님 안에 머뭅니다. 오늘 내가 하는 작은 친절이 하느님을 모시는 일입니다.","사랑 안에 머물며 하느님 안에 머무르겠습니다."],
["로마 12,10","형제애로 서로 깊이 아끼고, 서로 존경하는 일에 먼저 나서십시오.","바오로 사도는 그리스도인의 삶을 구체적으로 가르치며 서로를 존경하는 일에 ‘앞장서라’고 말합니다. 경쟁해야 할 것은 성공이 아니라 존경입니다.","인정받고 싶은 마음은 누구에게나 있습니다. 그 마음을 뒤집어 내가 먼저 다른 사람을 인정해 주면 관계가 달라집니다. 오늘 누군가의 장점을 구체적으로 칭찬해 보세요.","오늘 내가 먼저 다른 사람을 존중하고 칭찬하겠습니다."],
["콜로 3,14","이 모든 것 위에 사랑을 입으십시오. 사랑은 완전하게 묶어 주는 끈입니다.","바오로 사도는 동정, 친절, 겸손, 온유, 인내를 옷처럼 입으라고 한 뒤, 그 모든 것 위에 사랑을 입으라고 합니다. 사랑은 모든 덕을 하나로 묶어 주는 띠입니다.","아침에 옷을 고르듯 하루를 시작하며 사랑을 입어 보세요. 아무리 능력이 뛰어나도 사랑이 없으면 관계는 흩어집니다. 오늘 만나는 사람들을 사랑의 끈으로 이어 주세요.","오늘 아침, 무엇보다 먼저 사랑을 옷 입듯 입겠습니다."],
["마태 22,37-39","‘네 마음을 다하고 네 목숨을 다하고 네 정신을 다하여 주 너의 하느님을 사랑하여라.’ 이것이 가장 크고 첫째가는 계명이다. 둘째도 이와 같다. ‘네 이웃을 너 자신처럼 사랑하여라.’","율법 교사가 가장 큰 계명을 묻자 예수님은 하느님 사랑과 이웃 사랑을 하나로 묶어 대답하셨습니다. 모든 율법과 예언서가 이 두 계명에 달려 있습니다.","신앙은 복잡한 규칙이 아니라 사랑으로 요약됩니다. ‘너 자신처럼’이라는 말도 눈여겨보세요. 나를 소중히 여기는 사람이 이웃도 소중히 여길 수 있습니다.","하느님과 이웃, 그리고 나 자신을 사랑하는 하루를 살겠습니다."],
["룻 1,16","어머님 가시는 곳으로 저도 가고 어머님 머무시는 곳에 저도 머물렵니다. 어머님의 겨레가 저의 겨레요 어머님의 하느님이 저의 하느님이십니다.","남편을 잃은 모압 여인 룻이 홀로 된 시어머니 나오미를 떠나지 않겠다고 다짐하는 말입니다. 룻의 신의는 훗날 다윗과 예수님의 족보로 이어지는 축복이 되었습니다.","어려울 때 곁에 남아 주는 것이 진짜 사랑입니다. 힘든 시기를 보내는 가족이나 친구가 있다면 거창한 도움보다 ‘곁에 있어 주는 것’만으로도 큰 위로가 됩니다.","힘든 이의 곁을 떠나지 않는 신의 있는 사람이 되겠습니다."],
["마태 11,28","고생하며 무거운 짐을 진 너희는 모두 나에게 오너라. 내가 너희에게 안식을 주겠다.","오늘은 루르드의 성모 기념일이자 세계 병자의 날입니다. 예수님은 몸과 마음이 지친 모든 이를 조건 없이 초대하십니다.","아프거나 지쳤을 때 우리는 혼자 견디려 합니다. 예수님은 짐을 내려놓고 당신께 오라고 하십니다. 오늘 아픈 이들을 위해 기도하고, 가능하다면 안부 연락을 해 보세요.","무거운 짐을 주님께 내려놓고, 아픈 이들을 위해 기도하겠습니다."],
["아가 8,7","큰 물도 사랑을 끌 수 없고 강물도 휩쓸어 가지 못한답니다.","아가는 연인의 사랑을 노래하며 하느님과 인간의 사랑을 비추는 책입니다. 참된 사랑은 어떤 시련으로도 꺼지지 않는 불길과 같다고 고백합니다.","관계에도 큰 물과 강물 같은 위기가 찾아옵니다. 그러나 서로를 선택하는 사랑은 위기를 지나며 더 깊어집니다. 오래 함께한 사람에게 고마움을 전해 보세요.","어떤 시련에도 꺼지지 않는 사랑을 지켜 가겠습니다."],
["1베드 4,8","무엇보다도 먼저 서로 한결같이 사랑하십시오. 사랑은 많은 죄를 덮어 줍니다.","베드로 사도는 마지막 때를 사는 신자들에게 ‘무엇보다도’ 사랑하라고 당부합니다. 한결같은 사랑은 서로의 많은 잘못을 덮어 공동체를 지켜 줍니다.","완벽한 사람은 없기에 함께 살면 서로의 부족함이 보입니다. 그 부족함을 지적하는 대신 사랑으로 덮어 줄 때 관계는 숨을 쉽니다. 오늘 비판하고 싶은 마음이 들면 한 번 덮어 주세요.","무엇보다 먼저, 한결같이 사랑하겠습니다."],
["1코린 16,14","여러분이 하는 모든 일이 사랑으로 이루어지게 하십시오.","바오로 사도가 코린토 교회에 보낸 첫째 편지를 마무리하며 남긴 짧은 당부입니다. 아무리 큰일도 사랑 없이 하면 의미가 없고, 작은 일도 사랑으로 하면 거룩해집니다.","설거지, 보고서 작성, 아이 숙제 봐주기… 일상의 모든 일을 사랑으로 할 수 있습니다. 같은 일도 누군가를 위한 사랑이라고 생각하면 마음가짐이 달라집니다.","오늘 하는 모든 일을 사랑으로 하겠습니다."],
["집회 6,14","성실한 친구는 든든한 피난처요 그런 친구를 얻으면 보화를 얻은 셈이다.","집회서는 우정에 대해 깊이 있는 가르침을 줍니다. 좋을 때만 함께하는 친구가 아니라 어려울 때 곁을 지키는 성실한 친구가 참된 보화라고 말합니다.","나에게 그런 친구가 있는지, 나는 누군가에게 그런 친구인지 돌아보세요. 오랫동안 연락하지 못한 소중한 친구에게 오늘 안부를 전해 보세요.","나도 누군가에게 든든한 피난처 같은 친구가 되겠습니다."],
["잠언 17,17","친구는 언제나 사랑해 주고 형제는 어려울 때 도우려고 태어난다.","참된 친구와 형제의 의미를 담은 잠언입니다. 친구의 사랑은 상황에 따라 변하지 않고, 형제는 어려움 속에서 그 존재 이유가 드러납니다.","형편이 좋을 때는 주변에 사람이 많지만 어려울 때 진짜 관계가 드러납니다. 지금 어려움을 겪는 형제자매나 친구가 있다면 먼저 손을 내밀어 보세요.","어려울 때 먼저 손 내미는 형제가 되겠습니다."],
["요한 15,13","친구들을 위하여 목숨을 내놓는 것보다 더 큰 사랑은 없다.","예수님은 이 말씀을 하신 뒤 실제로 십자가에서 우리를 위해 목숨을 내어 주셨습니다. 그리고 우리를 ‘종’이 아니라 ‘친구’라고 부르셨습니다.","목숨을 내놓는 사랑은 날마다 조금씩 나를 내어 주는 데서 시작됩니다. 내 시간과 편안함을 조금 내어 누군가를 도울 때 우리는 예수님의 사랑을 닮아 갑니다.","오늘 내 시간과 마음을 조금 더 내어 주겠습니다."],
["루카 6,31","남이 너희에게 해 주기를 바라는 그대로 너희도 남에게 해 주어라.","‘황금률’이라 불리는 예수님의 가르침입니다. 남이 나에게 하지 않기를 바라는 것을 피하는 데 그치지 않고, 바라는 것을 먼저 해 주라는 적극적인 사랑입니다.","인사받고 싶으면 먼저 인사하고, 이해받고 싶으면 먼저 이해해 주세요. 관계의 변화는 상대가 아니라 내가 먼저 움직일 때 시작됩니다.","내가 받고 싶은 대접을 오늘 먼저 건네겠습니다."],
["로마 13,10","사랑은 이웃에게 악을 저지르지 않습니다. 그러므로 사랑은 율법의 완성입니다.","바오로 사도는 모든 계명이 결국 ‘이웃을 네 몸처럼 사랑하라’는 한 말씀으로 요약된다고 말합니다. 사랑하는 사람은 계명을 의무가 아니라 기쁨으로 지킵니다.","규칙을 지키는 것도 중요하지만 그 바탕에 사랑이 있는지 돌아보아야 합니다. 법적으로 문제없는 행동도 누군가에게 상처가 될 수 있습니다. 오늘 내 말과 행동이 누군가를 아프게 하지 않는지 살펴보세요.","내 말과 행동이 이웃에게 해가 되지 않도록 사랑으로 살피겠습니다."],
["1요한 3,18","자녀 여러분, 말과 혀로 사랑하지 말고 행동으로 진리 안에서 사랑합시다.","요한 사도는 말로만 하는 사랑을 경계합니다. 참된 사랑은 구체적인 행동과 진실함으로 드러납니다.","‘언제 밥 한번 먹자’는 말만 하고 지키지 못한 약속이 있지 않나요? 오늘은 말 대신 행동으로 사랑을 표현해 보세요. 작은 선물, 직접 만나기, 도움 주기 모두 좋습니다.","말보다 행동으로 사랑을 보여 주겠습니다."],
["루카 6,36","너희 아버지께서 자비하시듯 너희도 자비로운 사람이 되어라.","예수님은 원수까지 사랑하라고 가르치신 뒤 그 이유를 하느님 아버지의 자비에서 찾으십니다. 우리가 자비로워야 하는 것은 먼저 자비를 받았기 때문입니다.","자비는 상대가 그럴 자격이 있어서가 아니라 내가 하느님의 자비를 받은 사람이기에 베푸는 것입니다. 오늘 나를 서운하게 한 사람에게 한 번 더 너그러워져 보세요.","받은 자비를 기억하며 오늘 더 너그러운 사람이 되겠습니다."],
["마태 16,18","너는 베드로이다. 내가 이 반석 위에 내 교회를 세울 터인즉, 저승의 세력도 그것을 이기지 못할 것이다.","오늘은 성 베드로 사도좌 축일입니다. 예수님은 연약하고 실수도 많았던 베드로를 교회의 반석으로 세우셨습니다.","하느님은 완벽한 사람이 아니라 기꺼이 응답하는 사람을 쓰십니다. 부족함을 이유로 물러서지 마세요. 또한 오늘 교황님과 교회를 위해 기도해 보세요.","부족해도 주님께서 세우시는 반석이 되도록 응답하겠습니다."],
["에페 4,32","서로 너그럽고 자비롭게 대하고, 하느님께서 그리스도 안에서 여러분을 용서하신 것처럼 여러분도 서로 용서하십시오.","바오로 사도는 분노와 험담을 버리라고 한 뒤 이 말씀을 덧붙입니다. 용서의 근거는 상대의 자격이 아니라 내가 이미 받은 하느님의 용서입니다.","용서하기 힘든 사람이 떠오를 수 있습니다. 용서는 잘못을 없던 일로 하는 것이 아니라 그 일이 더 이상 나를 지배하지 못하게 놓아주는 것입니다. 오늘 그 사람을 위해 짧게 기도해 보세요.","하느님께 용서받은 사람으로서 용서의 첫걸음을 내딛겠습니다."],
["마태 18,21-22","‘주님, 제 형제가 저에게 죄를 지으면 몇 번이나 용서해 주어야 합니까? 일곱 번까지 해야 합니까?’ 예수님께서 그에게 대답하셨다. ‘일곱 번이 아니라 일흔일곱 번까지라도 용서해야 한다.’","베드로는 일곱 번이면 충분히 너그럽다고 생각했지만 예수님은 끝없이 용서하라고 하십니다. 용서는 횟수를 세는 계산이 아니라 사랑의 태도입니다.","같은 문제로 반복해서 상처를 주는 사람이 있을 수 있습니다. 용서가 무조건 참는 것만을 뜻하지는 않지만, 마음에 미움을 쌓아 두지 않는 것은 나를 위한 선택이기도 합니다.","용서를 셈하지 않는 넓은 마음을 청하겠습니다."],
["야고 1,19","누구나 듣기는 빨리 하고 말하기는 더디 하며 분노하기도 더디 해야 합니다.","야고보 사도의 실천적인 지혜입니다. 듣기, 말하기, 분노하기의 순서와 속도를 바꾸면 많은 갈등을 피할 수 있다고 가르칩니다.","대화할 때 상대의 말이 끝나기도 전에 대답을 준비하고 있지 않나요? 오늘은 끝까지 듣고, 한 박자 쉬고 말해 보세요. 화가 날 때는 숨을 세 번 쉬어 보세요.","오늘 더 많이 듣고, 천천히 말하고, 더디 화내겠습니다."],
["잠언 15,1","부드러운 대답은 분노를 가라앉히고 불쾌한 말은 화를 돋운다.","말 한마디가 상황을 바꾼다는 잠언의 지혜입니다. 같은 내용도 어떤 말투로 하느냐에 따라 평화가 되기도 하고 다툼이 되기도 합니다.","날 선 말이 오갈 때 부드럽게 대답하기란 쉽지 않습니다. 하지만 누군가 먼저 목소리를 낮추면 분위기가 달라집니다. 오늘 그 ‘누군가’가 되어 보세요.","날카로운 말 앞에서도 부드럽게 대답하겠습니다."],
["에페 4,26","화가 나더라도 죄는 짓지 마십시오. 해가 질 때까지 노여움을 품고 있지 마십시오.","성경은 화를 내는 감정 자체를 죄라고 하지 않습니다. 다만 분노가 죄로 이어지지 않도록, 그리고 그날 안에 풀도록 권고합니다.","분노를 묵혀 두면 원망이 되고 관계에 독이 됩니다. 오늘 마음에 걸린 일이 있다면 잠들기 전에 대화로 풀거나 기도로 내려놓으세요.","오늘의 노여움은 오늘 안에 내려놓겠습니다."],
["호세 11,4","나는 인정의 끈으로, 사랑의 줄로 그들을 이끌었다.","하느님께서 이스라엘을 어린아이처럼 걸음마를 가르치며 키우셨다고 회상하시는 대목입니다. 하느님은 억지로 끌고 가지 않고 사랑의 끈으로 이끄십니다.","부모나 리더로서 사람을 이끌 때 강요보다 사랑이 더 멀리 갑니다. 하느님께서 나를 이끄신 방식처럼 내 곁의 사람을 부드럽게 이끌어 보세요.","강요가 아닌 사랑의 끈으로 사람을 이끌겠습니다."],
["1요한 4,19","우리가 사랑하는 것은 그분께서 먼저 우리를 사랑하셨기 때문입니다.","사랑의 출발점은 우리가 아니라 하느님이십니다. 우리는 받은 사랑을 흘려보내는 통로입니다.","사랑할 힘이 바닥났다고 느낄 때 내 힘으로 짜내려 하지 마세요. 먼저 하느님께 사랑받고 있음을 묵상하면 다시 사랑할 힘이 생깁니다. 윤년에만 찾아오는 오늘, 먼저 사랑하신 주님께 감사드려요.","먼저 사랑해 주신 주님께 받은 사랑을 흘려보내겠습니다."]
];

D[3]=[
["요엘 2,13","옷이 아니라 너희 마음을 찢어라. 주 너희 하느님에게 돌아오너라. 그는 너그럽고 자비로운 이, 분노에 더디고 자애가 큰 이다.","사순 시기를 시작하는 재의 수요일에 자주 읽는 말씀입니다. 옛사람들은 슬픔을 옷을 찢어 표현했지만, 하느님은 겉모습이 아니라 마음의 변화를 원하십니다.","형식적인 반성은 쉽지만 진짜 변화는 마음에서 시작됩니다. 남에게 보이기 위한 신앙이 아니라 하느님 앞에서 정직해지는 시간을 가져 보세요. 하느님은 꾸짖으려고가 아니라 안아 주시려고 기다리십니다.","겉모습보다 마음을 돌려 자비로우신 주님께 돌아가겠습니다."],
["시편 51,12","하느님, 깨끗한 마음을 제게 만들어 주시고 굳건한 영을 제 안에 새롭게 하소서.","다윗이 큰 죄를 지은 뒤 나탄 예언자의 꾸짖음을 듣고 바친 참회의 시편입니다. ‘만들다’는 창조할 때 쓰는 말로, 하느님께서 마음을 새로 지어 주시기를 청하는 기도입니다.","스스로 마음을 깨끗하게 만들려고 애쓰다 지칠 때가 있습니다. 다윗처럼 솔직히 인정하고 하느님께 새 마음을 청하세요. 고해성사는 그 은총을 받는 가장 확실한 길입니다.","제 안에 깨끗한 마음을 새로 지어 주시기를 청합니다."],
["마태 6,6","너는 기도할 때 골방에 들어가 문을 닫은 다음, 숨어 계신 네 아버지께 기도하여라. 그러면 숨은 일도 보시는 네 아버지께서 너에게 갚아 주실 것이다.","예수님은 남에게 보이려는 기도를 경계하시고 하느님과 단둘이 만나는 기도를 가르치십니다. 골방은 장소이자, 세상의 소음을 닫는 마음의 공간입니다.","하루 중 나만의 ‘골방’ 시간이 있나요? 출근 전 10분, 잠들기 전 5분이라도 휴대전화를 끄고 하느님과 단둘이 이야기해 보세요. 그 시간이 하루를 지탱해 줍니다.","오늘 문을 닫고 주님과 단둘이 머무는 시간을 갖겠습니다."],
["마태 4,4","사람은 빵으로만 살지 않고 하느님의 입에서 나오는 모든 말씀으로 산다.","광야에서 40일 단식하신 예수님이 빵을 만들라는 유혹을 받으시고 하신 대답입니다. 육체의 필요도 중요하지만 영혼을 살리는 것은 하느님의 말씀입니다.","우리는 몸을 위해서는 하루 세 끼를 챙기지만 영혼의 양식은 쉽게 거릅니다. 오늘 하루 한 끼 식사 시간만큼 말씀을 읽고 묵상해 보세요.","몸의 양식만큼 영혼의 양식인 말씀을 챙기겠습니다."],
["루카 15,20","그는 일어나 아버지에게로 갔다. 그가 아직 멀리 떨어져 있을 때에 아버지가 그를 보고 가엾은 마음이 들어, 달려가 아들의 목을 껴안고 입을 맞추었다.","‘되찾은 아들의 비유’에서 가장 감동적인 장면입니다. 아버지는 아들이 돌아오기를 날마다 기다렸고, 멀리서 보자마자 달려가 안았습니다. 하느님 아버지의 모습입니다.","너무 멀리 왔다고, 돌아가기에 늦었다고 생각하나요? 하느님은 우리가 사과문을 다 외우기도 전에 달려와 안아 주십니다. 오늘 하느님께, 혹은 멀어진 누군가에게 한 걸음 다가가 보세요.","너무 늦은 때는 없음을 믿고 아버지께 돌아가겠습니다."],
["이사 1,18","너희의 죄가 진홍빛 같아도 눈같이 희어지고 다홍같이 붉어도 양털같이 되리라.","하느님께서 죄에 물든 백성에게 ‘자, 와서 시비를 가려 보자’ 하시며 주신 약속입니다. 아무리 짙은 죄의 얼룩도 하느님의 용서는 깨끗이 씻어 낼 수 있습니다.","지난 잘못이 지워지지 않는 얼룩처럼 마음에 남아 있을 수 있습니다. 하느님의 자비는 내 죄보다 큽니다. 스스로를 정죄하는 마음을 내려놓고 용서를 받아들이세요.","내 죄보다 크신 주님의 자비를 믿고 용서를 받아들이겠습니다."],
["1요한 1,9","우리가 우리 죄를 고백하면, 그분은 성실하시고 의로우신 분이시므로 우리의 죄를 용서하시고 우리를 모든 불의에서 깨끗하게 해 주십니다.","요한 사도는 죄가 없다고 말하는 것은 자신을 속이는 것이라고 한 뒤, 고백하는 이에게 주시는 용서를 약속합니다. 고백은 하느님의 성실하심에 나를 맡기는 행위입니다.","잘못을 숨기면 마음이 무거워지고, 인정하면 자유로워집니다. 오랫동안 미뤄 온 고해성사가 있다면 이번 주에 용기를 내 보세요. 사람에게도 ‘미안해’라고 먼저 말해 보세요.","잘못을 솔직히 고백하는 용기를 내겠습니다."],
["미카 6,8","사람아, 무엇이 착한 일이고 주님께서 너에게 요구하시는 것이 무엇인지 그분께서 너에게 이미 말씀하셨다. 공정을 실천하고 신의를 사랑하며 겸손되이 네 하느님과 함께 걷는 것이 아니냐?","백성이 하느님께 무엇을 바쳐야 할지 묻자 미카 예언자는 제물보다 삶을 요구하신다고 답합니다. 신앙의 핵심을 세 가지로 요약한 명구절입니다.","신앙이 복잡하게 느껴질 때 이 세 가지를 기억하세요. 공정하게 대하기, 신의를 지키기, 겸손하게 하느님과 동행하기. 오늘 이 셋 중 하나를 골라 실천해 보세요.","공정을 실천하고 신의를 사랑하며 겸손히 주님과 걷겠습니다."],
["이사 58,6-7","내가 좋아하는 단식은 이런 것이 아니겠느냐? 불의한 결박을 풀어 주고 멍에 줄을 끌러 주는 것, 억압받는 이들을 자유롭게 놓아주고 모든 멍에를 부수어 버리는 것이다. 네 양식을 굶주린 이와 나누는 것이다.","형식적인 단식을 하면서도 이웃을 괴롭히는 백성에게 하느님께서 참된 단식을 가르치십니다. 단식은 굶는 것이 아니라 나누는 것입니다.","사순 시기의 절제는 아낀 것을 이웃과 나눌 때 완성됩니다. 커피 한 잔, 간식 하나를 아껴 이웃돕기에 보태 보세요. 내 것을 비울 때 다른 사람이 채워집니다.","아끼고 절제한 것을 어려운 이웃과 나누겠습니다."],
["루카 19,10","사람의 아들은 잃은 이들을 찾아 구원하러 왔다.","세리장 자캐오의 집에 머무신 뒤 예수님께서 하신 말씀입니다. 모두가 손가락질하던 자캐오를 예수님은 먼저 찾아가 이름을 부르셨고, 그는 완전히 변화되었습니다.","하느님은 우리가 완벽해지기를 기다리시지 않고 먼저 찾아오십니다. 그리고 우리도 누군가를 먼저 찾아가는 사람이 되기를 바라십니다. 공동체에서 소외된 사람에게 먼저 다가가 보세요.","주님께서 나를 찾아오셨듯, 외로운 이를 먼저 찾아가겠습니다."],
["에제 36,26","너희에게 새 마음을 주고 너희 안에 새 영을 넣어 주겠다. 너희 몸에서 돌로 된 마음을 치우고, 살로 된 마음을 넣어 주겠다.","하느님은 굳어 버린 백성의 마음을 부드러운 마음으로 바꾸어 주겠다고 약속하십니다. 변화는 우리의 결심만이 아니라 하느님께서 주시는 선물입니다.","상처를 많이 받으면 마음이 돌처럼 굳어 무감각해집니다. 다른 사람의 아픔에 공감하지 못하는 나를 발견한다면 ‘살로 된 마음’을 청하세요. 오늘 누군가의 이야기에 진심으로 공감해 보세요.","굳은 마음을 녹이시는 주님께 부드러운 마음을 청하겠습니다."],
["요한 8,11","나도 너를 단죄하지 않는다. 가거라. 이제부터 다시는 죄짓지 마라.","간음하다 붙잡힌 여인에게 돌을 던지려던 사람들이 하나둘 떠나간 뒤 예수님께서 하신 말씀입니다. 예수님은 죄를 가볍게 여기지 않으시면서도 죄인을 단죄하지 않으시고 새 삶의 기회를 주십니다.","우리는 남의 잘못에는 엄격하고 내 잘못에는 너그럽습니다. 오늘 누군가를 판단하고 싶을 때 손에 든 ‘돌’을 내려놓으세요. 그리고 나 자신에게도 새 출발의 기회를 주세요.","남을 단죄하는 돌을 내려놓고 새 삶의 기회를 건네겠습니다."],
["루카 18,13","하느님, 이 죄인을 불쌍히 여겨 주십시오.","바리사이와 세리의 비유에서 세리가 성전 멀찍이 서서 가슴을 치며 바친 기도입니다. 예수님은 자신을 높인 바리사이가 아니라 겸손한 세리가 의롭게 되었다고 하십니다.","가장 짧지만 가장 진실한 기도입니다. 기도할 말이 떠오르지 않을 때, 마음이 무거울 때 이 한 문장만 반복해도 충분합니다. 하느님은 겸손한 마음을 결코 외면하지 않으십니다.","꾸밈없이 겸손한 마음으로 주님 앞에 서겠습니다."],
["마태 7,3","너는 어찌하여 형제의 눈 속에 있는 티는 보면서, 네 눈 속에 있는 들보는 깨닫지 못하느냐?","예수님은 남을 심판하는 위선을 과장된 비유로 꼬집으십니다. 남의 작은 티끌은 잘 보이지만 내 큰 들보는 보이지 않는 것이 인간의 모습입니다.","누군가의 단점이 크게 보일 때, 그것이 혹시 나에게도 있는 모습은 아닌지 돌아보세요. 남을 고치기 전에 나를 먼저 살피는 사람이 진정으로 다른 이를 도울 수 있습니다.","남의 티를 탓하기 전에 내 들보를 먼저 살피겠습니다."],
["루카 9,23","누구든지 내 뒤를 따라오려면, 자신을 버리고 날마다 제 십자가를 지고 나를 따라야 한다.","예수님을 따르는 길은 영광의 길이기 전에 자기를 내려놓는 길입니다. 루카 복음은 특히 ‘날마다’라는 말을 덧붙여 신앙이 일상의 선택임을 강조합니다.","나의 십자가는 거창한 순교가 아니라 매일 마주하는 책임과 인내일 수 있습니다. 아픈 가족을 돌보는 일, 힘든 동료를 견디는 일도 십자가입니다. 그 길 앞에 예수님이 먼저 걸어가십니다.","오늘 내게 주어진 십자가를 피하지 않고 주님을 따르겠습니다."],
["요한 12,24","밀알 하나가 땅에 떨어져 죽지 않으면 한 알 그대로 남고, 죽으면 많은 열매를 맺는다.","예수님은 당신의 죽음과 부활을 밀알에 비유하십니다. 씨앗은 자기 모습을 잃어야 싹을 틔웁니다. 희생은 끝이 아니라 풍성한 생명의 시작입니다.","부모의 희생, 선생님의 헌신처럼 누군가 자신을 내어 준 덕분에 우리가 자랐습니다. 이제 내가 밀알이 될 차례입니다. 내 고집과 욕심을 조금 내려놓을 때 주변에 열매가 맺힙니다.","나를 내어 주는 작은 희생으로 열매 맺는 밀알이 되겠습니다."],
["시편 34,19","주님께서는 마음이 부서진 이들에게 가까이 계시고 넋이 짓밟힌 이들을 구원해 주신다.","다윗의 감사 시편입니다. 하느님은 강하고 성공한 사람보다 상처 입고 무너진 사람 곁에 더 가까이 계신다고 고백합니다.","마음이 무너질 때 하느님이 멀리 계신 것처럼 느껴집니다. 그러나 그때가 하느님께서 가장 가까이 계신 순간입니다. 지금 아프다면 그 아픔을 그대로 주님께 보여 드리세요.","무너진 마음 곁에 가장 가까이 계신 주님께 기대겠습니다."],
["시편 103,12","해 뜨는 곳이 해 지는 곳에서 먼 것처럼 우리의 허물들을 우리에게서 멀리하신다.","하느님의 용서가 얼마나 완전한지를 노래하는 시편입니다. 동쪽과 서쪽은 영원히 만나지 않듯, 용서받은 죄는 다시 우리를 따라오지 않습니다.","용서받은 잘못을 계속 떠올리며 자책하고 있지 않나요? 하느님께서 멀리 보내신 것을 내가 다시 끌어오지 마세요. 용서는 하느님의 일이고, 감사는 나의 일입니다.","주님께서 멀리 보내신 허물을 다시 붙들지 않겠습니다."],
["마태 1,24","잠에서 깨어난 요셉은 주님의 천사가 명령한 대로 아내를 맞아들였다.","오늘은 성모님의 배필 성 요셉 대축일입니다. 요셉은 성경에서 한마디 말도 남기지 않았지만 하느님의 뜻을 깨닫자 즉시 행동으로 순종했습니다.","말보다 행동, 드러남보다 성실함. 요셉은 묵묵히 가족을 지킨 모든 아버지와 일하는 이들의 모범입니다. 오늘 맡은 일을 조용히, 그러나 성실하게 해내세요.","성 요셉처럼 말없이 성실하게 주님의 뜻을 따르겠습니다."],
["로마 5,8","우리가 아직 죄인이었을 때에 그리스도께서 우리를 위하여 돌아가셨습니다. 이로써 하느님께서는 우리에 대한 당신의 사랑을 증명해 주셨습니다.","하느님의 사랑은 우리가 착해진 뒤에 주어진 보상이 아닙니다. 우리가 가장 사랑받을 자격이 없을 때 그리스도께서 목숨을 내어 주셨습니다.","‘내가 이런데도 하느님이 나를 사랑하실까?’ 의심이 들 때 이 구절을 기억하세요. 하느님의 사랑은 이미 십자가로 증명되었습니다. 그 사랑은 내 상태에 따라 변하지 않습니다.","가장 부족할 때 나를 사랑하신 주님의 사랑을 믿겠습니다."],
["요한 3,16","하느님께서는 세상을 너무나 사랑하신 나머지 외아들을 내주시어, 그를 믿는 사람은 누구나 멸망하지 않고 영원한 생명을 얻게 하셨다.","‘작은 복음서’라 불릴 만큼 복음의 핵심을 담은 구절입니다. 하느님의 사랑은 특정한 사람이 아니라 온 세상을 향하며, 가장 소중한 것을 내어 주는 사랑입니다.","‘누구나’라는 말에 나도, 내가 싫어하는 사람도 포함됩니다. 하느님이 이토록 사랑하시는 세상을 나도 조금 더 너그럽게 바라볼 수 있지 않을까요?","온 세상을 사랑하신 주님의 마음으로 오늘을 바라보겠습니다."],
["요한 9,25","제가 눈먼 사람이었는데 이제는 보게 되었다는 것입니다.","태어날 때부터 눈먼 사람이 예수님께 고침을 받은 뒤 바리사이들의 추궁에 답한 말입니다. 그는 신학적 논쟁은 몰랐지만 자기에게 일어난 변화만큼은 분명히 증언했습니다.","신앙을 설명하기 어렵다고 느낄 때가 있습니다. 하지만 거창한 지식보다 ‘하느님을 만나고 내가 이렇게 달라졌다’는 체험이 가장 강한 증언입니다. 내 삶에서 달라진 점을 떠올려 보세요.","주님께서 내 삶에서 하신 일을 감사히 증언하겠습니다."],
["요한 11,25","나는 부활이요 생명이다. 나를 믿는 사람은 죽어도 살고, 살아서 나를 믿는 사람은 영원히 죽지 않을 것이다.","라자로의 죽음으로 슬퍼하는 마르타에게 예수님께서 하신 말씀입니다. 예수님은 마지막 날의 부활을 기다리는 것을 넘어 당신 자신이 곧 부활이요 생명이라고 선언하십니다.","사랑하는 사람을 잃은 슬픔은 깊습니다. 그러나 그리스도 안에서 죽음은 끝이 아닙니다. 먼저 떠난 이들을 위해 기도하며, 다시 만날 희망을 마음에 품어 보세요.","부활이요 생명이신 주님 안에서 희망을 잃지 않겠습니다."],
["마태 26,41","깨어 기도하여라. 영은 간절하나 육은 약하다.","겟세마니 동산에서 예수님께서 고뇌하실 때 잠든 제자들에게 하신 말씀입니다. 예수님은 제자들의 나약함을 아시면서도 꾸짖기보다 이해하시고 기도로 이겨 내라고 하십니다.","좋은 결심을 해도 피곤함과 유혹 앞에 쉽게 무너집니다. 그것이 인간입니다. 그래서 내 힘이 아니라 기도의 힘이 필요합니다. 유혹이 오는 시간을 알고 그때 미리 기도해 보세요.","나의 약함을 인정하고 깨어 기도하겠습니다."],
["루카 1,38","보십시오, 저는 주님의 종입니다. 말씀하신 대로 저에게 이루어지기를 바랍니다.","오늘은 주님 탄생 예고 대축일입니다. 천사 가브리엘의 놀라운 소식에 마리아는 모든 것을 이해하지 못했지만 하느님께 ‘예’라고 응답했습니다. 이 응답으로 구원의 역사가 시작되었습니다.","하느님의 뜻이 내 계획과 다를 때 두렵고 망설여집니다. 마리아도 그랬습니다. 그러나 그녀의 ‘예’는 세상을 바꾸었습니다. 오늘 내 앞의 작은 부르심에 ‘예’라고 응답해 보세요.","성모님처럼 주님의 뜻에 ‘예’라고 응답하겠습니다."],
["루카 22,42","아버지, 아버지께서 원하시면 이 잔을 저에게서 거두어 주십시오. 그러나 제 뜻이 아니라 아버지의 뜻이 이루어지게 하십시오.","올리브 산에서 예수님께서 피땀을 흘리며 바치신 기도입니다. 예수님도 고통을 피하고 싶은 마음을 솔직히 아뢰셨지만, 끝내 아버지의 뜻에 자신을 맡기셨습니다.","기도는 내 뜻을 관철하는 것이 아니라 하느님의 뜻에 나를 맞추는 과정입니다. 솔직하게 바라는 것을 아뢰되 마지막에는 ‘그래도 아버지 뜻대로’라고 덧붙여 보세요.","제 뜻이 아니라 주님의 뜻이 이루어지기를 기도하겠습니다."],
["이사 53,5","그가 찔린 것은 우리의 악행 때문이고 그가 으스러진 것은 우리의 죄악 때문이다. 그가 받은 징벌로 우리는 평화를 얻고 그의 상처로 우리는 나음을 받았다.","이사야서의 ‘주님의 종의 노래’는 예수님의 수난을 수백 년 앞서 예언한 말씀으로 읽힙니다. 무고한 이가 우리 대신 고통을 받아 우리에게 치유를 주었습니다.","내 상처를 치유하는 힘은 그리스도의 상처에서 나옵니다. 아픔을 겪고 있다면 십자가 앞에 머물러 보세요. 그분은 나의 아픔을 이미 아시고 함께 지고 계십니다.","그리스도의 상처로 나음을 받은 사람으로 감사하며 살겠습니다."],
["필리 2,7-8","오히려 당신 자신을 비우시어 종의 모습을 취하시고 사람들과 같이 되셨습니다. 이렇게 여느 사람처럼 나타나 당신 자신을 낮추시어 죽음에 이르기까지, 십자가 죽음에 이르기까지 순종하셨습니다.","초대 교회의 찬가로 알려진 이 구절은 예수님의 ‘자기 비움’을 노래합니다. 하느님이신 분이 가장 낮은 자리까지 내려오셨습니다.","높아지려고 경쟁하는 세상에서 예수님은 내려가는 길을 보여 주셨습니다. 오늘 내 자존심을 조금 내려놓고 낮은 자리에서 섬겨 보세요. 그곳에서 예수님을 만납니다.","주님처럼 나를 비우고 낮은 자리에서 섬기겠습니다."],
["루카 23,34","아버지, 저들을 용서해 주십시오. 저들은 자기들이 무슨 일을 하는지 모릅니다.","십자가에 못 박히시며 예수님께서 하신 첫 말씀입니다. 극심한 고통 속에서도 예수님은 당신을 해치는 이들을 위해 기도하셨습니다.","나에게 상처를 준 사람도 어쩌면 자신이 무슨 일을 했는지 모를 수 있습니다. 용서할 힘이 없을 때는 예수님의 이 기도를 빌려 그 사람을 위해 기도해 보세요.","나에게 상처 준 이를 위해 주님의 기도를 빌려 기도하겠습니다."],
["루카 23,43","오늘 네가 나와 함께 낙원에 있을 것이다.","예수님 옆 십자가에 달린 죄수가 ‘저를 기억해 주십시오’라고 청하자 예수님께서 하신 약속입니다. 생의 마지막 순간에도 구원의 문은 열려 있었습니다.","너무 늦었다고 생각하는 순간에도 하느님의 자비는 열려 있습니다. 나 자신에게도, 다른 사람에게도 ‘이미 늦었다’고 단정하지 마세요. 하느님은 마지막 순간까지 기다리십니다.","마지막까지 열려 있는 주님의 자비를 믿고 희망하겠습니다."],
["요한 13,14-15","주님이며 스승인 내가 너희의 발을 씻었으면, 너희도 서로 남의 발을 씻어 주어야 한다. 내가 너희에게 한 것처럼 너희도 하라고, 내가 본을 보여 준 것이다.","최후의 만찬 때 예수님께서 제자들의 발을 씻어 주신 뒤 하신 말씀입니다. 당시 발 씻기는 가장 낮은 종의 일이었습니다. 예수님은 섬김을 말이 아닌 행동으로 가르치셨습니다.","가정과 직장에서 남의 ‘발을 씻는 일’은 누구도 하고 싶어 하지 않는 일일 수 있습니다. 오늘 아무도 하지 않으려는 작은 일을 먼저 해 보세요. 그것이 예수님의 본을 따르는 것입니다.","오늘 아무도 하지 않으려는 일을 먼저 하며 섬기겠습니다."]
];

D[4]=[
["마태 28,6","그분은 여기에 계시지 않는다. 말씀하신 대로 그분은 되살아나셨다.","무덤을 찾은 여인들에게 천사가 전한 부활의 소식입니다. 죽음의 상징이던 무덤이 비어 있다는 사실은 그리스도 신앙의 출발점이 되었습니다.","우리 삶에도 무덤처럼 닫혀 버린 것 같은 상황이 있습니다. 끝났다고 생각한 관계, 포기한 꿈… 부활의 하느님은 그곳에서 새 생명을 일으키십니다. 오늘 포기했던 일 하나를 다시 꺼내 보세요.","닫힌 무덤도 여시는 부활의 주님을 믿고 다시 일어서겠습니다."],
["요한 20,29","너는 나를 보고서야 믿느냐? 보지 않고도 믿는 사람은 행복하다.","부활하신 예수님을 직접 보고 손으로 만져야 믿겠다던 토마스에게 하신 말씀입니다. 이 말씀은 예수님을 직접 보지 못한 채 믿는 우리 모두에게 주시는 축복입니다.","의심이 드는 것은 신앙이 없어서가 아닙니다. 토마스처럼 솔직하게 질문하는 것도 신앙의 과정입니다. 다만 보이는 것만 믿으려 하지 말고, 보이지 않는 하느님의 손길을 믿어 보세요.","보지 않고도 믿는 행복을 누리겠습니다."],
["루카 24,32","길에서 그분께서 우리에게 말씀하실 때나 성경을 풀이해 주실 때 속에서 우리 마음이 타오르지 않았던가!","엠마오로 가던 두 제자는 낯선 나그네가 예수님인 줄 몰랐지만, 그분이 빵을 떼실 때 비로소 알아보았습니다. 그제야 말씀을 들을 때 마음이 뜨거웠던 이유를 깨달았습니다.","실망하고 떠나는 길 위에서도 예수님은 우리와 함께 걸으십니다. 다만 우리가 알아보지 못할 뿐입니다. 말씀과 성체성사 안에서 그분을 알아보는 눈을 청하세요.","실망의 길 위에서도 함께 걸으시는 주님을 알아보겠습니다."],
["요한 20,19","예수님께서 오시어 가운데에 서시며, ‘평화가 너희와 함께!’ 하고 말씀하셨다.","두려움에 문을 잠그고 숨어 있던 제자들 한가운데에 부활하신 예수님이 나타나셨습니다. 그분의 첫마디는 꾸짖음이 아니라 평화였습니다.","두려움 때문에 마음의 문을 잠근 적이 있나요? 예수님은 잠긴 문도 통과해 오셔서 평화를 주십니다. 오늘 미사 중 ‘평화의 인사’를 나눌 때 그 평화를 진심으로 받아들이고 건네 보세요.","잠긴 마음에 들어오시는 주님의 평화를 받아들이겠습니다."],
["요한 14,27","나는 너희에게 평화를 남기고 간다. 내 평화를 너희에게 준다. 내가 주는 평화는 세상이 주는 것과 같지 않다. 너희 마음이 산란해지는 일도 없고 겁을 내는 일도 없도록 하여라.","최후의 만찬에서 예수님께서 남기신 유언과 같은 말씀입니다. 세상의 평화는 문제가 없을 때 오지만, 그리스도의 평화는 폭풍 속에서도 흔들리지 않는 평화입니다.","모든 문제가 해결되어야 평화로울 수 있다면 우리는 영영 평화를 누리지 못합니다. 예수님의 평화는 상황이 아니라 그분과의 관계에서 옵니다. 불안할 때 ‘주님의 평화’를 조용히 청해 보세요.","세상이 줄 수 없는 주님의 평화를 마음에 간직하겠습니다."],
["요한 10,10","나는 양들이 생명을 얻고 또 얻어 넘치게 하려고 왔다.","예수님은 양을 해치는 도둑과 달리 착한 목자는 양들에게 넘치는 생명을 주려고 왔다고 말씀하십니다. 신앙은 삶을 억압하는 것이 아니라 풍요롭게 하는 것입니다.","신앙생활이 의무와 규칙으로만 느껴진다면 다시 생각해 보세요. 예수님은 우리 삶이 기쁨과 의미로 충만하기를 원하십니다. 오늘 하루의 작은 기쁨을 찾아 감사해 보세요.","주님께서 주시는 넘치는 생명을 기쁘게 누리겠습니다."],
["요한 10,11","나는 착한 목자다. 착한 목자는 양들을 위하여 목숨을 내놓는다.","목자는 양을 위해 위험을 무릅쓰고 맹수와 싸웠습니다. 예수님은 품삯을 받고 일하는 삯꾼과 달리 양을 위해 목숨까지 내놓는 착한 목자이십니다.","나를 끝까지 책임지시는 목자가 계신다는 것은 큰 위로입니다. 또 우리 각자도 누군가의 목자입니다. 부모, 교사, 리더로서 맡겨진 이들을 진심으로 돌보고 있는지 돌아보세요.","착한 목자이신 주님께 의지하며, 맡겨진 이들을 정성껏 돌보겠습니다."],
["시편 23,1-3","주님은 나의 목자, 나는 아쉬울 것 없어라. 푸른 풀밭에 나를 쉬게 하시고 잔잔한 물가로 나를 이끄시니 내 영혼에 생기를 돋우어 주시네.","가장 많이 사랑받는 시편입니다. 목자이신 하느님께서 필요한 모든 것을 채우시고 쉼과 회복을 주신다는 신뢰가 담겨 있습니다.","‘아쉬울 것 없어라’는 모든 것을 가졌다는 뜻이 아니라 필요한 것을 채워 주실 것을 믿는다는 고백입니다. 부족함에 집중하기보다 이미 받은 것들을 세어 보세요.","목자이신 주님 안에서 아쉬울 것 없는 마음으로 살겠습니다."],
["요한 14,6","나는 길이요 진리요 생명이다. 나를 통하지 않고서는 아무도 아버지께 갈 수 없다.","길을 모르겠다는 토마스의 질문에 예수님께서 하신 대답입니다. 예수님은 길을 알려 주는 분이 아니라 그분 자신이 바로 길이십니다.","인생의 갈림길에서 어디로 가야 할지 모를 때가 있습니다. 그때 ‘예수님의 길은 어느 쪽일까?’ 물어보세요. 사랑과 진실과 생명을 향한 쪽이 그분의 길입니다.","길이요 진리요 생명이신 주님을 따라 걷겠습니다."],
["요한 15,5","나는 포도나무요 너희는 가지다. 내 안에 머무르고 나도 그 안에 머무르는 사람은 많은 열매를 맺는다. 너희는 나 없이 아무것도 할 수 없기 때문이다.","포도나무와 가지의 비유는 그리스도와 우리의 관계를 보여 줍니다. 가지는 스스로 열매를 맺지 못하고 나무에 붙어 있을 때만 생명을 얻습니다.","열심히 하는데도 열매가 없고 지치기만 한다면, 혹시 나무에서 떨어져 있지 않은지 돌아보세요. 바쁠수록 기도와 성사로 주님께 붙어 있는 시간을 먼저 챙기세요.","주님께 붙어 있는 가지로서 기도의 시간을 먼저 챙기겠습니다."],
["요한 6,35","나는 생명의 빵이다. 나에게 오는 사람은 결코 배고프지 않을 것이며, 나를 믿는 사람은 결코 목마르지 않을 것이다.","오천 명을 먹이신 기적 다음 날, 예수님은 썩어 없어질 빵이 아니라 영원한 생명을 주는 빵을 찾으라고 하십니다. 그 빵은 바로 예수님 자신이며, 성체성사로 우리에게 오십니다.","아무리 채워도 공허함이 남는다면 영혼이 배고프다는 신호입니다. 쇼핑이나 SNS로는 채울 수 없는 허기가 있습니다. 성체를 모실 때 생명의 빵이신 주님을 정성껏 맞이해 보세요.","영혼의 허기를 생명의 빵이신 주님으로 채우겠습니다."],
["요한 21,17","주님, 주님께서는 모든 것을 아십니다. 제가 주님을 사랑하는 줄을 주님께서는 알고 계십니다.","부활하신 예수님은 세 번 당신을 모른다고 했던 베드로에게 세 번 ‘나를 사랑하느냐?’ 물으셨습니다. 베드로는 슬퍼하며 이렇게 고백했고, 예수님은 그에게 양들을 맡기셨습니다.","실패한 자리에서 예수님은 다시 사랑을 물으십니다. 과거의 배신과 실수보다 지금의 사랑이 중요합니다. 오늘 예수님이 ‘나를 사랑하느냐?’ 물으신다면 어떻게 대답하시겠어요?","실패를 넘어 다시 주님께 사랑을 고백하겠습니다."],
["로마 6,4","그리스도께서 아버지의 영광을 통하여 죽은 이들 가운데에서 되살아나신 것처럼, 우리도 새로운 삶을 살아가게 하려는 것입니다.","바오로 사도는 세례를 그리스도와 함께 죽고 함께 다시 사는 것으로 설명합니다. 세례받은 우리는 이미 부활의 새 생명을 살기 시작했습니다.","세례는 과거의 한 사건이 아니라 매일 새롭게 살아야 할 삶입니다. 오늘 옛 습관 하나를 ‘죽이고’ 새로운 선택을 해 보세요. 그것이 부활을 사는 것입니다.","세례받은 사람답게 부활의 새 삶을 살겠습니다."],
["1베드 1,3","하느님께서는 그 크신 자비로 우리를 새로 태어나게 하시어, 예수 그리스도께서 죽은 이들 가운데에서 부활하심으로써 우리에게 생생한 희망을 안겨 주셨습니다.","박해 속에 흩어져 사는 신자들에게 베드로 사도가 보낸 편지의 첫머리입니다. 부활 신앙은 막연한 기대가 아니라 살아 있는 희망입니다.","희망이 메마른 세상에서 그리스도인은 ‘생생한 희망’을 가진 사람입니다. 그 희망은 상황이 좋아서가 아니라 부활하신 주님 때문에 가능합니다. 오늘 희망을 잃은 누군가에게 희망을 나눠 주세요.","부활이 주는 생생한 희망을 품고 나누겠습니다."],
["사도 2,42","그들은 사도들의 가르침을 받고 친교를 이루며 빵을 떼어 나누고 기도하는 일에 전념하였다.","성령 강림 후 처음 생겨난 교회 공동체의 모습입니다. 가르침, 친교, 성찬, 기도라는 네 기둥은 오늘날 교회의 모습이기도 합니다.","신앙은 혼자가 아니라 공동체 안에서 자랍니다. 미사 참례, 소공동체 모임, 함께 나누는 식사… 이 네 가지 중 요즘 소홀했던 것이 있다면 이번 주에 다시 시작해 보세요.","공동체와 함께 배우고 나누고 기도하겠습니다."],
["사도 4,32","많은 신자들이 한마음 한뜻이 되어, 아무도 자기 소유를 자기 것이라고 하지 않고 모든 것을 공동으로 소유하였다.","초대 교회는 서로의 필요를 채우며 가난한 사람이 하나도 없을 만큼 나누었습니다. 소유보다 관계를 더 소중히 여긴 공동체의 모습입니다.","모든 것을 공동 소유하기는 어렵지만, ‘내 것’이라는 생각을 조금 내려놓을 수는 있습니다. 내가 가진 재능이나 물건 중 나눌 수 있는 것이 무엇인지 생각해 보세요.","내 것이라는 마음을 내려놓고 기꺼이 나누겠습니다."],
["사도 3,6","나는 은도 금도 없습니다. 그러나 내가 가진 것을 당신에게 주겠습니다. 나자렛 사람 예수 그리스도의 이름으로 일어나 걸으시오.","성전 문 앞에서 구걸하던 다리 저는 사람에게 베드로가 한 말입니다. 돈은 없었지만 그에게는 예수님의 이름이라는 더 큰 선물이 있었습니다.","나눌 돈이 없다고 아무것도 줄 수 없는 것은 아닙니다. 따뜻한 관심, 경청, 기도, 격려는 누구나 줄 수 있는 선물입니다. 오늘 내가 가진 것으로 누군가를 일으켜 세워 보세요.","내가 가진 것으로 누군가를 일으켜 세우겠습니다."],
["사도 20,35","주는 것이 받는 것보다 더 행복하다.","바오로 사도가 에페소 원로들과 작별하며 전한 예수님의 말씀입니다. 복음서에는 기록되지 않았지만 초대 교회가 소중히 간직한 말씀입니다.","받을 때의 기쁨은 잠시지만 줄 때의 기쁨은 오래 남습니다. 이는 심리학 연구로도 확인되는 사실입니다. 오늘 대가를 바라지 않고 무언가를 건네 보세요.","오늘 대가 없이 주는 기쁨을 누리겠습니다."],
["콜로 3,1-2","여러분은 그리스도와 함께 되살아났으니, 저 위에 있는 것을 추구하십시오. 위에 있는 것을 생각하고 땅에 있는 것은 생각하지 마십시오.","부활의 삶은 시선의 방향을 바꾸는 것입니다. 땅의 일을 무시하라는 것이 아니라, 영원한 가치를 기준으로 땅의 일을 바라보라는 뜻입니다.","돈, 지위, 남의 평가에 마음을 빼앗길 때가 많습니다. 10년 뒤, 아니 영원의 관점에서 보면 무엇이 정말 중요할까요? 오늘 하루 우선순위를 다시 세워 보세요.","영원한 가치를 바라보며 오늘의 우선순위를 정하겠습니다."],
["로마 8,28","하느님을 사랑하는 이들, 곧 그분의 계획에 따라 부르심을 받은 이들에게는 모든 것이 함께 작용하여 선을 이룬다는 것을 우리는 알고 있습니다.","모든 일이 좋다는 뜻이 아니라, 좋지 않은 일까지도 하느님께서 엮으시어 결국 선으로 이끄신다는 믿음입니다.","지금 겪는 어려움이 왜 일어났는지 이해되지 않을 수 있습니다. 하지만 시간이 지나 돌아보면 그 시간이 나를 성장시켰음을 깨닫게 됩니다. 오늘의 어려움도 하느님의 계획 안에 있습니다.","모든 일을 선으로 이끄시는 주님을 신뢰하겠습니다."],
["로마 8,38-39","죽음도, 삶도, 천사도, 권세도, 현재의 것도, 미래의 것도, 권능도, 저 높은 곳도, 저 깊은 곳도, 그 밖의 어떠한 피조물도 우리 주 그리스도 예수님에게서 드러난 하느님의 사랑에서 우리를 떼어 놓을 수 없습니다.","바오로 사도가 하느님의 사랑에 대한 확신을 힘차게 고백하는 대목입니다. 우리가 상상할 수 있는 어떤 힘도 하느님의 사랑을 끊을 수 없습니다.","나를 하느님에게서 떼어 놓을 것 같은 두려움이 있나요? 질병, 실패, 죄책감, 외로움도 하느님의 사랑을 이길 수 없습니다. 이 목록에 지금 내가 두려워하는 것을 넣어 읽어 보세요.","그 무엇도 주님의 사랑에서 나를 떼어 놓을 수 없음을 믿겠습니다."],
["창세 1,31","하느님께서 보시니 손수 만드신 모든 것이 참 좋았다.","천지 창조의 여섯째 날, 사람을 지으신 뒤 하느님께서 보신 세상은 ‘참 좋았다’고 합니다. 오늘은 지구의 날입니다. 하느님이 보시기에 좋았던 세상을 우리가 돌보아야 합니다.","‘참 좋았다’는 하느님의 시선으로 자연과 사람을 바라보면 함부로 대할 수 없습니다. 오늘 일회용품을 한 번 덜 쓰고, 산책하며 자연의 아름다움을 감상해 보세요.","하느님께서 보시기에 좋았던 세상을 소중히 돌보겠습니다."],
["시편 118,24","이날은 주님께서 만드신 날 우리 기뻐하며 즐거워하세.","부활 시기에 자주 노래하는 시편입니다. 특별한 날만이 아니라 오늘 하루 자체가 하느님께서 주신 선물이라는 고백입니다.","평범한 오늘도 주님께서 만드신 날입니다. 날씨가 흐려도, 일이 많아도 오늘은 다시 오지 않는 선물입니다. 아침에 이 구절을 소리 내어 읽고 하루를 시작해 보세요.","주님께서 만드신 오늘을 기뻐하며 살겠습니다."],
["이사 55,10-11","비와 눈은 하늘에서 내려와 그리로 돌아가지 않고 땅을 적시어 기름지게 하고 싹이 트게 하여 씨 뿌리는 사람에게 씨앗을 주고 먹는 이에게 양식을 준다. 이처럼 내 입에서 나가는 나의 말도 나에게 헛되이 돌아오지 않고 반드시 내가 뜻하는 바를 이루며 내가 내린 사명을 완수하고야 만다.","하느님의 말씀은 비와 눈처럼 반드시 열매를 맺는다는 약속입니다. 당장 변화가 보이지 않아도 말씀은 조용히 땅속에서 일합니다.","매일 말씀을 읽어도 달라지는 게 없는 것 같나요? 비가 땅에 스며들듯 말씀은 서서히 우리를 변화시킵니다. 오늘 읽은 말씀 한 구절을 하루 종일 마음에 품어 보세요.","말씀이 내 안에서 열매 맺을 것을 믿고 꾸준히 읽겠습니다."],
["마르 16,15","온 세상에 가서 모든 피조물에게 복음을 선포하여라.","오늘은 마르코 복음사가 축일입니다. 부활하신 예수님께서 승천하시기 전 제자들에게 맡기신 마지막 사명입니다.","복음 선포는 거리에서 외치는 것만이 아닙니다. 내 삶의 기쁨과 친절이 가장 설득력 있는 복음입니다. ‘저 사람은 왜 저렇게 평화로울까?’ 하는 궁금증을 주는 삶을 살아 보세요.","내 삶의 기쁨으로 복음을 전하겠습니다."],
["1베드 3,15","여러분이 지닌 희망에 관하여 누가 물어도 대답할 수 있도록 언제나 준비해 두십시오. 그러나 온유하고 공손하게 대답하십시오.","베드로 사도는 신앙인이 자신의 희망을 설명할 수 있어야 한다고 말하면서, 그 태도는 반드시 온유하고 공손해야 한다고 덧붙입니다.","신앙에 대해 묻는 사람에게 논쟁하듯 대답하면 오히려 멀어집니다. 내가 왜 믿는지, 신앙이 내 삶에 어떤 의미인지 짧게 정리해 두세요. 그리고 상대를 존중하며 나누세요.","내가 지닌 희망을 온유하고 공손하게 나누겠습니다."],
["요한 14,1-2","너희 마음이 산란해지는 일이 없도록 하여라. 하느님을 믿고 또 나를 믿어라. 내 아버지의 집에는 거처할 곳이 많다.","곧 떠나실 것을 알리시며 불안해하는 제자들을 위로하시는 말씀입니다. 하느님 아버지의 집에는 우리 모두를 위한 자리가 마련되어 있습니다.","어디에도 내 자리가 없는 것 같은 외로움을 느낄 때가 있습니다. 하지만 하느님의 집에는 나를 위해 준비된 자리가 있습니다. 나도 누군가에게 ‘여기 네 자리가 있어’라고 말해 주세요.","하느님 집에 마련된 내 자리를 믿으며 마음의 평안을 지키겠습니다."],
["요한 15,11","내가 너희에게 이것을 말한 것은, 내 기쁨이 너희 안에 있고 또 너희 기쁨이 충만하게 하려는 것이다.","예수님께서 사랑의 계명을 주신 목적은 우리를 구속하려는 것이 아니라 기쁨을 충만하게 하시려는 것이었습니다.","그리스도인의 기쁨은 좋은 일이 생겨서가 아니라 사랑받고 사랑하는 데서 옵니다. 얼굴을 찌푸리기 쉬운 하루라도 의식적으로 미소를 지어 보세요. 기쁨은 전염됩니다.","주님께서 주시는 충만한 기쁨을 표정과 말로 나누겠습니다."],
["묵시 21,5","보라, 내가 모든 것을 새롭게 만든다.","요한 묵시록의 끝부분, 새 하늘과 새 땅의 환시 속에서 어좌에 앉으신 분이 하신 말씀입니다. 하느님은 낡은 것을 버리지 않고 새롭게 만드시는 분입니다.","망가진 관계, 지친 몸, 상처 입은 마음도 하느님은 새롭게 하실 수 있습니다. 버리고 싶을 만큼 지친 무언가가 있다면 그것을 하느님께 맡겨 보세요.","모든 것을 새롭게 하시는 주님께 지친 마음을 맡기겠습니다."],
["1테살 5,16-18","언제나 기뻐하십시오. 끊임없이 기도하십시오. 모든 일에 감사하십시오. 이것이 그리스도 예수님 안에서 하느님께서 여러분에게 바라시는 뜻입니다.","바오로 사도가 남긴 짧고 강렬한 세 가지 권고입니다. 하느님의 뜻이 무엇인지 궁금하다면, 바로 이것이라고 분명히 말합니다.","‘언제나’, ‘끊임없이’, ‘모든 일에’라는 말이 부담스러울 수 있습니다. 하지만 하루에 한 번 기뻐하고, 한 번 기도하고, 한 번 감사하는 것부터 시작하면 됩니다. 오늘 감사한 일 세 가지를 적어 보세요.","오늘 기뻐하고 기도하고 감사하는 하루를 살겠습니다."]
];

D[5]=[
["콜로 3,23","무슨 일을 하든 사람이 아니라 주님을 위하여 일하듯이 진심으로 하십시오.","오늘은 노동자 성 요셉 기념일입니다. 바오로 사도는 노동의 가치가 누가 보느냐가 아니라 누구를 위해 하느냐에 달려 있다고 가르칩니다.","상사가 보지 않으면 대충 하고 싶을 때가 있습니다. 하지만 주님을 위해 일한다고 생각하면 작은 업무도 의미가 달라집니다. 오늘 내 일을 주님께 바치는 마음으로 시작해 보세요.","오늘 내 일을 주님께 드리는 정성으로 하겠습니다."],
["루카 1,46-47","내 영혼이 주님을 찬송하고 나의 마음이 나의 구원자 하느님 안에서 기뻐 뛰니","성모 마리아가 엘리사벳을 방문했을 때 부른 ‘마니피캇(성모의 노래)’의 시작입니다. 성모 성월인 5월, 성모님의 기쁨에 함께해 봅니다.","성모님은 어려운 상황에서도 하느님 안에서 기뻐하셨습니다. 기쁨은 환경이 아니라 하느님과의 관계에서 나옵니다. 오늘 하느님께서 내게 해 주신 일을 떠올리며 찬미해 보세요.","성모님과 함께 내 영혼이 주님을 찬송하게 하겠습니다."],
["루카 1,45","행복하십니다, 주님께서 하신 말씀이 이루어지리라고 믿으신 분!","엘리사벳이 마리아를 맞으며 한 말입니다. 마리아의 행복은 모든 것을 이해해서가 아니라 하느님의 말씀을 믿었기 때문입니다.","약속이 이루어지기 전에 믿는 것이 진짜 믿음입니다. 아직 응답받지 못한 기도가 있어도 하느님의 약속을 신뢰하세요. 믿음 자체가 이미 행복입니다.","말씀이 이루어질 것을 믿는 행복을 누리겠습니다."],
["루카 2,19","마리아는 이 모든 일을 마음속에 간직하고 곰곰이 되새겼다.","목자들이 전한 놀라운 이야기를 들은 마리아의 모습입니다. 성모님은 이해되지 않는 일도 서둘러 판단하지 않고 마음에 품고 묵상하셨습니다.","즉각 반응하고 판단하는 시대입니다. 성모님처럼 일어난 일을 마음에 담아 천천히 되새기는 습관을 가져 보세요. 잠들기 전 오늘 하루를 돌아보는 ‘성찰’이 좋은 시작입니다.","성모님처럼 오늘의 일들을 마음에 간직하고 되새기겠습니다."],
["마태 18,3","내가 진실로 너희에게 말한다. 너희가 회개하여 어린이처럼 되지 않으면 결코 하늘 나라에 들어가지 못할 것이다.","누가 가장 큰 사람이냐고 다투던 제자들 가운데에 예수님은 어린이를 세우셨습니다. 어린이처럼 된다는 것은 겸손하고 신뢰하며 의존하는 마음을 갖는 것입니다.","어린이날, 아이들에게 배울 점을 생각해 봅니다. 쉽게 용서하고, 작은 것에 기뻐하고, 부모를 온전히 믿는 마음입니다. 오늘 아이처럼 단순하게 하느님께 다가가 보세요.","어린이처럼 단순하고 신뢰하는 마음을 회복하겠습니다."],
["시편 127,3","보라, 아들들은 주님의 선물이요 몸의 소생은 그분의 상급이다.","자녀는 부모의 소유물이 아니라 하느님께서 맡기신 선물이라는 고백입니다.","자녀를 내 뜻대로 만들려 할 때 갈등이 생깁니다. 자녀는 하느님께서 잠시 맡기신 선물입니다. 오늘 자녀나 조카, 이웃의 아이에게 ‘너는 소중한 선물이야’라고 말해 주세요.","아이들을 하느님의 선물로 존중하며 사랑하겠습니다."],
["잠언 22,6","아이가 걸어야 할 길을 아이에게 가르쳐라. 그러면 늙어서도 그 길을 떠나지 않으리라.","어린 시절의 가르침이 평생을 좌우한다는 지혜입니다. 신앙과 가치관은 말보다 부모의 삶을 통해 전해집니다.","아이들은 부모의 말이 아니라 뒷모습을 보고 자랍니다. 함께 식사 전 기도를 하고, 미사에 함께 가는 것만으로도 평생의 길을 놓아 줄 수 있습니다.","말보다 삶으로 다음 세대에게 신앙의 길을 보여 주겠습니다."],
["탈출 20,12","네 아버지와 어머니를 공경하여라. 그러면 너는 주 너의 하느님이 너에게 주는 땅에서 오래 살 것이다.","십계명 중 사람에 대한 첫 계명이자 약속이 붙은 계명입니다. 부모 공경은 하느님 공경과 이어져 있습니다.","어버이날입니다. 부모님께 전화 한 통, 손편지 한 장이 큰 기쁨이 됩니다. 이미 떠나신 부모님이 계신다면 그분들의 영혼을 위해 기도해 주세요.","오늘 부모님께 감사와 공경을 표현하겠습니다."],
["집회 3,12-13","얘야, 네 아버지가 나이 들었을 때 잘 보살피고 그가 살아 있는 동안 그를 슬프게 하지 마라. 그가 분별력을 잃더라도 너그럽게 대하고 네가 원기 왕성하다고 그를 업신여기지 마라.","집회서는 연로한 부모를 대하는 자세를 구체적으로 가르칩니다. 부모가 약해지고 실수할 때 오히려 더 큰 인내와 존중이 필요합니다.","고령화 시대, 부모님의 노화를 지켜보는 일은 쉽지 않습니다. 같은 이야기를 반복하셔도, 더디셔도 너그럽게 대해 드리세요. 그분들이 우리를 그렇게 키우셨습니다.","연로하신 부모님께 더 너그럽고 따뜻하게 대하겠습니다."],
["집회 7,27","마음을 다하여 네 아버지를 공경하고 어머니의 산고를 잊지 마라.","부모님께서 나를 위해 겪으신 고통과 수고를 기억하라는 가르침입니다. 감사는 기억에서 시작됩니다.","우리는 부모님의 수고를 너무 당연하게 여깁니다. 나를 낳고 기르시기 위해 포기하신 것들을 한번 떠올려 보세요. 그 기억이 감사로 이어집니다.","부모님의 수고를 잊지 않고 감사하겠습니다."],
["에페 6,4","그리고 아버지 여러분, 자녀들을 성나게 하지 말고 주님의 훈련과 훈계로 기르십시오.","바오로 사도는 자녀에게 부모를 공경하라고 한 뒤 부모에게도 책임을 말합니다. 권위는 자녀를 억누르는 것이 아니라 바르게 키우기 위한 것입니다.","부모의 감정적인 말은 자녀의 마음에 상처를 남깁니다. 훈계할 때도 사랑과 존중을 담아 보세요. 아이의 말을 먼저 들어 주는 것이 좋은 훈육의 시작입니다.","자녀를 존중하며 사랑으로 바르게 이끌겠습니다."],
["이사 49,15","여인이 제 젖먹이를 잊을 수 있느냐? 제 몸에서 난 아기를 가엾이 여기지 않을 수 있느냐? 설령 여인들은 잊는다 하더라도 나는 너를 잊지 않는다.","하느님께 버림받았다고 느끼는 백성에게 주신 말씀입니다. 하느님의 사랑은 어머니의 사랑보다 더 깊고 변함없습니다.","아무도 나를 기억하지 않는 것 같은 외로움이 찾아올 때가 있습니다. 그러나 하느님은 결코 나를 잊지 않으십니다. 내 이름은 그분 손바닥에 새겨져 있습니다.","나를 결코 잊지 않으시는 주님의 사랑에 기대겠습니다."],
["요한 19,26-27","예수님께서는 당신의 어머니와 그 곁에 선 사랑하시는 제자를 보시고, 어머니에게 말씀하셨다. ‘여인이시여, 이 사람이 어머니의 아들입니다.’ 이어서 그 제자에게 ‘이분이 네 어머니시다.’ 하고 말씀하셨다.","십자가 위에서 예수님은 사랑하는 제자에게 어머니를 맡기셨습니다. 교회는 이 장면에서 성모님이 우리 모두의 어머니가 되셨다고 믿습니다. 오늘은 파티마의 성모 기념일입니다.","어려울 때 성모님께 기도하는 것은 어머니께 기대는 자연스러운 마음입니다. 오늘 묵주기도 한 단을 바치며 성모님께 내 마음을 맡겨 보세요.","우리 어머니이신 성모님께 기도하며 마음을 맡기겠습니다."],
["이사 66,13","어머니가 제 자식을 위로하듯 내가 너희를 위로하리라.","하느님께서 당신의 위로를 어머니의 위로에 비유하십니다. 하느님은 엄한 재판관만이 아니라 따뜻하게 안아 주시는 분입니다.","지치고 슬플 때 어머니 품이 그리운 것처럼, 하느님은 우리를 품어 위로하십니다. 오늘 위로가 필요한 사람에게 어머니처럼 따뜻하게 다가가 보세요.","어머니처럼 위로하시는 주님 품에서 쉬고, 그 위로를 나누겠습니다."],
["마태 23,11","너희 가운데에서 가장 높은 사람은 너희를 섬기는 사람이 되어야 한다.","예수님은 높은 자리와 존경받기를 좋아하던 율법 학자들을 꾸짖으시며 참된 위대함은 섬김에 있다고 하십니다.","스승의 날, 참된 스승은 군림하지 않고 섬기는 사람임을 생각합니다. 나를 섬기며 가르쳐 주신 은사님께 감사를 전해 보세요. 그리고 나도 누군가에게 섬기는 스승이 되어 주세요.","높아지기보다 섬기는 사람이 되겠습니다."],
["잠언 1,8","내 아들아, 아버지의 교훈을 들어라. 어머니의 가르침을 저버리지 마라.","잠언은 부모의 가르침을 소중히 여기라는 권고로 시작합니다. 세대를 이어 전해지는 지혜는 귀한 유산입니다.","부모님의 잔소리가 듣기 싫을 때도 있었지만, 시간이 지나면 그 말씀이 나를 지켜 주었음을 깨닫습니다. 부모님께 들은 가장 소중한 가르침은 무엇인가요?","부모님께 받은 소중한 가르침을 마음에 새기겠습니다."],
["여호 24,15","나와 내 집안은 주님을 섬기겠다.","여호수아가 생애 마지막에 백성에게 누구를 섬길지 선택하라고 하며 자신의 결단을 밝힌 말입니다. 신앙은 개인의 결단이자 가정의 선택입니다.","바쁜 일상 속에서 가정의 신앙이 뒤로 밀리기 쉽습니다. 일주일에 한 번이라도 가족이 함께 기도하는 시간을 정해 보세요. 그것이 우리 집의 고백이 됩니다.","우리 가정이 함께 주님을 섬기도록 노력하겠습니다."],
["시편 133,1","보라, 얼마나 좋고 얼마나 즐거운가, 형제들이 함께 사는 것이!","순례자들이 예루살렘으로 올라가며 부른 노래입니다. 형제가 화목하게 함께 사는 모습은 하느님께서 주시는 축복입니다.","형제자매나 가까운 친척과 서먹해진 관계가 있나요? 화목은 저절로 오지 않습니다. 먼저 연락하고, 함께 밥을 먹는 것부터 시작해 보세요.","가족과 이웃이 화목하게 지내도록 먼저 다가가겠습니다."],
["시편 100,4","감사하며 그분의 문으로, 찬양하며 그 앞뜰로 들어가라.","성전에 들어가는 이들이 부르던 감사의 시편입니다. 하느님 앞에 나아가는 길은 감사와 찬양으로 열립니다.","기도할 때 요청만 늘어놓지 않았나요? 오늘은 기도를 감사로 시작해 보세요. 감사의 문으로 들어가면 하느님의 현존이 더 가깝게 느껴집니다.","오늘 기도를 감사로 시작하겠습니다."],
["시편 136,1","주님을 찬송하여라, 좋으신 분이시다. 그분의 자애는 영원하시다.","이 시편은 하느님의 업적을 하나하나 노래하며 매 구절마다 ‘그분의 자애는 영원하시다’를 반복합니다.","하루를 돌아보며 일어난 일마다 ‘그분의 자애는 영원하시다’를 붙여 보세요. 평범한 일들이 하느님의 선물로 보이기 시작합니다.","좋으신 주님의 영원한 자애를 노래하겠습니다."],
["에페 5,20","모든 일에 언제나 우리 주 예수 그리스도의 이름으로 하느님 아버지께 감사드리십시오.","바오로 사도는 성령으로 충만한 삶의 특징으로 감사를 꼽습니다. ‘모든 일에’ 감사하라는 것은 좋은 일만이 아니라 힘든 일 속에서도 감사를 찾으라는 뜻입니다.","불평은 나를 지치게 하고 감사는 나를 살립니다. 오늘 불평이 나오려는 순간, 그 상황 속에서 감사할 거리를 하나 찾아보세요.","불평 대신 감사를 선택하는 하루를 살겠습니다."],
["루카 17,15-16","그들 가운데 한 사람은 병이 나은 것을 보고 큰 소리로 하느님을 찬양하며 돌아와, 예수님의 발 앞에 엎드려 감사를 드렸다. 그런데 그는 사마리아 사람이었다.","나병 환자 열 명이 치유되었지만 돌아와 감사한 사람은 이방인 한 명뿐이었습니다. 예수님은 ‘아홉은 어디 있느냐?’고 물으셨습니다.","받은 은혜를 당연하게 여기면 감사를 잊습니다. 오늘 나에게 도움을 준 사람에게 직접 감사를 표현해 보세요. 돌아와 감사하는 그 한 사람이 되어 보세요.","받은 은혜를 잊지 않고 돌아와 감사하는 사람이 되겠습니다."],
["필리 4,6-7","아무것도 걱정하지 마십시오. 어떤 경우에든 감사하는 마음으로 기도하고 간구하며 여러분의 소원을 하느님께 아뢰십시오. 그러면 사람의 모든 이해를 뛰어넘는 하느님의 평화가 여러분의 마음과 생각을 그리스도 예수님 안에서 지켜 줄 것입니다.","감옥에 갇힌 바오로 사도가 쓴 편지입니다. 걱정을 기도로 바꾸고 감사를 더하면, 상황을 넘어서는 평화가 마음을 지켜 준다고 말합니다.","걱정이 꼬리에 꼬리를 물 때, 그 걱정을 하나씩 기도로 바꿔 보세요. 그리고 이미 받은 은혜에 감사를 더하세요. 상황은 그대로여도 마음은 평화로워집니다.","걱정을 기도로 바꾸고 주님의 평화에 머물겠습니다."],
["사도 2,4","그러자 그들은 모두 성령으로 가득 차, 성령께서 표현의 능력을 주시는 대로 다른 언어들로 말하기 시작하였다.","성령 강림 날, 두려움에 숨어 있던 제자들이 성령을 받고 용감하게 복음을 전하기 시작했습니다. 교회가 탄생한 순간입니다.","성령은 우리에게 서로 다른 사람들과 소통하는 능력을 주십니다. 세대, 생각, 문화가 다른 사람과 마음을 나누기 어려울 때 성령의 도우심을 청해 보세요.","성령의 도우심으로 다른 이들과 마음을 나누겠습니다."],
["요한 14,26","보호자, 곧 아버지께서 내 이름으로 보내실 성령께서 너희에게 모든 것을 가르치시고 내가 너희에게 말한 모든 것을 기억하게 해 주실 것이다.","예수님은 떠나시며 제자들을 고아로 버려두지 않고 성령을 보내 주시겠다고 약속하셨습니다. 성령은 우리를 가르치시고 예수님의 말씀을 떠올리게 하십니다.","중요한 순간에 갑자기 떠오르는 말씀이나 깨달음이 있다면 그것이 성령의 도우심일 수 있습니다. 결정하기 어려운 일이 있다면 ‘성령님, 저를 가르쳐 주십시오’라고 기도해 보세요.","나를 가르치시는 성령께 귀 기울이겠습니다."],
["갈라 5,22-23","성령의 열매는 사랑, 기쁨, 평화, 인내, 호의, 선의, 성실, 온유, 절제입니다.","바오로 사도는 성령께서 우리 안에서 맺으시는 아홉 가지 열매를 소개합니다. 이 열매들은 노력만으로 만들어지는 것이 아니라 성령과 함께할 때 자연스럽게 맺힙니다.","아홉 가지 열매 중 지금 나에게 가장 필요한 것은 무엇인가요? 오늘 그 열매 하나를 골라 성령께 청하고, 의식적으로 실천해 보세요.","오늘 성령의 열매 하나를 정해 정성껏 맺겠습니다."],
["로마 8,26","성령께서도 나약한 우리를 도와주십니다. 우리는 올바르게 기도할 줄 모르지만, 성령께서 몸소 말로 다 할 수 없이 탄식하시며 우리를 대신하여 간구해 주십니다.","기도할 말을 찾지 못할 때에도 성령께서 우리 안에서 대신 기도해 주신다는 위로의 말씀입니다.","너무 아프거나 혼란스러워 기도조차 할 수 없을 때가 있습니다. 그때는 그저 하느님 앞에 머물러 있기만 해도 됩니다. 성령께서 내 마음을 대신 아뢰어 주십니다.","말이 나오지 않을 때도 성령께 맡기고 주님 앞에 머물겠습니다."],
["1코린 12,4-5","은사는 여러 가지지만 성령은 같은 성령이십니다. 직분은 여러 가지지만 주님은 같은 주님이십니다.","코린토 교회는 은사를 두고 서로 비교하며 다투었습니다. 바오로 사도는 모든 은사가 같은 성령에게서 왔으며 공동체를 위해 주어졌다고 말합니다.","남의 재능을 부러워하거나 내 재능을 뽐낼 필요가 없습니다. 각자 받은 은사는 다르지만 모두 소중합니다. 내가 받은 은사를 공동체를 위해 어떻게 쓸 수 있을지 생각해 보세요.","내가 받은 은사를 감사히 여기고 공동체를 위해 쓰겠습니다."],
["1코린 12,26","한 지체가 고통을 겪으면 모든 지체가 함께 고통을 겪습니다. 한 지체가 존경을 받으면 모든 지체가 함께 기뻐합니다.","교회를 한 몸에 비유한 바오로 사도의 가르침입니다. 우리는 서로 연결되어 있어 한 사람의 아픔과 기쁨이 모두의 것이 됩니다.","남의 아픔에 무관심하고 남의 성공에 질투하기 쉬운 세상입니다. 오늘 누군가의 기쁜 소식에 진심으로 축하하고, 아픈 소식에 진심으로 함께 아파해 보세요.","이웃의 아픔과 기쁨을 내 것처럼 함께하겠습니다."],
["1코린 3,16","여러분이 하느님의 성전이고 하느님의 영께서 여러분 안에 계시다는 사실을 모릅니까?","바오로 사도는 우리 각자가, 그리고 공동체 전체가 하느님께서 머무시는 성전이라고 말합니다.","내 몸과 마음이 하느님의 성전이라면 함부로 대할 수 없습니다. 충분한 휴식, 건강한 식사, 맑은 생각으로 나를 돌보는 것도 신앙입니다. 다른 사람도 하느님의 성전으로 존중해 주세요.","하느님의 성전인 나와 이웃을 소중히 돌보겠습니다."],
["루카 1,41-42","엘리사벳이 마리아의 인사말을 들을 때 그의 태 안에서 아기가 뛰놀았다. 엘리사벳은 성령으로 가득 차 큰 소리로 외쳤다. ‘당신은 여인들 가운데에서 가장 복되시며 당신 태중의 아기도 복되십니다.’","오늘은 성모 방문 축일입니다. 임신한 마리아가 먼 길을 달려가 나이 든 친척 엘리사벳을 도우러 갔을 때, 두 여인과 태중의 아기들까지 기쁨으로 만났습니다.","성모님은 자신도 힘든 상황에서 먼저 다른 사람을 찾아가셨습니다. 기쁨은 서로 방문하고 나눌 때 커집니다. 오늘 찾아가거나 연락해야 할 사람이 떠오른다면 미루지 마세요.","성모님처럼 먼저 찾아가 기쁨을 나누겠습니다."]
];

D[6]=[
["요한 6,51","나는 하늘에서 내려온 살아 있는 빵이다. 누구든지 이 빵을 먹으면 영원히 살 것이다.","예수님은 당신 자신을 하늘에서 내려온 빵이라고 하시며 성체성사를 예고하셨습니다. 6월은 예수 성심 성월로, 성체와 성심 안에 담긴 주님의 사랑을 묵상하는 달입니다.","미사에서 성체를 모시는 것이 습관이 되면 그 의미를 잊기 쉽습니다. 다음 미사에서는 성체를 모시기 전 잠시 눈을 감고, 하늘에서 내려오신 주님을 맞이한다는 마음을 새롭게 해 보세요.","살아 있는 빵이신 주님을 정성껏 모시겠습니다."],
["1코린 11,24","이는 너희를 위한 내 몸이다. 너희는 나를 기억하여 이를 행하여라.","바오로 사도가 전하는 최후의 만찬 말씀으로, 미사의 성찬 기도에서 매번 반복됩니다. ‘기억하다’는 과거를 회상하는 것을 넘어 그 사건을 현재로 살아 내는 것입니다.","예수님은 ‘너희를 위한’ 몸을 내어 주셨습니다. 우리도 누군가를 위해 내 시간과 힘을 내어 줄 때 성체성사를 삶으로 사는 것입니다. 오늘 가족을 위해 무언가를 기꺼이 내어 주세요.","나를 위해 내어 주신 주님을 기억하며 나도 내어 주겠습니다."],
["마태 11,29","나는 마음이 온유하고 겸손하니 내 멍에를 메고 나에게 배워라. 그러면 너희가 안식을 얻을 것이다.","예수님께서 당신의 마음을 직접 소개하신 유일한 구절입니다. 예수 성심 공경은 바로 이 온유하고 겸손한 마음을 닮는 것입니다.","온유함은 약함이 아니라 절제된 힘입니다. 겸손은 나를 낮추는 것이 아니라 정확히 보는 것입니다. 오늘 화가 나는 순간, 예수님의 온유한 마음을 떠올려 보세요.","온유하고 겸손하신 주님의 마음을 배우겠습니다."],
["요한 19,34","군사 하나가 창으로 그분의 옆구리를 찔렀다. 그러자 곧 피와 물이 흘러나왔다.","교회는 십자가 위 예수님의 열린 옆구리에서 흘러나온 피와 물을 성체성사와 세례성사의 상징으로 보았습니다. 찔린 성심은 사랑의 샘이 되었습니다.","상처받은 자리가 오히려 사랑의 샘이 될 수 있습니다. 내 상처를 통해 다른 사람의 아픔을 더 깊이 이해하게 되었다면, 그 상처는 이미 은총이 되고 있는 것입니다.","주님의 찔린 성심을 바라보며 내 상처도 사랑으로 바뀌기를 청하겠습니다."],
["시편 24,1","주님의 것이라네, 세상과 그 안에 가득 찬 것들 누리와 그 안에 사는 것들.","세상의 참 주인은 하느님이시라는 고백입니다. 오늘은 세계 환경의 날입니다. 우리는 땅의 주인이 아니라 하느님의 피조물을 돌보는 관리자입니다.","내 것이라고 생각했던 것들이 모두 하느님께 받은 것이라면 함부로 쓸 수 없습니다. 오늘 물과 전기를 아끼고, 장바구니를 챙기는 작은 실천을 해 보세요.","하느님의 것인 세상을 아끼고 돌보겠습니다."],
["지혜 3,1","의인들의 영혼은 하느님의 손안에 있어 어떠한 고통도 겪지 않으리라.","의롭게 살다 세상을 떠난 이들의 영혼은 하느님께서 품어 주신다는 위로의 말씀입니다. 현충일, 나라와 이웃을 위해 목숨 바친 이들을 기억합니다.","오늘 우리가 누리는 평화는 누군가의 희생 위에 있습니다. 잠시 묵념하며 그분들의 영원한 안식을 위해 기도해 보세요. 그리고 그 희생에 부끄럽지 않은 하루를 살아 봅시다.","나라와 이웃을 위해 희생하신 분들을 기억하며 기도하겠습니다."],
["마태 6,26","하늘의 새들을 눈여겨보아라. 그것들은 씨를 뿌리지도 않고 거두지도 않을 뿐만 아니라 곳간에 모아들이지도 않는다. 그러나 하늘의 너희 아버지께서는 그것들을 먹여 주신다. 너희는 그것들보다 더 귀하지 않으냐?","예수님은 걱정에 사로잡힌 사람들에게 새들을 보라고 하십니다. 새도 먹이시는 하느님께서 당신 자녀를 돌보지 않으실 리 없습니다.","오늘 출근길이나 산책길에 새를 한번 바라보세요. 걱정 없이 날아다니는 새를 보며 나를 돌보시는 하느님을 떠올려 보세요. 나는 새보다 훨씬 귀한 존재입니다.","새들도 먹이시는 아버지의 돌보심을 믿고 걱정을 내려놓겠습니다."],
["마태 6,28-29","들에 핀 나리꽃들이 어떻게 자라는지 지켜보아라. 그것들은 애쓰지도 않고 길쌈도 하지 않는다. 그러나 내가 너희에게 말한다. 솔로몬도 그 온갖 영화 속에서 이 꽃 하나만큼 차려입지 못하였다.","들꽃은 스스로 꾸미지 않아도 하느님께서 아름답게 입혀 주십니다. 예수님은 외모와 소유에 대한 걱정을 내려놓으라고 하십니다.","좋은 옷, 좋은 차로 나를 증명하려 애쓰지 않아도 됩니다. 하느님께서 이미 나를 아름답게 지으셨습니다. 길가의 들꽃을 보며 있는 그대로의 나를 받아들여 보세요.","있는 그대로의 나를 아름답게 지으신 주님께 감사하겠습니다."],
["2코린 12,9","너는 내 은총을 넉넉히 받았다. 나의 힘은 약한 데에서 완전히 드러난다.","바오로 사도는 ‘몸의 가시’를 없애 달라고 세 번이나 기도했지만, 하느님께서는 이렇게 응답하셨습니다. 약함은 하느님의 힘이 드러나는 자리가 됩니다.","약점을 숨기고 강한 척하느라 지치지 않았나요? 약함을 인정할 때 오히려 하느님과 사람들의 도움이 들어올 자리가 생깁니다. 오늘 내 약함을 주님께 솔직히 맡겨 보세요.","나의 약함 속에서 드러나는 주님의 힘을 믿겠습니다."],
["에페 2,8","여러분은 믿음을 통하여 은총으로 구원을 받았습니다. 이는 여러분에게서 나오는 것이 아니라 하느님의 선물입니다.","구원은 우리가 노력해서 얻는 보상이 아니라 하느님께서 거저 주시는 선물입니다. 우리의 선행은 구원의 조건이 아니라 받은 은총에 대한 응답입니다.","무언가를 해내야만 가치 있다고 느끼는 성과 중심의 삶에 지쳐 있지 않나요? 하느님 앞에서 나는 이미 선물을 받은 사람입니다. 그 사실을 기억하며 감사로 하루를 살아 보세요.","거저 받은 은총에 감사로 응답하겠습니다."],
["마태 10,8","거저 받았으니 거저 주어라.","예수님께서 제자들을 파견하시며 하신 말씀입니다. 생명, 재능, 사랑, 신앙 모두 우리가 거저 받은 것입니다.","계산하며 주고받는 관계에 익숙한 세상입니다. 하지만 내가 받은 것들을 돌아보면 대부분 거저 받은 것입니다. 오늘 대가를 바라지 않고 내 재능이나 시간을 나눠 보세요.","거저 받은 것을 계산 없이 나누겠습니다."],
["루카 10,41-42","마르타야, 마르타야! 너는 많은 일을 염려하고 걱정하는구나. 그러나 필요한 것은 한 가지뿐이다. 마리아는 좋은 몫을 택하였다. 그리고 그것을 빼앗기지 않을 것이다.","예수님을 대접하느라 분주한 마르타와 예수님 발치에 앉아 말씀을 듣는 마리아의 이야기입니다. 봉사도 중요하지만 주님과 함께 머무는 시간이 먼저입니다.","할 일 목록에 쫓겨 정작 중요한 것을 놓치고 있지 않나요? 바쁠수록 주님 앞에 앉아 머무는 시간이 필요합니다. 오늘 해야 할 일 하나를 미루고 그 시간에 기도해 보세요.","분주함 속에서도 주님 곁에 머무는 좋은 몫을 택하겠습니다."],
["루카 15,4","너희 가운데 어떤 사람이 양 백 마리를 가지고 있었는데 그 가운데에서 한 마리를 잃으면, 아흔아홉 마리를 광야에 놓아두고 잃은 양을 찾을 때까지 뒤쫓아 가지 않느냐?","하느님께는 한 사람 한 사람이 모두 소중합니다. 오늘은 잃은 것을 찾는 이들의 수호성인인 파도바의 성 안토니오 기념일입니다.","효율을 따지면 한 마리를 위해 아흔아홉 마리를 두고 가는 것은 손해입니다. 하지만 하느님의 사랑은 계산하지 않습니다. 공동체에서 떠난 사람이 있다면 먼저 연락해 보세요.","한 사람을 소중히 여기시는 주님처럼 떠난 이를 찾아가겠습니다."],
["마르 4,26-27","하느님의 나라는 이와 같다. 어떤 사람이 땅에 씨를 뿌려 놓으면, 밤에 자고 낮에 일어나고 하는 사이에 씨는 싹이 트고 자라는데, 그 사람은 어떻게 그리되는지 모른다.","씨앗은 농부가 잠든 사이에도 스스로 자랍니다. 하느님 나라도 우리가 다 알지 못하는 방식으로 조용히 자라납니다.","자녀 교육, 신앙생활, 좋은 습관… 당장 결과가 보이지 않아 조급해질 때가 있습니다. 씨를 뿌렸다면 이제 하느님께서 키우시도록 맡기세요. 성장은 보이지 않는 곳에서 일어납니다.","뿌린 씨앗을 주님께 맡기고 조급해하지 않겠습니다."],
["마태 13,31-32","하늘 나라는 겨자씨와 같다. 어떤 사람이 그것을 가져다가 자기 밭에 뿌렸다. 겨자씨는 어떤 씨앗보다도 작지만, 자라면 어떤 풀보다도 커져 나무가 되고 하늘의 새들이 와서 그 가지에 깃들인다.","가장 작은 씨앗이 새들이 쉬는 나무가 됩니다. 하느님 나라는 작고 보잘것없어 보이는 데서 시작하여 놀랍게 자라납니다.","내가 하는 선행이 너무 작아 의미가 없다고 느껴질 때가 있습니다. 하지만 작은 친절 하나가 누군가에게 쉼터가 됩니다. 오늘 작지만 진심 어린 선행 하나를 심어 보세요.","작은 겨자씨 같은 선행을 오늘 심겠습니다."],
["루카 16,10","아주 작은 일에 성실한 사람은 큰일에도 성실하고, 아주 작은 일에 불의한 사람은 큰일에도 불의하다.","예수님은 사람의 됨됨이가 작은 일에서 드러난다고 하십니다. 신뢰는 거창한 일이 아니라 사소한 일의 성실함으로 쌓입니다.","약속 시간 지키기, 작은 거짓말 하지 않기, 아무도 보지 않을 때 쓰레기 줍기… 이런 작은 일이 나를 만듭니다. 오늘 작은 일 하나에 온 정성을 다해 보세요.","작은 일에 성실한 사람이 되겠습니다."],
["마태 25,40","너희가 내 형제들인 이 가장 작은 이들 가운데 하나에게 해 준 것이 바로 나에게 해 준 것이다.","최후의 심판 비유에서 예수님은 굶주린 이, 목마른 이, 나그네, 헐벗은 이, 병든 이, 감옥에 갇힌 이와 당신을 동일시하십니다.","예수님을 만나고 싶다면 가장 작은 이들 곁으로 가면 됩니다. 노숙인, 외로운 어르신, 아픈 이웃의 얼굴에서 예수님을 발견해 보세요. 오늘 그런 이웃을 위해 작은 일을 해 보세요.","가장 작은 이들 안에 계신 주님을 섬기겠습니다."],
["루카 10,36-37","‘너는 이 세 사람 가운데에서 누가 강도를 만난 사람에게 이웃이 되어 주었다고 생각하느냐?’ 율법 교사가 ‘그에게 자비를 베푼 사람입니다.’ 하자, 예수님께서 그에게 이르셨다. ‘가서 너도 그렇게 하여라.’","‘착한 사마리아인의 비유’의 결론입니다. 예수님은 ‘누가 내 이웃인가?’라는 질문을 ‘나는 누구의 이웃이 되어 주는가?’로 바꾸십니다.","이웃은 정해져 있는 것이 아니라 내가 다가갈 때 만들어집니다. 오늘 도움이 필요한 사람을 보면 지나치지 말고 멈춰 보세요. ‘가서 너도 그렇게 하여라’는 오늘 나에게 하시는 말씀입니다.","도움이 필요한 이를 지나치지 않고 이웃이 되어 주겠습니다."],
["야고 2,17","믿음에 실천이 없으면 그러한 믿음은 그 자체로 죽은 것입니다.","야고보 사도는 말로만 하는 신앙을 날카롭게 비판합니다. 헐벗고 굶주린 형제에게 ‘평안히 가서 몸을 녹이고 배불리 먹으시오’ 하고 말만 하면 무슨 소용이 있느냐고 묻습니다.","신앙은 머리와 입이 아니라 손과 발로 완성됩니다. 오늘 내 믿음을 보여 줄 수 있는 구체적인 행동 하나를 정해 실천해 보세요.","오늘 믿음을 구체적인 실천으로 보여 주겠습니다."],
["레위 19,34","너희와 함께 사는 이방인을 너희 본토인처럼 여겨야 한다. 그를 너희 자신처럼 사랑해야 한다. 너희도 이집트 땅에서 이방인이었다.","오늘은 세계 난민의 날입니다. 하느님은 이스라엘에게 그들도 한때 이방인이었음을 기억하며 나그네를 사랑하라고 명하셨습니다.","우리 사회에도 이주민, 다문화 가정, 난민들이 함께 살고 있습니다. 그들도 누군가의 소중한 가족입니다. 낯선 이웃에게 따뜻한 인사 한마디를 건네 보세요.","낯선 이웃을 나처럼 존중하고 환대하겠습니다."],
["히브 13,2","손님 접대를 소홀히 하지 마십시오. 어떤 이들은 손님 접대를 하다가 모르는 사이에 천사들을 접대하기도 하였습니다.","아브라함이 낯선 나그네 셋을 정성껏 대접했는데 그들이 하느님의 사자였던 이야기를 떠올리게 하는 말씀입니다.","내가 만나는 사람 중 누가 하느님의 선물일지 모릅니다. 오늘 만나는 모든 사람을 귀한 손님처럼 대해 보세요. 식당 직원, 택배 기사님께도 따뜻한 감사를 건네 보세요.","오늘 만나는 이들을 귀한 손님처럼 대하겠습니다."],
["마태 5,9","행복하여라, 평화를 이루는 사람들! 그들은 하느님의 자녀라 불릴 것이다.","예수님은 평화를 바라는 사람이 아니라 평화를 ‘이루는’ 사람이 행복하다고 하십니다. 평화는 적극적으로 만들어 가는 것입니다.","갈등을 피하는 것과 평화를 이루는 것은 다릅니다. 다툼이 있는 곳에서 화해의 다리를 놓고, 오해를 풀어 주는 사람이 되어 보세요. 그것이 하느님 자녀의 모습입니다.","갈등이 있는 곳에서 평화를 이루는 사람이 되겠습니다."],
["마태 5,7","행복하여라, 자비로운 사람들! 그들은 자비를 입을 것이다.","자비는 남의 고통을 내 것처럼 느끼고 행동하는 마음입니다. 자비를 베푸는 사람은 하느님의 자비를 더 깊이 체험하게 됩니다.","남의 실수에 엄격했던 기준을 오늘은 조금 느슨하게 해 보세요. 내가 베푼 자비는 결국 나에게 돌아옵니다. 하느님은 자비로운 마음을 가장 기뻐하십니다.","오늘 내가 받은 자비만큼 자비를 베풀겠습니다."],
["요한 3,30","그분은 커지셔야 하고 나는 작아져야 한다.","오늘은 세례자 요한 탄생 대축일입니다. 많은 사람이 따르던 요한은 예수님이 오시자 기꺼이 물러나며 이렇게 고백했습니다.","자기를 드러내고 인정받고 싶은 마음은 누구에게나 있습니다. 요한처럼 다른 사람을 빛나게 하고 나는 뒤로 물러나는 겸손은 참된 위대함입니다. 오늘 누군가를 앞세워 주세요.","주님과 이웃이 드러나도록 기꺼이 작아지겠습니다."],
["마태 5,44","원수를 사랑하고 너희를 박해하는 자들을 위하여 기도하여라.","예수님 가르침 중 가장 어려운 말씀입니다. 한국 교회는 6월 25일을 ‘민족의 화해와 일치를 위한 기도의 날’로 지내며 분단된 민족을 위해 기도합니다.","원수를 사랑하는 것은 감정이 아니라 선택입니다. 미워하는 마음이 들어도 그를 위해 기도할 수는 있습니다. 오늘 한반도의 평화와 내가 용서하기 힘든 사람을 위해 기도해 보세요.","미움 대신 기도를 선택하며 화해와 평화를 청하겠습니다."],
["시편 85,11","자애와 진실이 서로 만나고 정의와 평화가 입 맞추리라.","하느님께서 회복시키실 세상의 아름다운 모습을 노래합니다. 사랑과 진실, 정의와 평화는 서로 떨어질 수 없습니다.","진실 없는 사랑은 맹목이 되고, 사랑 없는 진실은 상처가 됩니다. 오늘 누군가에게 진실을 말해야 한다면 사랑을 담아 말해 보세요.","진실을 사랑으로 전하고 정의 안에서 평화를 이루겠습니다."],
["마태 5,8","행복하여라, 마음이 깨끗한 사람들! 그들은 하느님을 볼 것이다.","깨끗한 마음이란 숨은 의도 없이 하느님과 이웃을 향해 열려 있는 마음입니다. 그런 마음을 가진 사람은 모든 것 안에서 하느님을 봅니다.","무엇을 보고 듣느냐가 마음을 만듭니다. 오늘 하루 마음을 어지럽히는 영상이나 험담을 멀리하고, 아름답고 선한 것에 마음을 두어 보세요.","깨끗한 마음으로 모든 것 안에서 주님을 뵙겠습니다."],
["마태 5,5","행복하여라, 온유한 사람들! 그들은 땅을 차지할 것이다.","세상은 힘센 사람이 땅을 차지한다고 하지만 예수님은 온유한 사람이 땅을 차지한다고 하십니다. 온유함은 하느님께 자신을 맡긴 사람의 부드러운 힘입니다.","강하게 밀어붙여야 이긴다고 생각하나요? 오래 남는 관계와 신뢰는 온유함에서 나옵니다. 오늘 목소리를 높이고 싶을 때 한 번 더 부드럽게 말해 보세요.","부드러운 힘인 온유함으로 사람들을 대하겠습니다."],
["2티모 4,7","나는 훌륭한 싸움을 하였고 달릴 길을 다 달렸으며 믿음을 지켰습니다.","오늘은 성 베드로와 성 바오로 사도 대축일입니다. 바오로 사도가 순교를 앞두고 자신의 생애를 돌아보며 남긴 고백입니다.","인생을 마칠 때 이렇게 말할 수 있다면 얼마나 좋을까요? 완벽하게 사는 것이 아니라 끝까지 포기하지 않고 믿음을 지키는 것이 중요합니다. 오늘도 내 길을 성실히 달려 보세요.","두 사도처럼 끝까지 믿음을 지키며 내 길을 달리겠습니다."],
["마태 14,31","예수님께서 곧 손을 내밀어 그를 붙잡으시고, ‘이 믿음이 약한 자야, 왜 의심하였느냐?’ 하고 말씀하셨다.","물 위를 걸어오라는 예수님의 말씀에 베드로는 배에서 내렸지만, 거센 바람을 보고 두려워 빠지기 시작했습니다. 그때 예수님은 ‘곧’ 손을 내밀어 붙잡아 주셨습니다.","믿음으로 시작했다가 상황을 보고 흔들리는 것이 우리 모습입니다. 그래도 괜찮습니다. 빠져들 때 ‘주님, 살려 주십시오’ 하고 외치면 예수님은 곧 손을 내밀어 주십니다.","흔들릴 때마다 손 내미시는 주님을 붙잡겠습니다."]
];

D[7]=[
["마르 6,31","너희는 따로 외딴곳으로 가서 좀 쉬어라.","파견에서 돌아온 제자들이 너무 바빠 음식을 먹을 겨를도 없자 예수님께서 하신 말씀입니다. 예수님은 일만큼 쉼도 소중히 여기셨습니다.","쉬는 것에 죄책감을 느끼는 사람이 많습니다. 하지만 쉼은 게으름이 아니라 하느님께서 주신 선물입니다. 한 해의 후반부를 시작하는 오늘, 나를 위한 쉼의 시간을 계획해 보세요.","주님께서 권하시는 쉼을 감사히 누리겠습니다."],
["창세 2,2-3","하느님께서는 하시던 일을 이렛날에 다 이루셨다. 그분께서는 하시던 일을 다 하시고 이렛날에 쉬셨다. 하느님께서 이렛날에 복을 내리시고 그날을 거룩하게 하셨다.","하느님께서도 창조를 마치고 쉬셨습니다. 쉼은 창조의 완성이며, 하느님께서 복을 주신 거룩한 시간입니다.","끝없이 일하는 문화 속에서 주일의 쉼은 ‘나는 일하는 기계가 아니라 하느님의 자녀’라는 고백입니다. 이번 주일에는 일을 내려놓고 하느님과 가족과 함께하는 시간을 가져 보세요.","주일을 거룩하게 지내며 하느님 안에서 쉬겠습니다."],
["요한 20,28","저의 주님, 저의 하느님!","오늘은 성 토마스 사도 축일입니다. 의심하던 토마스는 부활하신 예수님의 상처를 보고 복음서에서 가장 깊은 신앙 고백을 했습니다.","미사 중 성체를 들어 올릴 때 마음속으로 ‘저의 주님, 저의 하느님!’ 하고 고백하는 전통이 있습니다. 의심을 지나온 신앙은 더 단단해집니다. 오늘 이 짧은 고백을 자주 되뇌어 보세요.","의심을 넘어 ‘저의 주님, 저의 하느님!’ 하고 고백하겠습니다."],
["시편 23,4","제가 비록 어둠의 골짜기를 간다 하여도 재앙을 두려워하지 않으리니 당신께서 저와 함께 계시기 때문입니다. 당신의 막대와 지팡이가 저에게 위안을 줍니다.","목자 시편의 가운데 구절입니다. 시인은 어둠의 골짜기를 피할 수 있다고 하지 않고, 그곳에서도 함께하시는 분이 계시기에 두렵지 않다고 고백합니다.","인생에서 어두운 골짜기를 피할 수는 없습니다. 하지만 혼자 걷지 않습니다. 지금 어려운 시기를 지나고 있다면 이 구절을 천천히 읽으며 함께 걸으시는 주님을 느껴 보세요.","어둠의 골짜기에서도 함께하시는 주님을 믿고 걷겠습니다."],
["시편 127,1","주님께서 집을 지어 주지 않으시면 그 짓는 이들의 수고가 헛되리라.","인간의 노력만으로는 참된 성취를 이룰 수 없다는 지혜의 시편입니다. 모든 일의 기초는 하느님이셔야 합니다.","열심히 일하는 것은 좋지만 하느님 없이 쌓은 것은 쉽게 무너집니다. 가정, 일, 계획의 기초에 하느님을 모셔 보세요. 일을 시작하기 전 짧은 기도부터 해 보세요.","모든 일의 기초에 주님을 모시겠습니다."],
["코헬 4,9-10","둘이 하나보다 낫다. 그들의 수고에 대한 좋은 보상이 있기 때문이다. 그들이 넘어지면 하나가 다른 하나를 일으켜 세운다. 그러나 외톨이가 넘어지면 그에게는 불행이다. 그를 일으켜 줄 다른 사람이 없기 때문이다.","코헬렛은 홀로 사는 삶의 허무함과 함께하는 삶의 가치를 대비합니다. 사람은 서로 기대고 일으켜 주며 살도록 지어졌습니다.","혼자서 다 해내려 하지 마세요. 도움을 청하는 것은 약함이 아니라 지혜입니다. 그리고 넘어진 누군가가 있다면 손을 내밀어 일으켜 주세요.","혼자가 아닌 함께 서로를 일으켜 주며 살겠습니다."],
["잠언 16,3","네가 하는 일을 주님께 맡겨라. 그러면 네 계획이 이루어진다.","내 계획을 하느님께 맡길 때 그 계획이 하느님의 뜻 안에서 견고해진다는 잠언입니다.","새로운 프로젝트나 결정을 앞두고 있다면 먼저 하느님께 봉헌해 보세요. 맡긴다는 것은 손을 놓는 것이 아니라 최선을 다하되 결과를 하느님께 신뢰하는 것입니다.","오늘 하는 일을 먼저 주님께 맡기고 시작하겠습니다."],
["잠언 16,9","사람의 마음은 제 길을 계획하지만 그의 발걸음을 이끄시는 분은 주님이시다.","계획은 사람이 세우지만 실제 걸음을 인도하시는 분은 하느님이시라는 지혜입니다.","계획대로 되지 않아 낙심할 때가 있습니다. 하지만 돌아보면 예상치 못한 길이 더 좋은 길이었던 경험이 있지 않나요? 오늘 계획이 틀어지더라도 그 안에서 주님의 인도를 찾아보세요.","계획이 틀어져도 나의 걸음을 이끄시는 주님을 신뢰하겠습니다."],
["로마 12,12","희망 속에 기뻐하고 환난 중에 인내하며 기도에 전념하십시오.","바오로 사도가 그리스도인의 삶을 짧게 정리한 구절입니다. 희망, 인내, 기도는 서로를 붙들어 주는 세 개의 기둥입니다.","힘든 시기에는 기쁨도 사라지고 기도도 멀어지기 쉽습니다. 하지만 그럴 때일수록 희망을 붙들고 기도에 전념해야 합니다. 오늘 하루 정해진 시간에 짧게라도 기도해 보세요.","희망 속에 기뻐하고, 인내하며, 기도하겠습니다."],
["야고 1,2-4","나의 형제 여러분, 갖가지 시련에 빠지게 되면 그것을 다시없는 기쁨으로 여기십시오. 여러분도 알다시피, 여러분의 믿음이 시험을 받으면 인내가 생겨납니다. 그 인내가 완전한 작용을 하도록 하십시오.","야고보 사도는 시련을 피해야 할 불행으로만 보지 않고 믿음을 성숙하게 하는 기회로 봅니다.","시련을 기뻐하기는 쉽지 않습니다. 하지만 지난 시련을 돌아보면 그때 내가 성장했음을 알 수 있습니다. 지금의 어려움도 나를 단련하는 시간이라고 생각해 보세요.","시련을 믿음이 자라는 기회로 받아들이겠습니다."],
["시편 34,15","악을 피하고 선을 행하여라. 평화를 찾아 그 뒤를 따라라.","오늘은 서방 수도 생활의 아버지 성 베네딕토 기념일입니다. 그의 수도 규칙 머리말에도 인용된 이 시편은 평화를 적극적으로 ‘추구하라’고 말합니다.","평화는 저절로 찾아오지 않습니다. 악을 피하는 소극적 노력과 선을 행하는 적극적 노력이 함께 필요합니다. 오늘 평화를 위해 내가 할 수 있는 일을 찾아 실천해 보세요.","악을 피하고 선을 행하며 평화를 찾아 따르겠습니다."],
["갈라 6,9","낙심하지 말고 계속 선을 행합시다. 포기하지 않으면 제때에 수확을 거두게 될 것입니다.","선을 행해도 알아주는 사람이 없고 결과가 보이지 않을 때 쉽게 지칩니다. 바오로 사도는 포기하지 말라고, 때가 되면 반드시 거둔다고 격려합니다.","봉사나 선행을 하다가 지쳐 그만두고 싶을 때가 있습니다. 농부가 씨를 뿌리고 기다리듯, 선행의 열매도 기다림이 필요합니다. 오늘도 낙심하지 말고 한 번 더 선을 행해 보세요.","낙심하지 않고 꾸준히 선을 행하겠습니다."],
["히브 12,1-2","우리도 온갖 짐과 우리를 쉽게 얽어매는 죄를 벗어 버리고, 우리가 달려야 할 길을 꾸준히 달려갑시다. 그러면서 우리 믿음의 영도자이시며 완성자이신 예수님을 바라봅시다.","신앙생활을 경주에 비유한 말씀입니다. 무거운 짐을 벗고, 결승점에 계신 예수님을 바라보며 꾸준히 달려가라고 권합니다.","마라톤 선수는 무거운 옷을 입지 않습니다. 나를 무겁게 하는 습관이나 죄가 있다면 벗어 버리세요. 그리고 주변이 아닌 예수님을 바라보며 내 속도로 꾸준히 달려가세요.","무거운 짐을 벗고 예수님을 바라보며 꾸준히 달리겠습니다."],
["로마 5,3-5","환난은 인내를 자아내고 인내는 수양을, 수양은 희망을 자아냅니다. 그리고 희망은 우리를 부끄럽게 하지 않습니다.","바오로 사도는 고통이 희망으로 이어지는 연결 고리를 보여 줍니다. 환난은 끝이 아니라 희망으로 가는 길의 시작입니다.","지금 겪는 어려움이 무의미하게 느껴지나요? 그 시간이 인내를 기르고, 인내가 나를 단련하며, 결국 흔들리지 않는 희망을 줄 것입니다. 오늘의 고난을 희망의 씨앗으로 받아들여 보세요.","환난 속에서도 희망으로 이어지는 길을 걷겠습니다."],
["2코린 4,8-9","우리는 온갖 환난을 겪어도 억눌리지 않고, 난관에 부딪혀도 절망하지 않으며, 박해를 받아도 버림받지 않고, 맞아 쓰러져도 멸망하지 않습니다.","바오로 사도가 겪은 수많은 고난의 고백입니다. 그는 고난이 없었다고 말하지 않고, 고난 속에서도 무너지지 않았다고 말합니다.","넘어지는 것은 실패가 아닙니다. 다시 일어나지 않는 것이 실패입니다. 지금 힘들다면 ‘나는 억눌려도 절망하지 않는다’고 소리 내어 말해 보세요. 질그릇 같은 나를 하느님께서 붙들고 계십니다.","쓰러져도 다시 일어서며 절망하지 않겠습니다."],
["2코린 4,16","그러므로 우리는 낙심하지 않습니다. 우리의 외적 인간은 쇠퇴해 가더라도 우리의 내적 인간은 나날이 새로워집니다.","몸은 늙고 약해지지만 영혼은 날마다 새로워질 수 있다는 희망의 말씀입니다. 오늘은 가르멜 산의 복되신 동정 마리아 기념일입니다.","나이 들어 가는 것이 두려울 수 있습니다. 하지만 외모와 체력은 줄어도 지혜와 사랑과 신앙은 날마다 깊어질 수 있습니다. 오늘 나의 내면을 새롭게 하는 시간을 가져 보세요.","겉사람은 낡아져도 속사람은 날마다 새로워지게 하겠습니다."],
["시편 30,6","저녁에는 울음이 깃들지라도 아침에는 환호하게 되리라.","병에서 회복된 시인의 감사 노래입니다. 슬픔의 밤은 영원하지 않고 반드시 기쁨의 아침이 온다는 약속입니다.","지금 울고 있는 밤을 보내고 있나요? 밤이 아무리 길어도 아침은 옵니다. 오늘 밤 잠들기 전 이 구절을 읽고 내일 아침의 희망을 품어 보세요.","슬픔의 밤 뒤에 오는 기쁨의 아침을 믿겠습니다."],
["시편 55,23","네 근심을 주님께 맡겨라. 그분께서 너를 붙들어 주시리라. 의인이 흔들림을 결코 내버려 두지 않으시리라.","가까운 친구에게 배신당한 아픔 속에서 시인은 근심을 하느님께 던져 맡기라고 스스로를 다독입니다.","근심을 혼자 끌어안고 있으면 점점 무거워집니다. 종이에 근심거리를 적어 보고, 하나씩 하느님께 맡기는 기도를 해 보세요. 맡긴 근심은 다시 가져오지 마세요.","오늘의 근심을 주님께 맡기고 붙들어 주심을 믿겠습니다."],
["1베드 5,7","여러분의 모든 걱정을 그분께 내맡기십시오. 그분께서 여러분을 돌보고 계십니다.","베드로 사도는 겸손에 대해 말한 뒤 이 말씀을 덧붙입니다. 걱정을 하느님께 맡기는 것은 내가 모든 것을 통제할 수 없음을 인정하는 겸손입니다.","‘모든’ 걱정입니다. 하느님께 너무 사소하거나 너무 큰 걱정은 없습니다. 하느님은 나를 돌보고 계십니다. 오늘 마음을 짓누르는 걱정 하나를 구체적으로 주님께 맡겨 보세요.","모든 걱정을 나를 돌보시는 주님께 맡기겠습니다."],
["마태 11,30","내 멍에는 편하고 내 짐은 가볍다.","멍에는 두 마리 소가 함께 메고 밭을 가는 도구입니다. 예수님의 멍에가 편한 것은 그분이 함께 메어 주시기 때문입니다.","삶의 짐을 혼자 지고 있다고 느끼나요? 예수님은 짐을 없애 주시는 대신 함께 메어 주십니다. 오늘 무거운 일을 할 때 주님과 함께 멍에를 메고 있다고 생각해 보세요.","주님과 함께 멍에를 메며 오늘의 짐을 가볍게 지겠습니다."],
["시편 121,1-2","눈을 들어 산을 바라본다. 내 도움은 어디서 오리오? 내 도움은 주님에게서 오느니 하늘과 땅을 만드신 분이시다.","예루살렘으로 순례를 떠나는 이들이 부르던 노래입니다. 험한 산길을 바라보며 두려워하지만, 도움은 산을 만드신 분에게서 온다고 고백합니다.","휴가철, 산이나 바다를 바라볼 기회가 있다면 그 자연을 만드신 분을 떠올려 보세요. 그리고 내가 의지하는 도움이 어디서 오는지 생각해 보세요.","하늘과 땅을 만드신 주님께 도움을 청하겠습니다."],
["요한 20,16","예수님께서 ‘마리아야!’ 하고 부르시자, 마리아는 돌아서서 히브리 말로 ‘라뿌니!’ 하고 불렀다. 이는 ‘스승님!’이라는 뜻이다.","오늘은 성녀 마리아 막달레나 축일입니다. 무덤가에서 울던 마리아는 동산지기인 줄 알았던 분이 자기 이름을 부르시는 순간 부활하신 예수님을 알아보았습니다.","예수님은 우리 각자의 이름을 부르십니다. 군중 속의 한 사람이 아니라 이름을 가진 소중한 한 사람으로 나를 아십니다. 오늘 주님께서 내 이름을 부르시는 소리에 귀 기울여 보세요.","내 이름을 부르시는 주님께 ‘스승님!’ 하고 응답하겠습니다."],
["루카 5,5","스승님, 저희가 밤새도록 애썼지만 한 마리도 잡지 못하였습니다. 그러나 스승님의 말씀대로 제가 그물을 내리겠습니다.","밤새 허탕을 친 어부 시몬이 예수님의 말씀을 믿고 다시 그물을 내렸을 때, 그물이 찢어질 만큼 많은 고기가 잡혔습니다.","최선을 다했는데 결과가 없어 지쳤나요? ‘그러나 말씀대로’라는 시몬의 고백을 기억하세요. 내 경험과 판단보다 주님의 말씀을 믿고 한 번 더 그물을 내려 보세요.","지쳐도 ‘말씀대로’ 다시 한번 그물을 내리겠습니다."],
["마르 6,50","용기를 내어라. 나다. 두려워하지 마라.","거센 바람 속에서 노를 젓느라 애쓰던 제자들에게 예수님께서 물 위를 걸어오시며 하신 말씀입니다. ‘나다’라는 말씀에는 하느님의 현존이 담겨 있습니다.","인생의 풍랑 속에서 예수님은 멀리 계시지 않습니다. 두려움이 몰려올 때 ‘용기를 내어라, 나다’라는 음성을 떠올려 보세요. 풍랑보다 크신 분이 함께하십니다.","풍랑 속에서도 ‘나다’ 하시는 주님의 음성에 용기를 내겠습니다."],
["마르 10,45","사람의 아들은 섬김을 받으러 온 것이 아니라 섬기러 왔고, 또 많은 이들의 몸값으로 자기 목숨을 바치러 왔다.","오늘은 성 야고보 사도 축일입니다. 야고보와 요한이 높은 자리를 청하자 예수님은 당신이 오신 목적을 밝히시며 섬김의 길을 가르치셨습니다.","높은 자리에 앉으면 대접받기를 원하게 됩니다. 하지만 예수님은 가장 높으신 분이 가장 낮게 섬기셨습니다. 오늘 내가 있는 자리에서 섬길 수 있는 일을 찾아보세요.","섬기러 오신 주님을 따라 섬기는 삶을 살겠습니다."],
["시편 71,18","하느님, 늙어 백발이 될 때까지 저를 버리지 마소서. 당신 팔의 힘을 대대로 알리고 당신의 위력을 오고 오는 모든 세대에 알리오리다.","오늘은 성모 마리아의 부모인 성 요아킴과 성녀 안나 기념일이자, 교회가 정한 ‘조부모와 노인의 날’ 무렵입니다. 노년의 시인은 다음 세대에 하느님을 전하고 싶어 합니다.","어르신들의 신앙과 지혜는 다음 세대의 보물입니다. 할머니, 할아버지께 안부를 여쭙고 그분들의 신앙 이야기를 들어 보세요. 그 이야기가 소중한 유산이 됩니다.","어르신들을 공경하고 그분들의 신앙과 지혜를 이어받겠습니다."],
["이사 46,4","너희가 늙어 가도 나는 한결같다. 너희가 백발이 되어도 나는 너희를 지고 간다. 내가 만들었으니 내가 안고 간다. 내가 지고 가고 내가 구해 낸다.","하느님은 우리를 태어날 때부터 백발이 될 때까지 안고 가신다고 약속하십니다. 나이 들어 약해져도 하느님의 사랑은 변하지 않습니다.","나이가 들수록 짐이 된다는 생각에 위축될 수 있습니다. 하지만 하느님은 끝까지 나를 안고 가십니다. 또한 우리도 연로한 이웃을 그렇게 품어 드려야 합니다.","백발이 되어도 나를 안고 가시는 주님을 신뢰하겠습니다."],
["요한 6,9","여기 보리 빵 다섯 개와 물고기 두 마리를 가진 아이가 있습니다. 그러나 이렇게 많은 사람에게 그것이 무슨 소용이 있겠습니까?","오천 명이 넘는 군중 앞에서 안드레아가 한 말입니다. 보잘것없어 보이던 아이의 도시락은 예수님 손에서 모두를 배불리 먹이고도 남는 기적이 되었습니다.","‘내가 가진 것은 너무 작아서 소용없다’고 생각하나요? 예수님은 작은 것을 기꺼이 내놓는 마음을 통해 기적을 일으키십니다. 오늘 내가 가진 작은 것을 주님께 내어 드려 보세요.","작은 것이라도 기꺼이 내어 드리며 주님의 기적을 믿겠습니다."],
["요한 11,35","예수님께서는 눈물을 흘리셨다.","성경에서 가장 짧은 구절 중 하나입니다. 오늘은 성녀 마르타, 마리아와 성 라자로 기념일입니다. 친구 라자로의 무덤 앞에서 예수님은 함께 우셨습니다.","슬픔을 당한 사람에게 섣부른 위로의 말보다 함께 울어 주는 것이 더 큰 위로가 될 때가 있습니다. 예수님은 우리의 눈물을 아시고 함께 우십니다. 슬픈 이의 곁에서 함께 머물러 주세요.","슬퍼하는 이와 함께 우는 따뜻한 마음을 지니겠습니다."],
["시편 4,9","저는 평안히 자리에 누워 잠이 듭니다. 주님, 당신께서 저를 홀로 안전하게 살게 하시기 때문입니다.","교회의 끝기도(밤기도)에서 자주 바치는 시편입니다. 하루를 하느님께 맡기고 평안히 잠드는 신뢰가 담겨 있습니다.","걱정으로 잠 못 드는 밤이 많은 시대입니다. 잠들기 전 휴대전화 대신 이 구절을 읽고, 하루를 주님께 맡기는 짧은 기도를 바쳐 보세요. 잠도 하느님의 선물입니다.","오늘 밤 하루를 주님께 맡기고 평안히 잠들겠습니다."],
["1코린 10,31","먹든지 마시든지, 그리고 무슨 일을 하든지 모든 것을 하느님의 영광을 위하여 하십시오.","오늘은 예수회 창립자 성 이냐시오 데 로욜라 기념일입니다. ‘하느님의 더 큰 영광을 위하여’라는 그의 모토와 통하는 말씀입니다.","식사, 일, 공부, 운동, 쉼까지 모든 일상이 하느님의 영광을 위한 것이 될 수 있습니다. 오늘 하는 평범한 일들을 ‘주님의 영광을 위하여’라는 마음으로 해 보세요.","오늘의 모든 일상을 하느님의 영광을 위하여 하겠습니다."]
];

D[8]=[
["시편 8,4-5","우러러 당신의 하늘을 바라봅니다, 당신 손가락의 작품들을, 당신께서 굳건히 세우신 달과 별들을. 인간이 무엇이기에 당신께서 기억해 주십니까? 사람이 무엇이기에 당신께서 돌보아 주십니까?","밤하늘의 웅장함 앞에서 시인은 인간의 작음을 느끼면서도, 그런 인간을 기억하고 돌보시는 하느님의 사랑에 감탄합니다.","여름밤 하늘을 올려다볼 기회가 있다면 별을 바라보며 이 시편을 묵상해 보세요. 우주를 만드신 분이 나를 기억하신다는 사실이 얼마나 놀라운지 느껴질 것입니다.","광대한 우주 속에서도 나를 기억하시는 주님께 감사하겠습니다."],
["시편 19,2","하늘은 하느님의 영광을 이야기하고 창공은 그분 손의 솜씨를 알리네.","자연은 말없이 하느님의 위대하심을 선포한다는 시편입니다. 해와 별, 하늘과 구름이 모두 창조주의 작품입니다.","바쁘게 살다 보면 하늘을 올려다볼 일이 거의 없습니다. 오늘 잠시 멈춰 하늘을 바라보세요. 구름 한 점, 노을 한 자락에서도 하느님의 솜씨를 발견할 수 있습니다.","오늘 하늘을 올려다보며 창조주의 영광을 찬미하겠습니다."],
["시편 104,24","주님, 당신의 업적은 얼마나 많은지요! 이 모든 것을 지혜로 이루시어 세상이 당신의 조물들로 가득합니다.","창조를 찬미하는 아름다운 시편입니다. 산과 바다, 동물과 식물, 모든 생명이 하느님의 지혜로 지어졌다고 노래합니다.","우리는 자연을 자원으로만 보기 쉽습니다. 하지만 모든 생명은 하느님의 지혜가 담긴 작품입니다. 오늘 길가의 풀 한 포기, 곤충 한 마리도 소중히 바라봐 주세요.","모든 피조물 안에 담긴 주님의 지혜를 존중하겠습니다."],
["1사무 3,10","말씀하십시오. 당신 종이 듣고 있습니다.","어린 사무엘이 성전에서 잠자다 하느님의 부르심을 듣고 한 대답입니다. 오늘은 본당 신부들의 수호성인 성 요한 마리아 비안네 기념일입니다.","기도할 때 우리는 말하기에 바빠 듣는 것을 잊습니다. 오늘은 기도 시간의 절반을 침묵하며 하느님께 귀 기울여 보세요. 그리고 사제들을 위해 기도해 주세요.","말하기보다 먼저 주님의 말씀을 듣겠습니다."],
["다니 3,57","주님의 업적들아, 모두 주님을 찬미하여라. 영원히 찬송하며 드높이 찬양하여라.","불가마 속에 던져진 세 젊은이가 바친 찬미가의 시작입니다. 그들은 죽음의 위협 속에서도 모든 피조물을 불러 하느님을 찬미했습니다.","해, 달, 비, 바람, 산, 바다까지 모든 피조물을 불러 하느님을 찬미하는 이 노래는 교회의 아침 기도에서 자주 바칩니다. 오늘 내 주변의 자연을 바라보며 함께 찬미해 보세요.","모든 피조물과 함께 주님을 찬미하겠습니다."],
["마태 17,4","주님, 저희가 여기에서 지내면 좋겠습니다.","오늘은 주님의 거룩한 변모 축일입니다. 산 위에서 빛나는 예수님의 모습을 본 베드로는 그곳에 머물고 싶어 했습니다. 하지만 예수님은 다시 산 아래로 내려가셨습니다.","신앙의 감동적인 순간에 영원히 머물고 싶을 때가 있습니다. 하지만 그 빛은 산 아래 일상으로 가져가기 위해 주어집니다. 피정이나 미사에서 받은 은총을 오늘 일상에서 살아 보세요.","주님과 함께한 빛나는 순간을 일상 속으로 가져가겠습니다."],
["욥 12,7-8","그러나 짐승들에게 물어보게. 그것들이 자네를 가르치리라. 하늘의 새들에게 물어보게. 그것들이 자네에게 알려 주리라. 아니면 땅에게 말해 보게. 그것이 자네를 가르치리라.","욥은 친구들에게 자연이 하느님의 손길을 증언한다고 말합니다. 피조물은 창조주를 가르쳐 주는 스승입니다.","자연은 위대한 교과서입니다. 계절의 변화에서 인내를, 나무에서 꾸준함을, 새들에게서 자유를 배울 수 있습니다. 오늘 자연에게서 한 가지를 배워 보세요.","자연이 들려주는 하느님의 가르침에 귀 기울이겠습니다."],
["창세 9,13","내가 무지개를 구름 사이에 둘 것이니, 이것이 나와 땅 사이에 세우는 계약의 표징이 될 것이다.","대홍수 후 하느님께서 노아와 모든 생명에게 다시는 홍수로 멸하지 않겠다고 약속하시며 무지개를 그 표징으로 주셨습니다.","비가 그친 뒤 뜨는 무지개처럼, 삶의 폭풍 뒤에도 하느님의 약속은 변함없습니다. 힘든 시간이 지나간 뒤에 찾아온 작은 은총들을 떠올려 보세요.","폭풍 뒤에도 변함없는 주님의 약속을 기억하겠습니다."],
["시편 65,10","당신께서는 땅을 찾아 물을 주시고 그것을 더없이 풍요롭게 하십니다.","하느님께서 비를 내려 땅을 적시고 곡식을 자라게 하신다는 감사의 노래입니다.","우리가 먹는 음식 한 그릇에는 하느님께서 주신 비와 햇빛, 그리고 많은 사람의 수고가 담겨 있습니다. 오늘 식사 전에 그 모든 것에 감사하는 기도를 정성껏 바쳐 보세요.","땅을 풍요롭게 하시는 주님께 식탁의 은혜를 감사드리겠습니다."],
["이사 11,6","늑대가 새끼 양과 함께 살고 표범이 새끼 염소와 함께 지내리라. 송아지가 어린 사자와 더불어 살쪄 가고 어린아이가 그들을 몰고 다니리라.","메시아가 오실 때 이루어질 평화로운 세상을 그린 예언입니다. 서로 해치던 존재들이 함께 어울려 사는 완전한 화해의 모습입니다.","원수 같은 관계도 하느님 안에서 화해할 수 있습니다. 나와 맞지 않는 사람, 경쟁 관계에 있는 사람과도 평화롭게 지낼 방법을 찾아보세요.","원수였던 이들도 함께 사는 주님의 평화를 꿈꾸며 일구겠습니다."],
["창세 2,15","주 하느님께서는 사람을 데려다 에덴 동산에 두시어, 그곳을 일구고 돌보게 하셨다.","하느님께서 인간에게 맡기신 첫 번째 사명은 땅을 일구고 돌보는 것이었습니다. 오늘은 청빈의 성녀 클라라 기념일입니다.","인간은 자연의 주인이 아니라 하느님께서 맡기신 정원지기입니다. 오늘 베란다의 화분에 물을 주거나 쓰레기를 분리배출하는 작은 일로 창조 질서를 돌보아 보세요.","하느님께서 맡기신 세상을 정성껏 일구고 돌보겠습니다."],
["이사 2,4","그들은 칼을 쳐서 보습을 만들고 창을 쳐서 낫을 만들리라. 민족과 민족이 서로 칼을 쳐들지도 않고 다시는 전쟁을 배워 익히지도 않으리라.","전쟁의 도구가 농사의 도구로 바뀌는 평화의 세상을 그린 예언입니다. 하느님께서 이루실 평화는 파괴가 아니라 생명을 가꾸는 평화입니다.","세상 곳곳에서 여전히 전쟁이 계속되고 있습니다. 거대한 평화는 작은 화해에서 시작됩니다. 오늘 세계 평화를 위해 기도하고, 내 말에 담긴 ‘칼’을 ‘보습’으로 바꾸어 보세요.","내 안의 날카로운 말을 생명을 살리는 말로 바꾸겠습니다."],
["갈라 5,13","형제 여러분, 여러분은 자유롭게 되라고 부르심을 받았습니다. 다만 그 자유를 육을 위하는 구실로 삼지 말고, 사랑으로 서로 섬기십시오.","그리스도인의 자유는 마음대로 하는 자유가 아니라 사랑으로 섬길 수 있는 자유입니다.","자유를 ‘하고 싶은 대로 하는 것’으로 오해하기 쉽습니다. 참된 자유는 이기심에서 벗어나 사랑을 선택할 수 있는 힘입니다. 오늘 내 자유를 누군가를 섬기는 데 써 보세요.","나의 자유를 사랑으로 섬기는 데 쓰겠습니다."],
["요한 8,32","너희는 진리를 알게 될 것이다. 그리고 진리가 너희를 자유롭게 할 것이다.","오늘은 아우슈비츠 수용소에서 다른 이를 대신해 죽음을 택한 성 막시밀리아노 마리아 콜베 기념일입니다. 진리를 따르는 사람은 어떤 감옥에서도 자유롭습니다.","거짓과 타협하면 당장은 편하지만 마음은 묶입니다. 진실을 선택하면 처음엔 어려워도 결국 자유로워집니다. 오늘 숨기거나 꾸미지 말고 정직하게 말하고 행동해 보세요.","진리를 따라 정직하게 살며 참된 자유를 누리겠습니다."],
["루카 1,49","전능하신 분께서 나에게 큰일을 하셨으니 그분의 이름은 거룩하고","오늘은 성모 승천 대축일이자 광복절입니다. 성모님은 비천한 당신에게 큰일을 하신 하느님을 찬미하셨습니다. 우리 민족에게도 하느님은 해방이라는 큰일을 하셨습니다.","내 인생에서 하느님께서 하신 ‘큰일’은 무엇인가요? 성모님의 노래로 감사하며, 나라를 되찾기 위해 헌신한 분들과 우리 민족의 앞날을 위해 기도해 보세요.","나와 우리 민족에게 큰일을 하신 주님을 찬미하겠습니다."],
["묵시 12,1","그리고 하늘에 큰 표징이 나타났습니다. 태양을 입고 발밑에 달을 두고 머리에 열두 개의 별로 된 관을 쓴 여인이었습니다.","교회는 묵시록의 이 여인을 성모 마리아의 영광스러운 모습으로 묵상해 왔습니다. 승천하신 성모님은 우리가 도달할 영광의 표징입니다.","성모님의 승천은 우리 몸과 영혼도 언젠가 하느님 곁에서 영광을 누릴 것이라는 희망을 줍니다. 그 희망을 품고 오늘 내 몸과 삶을 소중히 가꾸어 보세요.","성모님께서 먼저 가신 영광의 길을 희망하며 살겠습니다."],
["이사 61,1","주 하느님의 영이 내 위에 내리셨으니 주님께서 나에게 기름을 부어 주시어 가련한 이들에게 기쁜 소식을 전하고 마음이 부서진 이들을 싸매어 주며 잡혀간 이들에게 해방을, 갇힌 이들에게 석방을 선포하게 하셨다.","예수님께서 나자렛 회당에서 공생활을 시작하시며 읽으신 말씀입니다. 메시아의 사명은 가난하고 상처 입고 묶인 이들을 자유롭게 하는 것입니다.","우리 주변에도 마음이 부서지고 무언가에 묶인 사람들이 있습니다. 그리스도인은 그들에게 기쁜 소식이 되어야 합니다. 오늘 마음이 아픈 누군가를 위로해 주세요.","마음이 부서진 이들을 싸매어 주는 기쁜 소식이 되겠습니다."],
["시편 126,5","눈물로 씨 뿌리던 이들 환호하며 거두리라.","바빌론 유배에서 돌아온 백성이 부른 노래입니다. 눈물의 시간에 뿌린 씨앗은 반드시 기쁨의 열매로 돌아온다는 희망을 노래합니다.","지금 눈물 흘리며 견디는 일이 있다면 그것은 헛된 것이 아닙니다. 눈물로 뿌린 씨앗은 기쁨으로 거두게 됩니다. 포기하지 말고 오늘도 씨를 뿌리세요.","눈물로 뿌린 씨앗이 기쁨으로 열매 맺을 것을 믿겠습니다."],
["아모 5,24","다만 공정을 물처럼 흐르게 하고 정의를 마르지 않는 강처럼 흐르게 하여라.","아모스 예언자는 화려한 예배보다 공정과 정의를 원하신다는 하느님의 뜻을 전합니다. 정의는 가끔이 아니라 강물처럼 끊임없이 흘러야 합니다.","신앙은 성당 안에서만이 아니라 사회 속에서도 드러나야 합니다. 직장에서 공정하게 일하고, 약자를 차별하지 않는 것이 정의를 흐르게 하는 일입니다.","내 삶의 자리에서 공정과 정의가 흐르게 하겠습니다."],
["이사 32,17","정의의 결과는 평화이고 정의의 성과는 영원한 평온과 신뢰이다.","참된 평화는 정의의 열매라는 예언자의 가르침입니다. 불의를 덮어 둔 평화는 겉모습일 뿐입니다.","갈등을 피하려고 불의를 모른 척하는 것은 진정한 평화가 아닙니다. 공정하게 대하고 바르게 행할 때 오래가는 평화와 신뢰가 생깁니다.","정의를 실천하며 참된 평화와 신뢰를 쌓겠습니다."],
["로마 12,18","할 수만 있다면, 여러분 쪽에서는 모든 사람과 평화롭게 지내십시오.","바오로 사도는 현실적인 지혜를 줍니다. 상대의 반응은 내가 통제할 수 없지만 ‘내 쪽에서’ 할 수 있는 평화의 노력은 다하라고 권합니다.","모든 사람과 잘 지내기는 어렵습니다. 하지만 상대가 어떻게 하든 내 쪽에서 할 수 있는 일은 있습니다. 오늘 불편한 관계에서 내가 할 수 있는 작은 평화의 몸짓을 해 보세요.","내 쪽에서 할 수 있는 평화의 노력을 다하겠습니다."],
["로마 12,21","악에 굴복당하지 말고 선으로 악을 굴복시키십시오.","오늘은 동정 마리아 모후 기념일입니다. 바오로 사도는 악을 악으로 갚지 말고 선으로 이기라고 가르칩니다.","부당한 대우를 받으면 똑같이 갚아 주고 싶습니다. 하지만 그러면 악의 고리는 계속됩니다. 오늘 나를 불편하게 한 사람에게 오히려 선을 베풀어 그 고리를 끊어 보세요.","악을 악으로 갚지 않고 선으로 이기겠습니다."],
["로마 14,19","그러므로 평화와 서로의 성장에 도움이 되는 일을 추구합시다.","음식 문제로 갈등하던 로마 공동체에 바오로 사도가 준 원칙입니다. 옳고 그름을 따지기 전에 평화와 서로의 성장을 먼저 생각하라고 합니다.","논쟁에서 이기는 것보다 관계를 지키는 것이 중요할 때가 있습니다. 오늘 하는 말과 행동이 평화와 서로의 성장에 도움이 되는지 스스로 물어보세요.","평화와 서로의 성장에 도움이 되는 말과 행동을 하겠습니다."],
["요한 1,46","와서 보시오.","오늘은 성 바르톨로메오 사도 축일입니다. 나자렛에서 무슨 좋은 것이 나오겠느냐는 나타나엘(바르톨로메오)에게 필립보는 논쟁 대신 ‘와서 보라’고 초대했습니다.","신앙을 전할 때 설득하려고 애쓰기보다 ‘와서 보라’고 초대하는 것이 더 효과적입니다. 성당 행사나 모임에 친구를 초대해 보세요. 직접 경험하는 것이 가장 큰 설득입니다.","논쟁보다 초대로 신앙의 기쁨을 나누겠습니다."],
["지혜 11,24","주님께서는 존재하는 모든 것을 사랑하시며 당신께서 만드신 것을 하나도 혐오하지 않으십니다. 당신께서 미워하신다면 아예 만들지도 않으셨을 것입니다.","지혜서는 하느님의 창조가 곧 사랑임을 말합니다. 존재한다는 것 자체가 하느님께 사랑받고 있다는 증거입니다.","‘나 같은 사람이 왜 태어났을까’ 생각한 적이 있나요? 하느님은 미워하셨다면 나를 만들지도 않으셨을 것입니다. 나는 존재 자체로 사랑받고 있습니다.","존재 자체로 사랑받는 나를 소중히 여기겠습니다."],
["지혜 11,26","생명을 사랑하시는 주님, 당신의 것이기에 모두 아끼십니다.","하느님은 모든 생명을 당신의 것으로 아끼시는 분이라고 고백합니다. 그래서 죄인에게도 회개할 기회를 주십니다.","생명을 사랑하시는 하느님의 마음을 닮는다면 모든 생명을 존중하게 됩니다. 태아부터 노인까지, 사람부터 작은 생물까지 생명의 가치를 소중히 여겨 보세요.","생명을 사랑하시는 주님처럼 모든 생명을 아끼겠습니다."],
["루카 18,1","예수님께서는 낙심하지 말고 끊임없이 기도해야 한다는 뜻으로 제자들에게 비유를 말씀하셨다.","오늘은 아들 아우구스티노의 회심을 위해 수십 년간 눈물로 기도한 성녀 모니카 기념일입니다. 예수님은 끈질기게 재판관을 찾아간 과부의 비유로 끈기 있는 기도를 가르치셨습니다.","가족의 신앙이나 변화를 위해 오래 기도해도 응답이 없어 지칠 수 있습니다. 성녀 모니카의 기도는 결국 위대한 성인을 낳았습니다. 포기하지 말고 오늘도 기도해 보세요.","성녀 모니카처럼 낙심하지 않고 끊임없이 기도하겠습니다."],
["시편 42,2","암사슴이 시냇물을 그리워하듯 하느님, 제 영혼이 당신을 그리워합니다.","오늘은 성 아우구스티노 기념일입니다. 그는 ‘주님, 저희 마음은 당신 안에서 쉬기까지 평안하지 않습니다’라고 고백했습니다. 이 시편처럼 우리 영혼은 하느님을 목말라합니다.","무엇을 가져도 채워지지 않는 목마름이 있다면 그것은 하느님을 향한 그리움일 수 있습니다. 그 목마름을 다른 것으로 채우려 하지 말고 하느님께 가져가 보세요.","내 영혼의 목마름을 주님께로 가져가겠습니다."],
["마태 5,10","행복하여라, 의로움 때문에 박해를 받는 사람들! 하늘 나라가 그들의 것이다.","오늘은 성 요한 세례자의 수난 기념일입니다. 요한은 헤로데 왕의 불의를 지적하다가 목숨을 잃었습니다.","옳은 일을 하다 손해를 보거나 비난받을 때가 있습니다. 그럴 때 예수님은 ‘행복하다’고 하십니다. 의로움을 지키는 용기는 하늘 나라의 상급으로 이어집니다.","손해를 보더라도 의로움을 지키는 용기를 내겠습니다."],
["이사 30,15","너희는 회개하고 조용히 있어야 구원을 받으리라. 평온하게 신뢰하는 것이 너희의 힘이다.","위기 속에서 이집트와 동맹을 맺으려던 이스라엘에게 하느님께서 주신 말씀입니다. 참된 힘은 분주한 대책이 아니라 하느님께 대한 고요한 신뢰에서 나옵니다.","문제가 생기면 이리저리 해결책을 찾느라 분주해집니다. 하지만 때로는 멈추어 조용히 하느님을 신뢰하는 것이 가장 큰 힘이 됩니다. 오늘 잠시 고요히 머물러 보세요.","분주함을 멈추고 평온한 신뢰로 힘을 얻겠습니다."],
["시편 145,9","주님은 모두에게 좋으신 분 그 자비 당신의 모든 조물 위에 있네.","하느님의 선하심과 자비는 특정한 사람만이 아니라 모든 피조물에게 미친다는 찬미입니다.","하느님의 자비는 나에게만이 아니라 내가 싫어하는 사람에게도 미칩니다. 그것을 받아들이면 마음이 넓어집니다. 여름의 끝자락, 한 달 동안 받은 은혜를 돌아보며 감사해 보세요.","모두에게 좋으신 주님의 자비를 닮아 넓은 마음을 갖겠습니다."]
];

D[9]=[
["시편 148,3","해와 달아, 주님을 찬양하여라. 반짝이는 별들아, 모두 주님을 찬양하여라.","오늘은 ‘피조물 보호를 위한 세계 기도의 날’입니다. 이 시편은 하늘과 땅의 모든 피조물을 불러 하느님을 찬양하라고 합니다.","모든 피조물이 하느님을 찬양하는 합창단이라면 우리는 그 노래를 지켜야 할 책임이 있습니다. 오늘 지구와 모든 생명을 위해 기도하고, 환경을 위한 작은 실천 하나를 시작해 보세요.","모든 피조물과 함께 주님을 찬양하며 창조 세계를 지키겠습니다."],
["잠언 1,7","주님을 경외함이 지식의 근원이다.","잠언 전체의 주제를 담은 구절입니다. 참된 지혜와 지식은 하느님을 경외하는 마음, 곧 하느님을 하느님으로 모시는 겸손에서 시작됩니다.","새 학기를 시작하는 학생들, 새로운 것을 배우는 모든 이에게 이 말씀을 기억하라고 권합니다. 지식이 쌓일수록 교만해지기 쉽지만, 하느님 앞의 겸손이 지식을 지혜로 바꿉니다.","배움의 출발점에 주님을 경외하는 겸손을 두겠습니다."],
["야고 1,5","여러분 가운데 누구든지 지혜가 모자라면, 아무도 나무라지 않으시고 모든 사람에게 너그러이 주시는 하느님께 청하십시오. 그러면 받을 것입니다.","오늘은 대 그레고리오 교황 학자 기념일입니다. 야고보 사도는 지혜가 필요하면 하느님께 청하라고 하며, 하느님은 나무라지 않고 너그러이 주신다고 합니다.","어려운 결정 앞에서 ‘이런 것도 모르나’ 하는 부끄러움에 도움을 청하지 못할 때가 있습니다. 하느님은 묻는 것을 나무라지 않으십니다. 오늘 고민되는 일에 대해 지혜를 청해 보세요.","부끄러워하지 않고 주님께 지혜를 청하겠습니다."],
["잠언 4,23","무엇보다도 네 마음을 지켜라. 거기에서 생명의 샘이 흘러나온다.","마음은 생각과 말과 행동이 흘러나오는 샘입니다. 잠언은 무엇보다도 마음을 잘 지키라고 권합니다.","무엇을 보고, 듣고, 생각하느냐가 마음을 만듭니다. 자극적인 영상, 부정적인 뉴스가 쉴 새 없이 마음에 흘러듭니다. 오늘 내 마음에 들어오는 것을 조금 더 신중하게 골라 보세요.","생명의 샘인 내 마음을 정성껏 지키겠습니다."],
