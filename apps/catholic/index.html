["1요한 3,17","누구든지 세상 재물을 가지고 있으면서 궁핍한 형제를 보고 마음을 닫아 버리면, 하느님 사랑이 어떻게 그 사람 안에 머무르겠습니까?","오늘은 가난한 이들 가운데 가장 가난한 이들을 섬긴 콜카타의 성녀 데레사 기념일입니다. 요한 사도는 사랑이 구체적인 나눔으로 드러나야 한다고 말합니다.","마더 데레사는 ‘큰일을 할 수는 없지만 작은 일을 큰 사랑으로 할 수 있다’고 했습니다. 오늘 어려운 이웃 앞에서 마음을 닫지 말고 작은 나눔을 실천해 보세요.","어려운 이웃 앞에서 마음을 닫지 않고 작은 사랑을 나누겠습니다."],
["잠언 18,21","죽음과 삶이 혀의 권세에 달려 있으니 혀를 사랑하는 이는 그 열매를 먹으리라.","말에는 사람을 살리기도, 죽이기도 하는 힘이 있다는 잠언입니다. 우리가 뿌린 말은 결국 열매가 되어 돌아옵니다.","댓글 한 줄, 무심코 한 농담이 누군가에게 깊은 상처가 될 수 있습니다. 반대로 따뜻한 말 한마디가 누군가를 살릴 수도 있습니다. 오늘 사람을 살리는 말을 해 보세요.","오늘 사람을 살리는 말을 하겠습니다."],
["야고 3,5","이와 같이 혀도 작은 지체에 불과하지만 큰일을 한다고 자랑합니다. 보십시오, 아주 작은 불이 얼마나 큰 숲을 태워 버리는지!","야고보 사도는 혀를 작은 불씨에 비유합니다. 작은 말 한마디가 공동체 전체를 태워 버릴 수 있습니다.","험담은 작은 불씨처럼 시작해 관계를 태워 버립니다. 누군가에 대한 부정적인 이야기를 들으면 전하지 말고 그 자리에서 멈추게 하세요. 불씨는 내가 끌 수 있습니다.","험담의 불씨를 내 입에서 끄겠습니다."],
["루카 1,28","은총이 가득한 이여, 기뻐하여라. 주님께서 너와 함께 계시다.","오늘은 복되신 동정 마리아 탄생 축일입니다. 천사 가브리엘이 마리아에게 한 인사는 ‘성모송’의 첫 구절이 되었습니다.","성모송을 바칠 때마다 우리는 천사의 인사를 반복합니다. 오늘 성모송을 천천히 한 단어씩 음미하며 바쳐 보세요. ‘주님께서 함께 계시다’는 말씀은 우리에게도 해당됩니다.","천사의 인사로 성모님을 기리며 주님께서 함께 계심을 기뻐하겠습니다."],
["에페 4,29","여러분의 입에서는 어떠한 나쁜 말도 나와서는 안 됩니다. 필요할 때에 다른 사람의 성장에 도움이 되는 좋은 말을 하여, 그 말이 듣는 이들에게 은총을 가져다줄 수 있도록 하십시오.","바오로 사도는 말의 기준을 제시합니다. 나쁜 말을 피하는 데서 그치지 않고, 듣는 사람을 세워 주고 은총이 되는 말을 하라고 합니다.","말하기 전에 세 가지를 물어보세요. 진실한가? 필요한가? 듣는 이에게 도움이 되는가? 오늘 누군가를 세워 주는 칭찬이나 격려를 한마디 건네 보세요.","듣는 이에게 은총이 되는 좋은 말을 하겠습니다."],
["집회 2,1","얘야, 주님을 섬기러 나아갈 때 너 자신을 시련에 대비시켜라.","집회서는 신앙의 길이 언제나 순탄하지 않다는 것을 솔직하게 말합니다. 하느님을 섬기는 사람에게도 시련은 찾아옵니다.","신앙생활을 하면 모든 일이 잘될 거라 기대했다가 실망할 수 있습니다. 시련은 신앙이 없어서가 아니라 신앙을 단련하기 위해 옵니다. 미리 마음을 준비하면 흔들리지 않습니다.","시련 앞에서도 흔들리지 않도록 마음을 준비하겠습니다."],
["집회 2,4-5","너에게 닥친 것은 무엇이든 받아들이고 처지가 바뀌어 비천해지더라도 참고 견뎌라. 금은 불로 단련되고 주님께 맞갖은 이들은 비천의 도가니에서 단련된다.","금이 불 속에서 순수해지듯 사람도 어려움 속에서 단련된다는 지혜입니다.","원치 않는 상황에 놓였을 때 거부하고 원망하기보다 받아들이는 것에서 회복이 시작됩니다. 지금의 어려움이 나를 금처럼 빛나게 하는 과정이라고 믿어 보세요.","어려움의 도가니 속에서 금처럼 단련되기를 청하겠습니다."],
["잠언 27,17","쇠는 쇠로 다듬어지고 사람은 이웃의 얼굴로 다듬어진다.","쇠붙이가 서로 부딪쳐 날카로워지듯 사람도 서로 만나고 부딪치며 성장한다는 잠언입니다.","나를 불편하게 하는 사람이 오히려 나를 성장시키는 스승일 수 있습니다. 오늘 마찰이 있는 관계를 통해 내가 무엇을 배울 수 있는지 생각해 보세요.","이웃과의 만남을 통해 다듬어지고 성장하겠습니다."],
["잠언 15,22","의논 없이는 계획이 실패하지만 조언자가 많으면 이루어진다.","오늘은 ‘황금의 입’이라 불린 성 요한 크리소스토모 기념일입니다. 잠언은 혼자 결정하지 말고 지혜로운 이들의 조언을 들으라고 합니다.","중요한 결정을 혼자 내리면 시야가 좁아지기 쉽습니다. 믿을 만한 사람에게 조언을 구하는 것은 지혜입니다. 고민되는 일이 있다면 신뢰하는 사람과 의논해 보세요.","혼자 판단하지 않고 지혜로운 조언에 귀 기울이겠습니다."],
["요한 3,14-15","모세가 광야에서 뱀을 들어 올린 것처럼 사람의 아들도 들어 올려져야 한다. 믿는 사람은 누구나 그를 통하여 영원한 생명을 얻게 하려는 것이다.","오늘은 성 십자가 현양 축일입니다. 광야에서 구리 뱀을 바라본 이들이 살아났듯, 십자가에 들어 올려지신 예수님을 바라보는 이는 생명을 얻습니다.","십자가는 고통의 상징이지만 그리스도인에게는 사랑과 승리의 표징입니다. 성호를 그을 때 그 의미를 묵상하며 정성껏 그어 보세요.","십자가에 들어 올려지신 주님을 바라보며 생명을 얻겠습니다."],
["루카 2,35","그리하여 많은 사람의 마음속 생각이 드러날 것입니다. 그리고 당신의 영혼이 칼에 꿰찔리는 듯 아플 것입니다.","오늘은 고통의 성모 마리아 기념일입니다. 시메온은 아기 예수님을 안고 성모님이 겪으실 고통을 예언했습니다. 성모님은 아들의 십자가 아래까지 함께하셨습니다.","자녀나 사랑하는 사람의 고통을 지켜봐야 하는 아픔은 무엇보다 큽니다. 그런 아픔을 겪고 있다면 고통의 성모님께 기도해 보세요. 그분은 그 아픔을 누구보다 잘 아십니다.","고통 속에서 성모님께 의지하며 함께 아파하는 이들을 위해 기도하겠습니다."],
["지혜 6,12","지혜는 바래지 않고 늘 빛이 나서 그를 사랑하는 이들은 쉽게 알아보고 그를 찾는 이들은 쉽게 발견한다.","지혜는 숨어 있지 않고 찾는 이들에게 기꺼이 자신을 드러낸다는 말씀입니다. 지혜를 사랑하고 찾는 마음이 중요합니다.","유행은 금세 바래지만 참된 지혜는 시간이 지나도 빛납니다. 오늘 스마트폰 대신 좋은 책 한 권을 펼치거나 성경을 읽으며 지혜를 찾아보세요.","바래지 않는 지혜를 사랑하고 찾겠습니다."],
["코헬 7,8","일의 끝이 그 시작보다 낫고 끈기 있는 마음이 오만한 마음보다 낫다.","시작보다 끝맺음이 중요하고, 교만보다 인내가 낫다는 코헬렛의 지혜입니다.","시작은 쉽지만 끝까지 해내기는 어렵습니다. 연초에 세운 계획 중 흐지부지된 것이 있다면 다시 꺼내 보세요. 아직 한 해가 남아 있습니다.","시작한 일을 끈기 있게 끝까지 해내겠습니다."],
["잠언 11,2","오만이 오면 수치도 오지만 겸손한 이에게는 지혜가 있다.","교만은 결국 부끄러움을 부르고, 겸손은 지혜를 낳는다는 잠언입니다.","내가 다 안다고 생각하는 순간 배움은 멈춥니다. 겸손한 사람은 누구에게서든 배울 수 있습니다. 오늘 후배나 아이에게서도 배울 점을 찾아보세요.","겸손한 마음으로 누구에게서든 배우겠습니다."],
["루카 14,11","누구든지 자신을 높이는 이는 낮아지고 자신을 낮추는 이는 높아질 것이다.","잔칫집에서 윗자리를 차지하려는 사람들을 보시고 예수님께서 하신 말씀입니다. 하느님 나라의 질서는 세상과 거꾸로입니다.","자리를 다투고 인정받으려 애쓰는 것이 우리 모습입니다. 오늘 일부러 낮은 자리를 택해 보세요. 엘리베이터를 양보하거나 남의 공을 먼저 인정하는 것도 좋습니다.","스스로 높이지 않고 낮은 자리를 기꺼이 택하겠습니다."],
["마태 10,32","누구든지 사람들 앞에서 나를 안다고 증언하면, 나도 하늘에 계신 내 아버지 앞에서 그를 안다고 증언할 것이다.","오늘은 성 김대건 안드레아 사제와 성 정하상 바오로와 동료 순교자들 대축일입니다. 한국의 순교 성인들은 목숨을 걸고 예수님을 안다고 증언했습니다.","순교자들의 피 위에 한국 교회가 세워졌습니다. 오늘날 우리는 목숨 대신 일상에서 신앙을 증언합니다. 식당에서 식사 전 성호를 긋는 작은 용기부터 시작해 보세요.","순교 성인들처럼 사람들 앞에서 주님을 증언하는 용기를 내겠습니다."],
["마태 9,9","예수님께서 그곳을 떠나 길을 가시다가 마태오라는 사람이 세관에 앉아 있는 것을 보시고 말씀하셨다. ‘나를 따라라.’ 그러자 마태오는 일어나 그분을 따랐다.","오늘은 성 마태오 사도 복음사가 축일입니다. 사람들에게 멸시받던 세리 마태오를 예수님은 제자로 부르셨고, 그는 망설임 없이 따랐습니다.","예수님은 사람들이 손가락질하는 자리에서도 나를 부르십니다. 과거가 어떻든 ‘나를 따라라’ 하시는 부르심에 응답할 수 있습니다. 오늘 내가 일어나 떠나야 할 ‘세관’은 무엇인가요?","부르심을 들으면 망설이지 않고 일어나 따르겠습니다."],
["마태 10,28","육신은 죽여도 영혼은 죽이지 못하는 자들을 두려워하지 마라. 오히려 영혼도 육신도 지옥에서 멸망시키실 수 있는 분을 두려워하여라.","순교 성월에 묵상하는 말씀입니다. 예수님은 사람의 위협보다 하느님 앞에서의 진실함을 더 소중히 여기라고 하십니다.","남의 시선과 평가를 두려워하며 사는 경우가 많습니다. 하지만 정말 두려워해야 할 것은 하느님 앞에서 부끄러운 삶입니다. 오늘 남의 눈보다 하느님의 눈을 의식하며 살아 보세요.","사람의 시선보다 하느님 앞에서 진실하게 살겠습니다."],
["로마 8,18","나는 현재 우리가 겪는 고난이 장차 우리에게 계시될 영광에 견주면 아무것도 아니라고 생각합니다.","오늘은 평생 고통을 기도로 봉헌한 피에트렐치나의 성 비오 신부 기념일입니다. 바오로 사도는 현재의 고난을 장차 올 영광에 비추어 바라봅니다.","지금의 고통이 너무 커 보일 때 영원의 관점에서 바라보면 견딜 힘이 생깁니다. 고통을 기도로 바꾸어 봉헌해 보세요. 그 고통도 의미를 갖게 됩니다.","현재의 고난을 장차 올 영광에 비추어 견디겠습니다."],
["시편 67,7","땅이 제 소출을 내었으니 하느님, 우리 하느님께서 우리에게 복을 내리셨네.","추수를 감사하며 부른 시편입니다. 풍성한 수확은 하느님의 축복이라는 고백입니다.","한가위 무렵, 풍성한 결실을 주신 하느님께 감사드립니다. 가족과 함께 모여 음식을 나눌 때 식사 전 감사 기도를 함께 바쳐 보세요. 먼저 떠난 조상들을 위한 기도도 잊지 마세요.","풍성한 결실을 주신 주님께 가족과 함께 감사드리겠습니다."],
["신명 8,10","너희는 배불리 먹고, 너희에게 좋은 땅을 준 주 너희 하느님을 찬미하여라.","광야를 지나 약속의 땅에 들어갈 백성에게 모세가 당부한 말입니다. 풍요로울 때 오히려 하느님을 잊기 쉬우니 배부를 때 감사하라고 합니다.","어려울 때는 하느님을 찾다가 형편이 나아지면 잊는 것이 우리 모습입니다. 오늘 배불리 먹은 뒤 식후 기도를 정성껏 바쳐 보세요.","배부를 때에도 주님을 잊지 않고 찬미하겠습니다."],
["2코린 9,7","저마다 마음에 정한 대로 해야지, 마지못해 하거나 억지로 해서는 안 됩니다. 하느님께서는 기쁘게 주는 이를 사랑하십니다.","바오로 사도는 예루살렘 교회를 위한 모금을 부탁하며 나눔의 정신을 가르칩니다. 얼마를 주느냐보다 어떤 마음으로 주느냐가 중요합니다.","의무감으로 하는 봉헌과 기쁜 마음으로 하는 봉헌은 다릅니다. 오늘 나눔을 실천할 때 아까워하는 마음 대신 기쁨으로 해 보세요. 하느님은 기쁘게 주는 사람을 사랑하십니다.","억지로가 아니라 기쁜 마음으로 나누겠습니다."],
["잠언 19,17","가난한 이에게 자비를 베푸는 이는 주님께 꾸어 드리는 것이니 그분께서 그 선행을 갚아 주신다.","오늘은 가난한 이들의 아버지 성 빈첸시오 드 폴 기념일입니다. 잠언은 가난한 이를 돕는 것이 곧 하느님께 드리는 것이라고 말합니다.","가난한 이웃을 돕는 것은 손해가 아니라 하느님께 맡겨 두는 것입니다. 성 빈첸시오처럼 주변의 어려운 이웃을 살펴보고 도울 방법을 찾아보세요.","가난한 이를 돕는 일로 주님께 꾸어 드리겠습니다."],
["루카 12,15","너희는 주의하여라. 모든 탐욕을 경계하여라. 아무리 부유하더라도 사람의 생명은 그의 재산에 달려 있지 않다.","유산 분배를 요청한 사람에게 예수님께서 하신 말씀입니다. 이어서 곳간을 늘리다 그날 밤 죽은 어리석은 부자의 비유를 들려주십니다.","더 많이 가지면 행복할 거라는 믿음은 끝없는 갈증만 남깁니다. 오늘 내가 가진 것 중 정말 필요한 것과 욕심을 구분해 보세요. 비울수록 마음은 가벼워집니다.","탐욕을 경계하고 이미 가진 것에 감사하겠습니다."],
["시편 91,11","그분께서 너를 위하여 당신 천사들에게 명령하시어 네 모든 길에서 너를 지키게 하시리라.","오늘은 성 미카엘, 성 가브리엘, 성 라파엘 대천사 축일입니다. 하느님은 천사들을 보내어 우리를 지키신다고 약속하십니다.","눈에 보이지 않지만 하느님은 늘 나를 지키고 계십니다. 오늘 집을 나서며 수호천사에게 기도해 보세요. 그리고 나도 누군가에게 천사 같은 존재가 되어 보세요.","내 모든 길을 지키시는 주님의 보호를 믿고 걷겠습니다."],
["2티모 3,16","성경은 전부 하느님의 영감으로 쓰인 것으로, 가르치고 꾸짖고 바로잡고 의롭게 살도록 교육하는 데에 유익합니다.","오늘은 성경을 라틴어로 번역한 성 예로니모 기념일입니다. 그는 ‘성경을 모르는 것은 그리스도를 모르는 것’이라고 말했습니다.","성경은 먼지 쌓인 고전이 아니라 오늘 나에게 말씀하시는 살아 있는 책입니다. 하루 한 장씩 복음서를 읽어 보는 것은 어떨까요? 이 앱의 말씀도 그 시작이 될 수 있습니다.","성경을 가까이하며 그리스도를 더 깊이 알아 가겠습니다."]
];

D[10]=[
["마태 18,4","누구든지 이 어린이처럼 자신을 낮추는 이가 하늘 나라에서 가장 큰 사람이다.","오늘은 ‘작은 길’의 영성을 남긴 리지외의 성녀 소화 데레사 기념일입니다. 그녀는 위대한 업적이 아니라 작은 일을 큰 사랑으로 하는 것이 성덕의 길임을 보여 주었습니다.","큰일을 해야 의미 있는 삶이라고 생각하나요? 소화 데레사는 수도원 안에서 작은 친절과 인내로 성녀가 되었습니다. 오늘 아무도 모르게 작은 사랑을 실천해 보세요.","소화 데레사처럼 작은 일을 큰 사랑으로 하겠습니다."],
["탈출 23,20","보라, 내가 너희 앞에 천사를 보내어, 길에서 너희를 지키고 내가 마련한 곳으로 너희를 데려가게 하겠다.","오늘은 수호천사 기념일입니다. 하느님은 광야를 지나는 백성 앞에 천사를 보내 지키고 인도하겠다고 약속하셨습니다.","어린 시절 배운 수호천사 기도를 기억하시나요? 하느님은 지금도 우리 곁에 천사를 두어 지켜 주십니다. 오늘 수호천사에게 감사하며 하루를 맡겨 보세요.","나를 지키는 수호천사와 함께 주님께서 마련하신 길을 걷겠습니다."],
["시편 145,18","주님께서는 당신을 부르는 모든 이에게, 진실하게 부르는 모든 이에게 가까이 계시다.","하느님은 멀리 계신 분이 아니라 진실하게 부르는 이에게 가까이 계신다는 고백입니다. 10월 묵주기도 성월을 시작하며 기도의 의미를 새겨 봅니다.","기도가 허공에 흩어지는 것 같아도 하느님은 가까이서 듣고 계십니다. 화려한 말이 아니라 진실한 마음이 중요합니다. 오늘 묵주기도 한 단을 진심을 담아 바쳐 보세요.","진실한 마음으로 가까이 계신 주님을 부르겠습니다."],
["마태 6,20-21","너희는 하늘에 보물을 쌓아라. 거기에서는 좀도 녹도 망가뜨리지 못하고, 도둑들이 뚫고 들어오지도 못하며 훔쳐 가지도 못한다. 사실 너의 보물이 있는 곳에 너의 마음도 있다.","오늘은 아시시의 성 프란치스코 기념일입니다. 부유한 상인의 아들이었던 그는 모든 것을 버리고 가난을 택해 참된 보물을 얻었습니다.","내 시간과 돈을 어디에 쓰는지 보면 내 마음이 어디 있는지 알 수 있습니다. 사라질 것에만 투자하고 있지는 않나요? 오늘 하늘에 쌓는 보물, 곧 사랑과 나눔에 투자해 보세요.","사라지지 않는 하늘의 보물을 쌓으며 살겠습니다."],
["루카 11,1","주님, 요한이 자기 제자들에게 가르쳐 준 것처럼, 저희에게도 기도하는 것을 가르쳐 주십시오.","예수님께서 기도하시는 모습을 본 제자가 한 청입니다. 이 청에 응답하여 예수님은 ‘주님의 기도’를 가르쳐 주셨습니다.","기도가 어렵게 느껴진다면 제자들처럼 ‘주님, 기도하는 법을 가르쳐 주십시오’라고 청해 보세요. 기도는 기술이 아니라 관계입니다. 매일 조금씩 대화하다 보면 깊어집니다.","기도하는 법을 주님께 배우며 매일 조금씩 대화하겠습니다."],
["마태 6,9-10","하늘에 계신 우리 아버지, 아버지의 이름을 거룩히 드러내시며 아버지의 나라가 오시며 아버지의 뜻이 하늘에서와 같이 땅에서도 이루어지소서.","예수님께서 직접 가르쳐 주신 ‘주님의 기도’의 앞부분입니다. 내 필요를 청하기 전에 먼저 하느님의 이름과 나라와 뜻을 구합니다.","매일 바치는 주님의 기도를 습관처럼 외우고 있지 않나요? 오늘은 한 구절씩 멈추어 그 의미를 묵상하며 천천히 바쳐 보세요. 특히 ‘아버지의 뜻이 이루어지소서’를 진심으로 고백해 보세요.","주님의 기도를 한 구절씩 마음에 새기며 바치겠습니다."],
["루카 1,37","하느님께는 불가능한 것이 없다.","오늘은 묵주 기도의 복되신 동정 마리아 기념일입니다. 천사 가브리엘은 처녀인 마리아의 잉태와 늙은 엘리사벳의 임신을 알리며 이렇게 말했습니다.","불가능해 보이는 상황 앞에서 우리는 쉽게 포기합니다. 하지만 하느님께는 불가능이 없습니다. 오늘 불가능하다고 단정 지었던 기도 제목을 묵주기도와 함께 다시 봉헌해 보세요.","불가능이 없으신 주님께 포기했던 기도를 다시 봉헌하겠습니다."],
["마태 18,20","두 사람이나 세 사람이 내 이름으로 모인 곳에는 나도 그들 가운데에 있다.","예수님은 함께 모여 기도하는 공동체 가운데에 계시겠다고 약속하셨습니다. 함께 바치는 기도에는 특별한 힘이 있습니다.","혼자 기도하는 것도 좋지만 함께 기도하면 서로에게 힘이 됩니다. 가족이나 친구와 함께 짧은 기도를 바쳐 보세요. 두세 사람이 모인 그곳에 주님이 계십니다.","가족이나 이웃과 함께 모여 기도하겠습니다."],
["요한 1,1","한처음에 말씀이 계셨다. 말씀은 하느님과 함께 계셨는데 말씀은 하느님이셨다.","요한 복음의 장엄한 시작입니다. 예수님은 하느님의 영원한 ‘말씀’이십니다. 오늘 한글날, 말과 글의 소중함을 생각해 봅니다.","하느님께서 말씀으로 세상을 창조하셨듯 우리의 말에도 창조하는 힘이 있습니다. 아름다운 우리말로 고운 말을 쓰고, 말씀이신 주님을 닮은 진실한 언어를 사용해 보세요.","말씀이신 주님을 닮아 진실하고 고운 말을 쓰겠습니다."],
["예레 33,3","나를 불러라. 그러면 내가 너에게 대답해 주고, 네가 몰랐던 큰일과 숨겨진 일들을 너에게 알려 주겠다.","감옥에 갇힌 예레미야에게 하느님께서 하신 말씀입니다. 갇힌 상황에서도 하느님을 부르면 응답하시고 새로운 길을 보여 주신다는 약속입니다.","답이 보이지 않는 상황에 갇혀 있나요? 하느님을 부르는 것에서 시작하세요. 내가 몰랐던 길, 생각지도 못한 해결책을 보여 주실 것입니다.","답답한 상황에서 먼저 주님을 부르겠습니다."],
["마르 11,24","그러므로 내가 너희에게 말한다. 너희가 기도하며 청하는 것이 무엇이든 그것을 이미 받은 줄로 믿어라. 그러면 너희에게 그대로 이루어질 것이다.","예수님은 믿음으로 기도하라고 하십니다. 기도는 의심하며 하는 것이 아니라 하느님의 선하심을 신뢰하며 하는 것입니다.","기도하면서도 ‘설마 되겠어?’ 하는 마음이 있지 않나요? 하느님은 내가 청한 것보다 더 좋은 것을 주시는 분입니다. 오늘 기도할 때 이미 받은 것처럼 감사로 마무리해 보세요.","청한 것을 이미 받은 줄로 믿으며 감사로 기도하겠습니다."],
["시편 62,2","내 영혼은 하느님을 향해 말없이 기다리니 그분에게서 나의 구원이 오네.","시인은 사람들의 공격 속에서도 조용히 하느님만을 기다립니다. 침묵 속의 기다림은 가장 깊은 신뢰의 표현입니다.","무언가를 말하고 해결하려는 조급함을 내려놓고 하느님 앞에서 말없이 머물러 보세요. 오늘 5분간 아무 말 없이 하느님 앞에 앉아 있는 침묵의 기도를 해 보세요.","말없이 주님을 기다리며 그분께 구원을 바라겠습니다."],
["시편 27,14","주님께 바라라. 굳세어라. 네 마음을 굳게 하여라. 주님께 바라라.","‘주님께 바라라’로 시작하고 끝나는 이 구절은 기다림의 시간을 견디는 힘을 줍니다. 기다림은 수동적인 것이 아니라 마음을 굳세게 하는 적극적인 신앙입니다.","기다림은 누구에게나 힘듭니다. 하지만 그 기다림 끝에 하느님이 계신다면 견딜 수 있습니다. 오늘 기다리는 일이 있다면 이 구절을 세 번 소리 내어 읽어 보세요.","굳센 마음으로 주님께 바라며 기다리겠습니다."],
["하바 2,3","이 환시는 정해진 때를 기다린다. 끝을 향해 치닫는 이 환시는 거짓말을 하지 않는다. 늦어지는 듯하더라도 너는 기다려라. 그것은 오고야 만다. 지체하지 않는다.","불의가 판치는 세상에 대해 탄식하던 하바쿡에게 하느님께서 주신 응답입니다. 하느님의 약속은 늦어지는 것처럼 보여도 반드시 이루어집니다.","‘언제쯤 응답하실까?’ 지칠 때가 있습니다. 하느님의 시간은 우리의 시간과 다릅니다. 늦어지는 것처럼 보여도 그분의 때는 정확합니다. 조금만 더 기다려 보세요.","늦어지는 듯해도 반드시 오는 주님의 때를 기다리겠습니다."],
["시편 16,8","언제나 내 앞에 주님을 모시어 그분께서 내 오른쪽에 계시니 나는 흔들리지 않으리라.","오늘은 기도의 스승 아빌라의 성녀 데레사 기념일입니다. 그녀는 ‘아무것도 너를 흔들지 못하게 하라… 하느님만으로 충분하다’는 기도를 남겼습니다.","세상의 소식, 사람들의 말에 쉽게 흔들리는 마음을 붙잡아 주는 것은 하느님의 현존입니다. 오늘 하루 ‘주님이 내 오른쪽에 계신다’는 사실을 자주 떠올려 보세요.","언제나 주님을 내 앞에 모시고 흔들리지 않겠습니다."],
["1사무 1,27","이 아이를 두고 기도하였는데, 주님께서 제가 간청한 것을 들어주셨습니다.","오랫동안 아이를 갖지 못해 눈물로 기도하던 한나가 사무엘을 낳은 뒤 성전에서 한 고백입니다. 그녀는 응답받은 선물을 다시 하느님께 봉헌했습니다.","오래 기다린 기도가 응답되었을 때 감사를 잊지 않는 것이 중요합니다. 내가 받은 응답들을 떠올려 보고, 그 선물을 다시 하느님과 이웃을 위해 쓸 방법을 생각해 보세요.","응답받은 기도에 감사하며 받은 선물을 다시 봉헌하겠습니다."],
["로마 1,16","나는 복음을 부끄럽게 여기지 않습니다. 복음은 믿는 사람이면 누구에게나 구원을 가져다주는 하느님의 힘입니다.","오늘은 맹수의 밥이 되는 순교를 기꺼이 받아들인 안티오키아의 성 이냐시오 주교 기념일입니다. 바오로 사도처럼 그도 복음을 부끄러워하지 않았습니다.","직장이나 학교에서 신앙인임을 드러내기 망설여질 때가 있습니다. 복음은 부끄러운 것이 아니라 생명을 주는 힘입니다. 자연스럽게 내가 가톨릭 신자임을 이야기해 보세요.","복음을 부끄러워하지 않고 자연스럽게 신앙을 드러내겠습니다."],
["루카 10,2","수확할 것은 많은데 일꾼은 적다. 그러니 수확할 밭의 주인님께 일꾼들을 보내 주십사고 청하여라.","오늘은 성 루카 복음사가 축일입니다. 예수님은 제자 일흔두 명을 파견하시며 일꾼을 위해 기도하라고 하셨습니다.","교회에는 사제와 수도자, 봉사자가 늘 부족합니다. 오늘 성소를 위해 기도해 주세요. 그리고 나 자신도 하느님 밭의 일꾼으로 부름받았음을 기억하세요.","성소를 위해 기도하며 나도 주님의 일꾼이 되겠습니다."],
["이사 52,7","얼마나 아름다운가, 산 위에 서 있는 저 발! 기쁜 소식을 전하는 이의 발! 평화를 선포하고 행복을 전하며 구원을 선포하는 이의 발!","유배에서 돌아올 소식을 전하는 전령의 발이 아름답다는 노래입니다. 전교 주간을 맞아 복음을 전하는 이들의 아름다움을 묵상합니다.","기쁜 소식을 전하기 위해 걸어가는 발은 아름답습니다. 선교지에서 일하는 선교사들을 위해 기도하고, 나도 내 주변에 기쁜 소식을 전하는 발이 되어 보세요.","기쁜 소식을 전하는 아름다운 발이 되겠습니다."],
["마태 28,19-20","그러니 너희는 가서 모든 민족들을 제자로 삼아, 아버지와 아들과 성령의 이름으로 세례를 주고, 내가 너희에게 명령한 모든 것을 지키도록 가르쳐라. 보라, 내가 세상 끝 날까지 언제나 너희와 함께 있다.","부활하신 예수님께서 제자들에게 맡기신 대사명입니다. 사명과 함께 ‘언제나 함께 있겠다’는 약속을 주셨습니다. 10월은 전교의 달이기도 합니다.","복음을 전하라는 사명은 성직자만이 아니라 세례받은 모든 이의 몫입니다. 두려워하지 마세요. 세상 끝 날까지 함께하시겠다는 약속이 있습니다.","세상 끝 날까지 함께하시는 주님을 믿고 복음을 전하겠습니다."],
["이사 6,8","그때 나는 주님의 목소리를 들었다. ‘내가 누구를 보낼까? 누가 우리를 위하여 가리오?’ 내가 아뢰었다. ‘제가 있지 않습니까? 저를 보내십시오.’","성전에서 하느님을 뵌 이사야는 자신의 부족함을 고백했지만, 정화된 뒤 하느님의 부르심에 기꺼이 응답했습니다.","‘누가 할까?’ 하는 일 앞에서 서로 눈치만 볼 때가 있습니다. 하느님은 능력 있는 사람이 아니라 기꺼이 응답하는 사람을 찾으십니다. 오늘 ‘제가 하겠습니다’라고 손을 들어 보세요.","‘저를 보내십시오’ 하고 기꺼이 응답하겠습니다."],
["요한 6,68","주님, 저희가 누구에게 가겠습니까? 주님께는 영원한 생명의 말씀이 있습니다.","오늘은 ‘두려워하지 마십시오’로 교황직을 시작한 성 요한 바오로 2세 교황 기념일입니다. 많은 제자가 떠날 때 베드로는 이렇게 고백하며 예수님 곁에 남았습니다.","신앙이 흔들리고 교회가 실망스러울 때도 있습니다. 그래도 베드로처럼 ‘주님 말고 누구에게 가겠습니까’라고 고백할 수 있다면 다시 일어설 수 있습니다.","흔들릴 때에도 영원한 생명의 말씀이신 주님 곁에 머물겠습니다."],
["사도 1,8","성령께서 너희에게 내리시면 너희는 힘을 받아, 예루살렘과 온 유다와 사마리아, 그리고 땅끝에 이르기까지 나의 증인이 될 것이다.","승천하시기 전 예수님께서 하신 마지막 약속입니다. 증인의 사명은 가까운 곳에서 시작해 땅끝까지 퍼져 나갑니다.","땅끝까지 가기 전에 내 ‘예루살렘’, 곧 가정과 직장에서 먼저 증인이 되어야 합니다. 가장 가까운 사람들에게 신앙의 기쁨을 보여 주는 것부터 시작하세요.","성령의 힘으로 가장 가까운 곳에서부터 주님의 증인이 되겠습니다."],
["마태 5,16","이와 같이 너희의 빛이 사람들 앞을 비추어, 그들이 너희의 착한 행실을 보고 하늘에 계신 너희 아버지를 찬양하게 하여라.","빛을 비추는 목적은 나를 드러내는 것이 아니라 사람들이 하느님을 찬양하게 하는 것입니다.","착한 일을 할 때 칭찬받고 싶은 마음이 들 수 있습니다. 하지만 그리스도인의 선행은 하느님을 가리키는 손가락입니다. 오늘 하는 선행으로 사람들이 하느님을 떠올리게 해 보세요.","나의 착한 행실로 하느님께서 찬양받으시게 하겠습니다."],
["필리 4,13","나에게 힘을 주시는 분 안에서 나는 모든 것을 할 수 있습니다.","감옥에서 쓴 편지에서 바오로 사도는 어떤 형편에서도 견딜 수 있는 비결이 그리스도 안에 있다고 고백합니다.","‘나는 할 수 없어’라는 말이 자주 나온다면 이 구절을 기억하세요. 내 힘이 아니라 나에게 힘을 주시는 분 안에서 할 수 있습니다. 오늘 두려워 미루던 일에 도전해 보세요.","나에게 힘을 주시는 주님 안에서 용기 있게 도전하겠습니다."],
["필리 4,11-12","나는 어떠한 처지에서도 자족하는 법을 배웠습니다. 나는 비천하게 살 줄도 알고 풍족하게 살 줄도 압니다. 배부르거나 배고프거나 넉넉하거나 모자라거나 그 어떠한 경우에도 잘 지내는 비결을 알고 있습니다.","바오로 사도는 자족을 ‘배웠다’고 말합니다. 만족은 타고나는 것이 아니라 훈련으로 얻는 영적 지혜입니다.","SNS 속 다른 사람의 삶과 비교하면 늘 부족하게 느껴집니다. 오늘 내가 가진 것들을 하나씩 세어 보며 감사해 보세요. 만족은 많이 가질 때가 아니라 감사할 때 옵니다.","어떤 처지에서도 감사하며 자족하는 법을 배우겠습니다."],
["1티모 6,6-7","만족할 줄 알면서 신심을 지니면 그것은 큰 이득입니다. 우리는 이 세상에 아무것도 가지고 오지 않았으며 아무것도 가지고 갈 수 없습니다.","바오로 사도는 재물을 쫓는 사람들에게 참된 이득이 무엇인지 말합니다. 빈손으로 왔다가 빈손으로 가는 인생에서 진짜 이득은 신앙과 만족하는 마음입니다.","더 많이 벌고 더 많이 가지려고 달리다 지칠 때, 이 말씀을 떠올려 보세요. 결국 가져갈 수 있는 것은 사랑과 신앙뿐입니다. 오늘 무엇을 위해 살고 있는지 돌아보세요.","가져갈 수 없는 것보다 영원한 것을 위해 살겠습니다."],
["에페 2,19-20","그러므로 여러분은 이제 더 이상 외국인도 이방인도 아니라, 성도들과 함께 한 시민이며 하느님의 한 가족입니다. 여러분은 사도들과 예언자들의 기초 위에 세워진 건물이고, 그리스도 예수님께서는 바로 모퉁잇돌이십니다.","오늘은 성 시몬과 성 유다 사도 축일입니다. 바오로 사도는 그리스도 안에서 모든 사람이 하느님의 한 가족이 되었다고 말합니다.","교회 안에 소외되거나 낯설어하는 사람이 있지 않나요? 우리는 모두 하느님의 한 가족입니다. 성당에서 처음 보는 사람에게 먼저 인사를 건네 보세요.","하느님의 한 가족으로서 낯선 이를 따뜻하게 맞이하겠습니다."],
["히브 4,16","그러므로 확신을 가지고 은총의 어좌로 나아갑시다. 그리하여 자비를 얻고 은총을 받아 필요할 때에 도움을 받도록 합시다.","우리의 약함을 아시는 예수님 덕분에 우리는 두려움 없이 하느님께 나아갈 수 있습니다. 하느님의 어좌는 심판의 자리가 아니라 은총의 자리입니다.","죄책감 때문에 하느님 앞에 나서기를 망설이고 있나요? 하느님의 어좌는 은총의 어좌입니다. 확신을 가지고 지금 필요한 도움을 청해 보세요.","확신을 가지고 은총의 어좌 앞으로 나아가겠습니다."],
["시편 139,13-14","정녕 당신께서는 제 속을 만드시고 제 어머니 배 속에서 저를 엮으셨습니다. 제가 오묘하게 지어졌으니 당신을 찬송합니다.","하느님께서 나를 모태에서부터 정성껏 지으셨다는 경이로운 고백입니다. 나는 우연이 아니라 하느님의 섬세한 작품입니다.","자신의 외모나 성격이 마음에 들지 않을 때가 있습니다. 하지만 하느님은 나를 오묘하게 지으셨습니다. 오늘 거울을 보며 ‘나는 하느님의 작품’이라고 말해 보세요.","오묘하게 지어진 나를 감사히 받아들이겠습니다."],
["마태 5,3","행복하여라, 마음이 가난한 사람들! 하늘 나라가 그들의 것이다.","산상 설교의 첫 번째 행복 선언입니다. 마음이 가난한 사람은 자신의 부족함을 알고 하느님께 온전히 의지하는 사람입니다. 내일 모든 성인 대축일을 앞두고 성인들의 길을 묵상합니다.","모든 것을 스스로 할 수 있다고 믿는 사람에게는 하느님이 들어오실 자리가 없습니다. 내 안의 빈자리를 인정할 때 하느님이 채워 주십니다. 오늘 나의 부족함을 주님께 솔직히 고백해 보세요.","나의 가난함을 인정하고 주님께 온전히 의지하겠습니다."]
];

D[11]=[
["마태 5,12","기뻐하고 즐거워하여라. 너희가 하늘에서 받을 상이 크다.","오늘은 모든 성인 대축일입니다. 행복 선언의 마지막 말씀처럼 성인들은 이 땅에서 고난을 겪었지만 이제 하늘에서 큰 기쁨을 누리고 있습니다.","성인은 특별한 사람만이 아닙니다. 이름 없이 사랑하며 살다 간 수많은 이들이 성인입니다. 우리도 성인이 되라는 부르심을 받았습니다. 내 주보성인의 삶을 한번 찾아 읽어 보세요.","성인들과 함께 하늘의 기쁨을 바라보며 거룩하게 살겠습니다."],
["요한 6,40","내 아버지의 뜻은 또, 아들을 보고 그를 믿는 사람은 누구나 영원한 생명을 얻는 것이다. 나는 마지막 날에 그들을 다시 살릴 것이다.","오늘은 위령의 날입니다. 예수님은 당신을 믿는 이들을 마지막 날에 다시 살리시겠다고 약속하셨습니다. 11월 위령 성월, 먼저 떠난 이들을 기억하며 기도합니다.","사랑하는 이를 떠나보낸 아픔은 시간이 지나도 남습니다. 하지만 우리는 다시 만날 희망을 가지고 있습니다. 오늘 먼저 떠난 가족과 친구의 이름을 부르며 기도해 보세요.","먼저 떠난 이들을 기억하며 부활의 희망 안에서 기도하겠습니다."],
["2마카 12,45","그가 죽은 이들을 위하여 속죄를 한 것은 그들이 죄에서 벗어나게 하려는 것이었다.","유다 마카베오가 전사한 이들을 위해 속죄의 제물을 바친 이야기입니다. 교회는 이 말씀을 근거로 세상을 떠난 이들을 위해 기도하는 전통을 이어 왔습니다.","죽음으로 관계가 끝나는 것이 아닙니다. 우리의 기도는 먼저 떠난 이들에게 닿습니다. 위령 성월 동안 연미사를 봉헌하거나 묘소를 찾아 기도해 보세요.","세상을 떠난 이들을 위해 사랑을 담아 기도하겠습니다."],
["1코린 15,55","죽음아, 너의 승리는 어디 있느냐? 죽음아, 너의 독침은 어디 있느냐?","바오로 사도가 그리스도의 부활로 죽음이 패배했음을 선언하는 승리의 노래입니다.","죽음은 누구에게나 두려운 것입니다. 하지만 그리스도인에게 죽음은 끝이 아니라 새로운 생명으로 넘어가는 문입니다. 이 희망이 오늘의 삶을 더 담대하게 만들어 줍니다.","죽음을 이기신 주님 안에서 두려움 없이 오늘을 살겠습니다."],
["묵시 21,4","그분께서는 그들의 눈에서 모든 눈물을 닦아 주실 것이다. 다시는 죽음이 없고 다시는 슬픔도 울부짖음도 괴로움도 없을 것이다.","새 하늘과 새 땅의 환시입니다. 하느님께서 직접 우리의 눈물을 닦아 주시는 날이 온다는 약속입니다.","지금 흘리는 눈물이 영원하지 않습니다. 언젠가 하느님께서 직접 닦아 주실 것입니다. 오늘 슬퍼하는 누군가의 눈물을 닦아 주는 사람이 되어 보세요.","모든 눈물을 닦아 주실 그날을 희망하며 슬픈 이를 위로하겠습니다."],
["1테살 4,13-14","형제 여러분, 죽은 이들의 문제를 여러분도 알기를 바랍니다. 그리하여 희망을 가지지 못하는 다른 사람들처럼 슬퍼하지 않게 하려는 것입니다. 예수님께서 돌아가셨다가 다시 살아나셨음을 우리는 믿습니다.","바오로 사도는 그리스도인도 슬퍼하지만 희망 없는 슬픔이 아니라고 말합니다. 예수님의 부활이 그 희망의 근거입니다.","슬픔을 억누를 필요는 없습니다. 예수님도 우셨습니다. 다만 그 슬픔 아래에 희망이라는 단단한 바닥이 있습니다. 슬픔 속에서도 희망을 놓지 마세요.","희망을 품은 슬픔으로 먼저 떠난 이들을 그리워하겠습니다."],
["시편 90,12","저희의 날수를 셀 줄 알도록 가르치소서. 저희가 슬기로운 마음을 얻으리이다.","인생의 덧없음을 묵상하는 모세의 기도입니다. 삶이 유한하다는 것을 알 때 비로소 지혜롭게 살 수 있습니다.","언제까지나 시간이 있을 것처럼 중요한 일을 미루며 삽니다. 내 날이 정해져 있다는 것을 기억하면 오늘이 더 소중해집니다. 미뤄 둔 화해, 감사의 말을 오늘 전해 보세요.","남은 날을 헤아리며 오늘을 지혜롭게 살겠습니다."],
["2코린 4,18","우리는 보이는 것이 아니라 보이지 않는 것을 바라봅니다. 보이는 것은 잠시뿐이지만 보이지 않는 것은 영원합니다.","바오로 사도는 현재의 고난을 견디는 비결이 보이지 않는 영원한 것을 바라보는 데 있다고 말합니다.","우리는 눈에 보이는 성과, 외모, 재산에 마음을 쏟습니다. 하지만 그것들은 모두 지나갑니다. 사랑, 신의, 믿음처럼 보이지 않지만 영원한 것에 오늘 더 많은 마음을 쏟아 보세요.","잠시 보이는 것보다 영원한 것을 바라보며 살겠습니다."],
["시편 84,11","정녕 당신 앞뜰에서 지내는 하루가 다른 곳에서 지내는 천 날보다 낫습니다.","오늘은 라테라노 대성전 봉헌 축일입니다. 시인은 하느님의 집에서 보내는 하루가 다른 곳의 천 날보다 귀하다고 고백합니다.","주일 미사가 의무로만 느껴질 때가 있습니다. 하지만 하느님의 집에서 보내는 시간은 일주일을 살아갈 힘을 줍니다. 이번 주 미사에는 조금 일찍 가서 조용히 머물러 보세요.","주님의 집에 머무는 시간을 소중히 여기겠습니다."],
["필리 3,20","그러나 우리의 시민권은 하늘에 있습니다. 우리는 그곳에서 오시는 구원자 주 예수 그리스도를 고대합니다.","바오로 사도는 그리스도인의 진정한 고향이 하늘이라고 말합니다. 우리는 이 땅에서 순례자로 살아갑니다.","이 땅의 삶에만 집착하면 작은 손해에도 크게 흔들립니다. 하늘의 시민이라는 정체성을 기억하면 세상의 일들을 더 여유롭게 바라볼 수 있습니다.","하늘의 시민답게 이 땅에서 순례자로 살겠습니다."],
["요한 14,3","내가 가서 너희를 위하여 자리를 마련하면, 다시 와서 너희를 나에게 데려다가, 내가 있는 곳에 너희도 같이 있게 하겠다.","예수님은 우리를 위해 자리를 마련하러 가셨고, 다시 오셔서 함께 있게 하시겠다고 약속하셨습니다.","‘함께 있게 하겠다’는 말씀은 사랑하는 이와 영원히 함께하고 싶은 우리의 깊은 바람에 대한 응답입니다. 오늘 가족과 함께 있는 시간을 소중히 여겨 보세요.","나를 위해 자리를 마련하신 주님의 약속을 믿고 기다리겠습니다."],
["시편 39,5","주님, 제 끝을 알려 주소서. 제 날수가 얼마인지 알려 주소서. 제 인생이 얼마나 덧없는지 알고 싶습니다.","시인은 인생의 짧음을 깨닫고 하느님께 겸손히 기도합니다. 삶의 유한함을 인정하는 것은 절망이 아니라 지혜의 시작입니다.","영원히 살 것처럼 욕심내고 다투는 것이 우리 모습입니다. 인생이 짧다는 것을 기억하면 사소한 다툼은 내려놓고 정말 중요한 것에 집중하게 됩니다.","삶의 유한함을 기억하며 정말 중요한 것에 마음을 쓰겠습니다."],
["야고 4,14","여러분은 내일 일을 알지 못합니다. 여러분의 생명이 무엇입니까? 여러분은 잠깐 나타났다가 사라지는 안개일 따름입니다.","야고보 사도는 자기 계획만 믿고 내일을 장담하는 사람들에게 겸손을 가르칩니다. 그래서 ‘주님께서 원하시면’ 하고 말하라고 합니다.","계획을 세우는 것은 좋지만 모든 것이 내 뜻대로 될 거라는 생각은 교만입니다. 오늘 계획을 말할 때 ‘주님께서 허락하시면’이라는 마음을 담아 보세요.","‘주님께서 원하시면’ 하는 겸손한 마음으로 내일을 계획하겠습니다."],
["코헬 12,1","젊음의 날에 너의 창조주를 기억하여라. 불행의 날들이 닥치기 전에.","코헬렛은 늙어 힘이 없어지기 전에 하느님을 기억하라고 권합니다. 신앙은 나중으로 미룰 것이 아니라 지금 시작해야 할 일입니다.","‘나중에 여유 생기면 신앙생활 열심히 해야지’라고 생각하나요? 지금이 가장 젊은 날입니다. 오늘 하느님을 위한 시간을 조금이라도 마련해 보세요.","미루지 않고 오늘 창조주를 기억하며 살겠습니다."],
["루카 12,35","너희는 허리에 띠를 매고 등불을 켜 놓고 있어라.","혼인 잔치에서 돌아올 주인을 기다리는 종처럼 늘 깨어 준비하라는 말씀입니다. 허리에 띠를 매는 것은 언제든 일할 준비가 되어 있다는 뜻입니다.","언제 무슨 일이 일어날지 모르는 것이 인생입니다. 하느님 앞에 언제 서더라도 부끄럽지 않도록 오늘을 성실히 살아 보세요. 미뤄 둔 고해성사가 있다면 준비해 보세요.","허리에 띠를 매고 등불을 켜 놓은 채 깨어 살겠습니다."],
["마태 25,13","그러니 깨어 있어라. 너희가 그날과 그 시간을 모르기 때문이다.","슬기로운 처녀와 어리석은 처녀의 비유의 결론입니다. 등잔 기름을 미리 준비한 처녀들만 신랑을 맞이할 수 있었습니다.","등잔의 기름은 하루아침에 빌릴 수 없습니다. 기도, 선행, 사랑은 평소에 조금씩 채워야 합니다. 오늘 내 영혼의 등잔에 기름 한 방울을 더해 보세요.","평소에 영혼의 기름을 채우며 깨어 있겠습니다."],
["마태 25,21","잘하였다, 착하고 성실한 종아! 네가 작은 일에 성실하였으니 이제 내가 너에게 많은 일을 맡기겠다. 와서 네 주인의 기쁨을 함께 나누어라.","탈렌트의 비유에서 주인은 맡긴 것을 잘 활용한 종을 칭찬합니다. 하느님은 결과의 크기보다 성실함을 보십니다.","나에게 맡겨진 재능과 시간을 잘 쓰고 있나요? 남과 비교할 필요 없습니다. 하느님은 받은 만큼 성실하게 쓰기를 바라십니다. 삶의 끝에서 이 칭찬을 듣는 것을 상상해 보세요.","맡겨진 것을 성실히 써서 ‘잘하였다’는 칭찬을 듣겠습니다."],
["루카 21,19","너희는 인내로써 생명을 얻어라.","예수님은 마지막 때의 혼란과 박해를 예고하시며 끝까지 인내하는 이가 생명을 얻는다고 하십니다.","세상이 혼란스럽고 불안할 때 쉽게 포기하고 싶어집니다. 하지만 인내는 소극적으로 참는 것이 아니라 끝까지 희망을 붙드는 적극적인 힘입니다. 오늘 하루도 인내로 견뎌 보세요.","혼란 속에서도 인내하며 생명의 길을 걷겠습니다."],
["마르 13,31","하늘과 땅은 사라질지라도 내 말은 결코 사라지지 않을 것이다.","모든 것이 변하고 사라지는 세상에서 예수님의 말씀만은 영원하다는 선언입니다.","유행, 기술, 가치관이 빠르게 바뀌는 시대입니다. 변하지 않는 기준이 필요합니다. 예수님의 말씀은 시대가 바뀌어도 흔들리지 않는 반석입니다. 오늘 그 말씀 위에 삶을 세워 보세요.","사라지지 않는 주님의 말씀 위에 삶을 세우겠습니다."],
["이사 40,8","풀은 시들고 꽃은 지지만 우리 하느님의 말씀은 영원히 서 있으리라.","인간의 영광은 풀과 꽃처럼 시들지만 하느님의 말씀은 영원하다는 예언입니다.","가을이 깊어 가며 꽃이 지고 잎이 떨어집니다. 자연의 변화를 보며 영원한 것이 무엇인지 생각해 보세요. 지는 꽃을 아쉬워하기보다 영원한 말씀을 붙잡아 보세요.","시드는 것들 속에서 영원한 말씀을 붙잡겠습니다."],
["마태 12,50","누구든지 하늘에 계신 내 아버지의 뜻을 실행하는 사람이 내 형제요 누이요 어머니다.","오늘은 성모 마리아의 자헌 기념일입니다. 성모님은 혈연 때문만이 아니라 하느님의 뜻을 온전히 따르셨기에 예수님의 참된 어머니이십니다.","하느님의 뜻을 행하는 사람은 누구나 예수님의 가족이 됩니다. 성모님처럼 나를 하느님께 봉헌하는 마음으로 오늘 하느님의 뜻을 실천해 보세요.","성모님처럼 하느님의 뜻을 행하며 주님의 가족이 되겠습니다."],
["시편 150,6","숨 쉬는 것 모두 주님을 찬양하여라. 할렐루야!","시편의 마지막 구절입니다. 오늘은 음악가들의 수호성인 성녀 체칠리아 기념일입니다. 모든 생명은 그 자체로 하느님을 찬양하는 노래입니다.","숨 쉬는 것 자체가 하느님의 선물입니다. 오늘 좋아하는 성가를 들으며 하느님을 찬미해 보세요. 깊게 숨을 들이쉬며 생명을 주신 주님께 감사해 보세요.","숨 쉬는 동안 주님을 찬양하겠습니다."],
["요한 18,37","나는 진리를 증언하려고 태어났으며 진리를 증언하려고 세상에 왔다. 진리에 속한 사람은 누구나 내 목소리를 듣는다.","빌라도 앞에서 예수님께서 당신이 어떤 임금인지 밝히신 말씀입니다. 그리스도 왕 대축일 무렵, 예수님의 나라는 힘이 아니라 진리의 나라임을 묵상합니다.","거짓과 가짜 뉴스가 넘치는 시대에 진리를 따르는 것은 용기가 필요합니다. 진리이신 왕을 섬기는 사람은 작은 일에서도 진실을 선택합니다.","진리이신 왕의 목소리를 듣고 진실하게 살겠습니다."],
["콜로 1,16-17","만물이 그분을 통하여 그분을 향하여 창조되었습니다. 그분께서는 만물에 앞서 계시고 만물은 그분 안에서 존속합니다.","오늘은 성 안드레아 둥락 사제와 동료 순교자(베트남 순교 성인) 기념일입니다. 그리스도는 모든 피조물의 중심이시며 만물을 붙들고 계신 왕이십니다.","내 삶의 중심에는 무엇이 있나요? 일, 돈, 사람이 중심이 되면 그것이 흔들릴 때 나도 무너집니다. 그리스도를 삶의 중심에 모실 때 흔들리지 않습니다.","만물의 중심이신 그리스도를 내 삶의 중심에 모시겠습니다."],
["루카 21,3-4","내가 참으로 너희에게 말한다. 저 가난한 과부가 다른 모든 사람보다 더 많이 넣었다. 저들은 모두 풍족한 데에서 얼마씩 예물로 넣었지만, 저 과부는 궁핍한 가운데에서 가지고 있던 생활비를 다 넣었기 때문이다.","부자들의 큰 헌금보다 가난한 과부의 동전 두 닢을 더 귀하게 보신 예수님의 말씀입니다. 하느님은 액수가 아니라 마음을 보십니다.","나눔의 크기는 액수가 아니라 마음의 크기로 정해집니다. 내게 남는 것을 주는 것과 내게 필요한 것을 나누는 것은 다릅니다. 오늘 아까워하지 않고 나눌 수 있는 것을 찾아보세요.","액수보다 마음을 다해 기꺼이 나누겠습니다."],
["시편 116,12","주님께서 나에게 베푸신 그 모든 은혜를 무엇으로 주님께 갚으리오?","죽음의 위기에서 구원받은 시인이 감사하며 부른 노래입니다. 받은 은혜가 너무 커서 무엇으로 갚아야 할지 모르겠다고 고백합니다.","한 해를 마무리하는 무렵, 올해 받은 은혜를 떠올려 보세요. 하느님께 갚는 길은 그 은혜를 이웃에게 흘려보내는 것입니다. 감사 목록을 적어 보는 것도 좋습니다.","받은 은혜를 헤아리며 감사로 갚겠습니다."],
["시편 103,2","내 영혼아, 주님을 찬미하여라. 그분의 모든 은혜를 잊지 마라.","시인은 스스로에게 하느님의 은혜를 잊지 말라고 다짐합니다. 감사는 기억에서 시작됩니다.","좋은 일은 쉽게 잊고 나쁜 일은 오래 기억하는 것이 사람의 마음입니다. 오늘 잠들기 전 하느님께서 주신 은혜 세 가지를 떠올리며 감사 기도를 바쳐 보세요.","주님의 은혜를 잊지 않고 날마다 찬미하겠습니다."],
["시편 90,17","주 우리 하느님의 어지심이 우리 위에 있기를! 저희 손이 하는 일을 저희를 위해 튼튼하게 하소서. 저희 손이 하는 일을 튼튼하게 하소서.","모세의 기도는 인생의 덧없음을 노래한 뒤, 우리가 하는 일에 하느님의 축복이 머물기를 청하며 끝납니다.","한 해 동안 열심히 일한 손을 바라보세요. 그 수고가 헛되지 않도록 하느님께 봉헌하세요. 하느님께서 우리 손의 일을 튼튼하게 하실 것입니다.","내 손이 하는 일을 주님께 봉헌하며 축복을 청하겠습니다."],
["로마 13,11-12","여러분은 지금이 어떤 때인지 알고 있습니다. 이제 잠에서 깨어날 시간이 되었습니다. 밤이 물러가고 낮이 가까이 왔습니다.","대림 시기를 시작하며 자주 읽는 말씀입니다. 아우구스티노 성인은 이 구절을 읽고 회심했습니다. 이제 영적인 잠에서 깨어날 때입니다.","습관처럼 반복되는 일상 속에서 영적으로 잠들어 있지는 않나요? 대림 시기는 깨어나 주님을 맞을 준비를 하는 때입니다. 올해 대림 시기에 실천할 한 가지를 정해 보세요.","영적인 잠에서 깨어나 오시는 주님을 맞을 준비를 하겠습니다."],
["요한 1,41","그는 먼저 자기 형 시몬을 만나 ‘우리는 메시아를 만났소.’ 하고 말하였다.","오늘은 성 안드레아 사도 축일입니다. 예수님을 만난 안드레아가 가장 먼저 한 일은 형 베드로에게 그 기쁜 소식을 전하는 것이었습니다.","좋은 것을 발견하면 가장 사랑하는 사람에게 먼저 알리고 싶습니다. 신앙의 기쁨도 그렇습니다. 오늘 가족이나 친구에게 내가 받은 신앙의 기쁨을 나눠 보세요.","안드레아처럼 주님을 만난 기쁨을 사랑하는 이에게 전하겠습니다."]
];

D[12]=[
["이사 9,1","어둠 속을 걷던 백성이 큰 빛을 봅니다. 암흑의 땅에 사는 이들에게 빛이 비칩니다.","대림 시기에 읽는 메시아 예언입니다. 전쟁과 절망의 어둠 속에 있던 백성에게 큰 빛이 오리라는 약속입니다. 그 빛은 예수 그리스도이십니다.","한 해의 마지막 달, 지친 마음에 어둠이 드리울 수 있습니다. 하지만 대림 시기는 빛을 기다리는 희망의 시간입니다. 대림환의 촛불처럼 내 안에 작은 희망의 빛을 밝혀 보세요.","어둠 속에서도 오시는 큰 빛을 기다리며 희망을 밝히겠습니다."],
["이사 40,3","광야에 주님의 길을 닦아라. 사막에 우리 하느님의 길을 곧게 내어라.","세례자 요한이 자신의 사명으로 인용한 예언입니다. 주님이 오시는 길을 준비하라는 외침입니다.","주님이 내 마음에 오시려면 길을 닦아야 합니다. 굽은 길은 바로잡고, 울퉁불퉁한 곳은 평평하게. 내 마음에서 주님의 길을 가로막는 미움이나 욕심이 있다면 치워 보세요.","내 마음에 주님이 오실 길을 곧게 닦겠습니다."],
["이사 9,5","우리에게 한 아기가 태어났고 우리에게 한 아들이 주어졌습니다. 왕권이 그의 어깨에 놓이고 그의 이름은 놀라운 경륜가, 용맹한 하느님, 영원한 아버지, 평화의 군왕이라 불리리이다.","오늘은 동양 선교의 수호성인 성 프란치스코 하비에르 기념일입니다. 이사야는 오실 메시아를 네 가지 이름으로 소개합니다.","네 이름 중 지금 나에게 가장 필요한 분은 누구신가요? 길을 모를 때는 ‘놀라운 경륜가’, 약할 때는 ‘용맹한 하느님’, 외로울 때는 ‘영원한 아버지’, 불안할 때는 ‘평화의 군왕’을 불러 보세요.","나에게 꼭 필요한 이름으로 오시는 주님을 기다리겠습니다."],
["시편 130,5-6","나 주님께 바라네. 내 영혼이 주님께 바라며 그분 말씀에 희망을 두네. 내 영혼이 주님을 기다리네, 파수꾼이 아침을 기다리기보다 파수꾼이 아침을 기다리기보다.","밤새 성벽을 지키는 파수꾼이 아침을 간절히 기다리듯, 시인은 하느님을 기다립니다. 반복되는 표현에 그 간절함이 담겨 있습니다.","대림은 기다림의 시기입니다. 기다림은 지루하지만 그만큼 만남을 귀하게 만듭니다. 오늘 내가 간절히 기다리는 것을 떠올리며 그 기다림을 하느님께 봉헌해 보세요.","파수꾼이 아침을 기다리듯 간절히 주님을 기다리겠습니다."],
["이사 35,4","마음이 불안한 이들에게 말하여라. ‘굳세어져라, 두려워하지 마라. 보라, 너희의 하느님을!’","광야가 꽃피고 눈먼 이가 보게 될 구원의 날을 노래하는 예언입니다. 하느님은 불안한 이들에게 힘을 내라고 격려하십니다.","불안한 마음에 ‘보라, 너희의 하느님을!’이라는 말씀을 들려주세요. 문제가 아니라 하느님을 바라볼 때 두려움이 줄어듭니다. 불안해하는 친구에게도 이 말씀을 전해 보세요.","불안할 때 문제가 아닌 하느님을 바라보겠습니다."],
["이사 11,1","이사이의 그루터기에서 햇순이 돋아나고 그의 뿌리에서 새싹이 움트리라.","잘려 나간 나무 그루터기처럼 무너진 다윗 왕조에서 새로운 왕이 나오리라는 예언입니다. 오늘은 성 니콜라오 주교 기념일입니다.","모든 것이 끝난 것 같은 그루터기에서도 새싹은 돋아납니다. 실패와 상실의 자리에서도 하느님은 새 생명을 시작하십니다. 성 니콜라오처럼 남몰래 선물을 나누는 기쁨도 누려 보세요.","그루터기에서도 새싹을 틔우시는 주님을 믿겠습니다."],
["야고 5,7-8","형제 여러분, 주님의 재림 때까지 참고 기다리십시오. 농부는 땅의 귀한 소출을 기다리며, 이른 비와 늦은 비를 맞을 때까지 그것을 두고 참고 기다립니다. 여러분도 참고 기다리며 마음을 굳게 하십시오.","야고보 사도는 농부의 인내를 예로 들어 주님 오심을 기다리는 자세를 가르칩니다.","씨를 뿌린 농부는 매일 땅을 파 보지 않습니다. 비를 기다리며 묵묵히 참습니다. 내가 기다리는 일도 그렇게 맡기고 기다려 보세요. 열매는 반드시 맺힙니다.","농부처럼 참고 기다리며 마음을 굳게 하겠습니다."],
["루카 1,30","두려워하지 마라, 마리아야. 너는 하느님의 총애를 받았다.","오늘은 한국 교회의 수호자이신 원죄 없이 잉태되신 복되신 동정 마리아 대축일입니다. 하느님은 마리아를 처음부터 은총으로 감싸 주셨습니다.","하느님의 총애는 성모님만의 것이 아닙니다. 우리도 하느님께 사랑받는 존재입니다. 두려움이 몰려올 때 ‘두려워하지 마라, 너는 하느님의 총애를 받았다’는 말씀에 내 이름을 넣어 보세요.","하느님의 총애를 받은 사람으로서 두려움 없이 살겠습니다."],
["즈카 9,9","딸 시온아, 한껏 기뻐하여라. 딸 예루살렘아, 환성을 올려라. 보라, 너의 임금님이 너에게 오신다. 그분은 의로우시며 승리하시는 분이시다. 그분은 겸손하시어 나귀를 타고 오신다.","오실 메시아가 군마가 아닌 나귀를 타고 오는 겸손한 임금이라는 예언입니다. 예수님은 실제로 나귀를 타고 예루살렘에 입성하셨습니다.","하느님은 화려함이 아니라 겸손함으로 오십니다. 성탄을 앞두고 화려한 준비보다 겸손한 마음을 준비해 보세요. 낮은 곳에서 주님을 만날 수 있습니다.","겸손하게 오시는 임금님을 겸손한 마음으로 맞이하겠습니다."],
["스바 3,17","주 너의 하느님, 승리의 용사가 네 한가운데에 계신다. 그분께서 너를 두고 기뻐하며 즐거워하신다. 당신 사랑으로 너를 새롭게 해 주시고 너 때문에 환성을 올리며 기뻐하시리라.","하느님께서 당신 백성 때문에 노래하며 기뻐하신다는 놀라운 말씀입니다. 우리가 하느님을 기뻐하기 전에 하느님께서 먼저 우리를 기뻐하십니다.","하느님이 나 때문에 기뻐하며 노래하신다는 것을 상상해 보셨나요? 나는 하느님께 짐이 아니라 기쁨입니다. 오늘 이 사실을 마음 깊이 받아들여 보세요.","나를 기뻐하시는 주님의 사랑 안에서 새로워지겠습니다."],
["필리 4,4-5","주님 안에서 항상 기뻐하십시오. 거듭 말합니다. 기뻐하십시오. 여러분의 너그러운 마음을 모든 사람이 알 수 있게 하십시오. 주님께서 가까이 오셨습니다.","대림 제3주일, ‘기뻐하라’는 뜻의 ‘가우데테 주일’에 읽는 말씀입니다. 주님께서 가까이 오셨기에 우리는 기뻐할 수 있습니다.","연말의 분주함 속에서 기쁨을 잃기 쉽습니다. 그리스도인의 기쁨은 주님이 가까이 계심을 아는 데서 옵니다. 오늘 너그러운 마음으로 사람들을 대하며 그 기쁨을 나눠 보세요.","가까이 오신 주님 안에서 항상 기뻐하고 너그러워지겠습니다."],
["루카 1,48","그분께서 당신 종의 비천함을 굽어보셨기 때문입니다. 이제부터 모든 세대가 나를 행복하다 하리니","오늘은 과달루페의 복되신 동정 마리아 기념일입니다. 성모님은 가난한 원주민 후안 디에고에게 나타나셨습니다. 하느님은 언제나 낮은 이들을 굽어보십니다.","하느님은 세상이 주목하지 않는 작은 이들을 먼저 보십니다. 내가 보잘것없다고 느낄 때 하느님은 바로 그런 나를 굽어보고 계십니다.","비천한 이를 굽어보시는 주님께 감사하며 겸손히 살겠습니다."],
["마태 5,15","등불은 켜서 함지 속이 아니라 등경 위에 놓는다. 그렇게 하여 집 안에 있는 모든 사람을 비춘다.","오늘은 이름이 ‘빛’을 뜻하는 성녀 루치아 기념일입니다. 등불은 숨기려고 켜는 것이 아니라 비추려고 켜는 것입니다.","내가 받은 재능과 신앙을 숨기고 있지는 않나요? 겸손은 빛을 숨기는 것이 아니라 그 빛이 하느님께로부터 왔음을 아는 것입니다. 오늘 내 빛으로 주변을 밝혀 보세요.","받은 빛을 숨기지 않고 주변을 밝히겠습니다."],
["이사 45,3","어둠 속의 보화와 감추어진 보물을 너에게 주리라. 그리하여 내가 주님임을, 너를 지명하여 부르는 이가 이스라엘의 하느님임을 네가 알게 하리라.","오늘은 ‘영혼의 어두운 밤’을 노래한 십자가의 성 요한 기념일입니다. 하느님은 어둠 속에서도 보화를 숨겨 두신다고 약속하십니다.","가장 어두운 시기에 가장 깊은 신앙을 얻은 사람들이 있습니다. 지금 어둠 속에 있다면 그곳에 숨겨진 보화를 찾아보세요. 하느님은 내 이름을 부르며 함께 계십니다.","어둠 속에 숨겨진 주님의 보화를 찾겠습니다."],
["루카 3,10-11","군중이 요한에게 ‘그러면 저희가 어떻게 해야 합니까?’ 하고 물었다. 요한이 그들에게 대답하였다. ‘옷을 두 벌 가진 사람은 한 벌을 못 가진 이에게 나누어 주어라. 먹을 것을 가진 사람도 그렇게 하여라.’","회개하라는 세례자 요한의 외침에 사람들이 구체적인 방법을 묻자, 그는 나눔이라는 실천적인 답을 주었습니다.","회개는 마음의 변화이지만 구체적인 행동으로 드러나야 합니다. 옷장에 입지 않는 옷이 있다면 정리해서 나눠 보세요. 성탄을 준비하는 가장 좋은 방법입니다.","남는 것을 나누는 구체적인 실천으로 회개를 보여 주겠습니다."],
["이사 55,6","너희는 주님을 만날 수 있을 때에 찾아라. 가까이 계실 때에 불러라.","하느님께서 가까이 계시는 지금이 바로 그분을 찾을 때라는 초대입니다. 은총의 때를 놓치지 말라는 권고입니다.","‘나중에’라고 미루는 사이 기회는 지나갑니다. 성탄을 앞둔 이 시기가 하느님을 찾기에 좋은 때입니다. 판공성사를 아직 보지 않았다면 이번 주에 준비해 보세요.","주님이 가까이 계신 지금, 미루지 않고 그분을 찾겠습니다."],
["마태 1,23","보아라, 동정녀가 잉태하여 아들을 낳으리니 그 이름을 임마누엘이라 하리라. 이는 ‘하느님께서 우리와 함께 계시다.’라는 뜻이다.","마태오 복음사가는 이사야의 예언이 예수님의 탄생으로 이루어졌다고 전합니다. ‘임마누엘’은 성탄의 핵심 메시지입니다.","성탄의 가장 큰 선물은 하느님께서 우리와 함께 계시다는 사실입니다. 외롭고 힘들 때 ‘임마누엘’을 기억하세요. 하느님은 멀리 계신 분이 아니라 우리 곁에 오신 분입니다.","우리와 함께 계시는 임마누엘 하느님을 기억하겠습니다."],
["마태 1,20","다윗의 자손 요셉아, 두려워하지 말고 마리아를 아내로 맞아들여라. 그 몸에 잉태된 아기는 성령으로 말미암은 것이다.","약혼녀 마리아의 임신 사실을 알고 고민하던 요셉에게 천사가 꿈에 나타나 한 말입니다. 요셉은 이해할 수 없는 상황을 믿음으로 받아들였습니다.","이해되지 않는 상황 앞에서 요셉은 자기 판단 대신 하느님의 뜻을 따랐습니다. 지금 이해되지 않는 일이 있다면 요셉처럼 하느님을 신뢰하며 받아들여 보세요.","요셉처럼 이해되지 않아도 하느님의 뜻을 받아들이겠습니다."],
["루카 1,13","두려워하지 마라, 즈카르야야. 너의 청원이 받아들여졌다. 너의 아내 엘리사벳이 너에게 아들을 낳아 줄 터이니, 그 이름을 요한이라 하여라.","평생 자식을 위해 기도했지만 이미 늙어 버린 즈카르야에게 천사가 전한 소식입니다. 오래된 기도도 하느님은 잊지 않으셨습니다.","너무 오래되어 잊어버린 기도가 있나요? 하느님은 그 기도를 기억하고 계십니다. 포기했던 기도를 다시 꺼내 하느님께 맡겨 보세요.","오래된 기도도 기억하시는 주님을 믿으며 다시 기도하겠습니다."],
["루카 1,78-79","우리 하느님의 자비로운 마음으로 높은 곳에서 떠오르는 태양이 우리를 찾아오시어 어둠과 죽음의 그늘에 앉아 있는 이들을 비추시고 우리 발을 평화의 길로 이끌어 주실 것이다.","세례자 요한이 태어난 뒤 즈카르야가 부른 ‘즈카르야의 노래’ 마지막 부분입니다. 교회는 매일 아침기도에서 이 노래를 바칩니다.","동지를 앞두고 밤이 가장 깁니다. 하지만 이제부터 해는 점점 길어집니다. 어둠 속에 있는 이들에게 떠오르는 태양이신 주님이 찾아오십니다. 오늘 아침 해를 바라보며 이 노래를 묵상해 보세요.","떠오르는 태양이신 주님을 따라 평화의 길을 걷겠습니다."],
["아가 2,11-12","자, 이제 겨울은 지나고 장마는 걷혔답니다. 땅에는 꽃이 모습을 드러내고 노래의 계절이 다가왔답니다.","사랑하는 이가 연인을 부르는 아름다운 노래입니다. 혹독한 겨울이 지나고 봄이 오듯, 하느님은 우리를 새로운 계절로 부르십니다.","동지, 가장 긴 밤입니다. 하지만 이 밤이 지나면 낮이 길어지기 시작합니다. 마음의 겨울을 지나고 있다면 봄은 반드시 온다는 희망을 품어 보세요.","가장 긴 밤 뒤에 오는 봄을 희망하며 기다리겠습니다."],
["1사무 2,1","제 마음이 주님 안에서 기뻐 뛰고 제 이마가 주님 안에서 높이 들립니다.","아들 사무엘을 얻은 한나가 부른 감사의 노래입니다. 이 노래는 천 년 뒤 성모 마리아의 ‘마니피캇’으로 이어집니다.","성탄을 며칠 앞두고 기쁨을 준비합니다. 한나처럼 오랜 기다림 끝에 받은 은혜가 있다면 그것을 떠올리며 마음껏 기뻐해 보세요. 기쁨도 신앙의 표현입니다.","주님 안에서 기뻐 뛰는 마음으로 성탄을 준비하겠습니다."],
["미카 5,1","그러나 너 에프라타의 베들레헴아, 너는 유다 부족들 가운데에서 보잘것없지만 나를 위하여 이스라엘을 다스릴 이가 너에게서 나오리라.","작은 마을 베들레헴에서 메시아가 태어나리라는 예언입니다. 하느님은 크고 화려한 곳이 아니라 작고 보잘것없는 곳을 택하십니다.","나 자신이나 내 처지가 보잘것없다고 느끼나요? 하느님은 바로 그런 곳에서 위대한 일을 시작하십니다. 내 작은 삶도 하느님께는 소중한 베들레헴입니다.","보잘것없는 나를 통해서도 일하시는 주님을 신뢰하겠습니다."],
["루카 2,7","마리아는 첫아들을 낳아 포대기에 싸서 구유에 뉘었다. 여관에는 그들이 들어갈 자리가 없었기 때문이다.","성탄 전야, 하느님의 아들은 머물 곳이 없어 마구간 구유에 누우셨습니다. 하느님은 가장 낮은 곳으로 오셨습니다.","오늘날에도 ‘자리가 없는’ 사람들이 있습니다. 집 없는 이, 외로운 이, 환영받지 못하는 이들입니다. 성탄 전야, 내 마음에 주님과 그분이 사랑하시는 이들을 위한 자리를 마련해 보세요.","내 마음에 아기 예수님을 모실 자리를 마련하겠습니다."],
["루카 2,10-11","두려워하지 마라. 보라, 나는 온 백성에게 큰 기쁨이 될 소식을 너희에게 전한다. 오늘 다윗 고을에서 너희에게 구원자가 태어나셨으니, 주 그리스도이시다.","주님 성탄 대축일입니다. 천사는 들에서 양을 치던 가난한 목자들에게 가장 먼저 구세주 탄생의 기쁜 소식을 전했습니다.","성탄의 기쁨은 선물이나 파티가 아니라 ‘구원자가 나를 위해 태어나셨다’는 사실에 있습니다. 오늘 가족과 함께 아기 예수님께 감사하고, 외로운 이웃에게도 성탄의 기쁨을 나눠 주세요.","나를 위해 오신 구원자를 기쁘게 맞이하며 그 기쁨을 나누겠습니다."],
["사도 7,60","주님, 이 죄를 저들에게 돌리지 마십시오.","오늘은 교회의 첫 순교자 성 스테파노 축일입니다. 돌에 맞아 죽어 가면서도 그는 예수님처럼 자신을 죽이는 이들을 위해 용서를 청했습니다.","성탄 다음 날 순교자를 기억하는 것은 아기 예수님을 따르는 길이 사랑과 용서의 길임을 알려 줍니다. 한 해가 가기 전에 용서하지 못한 사람을 위해 스테파노처럼 기도해 보세요.","한 해가 가기 전, 용서하지 못한 이를 위해 기도하겠습니다."],
["요한 1,14","말씀이 사람이 되시어 우리 가운데 사셨다. 우리는 그분의 영광을 보았다.","오늘은 성 요한 사도 복음사가 축일입니다. 요한은 성탄의 신비를 이 한 문장으로 표현했습니다. 하느님이 사람이 되시어 우리 곁에 ‘천막을 치셨다’는 뜻입니다.","하느님은 멀리서 바라보는 분이 아니라 우리 삶 한가운데로 들어오신 분입니다. 오늘 내 일상의 평범한 순간들 속에서 함께 계신 하느님을 발견해 보세요.","내 일상 한가운데 계신 주님을 알아보겠습니다."],
["루카 2,14","지극히 높은 곳에서는 하느님께 영광, 땅에서는 그분 마음에 드는 사람들에게 평화!","예수님 탄생의 밤에 천사들이 부른 노래입니다. 이 노래는 미사의 ‘대영광송’이 되었습니다. 오늘은 죄 없이 죽임을 당한 무죄한 어린이들 축일입니다.","하느님께 영광을 드리는 것과 땅의 평화는 하나로 이어져 있습니다. 오늘 폭력과 전쟁으로 고통받는 세상의 어린이들을 위해 기도하며 평화를 청해 보세요.","하느님께 영광을 드리며 고통받는 어린이들의 평화를 위해 기도하겠습니다."],
["루카 2,52","예수님은 지혜와 키가 자랐고 하느님과 사람들의 총애도 더하여 갔다.","나자렛에서 부모님과 함께 지내신 예수님의 숨은 생활을 요약한 구절입니다. 성탄 팔일 축제 중 성가정 축일 무렵에 묵상합니다.","예수님도 가정 안에서 자라셨습니다. 지혜와 키, 하느님과 사람들의 사랑이 균형 있게 자라는 것이 건강한 성장입니다. 올 한 해 우리 가정이 어떻게 자랐는지 함께 이야기해 보세요.","우리 가정이 성가정처럼 사랑 안에서 함께 자라도록 노력하겠습니다."],
["시편 90,4","정녕 천 년도 당신 눈에는 지나간 어제 같고 한 토막 밤과도 같습니다.","하느님의 시간과 인간의 시간이 얼마나 다른지 노래하는 시편입니다. 영원하신 하느님 앞에서 우리 인생은 짧은 한순간입니다.","한 해가 저물어 갑니다. 지나간 시간은 되돌릴 수 없지만, 영원하신 하느님의 손안에 있습니다. 올해의 아쉬움과 감사를 모두 하느님께 맡겨 보세요.","지나간 한 해를 영원하신 주님의 손에 맡기겠습니다."],
["시편 65,12","당신께서 한 해를 복으로 꾸미시니 당신 발길 닿는 곳마다 기름이 넘쳐흐릅니다.","한 해의 수확을 하느님의 축복으로 감사하는 시편입니다. 하느님께서 지나가신 자리마다 풍요가 넘친다고 노래합니다.","한 해의 마지막 날입니다. 돌아보면 힘든 일도 있었지만 하느님의 발길이 닿은 순간들이 분명히 있었습니다. 올해 받은 축복을 하나하나 떠올리며 감사 기도를 바치고, 새해를 하느님께 봉헌해 보세요.","올 한 해를 복으로 꾸며 주신 주님께 감사하며 새해를 맡기겠습니다."]
];


</script>
<script>
(function(){
"use strict";
/* ---------- 성경 약어 → 전체 이름 (한국천주교주교회의 『성경』 기준) ---------- */
const BOOK={"창세":"창세기","탈출":"탈출기","레위":"레위기","민수":"민수기","신명":"신명기","여호":"여호수아기","룻":"룻기",
"1사무":"사무엘기 상권","2마카":"마카베오기 하권","욥":"욥기","시편":"시편","잠언":"잠언","코헬":"코헬렛","아가":"아가",
"지혜":"지혜서","집회":"집회서","이사":"이사야서","예레":"예레미야서","애가":"애가","에제":"에제키엘서","다니":"다니엘서",
"호세":"호세아서","요엘":"요엘서","아모":"아모스서","미카":"미카서","하바":"하바쿡서","스바":"스바니야서","즈카":"즈카르야서",
"마태":"마태오 복음서","마르":"마르코 복음서","루카":"루카 복음서","요한":"요한 복음서","사도":"사도행전",
"로마":"로마 신자들에게 보낸 서간","1코린":"코린토 신자들에게 보낸 첫째 서간","2코린":"코린토 신자들에게 보낸 둘째 서간",
"갈라":"갈라티아 신자들에게 보낸 서간","에페":"에페소 신자들에게 보낸 서간","필리":"필리피 신자들에게 보낸 서간",
"콜로":"콜로새 신자들에게 보낸 서간","1테살":"테살로니카 신자들에게 보낸 첫째 서간","1티모":"티모테오에게 보낸 첫째 서간",
"2티모":"티모테오에게 보낸 둘째 서간","히브":"히브리인들에게 보낸 서간","야고":"야고보 서간","1베드":"베드로의 첫째 서간",
"1요한":"요한의 첫째 서간","묵시":"요한 묵시록"};
const WD=["일","월","화","수","목","금","토"];
const $=s=>document.querySelector(s);
const view=$("#view");

/* ---------- storage (선택적, 실패해도 동작) ---------- */
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

/* ---------- 날짜 유틸 ---------- */
const pad=n=>String(n).padStart(2,"0");
const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const fromIso=s=>{const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const today=()=>{const n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate())};
const addDays=(d,n)=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);
const entryFor=d=>{const e=(D[d.getMonth()+1]||[])[d.getDate()-1];return e?{ref:e[0],verse:e[1],exp:e[2],life:e[3],vow:e[4]}:null};
function fullRef(r){const m=r.match(/^(\S+) (\d+),(.+)$/);if(!m)return r;
  const name=BOOK[m[1]]||m[1];return name+" "+m[2]+"장 "+m[3].replace("-","~")+"절"}
const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

function renderHeader(){const t=today();
  $("#today-date").innerHTML=t.getFullYear()+"년 "+(t.getMonth()+1)+"월 "+t.getDate()+"일<small>"+WD[t.getDay()]+"요일</small>";}

/* ---------- 말씀 카드 ---------- */
function card(d){
  const e=entryFor(d), key=iso(d), saved=store.get("saved",[]).includes(key);
  if(!e) return '<div class="empty">이 날짜의 말씀을 찾을 수 없습니다.</div>';
  return `<article class="card fade">
    <div class="verse-box">
      <div class="eyebrow">오늘의 말씀</div>
      <svg class="cross" viewBox="0 0 18 24" fill="currentColor"><rect x="7.5" y="0" width="3" height="24" rx="1"/><rect x="2" y="6" width="14" height="3" rx="1"/></svg>
      <p class="verse">${esc(e.verse)}</p>
      <div class="ref">${esc(fullRef(e.ref))}<span>(${esc(e.ref)} · 한국천주교주교회의 『성경』)</span></div>
    </div>
    <section class="sec"><h3><i>①</i>말씀 풀이</h3><p>${esc(e.exp)}</p></section>
    <section class="sec"><h3><i>②</i>오늘의 삶에서</h3><p>${esc(e.life)}</p></section>
    <div class="vow"><div class="lbl">✝ 오늘의 다짐</div><p>${esc(e.vow)}</p></div>
    <div class="actions">
      <button class="btn ${saved?"on":""}" data-act="save" data-key="${key}">${saved?"♥ 간직함":"♡ 간직하기"}</button>
      <button class="btn" data-act="copy" data-key="${key}">⧉ 말씀 복사</button>
    </div>
  </article>`;
}
function dayNav(d){const t=today();const isT=iso(d)===iso(t);
  return `<div class="daynav">
    <button data-go="${iso(addDays(d,-1))}">‹ 전날</button>
    <span class="mid">${d.getMonth()+1}월 ${d.getDate()}일 (${WD[d.getDay()]})</span>
    <button data-go="${iso(addDays(d,1))}" ${isT?"disabled":""}>다음날 ›</button></div>`;}

function viewToday(){view.innerHTML=card(today())+dayNav(today())+note();}
function viewDay(key){const d=fromIso(key),t=today();
  if(isNaN(d)||d>t||!entryFor(d)){location.hash="today";return}
  if(iso(d)===iso(t)){viewToday();return}
  view.innerHTML=`<button class="back" data-tab="past">‹ 지난 말씀 목록</button>
    <div class="pastlabel">${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일 ${WD[d.getDay()]}요일의 말씀</div>`
    +card(d)+dayNav(d)+note();
  window.scrollTo(0,0);}
const note=()=>`<p class="note">성경 본문은 한국천주교주교회의 『성경』(2005)을 바탕으로 하며, 긴 대목은 일부를 발췌했습니다. 출처의 장·절을 성경에서 직접 찾아 앞뒤 문맥과 함께 읽어 보시길 권합니다.</p>`;

/* ---------- 지난 말씀 ---------- */
let pastShown=45;
function itemRow(d){const e=entryFor(d);if(!e)return"";
  return `<button class="item" data-go="${iso(d)}">
    <div class="d ${d.getDay()===0?"sun":""}"><b>${d.getDate()}</b><small>${WD[d.getDay()]}요일</small></div>
    <div class="t"><div class="r">${esc(fullRef(e.ref))}</div><div class="v">${esc(e.verse)}</div></div></button>`;}
function viewPast(){const t=today();let html="",cur="",open=false;
  for(let i=1;i<=pastShown&&i<=365;i++){const d=addDays(t,-i);
    const m=d.getFullYear()+"년 "+(d.getMonth()+1)+"월";
    if(m!==cur){if(open)html+="</div>";html+=`<div class="month">${m}</div><div class="list">`;cur=m;open=true}
    html+=itemRow(d);}
  if(open)html+="</div>";
  const min=iso(addDays(t,-365)),max=iso(addDays(t,-1));
  view.innerHTML=`<div class="fade"><h2 class="page-h">지난 말씀</h2>
    <p class="page-d">지나온 날들의 말씀을 다시 묵상해 보세요. 날짜마다 서로 다른 구절이 준비되어 있습니다.</p>
    <form class="picker" id="pick"><label for="pd">날짜로 찾기</label>
      <input type="date" id="pd" min="${min}" max="${max}" value="${max}"><button type="submit">보기</button></form>
    ${html}${pastShown<365?'<button class="more" data-act="more">이전 말씀 더 보기</button>':""}</div>`;
  $("#pick").addEventListener("submit",ev=>{ev.preventDefault();const v=$("#pd").value;if(v)location.hash="d-"+v;});
}

/* ---------- 간직한 말씀 ---------- */
function viewSaved(){const list=store.get("saved",[]).filter(k=>fromIso(k)<=today()).sort().reverse();
  if(!list.length){view.innerHTML=`<div class="fade"><h2 class="page-h">간직한 말씀</h2>
    <div class="empty"><div class="big">♡</div>마음에 와닿은 말씀에서 ‘간직하기’를 누르면<br>이곳에 모아 둘 수 있어요.</div></div>`;return}
  view.innerHTML=`<div class="fade"><h2 class="page-h">간직한 말씀</h2>
    <p class="page-d">마음에 새긴 말씀 ${list.length}개</p><div class="list">`
    +list.map(k=>{const d=fromIso(k);return itemRow(d).replace('<b>',`<small>${d.getMonth()+1}월</small><b>`)}).join("")+`</div></div>`;}

/* ---------- 라우팅 ---------- */
function route(){const h=(location.hash||"").replace("#","")||"today";
  const tab=h.startsWith("d-")?"past":(["today","past","saved"].includes(h)?h:"today");
  document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("on",b.dataset.tab===tab));
  if(h.startsWith("d-"))viewDay(h.slice(2));
  else if(h==="past")viewPast();
  else if(h==="saved")viewSaved();
  else viewToday();
  if(!h.startsWith("d-"))window.scrollTo(0,0);}
window.addEventListener("hashchange",route);

/* ---------- 이벤트 ---------- */
function toast(msg){const t=$("#toast");t.textContent=msg;t.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove("show"),1800);}
document.addEventListener("click",async ev=>{
  const el=ev.target.closest("[data-tab],[data-go],[data-act]");if(!el)return;
  if(el.dataset.tab){location.hash=el.dataset.tab;if(el.dataset.tab==="past")pastShown=Math.max(pastShown,45);return}
  if(el.dataset.go){if(el.disabled)return;const k=el.dataset.go;location.hash=(k===iso(today()))?"today":"d-"+k;return}
  const act=el.dataset.act;
  if(act==="more"){pastShown=Math.min(365,pastShown+60);viewPast();return}
  if(act==="save"){const k=el.dataset.key;let s=store.get("saved",[]);
    if(s.includes(k)){s=s.filter(x=>x!==k);el.classList.remove("on");el.textContent="♡ 간직하기";toast("간직한 말씀에서 뺐어요")}
    else{s.push(k);el.classList.add("on");el.textContent="♥ 간직함";toast("간직한 말씀에 담았어요")}
    store.set("saved",s);return}
  if(act==="copy"){const e=entryFor(fromIso(el.dataset.key));
    const txt=`“${e.verse}”\n— ${fullRef(e.ref)} (${e.ref})\n\n✝ 오늘의 다짐: ${e.vow}`;
    try{await navigator.clipboard.writeText(txt);toast("말씀을 복사했어요")}
    catch(_){const ta=document.createElement("textarea");ta.value=txt;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();
      let ok=false;try{ok=document.execCommand("copy")}catch(e){}ta.remove();toast(ok?"말씀을 복사했어요":"복사할 수 없는 환경이에요");}
  }
});

/* ---------- 날씨 (Open-Meteo, 키 불필요) ---------- */
const CITIES=[["서울",37.5665,126.978],["인천",37.4563,126.7052],["수원",37.2636,127.0286],["춘천",37.8813,127.7298],
["강릉",37.7519,128.8761],["대전",36.3504,127.3845],["청주",36.6424,127.489],["전주",35.8242,127.148],["광주",35.1595,126.8526],
["대구",35.8714,128.6014],["부산",35.1796,129.0756],["울산",35.5384,129.3114],["창원",35.2279,128.6811],["포항",36.019,129.3435],["제주",33.4996,126.5312]];
function wInfo(c){if(c===0)return["☀️","맑음"];if(c<=2)return["🌤️","구름 조금"];if(c===3)return["☁️","흐림"];if(c<=48)return["🌫️","안개"];
  if(c<=57)return["🌦️","이슬비"];if(c<=67)return["🌧️","비"];if(c<=77)return["🌨️","눈"];if(c<=82)return["🌧️","소나기"];if(c<=86)return["🌨️","눈"];return["⛈️","뇌우"];}
function showWeather(o){const w=$("#weather");
  if(!o){w.innerHTML='<span class="wi">⛅</span><span class="wp">날씨 정보 없음</span>';w.title="이 환경에서는 날씨를 불러올 수 없어요";return}
  const [ic,lab]=wInfo(o.code);
  w.innerHTML=`<span class="wi">${ic}</span><span><span class="wt">${Math.round(o.temp)}°</span> <span class="wp">${lab} · ${esc(o.place)}</span></span>`;
  w.title=o.place+" "+lab;}
async function fetchWeather(lat,lon,place){
  const url=`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weather_code&timezone=auto`;
  const ctl=new AbortController();const to=setTimeout(()=>ctl.abort(),7000);
  try{const r=await fetch(url,{signal:ctl.signal});clearTimeout(to);if(!r.ok)throw 0;const j=await r.json();
    const o={temp:j.current.temperature_2m,code:j.current.weather_code,place,at:Date.now()};store.set("wx",o);return o;}
  catch(e){clearTimeout(to);return null}}
function getPos(){return new Promise(res=>{if(!navigator.geolocation)return res(null);
  try{navigator.geolocation.getCurrentPosition(p=>res(p.coords),()=>res(null),{timeout:6000,maximumAge:1800000})}catch(e){res(null)}});}
async function loadWeather(force){
  const cached=store.get("wx",null);if(!force&&cached&&Date.now()-cached.at<30*60000){showWeather(cached);return}
  const pref=store.get("city",null);let o=null;
  if(!pref||pref==="here"){const c=await getPos();if(c)o=await fetchWeather(c.latitude.toFixed(3),c.longitude.toFixed(3),"현재 위치");}
  if(!o){const city=CITIES.find(x=>x[0]===pref)||CITIES[0];o=await fetchWeather(city[1],city[2],city[0]);}
  showWeather(o);}
function openSheet(){const pref=store.get("city","here");
  $("#cities").innerHTML=[["here"]].concat(CITIES).map(c=>`<button data-city="${c[0]}" class="${pref===c[0]?"on":""}">${c[0]==="here"?"📍 현재 위치":c[0]}</button>`).join("");
  $("#sheet").classList.add("open");}
$("#weather").addEventListener("click",openSheet);
$("#sheet").addEventListener("click",ev=>{const b=ev.target.closest("[data-city]");
  if(b){store.set("city",b.dataset.city);$("#sheet").classList.remove("open");$("#weather").innerHTML='<span class="wi">…</span><span class="wp">불러오는 중</span>';loadWeather(true);return}
  if(ev.target.id==="sheet")$("#sheet").classList.remove("open");});

/* ---------- 자정이 지나면 자동으로 새 말씀 ---------- */
let shown=iso(today());
function checkDay(){const n=iso(today());if(n!==shown){shown=n;renderHeader();const h=(location.hash||"#today");if(h==="#today"||h==="")viewToday();else route();}}
setInterval(checkDay,30000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden){checkDay();loadWeather(false)}});

/* 앱을 켜면 언제나 오늘의 말씀부터 */
if((location.hash||"").startsWith("#d-"))location.hash="today";
renderHeader();route();loadWeather(false);
})();
</script>
</body>
</html>
